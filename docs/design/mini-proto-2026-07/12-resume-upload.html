<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 简历上传</title>
<link rel="stylesheet" href="shared.css">
<style>
  .up-big{border:1.5px dashed var(--teal); border-radius:var(--r-md); background:var(--teal-wash); padding:26px 18px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;}
  .up-big .u-ic{width:56px; height:56px; border-radius:16px; background:#fff; display:grid; place-items:center; font-size:28px;}
  .up-big h4{font-family:var(--serif); font-size:16px;}
  .up-big p{font-size:12px; color:var(--muted);}
  .src3{display:flex; gap:10px;}
  .src3 .s{flex:1; padding:14px 6px; border:1px solid var(--line); border-radius:14px; background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:var(--shadow-card);}
  .src3 .s .i{font-size:24px;} .src3 .s span{font-size:12px; font-weight:600;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">简历诊断</span></div>

  <div class="content has-actionbar">
    <div class="up-big">
      <div class="u-ic">📄</div>
      <h4>上传你的简历</h4>
      <p>支持 PDF / Word / 图片 · 单个 ≤ 10MB</p>
    </div>

    <div class="src3">
      <div class="s"><span class="i">📁</span><span>本地文件</span></div>
      <div class="s"><span class="i">💬</span><span>聊天文件</span></div>
      <div class="s"><span class="i">📷</span><span>拍照上传</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>已选文件</h3><span class="chip ok">就绪</span></div>
      <div class="row-item" style="padding-top:2px;">
        <div class="ic a-clay" style="background:var(--clay-soft);color:var(--clay);">📄</div>
        <div class="rc"><h4>张青柠_简历_v2.pdf</h4><p>2 页 · 文字版 PDF</p></div>
        <span class="r-arrow">✕</span>
      </div>
    </div>

    <div class="notice"><span class="n-ic">💡</span><div>扫描版 / 图片简历将<b>先做文字识别</b>（受控 ≤ 3 页）；识别置信度低时会提示你复核。识别失败不会继续调用 AI。</div></div>
    <div class="compliance-note">简历文件通过临时链接传输、加密处理，诊断后按策略清理，不长期保存。</div>
  </div>

  <div class="actionbar">
    <button class="btn primary block lg" onclick="location.href='13-resume-diagnosis.html'">开始 AI 诊断</button>
  </div>
</div>
</body>
</html>
