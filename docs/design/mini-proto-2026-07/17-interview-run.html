<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 面试进行</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage{background:linear-gradient(180deg,#10302b 0%,#183f38 100%);}
  .iv-nav{color:#fff;}
  .iv-progress{display:flex; align-items:center; gap:9px; padding:2px 18px 6px; color:rgba(255,255,255,.8); font-size:12px;}
  .iv-progress .meter{flex:1; background:rgba(255,255,255,.15);}
  .iv-body{flex:1; overflow-y:auto; padding:8px 18px; display:flex; flex-direction:column; gap:14px;}
  .interviewer{display:flex; gap:11px; align-items:flex-start;}
  .interviewer .av{width:42px; height:42px; border-radius:50%; background:var(--teal); display:grid; place-items:center; font-size:20px; flex:none;}
  .q-bubble{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); border-radius:16px; border-top-left-radius:5px; padding:13px 15px; color:#fff; font-size:14.5px; line-height:1.6;}
  .my-answer{background:rgba(31,158,134,.25); border:1px solid rgba(42,168,145,.4); border-radius:14px; padding:12px 14px; color:#eafaf5; font-size:13.5px; line-height:1.6; align-self:flex-end; max-width:85%;}
  .iv-foot{flex:none; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:12px;}
  .mic-btn{width:76px; height:76px; border-radius:50%; background:var(--teal); border:5px solid rgba(255,255,255,.2); display:grid; place-items:center; font-size:32px; color:#fff;}
  .iv-foot .hint{color:rgba(255,255,255,.7); font-size:12px;}
  .iv-foot .switch{color:rgba(255,255,255,.85); font-size:12.5px; text-decoration:underline;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar" style="color:#fff;"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar iv-nav"><span class="nav-back" style="color:#fff;" onclick="history.back()">‹</span><span class="nav-title" style="color:#fff;">模拟面试 · 新媒体运营</span></div>
  <div class="iv-progress"><span>第 2 / 5 题</span><div class="meter"><i style="width:40%;background:var(--teal);"></i></div></div>

  <div class="iv-body">
    <div class="interviewer">
      <div class="av">🤖</div>
      <div class="q-bubble">请举一个你独立负责某个项目的例子，说说你当时遇到的最大挑战，以及你是怎么解决的？</div>
    </div>
    <div class="my-answer">我在校期间独立运营学院公众号，最大的挑战是初期粉丝增长很慢……（录音转写中）</div>
    <div class="interviewer">
      <div class="av">🤖</div>
      <div class="q-bubble" style="background:rgba(255,255,255,.06);"><span style="opacity:.7;">正在听你回答，说完点一下停止…</span></div>
    </div>
  </div>

  <div class="iv-foot">
    <span class="hint">🎙️ 正在录音 · 00:24</span>
    <div class="mic-btn">■</div>
    <span class="switch" onclick="location.href='23-me-ai-records.html'">切换文字作答 / 结束面试</span>
  </div>
</div>
</body>
</html>
