<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 扫码登录一体机</title>
<link rel="stylesheet" href="shared.css">
<style>
  .confirm-hero{display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 0 4px;}
  .device-card{width:100%; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); padding:16px; display:flex; align-items:center; gap:13px;}
  .device-card .d-ic{width:52px; height:52px; border-radius:14px; background:var(--teal-soft); color:var(--teal-deep); display:grid; place-items:center; font-size:26px; flex:none;}
  .device-card h4{font-family:var(--serif); font-size:16px;}
  .device-card p{font-size:12px; color:var(--muted); margin-top:3px;}
  .big-ic{width:82px; height:82px; border-radius:50%; background:var(--teal-soft); display:grid; place-items:center; font-size:40px;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">确认登录</span></div>

  <div class="content has-actionbar">
    <div class="confirm-hero">
      <div class="big-ic">🖥️</div>
      <h3 class="serif" style="font-size:20px;">登录一体机</h3>
      <p class="fs13 muted center" style="max-width:250px;">你正在授权登录下面这台一体机，登录后可在大屏上使用你的简历与文档。</p>
    </div>

    <div class="device-card">
      <div class="d-ic">📍</div>
      <div>
        <h4>幸福路社区服务站 03 号机</h4>
        <p>设备编号 KIOSK-0326 · 请核对与你眼前的一致</p>
      </div>
    </div>

    <div class="card">
      <div class="between fs13"><span class="muted">登录账号</span><span>138****6021</span></div>
      <div class="between fs13"><span class="muted">二维码有效期</span><span style="color:var(--clay);">04:52 后失效</span></div>
    </div>

    <div class="notice warn"><span class="n-ic">⚠️</span><div>如非本人在一体机前操作，<b>请勿确认登录</b>。二维码到期后自动失效。手机号在系统中加密存储，页面展示时脱敏。</div></div>
  </div>

  <div class="actionbar">
    <button class="btn ghost" onclick="location.href='03-home.html'">取消</button>
    <button class="btn primary block lg" onclick="location.href='03-home.html'">确认登录</button>
  </div>
</div>
</body>
</html>
