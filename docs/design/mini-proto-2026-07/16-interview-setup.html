<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 面试设置</title>
<link rel="stylesheet" href="shared.css">
<style>
  .pick-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:9px;}
  .pick{padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); font-size:13.5px; font-weight:600; text-align:center;}
  .pick.on{border-color:var(--teal); background:var(--teal-wash); color:var(--teal-deep);}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">模拟面试</span></div>

  <div class="content has-actionbar">
    <div class="notice"><span class="n-ic">🎤</span><div>AI 面试官将根据你的设置提问，你可<b>语音或文字作答</b>，结束后给出表现反馈。</div></div>

    <div class="card">
      <div class="card-head"><h3>目标岗位</h3></div>
      <div class="field"><div class="inp between"><span>新媒体运营</span><span class="muted">›</span></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>面试类型</h3></div>
      <div class="pick-grid">
        <div class="pick on">综合面试</div>
        <div class="pick">专业能力</div>
        <div class="pick">行为面试</div>
        <div class="pick">压力面试</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>难度 / 轮数</h3></div>
      <div class="between" style="padding:4px 0;"><span class="fs13 muted">难度</span>
        <div class="seg" style="width:200px;"><div class="s">简单</div><div class="s on">适中</div><div class="s">挑战</div></div>
      </div>
      <div class="between" style="padding:4px 0;"><span class="fs13 muted">题目数</span>
        <div class="stepper"><button>−</button><span class="v">5</span><button>＋</button></div>
      </div>
    </div>

    <div class="compliance-note">面试内容由 AI 生成，仅用于练习，不代表真实企业面试。</div>
  </div>

  <div class="actionbar">
    <button class="btn primary block lg" onclick="location.href='17-interview-run.html'">开始模拟面试</button>
  </div>
</div>
</body>
</html>
