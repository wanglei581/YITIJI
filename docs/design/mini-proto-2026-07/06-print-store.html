<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 选门店</title>
<link rel="stylesheet" href="shared.css">
<style>
  .store-opt{display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface);}
  .store-opt.on{border-color:var(--teal); background:var(--teal-wash);}
  .store-opt .s-ic{width:42px; height:42px; border-radius:12px; background:var(--teal-soft); color:var(--teal-deep); display:grid; place-items:center; font-size:20px; flex:none;}
  .store-opt .sc{flex:1;}
  .store-opt .sc h4{font-size:14.5px; font-weight:700;}
  .store-opt .sc p{font-size:12px; color:var(--muted); margin-top:2px;}
  .store-opt .o-radio{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex:none;}
  .store-opt.on .o-radio{border-color:var(--teal); background:radial-gradient(circle at center,var(--teal) 0 5px,#fff 5px);}
  .price-line{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">选择取件门店</span></div>

  <div class="content has-actionbar">
    <div class="steps" style="padding:2px;">
      <div class="st done"><span class="n">✓</span>选文件</div><div class="line"></div>
      <div class="st on"><span class="n">2</span>选门店</div><div class="line"></div>
      <div class="st"><span class="n">3</span>付款</div><div class="line"></div>
      <div class="st"><span class="n">4</span>取件</div>
    </div>

    <div class="filter-bar">
      <div class="f-chip on">离我最近</div>
      <div class="f-chip">支持彩色</div>
      <div class="f-chip">空闲优先</div>
      <div class="f-chip">24 小时</div>
    </div>

    <div class="wrap">
      <div class="store-opt on">
        <div class="s-ic">📍</div>
        <div class="sc"><h4>幸福路社区服务站 <span class="chip ok">空闲</span></h4><p>0.4km · 彩色¥0.6/页 黑白¥0.3/页 · 在线</p></div>
        <div class="o-radio"></div>
      </div>
      <div class="store-opt">
        <div class="s-ic">📍</div>
        <div class="sc"><h4>市人才市场 1F 大厅 <span class="chip warn">排队 2</span></h4><p>1.2km · 彩色¥0.5/页 黑白¥0.2/页 · 在线</p></div>
        <div class="o-radio"></div>
      </div>
      <div class="store-opt">
        <div class="s-ic">📍</div>
        <div class="sc"><h4>青年路大学生服务中心 <span class="chip">离线</span></h4><p>2.1km · 设备维护中 · 暂不可选</p></div>
        <div class="o-radio"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>费用明细</h3></div>
      <div class="price-line"><span class="muted">彩色 · 2 页 × 2 份</span><span>¥2.40</span></div>
      <div class="price-line"><span class="muted">服务费</span><span>¥0.00</span></div>
      <div class="divider"></div>
      <div class="price-line"><span style="font-weight:700;">合计</span><span class="price" style="font-size:17px;">¥2.40</span></div>
    </div>

    <div class="notice warn"><span class="n-ic">ℹ️</span><div>下单付款后生成取件码，<b>到店核销才开始打印</b>。请就近选择方便取件的门店。</div></div>
  </div>

  <div class="actionbar">
    <div class="ab-price"><b>¥2.40</b><span>幸福路服务站</span></div>
    <button class="btn primary block" onclick="location.href='07-print-pay.html'">去付款</button>
  </div>
</div>
</body>
</html>
