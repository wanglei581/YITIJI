<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 登录绑手机</title>
<link rel="stylesheet" href="shared.css">
<style>
  .login-top{padding:20px 20px 0; display:flex; flex-direction:column; align-items:center; gap:12px;}
  .login-top .avatar{background:var(--teal); color:#fff; width:72px; height:72px; font-size:28px;}
  .wx-name{font-family:var(--serif); font-size:19px; font-weight:700;}
  .wx-name .badge{margin-left:6px; vertical-align:middle;}
  .step-hint{font-size:12.5px; color:var(--muted);}
  .mock-num{letter-spacing:1px;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-title">完善账号</span></div>

  <div class="login-top">
    <div class="avatar">青</div>
    <div class="wx-name">微信用户_8f3a <span class="badge">已授权</span></div>
    <div class="step-hint">第 2 步 / 共 2 步 · 绑定手机号后即可使用</div>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-head"><h3>绑定手机号</h3><span class="chip ok">加密存储</span></div>
      <div class="field">
        <label>手机号</label>
        <div class="inp between"><span class="mock-num muted">请点击下方按钮授权获取</span><span style="font-size:18px;">📱</span></div>
      </div>
      <button class="btn btn-wx block lg"><span style="font-size:17px;">✔</span> 使用微信绑定的手机号</button>
      <div class="notice">
        <span class="n-ic">🔒</span>
        <div>手机号仅用于<b>订单进度与取件通知</b>，在系统中<b>加密存储</b>、页面展示时脱敏（如 138****6021）。我们不会用于营销骚扰。</div>
      </div>
    </div>

    <div class="card wash">
      <div class="row" style="gap:10px;">
        <span style="font-size:22px;">🎁</span>
        <div>
          <h4 class="serif" style="font-size:15px;">新用户礼包</h4>
          <p class="fs12 muted">完成绑定，领取 3 次 AI 简历诊断 + 首单打印立减</p>
        </div>
      </div>
    </div>

    <div class="compliance-note mt8">
      本小程序为求职材料工具，提供 AI 简历与文件打印服务，<b>不提供岗位投递、不收取简历、不做企业招聘</b>。
    </div>
  </div>

  <div class="actionbar">
    <button class="btn primary block lg" onclick="location.href='03-home.html'">完成，进入首页</button>
  </div>
</div>
</body>
</html>
