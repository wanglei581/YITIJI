<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 简历生成</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">简历生成</span>
    <span class="nav-caps"><span class="cap-dot" style="background:var(--plum);"></span>AI 生成</span>
  </div>

  <div class="content has-actionbar">
    <div class="steps" style="padding:2px;">
      <div class="st on"><span class="n">1</span>基本信息</div><div class="line"></div>
      <div class="st"><span class="n">2</span>经历</div><div class="line"></div>
      <div class="st"><span class="n">3</span>生成</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>目标岗位</h3></div>
      <div class="field"><label>意向岗位</label><div class="inp">新媒体运营</div></div>
      <div class="field"><label>期望城市</label><div class="inp">杭州</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>教育背景</h3></div>
      <div class="field"><label>学校 / 专业</label><div class="inp">浙江传媒学院 · 网络与新媒体</div></div>
      <div class="field"><label>学历 / 时间</label><div class="inp">本科 · 2021.09 - 2025.06</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>经历补充</h3><span class="chip">口语化也没关系</span></div>
      <div class="field"><label>用一句话说说你做过什么</label>
        <div class="inp ta"><span class="ph">例：在校运营过学院公众号，做过几次活动策划，实习时管过社群…</span></div>
      </div>
    </div>

    <div class="notice"><span class="n-ic">💡</span><div>随便写，AI 会帮你整理成规范的简历表达；生成后可继续编辑。</div></div>
    <div class="compliance-note">简历内容由 AI 生成，请核对真实性后使用。</div>
  </div>

  <div class="actionbar">
    <button class="btn primary block lg" onclick="location.href='15-resume-optimize.html'">✦ 生成简历初稿</button>
  </div>
</div>
</body>
</html>
