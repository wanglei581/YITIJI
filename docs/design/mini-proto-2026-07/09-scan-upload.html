<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 扫码续传</title>
<link rel="stylesheet" href="shared.css">
<style>
  .bind-banner{background:linear-gradient(135deg,var(--teal),var(--teal-deep)); color:#fff; border-radius:var(--r-md); padding:15px; display:flex; align-items:center; gap:12px;}
  .bind-banner .bb-ic{width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:22px; flex:none;}
  .bind-banner h4{font-family:var(--serif); font-size:15px;}
  .bind-banner p{font-size:12px; color:rgba(255,255,255,.85); margin-top:2px;}
  .file-pick{display:flex; gap:10px;}
  .file-pick .fp{flex:1; padding:16px 8px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:var(--shadow-card);}
  .file-pick .fp .i{font-size:26px;}
  .file-pick .fp span{font-size:12px; font-weight:600;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">传文件到一体机</span></div>

  <div class="content has-actionbar">
    <div class="bind-banner">
      <div class="bb-ic">🖥️</div>
      <div>
        <h4>已连接 · 幸福路服务站 03 号机</h4>
        <p>扫码成功，文件将直接发送到这台机器</p>
      </div>
    </div>

    <div class="section-t">选择要传输的文件</div>
    <div class="file-pick">
      <div class="fp"><span class="i">📁</span><span>本地文件</span></div>
      <div class="fp"><span class="i">💬</span><span>聊天文件</span></div>
      <div class="fp"><span class="i">☁️</span><span>我的文档</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>待传输</h3><span class="chip ok">1 个文件</span></div>
      <div class="row-item" style="padding-top:2px;">
        <div class="ic a-clay" style="background:var(--clay-soft);color:var(--clay);">📄</div>
        <div class="rc"><h4>张青柠_求职简历.pdf</h4><p>2 页 · 268 KB</p></div>
        <span class="r-arrow">✕</span>
      </div>
      <div class="progress"><i style="width:100%;"></i></div>
      <p class="fs12 muted center">已上传 100% · 请在一体机屏幕上继续设置并打印</p>
    </div>

    <div class="notice"><span class="n-ic">🔒</span><div>本页使用<b>一次性上传令牌</b>，不会登录或读取你的账号。文件仅用于本次打印，通过临时链接传输，到期自动清理。</div></div>
    <div class="compliance-note">如需在手机上下单付款到店取件，请返回使用「手机上传 · 到店取件」。</div>
  </div>

  <div class="actionbar">
    <button class="btn primary block lg" onclick="location.href='03-home.html'">已传完，去一体机操作</button>
  </div>
</div>
</body>
</html>
