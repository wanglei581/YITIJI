<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 诊断报告</title>
<link rel="stylesheet" href="shared.css">
<style>
  .score-hero{display:flex; align-items:center; gap:18px; padding:6px 4px;}
  .score-ring{width:96px; height:96px; border-radius:50%; flex:none; display:grid; place-items:center; background:conic-gradient(var(--teal) 0 82%,var(--line-soft) 82% 100%); position:relative;}
  .score-ring::after{content:''; position:absolute; inset:9px; border-radius:50%; background:var(--surface);}
  .score-ring b{position:relative; z-index:1; font-family:var(--serif); font-size:32px; font-weight:800; color:var(--teal-deep);}
  .score-hero .sh-t h3{font-family:var(--serif); font-size:18px;}
  .score-hero .sh-t p{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5;}
  .dim{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .dim .dl{width:66px; font-size:12.5px; font-weight:600; flex:none;}
  .dim .dv{width:34px; text-align:right; font-size:12.5px; font-weight:700; flex:none;}
  .sug-item{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft);}
  .sug-item:last-child{border-bottom:none;}
  .sug-item .tag{flex:none;}
  .sug-item .st{font-size:13px; line-height:1.55;}
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● 5G ▮▮▮</span></div>
  <div class="navbar"><span class="nav-back" onclick="history.back()">‹</span><span class="nav-title">诊断报告</span>
    <span class="nav-caps"><span class="cap-dot" style="background:var(--plum);"></span>AI 生成</span>
  </div>

  <div class="content has-actionbar">
    <div class="card">
      <div class="score-hero">
        <div class="score-ring"><b>82</b></div>
        <div class="sh-t">
          <h3>整体良好，可再优化</h3>
          <p>结构清晰，量化成果偏少。建议补充数据化描述，突出与目标岗位匹配度。</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>维度评分</h3></div>
      <div class="dim"><span class="dl">完整度</span><div class="meter"><i style="width:90%;background:var(--teal);"></i></div><span class="dv">90</span></div>
      <div class="dim"><span class="dl">匹配度</span><div class="meter"><i style="width:74%;background:var(--wheat);"></i></div><span class="dv">74</span></div>
      <div class="dim"><span class="dl">量化成果</span><div class="meter"><i style="width:60%;background:var(--clay);"></i></div><span class="dv">60</span></div>
      <div class="dim"><span class="dl">排版</span><div class="meter"><i style="width:88%;background:var(--teal);"></i></div><span class="dv">88</span></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>修改建议</h3><span class="badge warn">5 条</span></div>
      <div class="sug-item"><span class="chip err tag">高</span><div class="st">「负责运营工作」过于笼统，建议改为「独立运营 3 个社群，半年拉新 2000+」。</div></div>
      <div class="sug-item"><span class="chip warn tag">中</span><div class="st">项目经历缺少结果数据，补充转化率 / 增长等量化指标。</div></div>
      <div class="sug-item"><span class="chip warn tag">中</span><div class="st">技能栏与目标岗位关键词匹配度偏低，建议对齐 JD 术语。</div></div>
      <div class="sug-item"><span class="chip ok tag">低</span><div class="st">自我评价可精简为 2 行，突出核心竞争力。</div></div>
    </div>

    <div class="compliance-note">以上为 AI 生成建议，仅供参考，请结合实际情况自行判断。</div>
  </div>

  <div class="actionbar">
    <button class="btn ghost" onclick="location.href='21-me-documents.html'">保存报告</button>
    <button class="btn primary block" onclick="location.href='15-resume-optimize.html'">一键优化</button>
  </div>
</div>
</body>
</html>
