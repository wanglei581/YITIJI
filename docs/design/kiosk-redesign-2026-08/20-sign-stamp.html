<title>签名盖章 · 职易达</title>
<!--
  S23 · 签名 / 印章图片叠加 PDF 工作台（青序流光，1080x1920 单 HTML 宿主，零外部资源）

  route: /print-scan/sign（旧深链 /print/scan-sign 重定向到此，不新增页面）

  这一页只做一件事：把**本次会话里新传的**签名 / 印章图片，按「页码 + 九宫格 + 大小档」
  叠到一份**原 PDF** 上，生成一份**独立的派生 PDF**，然后交给 13-print-desk.html
  `/print/material-check` 做材料检查。**本页不显示金额、权益、支付、打印成功、保存成功或设备成功。**

  三份文件必须始终分开说：
    原 PDF   —— 本人「我的文档」/ 本机上传 / 既有手机入口；**永不被改写**
    签名图   —— purpose=signature_image，highly_sensitive，system_short（约 1 小时）；
                **不进「我的文档」，不能从历史复用，只能是本次会话新传的**
    派生 PDF —— 每次合成都是**新文件**；再叠一处时它成为下一轮的「原文档」

  查询契约（仅本原型使用）：
    ?state=<下方 62 态之一>      —— 夹具态一律要求 capture=1 或 debug=1
    ?capture=1 / ?debug=1        —— 夹具可达门；常显「固定原型数据，不是真实用户文件」
    ?flat=1                      —— 截图去动效
    ?from=hub|home|docs          —— 真实来源决定返回落点；**未知 / 外部值一律安全回落
                                    /print-scan，且原值绝不进入 DOM**
  普通产品地址（裸 URL）一律落 auth-unknown：看不到文件名、页数、签名图、请求标识或任何结果。

  真实合同（来源：代码，不是想象）：
    端点   POST /print/sign/inspect（@Throttle 60s/10 次）→ { pages }
           POST /print/sign/compose（@Throttle 60s/3 次；会员维度 print-sign:rate 60s/3 次）
           两者都先 assertUserTaskAllowed(terminalId,'signature_stamp')
    原 PDF  mimeType=application/pdf 且 purpose ∈ {print_doc,resume_upload,resume_scan,cover_letter}
           （匿名路径只允许 print_doc）；≤ 15MB；PDFDocument.load 不传 ignoreEncryption →
           加密 / 损坏均 SIGN_DOC_UNSUPPORTED；AcroForm 含 PDFSignature → SIGN_DOC_HAS_DIGITAL_SIGNATURE；
           页数 1–30，越界 SIGN_DOC_TOO_MANY_PAGES；归属 / 过期不符 → SIGN_SOURCE_NOT_FOUND
    签名图  purpose=signature_image 且 mimeType ∈ {image/jpeg,image/png}；≤ 10MB；
           内容嗅探不符 SIGN_STAMP_UNSUPPORTED；width*height ≤ 25,000,000 否则 SIGN_STAMP_TOO_LARGE；
           embedPng/embedJpg 抛错（CMYK JPEG 等）→ SIGN_STAMP_UNSUPPORTED
    位置    placement={page(1-based) , position(九宫格) , size(small|medium|large)}
           print-sign-geometry.ts：SIZE_FACTOR small .15 / medium .25 / large .35（占视觉页宽），
           MARGIN_RATIO .04；/Rotate 90/180/270 先在视觉空间定位再逆映射。
           page < 1 或 > pageCount → SIGN_PLACEMENT_INVALID
    输出    { fileId, printFileUrl(30 分钟), fileMd5, sizeBytes, pages }；**没有百分比、没有阶段、
           没有任务编号、没有查询接口**；≤ 15MB 否则 SIGN_OUTPUT_TOO_LARGE；
           assetCategory=derived，sourceFileId=原 PDF，原 PDF 不被改写
    幂等    Idempotency-Key 必须匹配 /^[A-Za-z0-9_-]{16,80}$/；锁 120s、完成结果 600s；
           fingerprint = sha256(docFileId|stampFileId|page|position|size)。
           同 key + 同 fingerprint → 复用已完成结果（并重验归属 + 输出存活）；
           同 key + 不同 fingerprint → IDEMPOTENCY_KEY_REUSED；
           in_progress → SIGN_IN_PROGRESS；输出已失效 → 服务端用同 key 重新生成

  runtime gap（本页按**产品裁决**呈现，与当前 React/API 不一致，必须照实说，不得冒充已修）：
    RG-1 会员门禁：产品裁决要求登录后才允许上传签名图与合成；当前 controller 用
         resolveOptionalEndUser，endUserId 可为 null，**匿名仍可 inspect / compose**。
         本页做前端 fail-closed，不代表服务端已收口。
    RG-2 幂等键时机：SignStampPage.tsx 在 handleCompose 内 sign-<Date.now()>-<random> 每次点击新建，
         结果未知时无法用同 key 恢复。本页按合同表现「首次提交前生成并绑定」，属静态合同不属现状。
    RG-3 授权复位：React 只在换签名图 / 换文档时 setAuthorized(false)；addAnother() 不清 error。
         本页统一复位并写明。
    RG-4 出口：React goPrint() 直接 navigate('/print/confirm')，跳过材料检查。本页主出口改为
         /print/material-check，属静态合同差异。
    RG-5 审计写失败：doCompose 先 files.upload 再 audit.write；审计抛错会让请求失败，
         但派生文件**已经存在**。因此重试不能保证零重复产物。
    RG-6 13-print-desk.html 的 ?from= 白名单只有 upload|hub|home|docs（没有签章来源），
         其 DOCS 夹具表也没有派生 PDF 条目。本页**不修改那个文件**，因此出口按 12-file-source.html
         的既有口径走裸 href；接收页按它自己的 fail-closed 规则落 missing-context。

  手机入口冻结面（本页对基线唯一不能动的地方，改一个字都算漂移）：
    基线文件（20-sign-stamp.html，SHA-256 970bcbca0f2d61ce6c077bb5079d885f4157cb0d44d34081a3a5da9b14243e82）
    里的两张「手机扫码上传」卡片按下列**逐字面**冻结，shoot.mjs 从基线源码解析后逐项比对，任一项
    不等即 failed：
      PDF   n='手机扫码上传 PDF'；ic='phone'；bg='var(--slate-soft)'；fg='#35608f'；
            d='手机扫屏幕上的码，把 PDF 传进这台机器。'；f='PDF · ≤ 15MB'；
            href='20-sign-stamp.html?state=pick-stamp'；tid='sign-stamp-pick-doc-phone'
      签章图 n='手机扫码上传图片'；ic='phone'；bg='var(--slate-soft)'；fg='#35608f'；
            d='手机拍签名或选印章图片，确认后自动进入下一步。'；f='JPG / PNG · ≤ 10MB'；
            href='20-sign-stamp.html?state=placing'；tid='sign-stamp-pick-stamp-phone'
    可访问名与基线同源：基线的可点 pick 卡片不写 aria-label，可访问名由卡面文字算出，本页照办。
    分区与顺序也冻结：每张手机卡仍紧跟同一组里的「本机上传」卡，仍与同组卡片同宽同高，不缩小、
    不置灰、不移到别处、不改成次级样式。
    **不新增、不删除、不改名、不扩展任何手机入口**，也不把 href 改成等待态。之前一版曾把两个 href
    改成 document-phone-entry / stamp-phone-entry，那是错的，已按基线改回。
    document-phone-entry / stamp-phone-entry 只作为 capture-only 的等待态留着（只能由显式
    ?state= + capture/debug 到达）；页面上没有任何正常入口指向它们，shoot.mjs 有专门断言。
    基线的 ?state=placing 在本页对应 placement-default，启动时做同义解析，所以冻结的 href 目标
    语义（跳到「选位置」这一步）没有变；裸地址下它和其它夹具态一样落 auth-unknown。
    像素级几何没有冻结，也不谎称冻结：基线把 pick 卡片放在两列 .pickrow 网格里（488×224.6），
    本页是预览 + 参数双栏工作台，卡片是参数列里的整列卡（356×133.6）。两套版式不可能给出同一个
    矩形。冻结的是语义、可访问名、分区归属、同组同尺寸与不被降级；实测两组矩形都写进 check-report。

  fallback: 任一门禁未过 → 不显示夹具、不给合成入口、常驻可读原因；
            结果未知 → 保留全部输入与同一请求标识，只允许同 key 同参数重试，绝不写「没有生成」。
  原型演示控制：仅 ?debug=1 注入 DOM；只切 data-state，不驱动任何业务结果。页面无计时器推进业务状态。
-->
<style>

  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --clay:#b8683c; --clay-d:#9e5330; --clay-soft:#f7ebe1;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;

.serif{font-family:"Songti SC","STSong","SimSun",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

.topbar{flex:none;height:88px;display:flex;align-items:center;gap:16px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line)}

.pill.ok{background:var(--teal-soft);color:var(--teal-d);border-color:transparent}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}

/* ── 完整页预览 ───────────────────────────────────────── */
function pageIsRotated(n){return Boolean(M.doc&&M.doc.rotate&&M.doc.rotate[n])}
function visualSize(n){return pageIsRotated(n)?{w:PAGE_H,h:PAGE_W}:{w:PAGE_W,h:PAGE_H}}
/* 与 computeStampDrawParams 同一套算法：先在视觉空间定位，再换算成 CSS 左上角坐标 */
function stampBox(n){
 var v=visualSize(n),f=SIZE_FACTOR[M.place.size];
 var w=v.w*f,h=w*(FX.stamp.h/FX.stamp.w);
 if(h>v.h*f){h=v.h*f;w=h*(FX.stamp.w/FX.stamp.h)}
 var mX=v.w*MARGIN_RATIO,mY=v.h*MARGIN_RATIO,g=POSGRID[M.place.position];
 var vx=g.col==='left'?mX:(g.col==='right'?v.w-mX-w:(v.w-w)/2);
 var vy=g.row==='bottom'?mY:(g.row==='top'?v.h-mY-h:(v.h-h)/2);
 return {x:vx,y:v.h-vy-h,w:w,h:h};
}
function pageInner(n,scale,burned){
 var v=visualSize(n),u=function(x){return (x*scale).toFixed(1)+'px'},html='',i;
 var pad=v.w*0.085,cw=v.w-pad*2;
 html+='<span class="pp t" style="left:'+u(pad)+';top:'+u(v.h*0.078)+';width:'+u(cw*0.56)+';height:'+u(v.h*0.026)+'"></span>';
 var y=v.h*0.14,rowH=v.h*0.0155,gap=v.h*0.0248;
 var pat=[1,.82,.94,.6,0,.9,.75,.97,.55,0,.88,.7,.93,.62,0,.86,.72,.95,.58,0,.9,.66,.84];
 for(i=0;i<pat.length;i++){
  if(pat[i]===0){y+=gap*1.05;continue}
  html+='<span class="pp" style="left:'+u(pad)+';top:'+u(y)+';width:'+u(cw*pat[i])+';height:'+u(rowH)+'"></span>';
  y+=gap;
 }
 /* 落款区：一份协议纸的下半页本来就是签字栏，也解释了为什么默认盖在右下 */
 var sy=v.h*0.775,rule=Math.max(1,v.h*0.0032);
 html+='<span class="pp t" style="left:'+u(pad)+';top:'+u(sy)+';width:'+u(cw*0.15)+';height:'+u(rowH)+'"></span>';
 html+='<span class="pp" style="left:'+u(pad+cw*0.19)+';top:'+u(sy+rowH*0.85)+';width:'+u(cw*0.27)+';height:'+u(rule)+'"></span>';
 html+='<span class="pp t" style="left:'+u(pad+cw*0.53)+';top:'+u(sy)+';width:'+u(cw*0.15)+';height:'+u(rowH)+'"></span>';
 html+='<span class="pp" style="left:'+u(pad+cw*0.72)+';top:'+u(sy+rowH*0.85)+';width:'+u(cw*0.27)+';height:'+u(rule)+'"></span>';
 html+='<span class="pp" style="left:'+u(pad)+';top:'+u(v.h*0.845)+';width:'+u(cw*0.3)+';height:'+u(rowH*0.8)+'"></span>';
 /* 四角角标 / 页脚 / 旋转提示：直接按 CSS 像素排，字号有 15px 下限，
    所以横向页、缩得很小的时候也不会把字挤出框、也不会被纸边裁掉。 */
 var pw=v.w*scale,ph=v.h*scale,px=function(x){return x.toFixed(1)+'px'};
 var fs=Math.max(15,ph*0.021);
 var bh=Math.max(fs*1.75,ph*0.035),bwid=Math.max(fs*3,pw*0.13),bm=Math.max(7,pw*0.02),bw=Math.max(1,scale*2);
 var C=[['tl','左上',bm,bm],['tr','右上',pw-bm-bwid,bm],['bl','左下',bm,ph-bm-bh],['br','右下',pw-bm-bwid,ph-bm-bh]];
 for(i=0;i<C.length;i++){
  html+='<span class="pmark" data-corner="'+C[i][0]+'" style="left:'+px(C[i][2])+';top:'+px(C[i][3])+';width:'+px(bwid)+';height:'+px(bh)+';font-size:'+fs.toFixed(1)+'px;border-width:'+bw.toFixed(1)+'px">'+C[i][1]+'</span>';
 }
 var ffs=Math.max(15,ph*0.019);
 html+='<span class="pfoot" style="top:'+px(ph-ffs*1.5)+';font-size:'+ffs.toFixed(1)+'px">第 '+n+' 页 / 共 '+(M.doc?M.doc.pages:1)+' 页</span>';
 if(pageIsRotated(n)){
  var rw=Math.max(fs*9.5,pw*0.28),rh=Math.max(fs*1.75,ph*0.042);
  html+='<span class="protchip" style="left:'+px((pw-rw)/2)+';top:'+px(bm+bh+Math.max(5,ph*0.012))+';width:'+px(rw)+';height:'+px(rh)+';font-size:'+fs.toFixed(1)+'px">本页 /Rotate 90</span>';
 }
 /* 签章标记：位置与大小由真实几何驱动；只出现在被选中的那一页 */
 if(M.stamp&&n===M.place.page){
  var b=stampBox(n);
  html+='<span class="stampmark" data-testid="sign-stamp-overlay-marker" data-position="'+M.place.position+'" data-size="'+M.place.size+'" data-page="'+n+'" data-burned="'+(burned?'true':'false')+'" style="left:'+u(b.x)+';top:'+u(b.y)+';width:'+u(b.w)+';height:'+u(b.h)+';font-size:'+Math.max(15,b.h*0.26*scale).toFixed(1)+'px;border-width:'+Math.max(2,scale*3).toFixed(1)+'px">'+(burned?'已合成':'签名图')+'</span>';
 }
 return html;
}
function viewEl(){return document.getElementById('pv-view')}
function fitScales(n){
 var view=viewEl();if(!view)return {page:0.6,width:0.6};
 var v=visualSize(n);
 return {page:Math.min(view.clientWidth/v.w,view.clientHeight/v.h),width:view.clientWidth/v.w};
}
var ZOOMS=[1,1.35,1.75,2.25,2.9];
function currentScale(n){
 var f=fitScales(n);
 if(M.view.mode==='width')return f.width;
 if(M.view.mode==='zoom')return f.page*ZOOMS[M.view.zoom];
 return f.page;
}
function pvDraw(){
 var view=viewEl();if(!view)return;
 var n=M.view.page,burned=(M.view.target==='output');
 var s=currentScale(n),v=visualSize(n);
 var pw=v.w*s,ph=v.h*s;
 var sceneW=Math.max(pw,view.clientWidth),sceneH=Math.max(ph,view.clientHeight);
 var offX=Math.max(0,(sceneW-pw)/2),offY=Math.max(0,(sceneH-ph)/2);
 view.innerHTML='<div class="pv-scene" style="width:'+sceneW.toFixed(1)+'px;height:'+sceneH.toFixed(1)+'px">'+
   '<div class="pv-page" data-testid="sign-stamp-pv-page" role="img" aria-label="'+(burned?'派生 PDF':'原 PDF')+' 第 '+n+' 页完整页面预览" style="left:'+offX.toFixed(1)+'px;top:'+offY.toFixed(1)+'px;width:'+pw.toFixed(1)+'px;height:'+ph.toFixed(1)+'px">'+pageInner(n,s,burned)+'</div></div>';
 var lab=document.getElementById('pv-zoomlabel');

 if(pickPhase()){

   '<div class="pv-cap" data-testid="sign-stamp-pv-caption">原 PDF 第 '+M.view.page+' 页 · 下一步可翻页放大</div>';

 }

 bindPreview();

 if(M.view.pan==='br'){var v=viewEl();v.scrollLeft=v.scrollWidth;v.scrollTop=v.scrollHeight}

var DRAG=null;
function bindPreview(){
 var view=viewEl();if(!view)return;
 view.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('button'))return;
  if(view.scrollWidth<=view.clientWidth&&view.scrollHeight<=view.clientHeight)return;
  DRAG={id:e.pointerId,x:e.clientX,y:e.clientY,sl:view.scrollLeft,st:view.scrollTop};
  view.classList.add('grabbing');
  try{view.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
 });
 view.addEventListener('pointermove',function(e){
  if(!DRAG||e.pointerId!==DRAG.id)return;
  view.scrollLeft=DRAG.sl-(e.clientX-DRAG.x);
  view.scrollTop=DRAG.st-(e.clientY-DRAG.y);
  e.preventDefault();
 });
 var end=function(e){if(!DRAG||e.pointerId!==DRAG.id)return;DRAG=null;view.classList.remove('grabbing')};
 view.addEventListener('pointerup',end);
 view.addEventListener('pointercancel',end);
 var wire=function(id,fn){
  var el=document.getElementById(id);if(!el)return;
  el.addEventListener('click',function(){if(el.getAttribute('aria-disabled')==='true')return;fn();pvDraw()});
 };
 wire('pv-prev',function(){if(M.view.page>1)M.view.page--});
 wire('pv-next',function(){if(M.view.page<M.doc.pages)M.view.page++});
 wire('pv-jump2',function(){M.view.page=Math.min(2,M.doc.pages)});
 wire('pv-jump-last',function(){M.view.page=M.doc.pages});
 wire('pv-fit-page',function(){M.view.mode='page';M.view.zoom=0});
 wire('pv-fit-width',function(){M.view.mode='width'});
 wire('pv-zoom',function(){M.view.mode='zoom';if(M.view.zoom<1)M.view.zoom=2});
 wire('pv-zoom-in',function(){M.view.mode='zoom';M.view.zoom=Math.min(ZOOMS.length-1,M.view.zoom+1)});
 wire('pv-zoom-out',function(){if(M.view.mode!=='zoom')return;M.view.zoom=Math.max(0,M.view.zoom-1);if(M.view.zoom===0)M.view.mode='page'});
}

/* ── 参数列（唯一滚动区） ─────────────────────────────── */
/* 参数锁定：正在提交、正在同请求重试、以及结果未确认。最后一种最重要 —— 结果没确认时
   改一个字节就变成另一次请求，可能真的生成两份，所以这里不许改。 */
function isLocked(){return M.phase==='composing'||M.phase==='retrying'||M.phase==='result-unknown'}
function lockAttr(){return isLocked()?' aria-disabled="true" aria-describedby="sign-stamp-lock-reason"':''}
function pickBody(o){
 return '<span class="pi" style="background:'+o.bg+';color:'+o.fg+'">'+svg(o.ic,'currentColor',30)+'</span>'+
  '<b>'+o.n+'</b><span class="d">'+o.d+'</span><span class="f">'+o.f+'</span>';
}
/* 卡内竖排结构与基线相同：图标 → 标题 → 说明 → 脚注，四个直接子节点。
   基线的可点 pick 卡片不写 aria-label（可访问名由卡面文字算出），本页照办，
   这样两张冻结手机卡的可访问名与基线逐字相同。禁用卡沿用基线的 aria-label="n（f）"。 */
function pick(o){
 if(o.disabled)return '<div class="pick" role="group" aria-disabled="true"'+(o.rid?' aria-describedby="'+o.rid+'"':'')+' data-testid="'+o.tid+'" aria-label="'+o.n+'（'+o.f+'）">'+pickBody(o)+'</div>';
 if(o.href)return '<a class="pick press" href="'+o.href+'" data-route="'+(o.route||'/print-scan/sign')+'" data-testid="'+o.tid+'">'+pickBody(o)+'</a>';
 return '<button type="button" class="pick press" data-testid="'+o.tid+'">'+pickBody(o)+'</button>';
}

   下面两个字面量按基线逐字冻结（见文件头「手机入口冻结面」）。href 也是基线原值：
   ?state=pick-stamp / ?state=placing —— 不带任何本轮查询参数，也不指向等待态。
   裸地址下这两个目标和其它夹具态一样落 auth-unknown，所以点它不会伪造一次手机上传成功。 */

function askFor(phase){

  if(M.docErr)return ['这一份<em>没收下</em>。','原因在右边。<b>它没有进入流程</b>，换一份就行。'];

  if(M.docStage==='phone')return ['用<em>手机</em>把 PDF 传进来。','扫屏幕上的码；<b>手机上确认之后</b>才进下一步。'];
  if(M.docStage==='inspecting')return ['正在<em>读这份 PDF 的页数</em>。','加密、损坏、含数字签名域的，<b>这一步就会被拒</b>。'];

function pickPhase(){
 if(M.phase==='completed'||M.phase==='recovered')return null;
 if(M.docErr||!M.doc)return 'doc';
 if(M.stampErr||!M.stamp)return 'stamp';

   同时把这一列填满 —— 不靠堆解释文字来占位。 */
function stepRail(active){
 var S=['选文档','传签名 / 印章图','选位置','合成结果'],h='',i;
 for(i=0;i<S.length;i++)h+='<div class="step'+(i<active?' done':(i===active?' on':''))+'"><i aria-hidden="true"></i><span>'+S[i]+'</span></div>';
 return '<div class="grp"><h3>这一趟四步</h3><div class="steps" data-testid="sign-stamp-steps">'+h+'</div></div>';
}
function renderControls(){
 var c=document.getElementById('ctrlcol'),ph=pickPhase(),h='';
 if(ph)h='<div class="statusrow" id="statusrow">'+statusFor()+'</div>'+stepRail(ph==='doc'?0:1);
 else if(M.phase==='completed'||M.phase==='recovered')h=outputBlock()+usedInputsBlock()+nextRoundBlock();
 else if(isLocked())h=retainedBlock()+placementControls();
 else if(M.phase!=='idle')h=retainedBlock()+placementControls();
 else h=placementControls()+consentBlock();
 c.innerHTML=h;
 bindControls();
}
/* 参数一动，状态块 / 摘要 / 完整预览 / 主操作 / 顶栏胶囊同时重画；
   「刚读到页数 / 刚收到签名图 / 授权刚被复位」这类一次性说明也随之退场。 */
function refreshWorkspace(keepFocus){
 M.docJustRead=false;M.stampJustAdded=false;M.authReset=false;

 h+=ghost(bt[2],bt[0],bt[1],'sign-stamp-exit');
 if(b){
  if(b.sec)h+=ghost(b.sec[0],b.sec[1],b.sec[2],b.sec[3]);
  setReason(null);
  h+=b.pri?(b.pri[1]?priLink(b.pri[0],b.pri[1],b.pri[2]):priBtn(b.pri[0])):priLink(bt[2]+'（唯一出口）',bt[0],bt[1]);
  bar.innerHTML=h;return;
 }
 if(M.phase==='completed'||M.phase==='recovered'){
  h+=ghostBtn('再加一处签名 / 印章','sign-stamp-add-another');
  h+=(M.outErr==='expired')
    ? priOff('去材料检查（先重新取链接）','链接已过期，重新取一次才能交给材料检查')
    : priLink('去材料检查','13-print-desk.html','/print/material-check');
 }
 else if(M.docErr)h+=priOff('换一份 PDF 再继续','刚才那份没有进入流程，先换一份符合要求的 PDF');
 else if(M.stampErr)h+=priOff('换一张图片再继续','刚才那张没有进入流程，先换一张 JPG / PNG');
 else if(M.phase==='composing'||M.phase==='retrying')h+=priOff('正在生成…','这一次合成还没有回来，重复提交可能生成两份');
 else if(M.phase==='result-unknown')h+=priBtn('用同一次请求重试');
 else if(M.phase==='known-failed'||M.phase==='rate-limited'||M.phase==='in-progress')h+=priBtn('重试生成');
 else if(M.phase==='conflict')h+=priOff('换一次新请求再生成','这个请求标识已绑定另一组参数，必须换一次新的请求，不能覆盖上一次');
 else if(!M.doc)h+=priOff('选好 PDF 再继续','还没有选文档，没有文档就没法选页码和位置');
 else if(!M.stamp)h+=priOff('传好签名 / 印章图再继续','还没有这次的签名 / 印章图片，没有图就没有可叠加的内容');
 else if(M.placeErr)h+=priOff('先改成 1–6 页之间','页码超出这份文档的范围，服务端会直接拒绝');
 else if(!M.authorized)h+=priOff('生成合成 PDF（请先确认授权）','还没有勾选授权确认，勾选后才能生成');
 else h+=priBtn('生成合成 PDF');
 bar.innerHTML=h;
 var ex=document.querySelector('[data-testid="sign-stamp-add-another"]');
 if(ex)ex.addEventListener('click',function(){go('add-another-ready')});
}

/* ── 顶栏胶囊 ─────────────────────────────────────────── */
function renderPill(){
 var cls='',txt='',b=blockReason();
 if(b){cls=(b.kind==='error'?'bad':(b.kind==='info'?'':'warn'));txt=b.t}
 else if(M.docErr||M.stampErr){cls='warn';txt='这一份没被接收'}
 else if(M.phase==='composing'||M.phase==='retrying'){cls='';txt='正在生成 · 无进度回传'}
 else if(M.phase==='result-unknown'){cls='warn';txt='结果未确认'}
 else if(M.phase==='known-failed'||M.phase==='conflict'){cls='bad';txt='这一次未生成'}
 else if(M.phase==='rate-limited'||M.phase==='in-progress'){cls='warn';txt='暂不受理 · 可稍后重试'}
 else if(M.phase==='completed'||M.phase==='recovered'){cls='ok';txt=M.outErr?'已生成 · 预览受限':'派生 PDF 已生成'}
 else if(!M.doc){cls='';txt='第 1 步 · 选 PDF'}
 else if(!M.stamp){cls='';txt='第 2 步 · 传签名图'}
 else if(!M.authorized){cls='warn';txt='第 3 步 · 需确认授权'}
 else{cls='ok';txt='第 4 步 · 可以生成'}
 document.getElementById('pill').className='pill'+(cls?' '+cls:'');
 document.getElementById('pill-txt').textContent=txt;
 var live=(M.phase==='composing'||M.phase==='retrying'||M.cap==='loading'||M.docStage==='inspecting'||M.docStage==='uploading'||M.stampStage==='uploading');
 document.getElementById('pill-dot').className='dot'+(live?' breathe':'');
}

/* ── 主渲染 ───────────────────────────────────────────── */
function render(st){
 var stage=document.getElementById('stage'),root=document.getElementById('root'),bt=backTarget();
 stage.setAttribute('data-state',st);
 root.setAttribute('data-state',st);
 root.setAttribute('data-testid',SCREEN+'-state-'+st);
 var back=document.getElementById('back');
 back.setAttribute('href',bt[0]);back.setAttribute('data-route',bt[1]);back.setAttribute('aria-label',bt[2]);
 renderCtx();
 var b=blockReason();
 if(b){
  root.setAttribute('data-shape','block');
  root.innerHTML='<div class="statusrow" id="statusrow"></div><div class="work" id="work"></div><div class="aside" id="aside"></div>';
  document.getElementById('statusrow').innerHTML=
   '<div class="state" data-kind="'+b.kind+'" data-testid="sign-stamp-fallback">'+
    '<div class="state-h">'+svg(b.kind==='lock'?'lock':(b.kind==='info'?'info':'warn'),'currentColor',28)+b.t+'</div>'+
    '<div class="state-p">'+b.p+'</div>'+
    '<div class="metarow"><span class="chip">这一页不显示任何文件</span><span class="chip">不生成、不保存、不上传</span><span class="chip">签名图不跨会话保留</span></div>'+
   '</div>';
  document.getElementById('work').innerHTML=gateOptions();
  document.getElementById('aside').innerHTML=gateAside(b);
 }else{
  var ph=pickPhase();
  if(ph){
   root.setAttribute('data-shape','pick');
   root.innerHTML=xqBand()+
    '<section class="sec" id="picksec" aria-label="'+(ph==='doc'?'选要盖章的 PDF':'传这次的签名 / 印章图')+'">'+(ph==='doc'?docPickers():stampPickers())+'</section>'+
    '<div class="work" id="work"><section class="pvcol" id="pvcol" aria-label="文档完整页预览"></section>'+
    '<section class="ctrlcol" id="ctrlcol" aria-label="这一步的状态与说明"></section></div>';
  }else{
   root.setAttribute('data-shape','work');
   root.innerHTML='<div class="statusrow" id="statusrow"></div>'+
    '<div class="work" id="work"><section class="pvcol" id="pvcol" aria-label="文档完整页预览"></section><section class="ctrlcol" id="ctrlcol" aria-label="叠加参数"></section></div>'+
    '<div class="aside" id="aside"></div>';
   document.getElementById('statusrow').innerHTML=statusFor();
   document.getElementById('aside').innerHTML=asideFor();
  }
  renderControls();
 }
 renderPill();
 renderCta();
 if(!b)renderPreview();
 var links=document.querySelectorAll('#demo-panel a');
 for(var i=0;i<links.length;i++)links[i].className=(links[i].getAttribute('data-s')===st?'on':'');
}
var CURRENT='auth-unknown';
function go(st){resetModel();if(SETUP[st])SETUP[st]();if(FROM_UNKNOWN)M.fromUnknown=true;CURRENT=st;render(st)}

/* ── 启动 ─────────────────────────────────────────────── */
var Q=new URLSearchParams(location.search);
var DEBUG=Q.get('debug')==='1';
var CAPTURE=Q.get('capture')==='1';
var FIXTURE=DEBUG||CAPTURE;
var FLAT=Q.get('flat')==='1';
/* 未知 / 外部来路一律回落 hub；原始值绝不进入 DOM，也不做返回落点。
   真的传了一个不认识的来路时，页面照实说一句，而不是悄悄换个落点。 */
var RAW_FROM=Q.get('from');
var FROM_KNOWN=RAW_FROM!==null&&Object.prototype.hasOwnProperty.call(BACK,String(RAW_FROM));
var FROM_UNKNOWN=RAW_FROM!==null&&!FROM_KNOWN;
FROM=FROM_KNOWN?String(RAW_FROM):'hub';

/* 基线冻结的手机卡 href 用基线状态名 ?state=placing；本页对应 placement-default。
   只做同义解析，不新增状态、不放宽夹具门。 */
var STATE_ALIAS={placing:'placement-default'};

/* 夹具门：所有带文件名 / 页数 / 结果的状态都要 capture=1 或 debug=1；
   普通产品地址一律落 auth-unknown，看不到任何夹具事实。 */
var wanted=Q.get('state');
if(wanted!==null&&Object.prototype.hasOwnProperty.call(STATE_ALIAS,wanted))wanted=STATE_ALIAS[wanted];
var start='auth-unknown';
if(STATES.indexOf(wanted)>=0){ if(FIXTURE||NON_FIXTURE[wanted])start=wanted }
go(start);

/* 原型演示控制（非产品功能）：仅 debug=1 注入 DOM */
if(DEBUG){
 var tab=document.createElement('button');
 tab.type='button';tab.className='demo-tab';tab.id='demo-tab';
 tab.setAttribute('aria-label','打开原型演示控制面板');
 tab.setAttribute('data-proto-control','true');
 tab.textContent='演示';
 var panel=document.createElement('div');
 panel.className='demo-panel';panel.id='demo-panel';
 panel.setAttribute('aria-label','原型演示控制');
 panel.setAttribute('data-proto-control','true');
 var dh='<div class="dp-t">原型演示控制（非产品功能）</div>',si;
 for(si=0;si<STATES.length;si++)dh+='<a href="?debug=1&capture=1'+(FLAT?'&flat=1':'')+'&state='+STATES[si]+'" data-s="'+STATES[si]+'"'+(STATES[si]===CURRENT?' class="on"':'')+'>'+STATES[si]+'</a>';
 panel.innerHTML=dh;
 var stg=document.getElementById('stage');
 stg.appendChild(tab);stg.appendChild(panel);
 tab.addEventListener('click',function(){panel.classList.toggle('show')});
}
/* 时钟：只刷新顶栏时间文本，不改 data-state，也不推进任何业务状态 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();
addEventListener('resize',function(){fit();if(viewEl())pvDraw()});
if(FLAT)document.getElementById('stage').classList.add('flat');
</script>
</body>
