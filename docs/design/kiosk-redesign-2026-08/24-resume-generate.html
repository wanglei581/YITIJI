<title>从零生成简历 · 职易达</title>
<!--
  S18 · AI 简历从零生成 + 生成预览闭环（青序流光，1080x1920 单 HTML 宿主）
  route: /resume/generate          —— apps/kiosk/src/pages/resume/ResumeGeneratePage.tsx
         /resume/generate/preview  —— apps/kiosk/src/pages/resume/ResumeGeneratePreviewPage.tsx

  本页只做一件事：把用户口述/手填的真实资料收成结构化槽位，提交一次生成，然后在同一页
  核对、就地改描述、导出、必要时进打印确认。**本页不做简历诊断**（那是 21/22 的线），
  也不复制 23 的优化版流程。

  查询契约：
    ?state=<下方 33 态之一>   —— 仅本原型使用；夹具态必须带 capture=1 或 debug=1
    ?seg=edu|exp|proj        —— 第 3 步内部分段（教育/经历/项目），不是独立状态
    ?format=pdf|docx|txt|md  —— 导出格式夹具（默认 pdf）；未登记取值一律进 illegal 屏。
                                只有 pdf 现在能进打印确认，理由见「导出」一节。
    ?taskId=<x>              —— 39-member-records.html 的会员回看深链，映射到 /resume/generate/preview
    ?capture=1 / ?debug=1    —— 夹具可达门 + 技术披露门；?flat=1 截图去动效
    非法 state / 非法 seg → illegal（不回显原始参数）；夹具态裸地址 → session-lost / preview-no-result

  真实合同（来源：代码，不是想象）：
    字段      ResumeGenerateInput{ basic, intention, education[], experience[], projects[],
              skills[], certificates[], selfIntro? }（packages/shared/src/types/ai.ts:289）。
              上限来自 ResumeGeneratePage.tsx：education 6 / experience 8 / projects 6 /
              skills 20 / certificates 15。四步是本静态宿主对 React 六步的合并，字段一个不少。
    必填      只冻结两项：step0 basic.name、step1 intention.position
              （ResumeGeneratePage.tsx canNext）。其余全部可空。
    只提交    buildInput 过滤：教育要 school；经历要 company 且 role；项目要 name。
              半空条目不提交 —— 页面必须把这件事写在行上，不能等提交后才发现少了。
    防编造    LlmResumeGenerateService：LLM 只回按 index 对齐的润色文本
              （summary/educationDesc/experienceDesc/projectDesc/skillsPolished），
              学校/专业/学位/公司/职务/项目名/证书/时间段由服务端从输入逐字复制。
              数组长度漂移即判非法。缺项由 computeMissingHints 确定性算出，AI 不代填。
    缺失提示  computeMissingHints(llm-resume-generate.service.ts:81)：无联系方式 / 无教育 /
              无经历且无项目 / 无技能 / 经历描述 <20 字。本页 hintsOf() 是它的逐条镜像，
              页面上显示的每一条都是从当前内容算出来的，不是写死的文案。
    语音      POST /resume/voice/transcribe（multipart WAV）→ { text, providerName }。
              ResumeTranscriptConfirmDialog 的真实状态机：requesting_permission → recording
              → transcribing → ready（可改）→ 确认写入。单次上限 58 秒，不保存原始音频，
              **未确认前一个字都不写进表单**。没有声纹、没有实时通话、没有音量波形含义。
    生成      POST /resume/generate 单次等待完整 completed/failed。没有字段流式到达，
              没有百分比。能力未探测前 availability=unknown（aiOutage.ts fail-closed 口径）；
              isAiOutage 只把**能力级**故障判成不可用，限流/参数错只是本次失败，必须留重试。
    草稿      exportResumeDraft → POST /resume/generate/export { draft:true }，不经过模型，
              服务端只做 pdfkit 排版，文件名前缀「简历草稿（未经AI润色）」。AI 挂掉照常可用，
              但它**不是** AI 润色的等价物：没有润色、没有缺失提示，页面必须写清。
    预览进入  只有两条：submit 返回 completed 且 resume 存在（router state），或带 taskId 由
              服务端读回（getResumeGenerate，凭登录身份或匿名一次性令牌）。裸地址一律空态。
    令牌      accessToken 只在提交响应返回一次（ai.ts:318 注释）。不上屏、不进地址栏、
              不写本机存储 —— 本页对此只做中文陈述，DOM/URL 里不出现任何令牌形状的串。
    导出      POST /resume/generate/export → { fileId, filename, sizeBytes, pageCount,
              signedUrl, expiresAt, printFileUrl? }。**只有 pdf 有页数与版式/模板**；
              docx/txt/md 的 pageCount 恒为 0，templateId 只对 pdf 生效。
              signedUrl 是短时下载链接、会过期；打印只认 printFileUrl（系统 HMAC content URL），
              signedUrl 进不了 /print/jobs。printFileUrl 缺失时只能下载或重导出，不进打印。
    孤儿链    历史 /resume/export 没有页面入口，本页**不**把它做成一个正式新页面；
              导出是 /resume/generate/preview 上的一段，不另起路由。

  本页不伪造：任务号、provider 在线、生成完成、文件、页数、保存进账号、打印、支付、
              实时通话、声纹、音量波形含义、百分比、匹配度/评分/通过率。
  超出 React 的原型级处理只有一处并已标注：点被禁用的主操作时，本页把缺的必填项显式标红
              （React 只是置灰按钮）。这是可用性处理，不改变提交条件。

  原型演示控制：普通地址完全不渲染；仅 ?debug=1 注入（data-proto-control="true"），保留 debug/capture/flat。
  技术披露（端点名、DTO 字段、React 文件名）只在 ?debug=1 / ?capture=1 下出现在夹具条里，
  普通地址上一个都不显示。
-->
<style>
:root{
  --paper:#f5f2e9; --surface:#fffdf8; --ink:#10302b; --ink-2:#3d5a52; --ink-3:#6b857c;
  --deep:#0b241e; --deep-2:#123a30; --emerald:#2ee6a8;
  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;
  --line:#e3ddcb; --line-2:#d4cdb6;
  --cinnabar:#b23a2e; --cinnabar-d:#963227; --cinnabar-soft:#f6e4e1;

}

html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","SimSun",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}

/* ---------- 外壳 ---------- */
.topbar{flex:none;height:104px;display:flex;align-items:center;gap:18px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:20px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.logo-name{font-size:26px;font-weight:700;letter-spacing:2px}
.topbar .sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 22px;border-radius:28px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:19px;font-weight:600;max-width:520px;overflow:hidden;white-space:nowrap}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok{background:var(--teal-soft);color:var(--teal-d);border-color:transparent}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);color:var(--cinnabar-d);border-color:transparent}.pill.bad .dot{background:var(--cinnabar)}
.clock{flex:none;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}

.xq{flex:none;margin:16px 44px 0;border-radius:32px;padding:20px 34px 18px;background:linear-gradient(158deg,var(--deep-2) 0%,var(--deep) 68%);color:#f2efe4;position:relative;overflow:hidden}
.xq::after{content:"";position:absolute;right:-140px;top:-150px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(46,230,168,.16),transparent 65%)}
.xq-row{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
.xq-face{flex:none;width:80px;height:80px;border-radius:50%;background:rgba(46,230,168,.1);border:1.5px solid rgba(46,230,168,.4);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--emerald)}
.xq-main{flex:1;min-width:0}
.xq-eyebrow{font-size:16px;letter-spacing:5px;color:rgba(242,239,228,.5);margin-bottom:5px}
.xq-ask{font-size:34px;line-height:1.26;font-weight:700;letter-spacing:1px}
.xq-ask em{font-style:normal;color:var(--emerald)}
.xq-doing{margin-top:8px;font-size:19px;line-height:1.5;color:rgba(242,239,228,.74)}
.xq-doing b{color:#fff;font-weight:600}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
.sec{flex:none;padding:0 44px;margin-top:16px}
.sec.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.sec.grow>.card,.sec.grow>.state{flex:1;min-height:0}
.sec.grow>.card{justify-content:space-evenly}
.sec-label{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.sec-label .no{font-size:19px;color:var(--teal-d);font-weight:700;letter-spacing:2px}
.sec-label .t{font-size:28px;font-weight:700}
.sec-label .hint{font-size:19px;color:var(--ink-3);margin-left:auto;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px;display:flex;flex-direction:column}
.state{border-radius:var(--r-lg);padding:24px 30px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=lock]{background:var(--slate-soft);border-color:#cfdcee}
.state[data-kind=info]{background:var(--teal-soft);border-color:#c6e4da}
.state-h{display:flex;align-items:center;gap:14px;font-size:29px;font-weight:700;line-height:1.25}
.state-p{margin-top:12px;font-size:21px;line-height:1.6;color:var(--ink-2)}
.state-p b{color:var(--ink);font-weight:600}
.dot16{width:16px;height:16px;border-radius:50%;background:var(--teal);display:inline-block;flex:none}

.lb{display:inline}
.btn{min-height:76px;padding:0 26px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:600;text-align:center;line-height:1.25}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn[aria-disabled=true]{background:var(--line-2);color:#5d6a63;cursor:default}
.ctabar{flex:none;padding:16px 44px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:16px}
.ctabar .btn{flex:1}
.ctabar .btn.wide{flex:1.6}
.cta-reason{flex:none;padding:0 44px;margin-bottom:12px;font-size:20px;font-weight:600;color:var(--wheat-d);display:flex;align-items:center;gap:10px;line-height:1.4}
.cta-reason.bad{color:var(--cinnabar-d)}

/* 底部只留一条：当前这一屏真正相关的那句话。三列固定说明条已撤掉 —— 每屏重复同样的
   三段话既占地方，也把产品页做成了验收面板。 */
.truth{flex:none;padding:14px 44px 15px;border-top:1px solid var(--line);background:var(--paper);display:flex;align-items:center;gap:14px}
.truth i{flex:none;width:32px;height:32px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-3);font-style:normal;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.truth span{flex:1;min-width:0;font-size:18px;line-height:1.45;color:var(--ink-3)}
.truth b{color:var(--ink-2);font-weight:600}
.navbar{flex:none;height:112px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.nav-item .ni{font-size:20px;color:var(--ink-3);font-weight:600}

@keyframes k-breathe{0%,100%{opacity:.5}50%{opacity:1}}
.breathe{animation:k-breathe 1600ms ease-in-out infinite}
@keyframes k-pulse{0%,100%{opacity:.28;transform:scale(.86)}50%{opacity:1;transform:scale(1)}}
.pulse{display:inline-flex;gap:8px;align-items:center;flex:none}
.pulse i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:block;animation:k-pulse 1600ms ease-in-out infinite}
.pulse i:nth-child(2){animation-delay:200ms}.pulse i:nth-child(3){animation-delay:400ms}
@keyframes k-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:k-rise 240ms cubic-bezier(.22,1,.36,1) both}
.press:active{transform:scale(.985)}
/* 伪元素也要降级：`*` 选不中 ::before/::after，扫描光带正是画在伪元素上的。 */
.flat,.flat *,.flat *::before,.flat *::after{animation:none!important;transition:none!important;box-shadow:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 四步进度 ---------- */
.prog{flex:none;display:flex;gap:10px;padding:0 44px;margin-top:14px}
.prog span{flex:1;display:flex;flex-direction:column;gap:7px;font-size:17px;font-weight:600;color:var(--ink-3)}
.prog span u{display:block;height:9px;border-radius:5px;background:var(--line);text-decoration:none}
.prog span[data-on="done"]{color:var(--teal-d)}.prog span[data-on="done"] u{background:var(--teal)}
.prog span[data-on="now"]{color:var(--ink)}.prog span[data-on="now"] u{background:var(--deep)}

/* ---------- 表单 ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fgrid.one{grid-template-columns:1fr}
.cmp p{white-space:pre-line}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.fl{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--ink-2)}
.fl em{font-style:normal;font-size:16px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--wheat-soft);color:var(--wheat-d)}
.fl i{margin-left:auto;font-style:normal;font-size:16px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-3)}
.fl i[data-on="1"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-d)}
.fin{width:100%;min-height:74px;padding:0 18px;border:1px solid var(--line-2);border-radius:18px;background:var(--paper);font-size:22px}
textarea.fin{padding:14px 18px;line-height:1.5;resize:none;min-height:104px}

.chip2[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-d);font-weight:700}
.qh{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:700;color:var(--ink-3);margin-bottom:7px}

/* ---------- 说明块 ---------- */
.split{display:flex;gap:14px}

/* 行卡吃掉本区多余高度，但有上限 —— 再高就成了空心盒子；剩下的交给 space-evenly
   摊成几条小缝，而不是堆在某一处。整卡的余量由 .sec.grow>.card 的 space-evenly 兜。 */
.rows3{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;justify-content:space-evenly}
.rows3>*{flex:1 1 auto;min-height:96px;max-height:150px}
.orow .om>em{display:block;margin-top:6px;font-style:normal;font-size:17px;font-weight:700;color:var(--teal-d)}
.orow{text-align:left;display:flex;align-items:center;gap:16px;min-height:88px;padding:13px 18px;border:1px solid var(--line);border-radius:20px;background:var(--paper)}
.orow .oi{flex:none;width:62px;height:62px;border-radius:18px;background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.orow .om{flex:1;min-width:0}
.orow .om>b{display:block;font-size:24px;font-weight:700}
.orow .om>span{display:block;margin-top:6px;font-size:19px;line-height:1.4;color:var(--ink-3)}
.orow .om>span b{font-weight:700;color:var(--ink-2)}
.orow .go{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.orow[aria-disabled=true]{border-style:dashed;background:var(--surface)}
.orow[aria-disabled=true] .oi{background:var(--line);color:#5d6a63}
.orow .off{flex:none;padding:6px 13px;border-radius:11px;background:var(--line);color:#4f5a54;font-size:17px;font-weight:700}

/* ---------- 处理中主视觉 ---------- */
/* 克制的科技感：一条来回的扫描线 + 三个呼吸点。没有百分比、没有预计时间、没有假波形。
   降级（flat / reduced-motion）后扫描线停在顶边，读起来就是一条装饰亮边。 */
.proc{flex:none;position:relative;overflow:hidden;border-radius:var(--r-lg);padding:26px 30px;min-height:184px;display:flex;align-items:center;background:linear-gradient(152deg,var(--deep-2) 0%,var(--deep) 72%);color:#f2efe4}
.proc::after{content:"";position:absolute;right:-130px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(46,230,168,.17),transparent 66%)}
.proc .scan{position:absolute;left:26px;right:26px;top:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--emerald),transparent);animation:k-scan 2600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes k-scan{0%{transform:translateY(0);opacity:.4}50%{transform:translateY(140px);opacity:1}100%{transform:translateY(0);opacity:.4}}
.proc-row{position:relative;z-index:1;display:flex;align-items:center;gap:22px;width:100%}
.proc-ic{flex:none;width:88px;height:88px;border-radius:28px;background:rgba(46,230,168,.12);border:1.5px solid rgba(46,230,168,.42);color:var(--emerald);display:flex;align-items:center;justify-content:center}
.proc-m{flex:1;min-width:0}
.proc-m>b{display:block;font-size:30px;font-weight:700;line-height:1.24}
.proc-m>span{display:block;margin-top:9px;font-size:21px;line-height:1.5;color:rgba(242,239,228,.78)}
.proc .pulse i{background:var(--emerald)}

/* ---------- 进程步骤：现在在哪一步、下一步是什么（不是进度百分比） ---------- */
.steps{display:flex;flex-direction:column;gap:12px}
.steps.fill{flex:1;min-height:0;justify-content:space-evenly}
.steps.fill>.step{flex:1 1 auto;max-height:136px}
.step{display:flex;align-items:center;gap:16px;min-height:92px;padding:14px 20px;border-radius:22px;border:1px solid var(--line);background:var(--paper)}
.step .sn{flex:none;width:54px;height:54px;border-radius:17px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.step .sm{flex:1;min-width:0}
.step .sm>b{display:block;font-size:23px;font-weight:700}
.step .sm>span{display:block;margin-top:5px;font-size:19px;line-height:1.4;color:var(--ink-3)}
.step .sx{flex:none;padding:7px 15px;border-radius:13px;font-size:17px;font-weight:700;background:var(--line);color:#4f5a54}
.step[data-on=done]{border-color:transparent;background:var(--teal-soft)}
.step[data-on=done] .sn{background:var(--teal);border-color:transparent;color:#fff}
.step[data-on=done] .sx{background:var(--surface);color:var(--teal-d)}
.step[data-on=now]{border-color:var(--deep);background:var(--surface)}
.step[data-on=now] .sn{background:var(--deep);border-color:transparent;color:var(--emerald)}
.step[data-on=now] .sx{background:var(--deep);color:var(--emerald)}

/* ---------- 内容计数（真数据，不是说明文字） ---------- */
.tiles{display:flex;gap:12px}
.tiles>div{flex:1;min-width:0;border-radius:22px;border:1px solid var(--line);background:var(--paper);padding:16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tiles>div>b{font-size:33px;font-weight:700;line-height:1}
.tiles>div>span{font-size:18px;color:var(--ink-3);font-weight:600;text-align:center;line-height:1.3}
.tiles>div[data-zero="1"]{background:var(--surface);border-style:dashed}
.tiles>div[data-zero="1"] b{color:var(--ink-3)}

/* ---------- 把文件带走：扫码保存到手机 ---------- */
/* 公共终端不落本机（feature-scope.md §2.2 文件显示与公共终端隐私口径）：
   PDF 页内看，要带走一律走短时签名链接的二维码，由本人手机保存。
   静态稿只画取码位，不生成可扫描图形 —— 与 03-login-gate.html 同一口径。 */
/* 取件模块是一块**紧凑横向工作区**：左边取码位、右边动作，两列自然高度并排。
   这里刻意不给 flex:1 —— 让它吃掉整张卡的剩余高度，二维码占位就会被 stretch 成一个
   接近整屏的空心框，那正是上一版被打回的问题。剩余高度交给卡片级 space-evenly。 */
.take{display:flex;gap:16px;align-items:stretch}
.qrslot{flex:none;width:322px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 18px;text-align:center}
.qrslot .qi{width:208px;height:208px;border-radius:26px;border:2px dashed var(--line-2);background:var(--paper);color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.qrslot>b{font-size:24px;font-weight:700}
.qrslot>span{font-size:17px;line-height:1.45;color:var(--ink-3)}
.qrslot>span b{color:var(--ink-2);font-weight:700}
.take-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;justify-content:space-evenly}

/* ---------- 语音 ---------- */
.cmp{display:flex;gap:14px}
.cmp>div{flex:1;min-width:0;border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.cmp .raw{background:var(--paper);border:1px solid var(--line-2)}
.cmp .pol{background:var(--teal-soft);border:1px solid var(--teal)}
.cmp h5{font-size:18px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.cmp .pol h5{color:var(--teal-d)}
.cmp p{font-size:20px;line-height:1.5;color:var(--ink-2)}
.cmp .add{background:var(--teal-soft);border:1px solid var(--teal)}
.cmp .add h5{color:var(--teal-d)}

/* ---------- 预览纸面 ---------- */
.sheet{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-md);padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;align-items:flex-end;gap:14px;padding-bottom:12px;border-bottom:2px solid var(--deep)}
.sh-top b{font-size:32px;font-weight:700}
.sh-top span{font-size:20px;color:var(--ink-2)}
.sh-top em{margin-left:auto;font-style:normal;font-size:18px;color:var(--ink-3)}
.sh-b{display:flex;flex-direction:column;gap:6px}
.sh-b h3{font-size:19px;font-weight:700;color:var(--teal-d);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.sh-b p{font-size:19px;line-height:1.5;color:var(--ink-2)}
.sh-b p b{color:var(--ink);font-weight:700}
.tg{font-size:16px;font-weight:700;padding:3px 10px;border-radius:9px;letter-spacing:0}
.tg.keep{background:var(--slate-soft);color:var(--slate-d)}
.tg.pol{background:var(--teal-soft);color:var(--teal-d)}
.hintlist{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;justify-content:space-evenly}
.hrow{display:flex;align-items:center;gap:14px;min-height:76px;padding:11px 18px;border-radius:19px;background:var(--wheat-soft);border:1px solid #e6d8b4;color:var(--wheat-d);font-size:19px;line-height:1.4;font-weight:600}
.hrow .hn{flex:none;width:40px;height:40px;border-radius:13px;background:#e8dcbe;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.hrow .hm{flex:1;min-width:0}
.hrow .hgo{flex:none;min-height:52px;padding:0 16px;border-radius:15px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}

/* ---------- 文件 / 导出 ---------- */
.fhead{display:flex;flex-direction:column;gap:14px}
.fbox{display:flex;align-items:center;gap:18px}
.fbox .fi{flex:none;width:76px;height:76px;border-radius:23px;background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.fbox .fi.mute{background:var(--paper);border:1px dashed var(--line-2);color:var(--ink-3)}
.fbox .fm{flex:1;min-width:0;display:flex;flex-direction:column}
.fbox .fm>.fn{font-size:26px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbox .fs{margin-top:7px;font-size:19px;color:var(--ink-3)}
.fmts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.fmt{border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--paper);padding:16px 18px;display:flex;flex-direction:column;gap:7px;text-align:left}
.fmt[aria-checked="true"]{border-color:var(--deep);background:var(--surface);box-shadow:inset 0 0 0 2px var(--deep)}
.fmt{justify-content:space-evenly}
.fmt b{font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px}
.fmt small{font-size:18px;line-height:1.45;color:var(--ink-3)}
.fmt .fmeta{display:flex;align-items:baseline;gap:10px;font-size:17px;line-height:1.4}
.fmt .fmeta .k{flex:none;color:var(--ink-3);font-weight:700}
.fmt .fmeta .v{flex:1;min-width:0;color:var(--ink-2);font-weight:600}
.fmt .pg{font-size:17px;font-weight:700;color:var(--slate-d);background:var(--slate-soft);border-radius:9px;padding:3px 10px}
.lay{display:flex;flex-wrap:wrap;gap:9px}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:52px;padding:0 18px;border-radius:15px;background:var(--paper);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:9px;font-size:19px;color:var(--ink-2);font-weight:600}
.chip.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}
.chip.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}
.chip.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}
.hr{height:1px;background:var(--line)}

/* ---------- 原型演示控制（只在 debug=1 注入） ---------- */
.demo-tab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;width:56px;min-height:150px;background:rgba(11,36,30,.9);color:var(--emerald);border-radius:0 16px 16px 0;writing-mode:vertical-lr;letter-spacing:4px;font-size:17px;font-weight:700}
.demo-panel{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;display:none;background:rgba(11,36,30,.96);border-radius:0 18px 18px 0;padding:14px;flex-direction:column;gap:5px;max-height:1840px;overflow:auto}
.demo-panel.show{display:flex}
.demo-panel .dp-t{color:var(--emerald);font-size:15px;font-weight:700;letter-spacing:2px;padding:2px 0 4px}
.demo-panel a{display:flex;align-items:center;min-height:48px;color:#f2efe4;font-size:15px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.07);white-space:nowrap}
.demo-panel a.on{background:rgba(46,230,168,.22);color:var(--emerald);font-weight:700}
</style>

function to(state,extra){

 if(extra)for(var k in extra){if(extra[k]===null)p.delete(k);else p.set(k,extra[k])}
 if(DEBUG)p.set('debug','1');

function routeOf(st){return PREVIEW_VIEW[st]?'/resume/generate/preview':'/resume/generate'}
function lab(x){return String(x).replace(/(^|>)([^<>]+)/g,function(m,pre,txt){return txt.trim()?pre+'<span class="lb">'+txt+'</span>':m})}
/* 可访问名只能是纯文字：把标签剥掉、把引号转义，否则 aria-label 会被 svg 里的引号截断。 */

}
function orow(o){
 var inner='<span class="oi">'+svg(o.icon,26)+'</span><span class="om"><b>'+o.t+'</b><span>'+o.d+'</span></span>';

/* ================= 导出之后同时存在的三个对象 =================
   一次导出会同时产生三样**各自独立**的东西。页面必须分别声明，谁也不许拿另一个推出来：

     file      文件本体   services/api/src/ai/ai.service.ts exportGeneratedResume → FilesService.upload
                          （assetCategory='optimized'）。寿命由**服务端留存期限**决定：登录会员按账号
                          留存策略管理（可按规则延长），匿名 / system 只留短期。链接过期 ≠ 文件被删。
     download  下载 URL   ResumeGenerateExportResponse.signedUrl + expiresAt
                          （packages/shared/src/types/ai.ts）。对象存储签发，只做预览 / 扫码下载，
                          **进不了 /print/jobs**；expiresAt 只描述这一条链接，不描述另外两样。
     print     打印凭证   ResumeGenerateExportResponse.printFileUrl，由 services/api/src/files/signing.ts
                          的 signFileUrl **另签**的系统 HMAC content URL，自带一套时钟（该模块默认 5 分钟），
                          而且是可选字段 —— 这次可能压根没给。非 PDF 时它指向的还是**另一份**同内容 PDF。

   下面这张表就是每一屏真正持有什么。打印入口只读 print，扫码取件位只读 download，
   文件本体的说法只读 file —— 三条各自计时，任何一条都不许当成另一条的依据。 */
var HELD={
 'draft-ready':{file:'retained',download:'live',print:'live'},
 'export-ready':{file:'retained',download:'live',print:'live'},
 'export-url-expired':{file:'retained',download:'expired',print:'live'},
 'export-print-unavailable':{file:'retained',download:'live',print:'absent'}
};
var CUR='';
function held(k){var o=HELD[CUR];return o?o[k]:''}
/* 页面上**唯一**的两个可用性判断，各自只看自己那一条凭证。
   写成 canPrint(){return canTakeaway()}、或者互相取值，就是把两条时钟又焊回一起。
   打印这一条有两种拦法，理由不同，不能混成一句「不能打印」：
     nocred  这次压根没拿到打印链接（服务端异常）—— 重导出一次通常就有了；
     noid    链接有，但那份打印 PDF **自己的文件编号**接口没返回（非 PDF 格式的常态）。
             下游按「来源 + 文件编号」成对认文件，拿原格式的编号顶上去就是身份造假，
             所以这一种重导出多少次都不会好，只能等服务端补字段，或者改用 PDF。 */
function printBlock(){
 if(held('print')!=='live')return 'nocred';
 if(!curFile().printable)return 'noid';
 return '';
}
function canPrint(){return !printBlock()}
function canTakeaway(){return held('download')==='live'}

var OBJTXT={
 file:{retained:['','file','文件按服务端留存期限保留']},
 download:{live:['ok','down','下载链接可用'],expired:['bad','clock','下载链接已过期']},
 print:{live:['ok','check','打印链接已就绪'],absent:['bad','warn','这次没拿到打印链接']}
};
/* 打印那一枚状态标：链接就绪但这一份没有打印身份时，标签要说清缺的是编号不是链接，
   否则屏幕上会一边写「打印链接已就绪」一边把打印按钮关着，看起来像页面自相矛盾。 */
function printChipOver(){return printBlock()==='noid'?{print:'打印链接已就绪 · 缺打印 PDF 编号'}:null}
/* 三个对象各出一枚状态标。文案可以按这一屏的语气微调，data-status 才是给人和门禁看的真值。 */
function objChips(over){
 var ks=['download','print','file'],h='',i,k,s,v;
 for(i=0;i<ks.length;i++){
  k=ks[i];s=held(k);v=OBJTXT[k][s];
  h+='<span class="chip'+(v[0]?' '+v[0]:'')+'" data-testid="'+SCREEN+'-'+k+'-state" data-obj="'+k+'" data-status="'+s+'">'+
   svg(v[1],22)+((over&&over[k])||v[2])+'</span>';
 }
 return h;
}
var NOID_TX='暂不开放打印：待服务端返回打印 PDF 的文件编号';
/* 「去打印确认」这颗主按钮只认打印凭证 + 这一份的打印身份；两样齐了才交接，
   交接只带来源、文件编号、页数和打印参数，签名链接与打印凭证一个都不进地址栏。 */
function printPrimary(alt){
 var r=printBlock(),f=curFile();
 if(!r)return a({cls:'btn primary wide',href:printHref(f),route:'/print/confirm',tid:SCREEN+'-primary',label:svg('print',26)+'去打印确认'});
 if(r==='noid')return b({cls:'btn primary wide',dis:1,tid:SCREEN+'-primary',
   al:FMT.toUpperCase()+' '+NOID_TX,label:svg('print',26)+FMT.toUpperCase()+' 暂不开放打印'});
 return alt;
}
/* 动作列表里的那条打印入口，同样两样都看，禁用理由也分开写。 */
function printRow(tid){
 var r=printBlock(),f=curFile();
 if(!r)return orow({icon:'print',t:'去打印这一份',d:'走服务端另签的打印链接，交接只带文件编号和打印参数',href:printHref(f),route:'/print/confirm',tid:tid});
 if(r==='noid')return orow({icon:'print',t:'去打印这一份',d:NOID_TX+'；换成 PDF 导出就能打',off:'暂不开放',tid:tid});
 return orow({icon:'print',t:'去打印这一份',d:'没有打印链接，这次不能进打印确认',off:'不可用',tid:tid});
}
/* 取件位只认下载链接。过期就换成一条写死的说明行，并说清过期的是哪一条。 */
function takeaway(sub,tid){
 return canTakeaway()
  ? qrSlot(sub)
  : orow({icon:'qr',t:'扫码保存到手机',d:'这条下载链接已经过期，重导出之后才会有新的码',off:'已过期',tid:tid});
}

/* ---------- 导出 ---------- */
/* 四种格式都能导出，但**只有 PDF 现在能交给打印确认**。
   ai.service.ts 对 pdf 直接签打印凭证；对 docx/txt/md 另渲染一份同内容 PDF 再签，
   接口回来的却只有一条 printFileUrl —— **那份打印 PDF 自己的 fileId 没有返回**，
   返回的 fileId 仍是原格式文件的。下游打印确认页按「来源 + 文件编号」成对认文件，
   拿原格式的编号冒充那份 PDF，等于替服务端断言两个不同对象是同一个。
   所以这里如实写成「暂不开放打印」，等服务端补上打印 PDF 的文件编号再开。
   非 PDF 的 pageCount 恒为 0 —— 那是「没有分页概念」，与能不能打印是两件事，分开写。 */
var FMTS=[
 {k:'pdf',n:'PDF',d:'排版固定，打印出来就是屏幕上这样',pg:'有页数',p:'能进打印确认',v:'投简历、现场打印'},
 {k:'docx',n:'DOCX',d:'Word 文档，回去还能自己接着改',pg:'页数 0',p:'暂不开放打印',v:'回家再改'},
 {k:'txt',n:'TXT',d:'纯文字，粘进在线表单最省事',pg:'页数 0',p:'暂不开放打印',v:'网申填表'},
 {k:'md',n:'MD',d:'Markdown，会用的人拿去二次排版',pg:'页数 0',p:'暂不开放打印',v:'自己再排版'}
];
var FMT='pdf';
/* 导出成果的夹具事实。文件名扩展名、元信息与页数口径都跟着所选格式走 ——
   写死 .pdf 会让用户选了 DOCX/TXT/MD 之后拿到一份自称 PDF 的文件。
   非 PDF 的 pageCount 恒为 0（ai.service.ts:660-690），元信息里一个页数都不许出现。 */
var FMTFILE={
 pdf:{ext:'pdf',meta:'A4 · 1 页 · 约 96 KB',pages:'PDF 有真实页数',
      sizeBytes:98304,pageCount:1,mime:'application/pdf',
      fileId:'rsm_gen_6b28d40a',printable:true},
 docx:{ext:'docx',meta:'Word 文档 · 页数 0 · 约 24 KB',pages:'页数固定是 0',
      sizeBytes:24576,pageCount:0,
      mime:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      fileId:'rsm_gen_docx_4e19b7',printable:false},
 txt:{ext:'txt',meta:'纯文本 · 页数 0 · 约 4 KB',pages:'页数固定是 0',
      sizeBytes:4096,pageCount:0,mime:'text/plain',
      fileId:'rsm_gen_txt_08c3fa',printable:false},
 md:{ext:'md',meta:'Markdown · 页数 0 · 约 5 KB',pages:'页数固定是 0',
      sizeBytes:5120,pageCount:0,mime:'text/markdown',
      fileId:'rsm_gen_md_5d72e1',printable:false}
};
function fileOf(k){
 var f=FMTFILE[k]||FMTFILE.pdf;
 return {name:'AI简历_张示例.'+f.ext,meta:f.meta,pages:f.pages,ext:f.ext,
         sizeBytes:f.sizeBytes,pageCount:f.pageCount,mimeType:f.mime,
         fileId:f.fileId,printable:f.printable};
}
/* 「原样草稿」是另一份文件：没经过 AI，文件名、大小、页数和编号都和导出件不一样，
   不能共用一个编号 —— 下游按编号取件，编号相同就是两份文件互相冒充。 */
var DRAFT_FILE={name:'简历草稿（未经AI润色）_张示例.pdf',meta:'A4 · 1 页 · 约 78 KB',
 pages:'PDF 有真实页数',ext:'pdf',sizeBytes:79872,pageCount:1,
 mimeType:'application/pdf',fileId:'rsm_draft_3a17c9f2',printable:true};
/* 这一屏正在拿着哪一份文件：草稿屏是草稿那份，其余导出屏跟着当前格式走。 */
function curFile(){return CUR==='draft-ready'?DRAFT_FILE:fileOf(FMT)}
function sizeText(n){return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1)+' MB'}
/* 打印交接只带登记过的这几项：来源、文件编号、页数、份数、单双面、颜色。
   signedUrl / printFileUrl 一个都不进地址栏。黑白单面是本机当前唯一已验证的组合。 */
function printHref(f){
 return '14-print-confirm.html?source=resume-generate&fileId='+encodeURIComponent(f.fileId)
  +'&pages='+f.pageCount+'&copies=1&duplex=single&color=bw';

function otherFmts(k){

/* 切状态前先把输入框里的值收回内存，不然翻页就丢 —— React 用 useState，这里手动收。 */
function harvest(){
 var list=root.querySelectorAll('[data-k]'),i;
 for(i=0;i<list.length;i++)fset(list[i].getAttribute('data-k'),list[i].value);
}
function bind(){
 var i,list;
 list=root.querySelectorAll('[data-go],[data-act]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('click',function(){
   if(this.getAttribute('aria-disabled')==='true')return;
   harvest();
   var act=this.getAttribute('data-act')||'',go=this.getAttribute('data-go')||'';
   if(act.indexOf('seg:')===0)SEG=act.slice(4);
   if(act==='add:edu')F.education.push({school:'',major:'',degree:'',period:'',description:''});
   if(act==='add:exp')F.experience.push({company:'',role:'',period:'',description:''});
   if(act==='add:proj')F.projects.push({name:'',role:'',description:''});
   if(act.indexOf('del:')===0){
    var d=act.split(':'),lname=SEGDEF[d[1]].list;
    F[lname].splice(Number(d[2]),1);
   }
   if(act.indexOf('voice:')===0){
    var v=act.split(':');
    VCTX.kind=v[1];VCTX.i=Number(v[2]);
    if(v[1]==='intro'){VCTX.label='自我评价';VCTX.where=''}
    else if(v[1]==='exp'){var e=F.experience[VCTX.i]||{};VCTX.label='工作内容';VCTX.where=[e.company,e.role].filter(Boolean).join(' · ')||'这一段还没填公司和职务'}
    else if(v[1]==='edu'){var u=F.education[VCTX.i]||{};VCTX.label='在校情况';VCTX.where=u.school||'这一段还没填学校'}
    else{var j=F.projects[VCTX.i]||{};VCTX.label='项目内容';VCTX.where=j.name||'这个项目还没填名称'}
    render('voice-recording');return;
   }
   if(act==='apply-voice'){
    /* 只有点了「确认写入」才落到表单，而且是另起一行追加，不覆盖原内容。 */
    var txt=String(F.voiceDraft||'');F.voiceDraft='';
    var tgt=VCTX.kind==='intro'?null:(SEGDEF[VCTX.kind]?F[SEGDEF[VCTX.kind].list][VCTX.i]:null);
    if(VCTX.kind==='intro')F.selfIntro=[F.selfIntro.trim(),txt.trim()].filter(Boolean).join('\n');
    else if(tgt)tgt.description=[String(tgt.description||'').trim(),txt.trim()].filter(Boolean).join('\n');
    SEG=VCTX.kind==='intro'?SEG:VCTX.kind;
    render(VCTX.kind==='intro'?'input-strengths':'input-history');return;
   }
   if(act==='seed-full'){F=seedFull();POLKEY='main'}
   if(go)render(go);else render(root.getAttribute('data-state'));
  });
 }
 list=root.querySelectorAll('[data-seg]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('click',function(){harvest();SEG=this.getAttribute('data-seg');render('input-history')});
 }
 list=root.querySelectorAll('[data-chip]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('click',function(){
   harvest();
   var path=this.getAttribute('data-chip'),v=this.getAttribute('data-v'),multi=this.getAttribute('data-multi')==='1';
   if(multi){
    var cur=splitList(fval(path),99),at=cur.indexOf(v);
    if(at>=0)cur.splice(at,1);else cur.push(v);
    fset(path,cur.join('、'));
   }else{
    fset(path,fval(path).trim()===v?'':v);
   }
   render(root.getAttribute('data-state'));
  });
 }
 list=root.querySelectorAll('[data-fmt]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('click',function(){FMT=this.getAttribute('data-fmt');render('export-chooser')});
 }
 list=root.querySelectorAll('[data-lay]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('click',function(){
   if(this.getAttribute('aria-disabled')==='true')return;
   LAYOUT=this.getAttribute('data-lay');render('export-chooser');
  });
 }
 /* 输入即时刷新「已填 / 待填」与计数，但不重绘整屏（重绘会丢焦点）。 */
 list=root.querySelectorAll('[data-k]');
 for(i=0;i<list.length;i++){
  list[i].addEventListener('input',function(){
   fset(this.getAttribute('data-k'),this.value);
   var mark=this.parentNode.querySelector('.fl i');
   if(mark){if(this.value.trim()){mark.setAttribute('data-on','1');mark.textContent='已填'}else{mark.removeAttribute('data-on');mark.textContent='待填'}}
   var st=root.getAttribute('data-state'),prim=root.querySelector('[data-testid="'+SCREEN+'-primary"]');
   if(prim&&(st==='input-basic'||st==='validate-name'))prim.setAttribute('aria-disabled',F.basic.name.trim()?'false':'true');
   if(prim&&(st==='input-intention'||st==='validate-position'))prim.setAttribute('aria-disabled',F.intention.position.trim()?'false':'true');
  });
 }
}

/* ================= 路由：夹具门 + fail-closed ================= */
function resolveState(){
 var raw=Q.get('state');
 if(Q.get('seg')!==null&&!SEGS[Q.get('seg')])return 'illegal';
 if(Q.get('format')!==null&&FMTFILE[Q.get('format')]===undefined)return 'illegal';
 if(raw===null||raw===''){
  if(TASKID!==null)return 'preview-no-result';   /* 39 的会员回看深链：没有凭证就是空态 */
  return 'entry';
 }
 if(STATES.indexOf(raw)<0)return 'illegal';
 if(FIXTURE[raw]&&!(CAPTURE||DEBUG))return PREVIEW_VIEW[raw]?'preview-no-result':'session-lost';
 return raw;
}
var START=resolveState();
/* 夹具态要有内容才成立：稀疏夹具只给 preview-hints（用来证明提示是算出来的）。 */
if(FIXTURE[START]){
 if(START==='preview-hints'){F=seedThin();POLKEY='thin'}
 else{F=seedFull();POLKEY='main'}
}
/* 导出格式可以由地址栏指定，方便逐个格式核对「能不能打印」这条判断；
   未登记取值在 resolveState 就已经拦成 illegal，这里只处理登记过的。 */
if(Q.get('format')!==null&&FMTFILE[Q.get('format')]!==undefined)FMT=Q.get('format');
/* 这一屏演示的是「服务端没给打印链接」，夹具显式钉在 TXT 上，不受 ?format= 影响。 */
if(START==='export-print-unavailable')FMT='txt';
render(START);

var demoPanel=null;
function markDemo(st){
 if(!demoPanel)return;
 var links=demoPanel.querySelectorAll('a'),i;
 for(i=0;i<links.length;i++)links[i].className=(links[i].getAttribute('data-proto-state')===st?'on':'');
}
if(DEBUG){
 document.documentElement.classList.add('debug');
 var tab=document.createElement('button');
 tab.type='button';tab.className='demo-tab';tab.setAttribute('data-proto-control','true');
 tab.setAttribute('aria-label','打开原型演示控制面板');tab.setAttribute('aria-expanded','false');
 tab.textContent='演示';
 demoPanel=document.createElement('div');
 demoPanel.className='demo-panel';demoPanel.setAttribute('data-proto-control','true');
 demoPanel.setAttribute('aria-label','原型演示控制');
 var t=document.createElement('div');t.className='dp-t';t.textContent='原型演示控制（非产品功能）';demoPanel.appendChild(t);
 for(var n=0;n<STATES.length;n++){
  var link=document.createElement('a');
  link.href=to(STATES[n]);link.textContent=STATES[n];
  link.setAttribute('data-proto-state',STATES[n]);
  demoPanel.appendChild(link);
 }
 /* 导出格式那三种「暂不开放打印」的屏，光靠状态名进不去，得连格式一起指定。 */
 var t2=document.createElement('div');t2.className='dp-t';t2.textContent='导出格式（export-ready）';demoPanel.appendChild(t2);
 var FKS=['pdf','docx','txt','md'];
 for(var g=0;g<FKS.length;g++){
  var fl=document.createElement('a');
  fl.href=to('export-ready')+'&format='+FKS[g];
  fl.textContent='export-ready · '+FKS[g].toUpperCase();
  demoPanel.appendChild(fl);
 }
 var fbad=document.createElement('a');
 fbad.href=to('export-ready')+'&format=nope';fbad.textContent='非法 format（fail-closed）';
 demoPanel.appendChild(fbad);
 document.getElementById('stage').appendChild(tab);
 document.getElementById('stage').appendChild(demoPanel);
 tab.addEventListener('click',function(){
  var open=!demoPanel.classList.contains('show');
  demoPanel.classList.toggle('show',open);
  tab.setAttribute('aria-expanded',open?'true':'false');
 });
 markDemo(START);
}

/* 时钟：只刷新顶栏时间文本，不改 data-state，也不推进任何业务状态。 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(FLAT)document.getElementById('stage').classList.add('flat');
</script>
</body>
</html>
