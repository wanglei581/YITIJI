function tick(){var d=new Date;clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,10000);

var qs=new URLSearchParams(location.search);
var DEBUG=qs.get('debug')==='1',FLAT=qs.get('flat')==='1',CAPTURE=qs.get('capture');
if(FLAT)document.documentElement.classList.add('flat');
if(DEBUG)document.documentElement.classList.add('debug');

/* ── 唯一状态源 ───────────────────────────────────────────────────────────────
   每个状态只有一个渲染函数；渲染完不再有第二段脚本改写已渲染的 DOM。
   （旧版先画 5/10/15 分钟再由后置脚本覆写成 3/5/8，那是两个互相矛盾的来源，已删。
     时长取值只有 3/5/8，与 shared 的 InterviewDuration 一致。） */
var STATES=['setup','setup-resume-phone','setup-resume-usb','setup-resume-local','setup-resume-uploading',
  'setup-resume-ready','setup-resume-failed','setup-resume-preview',
  'session-text','session-voice','mic-denied',
  'transcript-review','transcript-empty','transcript-failed',
  'network-error','session-expired',
  'report-pending','report-loading','report-ready','report-unavailable',
  'report-print-pending','report-print-ready','report-print-handoff','report-print-failed',
  'reports-guest','reports-loading','reports-empty-member','reports-ready',
  'reports-deleting','reports-delete-done','reports-delete-failed','reports-error',
  'tips','ai-down'];
var ALIAS={report:'report-ready','reports-empty':'reports-guest'};
var rawState=qs.get('state')||'setup';
var state=Object.prototype.hasOwnProperty.call(ALIAS,rawState)?ALIAS[rawState]:rawState;

function urlFor(s){var p=new URLSearchParams(location.search);p.set('state',s);return '?'+p.toString()}
function go(s){location.search=urlFor(s)}
function mark(s){body.dataset.state=s;body.dataset.testid='interview-state-'+s}
function base(t,d){ask.innerHTML=t;doing.innerHTML=d;face.classList.remove('live')}
/* p=true 走主按钮；同屏出现第二个次要按钮时传 tid，避免 interview-fallback 撞名。 */
function btn(h,t,p,tid){return '<a class="btn '+(p?'primary':'')+'" href="'+urlFor(h)+'" data-testid="'+(p?'interview-primary':(tid||'interview-fallback'))+'">'+t+(p?'<em>→</em>':'')+'</a>'}
function link(h,t,p){return '<a class="btn '+(p?'primary':'')+'" href="'+h+'" '+(p?'data-testid="interview-primary"':'data-testid="interview-fallback"')+'>'+t+(p?'<em>→</em>':'')+'</a>'}
function act(id,t,p){return '<button type="button" class="btn '+(p?'primary':'')+'" id="'+id+'" '+(p?'data-testid="interview-primary"':'data-testid="interview-fallback"')+'>'+t+(p?'<em>→</em>':'')+'</button>'}
function rail(){return '<div class="rail"><span>只供本人练习参考</span><span>不发送给任何企业</span><span>不预测录用结果</span></div>'}
function statusbar(label,items){var h='<section class="statusbar" aria-label="'+label+'">';
  for(var i=0;i<items.length;i++)h+='<div><small>'+items[i][0]+'</small><b'+(items[i][2]?' class="'+items[i][2]+'"':'')+'>'+items[i][1]+'</b></div>';
  return h+'</section>'}
function optlist(rows){var h='<div class="optlist">';
  for(var i=0;i<rows.length;i++){var r=rows[i];
    h+=(r.href?'<a class="opt'+(r.go?' go':'')+'" href="'+r.href+'">':'<button class="opt'+(r.go?' go':'')+'" type="button"'+(r.id?' id="'+r.id+'"':'')+'>')
      +'<i>'+r.k+'</i><div class="t"><b>'+r.t+'</b><p>'+r.d+'</p></div><em>›</em>'+(r.href?'</a>':'</button>');}
  return h+'</div>'}
function steps(rows){var h='<div class="steps" style="margin-top:16px">';
  for(var i=0;i<rows.length;i++)h+='<div class="step"><small>'+rows[i][0]+'</small><b>'+rows[i][1]+'</b><p>'+rows[i][2]+'</p></div>';
  return h+'</div>'}
function mini(rows){var h='<div class="mini-list">';
  for(var i=0;i<rows.length;i++)h+='<div><small>'+rows[i][0]+'</small><p>'+rows[i][1]+'</p></div>';
  return h+'</div>'}

/* ── setup：本场练习设置 + 简历来源真实操作区 ─────────────────────────────────
   简历来源是三条**已存在**的通道：手机扫码（冻结入口，不在本页新做手机端页面）、
   U 盘导入、本机文件（桌面验证）。三条最终都落到同一次上传，拿到 fileId 之后
   才作为 CreateInterviewInput.resumeFileId 带进这场练习。 */
var RES='idle';
var RES_STATE={idle:'setup',phone:'setup-resume-phone',usb:'setup-resume-usb',local:'setup-resume-local',
  uploading:'setup-resume-uploading',ready:'setup-resume-ready',failed:'setup-resume-failed',preview:'setup-resume-preview'};
var RES_FROM={};for(var rk in RES_STATE)RES_FROM[RES_STATE[rk]]=rk;
var CHANNELS=[['phone','手机扫码上传','把简历传到这台机器'],['usb','U 盘导入','只读取你插入的这只盘'],['local','本机文件（桌面验证）','一体机默认不走这条']];

function choiceGroup(label,values,selected){
  var h='<div class="copy" style="margin-top:16px">'+label+'</div><div class="chips" data-choice="'+label+'">';
  for(var i=0;i<values.length;i++)h+='<button type="button" class="chip'+(values[i]===selected?' on':'')+'" aria-pressed="'+(values[i]===selected)+'">'+values[i]+'</button>';
  return h+'</div>'}
function pvPages(n){var h='<div class="pv">';
  for(var i=0;i<n;i++){h+='<div class="pvpage">';
    for(var j=0;j<7;j++)h+='<div class="pvline" style="width:'+(96-((i*13+j*17)%42))+'%"></div>';
    h+='<span>第 '+(i+1)+' 页 · 排版示意</span></div>'}
  return h+'</div>'}

/* 打印版文件夹具：字段与 InterviewPrintResponse（packages/shared/src/types/mockInterview.ts）逐个对应。
   取值是本原型的合成夹具，不是任何一次真实生成的结果；filename 按服务端模板
   `模拟面试练习报告_{position}.pdf` 写，expiresAt 是 signedUrl 的到期时间（uploaded.signedUrlExpiresAt），
   不是文件留存期限。printFileUrl 是系统 HMAC content URL，只给 /print/jobs 用，页面上不展示完整串。 */
var PFILE={
  fileId:'iv_rep_5c1d8f2a',
  filename:'模拟面试练习报告_前端开发工程师.pdf',
  mimeType:'application/pdf',
  sizeBytes:214016,
  pageCount:3,
  signedUrl:'一次性签名链接（预览 / 下载用，不展示完整串）',
  expiresAt:'今天 10:24',
  printFileUrl:'系统 HMAC content URL（仅 /print/jobs 可用，不进地址栏）'
};
function kb(n){return n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB'}
function fieldRows(rows,cols){var h='<div class="fields kv'+(cols===3?' kv3':'')+'">';
  for(var i=0;i<rows.length;i++)h+='<div class="field"><small>'+rows[i][0]+'</small><b'+(rows[i][2]?' class="mono"':'')+'>'+rows[i][1]+'</b></div>';
  return h+'</div>'}
/* 静态跳转只带非敏感参数：fileId / 页数 / 打印参数 / 来源。签名链接与 printFileUrl 一律不进 URL。 */
function printHandoffHref(){
  return '14-print-confirm.html?source=interview-report&fileId='+encodeURIComponent(PFILE.fileId)
    +'&pages='+PFILE.pageCount+'&copies=1&duplex=single&color=bw'}

      +'<div class="filerow"><i>DOC</i><div class="fm"><b>示例条目结构 · 文件名</b><p>不支持的格式会在导入前被挡下并说明原因</p></div>'
      +'<button type="button" class="res-btn" data-res="upload">导入</button></div>'
      +'<div class="res-acts"><button type="button" class="res-btn" data-res="idle">换一种来源</button></div></div>';
  }else if(RES==='local'){
    h+='<div class="res-panel"><div class="rp-h">本机文件（桌面验证）<span>一体机默认不走这条</span></div>'
      +'<p class="res-p">这条来源会打开系统文件选择框，<b>一体机全屏模式下不使用</b>；保留它是为了在桌面浏览器验证同一条上传链路。</p>'

      +'<button type="button" class="res-btn" data-res="idle">换一种来源</button></div></div>';

function resumeActions(){
  if(RES==='uploading')return act('res-cancel','取消上传')+act('res-fail','演示：上传失败')+act('res-ok','演示：上传成功',true);
  if(RES==='ready')return act('res-preview','完整预览')+btn('session-text','创建并开始练习',true);
  if(RES==='failed')return act('res-retry','重试上传')+btn('session-text','不用简历，开始练习',true);
  if(RES==='preview')return act('res-close','关闭预览')+btn('session-text','用这份简历开始练习',true);
  return btn('tips','先看面试技巧')+btn('session-text','创建并开始练习',true);
}
function paintResume(){
  var zone=document.getElementById('resume-zone');
  if(!zone)return;
  zone.innerHTML='<div class="head"><b>简历（可选）</b><span>'+(RES==='ready'?'已选用 1 份':'不上传也能开始')+'</span></div>'+resumePanel();
  actions.innerHTML=resumeActions();
  bindResume();
}
function setResume(p){
  RES=p;
  var s=RES_STATE[p];
  mark(s);
  try{history.replaceState(null,'',urlFor(s))}catch(e){}
  paintResume();
}
function bindResume(){
  var zone=document.getElementById('resume-zone');
  if(zone)zone.querySelectorAll('[data-res]').forEach(function(el){
    el.onclick=function(){var v=el.getAttribute('data-res');setResume(v==='upload'?'uploading':v)}});
  var m={'res-cancel':'idle','res-fail':'failed','res-ok':'ready','res-preview':'preview','res-retry':'uploading','res-close':'ready'};
  for(var id in m)(function(id,p){var b=document.getElementById(id);if(b)b.onclick=function(){setResume(p)}})(id,m[id]);
}

function setup(){
  RES=RES_FROM[state]||'idle';
  mark(RES_STATE[RES]);
  base('面试前，<em>先设置一场练习</em>。','选定岗位、面试官和时长后才创建会话；语音能否使用，还要由服务与麦克风能力实际确认。');
  body.innerHTML=statusbar('本场练习条件',[['文字回答','可用','ok'],['语音回答','需先检测'],['练习报告','完成后生成']])
    +'<section class="card"><div class="head"><b>本场练习设置</b><span>与 CreateInterviewInput 字段一致</span></div>'
    +'<div class="fields"><label class="field"><small>目标岗位（必填，最多 50 字）</small>'
    +'<input id="interview-position" maxlength="50" placeholder="输入岗位，例：前端开发工程师"></label>'
    +'<label class="field"><small>行业（必填，最多 30 字）</small>'
    +'<input id="interview-industry" maxlength="30" placeholder="输入或从就业行业清单选择"></label></div>'
    +choiceGroup('岗位快捷项（只是快捷值，可自由输入）',['前端开发工程师','行政专员','市场运营','机械工程师','会计','销售代表'],'')
    +choiceGroup('面试官类型',['HR 初筛','业务主管','技术面试官','校招面试官','终面负责人'],'HR 初筛')
    +choiceGroup('经验',['应届生','1 年以内','1-3 年','3-5 年','5 年以上','转行求职'],'应届生')
    +choiceGroup('难度',['轻松练习','标准面试','压力面试'],'标准面试')
    +choiceGroup('时长',['3 分钟','5 分钟','8 分钟'],'5 分钟')
    +choiceGroup('交互方式',['纯文字','语音回合（文字兜底）'],'纯文字')
    +'</section>'
    +'<section class="card product-support" id="resume-zone"></section>'
    +'<section class="card"><div class="head"><b>练习会经历三步</b><span>按实际状态推进</span></div>'
    +steps([['第 1 步','创建配置','记录岗位、难度和时长，不等于已经生成题目。'],
            ['第 2 步','逐题作答','文字是硬兜底；语音需转写后由你确认。'],
            ['第 3 步','生成练习报告','报告只在真实会话完成后生成，不给固定评分。']])+'</section>'
    +'<section class="notice"><i>i</i><div><b>模拟面试不是企业面试。</b>不代表任何企业、不会发出面试邀请，也不用于候选人筛选或录用判断。</div></section>'
    +rail();
  paintResume();
  body.querySelectorAll('[data-choice] .chip').forEach(function(x){x.onclick=function(){
    x.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');c.setAttribute('aria-pressed','false')});
    x.classList.add('on');x.setAttribute('aria-pressed','true');
    if(x.parentNode.getAttribute('data-choice').indexOf('岗位快捷项')===0)document.getElementById('interview-position').value=x.textContent}});
}

/* ── 作答 ─────────────────────────────────────────────────────────────────── */
var QUESTION='请讲一段你最有代表性的项目经历：当时的目标、你的职责和结果分别是什么？';
function answerBox(id){return '<textarea class="answer-input" id="'+id+'" maxlength="2000" aria-label="本题回答" placeholder="在这里输入你的回答，最多 2000 字"></textarea>'}

  mark('session-text');
  base('第 2 题，<em>用真实经历回答</em>。','文字输入始终可用；题目、剩余时间与下一题只能由当前会话返回，不能用静态内容冒充真实进度。');

    +'<section class="card"><div class="head"><b>我的回答</b><span>文字输入 · 最多 2000 字</span></div>'

    +'<section class="card"><div class="head"><b>回答时可以这样组织</b><span>只作本题提示</span></div>'
    +mini([['背景','先交代项目要解决什么问题。'],['行动','突出你本人做了哪些关键工作。'],['结果','只使用自己能核实的成果和数字。']])+'</section>'

function bindAnswer(ta,cnt,err,sub,next){
  var t=document.getElementById(ta),c=document.getElementById(cnt),e=document.getElementById(err),b=document.getElementById(sub);
  if(!t)return;
  t.addEventListener('input',function(){c.textContent=t.value.length+' / 2000';if(t.value.trim())e.hidden=true});
  if(b)b.onclick=function(){if(!t.value.trim()){e.hidden=false;t.focus();return}go(next)};
}

/* ── 转写确认：可编辑 + 恢复原文 + 确认 + 异常 ───────────────────────────────
   ASR 返回文本 ≠ 本轮回答。必须由用户在这一页改完再确认，
   提交时把「是否改过」如实带出去（transcriptEdited）。 */
var TRANSCRIPT='我负责了页面组件拆分和性能优化，重点解决了首屏加载慢的问题，最后把主要操作路径做得更清楚。';
function review(){
  mark('transcript-review');
  base('请先<em>确认转写文本</em>。','系统不能替你把识别结果当作最终回答；改完并确认之后，才作为本轮文字提交。');
  body.innerHTML=statusbar('转写确认状态',[['语音转写','已返回','ok'],['本轮回答','未提交'],['文本','未修改']])
    +'<section class="card"><div class="head"><b>转写结果</b><span>可直接修改 · 触屏键盘可用</span></div>'
    +'<textarea class="tarea" id="tr-text" maxlength="2000" aria-label="转写文本，可编辑"></textarea>'
    +'<div class="tbar"><button type="button" class="res-btn" id="tr-restore">恢复原文</button>'
    +'<button type="button" class="res-btn" id="tr-clear">清空重写</button>'
    +'<a class="res-btn" href="'+urlFor('session-voice')+'">重新录音再转写</a>'
    +'<span class="cnt" id="tr-count">0 / 2000</span></div>'
    +'<p class="msg" id="tr-err" role="alert" hidden>确认文本不能为空。请修改后再确认，或选择重新录音、改用文字输入。</p>'
    +'<p class="res-p">改动只发生在这一页。提交时会如实带上「本轮为语音输入」与「文本是否被你改过」，不会把识别原文冒充成你确认过的回答。</p></section>'
    +'<section class="card"><div class="head"><b>确认前核对这三处</b><span>识别最容易出错的地方</span></div>'
    +mini([['人名与数字','数量、比例和时间最容易听错。'],['专业词与缩写','技术名词按你原本的说法改回。'],['被吞掉的句子','补上没被识别到的关键一句。']])+'</section>'
    +'<section class="card"><div class="head"><b>转写不正常时</b><span>两种真实返回</span></div>'
    +'<div class="res-acts"><a class="res-btn" href="'+urlFor('transcript-empty')+'">返回的是空文本</a>'
    +'<a class="res-btn warn" href="'+urlFor('transcript-failed')+'">转写请求失败</a>'
    +'<a class="res-btn" href="'+urlFor('session-text')+'">改用文字输入重写</a></div></section>'
    +'<section class="notice"><i>i</i><div><b>音频转写不等于语音能力评估。</b>练习报告不据此评价语速、语调或情绪稳定性；本场只按你确认后的文本做内容练习。</div></section>'
    +rail();
  actions.innerHTML=btn('session-voice','重新录音')+act('tr-submit','确认并提交',true);
  var t=document.getElementById('tr-text'),c=document.getElementById('tr-count'),e=document.getElementById('tr-err'),
      dirty=body.querySelectorAll('.statusbar b')[2];
  t.value=TRANSCRIPT;
  function sync(){c.textContent=t.value.length+' / 2000';
    var changed=t.value!==TRANSCRIPT;
    dirty.textContent=changed?'已修改':'未修改';dirty.className=changed?'ok':'';
    if(t.value.trim())e.hidden=true}
  sync();
  t.addEventListener('input',sync);
  document.getElementById('tr-restore').onclick=function(){t.value=TRANSCRIPT;sync();t.focus()};
  document.getElementById('tr-clear').onclick=function(){t.value='';sync();t.focus()};
  document.getElementById('tr-submit').onclick=function(){
    if(!t.value.trim()){e.hidden=false;t.focus();return}
    // 提交这一题 → 回作答态继续下一题；结束整场由「结束本场」出口负责。
    // 原来直接 go('report-pending')，导致提交一题就结束全场，5 题走不到第 3 题。
    go('session-text')};
}

  base('登录后，<em>只查看自己的报告</em>。','下面展示已加载历史列表的产品结构，不代表当前账号真的有这些成绩或记录；实际内容由服务端返回。');
  body.innerHTML=statusbar('记录列表状态',[['本人列表','已返回','ok'],['查看','仅限有报告的记录'],['删除','需二次确认']])
    +'<section class="card"><div class="head"><b>练习报告</b><span>已登录 · 本人记录</span></div>'
    +'<p class="copy">仅有真实报告的记录显示「查看」。没有报告的记录不应被伪装成可打印或有评分。</p>'
    +historyRows('ready')+'</section>'
    +'<section class="card"><div class="head"><b>列表上的三个动作</b><span>各自的前提</span></div>'
    +steps([['动作 1','查看报告','只对已生成报告的记录开放。'],
            ['动作 2','生成打印版','进入报告页后才请求打印文件。'],
            ['动作 3','删除记录','二次确认后才向服务端发起。']])+'</section>'
    +'<section class="notice"><i>i</i><div><b>删除需要再次确认。</b>确认后才请求删除本人记录；服务端确认成功才从列表移除，失败时保留原列表并显示实际错误。</div></section>'
    +rail();
  actions.innerHTML=btn('setup','开始新练习',true)+btn('reports-empty-member','查看空记录状态');
  var remove=body.querySelector('[data-testid="interview-history-delete"]');
  remove.onclick=function(){
    if(remove.dataset.confirm==='1'){go('reports-deleting')}
    else{remove.dataset.confirm='1';remove.textContent='再次确认删除';remove.classList.add('confirm');
      remove.setAttribute('aria-label','再次点击确认删除这条练习记录')}};
}
function reportsDeleting(){
  mark('reports-deleting');
  base('正在<em>请求删除这条记录</em>。','删除请求已发出，但服务端还没有确认。没确认之前，这条记录仍然留在列表里。');
  body.innerHTML=statusbar('删除进行状态',[['本次操作','请求中'],['目标记录','仍在列表','ok'],['报告文件','未清理']])
    +'<section class="card"><div class="head"><b>练习报告</b><span>删除请求中 · 记录保留</span></div>'
    +'<p class="copy">这条记录暂时不能再点删除或查看，避免重复发起同一次删除；其它记录不受影响。</p>'
    +historyRows('deleting')+'</section>'
    +'<section class="card voicebox"><div><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>'
    +'<div class="record load"><i></i>等待服务端确认删除结果</div></div></section>'
    +'<section class="card"><div class="head"><b>返回结果只会是三种</b><span>由服务端决定</span></div>'
    +steps([['结果 A','确认删除','这条记录从本人列表移除，其它记录不动。'],['结果 B','删除失败','记录留在原处，显示服务端返回的原因。'],['结果 C','请求超时','按失败处理，仍需你再次确认后才重发。']])+'</section>'

}

/* ── 技巧 / AI 不可用 / 非法参数 ─────────────────────────────────────────── */
function tips(){
  mark('tips');
  base('先把<em>准备方法</em>练熟。','这是公开的面试准备工作台，不把静态技巧伪装成根据你的简历自动生成的建议。');
  body.innerHTML='<section class="card"><div class="head"><b>面试前准备清单</b><span id="tip-progress">0 / 6 已完成</span></div>'
    +'<div class="checklist"><button class="check" type="button"><i></i>背景调研与岗位关键词</button>'
    +'<button class="check" type="button"><i></i>准备真实经历与细节</button>'
    +'<button class="check" type="button"><i></i>练习 1 分钟自我介绍</button>'
    +'<button class="check" type="button"><i></i>核对材料、时间和路线</button>'
    +'<button class="check" type="button"><i></i>确认线上设备与网络</button>'
    +'<button class="check" type="button"><i></i>把问题写成 STAR 结构</button></div></section>'
    +'<section class="card"><div class="head"><b>回答一题的基本结构</b><span>STAR 练习法</span></div>'
    +steps([['S / T','说清背景和任务','交代情境、目标和你承担的角色。'],
            ['A','说明你的行动','聚焦本人做了什么，不只讲团队。'],
            ['R','核对真实结果','数字和成果由本人核实，不用编造。']])+'</section>'
    +'<section class="card"><div class="head"><b>高频问题应对</b><span>点开看回答思路</span></div>'
    +'<div class="faq-row"><button type="button" data-testid="interview-tip-faq">请简单自我介绍一下？<span>＋</span></button>'
    +'<p hidden><b>回答结构：</b>我是谁 + 我做过什么 + 一个真实核心成绩 + 为什么适合目标岗位。不要逐条背诵简历或编造经历。</p></div>'
    +'<div class="faq-row"><button type="button">你为什么想应聘这个岗位？<span>＋</span></button>'
    +'<p hidden><b>回答结构：</b>说明岗位理解、自己的对应能力和希望解决的问题，避免只说「想找一份工作」。</p></div>'
    +mini([['30 秒','身份、核心优势、岗位动机。'],['1 分钟','加上一段真实经历和成果。'],['3 分钟','补充两三段经历与发展方向。']])+'</section>'
    +'<section class="notice"><i>i</i><div>这份技巧不构成个性化职业建议。想让 AI 根据真实材料辅助练习时，需要先完成可用性检查并在真实流程中创建会话。</div></section>'
    +rail();
  actions.innerHTML=btn('setup','设置一场练习',true)+link('05-ai-cockpit.html','AI顾问');
  body.querySelectorAll('.check').forEach(function(x){x.onclick=function(){
    x.classList.toggle('on');x.querySelector('i').textContent=x.classList.contains('on')?'✓':'';
    document.getElementById('tip-progress').textContent=body.querySelectorAll('.check.on').length+' / 6 已完成'}});
  body.querySelectorAll('.faq-row button').forEach(function(x){x.onclick=function(){
    var p=x.parentNode.querySelector('p'),open=p.hidden;p.hidden=!open;x.querySelector('span').textContent=open?'－':'＋'}});
}

  body.innerHTML=statusbar('当前能力状态',[['AI 出题与追问','不可用','off'],['练习报告','不可生成','off'],['文字练习与技巧','可用','ok']])

    +optlist([{k:'1',t:'用 STAR 结构写一题',d:'公开清单可勾选，写完自己核对背景、行动与结果。',href:urlFor('tips'),go:true},

    +rail();
  actions.innerHTML=btn('tips','查看面试技巧')+btn('setup','返回练习说明',true);

    +'<section class="card"><div class="head"><b>可以继续</b><span>选择一个有效入口</span></div>'

}

var RENDER={'session-text':sessionText,'session-voice':sessionVoice,'mic-denied':denied,

  'report-print-handoff':reportPrintHandoff,'report-print-failed':reportPrintFailed,
  'reports-guest':reportsGuest,'reports-loading':reportsLoading,'reports-empty-member':reportsEmptyMember,

for(var i=0;i<STATES.length;i++)if(STATES[i].indexOf('setup')===0)RENDER[STATES[i]]=setup;
(RENDER[state]||illegalState)();

/* ---------- 原型演示控制：仅 debug=1 注入 DOM，普通 / ?state / ?capture / ?flat 及组合 URL 一律不渲染 ---------- */
if(DEBUG){
  var demoHref=function(s){var p=new URLSearchParams();p.set('state',s);p.set('debug','1');
    if(FLAT)p.set('flat','1');if(CAPTURE!==null)p.set('capture',CAPTURE);return '?'+p.toString()};
  var tab=document.createElement('button');
  tab.type='button';tab.className='demo-tab';tab.setAttribute('data-proto-control','true');
  tab.setAttribute('aria-label','打开原型演示控制面板');tab.setAttribute('aria-expanded','false');tab.textContent='演示';
  var panel=document.createElement('div');
  panel.className='demo-panel';panel.setAttribute('data-proto-control','true');panel.setAttribute('aria-label','原型演示控制');
  panel.innerHTML='<div class="dp-t">状态</div>'+STATES.map(function(s){
    return '<a href="'+demoHref(s)+'" data-proto-control="true" data-s="'+s+'"'+(s===state?' class="on"':'')+'>'+s+'</a>'}).join('');
  tab.addEventListener('click',function(){var open=panel.classList.toggle('show');tab.setAttribute('aria-expanded',open?'true':'false')});
  stage.appendChild(tab);stage.appendChild(panel);
}
})();
