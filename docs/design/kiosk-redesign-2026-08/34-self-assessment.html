/* 把 5 维度 × 5 题摊平成 1..25：顺序与 SelfAssessmentFlow.tsx 的推进顺序一致
   （同一维度内按 idx 递增，走完一个维度再进下一个维度）。 */
var DIMS=SA_V1.dimensions.map(function(d){return{key:d.key,label:d.label,count:d.questions.length}});
var Q=[];SA_V1.dimensions.forEach(function(d,di){d.questions.forEach(function(q){
  Q.push({n:Q.length+1,dimKey:d.key,dim:d.label,dimIndex:di,idx:q.idx,p:q.prompt,c:q.choices.map(function(c){return[c.key,c.label]})});
})});
var TOTAL=Q.length;                              /* = 25，由题库真值算出，不写死 */

/* ------------------------------------------------------------------ 本次会话
   只用 sessionStorage，只属于当前浏览器标签；不是账号数据，也不上传。
   **不存任何时间戳** —— 静态原型没有服务端，存下来也只会诱使页面显示一个假的完成时刻。 */
var KEY='sa_static_proto_v1';
function blank(){return{v:2,consented:false,answers:{},cursor:1,submitted:false}}
function load(){
  var s=blank();
  try{
    var raw=sessionStorage.getItem(KEY);if(!raw)return s;
    var o=JSON.parse(raw);if(!o||o.v!==2)return s;
    s.consented=o.consented===true;
    /* 答案必须是从第 1 题开始的连续前缀：本页不允许跳题，被改坏的会话按前缀截断。 */
    var a={},src=o.answers||{};
    for(var i=1;i<=TOTAL;i++){var v=src[i];if(typeof v!=='string'||!Q[i-1].c.some(function(x){return x[0]===v}))break;a[i]=v}
    s.answers=a;
    var done=answered(s);
    s.cursor=Math.min(Math.max(1,parseInt(o.cursor,10)||1),Math.min(TOTAL,done+1));
    s.submitted=o.submitted===true&&done===TOTAL;
  }catch(e){return blank()}
  return s;
}
function save(s){try{sessionStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function wipe(){try{sessionStorage.removeItem(KEY)}catch(e){}}
function answered(s){var n=0;for(var i=1;i<=TOTAL;i++){if(s.answers[i])n++;else break}return n}
function dimDone(s,key){var n=0;Q.forEach(function(q){if(q.dimKey===key&&s.answers[q.n])n++});return n}
function dimOf(n){return Q[n-1]}

/* -------------------------------------------------------------------- 路由 */
var ALLOWED=['state','q','debug','flat','capture'],STATES=['intro','questions','review','result','history','ai-down'];
/* 渲染态 → 生产 route（真源 apps/kiosk/src/routes/index.tsx:111-114）。
   questions / result 在本页是同一页内的真实状态迁移，不另起 HTML；review 仍在答题流程内（提交前复核，
   React 侧同样没有独立 review 路由）；ai-down 是 intro 的降级态。
   recover-* / invalid 是 fail-closed 拦截面，不属于任何生产 route，故不进本表，也不写 data-route。 */
var ROUTE={intro:'/resume/self-assessment/intro',questions:'/resume/self-assessment/questions',review:'/resume/self-assessment/questions',result:'/resume/self-assessment/result',history:'/resume/self-assessment/history','ai-down':'/resume/self-assessment/intro'};
function routeOf(state){return ROUTE[state]||null}
var qs=new URLSearchParams(location.search);
var DEBUG=qs.get('debug')==='1',FLAT=qs.get('flat')==='1',CAPTURE=qs.get('capture');
if(FLAT){document.documentElement.classList.add('flat');document.documentElement.setAttribute('data-flat','1')}
function href(state,extra){
  var p=new URLSearchParams();p.set('state',state);
  if(extra&&extra.q)p.set('q',String(extra.q));
  if(DEBUG)p.set('debug','1');if(FLAT)p.set('flat','1');if(CAPTURE!==null)p.set('capture',CAPTURE);
  return '?'+p.toString();
}
function go(state,extra){location.href=href(state,extra)}

var session=load();
var bad=null;                                   /* invalid 的类别，只说类别不回显原值 */
for(var k of qs.keys()){if(ALLOWED.indexOf(k)<0){bad='param';break}}
var want=qs.get('state')||'intro';
if(!bad&&STATES.indexOf(want)<0)bad='state';
var wantQ=null,clamped=false;
if(!bad&&qs.has('q')){
  var raw=qs.get('q');
  if(!/^\d{1,2}$/.test(raw)||Number(raw)<1||Number(raw)>TOTAL)bad='question';else wantQ=Number(raw);
}

/* ------------------------------------------------------------ fail-closed 门禁 */
var view=bad?'invalid':want,reason=bad;
if(!bad){
  var done=answered(session);
  if(want==='questions'){
    if(!session.consented){view='recover';reason='consent'}
    else if(session.submitted){view='recover';reason='submitted'}
  }else if(want==='review'){
    if(!session.consented){view='recover';reason='consent'}
    else if(done<TOTAL){view='recover';reason='progress'}
  }else if(want==='result'){
    if(!(session.submitted&&done===TOTAL)){view=DEBUG?'result-synthetic':'recover';if(view==='recover')reason='result'}
  }
}
if(view==='recover')view='recover-'+reason;

/* 当前题号：URL 的 q 只能落在「已答数 + 1」以内，超出就夹回可作答的那一题。 */
var cursor=session.cursor||1;
if(view==='questions'){
  var reach=Math.min(TOTAL,answered(session)+1);
  cursor=Math.min(Math.max(1,wantQ||session.cursor||1),reach);
  if(wantQ&&wantQ>reach)clamped=true;
  if(session.cursor!==cursor){session.cursor=cursor;save(session)}
}

function mark(state,extra){
  bodyEl.dataset.state=state;bodyEl.dataset.testid='self-assessment-state-'+state;
  var route=routeOf(state);if(route)bodyEl.dataset.route=route;else bodyEl.removeAttribute('data-route');
  bodyEl.dataset.answered=String(answered(session));bodyEl.dataset.total=String(TOTAL);
  bodyEl.dataset.dims=String(DIMS.length);
  bodyEl.dataset.consented=session.consented?'true':'false';
  bodyEl.dataset.submitted=session.submitted?'true':'false';
  if(extra&&extra.q)bodyEl.dataset.q=String(extra.q);else bodyEl.removeAttribute('data-q');
  if(extra&&extra.dim)bodyEl.dataset.dim=extra.dim;else bodyEl.removeAttribute('data-dim');
  if(extra&&extra.reason)bodyEl.dataset.reason=extra.reason;else bodyEl.removeAttribute('data-reason');
  if(extra&&extra.fixture)bodyEl.dataset.fixture=extra.fixture;else bodyEl.removeAttribute('data-fixture');
}

function dimNames(sep){return DIMS.map(function(d){return d.label}).join(sep||'、')}

function viewQuestions(){
  var done=answered(session),q=Q[cursor-1],chosen=session.answers[cursor]||null,last=cursor===TOTAL,full=done===TOTAL;
  mark('questions',{q:cursor,dim:q.dimKey});
  askEl.innerHTML='第 '+cursor+' 题，<em>按真实想法选</em>。';
  doingEl.innerHTML='当前方向：<b>'+esc(q.dim)+'</b>（第 '+(q.dimIndex+1)+' / '+DIMS.length+' 个）。已答 '+done+' 题，还剩 '+(TOTAL-done)+' 题。';
  var answers=q.c.map(function(c){
    var on=chosen===c[0];
    return '<button type="button" class="answer m-press'+(on?' on':'')+'" role="radio" aria-checked="'+(on?'true':'false')+'" data-act="answer" data-arg="'+c[0]+'" data-choice="'+c[0]+'" data-testid="sa-answer"><i class="radio" aria-hidden="true"></i>'+esc(c[1])+'</button>';
  }).join('');
  /* 题号导航按维度分行：一行就是一个真实维度的 5 道题，既能回改，也能看出五个方向的进度。 */
  var reach=Math.min(TOTAL,done+1),grid='';
  DIMS.forEach(function(d,di){
    var n=dimDone(session,d.key),here=q.dimIndex===di;
    grid+='<div class="dl'+(here?' on':'')+(n===d.count?' full':'')+'" data-testid="sa-dim-row"><b>'+esc(d.label)+'</b><em>'+n+' / '+d.count+' 题</em></div>';
    for(var j=0;j<d.count;j++){
      var i=di*d.count+j+1,lock=i>reach;
      var cls=i===cursor?'cur':session.answers[i]?'done':lock?'lock':'';
      grid+='<button type="button" class="qcell'+(cls?' '+cls:'')+'" data-act="'+(lock?'locked':'goto')+'" data-arg="'+i+'"'+(lock?' aria-disabled="true"':'')+(i===cursor?' aria-current="true"':'')
        +' aria-label="第 '+i+' 题（'+esc(d.label)+'）'+(lock?'，答完前面的题才能进入':session.answers[i]?'，已作答，可修改':'，当前可作答')+'" data-testid="sa-map">'+i+'</button>';
    }
  });
  bodyEl.innerHTML='<section class="card progress" data-testid="sa-progress"><div class="prow"><b>第 '+cursor+' 题 / 共 '+TOTAL+' 题</b><span>本次作答不计时</span></div>'
  +'<div class="bar"><i style="width:'+(done/TOTAL*100).toFixed(2)+'%"></i></div>'
  +'<div class="task"><span>已答 <b>'+done+'</b> 题</span><span>还剩 <b>'+(TOTAL-done)+'</b> 题</span><span>方向 <b>'+esc(q.dim)+'</b></span><span>没有倒计时</span><span>可返回修改</span></div></section>'
  +'<section class="card"><div class="qnum">第 '+cursor+' 题<em>'+esc(q.dim)+'</em></div>'
  +'<h2 class="question" id="sa-q" data-testid="sa-prompt">'+esc(q.p)+'</h2>'
  +'<p class="qhint">选你平时更舒服的那一项，不用揣摩哪个答案更好；选完还可以改。</p>'
  +'<div class="answers" role="radiogroup" aria-labelledby="sa-q" data-testid="self-assessment-list">'+answers+'</div></section>'
  +'<section class="card"><div class="hd">'+TOTAL+' 题按 '+DIMS.length+' 个方向分行<span>深色＝当前题 · 浅绿＝已答可改 · 虚线＝答完前面才开放</span></div>'
  +'<div class="dimgrid" data-testid="sa-question-map">'+grid+'</div>'
  +'<div class="quickrow"><button type="button" class="quick m-press" data-act="restart" data-testid="sa-quick"><i>↻</i>重新开始（清空本次 '+done+' 个答案）</button>'
  +'<button type="button" class="quick m-press" data-act="exit" data-testid="sa-quick"><i>✕</i>退出并清空，回简历服务</button></div></section>'
  +gate(!chosen,chosen
    ?(last?(full?'<b>'+TOTAL+' 题都已作答。</b>可以进入提交前确认，确认页还能逐题回来改。':'<b>本题已选择。</b>前面还有没答的题，先把题号里空着的补上。')
          :'<b>本题已选择。</b>可以进入下一题，之后也能从题号回来改。')
    :(clamped?'<b>还没有选择本题的答案，暂时不能前进。</b>你打开的题号超过了本次可作答的位置，已经回到第 '+cursor+' 题。'
             :'<b>还没有选择本题的答案，暂时不能前进。</b>选中一项后，「'+(last?'去提交前确认':'下一题')+'」才会变为可用。'))
  +rail();
  actionsEl.innerHTML=(cursor===1
    ?actionBtn({link:href('intro'),label:'返回说明'})
    :actionBtn({act:'prev',label:'上一题'}))
  +actionBtn({primary:true,act:chosen?(last?'review':'next'):null,blocked:!chosen,label:last?'去提交前确认':'下一题'});
}

/* ------------------------------------------------------------------- review */
function viewReview(){
  var submitted=session.submitted;
  mark('review',{reason:submitted?'after-submit':'before-submit'});
  askEl.innerHTML=submitted?'这是你<em>已提交的 '+TOTAL+' 个选择</em>。':'提交前，<em>先检查这 '+TOTAL+' 个选择</em>。';
  doingEl.innerHTML=submitted
    ?'本次已提交，页面不再改动这些答案；<b>要换答案只能重新开始一次新的作答。</b>'
    :TOTAL+' 题已全部作答。<b>确认提交后只记录本次已完成，不生成评分、人格类型或岗位结论。</b>';
  /* 与答题页同一套「一行一个维度」布局：既是五维度完成情况，也是逐题回改入口。 */
  var grid='';
  DIMS.forEach(function(d,di){
    var n=dimDone(session,d.key);
    grid+='<div class="dl'+(n===d.count?' full':'')+'" data-testid="sa-dim-row"><b>'+esc(d.label)+'</b><em>'+n+' / '+d.count+' 题</em></div>';
    for(var j=0;j<d.count;j++){
      var i=di*d.count+j+1,item=Q[i-1];
      var label=(item.c.find(function(c){return c[0]===session.answers[i]})||['','—'])[1];
      var inner='<small>第 '+i+' 题</small><b>'+esc(label)+'</b>';
      grid+=submitted
        ?'<div class="rv" data-testid="sa-review-item">'+inner+'</div>'
        :'<button type="button" class="rv m-press" data-act="goto" data-arg="'+i+'" aria-label="回到第 '+i+' 题修改（'+esc(d.label)+'），当前选择：'+esc(label)+'" data-testid="sa-review-item">'+inner+'</button>';
    }
  });
  bodyEl.innerHTML='<section class="card result-lead"><div class="hd">'+(submitted?'本次作答已提交':'本次 '+TOTAL+' 题已全部作答')+'<span>'+(submitted?'本次会话已提交':'提交前可以逐题回去改')+'</span></div>'
  +'<div class="task"><span>已答 <b>'+TOTAL+'</b> 题</span><span>'+DIMS.length+' 个方向各 <b>5</b> 题</span><span>'+(submitted?'已提交':'尚未提交')+'</span><span>只存在于本次会话</span></div></section>'
  +'<section class="card"><div class="hd">你这次选了什么<span>'+(submitted?'只读回看，按方向分行':'点任意一项即可回去修改')+'</span></div><div class="dimgrid" data-testid="sa-review-grid">'+grid+'</div></section>'
  /* 两个分支用同一张「三件事」卡，只换时态：避免提交后出现两条长得几乎一样的 ✓ 提示条。 */
  +'<section class="card"><div class="hd">'+(submitted?'这次提交做了什么':'确认提交会发生什么')+'<span>只有这三件事</span></div><div class="flow-grid">'
  +'<div class="flow current"><small>'+(submitted?'已发生':'会发生')+'</small><b>标记本次已完成</b><p>'+(submitted?'这次作答已记为已提交，完成页按此显示。':'把这次作答记为已提交，然后进入完成页。')+'</p></div>'
  +'<div class="flow"><small>'+(submitted?'未发生':'不会发生')+'</small><b>不生成任何结论</b><p>不打分、不给人格类型、不判断适不适合某个岗位。</p></div>'
  +'<div class="flow"><small>'+(submitted?'未发生':'不会发生')+'</small><b>不上传、不入账号</b><p>答案不发给服务端，也不写进你的账号记录。</p></div></div></section>'
  +(submitted?'':gate(false,'<b>'+TOTAL+' 题都已作答。</b>确认无误后再提交；现在取消也不会丢掉这些选择。'))
  +rail();
  actionsEl.innerHTML=(submitted
    ?actionBtn({act:'restart-all',label:'重新开始一次'})+actionBtn({primary:true,link:href('result'),label:'回到完成页'})
    :actionBtn({act:'goto',arg:TOTAL,label:'取消，返回修改'})+actionBtn({primary:true,act:'submit',label:'确认提交',testid:'sa-submit'}));
}

/* ------------------------------------------------------------------- result */

    return '<div><small>'+esc(d.label)+'</small><b>'+dimDone(s,d.key)+' / '+d.count+' 题</b><p>已作答</p></div>';

  +'<div class="flow"><small>不保存</small><b>账号记录与完成时间</b><p>答案不上传服务端，关掉标签页即消失。</p></div>'
  +'<div class="flow"><small>不产出</small><b>报告与打印文件</b><p>报告 PDF 由服务端生成后才开放打印，现在不提供。</p></div></div></section>'

/* -------------------------------------------------------------------- 分发 */
if(view==='intro')viewIntro();
else if(view==='questions')viewQuestions();
else if(view==='review')viewReview();
else if(view==='result')viewResult(false);
else if(view==='result-synthetic')viewResult(true);
else if(view==='history')viewHistory();
else if(view==='ai-down')viewDown();
else if(view.indexOf('recover-')===0)viewRecover(view.slice(8));
else viewInvalid(reason);

/* ------------------------------------------------------------------ 交互 */
function handle(act,arg){
  if(act==='consent'){session.consented=!session.consented;save(session);viewIntro();return}
  if(act==='start'){if(!session.consented)return;go('questions',{q:Math.min(TOTAL,answered(session)+1)});return}
  if(act==='answer'){
    if(view!=='questions'||session.submitted)return;
    session.answers[cursor]=arg;session.cursor=cursor;save(session);clamped=false;viewQuestions();return;
  }
  if(act==='next'){if(!session.answers[cursor])return;go('questions',{q:Math.min(TOTAL,cursor+1)});return}
  if(act==='prev'){go('questions',{q:Math.max(1,cursor-1)});return}
  if(act==='goto'){go('questions',{q:Number(arg)});return}
  if(act==='locked')return;
  if(act==='review'){if(answered(session)<TOTAL)return;go('review');return}
  if(act==='submit'){
    if(answered(session)<TOTAL||session.submitted)return;
    session.submitted=true;save(session);go('result');return;
  }
  if(act==='restart'){var c=session.consented;session=blank();session.consented=c;save(session);go('questions',{q:1});return}
  if(act==='restart-all'){wipe();session=blank();go('intro');return}
  if(act==='exit'){wipe();location.href='16-service-hubs.html?hub=resume';return}
}
function onTap(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el||!stageEl.contains(el))return;
  e.preventDefault();handle(el.dataset.act,el.dataset.arg);
}
bodyEl.addEventListener('click',onTap);actionsEl.addEventListener('click',onTap);
