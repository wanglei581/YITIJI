<title>格式转换 · 图片转 PDF · 职易达</title>
<!--
  route: /print-scan/convert（旧深链 /print/scan-convert 只做重定向，不新增页面）
  api:  POST /api/v1/print/convert/images-to-pdf —— 可匿名；sources[{fileId,fileAccessUrl}] 的**有序顺序**就是 PDF 页序
        返回 fileId / printFileUrl（30 分钟有效）/ fileMd5 / sizeBytes / pages；**单次请求没有百分比进度**
  真实限制（对齐 services/api/src/print-conversion/print-conversion.service.ts）：
        1–20 张；仅 JPG / PNG；单张 ≤ 10MB；总输入 ≤ 40MB；单图 ≤ 2500 万像素；
        总像素 ≤ 2 亿；输出 ≤ 15MB；A4 一图一页（fit + 居中）
  幂等:  Idempotency-Key → lock 120s / result 600s；同 key + 相同有序输入可恢复；
        同 key + 不同输入 = IDEMPOTENCY_KEY_REUSED 冲突；进行中 = CONVERSION_IN_PROGRESS
  留存:  已登录 → PDF 进「我的文档」，默认约 24 小时可手动延长；
        未登录 → 后端以空 endUserId 落库，**不进「我的文档」**，只能在本次操作内直接继续；
        公用终端**不提供下载到本机**
  出口:  生成成功后进入 13-print-desk.html（/print/material-check），**不直达报价、支付或出纸**
  目标设计（尚未接线，页面必须写明）：
        · 列表选择 / 上移下移 / 旋转 90° / 删除 —— 旋转在当前接口里**没有字段**，
          React 也没有接线，因此**不随本次请求发送**，也不会改变服务端生成的 PDF；
        · 同一批输入复用同一个请求标识 —— 当前 React 每次点击都新建 key（见 README runtime gaps）
  禁止:  不画百分比、不画进度条、不用计时器推进业务状态；
        不显示金额 / 权益抵扣 / 支付入口 / 已打印 / 已出纸；
        不把「看了一眼」写成「已保存」；预览失败只说预览这件事，不改写成果文件状态
  夹具门: 除 empty 外全部状态都会说出固定文件名、固定图片、转换结果或请求标识 ——
        只在 ?capture=1 / ?debug=1 下可达，普通产品地址一律回落 empty
  原型演示控制：普通地址完全不渲染；仅 ?debug=1 注入（data-proto-control="true"）
-->

/* ================= 本机操作（真实点击驱动，绝不用计时器推进业务状态） ================= */
function pickState(){
 var n=M.items.length;
 if(n===0)return 'empty';
 if(n===1)return 'ready-one';
 if(n>=LIM.imgs)return 'limit-reached-20';
 if(M.sel===1&&n===3)return 'ready-selected-middle';
 return 'ready-three';
}
var EDITABLE={'ready-one':1,'ready-three':1,'ready-selected-middle':1,'limit-reached-20':1};
function reflow(){
 if(EDITABLE[ST]){var ns=pickState();if(ns!==ST){render(ns);return}}
 rerender();
}
function actOn(act){
 var m;
 if(act==='add-local'){
  if(M.items.length>=LIM.imgs)return;
  render('local-uploading');return;
 }
 if(act==='cancel-upload'){render(M.items.length?pickState():'empty');return}
 if((m=/^pick:(\d+)$/.exec(act))){
  var i=parseInt(m[1],10);
  M.sel=(M.sel===i?null:i);
  reflow();return;
 }
 if((m=/^look:(\d+)$/.exec(act))){var li=parseInt(m[1],10);pvOpen('input',{index:li,rot:M.items[li].rot});return}
 if(act==='open-out'){pvOpen('output',{page:1});return}
 if((m=/^open-out:(\d+)$/.exec(act))){pvOpen('output',{page:parseInt(m[1],10)});return}
 if(act==='up'||act==='down'){
  if(M.sel===null)return;
  var d=act==='up'?-1:1,t=M.sel+d;
  if(t<0||t>=M.items.length)return;
  var tmp=M.items[M.sel];M.items[M.sel]=M.items[t];M.items[t]=tmp;M.sel=t;
  reflow();return;
 }
 if(act==='rot'){
  if(M.sel===null)return;
  M.items[M.sel].rot=(M.items[M.sel].rot+90)%360;
  reflow();return;
 }
 if(act==='del'){
  if(M.sel===null)return;
  M.items.splice(M.sel,1);
  M.sel=null;
  if(!M.items.length){render('empty');return}
  reflow();return;
 }
 if(act==='convert'){render('merging');return}
 if(act==='recheck'){render('retrying-same-request');return}
 if(act==='recovered'){initModel('recovered-completed');render('recovered-completed');return}
 if(act==='restore-order'){
  var t2=M.items[0];M.items[0]=M.items[2];M.items[2]=t2;M.sel=null;
  render('retrying-same-request');return;
 }
 if(act==='new-key'){M.req='CV-20260830-0931-2B9E';M.sel=null;render('merging');return}
}
document.getElementById('body-root').addEventListener('click',function(e){

 actOn(el.getAttribute('data-act'));
});

   所以关掉之后列表、选中项、排序和旋转原样还在。
   这里没有解析任何 PDF、也没有解码任何图片：画面是把同一张固定原型图按 A4 摆进去，
   证明的是产品合同与版面，不是渲染引擎，也不是签名预览链接。 */
var PV_STEPS=[0.5,0.75,1,1.25,1.5,2,3];

function pvGeom(){
 var d=pv.doc,vw=pvView.clientWidth,vh=pvView.clientHeight;
 var q=(pv.rot%180)!==0,nw=q?d.h:d.w,nh=q?d.w:d.h;
 var availW=Math.max(1,vw-PV_PAD*2),availH=Math.max(1,vh-PV_PAD*2);
 var fitPage=Math.min(availW/nw,availH/nh),fitWidth=availW/nw;
 var scale=pv.mode==='fit-page'?fitPage:(pv.mode==='fit-width'?fitWidth:pv.zoom);
 return {vw:vw,vh:vh,nw:nw,nh:nh,fitPage:fitPage,fitWidth:fitWidth,scale:scale};
}
function pvLayout(anchor){
 var g=pvGeom(),d=pv.doc;
 var bw=Math.round(d.w*g.scale),bh=Math.round(d.h*g.scale);
 var q=(pv.rot%180)!==0,ow=q?bh:bw,oh=q?bw:bh;
 var sceneW=Math.max(g.vw,ow+PV_PAD*2),sceneH=Math.max(g.vh,oh+PV_PAD*2);
 var scene=pvEl.querySelector('.pv-scene'),page=pvEl.querySelector('.pv-page'),paper=pvEl.querySelector('.pv-paper');
 scene.style.width=sceneW+'px';scene.style.height=sceneH+'px';
 page.style.width=bw+'px';page.style.height=bh+'px';
 page.style.transform='translate(-50%,-50%) rotate('+pv.rot+'deg)';
 paper.style.width=d.w+'px';paper.style.height=d.h+'px';paper.style.transform='scale('+(bw/d.w)+')';
 pvView.scrollLeft=Math.max(0,(sceneW-g.vw)/2);
 pvView.scrollTop=anchor==='top'?0:Math.max(0,(sceneH-g.vh)/2);

 for(i=PV_STEPS.length-1;i>=0;i--)if(PV_STEPS[i]<cur-0.005)return PV_STEPS[i];

 if(!f.length)return;
 var first=f[0],last=f[f.length-1];
 if(e.shiftKey&&(document.activeElement===first||!pvEl.contains(document.activeElement))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function inputDoc(i){
 var it=M.items[i];
 return {kind:'input',n:it.n,sub:szText(it)+' · 待合并的第 '+(i+1)+' 张'+(it.rot?' · 本机已转 '+it.rot+'°':'')+' · 本页不改动原图',dim:it.w+'×'+it.h+' 像素',
  w:it.w,h:it.h,pages:1,src:fxSrc(it.f)};
}
function outputDoc(){
 var srcs=[],names=[],i;
 for(i=0;i<M.items.length;i++){srcs.push(fxSrc(M.items[i].f));names.push(M.items[i].n)}
 return {kind:'output',n:M.out.n,sub:M.out.pages+' 页 · '+M.out.mb.toFixed(1)+' MB · 一张图一页 · A4 居中不裁切',
  w:1240,h:1754,pages:M.out.pages,srcs:srcs,srcNames:names};
}
function pvOpen(which,opt){
 if(pv)return;
 if(!FIXTURE_OK)return;
 opt=opt||{};
 var d=which==='input'?inputDoc(opt.index):outputDoc();
 pv={doc:d,page:opt.page||1,mode:'fit-page',zoom:1,rot:0,fail:!!opt.fail,kind:which};
 if(opt.mode==='fit-width')pv.mode='fit-width';
 if(opt.mode==='zoom'){pv.mode='zoom';pv.zoom=2}
 if(opt.rot)pv.rot=opt.rot;
 pvBack=document.activeElement;
 pvEl=document.createElement('div');
 pvEl.className='pv';pvEl.id='pv';
 pvEl.setAttribute('role','dialog');pvEl.setAttribute('aria-modal','true');
 pvEl.setAttribute('aria-labelledby','pv-title');
 pvEl.setAttribute('data-testid',SCREEN+'-preview');
 pvEl.setAttribute('data-kind',which);
 document.getElementById('stage').appendChild(pvEl);
 pvInert(true);
 pvBuild();
 if(opt.instant)pvEl.classList.add('pv-in');
 else requestAnimationFrame(function(){if(pvEl)pvEl.classList.add('pv-in')});
 document.addEventListener('keydown',pvKey);
}
function pvClose(){
 if(!pv)return;
 document.removeEventListener('keydown',pvKey);
 pvInert(false);
 if(pvEl&&pvEl.parentNode)pvEl.parentNode.removeChild(pvEl);
 pvEl=null;pvView=null;pv=null;
 if(pvBack&&document.contains(pvBack))pvBack.focus();
 pvBack=null;
}
/* ================= 启动：状态解析与 fail-closed ================= */
(function boot(){
 var raw=Q.get('state'),st;
 if(raw&&ALIAS[raw])raw=ALIAS[raw];
 if(!raw)st='empty';
 else if(STATES.indexOf(raw)<0)st='empty';        /* 认不出来就不猜，也不回显 */
 else if(raw!=='empty'&&raw!=='usb-not-connected'&&!FIXTURE_OK)st='empty';   /* 普通产品地址买不到固定图片、文件名、结果或请求标识 */
 else st=raw;
 initModel(st);
 render(st);
 /* 原型演示控制：普通地址完全不渲染，只有 ?debug=1 才注入。 */
 if(DEBUG){
  document.documentElement.classList.add('debug');
  var tab=document.createElement('button');
  tab.type='button';tab.className='demo-tab';tab.id='demo-tab';
  tab.setAttribute('aria-label','打开原型演示控制面板');
  tab.setAttribute('data-proto-control','true');
  tab.textContent='演示';
  var panel=document.createElement('div');
  panel.className='demo-panel';panel.id='demo-panel';
  panel.setAttribute('aria-label','原型演示控制');
  panel.setAttribute('data-proto-control','true');
  var keep='&debug=1'+(CAPTURE?'&capture=1':'')+(FLAT?'&flat=1':'');
  var h='<div class="dp-t">业务状态</div>',i;
  for(i=0;i<STATES.length;i++)h+='<a href="?state='+STATES[i]+keep+'" data-s="'+STATES[i]+'">'+STATES[i]+'</a>';
  panel.innerHTML=h;
  var stage=document.getElementById('stage');
  stage.appendChild(tab);stage.appendChild(panel);
  tab.addEventListener('click',function(){panel.classList.toggle('show')});
  var links=panel.querySelectorAll('a');
  for(i=0;i<links.length;i++)links[i].className=(links[i].getAttribute('data-s')===st?'on':'');
 }
 /* 地址直达的输出预览一开始就是打开的，所以不做入场过渡。 */
 if(FIXTURE_OK&&M.out){
  if(st==='output-preview-page2')pvOpen('output',{page:2,instant:true});
  else if(st==='output-preview-last')pvOpen('output',{page:M.out.pages,instant:true});
  else if(st==='output-preview-zoomed')pvOpen('output',{page:1,mode:'zoom',instant:true});
  else if(st==='output-preview-failed')pvOpen('output',{fail:true,instant:true});
 }
})();
/* 时钟：只刷新顶栏时间文本，不改 data-state、不推进任何业务状态。 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){
 STAGE_SCALE=Math.min(innerWidth/1080,innerHeight/1920);
 document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+STAGE_SCALE+')';
}
fit();addEventListener('resize',fit);
if(FLAT)document.getElementById('stage').classList.add('flat');
</script>
</body>
