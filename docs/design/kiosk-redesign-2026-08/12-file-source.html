<title>选择文件来源 · 职易达</title>
<!--
  S17 · 打印文件搬运闭环（青序流光，1080x1920 单 HTML 宿主）
  route: /print/upload —— apps/kiosk/src/pages/print/PrintUploadPage.tsx

  本页只做一件事：把要打印的文件搬进这次办理，确认成唯一「当前文件」，然后交给
  /print/material-check（13-print-desk.html）。**本页不做 AI 简历诊断**，也不复制
  21-resume-triage.html 的目标岗位 / 维度 / 解析流程 —— 那是另一条业务线的入口。

  查询契约（与 React 逐项对齐）：
    ?source=document|resume   —— resume 只表示「打印简历」，不进 AI 诊断
    ?tab=file|qr|usb          —— 初始通道，非法值回落 file
    ?mode=transfer            —— 入口已选定通道，直达该通道，不再问第二遍
    ?category=photo           —— 照片打印入口（PrintUploadPage 也接受 router state）
    ?state=<下方 38 态之一>    —— 仅本原型使用；夹具态必须带 capture=1 或 debug=1
    ?capture=1 / ?debug=1     —— 夹具可达门；?flat=1 截图去动效
    ?cancel=ok|fail           —— 取消会话的**服务端答复夹具**。phone-cancelled 只认 ok，
                                phone-cancel-failed 只认 fail；缺这个参数一律 fail-closed 到
                                missing-file，静态页不许自己「取消成功」。
    ?pick=0|1|2               —— 这次拿到的是哪一份（本机 0=PDF / 1=图片；U 盘 0/1/2）。缺省 0，
                                所以不带这个参数时页面与改版前完全一致。
    ?preview=<下表之一>        —— **预览夹具入口**，只在 capture=1 / debug=1 下生效，且只在真的
                                握着（或挂着）一份文件的状态上生效：local-ready / usb-ready /
                                phone-confirmed / phone-uploaded / phone-cancel-failed /
                                local-rejected。其余一律不开预览。
                                open | page2 | last | fit-page | fit-width | zoom | rotate
                                unavailable（预览取不到）| expired（预览链接过期）| unsupported（不收的格式）

  完整预览合同（本轮返修的主题）：
    为什么要有      只给文件名和大小，用户没法确认「带走的是不是这一份、有没有传错页、照片是不是歪的」。
                  所以本页必须能在**同一个 HTML 宿主**里把这份文件**完整**看一遍，再决定要不要往下走。
    宿主与隔离      near-full-stage 模态覆盖整屏；打开时顶栏 / 小青条 / 正文 / 页脚 / 底栏全部 inert +
                  aria-hidden，既点不到也 Tab 不到；焦点进入模态并在模态内循环；Esc 或「关闭」退出。
                  预览**不导航、不改地址、不写任何存储**，所以关掉之后通道、当前文件、手机确认态原样还在。
    PDF           真实可滚动 viewport + scene + 完整页面：页码、上一页 / 下一页（到边界禁用并常驻原因）、
                  适应整页、适应宽度、放大 / 缩小、旋转 90°、拖动或滚动平移到上下左右与四角。
                  「适应整页」必须整页四边都在可视区内 —— **不许只显示半页**，最后一页必须可达。
    图片          初始按「适应整页」contain，四边完整可见；同样支持放大、旋转、平移。
    DOCX          这条打印上传路由**只收 PDF / JPG / PNG**，Word 既不上传也不预览，更**不做格式转换渲染**——
                  不拿一个转出来的样子冒充你的原文件。只诚实说明，并给出「另存为 PDF / JPG / PNG」的做法。
    预览失败       取不到预览 / 预览链接过期只说**暂时看不了**，并明确保留事实：文件还在本次办理里，
                  上传没有失败，文件没有丢，也没有被删除。**不借预览失败改写文件或会话状态。**
    演示内容       预览里的页面和图片是**固定原型数据 / 演示文件，不是真实用户文件**：模态内常驻标记，
                  每一页页脚和水印再标一次；普通产品地址一律 fail-closed，看不到这些内容。
    不做什么       不解析、不判页数结论、不做隐私检查、不做 AI 诊断、不出签名链接、不显示任何凭据。

  真实合同（来源：代码，不是想象）：
    单文件      PrintUploadPage useState<UploadedFile|null> —— 本次办理只持有一个已选文件，
                没有多文件队列，也不存在「一次传 2 份」。
    体积上限    本机 / U 盘 15MB（PRINT_UPLOAD_MAX_MB=15 = min(print_doc 20MB, 代理 15MB)）；
                手机上传 10MB（uploadSessions.ts: FILE_TOO_LARGE = 「文件超过 10MB」）。两个数不一样。
    手机会话    packages/shared UploadSessionStatus = pending|uploading|uploaded|confirmed|expired|cancelled。
                **没有「已扫码」这个服务端信号**；本机看不到用户扫没扫。
                uploaded 之后必须在一体机点确认（POST /upload-sessions/:id/confirm）才算数。
                刷新二维码前先 DELETE 撤销旧会话（UploadSessionQrPanel: revokePreviousSession）。
                连续 3 次轮询失败或 NOT_FOUND/EXPIRED → 本机按已过期处理。
    取消语义    upload-sessions.service.ts cancel()：已 confirmed 的会话**不能取消**（400
                UPLOAD_SESSION_CONFIRMED）；未 confirmed 的会话取消时会走 cleanupAbandonedFile()，
                对**匿名 / 未归属**的本次临时上传调 files.forceDelete()（best-effort，.catch 吞错），
                对已有 endUserId / ownerType='user' 的文件**直接跳过不删**。expire 路径（同文件
                第 173、282 行）走的是同一个 cleanupAbandonedFile。所以本页对取消 / 过期的唯一诚实
                说法是**「按服务端清理规则处理」**：既不能承诺必删或立即删，也不能承诺不删。
    取消失败    **静态原型只定义正确产品合同，不代表 React 已经这么做。** 现状 React
                UploadSessionQrPanel.tsx:281-290 的 handleCancel 用 `catch {}` 吞掉 DELETE 失败，
                并在 finally 里无条件 setQr(null)/setStatus(null)/setError(null) —— 取消失败也会
                清掉本机会话与待确认文件。这是**后续对接阻塞项**，不是本页已修好的东西。
    本机上传    本机通道是一次整份往返，**没有任何取消/中止通道**：请求送出之后，没有一个前端
                动作能让服务端停下来，也没有服务端答复能证明它停下来了。所以 local-uploading
                **不提供「取消本次上传」**，只留等待 / 求助 / 退出本页；local-cancelled **只对应
                一种情况**：系统文件窗口被关掉、上传还没开始。两者不共用一个出口。
                现状 React PrintUploadPage.tsx:748-756 的次按钮在 uploading 期间仍写「取消」且
                不禁用，点了只 navigate('/')。这是**后续对接阻塞项**，不是本页已修好的东西。
    U 盘        浏览器不读盘。Terminal Agent 在 127.0.0.1:9527 枚举，只下发一次性 safeId；
                /local/usb/files 每次都会重建 safeId 注册表，旧 safeId 作废（410）。
                未配置 VITE_TERMINAL_AGENT_BRIDGE_TOKEN → 未接通；配置了但连不上 → Agent 离线。这两件事不一样。
    系统文件框  <input type=file> 只是桌面浏览器的验证 / 兼容路径，**不是公共一体机的首选**
                （CLAUDE.md §17 禁止一体机出现系统级弹窗）。
    云盘        没有任何真实 OAuth 合同 —— 本页把它标成「尚未接入」，只给「先下到手机再扫码上传」的老实办法。
    纸质原件    React 已有 /scan/start 入口；这不是第四种上传 tab，而是先建立扫描会话、去奔图面板扫描，完成后取得文件。
    已有材料    登录用户可从 /me/documents 查看已保存文档，也可从最近打印文件继续；未登录、空、加载失败和链接过期由会员宿主处理。
    出口        navigate('/print/material-check', { state:{ file, source } }) 必须带 file，
                所以**没有当前文件时主操作一律禁用**。

  本页不伪造：有效二维码、设备在线、上传百分比、剩余秒数、安全弹出 U 盘、AI 结果、
              任务号、文件、成功结论，也不说「会话结束即删除服务端文件」。
  解析 / 页数 / PII 检查属于第 13 页，本页不预告结论。

  原型演示控制：普通地址完全不渲染；仅 ?debug=1 注入（data-proto-control="true"），并保留 debug/capture/flat。
  旧地址兼容：13-print-desk.html 的返回键仍指向 ?state=received（该文件不在本批白名单内），
              经 LEGACY 映射后按夹具态门禁处理。
-->

.pp{position:absolute;inset:0;padding:64px 68px;color:#16211d;font-size:23px;line-height:1.62;display:flex;flex-direction:column}

<script>
/* ================= 常量与查询 ================= */
var SCREEN='file-source';
var Q=new URLSearchParams(location.search);
var DEBUG=Q.get('debug')==='1';
var CAPTURE=Q.get('capture')==='1';
var FLAT=Q.get('flat')==='1';
var SRC=Q.get('source')==='resume'?'resume':'document';
var IS_RESUME=SRC==='resume';
var TABQ=Q.get('tab');
var TAB=(TABQ==='qr'||TABQ==='usb')?TABQ:'file';
var TRANSFER=!IS_RESUME&&Q.get('mode')==='transfer';
/* 取消会话的服务端答复夹具：只有 ok / fail 两个合法值，其它一律当没给。 */
var CANCELQ=Q.get('cancel');
var CANCEL_FX=(CANCELQ==='ok'||CANCELQ==='fail')?CANCELQ:null;
var PHOTO=Q.get('category')==='photo';
/* 这次拿到的是哪一份（本机 0/1，U 盘 0/1/2）。缺省 0 —— 不带这个参数时与改版前完全一致。 */
var PICKQ=Q.get('pick');
var PICK=/^[0-9]$/.test(PICKQ||'')?parseInt(PICKQ,10):0;
/* 预览夹具入口：只在原型演示模式下生效，普通产品地址一律看不到演示文件内容。 */
var PV_MODES={open:1,page2:1,last:1,'fit-page':1,'fit-width':1,zoom:1,rotate:1,unavailable:1,expired:1,unsupported:1};
var PREVQ=Q.get('preview');
var PREVIEW=(PREVQ&&PV_MODES[PREVQ]&&(CAPTURE||DEBUG))?PREVQ:null;

/* 38 个业务状态。三条通道 + 三个共享兜底。 */
var STATES=[
 'source-chooser','missing-file','unknown',
 'local-guide','local-picking','local-cancelled','local-rejected','local-oversize','local-unreadable','local-uploading','local-upload-failed','local-ready',
 'phone-generating','phone-gen-failed','phone-ready','phone-waiting','phone-uploading','phone-status-unknown','phone-expired','phone-uploaded','phone-confirming','phone-confirm-failed','phone-confirmed','phone-cancel-requesting','phone-cancel-failed','phone-cancelled',
 'usb-unavailable','usb-agent-offline','usb-wait','usb-detecting','usb-empty','usb-list','usb-read-failed','usb-selected','usb-safeid-expired','usb-importing','usb-import-failed','usb-ready'
];

/* 夹具态：画面里出现了「服务端本该返回、但这里是写死的」文件名 / 列表 / 会话值。
   这些状态只在 ?capture=1 或 ?debug=1 下可达；普通地址一律 fail-closed 到 missing-file，
   免得有人把一个静态页当成「已经传上去了」的证据。 */
var FIXTURE={
 'local-picking':1,'local-rejected':1,'local-oversize':1,'local-unreadable':1,'local-uploading':1,'local-upload-failed':1,'local-ready':1,
 'phone-ready':1,'phone-waiting':1,'phone-uploading':1,'phone-status-unknown':1,'phone-expired':1,'phone-uploaded':1,'phone-confirming':1,'phone-confirm-failed':1,'phone-confirmed':1,'phone-cancel-requesting':1,'phone-cancel-failed':1,'phone-cancelled':1,
 'usb-list':1,'usb-selected':1,'usb-safeid-expired':1,'usb-importing':1,'usb-import-failed':1,'usb-ready':1
};

var HAS_FILE={'local-ready':1,'usb-ready':1,'phone-confirmed':1};

var CAN_CONTINUE=HAS_FILE;

var LEGACY={'normal':'source-chooser','received':'local-ready','uploading':'local-uploading','upload-failed':'local-upload-failed','format-rejected':'local-rejected','expired':'phone-expired','usb-failed':'usb-read-failed'};

/* ================= 图标 ================= */
var ICO={
 phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 5h4"/><path d="M9 14.5l3 3 3-3"/><path d="M12 17.5v-6"/>',

 folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2.5h7.8A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>',
 file:'<path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 2v6h6"/>',
 cloud:'<path d="M7 19h10.5a3.5 3.5 0 0 0 .4-6.98A5.5 5.5 0 0 0 7.2 10.6 4.2 4.2 0 0 0 7 19z"/><path d="M4 4l16 16"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 lock:'<rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
 warn:'<path d="M12 3.6 2.8 19.4h18.4z"/><path d="M12 10v4M12 17h.01"/>',

 x:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
 swap:'<path d="M4 8h13l-4-4"/><path d="M20 16H7l4 4"/>',
 link:'<path d="M10 13a4 4 0 0 0 5.7.4l2.6-2.6a4 4 0 0 0-5.7-5.7L11.4 6.3"/><path d="M14 11a4 4 0 0 0-5.7-.4l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.2-1.2"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'
};

/* ================= 地址构造：状态跳转一律是真链接 ================= */
function to(state,extra){
 var p=new URLSearchParams();
 p.set('state',state);
 if(SRC!=='document')p.set('source',SRC);
 if(TRANSFER)p.set('mode','transfer');
 if(PHOTO)p.set('category','photo');
 if(PICK)p.set('pick',String(PICK));
 if(extra)for(var k in extra){if(extra[k]===null)p.delete(k);else p.set(k,extra[k])}
 if(DEBUG)p.set('debug','1');
 if(CAPTURE)p.set('capture','1');
 if(FLAT)p.set('flat','1');
 return '12-file-source.html?'+p.toString();
}

var QRBITS='###..#.###.#...###...##.#.#.###.##...#...#.####..#.####....###...###.##..##.#..#..##.#..####.#.#.####..#...##..##.###.#.##';
function qrGrid(){var h='';for(var i=0;i<121;i++){h+='<i class="'+(QRBITS.charAt(i)==='#'?'':'o')+'"></i>'}return h}
function qr(kind){
 /* kind: live(示意) | dim(过期/失效) | blank(还没有码)
    blank 不画网格 —— 画出来就像「码已经出来了」；dim 不用 opacity 压暗，压到浅灰就等于什么都没画。 */
 if(kind==='blank'){
  return '<div class="qr blank" role="img" aria-label="尚未生成上传二维码（本页不画占位码图形）" data-testid="'+SCREEN+'-qr">'+
   svg('phone','currentColor',72,1.6)+'<span class="qb-t">码还没出来</span>'+
   '<span class="qb-s">拿到服务端下发的一次性链接之后<br>这里才会出现二维码</span></div>';
 }
 var label=kind==='dim'?'已失效的上传二维码（原型示意图形，不可扫描，不编码真实内容）'
   :'手机上传二维码（原型示意图形，不可扫描，不编码真实内容）';
 return '<div class="qr'+(kind==='dim'?' dim':'')+'" role="img" aria-label="'+label+'" data-testid="'+SCREEN+'-qr">'+
  '<div class="qr-grid">'+qrGrid()+'</div>'+
  (kind==='live'?'<span class="qr-corner tl"></span><span class="qr-corner tr"></span><span class="qr-corner bl"></span><span class="qr-corner br"></span>':'')+
  (kind==='live'?'':'<div class="qr-mask">这张码已失效</div>')+
 '</div>';
}

/* usbMode: ok | unavailable | offline */
function channels(active,usbMode,keys){

 for(var i=0;i<order.length;i++){
  var k=order[i],c=CH_DEF[k],dis=false,d=c.d,f=c.f,tag=c.tag;
  if(k==='usb'&&usbMode==='unavailable'){dis=true;d='这台终端没有配置 U 盘导入的本地令牌，所以这条通道不能用。';f='本机未接通 · 重试也没用';tag=null}
  if(k==='usb'&&usbMode==='offline'){dis=true;d='本地令牌配好了，但现在连不上这台机器的 Terminal Agent。和「未配置」不是一回事。';f='Agent 离线 · 可以重试';tag=null}
  var body='<span class="ch-ic" style="background:'+c.bg+'">'+svg(c.ic,c.st,32)+'</span>'+
   '<span class="ch-n"><span>'+c.n+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+(k==='file'?'<span class="tag mut">桌面验证</span>':'')+'</span>'+
   '<span class="ch-d"><span>'+d+'</span></span><span class="ch-f">'+f+'</span>';

  else h+='<a class="ch press'+(active===k?' on':'')+'" href="'+to(c.st2)+'" data-route="/print/upload" data-testid="'+SCREEN+'-ch-'+k+'" aria-label="'+c.n+'（'+f+'）"'+(active===k?' aria-current="true"':'')+'>'+body+'</a>';
 }

}

/* ================= 完整预览：同一 HTML 宿主内的 near-full-stage 模态 ================= */
/* 只做一件事：把这次办理里那一份文件**完整**看一遍。不解析、不判页数、不做隐私检查、不做 AI 诊断。
   预览不导航、不改地址、不写任何存储，所以关掉之后通道、当前文件和手机确认态原样还在。
   页面内容是**固定原型数据 / 演示文件**，模态里常驻标记，每页页脚和水印再标一次。 */
var PV_STEPS=[0.5,0.75,1,1.25,1.5,2,3];
var PV_PAD=16;
/* 只有真的握着（或挂着）一份文件的状态才谈得上预览。其余状态即使地址里写了 preview 也不开。 */

var PV_INERT=['.topbar','.xq','#body-root','.truth','.navbar'];

/* ---------- 几何：一次算清 fit-page / fit-width / 缩放 / 旋转 ---------- */
function pvGeom(){
 var d=pv.doc,vw=pvView.clientWidth,vh=pvView.clientHeight;
 var q=(pv.rot%180)!==0,nw=q?d.h:d.w,nh=q?d.w:d.h;
 var availW=Math.max(1,vw-PV_PAD*2),availH=Math.max(1,vh-PV_PAD*2);
 var fitPage=Math.min(availW/nw,availH/nh),fitWidth=availW/nw;
 var scale=pv.mode==='fit-page'?fitPage:(pv.mode==='fit-width'?fitWidth:pv.zoom);
 return {vw:vw,vh:vh,nw:nw,nh:nh,fitPage:fitPage,fitWidth:fitWidth,scale:scale};
}
function pvLayout(anchor){
 var g=pvGeom(),d=pv.doc;
 var bw=Math.round(d.w*g.scale),bh=Math.round(d.h*g.scale);
 var q=(pv.rot%180)!==0,ow=q?bh:bw,oh=q?bw:bh;
 var sceneW=Math.max(g.vw,ow+PV_PAD*2),sceneH=Math.max(g.vh,oh+PV_PAD*2);
 var scene=pvEl.querySelector('.pv-scene'),page=pvEl.querySelector('.pv-page'),paper=pvEl.querySelector('.pv-paper');
 scene.style.width=sceneW+'px';scene.style.height=sceneH+'px';
 page.style.width=bw+'px';page.style.height=bh+'px';
 page.style.transform='translate(-50%,-50%) rotate('+pv.rot+'deg)';
 paper.style.width=d.w+'px';paper.style.height=d.h+'px';paper.style.transform='scale('+(bw/d.w)+')';
 pvView.scrollLeft=Math.max(0,(sceneW-g.vw)/2);
 pvView.scrollTop=anchor==='top'?0:Math.max(0,(sceneH-g.vh)/2);
 pvBar(g);
}
function pvPct(g){return Math.round(g.scale*100)+'%'}
function pvBar(g){
 var q=function(t){return pvEl.querySelector('[data-testid="'+SCREEN+'-preview-'+t+'"]')};
 var multi=pv.doc.pages>1,reason='';
 if(multi){
  var prev=q('prev'),next=q('next');
  var atFirst=pv.page<=1,atLast=pv.page>=pv.doc.pages;
  prev.setAttribute('aria-disabled',atFirst?'true':'false');
  next.setAttribute('aria-disabled',atLast?'true':'false');
  q('pageinfo').textContent='第 '+pv.page+' 页 / 共 '+pv.doc.pages+' 页';
  if(atFirst)reason='已经是第 1 页，没有上一页。';
  if(atLast)reason='已经是最后一页，后面没有了。';
 }
 var zin=q('zoom-in'),zout=q('zoom-out');
 var canIn=pvNextStep(1,g.scale)!==null,canOut=pvNextStep(-1,g.scale)!==null;
 zin.setAttribute('aria-disabled',canIn?'false':'true');
 zout.setAttribute('aria-disabled',canOut?'false':'true');
 if(!canIn)reason='已经放到最大，'+pvPct(g)+' 到顶了。';
 if(!canOut)reason='已经缩到最小，'+pvPct(g)+' 到底了。';
 q('zoominfo').textContent=(pv.mode==='fit-page'?'整页 ':(pv.mode==='fit-width'?'适宽 ':''))+pvPct(g);
 var fp=q('fit-page'),fw=q('fit-width');
 fp.setAttribute('aria-pressed',pv.mode==='fit-page'?'true':'false');
 fp.className='pvb wide'+(pv.mode==='fit-page'?' on':'');
 fw.setAttribute('aria-pressed',pv.mode==='fit-width'?'true':'false');
 fw.className='pvb wide'+(pv.mode==='fit-width'?' on':'');
 q('rotate').setAttribute('aria-label','把页面再转 90 度（当前 '+pv.rot+' 度）');
 var r=q('reason');
 var canX=pvView.scrollWidth-pvView.clientWidth>1,canY=pvView.scrollHeight-pvView.clientHeight>1;
 var pan=canX&&canY?'按住画面拖动可以看到上下左右和四个角。'
  :canY?'按住画面上下拖动可以看到这一页的其余部分。'
  :canX?'按住画面左右拖动可以看到这一页的其余部分。'
  :'整页都在屏幕里，四边都看得见。';
 r.textContent=reason||('当前 '+pvPct(g)+'；'+pan);
}
function pvNextStep(dir,cur){
 var i;
 if(dir>0){for(i=0;i<PV_STEPS.length;i++)if(PV_STEPS[i]>cur+0.005)return PV_STEPS[i];return null}
 for(i=PV_STEPS.length-1;i>=0;i--)if(PV_STEPS[i]<cur-0.005)return PV_STEPS[i];
 return null;
}
function pvSetPage(no){
 if(no<1||no>pv.doc.pages)return;
 pv.page=no;
 pvEl.querySelector('.pv-paper').innerHTML=ppPdf(pv.doc,no);
 pvLayout(pv.mode==='fit-width'?'top':'center');
}

   (d.kind==='image'?ppImage():ppPdf(d,pv.page))+'</div></div></div></div>';
  var rowA=d.pages>1
   ? '<div class="pv-row">'+pvBtn('prev','‹ 上一页','看上一页','wide')+
     '<span class="pv-info" data-testid="'+SCREEN+'-preview-pageinfo">第 1 页 / 共 '+d.pages+' 页</span>'+
     pvBtn('next','下一页 ›','看下一页','wide')+'</div>'
   : '<div class="pv-row"><span class="pv-info" data-testid="'+SCREEN+'-preview-pageinfo">单页图片 · 共 1 页</span></div>';

function pvWire(flatMode){
 var on=function(tid,fn){
  var el=pvEl.querySelector('[data-testid="'+SCREEN+'-preview-'+tid+'"]');
  if(el)el.addEventListener('click',function(e){e.preventDefault();fn(el)});
 };
 on('close',function(){pvClose()});
 on('close-2',function(){pvClose()});
 if(flatMode){
  on('retry-ok',function(){pv.fail=null;pvBuild()});
  on('retry-fail',function(){pvBuild()});
  return;
 }
 on('prev',function(el){if(el.getAttribute('aria-disabled')!=='true')pvSetPage(pv.page-1)});
 on('next',function(el){if(el.getAttribute('aria-disabled')!=='true')pvSetPage(pv.page+1)});
 on('fit-page',function(){pv.mode='fit-page';pvLayout('center')});
 on('fit-width',function(){pv.mode='fit-width';pvLayout('top')});
 on('zoom-in',function(el){if(el.getAttribute('aria-disabled')==='true')return;var n=pvNextStep(1,pvGeom().scale);if(n!==null){pv.mode='zoom';pv.zoom=n;pvLayout('center')}});
 on('zoom-out',function(el){if(el.getAttribute('aria-disabled')==='true')return;var n=pvNextStep(-1,pvGeom().scale);if(n!==null){pv.mode='zoom';pv.zoom=n;pvLayout('center')}});
 on('rotate',function(){pv.rot=(pv.rot+90)%360;pvLayout('center')});
 /* 拖动平移：指针事件同时覆盖触控和鼠标；除以舞台缩放，保证 1:1 跟手。 */
 var drag=null;
 pvView.addEventListener('pointerdown',function(e){
  if(e.target.closest('button'))return;
  drag={x:e.clientX,y:e.clientY,l:pvView.scrollLeft,t:pvView.scrollTop,id:e.pointerId};
  pvView.classList.add('grabbing');
  try{pvView.setPointerCapture(e.pointerId)}catch(err){}
 });
 pvView.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  pvView.scrollLeft=drag.l-(e.clientX-drag.x)/STAGE_SCALE;
  pvView.scrollTop=drag.t-(e.clientY-drag.y)/STAGE_SCALE;
  e.preventDefault();
 });
 var end=function(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  drag=null;pvView.classList.remove('grabbing');
 };
 pvView.addEventListener('pointerup',end);
 pvView.addEventListener('pointercancel',end);
}
function pvInert(on){
 var list=PV_INERT.slice();
 var i,el,extra=document.querySelectorAll('[data-proto-control]');
 for(i=0;i<list.length;i++){
  el=document.querySelector(list[i]);
  if(!el)continue;
  if(on){el.setAttribute('inert','');el.setAttribute('aria-hidden','true')}
  else{el.removeAttribute('inert');el.removeAttribute('aria-hidden')}
 }
 for(i=0;i<extra.length;i++){
  if(on)extra[i].setAttribute('inert','');else extra[i].removeAttribute('inert');
 }
}
function pvKey(e){
 if(!pv)return;
 if(e.key==='Escape'){e.preventDefault();pvClose();return}
 if(e.key!=='Tab')return;
 var f=[].slice.call(pvEl.querySelectorAll('button,[tabindex]:not([tabindex="-1"])'));
 if(!f.length)return;
 var first=f[0],last=f[f.length-1];
 if(e.shiftKey&&(document.activeElement===first||!pvEl.contains(document.activeElement))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function pvOpen(mode,st,instant){
 if(pv)return;
 if(!PV_ALLOW[st])return;
 var doc=st==='local-ready'?LDOC():st==='usb-ready'?UDOC():st==='local-rejected'?DOCS['thesis-docx']:FX_PHONE;
 /* 副标题同时说清这份文件此刻的「身份」：看过 ≠ 已确认。免得预览一关就以为已经放行。 */
 var from=st==='local-ready'?'本机选文件 · 已是本次办理的当前文件'
   :st==='usb-ready'?('U 盘导入 · '+USB_VOL+' · 已是本次办理的当前文件')
   :st==='local-rejected'?'本机选文件 · 这一份没有被上传'
   :st==='phone-uploaded'?'手机扫码上传 · 还没确认，看完仍要回上一屏确认'
   :st==='phone-cancel-failed'?'手机扫码上传 · 取消没成功，这一份仍待确认'
   :'手机扫码上传 · 已确认为本次办理的当前文件';
 pv={doc:doc,from:from,page:1,mode:'fit-page',zoom:1,rot:0,fail:null,st:st};
 if(mode==='page2')pv.page=Math.min(2,doc.pages||1);
 if(mode==='last')pv.page=Math.max(1,doc.pages||1);
 if(mode==='fit-width')pv.mode='fit-width';
 if(mode==='zoom'){pv.mode='zoom';pv.zoom=2}
 if(mode==='rotate')pv.rot=90;
 if(mode==='unavailable'||mode==='expired')pv.fail=mode;
 pvBack=document.activeElement;
 pvEl=document.createElement('div');
 pvEl.className='pv';pvEl.id='pv';
 pvEl.setAttribute('role','dialog');pvEl.setAttribute('aria-modal','true');
 pvEl.setAttribute('aria-labelledby','pv-title');
 pvEl.setAttribute('data-testid',SCREEN+'-preview');
 document.getElementById('stage').appendChild(pvEl);
 pvInert(true);
 pvBuild();
 /* 地址直达的预览一开始就是打开的，所以不做入场过渡；按钮打开的才淡入（只动 opacity，不位移）。 */
 if(instant)pvEl.classList.add('pv-in');
 else requestAnimationFrame(function(){if(pvEl)pvEl.classList.add('pv-in')});
 document.addEventListener('keydown',pvKey);
}
function pvClose(){
 if(!pv)return;
 document.removeEventListener('keydown',pvKey);
 pvInert(false);
 if(pvEl&&pvEl.parentNode)pvEl.parentNode.removeChild(pvEl);
 pvEl=null;pvView=null;pv=null;
 if(pvBack&&document.contains(pvBack))pvBack.focus();
 pvBack=null;
}

var EYEBROW={local:'LOCAL FILE',phone:'PHONE UPLOAD',usb:'USB IMPORT'};

/* ================= 渲染 ================= */
function render(st){
 var root=document.getElementById('body-root');
 root.setAttribute('data-state',st);
 root.setAttribute('data-testid',SCREEN+'-state-'+st);
 root.innerHTML=V[st]();
 var p=document.getElementById('pill');
 p.className='pill'+(PILL[st][0]?' '+PILL[st][0]:'');
 document.getElementById('pill-txt').textContent=(IS_RESUME?'简历打印 · ':(PHOTO?'照片打印 · ':''))+PILL[st][1];
 document.getElementById('pill-dot').className='dot'+(/-(uploading|generating|detecting|importing|confirming|requesting)$/.test(st)?' breathe':'');
 document.getElementById('xq-ask').innerHTML=ASK[st][0];
 var doing=ASK[st][1];
 if(IS_RESUME&&st==='source-chooser')doing='这里只是<b>把简历文件搬进来打印</b>，不做 AI 诊断 —— 诊断在简历服务那条线上。';
 document.getElementById('xq-doing').innerHTML=doing;
 var pre=st.split('-')[0];
 document.getElementById('xq-eyebrow').textContent=EYEBROW[pre]||'FILE SOURCE';
 var back=document.getElementById('topback');
 back.setAttribute('aria-label',HAS_FILE[st]?'返回打印扫描（当前文件不会带走）':'返回打印扫描');
 /* 完整预览入口：只在本页开模态，不导航、不改地址，所以关掉之后这一屏原样还在。 */
 var ob=root.querySelector('[data-testid="'+SCREEN+'-preview-open"]');
 if(ob)ob.addEventListener('click',function(e){e.preventDefault();pvOpen('open',st)});
}

/* ================= 路由：夹具门 + fail-closed ================= */
function resolveState(){
 var raw=Q.get('state');
 if(raw===null||raw===''){
  /* 没有 state：按入口参数决定落点。入口只声明了通道（mode=transfer）就直达，不再问第二遍。 */
  if(TRANSFER)return TAB==='qr'?'phone-generating':(TAB==='usb'?'usb-wait':'local-guide');
  return 'source-chooser';
 }
 var st=LEGACY[raw]||raw;
 if(STATES.indexOf(st)<0)return 'unknown';
 if(FIXTURE[st]&&!(CAPTURE||DEBUG))return 'missing-file';
 /* 取消结果由服务端给出。没有明确答复夹具就不给「已作废」，也不给「作废失败」——
    刷新、直链、非法参数都不能让静态页自造一个成功或失败的结论。 */
 if(st==='phone-cancelled'&&CANCEL_FX!=='ok')return 'missing-file';
 if(st==='phone-cancel-failed'&&CANCEL_FX!=='fail')return 'missing-file';
 return st;
}
var STATE=resolveState();
render(STATE);
/* 预览夹具入口：普通产品地址到不了这里（PREVIEW 已在上面按 capture/debug 归一为 null）。 */
if(PREVIEW)pvOpen(PREVIEW==='unsupported'?'open':PREVIEW,STATE,true);

/* ================= 原型演示控制：仅 debug=1 才注入 DOM ================= */
if(DEBUG){
 document.documentElement.classList.add('debug');
 var tab=document.createElement('button');
 tab.type='button';tab.className='demo-tab';tab.setAttribute('data-proto-control','true');
 tab.setAttribute('aria-label','打开原型演示控制面板');tab.setAttribute('aria-expanded','false');
 tab.textContent='演示';
 var panel=document.createElement('div');
 panel.className='demo-panel';panel.setAttribute('data-proto-control','true');
 panel.setAttribute('aria-label','原型演示控制');
 var t=document.createElement('div');t.className='dp-t';t.textContent='原型演示控制（非产品功能）';panel.appendChild(t);
 var cur=document.getElementById('body-root').getAttribute('data-state');
 for(var i=0;i<STATES.length;i++){
  var link=document.createElement('a');
  link.href=to(STATES[i]);link.textContent=STATES[i];
  link.setAttribute('data-proto-state',STATES[i]);
  if(STATES[i]===cur)link.className='on';
  panel.appendChild(link);
 }
 document.getElementById('stage').appendChild(tab);
 document.getElementById('stage').appendChild(panel);
 tab.addEventListener('click',function(){
  var open=!panel.classList.contains('show');
  panel.classList.toggle('show',open);
  tab.setAttribute('aria-expanded',open?'true':'false');
 });
}

/* 时钟：只刷新顶栏时间文本，不改 data-state，也不推进任何业务状态。 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);STAGE_SCALE=s;document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(FLAT)document.getElementById('stage').classList.add('flat');
</script>
