<!--
  route: /session-timeout（apps/kiosk/src/pages/placeholders/SessionTimeoutPage.tsx）
  state: warning | warning-no-continue | clearing | cleared | continue-failed
  数据来源（KioskSessionControlContext）：
    warning = { sourcePath, exitTo, canContinue, deadlineAt }
    continueSession() → 回到 **warning.sourcePath**；hardClear() → 清除本机会话；clearToScreensaver() → 回待机
  「我还在，继续使用」的落点（KioskPrivacyGuard.tsx:352-405，本页第一条硬约束）：
    · 来源页是 pendingWarning.sourcePath —— 弹这一屏之前用户所在的那一页，不是首页；
    · 运行时的回法是 navigate(-1)（回退到 sourceHistoryIndex 那一条 history entry），
      所以落点必然等于 sourcePath；
    · 守卫不过就 fail-closed：pendingWarning 为空、已过 deadlineAt、sourceHistoryIndex 为空、
      或当前 history 位置不等于 sourceHistoryIndex+1 → 直接 hardClear() 回首页并清场。
    静态页没有 history，所以用 ?from= 演示这条来源：?from= 走与 /login 同一套安全校验
    （/ 开头、不含 //、反斜线、控制字符，且不是 /session-timeout 自身），再经**唯一一张
    route → 静态 HTML 白名单**换成本仓库里真实存在的页面。白名单里没有的 route 一律
    fail-closed 回 01-home.html，并在屏幕上写清「为什么回的是首页」——
    绝不允许出现「显示来源是 /resume/optimize、点下去却回首页」这种自相矛盾。
    页面上展示的来源、guard-from 里的文案、按钮的 href 与 data-route 全部来自同一个 resolver。
  倒计时口径：由 deadlineAt 与**本机时钟**相减得到，纯前端。
    没有离人传感器，没有服务端倒计时，没有摄像头判人 —— 这三样这台机器都没有，页面不得画。
  清除口径（本页唯一正确说法）：
    结束会话清除的是**本机登录态与临时会话信息**；
    已创建的打印/扫描任务继续运行，账号内的文档、订单、AI 记录按**服务端留存期限**管理。
    静态页不声称真的清掉了服务端订单或文件，cleared 也只代表本机清场例程返回了成功。
  AI 边界: 本 route 为 AI-NONE。AI 不判定会话超时、清场是否完成、任务是否仍在运行。
  原型演示控制: ?state= 只切换展示状态；?from= 演示来源页（同时决定「继续使用」按钮的 href 与 data-route）；
                ?capture=1 冻结倒计时；?flat=1 关非必要动效；?debug=1 显演示面板。
                页内换状态会保留 from / debug / flat / capture。倒计时到 0 不自动跳转、不代替执行清场。
                示例：?state=warning&from=%2Fresume%2Foptimize → 继续使用落到 23-resume-optimize.html；
                      ?state=warning&from=%2Fnot%2Fmapped     → fail-closed 回 01-home.html 并写明原因。
-->

function resolveFrom(){
 var raw=q.get('from');
 var given=(raw!==null&&raw!=='');
 if(!given)return {given:false,safe:'',route:'/',host:'01-home.html',known:false,reason:'没有读到来源页'};
 if(!isSafeInternalPath(raw))return {given:true,safe:'',route:'/',host:'01-home.html',known:false,reason:'来源参数不合法'};
 var path=raw.split('#')[0].split('?')[0];
 var host=ROUTE_HOST[path];
 if(!host){
  for(var i=0;i<ROUTE_PREFIX.length;i++){
   if(path.indexOf(ROUTE_PREFIX[i][0])===0){host=ROUTE_PREFIX[i][1];break}
  }
 }
 if(!host)return {given:true,safe:raw,route:'/',host:'01-home.html',known:false,reason:'来源页不在本原型的静态映射表里'};
 return {given:true,safe:raw,route:path,host:host,known:true,reason:''};
}
var SRC=resolveFrom();
/* guard-from 上那句话：来源、落点、为什么，三样必须同时说清楚 */
var FROM_LABEL=SRC.known
 ? '<b>'+SRC.route+'</b>（静态稿对应 '+SRC.host.split('?')[0]+'）'
 : '<b>首页</b>（'+SRC.reason+'，按 fail-closed 处理）';

/* 倒计时块：数字来自 deadlineAt − 本机时钟；?capture=1 冻结，便于逐字节复现的证据截图 */
function guardBlock(o){
 return '<section class="sec"><div class="guard">'+
  '<div class="guard-num" role="group" aria-label="本机剩余计时"><b id="count">'+o.num+'</b><span id="count-unit">'+o.unit+'</span></div>'+
  '<div class="guard-main"><div class="guard-eyebrow">SESSION GUARD</div>'+
  '<div class="guard-title serif">'+o.title+'</div>'+
  '<div class="guard-copy">'+o.copy+'</div>'+
  (o.from?'<div class="guard-from">'+svg('info','currentColor',22)+'继续后回到 '+FROM_LABEL+'</div>':'')+
  '</div></div></section>';
}
/* 页内状态跳转：保留 from / debug / flat / capture，换一屏不丢来源 */
function Q(state){
 var s='?state='+state;
 if(SRC.given&&SRC.safe)s+='&from='+encodeURIComponent(SRC.safe);
 if(q.get('debug')==='1')s+='&debug=1';
 if(q.get('flat')==='1')s+='&flat=1';
 if(q.get('capture')==='1')s+='&capture=1';
 return s;
}
/* 「继续使用」按钮：href、data-route、可读名称全部来自同一个 resolver。

 return '<a class="btn primary" style="flex:1.5" href="'+SRC.host+'" data-route="'+SRC.route+'" data-testid="session-guard-primary" aria-label="'+

var PILL={
 'warning':['warn','闲置提醒 · 本机计时'],
 'warning-no-continue':['warn','已到最长安全时限'],
 'clearing':['','正在清除本机会话'],

var root=document.getElementById('body-root');
var COUNT_FROM=60,timer=null;
function render(state){
 var view=V[state]();
 root.setAttribute('data-state',state);
 root.setAttribute('data-testid',SCREEN+'-state-'+state);
 document.getElementById('scrollarea').innerHTML=view.body;
 document.getElementById('ctabar').innerHTML=view.cta;
 var p=document.getElementById('pill');
 p.className='pill'+(PILL[state][0]?' '+PILL[state][0]:'');
 document.getElementById('pill-txt').textContent=PILL[state][1];
 document.getElementById('pill-dot').className='dot'+(state==='clearing'?' breathe':'');
 document.querySelectorAll('[data-go]').forEach(function(b){
  b.addEventListener('click',function(){location.href=b.getAttribute('data-go')});
 });
 startCount();
}
/* 本机倒计时：真实的本地计时，不自动跳转、不代替执行清场；?capture=1 冻结以便复现截图 */
function startCount(){
 if(timer){clearInterval(timer);timer=null}
 var el=document.getElementById('count');
 if(!el||q.get('capture')==='1')return;
 var left=COUNT_FROM;
 timer=setInterval(function(){
  left-=1;
  if(left<=0){
   clearInterval(timer);timer=null;
   el.textContent='0';
   var u=document.getElementById('count-unit');
   if(u)u.textContent='计时已到，真实实现在此执行本机清场';
   return;
  }
  el.textContent=String(left);
 },1000);
}
var state=q.get('state');
if(STATES.indexOf(state)<0)state='warning';
render(state);

var panel=document.getElementById('demo-panel');
for(var i=0;i<STATES.length;i++){
 var a=document.createElement('a');
 var href=Q(STATES[i]);
 if(href.indexOf('debug=1')<0)href+='&debug=1';
 a.href=href;a.textContent=STATES[i];
 if(STATES[i]===state)a.className='on';
 panel.appendChild(a);
}
if(q.get('debug')==='1')document.documentElement.classList.add('debug');
document.getElementById('demo-tab').addEventListener('click',function(){panel.classList.toggle('show')});
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(q.get('flat')==='1')document.getElementById('stage').classList.add('flat');
