<title>材料扫描 · 职易达</title>
<!--
  S16 · 扫描工作台闭环（静态设计稿，1080x1920 竖屏一体机）

  route: /scan/start（setup） · /scan/settings（create-loading / create-failed / panel-instruction）
         /scan/progress（waiting-delivery / polling / poll-failed / cancelling / cancelled / cancel-failed /
                         cancel-race / cancel-conflict / cancel-recheck / cancel-race-unknown）
         /scan/result（completed / completed-no-file / preview-loading / preview-ready / preview-failed /
                       failed / expired）
         另有两个不对应后端调用的兜底态：session-lost（刷新丢控制凭证）、blocked（链接参数不合法）

  api（services/api/src/scan-tasks/scan-tasks.controller.ts）:
        POST   /api/v1/scan/sessions          建会话 → scanTaskId / controlToken / expiresAt / instructions
        GET    /api/v1/scan/sessions/:id      查状态（controlToken 走 X-Scan-Session-Control 请求头）
        DELETE /api/v1/scan/sessions/:id      取消（同一请求头）
        POST   /api/v1/terminals/:id/scan-sessions/deliver   仅 Terminal Agent 调用

  预览合同（2026-08-27 返修：旧稿这一条写错了，已改）：
        这一屏的会话按**匿名**建立，本机没有任何登录态，所以预览不可能走要登录的端点。
        · 可看链接来自**扫描状态回执本身**：ScanSessionStatusResponse.file.fileUrl。
          services/api/src/scan-tasks/scan-tasks.service.ts 的 getStatus() 用 signFileUrl() 现签，
          形状是 /api/v1/files/:id/content?expires=&sig=（services/api/src/files/signing.ts）。
          GET /files/:id/content **不挂 JwtAuthGuard**，只校验 HMAC 签名，所以匿名也能打开；
          验签失败或已过期一律 401 FILE_SIGNATURE_INVALID「签名无效或已过期」，且不区分原因
          （防探测）—— 见 services/api/src/files/files.controller.ts 的 content()。
        · 本页**不调用** GET /api/v1/files/:id/preview-url：它先走 resolveRequester()，
          匿名请求会被 401 AUTH_REQUIRED「需登录后访问文件」挡掉。旧稿把它写成本流程的
          预览来源是错的；旧稿自造的 FILE_PREVIEW_EXPIRED 在仓库里根本不存在。
        · 这条链接由**上一次回执**签发：本屏没有再签一次的入口，重新打开用的还是同一条。
        · 预览打不开**只证明这一次没打开**（2026-08-27 第二次返修：旧稿据此反推文件仍在，是错的）。
          /content 打不开至少有两种原因：验签失败或已过期（401 FILE_SIGNATURE_INVALID，且不区分原因），
          以及验签通过后读内容失败。所以本页不拿预览失败去反推文件此刻是否仍可用 ——
          它既不改判 completed 结论，也**不构成「文件还在」的证据**。
        · 静态稿也没有 React router 的内存态：这一屏**带不走**这个 server file。所以不许写
          「看不了也能直接拿去打印」「打印和 AI 识别直接用服务端文件」；出口只能说
          「进入相应流程后重新选择或重新取得可用文件」。

  硬件链路真值（唯一）：**用户在奔图操作面板上手动扫描 → 扫描到 SMB 共享目录 →
        Terminal Agent 的 scanWatchFolder 监听并 deliver → 服务端入库**。
        浏览器和 Agent 都没有「一键开始扫描」；没有页级扫描进度，没有逐页计数；
        不存在盖板 / 无纸 / 卡纸 / ADF 进纸这类页级硬件事件，本页一律不画。
        OCR / 文字识别不在扫描环节发生，只有结果进入「AI 简历识别」时才走识别。

  状态合同（packages/shared/src/types/scanTask.ts · ScanTaskStatus）：
        waiting | matched | completed | failed | expired | cancelled
        ScanSessionStatusResponse.file 的类型是 `ScanSessionFileView | null`——**null 在合同内**。
        services/api/src/scan-tasks/scan-tasks.service.ts 的 getStatus() 里：
          · fileObject 查不到、或者已经 deletedAt 时，file 就是 null；
          · 只有 scanType==='contract' 会因为文件不可用被降级成 expired，
            resume / id / document 三类**照旧返回 completed + file:null**。
        所以本页把这三种情况分开处理，不再一律当成合同违例：
          A. completed + 六字段齐全  → completed，画文件卡（这条规则不变）
          B. completed + file 为 null → completed-no-file：**合法终态**，服务端确认已完成、
             但这次没有返回可用文件信息（可能已按留存规则清理）。不再无限轮询，
             给「重新建会话 / 联系工作人员 / 返回打印扫描」三个终态出口。
             页面不声称文件还在、不声称已被删除、也不声称可以恢复。
          C. status 不在六种取值里，或 file 存在但字段不全（半个 ScanSessionFileView）
             → 真的合同违例，按查询失败处理，不改判任务状态。

  controlToken：只在页面内存变量里（对齐 ScanProgressPage.tsx 的 router state 口径）。
        不上屏、不进 URL、不落 localStorage/sessionStorage。所以刷新 / 后退之后本机
        无法再查询或取消该会话，只能落到 session-lost，绝不凭本地记录宣称成功。
        sessionStorage 里**确实留了一条非敏感痕迹**：键 s16.scan.workbench.v1，值只有
        {v, step, scanType}——用来判断本 tab 开过会话、刷新后该落 session-lost。
        controlToken / taskId / 文件信息 / 服务端回执一律不写进任何浏览器存储。
        所以 session-lost 那一屏不写「本机什么都没留」，只写留了哪两项、没留哪四项。

  逐字段深比对的源码合同（门禁从源码抠出字面量，与本页内嵌副本逐字段比对，不等即 failed）：
        packages/shared/src/types/scanTask.ts               ScanTaskStatus 六取值 / ScanSessionFileView 六字段 / file 可空
        services/api/src/scan-tasks/scan-tasks.service.ts   SCAN_TYPE_INSTRUCTIONS 三类原文 / 只有 contract 类降级 expired /
                                                            completed 文件卡的 fileObject 与 !deletedAt 守卫
        services/api/src/files/signing.ts                   signFileUrl() 的签名内容 URL 形状（本页 CONTENT_URL_SHAPE）、
                                                            verifyFileSignature() 的过期判定
        services/api/src/files/files.controller.ts          /content 验签失败的 401 码与文案（本页 PREVIEW_FAIL）、
                                                            /preview-url 匿名被挡的 401 AUTH_REQUIRED 码与文案（本页 PREVIEW_URL_ENDPOINT）
  这四份的**未锚定范围**（门禁不冒充覆盖，改动仍要人复核）：存储后端与 COS 直传、上传 /
  删除 / 留存 / 清理端点、审计写入、限流与守卫装配、raw-upload 的签名命名空间、
  各处签名 TTL 的具体毫秒数、Nest 依赖注入与 DTO 校验。

  只读引用的源码锚点（本页不复制它们的实现，只在文案口径上依赖它们；门禁把每一份的
  sha256 记进 check-report / manifest / files.sha256 供漂移复核。它们没有可以整段嵌进
  静态页的字面量合同，所以**不做深比较、也不冒充深比较**；其中三份另带「定点断言」，
  断言范围以门禁里的 pinned 字段为准）：
        services/api/src/scan-tasks/scan-tasks.controller.ts  四个端点与 controlToken 请求头名
              定点断言：GET / DELETE 两条会话端点都从 X-Scan-Session-Control 取凭证
        services/api/src/files/retention-policy.ts            留存档位与原始文件禁用 long_term
        apps/terminal-agent/src/agent/scan-watcher.ts         未认领文件的 _unclaimed 隔离与清理
        apps/kiosk/src/pages/scan/ScanProgressPage.tsx        controlToken 只走 router 内存态；自动轮询的节奏本页照抄
              （单 timer / 进入等待先查一次 / 上一次落地后再排 3000ms / 终态清 timer）
              定点断言：剥掉注释后不出现 localStorage / sessionStorage / document.cookie
        apps/kiosk/src/pages/scan/ScanResultPage.tsx          结果页三个出口的真实交接口径
              定点断言：同上，文件身份同样不进浏览器存储

  演示夹具（原型专用，非产品功能）：
        本页所有服务端结果都来自 ?fx= 声明的**响应夹具队列**，且只在 ?debug=1 或 ?capture=1 下可用。
        队列按顺序、按调用种类严格消费：队首种类和当前调用不一致就不弹出，一律按「没有服务端响应」失败。
        没有夹具时任何服务端调用都失败，永远到不了 completed。
        演示模式下页面顶部常显「演示模式 · 服务端响应夹具 · 不可作为真实任务」，
        合成编号与夹具文件都带 DEMO- 前缀和醒目标记。
        本页没有 ?state= 这种状态开关；带上任何本页不认识的参数一律 fail-closed 到 blocked，
        并且只列参数名、不回显取值。

  演示模式只改一件事：在途状态的最短展示时间（1200ms → 4000ms），方便截图拍到在途态。
        它不改变任何一次调用的结果；裸 URL 与演示模式跑同一套状态机。
-->
<style>

  --deep:#0b241e; --deep-2:#123a30; --emerald:#2ee6a8;
  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;

.pill.ok{background:var(--teal-soft);color:var(--teal-d);border-color:transparent}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}

.dbanner .dtext{flex:1;min-width:280px}

.sec.grow>.state .meta{margin-top:auto}
.sec.grow>.grid2>*{display:flex;flex-direction:column;gap:16px;min-height:0}
.sec.grow>.grid2>*>.pgrp:last-child{flex:1}
.sec.grow>.factwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.factwrap>.grid2{flex:none}
.factwrap>.pgrp{flex:none}
.plan.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 24px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 22px 20px;display:flex;flex-direction:column;text-align:left;min-height:262px}
.ty[aria-checked=true]{border-color:var(--teal);background:var(--teal-soft)}
.ty-ic{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--slate-soft);color:var(--slate-d)}
.ty[aria-checked=true] .ty-ic{background:var(--teal);color:#fff}
.ty-n{font-size:24px;font-weight:700}
.ty-d{margin-top:6px;font-size:17px;line-height:1.45;color:var(--ink-3);flex:1}
.ty-chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.mini{min-height:36px;padding:0 11px;border-radius:10px;background:var(--paper);border:1px solid var(--line-2);display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--ink-3)}
.mini.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}
.mini.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}
.mini.pick{background:var(--teal);border-color:transparent;color:#fff}
.chain{display:flex;align-items:stretch;gap:10px}
.link{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.link.on{background:var(--deep);border-color:transparent;color:#f2efe4}
.link .li{width:42px;height:42px;border-radius:14px;background:var(--paper);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.link.on .li{background:rgba(46,230,168,.16);color:var(--emerald)}
.link b{font-size:18px;font-weight:700}
.link .lc{font-size:15px;line-height:1.35;color:var(--ink-3)}
.link.on .lc{color:rgba(242,239,228,.66)}
.link .who{margin-top:auto;font-size:14px;font-weight:600;color:var(--slate-d);background:var(--slate-soft);border-radius:9px;padding:4px 8px;align-self:flex-start}
.link.on .who{background:rgba(46,230,168,.18);color:var(--emerald)}
.arrow{flex:none;width:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.panel{display:flex;gap:20px;align-items:stretch}
/* 面板示意图按自身内容收住：指引条目变多时它不跟着拉高，
   否则这张深色插图内部会被撑出一段两百多像素的空当（keys 是浅色描边，不算内容）。 */
.mfp{flex:none;align-self:flex-start;width:322px;border-radius:var(--r-lg);background:linear-gradient(168deg,var(--deep-2),var(--deep));padding:22px;display:flex;flex-direction:column;gap:14px;color:#f2efe4}
.mfp-face{border-radius:18px;background:rgba(255,253,248,.06);border:1px solid rgba(255,253,248,.14);padding:16px;display:flex;flex-direction:column;gap:11px}
.mfp-row{display:flex;gap:8px}
.mfp-key{flex:1;height:42px;border-radius:10px;background:rgba(255,253,248,.1)}
.mfp-key.hi{background:rgba(46,230,168,.34)}
.mfp-screen{height:96px;border-radius:12px;background:rgba(46,230,168,.12);border:1px solid rgba(46,230,168,.3);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--emerald);text-align:center;padding:0 14px;line-height:1.35}
.mfp-cap{font-size:18px;line-height:1.5;color:rgba(242,239,228,.72)}
.mfp-cap b{color:#fff}
.psteps{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.pstep{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 20px;align-items:flex-start}
.pstep .n{flex:none;width:44px;height:44px;border-radius:14px;background:var(--teal-soft);color:var(--teal-d);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* 面板指引是这一屏的主任务正文：字号跟主任务信息走，不按脚注排。 */
.pstep .pt{font-size:21px;line-height:1.45;color:var(--ink);padding-top:2px}
.psrc{margin-top:auto;font-size:18px;color:var(--ink-3);line-height:1.45}
/* 面板指引 / 扫描失败这两屏的「主操作提前」不靠把 .ctabar 挪到半屏实现：
   本页几何门禁按「行动区以下不得有内容」判定，行动条一旦不是最后一块，
   它下面的正文会被整片判成压到行动区。改法是压掉主任务与行动条之间的说明墙，
   并让主任务本身占住主视野。 */
/* ------------------------------------------------------------------ 结果页版式
   2026-08-27 第三次返修。老版式两处不成立：
     1. 预览被压成 316x258 的一小格线条稿 —— A4 只露得出半页多一点，
        用户根本判断不出"要打印/识别的是不是这一份"，那预览就没有存在意义。
     2. 六个合同字段（fileId / sha256 / fileUrl 里的 sig= 与 expires=）
        直接印在公共屏的结果卡上。一体机放在大厅，这些是取文件的凭证，不是给路人看的。
   现在：预览面板吃满内容区宽度，页面按 A4 比例整页显示（默认整页 100% 可见），
   可翻页、可适应整页 / 适应宽度 / 放大 / 缩小。
   2026-08-27 第四次返修：缩放不再是「只渲染看得见的那一块」——整页永远完整存在，
   预览视口自己横纵可滚、可拖动，装不下的部分够得到；外层盒子尺寸恒定，所以照旧不跳版。
   普通视图（含 ?capture=1 出图）只留 filename / mimeType / sizeBytes / 页数 / 来源；
   六字段原样表、回执原样卡、出口与预览合同一并收进 ?debug=1 自证列，
   自证列**追加在预览右侧**，不替换、不遮挡预览。 */
.rstack{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.rmain{flex:1;min-height:0;display:flex;gap:14px;align-items:stretch}
.pvpanel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
/* 预览头 = 紧凑文件信息区：第一行状态，第二行文件身份（只放用户判断得了的那几项） */
.pvhead{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 18px}
.pvh-1{display:flex;align-items:center;gap:12px;min-height:40px}
.pvh-ic{flex:none;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal-d)}
.pvhead[data-kind=warn] .pvh-ic{background:var(--wheat-soft);color:var(--wheat-d)}
.pvhead[data-kind=wait] .pvh-ic{background:var(--slate-soft);color:var(--slate-d)}
.pvh-t{font-size:25px;font-weight:700;line-height:1.2;min-width:0}
.pvh-chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pvh-chips .chip{min-height:40px;font-size:16px;padding:0 13px}
.pvh-2{display:flex;align-items:center;gap:10px;margin-top:3px;min-height:26px;font-size:18px;color:var(--ink-2)}
.pvh-2 b{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pvh-2 .sep{color:var(--ink-3)}
.pvh-2 .tagx{margin-left:auto;flex:none;font-size:15px;font-weight:700;color:#fff;background:var(--cinnabar);border-radius:9px;padding:4px 10px}
/* 预览视口：外层盒子的尺寸照旧由 flex 定死（翻页 / 缩放都不会挪动这一屏的版面），
   但内部现在是一个**真实的可横纵滚动视口**：整页始终完整存在于 .pvscene 里，
   视口装不下的部分靠拖动 / 滚动够得着，不再把页面裁成固定一片再当成全部。 */
.pvstage{flex:1;min-height:0;position:relative;display:flex}
.pvport{flex:1;min-width:0;min-height:0;overflow:auto;
        touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
        background:#eae4d4;border:1px solid var(--line-2);border-radius:16px;scrollbar-width:thin}
.pvport::-webkit-scrollbar{width:10px;height:10px}
.pvport::-webkit-scrollbar-thumb{background:rgba(16,48,43,.3);border-radius:8px}
.pvport::-webkit-scrollbar-track{background:transparent}
.pvport[data-pannable=x],.pvport[data-pannable=y],.pvport[data-pannable=xy]{cursor:grab}
.pvport.dragging{cursor:grabbing;user-select:none}
/* 画布：至少等于视口，放得下整页时就等于整页 + 四周留白；纸张按非负坐标摆在里面 */
.pvscene{position:relative;box-sizing:border-box}
.pvscene[data-scene-mode=void]{width:100%;height:100%;padding:12px}
/* 纸张：完整一页，宽高由 JS 按当前缩放档写死，块按整页坐标排，**不做任何裁切** */
.pvpaper{position:absolute;left:0;top:0;background:#fff;overflow:hidden;border:2px solid #8f8672;border-radius:2px}
.pvpaper .blk{position:absolute;border-radius:2px;background:#a49b85}
.pvpaper .blk.d{background:#5f5a4d}
.pvpaper .blk.m{background:#8d8672}
.pvpaper .blk.a{background:var(--teal-d)}
.pvpaper .blk.l{background:#c0b8a2}
/* 「排版示意」这张标签钉在**视口**右上角、不在可滚动的纸上：
   放大之后纸的四角都可能被拖出视野，标签跟着滚走就等于这条真话会消失。 */
.pv-badge{position:absolute;top:9px;right:9px;max-width:calc(100% - 18px);z-index:3;
  font-size:15px;font-weight:700;line-height:1.2;color:#fff;background:var(--cinnabar);border-radius:9px;padding:6px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未打开 / 打开中 / 打不开：同一块大区域照旧留着，但一律不画任何冒充文件内容的东西。
   竖向 space-between 把几条真话摊开，靠事实占位，不靠假页面占位。 */
.pv-void{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
         padding:22px 26px;border:2px dashed var(--line-2);border-radius:14px;background:var(--surface)}
.pvv-h{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:var(--ink)}
.pvv-h .pvv-ic{flex:none;color:var(--ink-3)}
.pvv-h .pvv-hx{margin-left:auto;font-size:16px;font-weight:600;color:var(--ink-3)}
/* 每条事实拆成「要点 + 说明」两栏：一来读起来是清单不是段落，二来这块大区域左右都有字，
   不会出现整条右侧竖列长期空着（三等分竖条空白门禁抓的就是那种"看着缺一块"）。 */
.pvv-r{display:flex;align-items:flex-start;gap:14px;font-size:19px;line-height:1.45;color:var(--ink-2);
       background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px 18px}
.pvv-r .sq{flex:none;width:12px;height:12px;border-radius:3px;background:var(--teal);margin-top:9px}
.pv-void[data-preview-void=failed] .pvv-r{background:var(--cinnabar-soft);border-color:#eed6d1}
.pvv-r.bad .sq{background:var(--cinnabar)}
.pvv-r .k{flex:none;width:40%;font-weight:700;color:var(--ink)}
.pvv-r .v{flex:1;min-width:0}
.pvv-r b{color:var(--ink);font-weight:700}
.pvv-f{font-size:17px;line-height:1.45;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}
/* 预览控件条：翻页 + 缩放，全部 >=56px 触控；按钮尺寸不随状态变化，切换只换配色 */
.pvbar{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 14px}
.pvb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pvbtn{min-width:56px;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--paper);
       display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;color:var(--ink)}
.pvbtn[aria-disabled=true]{opacity:.4}
.pvbtn.on{background:var(--deep);border-color:transparent;color:var(--emerald)}
.pvpage{flex:none;min-width:128px;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
/* 「可拖动查看」只在真的有平移余量时出现：没余量还挂着就是一句废话 */
.pvhint{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;
        background:var(--slate-soft);color:var(--slate-d);font-size:16px;font-weight:600;white-space:nowrap}
.pvhint[hidden]{display:none}
.pvsp{flex:1;min-width:8px}
.pvb-cap{margin-top:5px;font-size:17px;line-height:1.32;color:var(--ink-3)}
.pvb-cap b{color:var(--ink-2);font-weight:600}
/* ?debug=1 自证列：追加在预览右边，预览不缩水成缩略图，也不被盖住 */
.proofcol{flex:none;width:432px;display:flex;flex-direction:column;gap:9px;min-height:0}
.proofcol .pfhd{flex:none;font-size:16px;font-weight:700;color:var(--cinnabar-d);background:var(--cinnabar-soft);border-radius:12px;padding:7px 13px;line-height:1.3}
.proofcol .pgrp{padding:12px 15px}
.proofcol .pgrp h4{font-size:19px}
.proofcol .plan li{font-size:15px;line-height:1.35}
.proofcol .plan{margin-top:8px;gap:7px}
.proofcol .kv{gap:6px;margin-top:8px}
.proofcol .kv>div{font-size:15px;line-height:1.3}
.proofcol .kv>div>span:first-child{width:92px}
.proofcol .pgrp .foot{font-size:14px;padding-top:8px;margin-top:8px;line-height:1.35}
.tstrip{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 18px;font-size:18px;color:var(--ink-2)}
.proofcol .tstrip{padding:9px 14px;font-size:16px;gap:9px}
.tstrip b{color:var(--ink);font-weight:700}
.tstrip .tagx{margin-left:auto;font-size:16px;font-weight:700;color:#fff;background:var(--cinnabar);border-radius:10px;padding:5px 11px}
.actrow{display:flex;flex-direction:column;gap:10px}
/* 三个出口横排：结果页的视觉主角是文件本身，出口收成一行，不再吃掉半屏 */
.actrow.grid3{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.actrow.grid3>*{min-width:0}
.actrow.grid3 a,.actrow.grid3 .off{min-height:56px;align-items:flex-start;padding:9px 14px;font-size:19px;border-radius:16px;gap:11px}
.actrow.grid3 a .ai,.actrow.grid3 .off .ai{width:36px;height:36px;border-radius:11px}
.actrow.grid3 small{font-size:14px;line-height:1.32;margin-top:2px}
.actrow.grid3 .offwrap{height:100%;gap:6px}
.actrow.grid3 .offwrap>.off{flex:1}
.actrow.grid3>a{height:100%}
.actrow.grid3 .alt{min-height:48px;font-size:15px;padding:6px 14px;gap:8px;align-items:flex-start;line-height:1.3}
.actrow.grid3 .alt svg{flex:none;margin-top:2px}
.actrow.grid3 .off .offtag{margin-left:0;font-size:14px;padding:3px 8px;border-radius:8px}
.actrow.grid3 .extitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actrow a{display:flex;align-items:center;gap:14px;min-height:82px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);padding:0 22px;font-size:20px;font-weight:600}
.actrow a .ai{flex:none;width:46px;height:46px;border-radius:14px;background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.actrow small{display:block;margin-top:3px;font-size:15px;font-weight:400;color:var(--ink-3)}
.actrow .exbody{min-width:0;display:flex;flex-direction:column}
.actrow .extitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.actrow .off{display:flex;align-items:center;gap:14px;width:100%;min-height:82px;border-radius:18px;border:1px dashed var(--line-2);background:var(--paper);padding:0 22px;font-size:20px;font-weight:600;color:var(--ink-2)}
.actrow .off .ai{flex:none;width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.actrow .off .offtag{flex:none;margin-left:auto;font-size:16px;font-weight:700;color:var(--wheat-d);background:var(--wheat-soft);border-radius:10px;padding:6px 12px;white-space:nowrap}
.actrow .offwrap{display:flex;flex-direction:column;gap:8px}
.actrow .alt{display:flex;align-items:center;gap:10px;min-height:62px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:0 18px;font-size:17px;font-weight:600;color:var(--teal-d);line-height:1.35}
.state.hero{padding:32px 36px}
.state.hero .state-h{font-size:36px}
.state.hero .state-p{font-size:25px;line-height:1.62;margin-top:14px}
.state.hero .meta{margin-top:16px}
.state.hero .meta .chip{min-height:56px;font-size:20px;padding:0 20px}
.body.spread .pgrp{padding:22px 26px}
.body.spread .pgrp h4{font-size:23px}
.body.spread .pgrp .state-p{font-size:20px;line-height:1.6}
.body.spread .plan li{font-size:20px;line-height:1.5}
.body.spread .pgrp .foot{font-size:18px;padding-top:14px}
.sec.grow>.pgrp{flex:1;min-height:0}
.sec.grow>.grid2>.pgrp{min-height:0}
/* 内容天然偏少的在途 / 终态屏：不撑满卡片，把余量分给版块之间的呼吸位 */
.body.spread{justify-content:space-between}
.body.spread>.ctabar{margin-top:0}
.emptybox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:20px;line-height:1.6;color:var(--ink-2);padding:16px}
.emptybox .ei{width:88px;height:88px;border-radius:28px;background:var(--paper);border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}

/* 2026-09-05 体检修复：27 寸竖屏 1px≈0.31mm，13–15px 辅助文字站立读不清；统一提到 16px（正文字阶仍按规范 17–23）。 */
.mini,.link .lc,.link .who,.pvh-2 .tagx,.proofcol .plan li,.proofcol .kv>div,.proofcol .pgrp .foot,.grid3 small,.grid3 .alt,.grid3 .off .offtag,.actrow small{font-size:16px}
</style>
</head>
<body>
<div id="stage">
  <header class="topbar">
    <a class="back press" href="10-print-hub.html" data-route="/print-scan" aria-label="返回打印扫描"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#10302b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="logo"><div class="logo-mark serif">职</div><div class="logo-name">职易达</div></div>
    <div class="sp"></div>
    <div class="pill" id="pill"><span class="dot" id="pill-dot" aria-hidden="true"></span><span id="pill-txt">第 1 步 · 选扫描类型</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <section class="xq">
    <div class="xq-row">
      <div class="xq-face serif" aria-hidden="true">青</div>
      <div class="xq-main">

/* ------------------------------------------------------------------ 自动查询
   逐条对齐 apps/kiosk/src/pages/scan/ScanProgressPage.tsx 的运行时轮询：
     · 只有**一个** timer，而且是 setTimeout 不是 setInterval —— 固定间隔在网络变慢时
       会把请求堆叠成并发，而不是退避；
     · 进入等待立刻查一次（React 里的 `void poll()`），不先干等一个间隔；
     · 上一次查询**完全结束之后**才排下一次：waiting / matched、查询失败、回执不合同，
       都按 POLL_INTERVAL_MS 再查；
     · 终态（completed 含 file:null、failed、expired、cancelled）清 timer 并停下；
       取消 / 补查 / 重扫 / 回起点 / 凭证丢失 / 链接被拒同样先清 timer。
   in-flight 期间的点击和到期的 timer 一律不重入，所以任何时刻最多一个查询在途
   （data-poll-max-concurrent 就是钉这一条的）。 */
var POLL_INTERVAL_MS=3000;
var POLL_AUTO_STEPS={'waiting-delivery':1,'poll-failed':1};   /* 仍在进行 / 这一次没问到：接着自动查 */
var POLL_TERMINAL_STEPS={'completed':1,'completed-no-file':1,'failed':1,'expired':1,'cancelled':1};
var pollTimer=null,pollInFlight=false,pollOrigin='none',pollLive=0;
var PAUD={starts:0,ends:0,max:0,errors:0,retries:0};
function pollClear(){if(pollTimer!==null){clearTimeout(pollTimer);pollTimer=null}}
function pollSettle(){
 pollClear();
 if(!POLL_AUTO_STEPS[S.step])return;      /* 终态与取消 / 补查分支都落在这里停下 */
 pollTimer=setTimeout(function(){pollTimer=null;PAUD.retries++;doPoll('auto')},POLL_INTERVAL_MS);
}
/* 一次查询的完整生命周期：清待执行 timer → 置在途 → 等回执 → 落状态 → 决定要不要再排 */
function pollRun(origin,step,apply){
 if(S.busy||pollInFlight)return false;
 pollClear();                             /* 手动触发前先把待执行的自动查询清掉，不叠加 */
 pollInFlight=true;pollOrigin=origin;pollLive++;
 PAUD.starts++;if(pollLive>PAUD.max)PAUD.max=pollLive;
 inflight(step,function(){
  apply();
  pollLive--;pollInFlight=false;PAUD.ends++;
  if(S.step==='poll-failed'||S.step==='cancel-race-unknown')PAUD.errors++;
  pollSettle();
 });
 return true;
}
function doPoll(origin){return pollRun(origin||'manual','polling',function(){applyPoll(take('poll'),false)})}
/* 补查是取消竞态那一支的手动动作，不自动重排；但它如果落回等待页，等待页照旧自己查。 */
function doRecheck(){return pollRun('recheck','cancel-recheck',function(){applyPoll(take('poll'),true)})}
function doCancel(){
 inflight('cancelling',function(){
  var f=take('cancel');
  if(!f){S.lastErr=NO_RESP;S.step='cancel-failed';return}
  if(f.ok){S.lastStatus='cancelled';S.lastErr=null;S.cancelNote=null;S.step='cancelled';return}
  S.lastErr={code:f.code,message:f.message};
  if(f.code==='SCAN_TASK_ALREADY_COMPLETED'){S.cancelNote='already-completed';S.step='cancel-race';return}
  if(f.code==='SCAN_TASK_CANCEL_CONFLICT'){S.cancelNote='conflict';S.step='cancel-conflict';return}
  S.step='cancel-failed';
 });
}
/* 匿名预览只有一个来源：completed 回执里的 file.fileUrl（那条 /content 签名 URL）。
   没有它就没有可打开的东西，本页也**不会**改去调 preview-url —— 那条端点要登录，
   匿名会被 401 AUTH_REQUIRED 挡掉。所以这里 fail-closed 直接不动，不发起任何调用。 */
function doPreview(){
 if(!S.file||!S.file.fileUrl)return;
 S.previewTries++;
 /* 每次重新打开都回到默认视图（第一张 · 适应整页 · 整页 100% 可见），
    免得上一次缩放留下的裁切窗口被当成这份文件本来的样子。 */
 pvReset();
 inflight('preview-loading',function(){
  var f=take('preview');
  /* 验签失败 / 打不开都只影响预览这一件事：不动 S.file，不动 S.lastStatus，
     也不画任何冒充这份文件内容的东西。 */
  if(!f||!f.ok){S.lastErr=f?{code:f.code,message:f.message}:NO_RESP;S.preview='failed';S.step='preview-failed';return}
  S.lastErr=null;S.preview='ready';S.step='preview-ready';
 });
}

  else h+='<button type="button" class="'+cls+'" data-act="'+it.act+'"'+grow+tid+'>'+it.label+'</button>';
 }
 return (reason?'<div class="cta-reason" data-testid="'+SCREEN+'-disabled-reason">'+esc(reason)+'</div>':'')+'<div class="ctabar">'+h+'</div>';
}
/* cls: true = 撑满剩余高度并收尾（grow last）；也可以直接给 'last' 之类的类名 */
function sec(no,title,hint,inner,cls){
 if(cls===true)cls='grow last';
 var label=title?'<div class="sec-label">'+(no?'<span class="no serif">'+no+'</span>':'')+'<span class="t">'+title+'</span>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>':'';
 return '<section class="sec'+(cls?' '+cls:'')+'">'+label+inner+'</section>';
}
function head(icon,text,breathe){
 return '<div class="state-h">'+(breathe?'<span class="dot16 breathe"></span>':svg(icon,28))+esc(text)+'</div>';
}
function p(html){return '<div class="state-p">'+html+'</div>'}
function chips(list){
 var h='';for(var i=0;i<list.length;i++){var q=list[i].split('|');h+='<span class="chip'+(q[1]?' '+q[1]:'')+'">'+q[0]+'</span>'}
 return '<div class="meta">'+h+'</div>';
}
function statePanel(kind,inner,variant){
 return '<div class="state'+(variant?' '+variant:'')+'" data-kind="'+kind+'" data-testid="'+SCREEN+'-fallback">'+inner+'</div>';
}
/* 版块堆叠：按顺序渲染，'#' 自动顺延编号；标了 'grow' 的那块撑满剩余高度，
   没标就让最后一块撑满。这样「主任务在前、自证在后」时不会在中间留大片空白。 */
var LAYOUT='grow';   /* 'grow' = 最后一块撑满；'spread' = 版块之间均分余量。render() 每次重置。 */
function stack(list,spread){
 var rows=[],i;
 for(i=0;i<list.length;i++)if(list[i])rows.push(list[i]);
 var growAt=-1,n=0,out='';
 if(spread)LAYOUT='spread';
 for(i=0;i<rows.length;i++)if(rows[i][4]==='grow')growAt=i;
 if(!spread&&growAt<0)growAt=rows.length-1;
 for(i=0;i<rows.length;i++){
  var r=rows[i],no=r[0]==='#'?('0'+(++n)):r[0];
  out+=sec(no,r[1],r[2],r[3],(!spread&&i===growAt)?true:(i===rows.length-1?'last':''));
 }
 return out;
}
/* 演示自证区：会话事实、服务端回执原样、状态枚举与技术限制。
   这些是给做验收的人看的，不是给来扫一份简历的人看的 —— 所以只在 ?debug=1 下渲染。
   普通用户视图（含 ?capture=1 出图）只留：当前状态 / 当前事实 / 下一步。 */
function proofSection(proof,extraRows){
 if(!DEBUG)return null;
 return ['','本屏自证 · 只在 ?debug=1 下显示','会话事实、服务端回执原样、状态枚举与技术限制',
  '<div class="factwrap"><div class="grid2 top">'+taskCard(extraRows)+evidenceCard()+'</div>'+(proof||'')+'</div>'];
}
/* 状态类页面统一骨架：当前状态（主视野）→（链路位置）→ 下一步；自证只在演示模式下追加。
   一律用 spread 排：卡片按内容收住，余量走版块之间的呼吸位，不靠拉伸卡片填满高度。 */
function statusBody(kind,panelInner,chainIdx,chainTitle,chainHint,nextCards,proof,extraRows){
 var cards=[],i;
 for(i=0;i<(nextCards||[]).length;i++)if(nextCards[i])cards.push(nextCards[i]);
 var next=cards.length?(cards.length>1?'<div class="grid2 top">'+cards.join('')+'</div>':cards[0]):null;
 return stack([
  ['','',null,statePanel(kind,panelInner,'hero')],
  (chainIdx===null||DEBUG)?null:['#',chainTitle,chainHint,chain(chainIdx)],
  (next&&!DEBUG)?['#','下一步','这一屏现在能做什么',next]:null,
  proofSection(proof,extraRows)
 ],true);
}

/* --------------------------------------------------------- 预览排版与平移
   2026-08-27 第四次返修。上一版的缩放是「只渲染看得见的那一块」：纸张盒子永远等于
   可见窗口，越出窗口的块直接不渲染或按窗口裁短，offX=(pw-visW)/2、offY=0 写死。
   那样版面确实不跳，但整页**只剩固定的一片**：放大之后页脚、右栏、印章位永远够不到，
   预览也就答不了「要打印的是不是这一份」—— 它本来就是为了回答这个才存在的。
   现在换成真视口：
     · .pvport 自己 overflow:auto，横纵都能滚；触控走原生 pan，鼠标走指针拖动；
     · .pvscene 至少等于视口，放得下整页时就等于整页加四周留白；
     · .pvpaper 取当前缩放档下**完整一页**的尺寸，坐标恒为非负，整页的块一个不裁。
   于是：适应整页正好没有平移余量（四边同时可见）；适应宽度只剩纵向余量（滚得到页底）；
   再放大就横纵都有余量，top / bottom / left / right 四边都够得到。
   缩放仍然**不用 CSS transform**：transform 之后越出的是祖先版面，几何门禁抓到的是真溢出；
   这里的溢出只发生在自己的滚动容器内部，外层 stage 的 scrollWidth / scrollHeight 一动不动。 */
var PV_PAD=12;      /* 纸张四周留白，算进 scene 尺寸，不靠 .pvport 的 padding —— 滚动容器的尾边 padding 各引擎不一致 */
var PV_BD=2;        /* .pvpaper 的边框，box-sizing:border-box */
var STAGE_SCALE=1;  /* fit() 写入：拖动时鼠标位移是屏幕像素，要除掉这个比例才是 stage 内的像素 */
/* render() 每次重建 DOM，滚动位置不会自己带过来，所以平移位置记在这里，布局完再落回去 */
var pvAnchor={fx:.5,fy:0};
var pvDrag={on:false,id:null,x:0,y:0,l:0,t:0,count:0};

function pvResetPan(){pvAnchor={fx:.5,fy:0}}   /* 横向居中、纵向回到页顶 */
function pvKeepPan(){                          /* 缩放时保持视口中心，四边照旧够得到 */
 var port=document.getElementById('pvport');
 if(!port||!port.scrollWidth||!port.scrollHeight){pvResetPan();return}
 pvAnchor={fx:(port.scrollLeft+port.clientWidth/2)/port.scrollWidth,
           fy:(port.scrollTop+port.clientHeight/2)/port.scrollHeight};
}
/* 平移语义写到 root 上：都是几何数字与开关，不含 fileId / sha256 / fileUrl / 凭证 */
function pvPanAttrs(){
 var root=document.getElementById('body-root'),port=document.getElementById('pvport');
 if(!root)return;
 var maxX=0,maxY=0,sl=0,st=0;
 if(port){
  maxX=Math.max(0,port.scrollWidth-port.clientWidth);
  maxY=Math.max(0,port.scrollHeight-port.clientHeight);
  sl=port.scrollLeft;st=port.scrollTop;
 }
 var pan=((maxX>1?'x':'')+(maxY>1?'y':''))||'none';
 root.setAttribute('data-preview-scroll-left',String(Math.round(sl)));
 root.setAttribute('data-preview-scroll-top',String(Math.round(st)));
 root.setAttribute('data-preview-max-scroll-x',String(Math.round(maxX)));
 root.setAttribute('data-preview-max-scroll-y',String(Math.round(maxY)));
 root.setAttribute('data-preview-pannable',pan);
 root.setAttribute('data-preview-panning',pvDrag.on?'dragging':'idle');
 root.setAttribute('data-preview-pans',String(pvDrag.count));
 if(port)port.setAttribute('data-pannable',pan);
 pvHint(pan!=='none');
}
/* 「可拖动查看」只在真的有余量时出现：没余量还挂着就是一句废话。
   注意它必须在**量视口之前**定下来 —— 这颗标签会让控件条换行、把视口压矮 48px，
   量完再切就会让刚写上去的 maxScrollY 立刻过期。 */
function pvHint(on){
 var hint=document.querySelector('[data-preview-pan-hint]');
 if(hint)hint.hidden=!on;
}
/* 鼠标拖动平移。触控不接管：.pvport 的 touch-action:pan-x pan-y 把触控交给浏览器原生滚动，
   比自己模拟跟手，也不会和惯性、边界回弹打架。 */
function pvBindPan(port){
 port.addEventListener('scroll',pvPanAttrs,{passive:true});
 port.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch')return;
  if(e.button)return;
  if(port.scrollWidth-port.clientWidth<=1&&port.scrollHeight-port.clientHeight<=1)return;
  pvDrag.on=true;pvDrag.id=e.pointerId;pvDrag.x=e.clientX;pvDrag.y=e.clientY;
  pvDrag.l=port.scrollLeft;pvDrag.t=port.scrollTop;pvDrag.count++;
  port.classList.add('dragging');
  try{port.setPointerCapture(e.pointerId)}catch(err){}
  pvPanAttrs();e.preventDefault();
 });
 port.addEventListener('pointermove',function(e){
  if(!pvDrag.on||e.pointerId!==pvDrag.id)return;
  var s=STAGE_SCALE||1;
  port.scrollLeft=pvDrag.l-(e.clientX-pvDrag.x)/s;
  port.scrollTop=pvDrag.t-(e.clientY-pvDrag.y)/s;
  e.preventDefault();
 });
 var stop=function(e){
  if(!pvDrag.on)return;
  if(e&&e.pointerId!==undefined&&e.pointerId!==pvDrag.id)return;
  pvDrag.on=false;pvDrag.id=null;port.classList.remove('dragging');
  pvPanAttrs();
 };
 port.addEventListener('pointerup',stop);
 port.addEventListener('pointercancel',stop);
 port.addEventListener('lostpointercapture',stop);
}
function layoutPreview(){
 var root=document.getElementById('body-root');
 if(!root)return;
 var port=document.getElementById('pvport'),scene=document.getElementById('pvscene'),paper=document.getElementById('pvpaper');
 root.setAttribute('data-preview-pages',String(PV_PAGES.length));
 if(!port||!scene||!paper){
  root.setAttribute('data-preview-page','0');
  root.setAttribute('data-preview-visible','none');
  root.setAttribute('data-preview-zoom','none');
  pvPanAttrs();
  return;
 }
 var lv=PV_LEVELS[S.pvLevel]||PV_LEVELS[0];
 /* 两趟测量：滚动条一出现，clientWidth / clientHeight 就缩一圈；按缩之前的尺寸铺纸
    会凭空多出一条横向余量。第二趟按真实内容盒重算一次即收敛。 */
 function measure(){
  var viewW=Math.max(40,port.clientWidth),viewH=Math.max(40,port.clientHeight);
  var availW=Math.max(40,viewW-2*PV_PAD-2*PV_BD),availH=Math.max(40,viewH-2*PV_PAD-2*PV_BD);
  var k=(lv[0]==='width'?(availW/PV_PAGE_W):Math.min(availW/PV_PAGE_W,availH/PV_PAGE_H))*lv[1];
  var pw=PV_PAGE_W*k,ph=PV_PAGE_H*k;                /* 整页内容区 */
  var boxW=pw+2*PV_BD,boxH=ph+2*PV_BD;              /* 含边框的纸张盒子 */
  /* 装得下就让画布正好等于视口（纸居中，四周是视口自己的余量）——
     这时候**一点平移余量都不留**，不然「整页完整显示」和「可拖动查看」会同时挂着；
     装不下才补 PV_PAD，让拖到尽头时纸的边缘不贴着视口边。 */
  return {viewW:viewW,viewH:viewH,pw:pw,ph:ph,boxW:boxW,boxH:boxH,
          sceneW:boxW<=viewW?viewW:(boxW+2*PV_PAD),
          sceneH:boxH<=viewH?viewH:(boxH+2*PV_PAD)};
 }
 function place(g){
  scene.style.width=g.sceneW.toFixed(1)+'px';
  scene.style.height=g.sceneH.toFixed(1)+'px';
  /* scene 至少和纸一样大，所以这两个坐标恒为非负，纸永远整个落在 scene 里面 */
  paper.style.left=((g.sceneW-g.boxW)/2).toFixed(1)+'px';
  paper.style.top=((g.sceneH-g.boxH)/2).toFixed(1)+'px';
  paper.style.width=g.boxW.toFixed(1)+'px';
  paper.style.height=g.boxH.toFixed(1)+'px';
 }
 /* 先按试算结果定「可拖动查看」的显隐，再正式量：这颗标签一出现就会把控件条撑高、
    把视口压矮，量在它前面写出来的滚动余量当场就是错的。 */
 var g=measure();
 pvHint(g.sceneW>g.viewW+1||g.sceneH>g.viewH+1);
 g=measure();place(g);
 var g2=measure();
 if(Math.abs(g2.viewW-g.viewW)>0.5||Math.abs(g2.viewH-g.viewH)>0.5){g=g2;place(g)}
 /* 整页的块一个不落地按整页坐标渲染：没有 offX / offY，没有按窗口裁短，没有跳过 */
 var blocks=PV_PAGES[S.pvPage-1],h='',i,b;
 for(i=0;i<blocks.length;i++){
  b=blocks[i];
  h+='<span class="blk '+b[4]+'" style="left:'+(b[0]*g.pw).toFixed(1)+'px;top:'+(b[1]*g.ph).toFixed(1)+
     'px;width:'+Math.max(.6,b[2]*g.pw).toFixed(1)+'px;height:'+Math.max(.6,b[3]*g.ph).toFixed(1)+'px"></span>';
 }
 paper.innerHTML=h;
 /* 可见比例 = 视口这一刻装得下整页的多少；适应整页应当正好是 1。
    剩下的部分不是没画，是拖一下就到。 */
 var ratio=(Math.min(g.boxW,g.viewW)/g.boxW)*(Math.min(g.boxH,g.viewH)/g.boxH);
 var overX=g.boxW>g.viewW+.5,overY=g.boxH>g.viewH+.5;
 paper.setAttribute('data-page-visible',ratio.toFixed(3));
 /* data-page-crop 沿用旧名与旧取值（b / x / bx / none），但含义已经变了：
    它标的是**视口这一刻装不下的方向**，不再是「被裁掉的边」—— 那些部分拖得到。 */
 paper.setAttribute('data-page-crop',(overY||overX)?((overY?'b':'')+(overX?'x':'')):'none');
 paper.setAttribute('data-page-blocks',String(blocks.length));
 root.setAttribute('data-preview-page',String(S.pvPage));
 root.setAttribute('data-preview-visible',ratio.toFixed(3));
 root.setAttribute('data-preview-zoom',lv[0]+':'+lv[1].toFixed(3));
 /* 把视口中心落回上一次的相对位置；换页 / 适应整页 / 适应宽度 / 重开预览前 pvAnchor 已被重置 */
 var maxX=Math.max(0,g.sceneW-g.viewW),maxY=Math.max(0,g.sceneH-g.viewH);
 port.scrollLeft=Math.max(0,Math.min(maxX,pvAnchor.fx*g.sceneW-g.viewW/2));
 port.scrollTop=Math.max(0,Math.min(maxY,pvAnchor.fy*g.sceneH-g.viewH/2));
 pvBindPan(port);
 pvPanAttrs();
 /* 「整页完整显示」这个标签必须跟着实测的可见比例走：只露出一部分还挂着它就是伪造。 */
 var chip=root.querySelector('[data-preview-fit-chip]');
 if(chip){
  var whole=ratio>0.999;
  chip.className='chip'+(whole?' ok':' warn');
  chip.textContent=whole?'整页完整显示':'当前只显示这一页的一部分';
 }
}

/* ------------------------------------------------------------------ 渲染 */
function banner(){
 var el=document.getElementById('dbanner');
 if(!DEMO){if(el)el.parentNode.removeChild(el);return}
 if(!el){el=document.createElement('div');el.id='dbanner';el.className='dbanner';el.setAttribute('data-testid','scan-workbench-demo-banner');
  document.getElementById('stage').insertBefore(el,document.querySelector('.xq'))}
 var withFx=Q.get('fx')!==null&&!BLOCK;
 el.innerHTML='<span class="dtag">演示模式</span><span class="dtext">'+(withFx
  ? '本页的服务端结果全部来自<b>服务端响应夹具</b>，编号与文件都带 DEMO 前缀，<b>不可作为真实任务</b>。'
  : '未提供服务端响应夹具，<b>所有服务端请求一律按失败处理</b>，到不了完成态。')+'</span>';
}
function render(){
 var root=document.getElementById('body-root'),st=S.step;
 root.setAttribute('data-state',st);
 root.setAttribute('data-testid',SCREEN+'-state-'+st);
 root.setAttribute('data-scan-type',S.scanType||'none');
 root.setAttribute('data-task',S.taskId?'fixture':'none');
 root.setAttribute('data-file',S.file?'fixture':'none');
 root.setAttribute('data-server-status',S.lastStatus||'none');
 root.setAttribute('data-polls',String(S.polls));
 root.setAttribute('data-unknowns',String(S.unknowns));
 root.setAttribute('data-create-tries',String(S.createTries));
 root.setAttribute('data-preview-tries',String(S.previewTries));
 root.setAttribute('data-preview',S.preview);
 root.setAttribute('data-cancel-note',S.cancelNote||'none');
 root.setAttribute('data-demo',DEBUG?'debug':(CAPTURE?'capture':'off'));
 root.setAttribute('data-fixtures-left',String(FQ.length));
 /* 自动查询的可审计语义：全是计数与开关，不含任务编号、凭证、文件身份。
    间隔是合同值，演示模式也不改 —— 页面不给自己开一档看不见的加速。 */
 root.setAttribute('data-poll-interval',String(POLL_INTERVAL_MS));
 root.setAttribute('data-poll-origin',pollOrigin);
 root.setAttribute('data-poll-in-flight',pollInFlight?'1':'0');
 root.setAttribute('data-poll-timer-active',pollTimer!==null?'1':'0');
 root.setAttribute('data-poll-starts',String(PAUD.starts));
 root.setAttribute('data-poll-ends',String(PAUD.ends));
 root.setAttribute('data-poll-max-concurrent',String(PAUD.max));
 root.setAttribute('data-poll-terminal-stopped',(POLL_TERMINAL_STEPS[st]&&pollTimer===null)?'1':'0');
 root.setAttribute('data-poll-errors',String(PAUD.errors));
 root.setAttribute('data-poll-retries',String(PAUD.retries));
 LAYOUT='grow';
 root.innerHTML=V[st]();
 root.className='body'+(LAYOUT==='spread'?' spread':'');
 root.setAttribute('data-layout',LAYOUT);
 /* 合同违例时顶栏与旁白改口径：回执到了，只是本机认不了它 */
 var vio=violation();
 var pillDef=(vio&&PILL_VIO[st])||PILL[st];
 var askDef=(vio&&ASK_VIO[st])||ASK[st];
 var pl=document.getElementById('pill');
 pl.className='pill'+(pillDef[0]?' '+pillDef[0]:'');
 document.getElementById('pill-txt').textContent=pillDef[1];
 document.getElementById('pill-dot').className='dot'+(S.busy?' breathe':'');
 document.getElementById('xq-ask').innerHTML=askDef[0];
 document.getElementById('xq-doing').innerHTML=askDef[1];
 var fx=document.getElementById('xq-facts'),ft=FACT[st]||'';
 fx.innerHTML=ft?'<span>'+ft+'</span>':'';
 fx.style.display=ft?'':'none';
 /* 底部三列口径是一次性说明，只在起点和演示自证下出现，不每一屏复读 */
 var tr=document.getElementById('truth');
 if(tr)tr.style.display=(st==='setup')?'':'none';
 /* 预览排版必须在版面定完之后算：视口高度是 flex 撑出来的，读得到真实像素才好裁 */
 layoutPreview();
}
var ACTS={
 pick:function(el){if(S.busy)return;pollClear();S.scanType=el.getAttribute('data-type');ssWrite();render()},
 create:function(){if(S.busy||!S.scanType)return;pollClear();doCreate()},
 /* 进入等待就立刻查一次（对齐 React 的 `void poll()`），不先干等一个间隔；
    这一次落地之后由 pollSettle() 接着排后面的自动查询。 */
 wait:function(){if(S.busy)return;pollClear();S.step='waiting-delivery';ssWrite();render();doPoll('auto')},
 poll:function(){if(S.busy)return;doPoll('manual')},
 recheck:function(){if(S.busy)return;doRecheck()},
 cancel:function(){if(S.busy)return;pollClear();doCancel()},
 preview:function(){if(S.busy)return;pollClear();doPreview()},
 rescan:function(){if(S.busy)return;pollClear();resetSession();S.step='setup';ssWrite();render()},
 /* 六个预览控件只改预览内部的显示尺寸与平移位置：不发请求、不动 S.file、不动 S.lastStatus，
    也不改任何外层盒子的尺寸，所以点它们不会让这一屏的版面挪位。
    换页与适应整页 / 适应宽度一律把平移复位；放大缩小保持视口中心，四边照旧够得到。 */
 pvprev:function(){if(S.busy||S.preview!=='ready'||S.pvPage<=1)return;S.pvPage--;pvResetPan();render()},
 pvnext:function(){if(S.busy||S.preview!=='ready'||S.pvPage>=PV_PAGES.length)return;S.pvPage++;pvResetPan();render()},
 pvfit:function(){if(S.busy||S.preview!=='ready')return;S.pvLevel=0;pvResetPan();render()},
 pvwide:function(){if(S.busy||S.preview!=='ready')return;S.pvLevel=1;pvResetPan();render()},
 pvin:function(){if(S.busy||S.preview!=='ready'||S.pvLevel>=PV_LEVELS.length-1)return;pvKeepPan();S.pvLevel++;render()},
 pvout:function(){if(S.busy||S.preview!=='ready'||S.pvLevel<=0)return;pvKeepPan();S.pvLevel--;render()}
};
document.addEventListener('click',function(e){
 var el=e.target.closest?e.target.closest('[data-act]'):null;
 if(!el)return;
 var fn=ACTS[el.getAttribute('data-act')];
 if(fn){e.preventDefault();fn(el)}
});

/* 首屏落点：参数不合法 → blocked；本 tab 开过会话但凭证已随刷新丢失 → session-lost；否则 setup */
(function boot(){
 banner();
 if(BLOCK){S.step='blocked';render();return}
 if(Q.get('mode')==='usb-panel'){S.step='usb-panel';render();return}
 var prev=ssRead();
 if(prev&&prev.step&&prev.step!=='setup'){S.step='session-lost';render();return}
 ssClear();
 render();
})();

/* 页面离开（刷新 / 后退 / 关标签页）就把待执行的自动查询清掉：不留后台定时器 */
addEventListener('pagehide',pollClear);
addEventListener('beforeunload',pollClear);

/* 原型演示控制（非产品功能，只在 ?debug=1 下注入 DOM）：预置几条夹具队列的链接。
   P2：控件寄居在演示横幅内部，和横幅说明同一行、横向滚动，展开几乎不改变横幅高度。
   旧版是绝对定位的竖标签 + 抽屉面板，折叠时压住卡片左沿、展开时盖住整块自证区。 */
if(DEBUG){
 var presets=[['正常完成','create-ok,poll-waiting,poll-completed,preview-ok'],['建会话失败','create-busy'],
  ['查状态失败','create-ok'],['扫描失败','create-ok,poll-scan-failed'],['会话过期','create-ok,poll-expired'],
  ['取消成功','create-ok,cancel-ok'],['取消竞态·已完成','create-ok,cancel-already-completed,poll-completed'],
  ['取消竞态·未知','create-ok,cancel-already-completed,poll-error'],['取消冲突·仍等待','create-ok,cancel-conflict,poll-waiting'],
  ['预览签名失效·再开仍失败','create-ok,poll-completed,preview-expired,preview-error'],
  ['完成但回执没带文件','create-ok,poll-completed-nofile'],
  ['非法 status','create-ok,poll-bogus-status'],['文件字段只有一半','create-ok,poll-completed-partial']];
 var host=document.getElementById('dbanner');
 if(host){
  var tab=document.createElement('button');
  tab.type='button';tab.className='demo-tab';tab.id='demo-tab';tab.setAttribute('aria-label','展开或收起原型演示夹具预设');
  tab.setAttribute('data-proto-control','true');tab.textContent='夹具预设';
  var pnl=document.createElement('div');
  pnl.className='demo-panel';pnl.id='demo-panel';pnl.setAttribute('aria-label','原型演示控制');pnl.setAttribute('data-proto-control','true');
  var hh='<div class="dp-t">夹具预设 · 横向滑动</div>';
  for(var i=0;i<presets.length;i++)hh+='<a href="?debug=1&fx='+encodeURIComponent(presets[i][1])+'">'+presets[i][0]+'</a>';
  hh+='<a href="?debug=1">不给夹具（全失败）</a>';
  pnl.innerHTML=hh;
  host.appendChild(tab);host.appendChild(pnl);
  tab.addEventListener('click',function(){pnl.classList.toggle('show')});
 }
}

/* 时钟：仅刷新顶栏时间文本，不改 data-state、不推进任何业务状态 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
/* STAGE_SCALE 供预览拖动换算：鼠标位移是屏幕像素，scrollLeft/Top 是 stage 内的像素 */
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);STAGE_SCALE=s;document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(Q.get('flat')==='1')document.getElementById('stage').classList.add('flat');
</script>
