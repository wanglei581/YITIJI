<title>权益与活动 · 职易达</title>
<!--
  宿主：权益与活动共享工作台（024 / 032 / 033 共用一个青序流光宿主）
  route: /me/benefits     —— screen=benefits    （会员台账）
         /activities      —— screen=activities  （可匿名浏览）
         /activities/:id  —— screen=activity    （可匿名浏览，领取需登录）
  state: benefits:   list | signed-out | loading | empty | error
         activities: list | loading | empty | error
         activity:   detail | signed-out | claim-pending | claim-success | claim-error | ended | sold-out
  api:  GET  /api/v1/me/benefits              —— 本人权益台账（名称/来源活动/有效期/状态）
        GET  /api/v1/activities?page          —— 活动列表；结束与领完由服务端标注
        GET  /api/v1/activities/:id           —— 活动详情 + eligibility（确定性判定，零 LLM）
        POST /api/v1/activities/:id/claim     —— 领取；成功、失败、重复领取均以服务端返回为准，幂等
        对齐 apps/kiosk/src/pages/benefits/* 与 compliance-boundary §八
  fallback: 领取失败 / 结束 / 领完 → 明确原因 + 返回台账或活动列表，不重试成假成功
  真话边界：
    ① benefits:list 展示完整的 MemberBenefitItem 结构位，不预置真实优惠券名称、次数、金额或有效期；
       类型、状态、来源、额度与有效期字段全部由服务端回填，结构示例只在 debug 模式开放。
    ② 不承诺「免费打印 / 免费扫描 / 免费优化 / 免费生成」；只有服务端实际返回额度时才显示总量与剩余量。
       是否收费、收多少，以活动说明与现场公示价、服务端报价为准。
    ③ 资格由确定性接口与官方规则判定；AI 只解释已经返回的规则，不判定你是否符合条件。
    ④ 补贴类只做说明、清单与官方入口，不承诺补贴到账，不代办申请（compliance §8.2）。
    ⑤ 权益不换取简历、不回流候选人数据；企业赞助只体现为品牌露出（compliance §8.3）。
  ai-mode: AI-EXPLAIN（覆盖矩阵 024 / 032 / 033）
  ai-input: 仅本页已返回的活动规则、权益状态与失败原因
  ai-consent: 页内不放 AI 生成控件；用户主动去底栏「AI 顾问」才进入 AI
  ai-output: 只把规则和状态解释成人话，并给出人工处理建议；不改变资格、领取与核销结果
  ai-failure: 不适用（本页不发起 AI 调用）
  ai-fallback: 规则原文常驻可读，看不懂可找现场工作人员
  ai-persistence: 本页不生成 AI 记录
  原型演示控制：状态只通过 ?screen= 与 ?state= 切换（?debug=1 显示演示面板）
  验收范围：静态原型表现；不证明 React 接线、API 可用、真实活动数据、领取或核销
-->
<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink-2:#3d5a52;--ink-3:#6b857c;
  --deep:#0b241e;--deep-2:#123a30;--emerald:#2ee6a8;

  --wheat:#a9781f;--wheat-d:#8a6219;--wheat-soft:#f3ecda;
  --plum:#7a5a86;--plum-d:#6b4a77;--plum-soft:#efe8f2;

#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
ul{list-style:none}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{flex:none;height:100px;display:flex;align-items:center;gap:16px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);display:flex;align-items:center;justify-content:center}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:46px;height:46px;border-radius:var(--r);background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.logo-name{font-size:25px;font-weight:700;letter-spacing:2px}
.sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:18px;font-weight:600;max-width:600px;white-space:nowrap;overflow:hidden}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}.pill.bad .dot{background:var(--cinnabar)}
.clock{flex:none;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}

.taskhead{flex:none;margin:18px 40px 0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.th-t{font-size:38px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:14px}
.th-t::before{content:"";flex:none;width:8px;height:34px;border-radius:2px;background:linear-gradient(180deg,var(--emerald),var(--teal))}
.th-s{flex:1;min-width:260px;font-size:20px;line-height:1.4;color:var(--ink-2)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 40px}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-top:16px;scrollbar-width:none}

.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:2px}
.sec-h .t{font-size:25px;font-weight:700}

.tabs{flex:none;display:flex;gap:10px;margin-top:16px}

.tag{min-height:40px;padding:0 12px;border-radius:var(--r-s);font-size:17px;font-weight:600;display:inline-flex;align-items:center;background:var(--slate-soft);color:var(--slate-d)}
.tag.teal{background:var(--teal-soft);color:var(--teal-d)}
.tag.warn{background:var(--wheat-soft);color:var(--wheat-d)}
.tag.bad{background:var(--cinnabar-soft);color:var(--cinnabar-d)}
.tag.plum{background:var(--plum-soft);color:var(--plum-d)}
.slot{display:inline-block;min-width:92px;border-bottom:2px dotted var(--line-2);color:var(--ink-3);font-weight:400}
.slot.big{min-width:300px;font-weight:700;color:var(--ink-3)}
.slot.wide{min-width:360px}
.item-note .slot{border-bottom-color:#b9c9e0;color:var(--slate-d)}

.card{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.blk-h{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;margin-bottom:14px}
.blk-h .hint{margin-left:auto;font-size:18px;font-weight:600;color:var(--ink-3)}
.kv{display:flex;flex-direction:column;gap:12px}
.kv-row{display:flex;gap:16px;align-items:flex-start;font-size:20px;line-height:1.5}
.kv-k{flex:none;width:140px;color:var(--ink-3);font-weight:600}
.kv-v{flex:1;min-width:0;color:var(--ink-2)}
.rules{display:flex;flex-direction:column;gap:9px}
.rule{display:flex;gap:10px;font-size:19px;line-height:1.5;color:var(--ink-2)}
.rule i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:9px}
.rule.no i{background:var(--wheat)}
.explain{border-left:4px solid var(--plum)}
.explain .blk-h{color:var(--plum-d)}

.state{flex:none;display:flex;flex-direction:column;gap:16px;padding:42px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=info]{background:var(--teal-soft);border-color:#c6e4da}
.state[data-kind=lock]{background:var(--plum-soft);border-color:#ddd0e3}
.state-h{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
.state-p{font-size:21px;line-height:1.6;color:var(--ink-2);max-width:880px}

.state-acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.skel-row{min-height:172px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:22px}
.skel-line{height:20px;border-radius:var(--r-s);background:#eee9db}

.state.tight{padding:32px 32px;gap:12px}

.alt-tx{flex:1;min-width:0}

.alt-d{display:block;margin-top:5px;font-size:18px;line-height:1.4;color:var(--ink-2)}

.ctabar .btn{flex:1}

.ctabar .why{flex:1.15;font-size:17px;line-height:1.4;color:var(--wheat-d);font-weight:600}

.truth{flex:none;min-height:58px;padding:11px 40px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;margin-top:14px}

.truth a{flex:none;min-height:48px;padding:0 14px;border-radius:var(--r-s);display:inline-flex;align-items:center;font-size:17px;font-weight:600;color:var(--teal-d)}
.navbar{flex:none;height:128px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.nav-item .ni{font-size:21px;color:var(--ink-3);font-weight:600}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var state=params.get('state')||(screen==='activity'?'detail':'list');
var key=screen+':'+state;
if(!VIEWS[key]){state=screen==='activity'?'detail':'list';key=screen+':'+state;}
var root=document.getElementById('body-root');
root.setAttribute('data-screen',screen);
root.setAttribute('data-state',state);
root.setAttribute('data-testid',screen+'-state-'+state);
root.innerHTML=VIEWS[key]();
if(PILL[key]){
  var p=document.getElementById('pill');
  p.className='pill'+(PILL[key][0]?' '+PILL[key][0]:'');
  document.getElementById('pill-txt').textContent=PILL[key][1];
}
if(HEAD[key]){
  document.getElementById('task-title').textContent=HEAD[key][0];
  document.getElementById('task-sub').textContent=HEAD[key][1];
}
var back=document.getElementById('backlink');
if(screen==='activities'){back.setAttribute('href','31-benefits.html');back.setAttribute('data-route','/me/benefits');back.setAttribute('aria-label','返回我的权益');}
if(screen==='activity'){back.setAttribute('href','31-benefits.html?screen=activities');back.setAttribute('data-route','/activities');back.setAttribute('aria-label','返回活动列表');}

function tick(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);

if(params.get('debug')==='1'){
  var tab=document.getElementById('demo-tab'),panel=document.getElementById('demo-panel'),html='';
  for(var k in VIEWS){
    var parts=k.split(':');
    html+='<a href="31-benefits.html?debug=1&screen='+parts[0]+'&state='+parts[1]+'">'+k+'</a>';
  }
  panel.innerHTML=html;tab.classList.add('on');
  tab.addEventListener('click',function(){panel.classList.toggle('on');});
}
})();
</script>
</body>
</html>
