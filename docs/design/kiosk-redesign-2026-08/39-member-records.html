<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的简历 · 收藏 · AI记录 · 足迹 ｜ 职易达</title>
<!--
  route: /me/resumes | /me/favorites | /me/ai-records | /me/activity | /me/activity/:id
  state: resumes-{login,loading,error,empty,ready} | favorites-{login,loading,error,empty,ready}
         | ai-records-{login,loading,error,empty,ready,delete-confirm,delete-expired,deleting,delete-success,delete-failure}
         | activity-{login,loading,error,browse-empty,jump-empty,applications-empty,browse-ready,jump-ready,applications-ready}
         | activity-detail-{login,loading,error,not-found,detail}
  api: GET /api/v1/me/resumes?pageSize=50（仅元数据）；GET /api/v1/me/favorites（type/cursor/pageSize，客户端逐页最多 10 页 500 条）；
       GET /api/v1/me/ai-records?pageSize=50 与 GET /api/v1/me/job-ai-sessions?pageSize=50 并行读取，
       DELETE /api/v1/me/ai-records/:id（parse 行服务端级联同任务派生记录与岗位 AI 会话）、DELETE /api/v1/me/job-ai-sessions/:id；
       GET /api/v1/me/browse-logs?pageSize=50 与 GET /api/v1/me/external-jump-logs?pageSize=50；
       记录详情没有独立端点：按 id 在上面两个列表里逐页查找，找不到即「未找到这条记录」。
  fallback: 未登录只引导登录，不展示任何本人内容；加载失败保留重试；空列表不造数据；
            简历任务未完成只保留禁用出口与原因；AI 记录删除失败保留原记录并提示可能已到期或被清理。
  note: 「取消」按钮与「确认时限已过」为本设计批次的可用性建议（当前 React 靠 3.5 秒后自动回到未确认状态，没有取消按钮）；
        其余文案、字段、动作与出口均对齐当前 React 页面与端点。
        /resume/job-fit（岗位匹配）的静态宿主是 46-resume-decision-workspace.html?screen=job-fit，
        本页的岗位匹配出口按真实链接渲染：不带 taskId 或任何合成 id，落到宿主的「未选目标岗位」态，
        由用户在那边自己选目标。这只说明静态宿主存在，不代表 React 页面或接口已经接通。
        仍待建 route：/renshi（政策列表）在青序流光里还没有宿主页面。
        这类出口一律渲染成常驻禁用元素：不带 href、aria-disabled=true、显著写明「对应页面待建设，暂不可进入」，
        并用 data-pending-route-host="true" + data-route 保留真实目标，只作迁移台账用；不落任何暂代页面，
        用户点它不会跳到 Hub，也不会以为目标页已经做完。
  原型演示控制：仅用 ?view= 与 ?state= 切换；ready 中的条目是排版示例，不代表真实账号数据。
-->
<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink2:#3d5a52;--ink3:#6b857c;
  --deep:#0b241e;--deep2:#123a30;--green:#2ee6a8;
  --teal:#1f9e86;--teal2:#157a67;--tealsoft:#e0f2ec;
  --slate:#3f68b0;--slate2:#35608f;--slatesoft:#e6ecf7;
  --clay:#b8683c;--clay2:#9e5330;--claysoft:#f7ebe1;
  --plum:#7a5a86;--plum2:#6b4a77;--plumsoft:#efe8f2;
  --wheat:#a9781f;--wheat2:#8a6219;--wheatsoft:#f3ecda;
  --line:#e3ddcb;--line2:#d4cdb6;--bad:#b23a2e;--badsoft:#f6e4e1;
  --ease:cubic-bezier(.22,1,.36,1);
  /* 与 00–15 定稿页同名令牌（值一致，供后续统一改名） */
  --ink-2:var(--ink2);--ink-3:var(--ink3);--deep-2:var(--deep2);--emerald:var(--green);
  --teal-d:var(--teal2);--teal-soft:var(--tealsoft);--slate-d:var(--slate2);--slate-soft:var(--slatesoft);
  --clay-d:var(--clay2);--clay-soft:var(--claysoft);--plum-d:var(--plum2);--plum-soft:var(--plumsoft);
  --wheat-d:var(--wheat2);--wheat-soft:var(--wheatsoft);--cinnabar:var(--bad);--cinnabar-soft:var(--badsoft);
  --line-2:var(--line2);--ease-out:var(--ease);
  --r-lg:32px;--r-md:24px;--r-sm:18px;--tap-min:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);overflow:hidden}
a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.press{transition:transform 140ms var(--ease),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{width:1080px;height:1920px;position:relative;display:flex;flex-direction:column;overflow:hidden;transform-origin:center center;
  background:radial-gradient(900px 420px at 86% 6%,rgba(31,158,134,.07),transparent 60%),radial-gradient(820px 500px at -6% 58%,rgba(122,90,134,.05),transparent 56%),var(--paper)}
.serif{font-family:"Songti SC","STSong","SimSun",serif}

.topbar{height:104px;flex:none;padding:0 36px;display:flex;align-items:center;gap:18px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{width:64px;height:64px;display:grid;place-items:center;border-radius:20px;border:1px solid var(--line2);background:var(--paper)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--deep);color:var(--green);font-size:24px;font-weight:800}
.logo-name{font-size:26px;font-weight:800;letter-spacing:1px}
.sp{flex:1}
.pill{height:54px;padding:0 22px;border-radius:27px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);font-size:19px;font-weight:700}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--teal)}
.pill .dot.breathe{animation:breathe 2.2s var(--ease) infinite}
.clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

.xq{margin:22px 42px 0;padding:28px 38px;border-radius:34px;flex:none;background:linear-gradient(158deg,var(--deep2),var(--deep));color:#f2efe4;position:relative;overflow:hidden}
.xq::after{content:"";position:absolute;right:-150px;top:-150px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(46,230,168,.15),transparent 66%)}
.xq-row{display:flex;align-items:center;gap:24px;position:relative;z-index:1}
.xq-face{width:88px;height:88px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(46,230,168,.4);background:rgba(46,230,168,.1);color:var(--green);font-size:40px}
.xq-eyebrow{font-size:17px;letter-spacing:5px;color:rgba(242,239,228,.5);margin-bottom:7px}
.xq-ask{font-size:37px;line-height:1.28;font-weight:800}
.xq-ask em{font-style:normal;color:var(--green)}
.xq-doing{font-size:20px;line-height:1.5;color:rgba(242,239,228,.74);margin-top:9px}
.xq-doing b{color:#fff;font-weight:700}

.viewtabs{margin:18px 42px 0;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vtab{min-height:76px;padding:0 10px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:21px;font-weight:800}
.vtab span{font-size:15px;font-weight:600;color:var(--ink3)}
.vtab.on{background:var(--deep);border-color:var(--deep);color:#fff}
.vtab.on span{color:rgba(242,239,228,.66)}

.body{flex:1;min-height:0;padding:20px 42px 16px;display:grid;gap:14px;overflow:hidden}
/* 每种布局的 1fr 都落在**主内容**上，不再落到说明栅格上 */
.body.state-layout{grid-template-rows:auto minmax(0,1fr) auto auto}            /* banner · 主内容 · 说明 · 操作 */
.body.list-layout{grid-template-rows:auto auto minmax(0,1fr) auto}             /* 示例条 · 概览 · 列表 · 操作 */
.body.list5-layout{grid-template-rows:auto auto auto minmax(0,1fr) auto}       /* 示例条 · 概览 · 筛选 · 列表 · 操作 */
.body.empty-layout{grid-template-rows:auto auto minmax(0,1fr) auto auto}       /* 概览 · 筛选 · 主内容 · 说明 · 操作 */
.body.detail-layout{grid-template-rows:auto auto minmax(0,1fr) auto}          /* 示例条 · 记录抬头 · 字段清单 · 操作 */

.card,.state{background:var(--surface);border:1px solid var(--line);border-radius:26px}
.card{padding:24px 26px}

/* 状态横幅：取代「小卡片 + 大片空白」的居中焦点卡 */
.banner{flex:none;display:flex;align-items:center;gap:20px;padding:20px 24px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.banner-ico{width:72px;height:72px;flex:none;border-radius:22px;display:grid;place-items:center;background:var(--slatesoft);color:var(--slate2)}
.banner-ico svg{width:34px;height:34px}
.banner-ico[data-tone=lock]{background:var(--plumsoft);color:var(--plum2)}
.banner-ico[data-tone=warn]{background:var(--badsoft);color:var(--bad)}
.banner-ico[data-tone=calm]{background:var(--tealsoft);color:var(--teal2)}
.banner-main{flex:1;min-width:0}
.banner-t{display:block;font-size:28px;font-weight:800;line-height:1.28}
.banner-p{display:block;margin-top:7px;font-size:19px;line-height:1.5;color:var(--ink3)}
.banner-p b{color:var(--ink2)}
.banner-mini{flex:none;display:flex;flex-direction:column;gap:6px;text-align:right}
.banner-mini i{font-style:normal;font-size:17px;font-weight:700;color:var(--ink2)}

/* 接口回填结构位与骨架条 */
.slot{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:10px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink3);font-size:16px;font-weight:700}
.slot.lock{border-style:solid;background:#efeade;color:#6d7069}
.skel{height:22px;border-radius:8px;background:#ece7d9}
.skel.t{width:54%}
.skel.s{display:block;width:36%;height:18px;margin-top:12px}
.row-ico[data-tone=off]{background:#ded9cb;color:#6d7069}

.summary{display:flex;align-items:center;gap:20px;padding:20px 26px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.summary-ico{width:66px;height:66px;flex:none;border-radius:20px;display:grid;place-items:center;background:var(--tealsoft);color:var(--teal2)}
.summary-ico svg{width:32px;height:32px}
.summary-ico.plum{background:var(--plumsoft);color:var(--plum2)}
.summary-ico.clay{background:var(--claysoft);color:var(--clay2)}
.summary-ico.slate{background:var(--slatesoft);color:var(--slate2)}
.summary-main{flex:1;min-width:0}
.summary-main b{display:block;font-size:19px;color:var(--ink3);font-weight:700}
.summary-main strong{display:block;font-size:34px;font-weight:800;line-height:1.2;margin-top:2px}
.summary-main span{display:block;margin-top:4px;font-size:17px;color:var(--ink3);line-height:1.45}
.summary-mini{display:flex;flex-direction:column;gap:6px;flex:none;text-align:right}
.summary-mini i{font-style:normal;font-size:17px;font-weight:700;color:var(--ink2)}

.tabbar{display:grid;gap:10px;flex:none}
.tabbar.n4{grid-template-columns:repeat(4,1fr)}
.tabbar.n2{grid-template-columns:repeat(2,1fr)}
.tabbar.n3{grid-template-columns:repeat(3,1fr)}
.tab{min-height:64px;padding:0 12px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:9px;font-size:20px;font-weight:750}
.tab i{font-style:normal;min-width:34px;height:32px;padding:0 9px;border-radius:11px;background:var(--paper);color:var(--ink3);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.tab.on{background:var(--tealsoft);border-color:#8dc4b5;color:var(--teal2)}
.tab.on i{background:#fff;color:var(--teal2)}

.list{min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow-y:auto;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
/* 任务行按产品尺寸排：可以吃掉一部分剩余高度，但有上限；封顶之后的余量落在列表底部，
   而不是把每一行撑成「260–330px 里只装 90px 内容」的空壳。
   flex-basis 保持 auto、不收缩，条目多时照常滚动，不会把行压扁。 */
/* 行高上限决定列表卡里剩多少余量：卡片被 1fr 拉长后，行吃不下的部分会堆在卡片底部。
   220px 时 error/empty/not-found 底部空 200~265px；实测 240px 是这一页的最优解
   （最差从 265 降到 225，且行内不会空得发虚）。 */
/* flex-shrink 必须是 1，且列表内的行要有一个比 .row 更低的下限：
   原来是 flex:1 0 auto + min-height:132px，行既不能压缩、又有硬下限，
   内容一多列表卡就直接把底注裁掉（空列表/失败态实测被切 13~61px）。
   下限只在卡片装不下时才生效，正常状态下行仍然按 flex-grow 撑到上限，版面不变。 */
.list>.row{flex:1 1 auto;min-height:104px;max-height:240px}
.fixture{flex:none;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:15px;background:var(--wheatsoft);color:var(--wheat2);font-size:17px;font-weight:750;line-height:1.35}
.fixture svg{width:21px;height:21px;flex:none}
.fixture>span{min-width:0}
.row{min-height:132px;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:var(--paper);display:flex;align-items:center;gap:16px}
.row.tap{cursor:pointer;width:100%;text-align:left}
.row.flag{border-color:#d9b8b2;background:#fdf4f2}
.row.dead{background:#eeeade;border-color:#ddd8c8}
.row.dead .row-title{color:#6d7069}
.row.dead .row-ico{background:#ded9cb;color:#6d7069}
.pending-flag{flex:none;height:38px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;font-size:16px;font-weight:800;background:#ded9cb;color:#6d7069}
.row-ico{width:58px;height:58px;flex:none;border-radius:17px;display:grid;place-items:center;background:var(--tealsoft);color:var(--teal2)}
.row-ico svg{width:28px;height:28px}
.row-ico.slate{background:var(--slatesoft);color:var(--slate2)}
.row-ico.clay{background:var(--claysoft);color:var(--clay2)}
.row-ico.plum{background:var(--plumsoft);color:var(--plum2)}
.row-ico.wheat{background:var(--wheatsoft);color:var(--wheat2)}
.row-main{flex:1;min-width:0}
.row-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row-title{display:block;font-size:22px;font-weight:800;line-height:1.3}
.row-sub{display:block;margin-top:6px;font-size:17px;color:var(--ink3);line-height:1.45}
.row-arrow{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--ink3)}
.row-arrow svg{width:22px;height:22px}
.chip{height:32px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;background:var(--paper);border:1px solid var(--line2);color:var(--ink2);font-size:16px;font-weight:750}
.st{height:32px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;font-size:16px;font-weight:800;background:var(--tealsoft);color:var(--teal2)}
.st.wait{background:var(--wheatsoft);color:var(--wheat2)}
.st.run{background:var(--slatesoft);color:var(--slate2)}
.st.bad{background:var(--badsoft);color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;flex:none;max-width:392px}
.small{min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:750}
.small svg{width:19px;height:19px}
.small.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.small.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.small[aria-disabled="true"]{background:#e6e2d7;border-color:#dcd7c9;color:#84867e}
.reason{display:block;margin-top:8px;font-size:16px;line-height:1.4;color:var(--wheat2);font-weight:700}
.legal{flex:none;padding:14px 18px;}
.list-foot{flex:none;padding:14px 18px;border-radius:16px;background:rgba(11,36,30,.045);color:var(--ink2);font-size:17px;line-height:1.5}
.list-foot b{color:var(--ink)}
.favorite-next{flex:none;padding:18px 4px 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.favorite-next>div{padding:0 18px;min-width:0}
.favorite-next>div+div{border-left:1px solid var(--line)}
.favorite-next b{display:block;font-size:18px;font-weight:800;color:var(--ink2)}
.favorite-next span{display:block;margin-top:7px;font-size:16px;line-height:1.45;color:var(--ink3)}
.note{padding:16px 20px;border-radius:18px;background:var(--tealsoft);color:var(--ink2);font-size:18px;line-height:1.55}
.note.warn{background:var(--wheatsoft);color:var(--wheat2)}
.note.bad{background:var(--badsoft);color:var(--bad)}
.dl{display:grid;gap:10px;margin-top:18px}
.dl>div{display:flex;align-items:baseline;gap:16px;padding:14px 18px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.dl dt{font-size:18px;color:var(--ink3);width:150px;flex:none;font-weight:700}
.dl dd{font-size:20px;font-weight:750;line-height:1.4}
.detail-head{display:flex;align-items:center;gap:18px}
.detail-head .row-ico{width:70px;height:70px}
.guide{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.guide-item{padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:var(--surface);display:flex;flex-direction:column;justify-content:center}
.guide-k{font-size:16px;font-weight:800;color:var(--teal2);letter-spacing:1px}
.guide-t{margin-top:8px;font-size:21px;font-weight:800;line-height:1.3}
.guide-p{margin-top:7px;font-size:17px;line-height:1.5;color:var(--ink3)}
.detail-head h2{font-size:31px;font-weight:800;line-height:1.28}
.detail-head p{margin-top:6px;font-size:18px;color:var(--ink3)}

.toast{flex:none;display:flex;align-items:center;gap:12px;padding:18px 26px;border-radius:22px;background:var(--deep);color:#f2efe4;font-size:21px;font-weight:800;line-height:1.4}
.toast svg{width:24px;height:24px;flex:none;color:var(--green)}
.toast[data-tone="bad"]{background:var(--badsoft);color:var(--bad);border:1px solid #e2b7b0}
.toast[data-tone="bad"] svg{color:var(--bad)}
/* 演示态提示条：明确写清「这是版式演示」，不冒充真实操作结果。
   底色必须和下面那条 .fixture 示例条拉开——两条都用 --wheatsoft 时，
   「这一屏没有发出请求」会被读成又一句排版说明，等于没有披露。
   取值与 35 / 40 / 41 三页的演示态提示条一致。 */
.toast[data-tone="demo"]{background:var(--deep);color:#f6f2e6;border:1px solid rgba(46,230,168,.34);
  box-shadow:0 14px 34px rgba(11,36,30,.16);font-size:19px;font-weight:750}
.toast[data-tone="demo"] svg{color:var(--wheat)}
.body.state-layout.has-toast{grid-template-rows:auto auto minmax(0,1fr) auto auto}
.body.empty-layout.has-toast{grid-template-rows:auto auto auto minmax(0,1fr) auto auto}
.body.list-layout.has-toast{grid-template-rows:auto auto auto minmax(0,1fr) auto}
.body.list5-layout.has-toast{grid-template-rows:auto auto auto auto minmax(0,1fr) auto}
.body.detail-layout.has-toast{grid-template-rows:auto auto auto minmax(0,1fr) auto}
.ctabar{display:flex;gap:14px;flex:none}
.btn{min-height:72px;padding:0 30px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line2);background:var(--surface);font-size:22px;font-weight:800}
.btn svg{width:24px;height:24px}

/* 结构行：登录 / 失败态只画「这里会出现什么」，不写任何条目内容 */
function lockRow(mode, ico, tone, title, desc, tid){
  var tail = mode==='lock'
    ? '<span class="small" aria-disabled="true" data-testid="'+tid+'-locked" aria-label="'+esc(title+'：登录后才会显示')+'">'+svg('lock')+'登录后显示</span>'
    : '<span class="small" aria-disabled="true" data-testid="'+tid+'-off" aria-label="'+esc(title+'：本次没有取到')+'">'+svg('warn')+'本次未取到</span>';
  return '<div class="row dead" data-slot-mode="'+mode+'" data-testid="'+tid+'">'
    +'<span class="row-ico" data-tone="off">'+svg(ico)+'</span>'
    +'<span class="row-main"><span class="row-title">'+title+'</span><span class="row-sub">'+desc+'</span>'
    +'<span class="row-foot" style="margin-top:9px;display:flex;gap:9px;flex-wrap:wrap">'

         和登录态一样写清这两个字段位分别是什么。 */
      + slot(mode==='lock'?'标题登录后显示':'标题本次未取到','lock') + slot(mode==='lock'?'时间登录后显示':'时间本次未取到','lock')

function resumeAct(label, file, route, testid, aria, enabled, reason, ico, secondary){
  if(enabled) return '<a class="small'+(secondary?'':' primary')+' press" href="'+esc(keep(file))+'" data-route="'+esc(route)+'" data-testid="'+testid+'" aria-label="'+esc(aria)+'">'+svg(ico)+label+'</a>';
  return '<span class="small" aria-disabled="true" data-testid="'+testid+'" aria-label="'+esc(aria+'（'+reason+'）')+'">'+svg(ico)+label+'</span>';

function resumeRow(r){
  var st = RESUME_STATUS[r.status], done = r.status==='completed';
  var reason = r.status==='failed' ? '任务已失败，不可继续操作' : '任务完成后可用';
  var isParse = r.kind==='parse';
  var title = isParse ? '上传诊断简历' : 'AI 生成简历';
  var hint = isParse ? '上传简历后生成的诊断记录' : 'AI 引导生成的简历版本';
  var acts;
  if(isParse){
    /* 岗位匹配走静态宿主 46-resume-decision-workspace.html?screen=job-fit：不带 taskId 或合成 id，
       落地是宿主的「未选目标岗位」态，目标岗位在那边选；本页不声称 React 页面或接口已接通。
       正因为不带 taskId，这个出口和本行任务状态无关，四种状态下都是可点链接；
       只有报告 / 优化两个出口按本行任务状态禁用，行内说明也只写这两个出口。 */

      + resumeAct('岗位匹配','46-resume-decision-workspace.html?screen=job-fit','/resume/job-fit',SCREEN+'-resume-jobfit-'+r.id,'去岗位匹配，在那里选择目标岗位',true,'','brief',true);
  } else {
    acts = resumeAct('查看并打印','24-resume-generate.html?taskId='+r.task,'/resume/generate/preview?taskId='+r.task,SCREEN+'-resume-generate-'+r.id,'查看并打印这份 AI 生成简历',done,reason,'print');
  }
  return '<div class="row'+(r.status==='failed'?' flag':'')+'" data-record-status="'+r.status+'" data-record-kind="'+r.kind+'">'
    +'<span class="row-ico'+(isParse?'':' plum')+'">'+svg(isParse?'doc':'spark')+'</span>'
    +'<span class="row-main"><span class="row-head"><span class="row-title">'+title+'</span><span class="st '+st[1]+'">'+st[0]+'</span>'
    +(isParse?'<span class="chip">'+(r.optimized?'已生成优化版':'未优化')+'</span>':'')+'</span>'
    +'<span class="row-sub">'+hint+'</span>'
    +(done ? '' : '<span class="reason">'+(isParse?'报告与优化：':'')+reason+'</span>')+'</span>'
    +'<span class="acts">'+acts+'</span></div>';
}

var AI_SESSIONS = [
  {id:'s1', op:'岗位 AI 推荐参考', hint:'基于本人简历与已审核发布的来源岗位生成', status:'completed', ico:'spark', tone:''},
  {id:'s2', op:'AI岗位解读', hint:'基于来源岗位公开字段生成', status:'failed', ico:'brief', tone:'slate'}
];
var AI_RECORDS = [
  {id:'r1', kind:'parse', label:'简历诊断', hint:'上传简历后的诊断记录', status:'completed', ico:'doc', tone:'', cascade:true},
  {id:'r2', kind:'optimize', label:'简历优化', hint:'基于诊断生成的优化建议', status:'processing', ico:'spark', tone:'plum'},
  {id:'r3', kind:'career_plan', label:'职业规划建议', hint:'阶段性行动建议记录', status:'completed', ico:'route', tone:'wheat'}
];
var AI_STATUS = {pending:['待处理','wait'],processing:['处理中','run'],completed:['已完成',''],failed:['失败','bad']};
function aiDeleteControls(scope, rowId, mode, target){
  var isTarget = target && target.scope===scope && target.id===rowId;
  var confirming = mode==='delete-confirm' && isTarget;
  var busy = mode==='deleting' && isTarget;
  var tid = SCREEN+'-ai-'+scope+'-'+rowId;
  if(confirming){
    return '<a class="small press" href="'+href('ai-records','ready')+'" data-route="/me/ai-records" data-testid="'+tid+'-cancel" aria-label="取消删除这条记录">'+svg('x')+'取消</a>'
      +'<a class="small danger press" href="'+href('ai-records','deleting')+'" data-route="/me/ai-records" data-testid="'+tid+'-confirm" aria-label="确认删除这条记录，删除后不可恢复">'+svg('trash')+'确认删除</a>';
  }
  if(busy){
    return '<span class="small" aria-disabled="true" data-testid="'+tid+'-delete" aria-label="正在删除（演示版式：本页没有发出请求，服务端记录不会被删除）">'+svg('trash')+'正在删除…（演示版式）</span>';
  }
  return '<a class="small press" href="'+href('ai-records','delete-confirm')+'" data-route="/me/ai-records" data-testid="'+tid+'-delete" aria-label="删除这条记录，需要再次确认">'+svg('trash')+'删除</a>';
}
function aiSessionRow(s, mode, target){
  var st = AI_STATUS[s.status];
  return '<div class="row'+(mode==='delete-confirm'&&target&&target.scope==='session'&&target.id===s.id?' flag':'')+'" data-record-kind="job-ai-session" data-record-status="'+s.status+'">'
    +'<span class="row-ico '+s.tone+'">'+svg(s.ico)+'</span>'
    +'<span class="row-main"><span class="row-head"><span class="chip">'+s.op+'</span><span class="st '+st[1]+'">'+st[0]+'</span></span>'
    +'<span class="row-title" style="margin-top:8px;display:block">'+s.hint+'</span></span>'
    +'<span class="acts">'+aiDeleteControls('session', s.id, mode, target)+'</span></div>';
}
function aiRecordRow(r, mode, target){
  var st = AI_STATUS[r.status];
  var isTarget = target && target.scope==='record' && target.id===r.id;
  var expired = mode==='delete-expired' && isTarget;
  return '<div class="row'+(mode==='delete-confirm'&&isTarget?' flag':'')+'" data-record-kind="'+r.kind+'" data-record-status="'+r.status+'"'+(expired?' data-confirm-window="expired"':'')+'>'
    +'<span class="row-ico '+r.tone+'">'+svg(r.ico)+'</span>'
    +'<span class="row-main"><span class="row-head"><span class="chip">'+r.label+'</span><span class="st '+st[1]+'">'+st[0]+'</span></span>'
    +'<span class="row-title" style="margin-top:8px;display:block">'+r.hint+'</span>'
    +(mode==='delete-confirm'&&isTarget&&r.cascade?'<span class="reason">删除这条诊断记录时，服务端会同时删除同一任务的派生记录与岗位 AI 会话。</span>':'')
    +(expired?'<span class="reason">上一次确认已超时失效，删除未执行；需要重新点击删除。</span>':'')
    +'</span>'
    +'<span class="acts">'+aiDeleteControls('record', r.id, mode, target)+'</span></div>';
}
function aiRecordsBody(mode){
  /* 被删目标固定为简历诊断记录 r1：服务端删 parse 会级联同任务派生记录（r2）与该简历任务的岗位 AI 会话（s1）。 */
  var target = {scope:'record', id:'r1'};
  var sessions = AI_SESSIONS, records = AI_RECORDS;
  if(mode==='delete-success'){
    records = AI_RECORDS.filter(function(r){ return r.id!=='r1' && r.id!=='r2'; });
    sessions = AI_SESSIONS.filter(function(s){ return s.id!=='s1'; });
    target = null;
  }
  var total = sessions.length + records.length;
  var done = sessions.filter(function(s){return s.status==='completed';}).length + records.filter(function(r){return r.status==='completed';}).length;
  var noteCls = mode==='delete-confirm' ? 'list-foot note warn' : mode==='delete-failure' ? 'list-foot note bad' : 'list-foot note';
  var noteText = mode==='delete-confirm'
      ? '再次点击「确认删除」后不可恢复；删除简历诊断记录会同时删除同一任务的派生记录与岗位 AI 会话。'
      : mode==='delete-failure'
      ? '删除失败，记录可能已到期或被清理。列表保持原样，可稍后重试。'
      : mode==='deleting'
      ? '这一屏演示删除请求发出后、结果返回前的版式。<b>静态原型没有发出请求</b>，服务端记录不会被删除。'
      : '删除需要两步确认；未在确认时限内再次点击，会回到未确认状态。删除简历诊断记录会同时删除同一任务的派生记录与岗位 AI 会话。';
  return fixtureNote('时间由接口回填')
    + summary('','robot','AI 服务记录','—','仅展示本人服务元数据，不展示简历原文、诊断正文或模型原始输出',['数量由接口返回','当前显示 '+total+' 行'])
    + '<section class="list" data-testid="'+SCREEN+'-list" data-evidence-fixture="synthetic" aria-label="AI 服务记录（排版示例）">'
    + (sessions.length?'<div class="legal">岗位 AI 参考记录 · 仅展示会话元数据，不展示提示词或模型原始输出</div>'+sessions.map(function(s){return aiSessionRow(s, mode, target);}).join(''):'')
    + (records.length?'<div class="legal">简历与规划 AI 记录 · 仅展示服务元数据，不展示简历原文或诊断正文</div>'+records.map(function(r){return aiRecordRow(r, mode, target);}).join(''):'')
    + '<div class="'+noteCls+'">'+noteText+'</div>'
    + '</section>'
    + ctaBar([link('返回我的','30-my-profile.html','/profile',SCREEN+'-back-profile'),
              link('去 AI 简历服务','16-service-hubs.html?hub=resume','/resume-service',SCREEN+'-primary',{primary:true,icon:'spark'})]);
}

      + ctaBar([link('返回我的','30-my-profile.html','/profile',SCREEN+'-back-profile',{icon:'back'}),
                link('返回记录列表', href('activity','browse-ready'), '/me/activity', SCREEN+'-primary',{primary:true})])};
  return {layout:'detail', html:activityDetailBody()};
}

/* ── 渲染 ─────────────────────────────────────────────────── */
function renderTabs(view, state){
  var fam = familyOf(view, state);
  var active = VIEWS[view].tab ? view : VIEWS[view].parentTab;
  document.getElementById('viewtabs').innerHTML = TAB_VIEWS.map(function(v){
    var target = (fam && FAMILY[v][fam]) ? FAMILY[v][fam] : VIEWS[v].def;
    return '<a class="vtab press'+(v===active?' on':'')+'" href="'+href(v, target)+'" data-route="'+VIEWS[v].route+'" data-testid="'+SCREEN+'-view-'+v+'"'+(v===active?' aria-current="true"':'')+'>'
      + VIEWS[v].tab + '<span>' + VIEWS[v].tabHint + '</span></a>';
  }).join('');
}
var LAYOUT = {state:'state-layout', empty:'empty-layout', list:'list-layout', list5:'list5-layout', detail:'detail-layout'};
function render(view, state, tab){
  var v = VIEWS[view];
  var out = renderBody(view, state, tab);
  var root = document.getElementById('body-root');
  root.className = 'body ' + (LAYOUT[out.layout] || 'state-layout');
  root.dataset.state = view + '-' + state;
  root.dataset.view = view;
  root.dataset.testid = SCREEN + '-state-' + view + '-' + state;
  if(tab) root.dataset.tab = tab; else delete root.dataset.tab;
  /* 提交中与结果态都只作为**版式演示**保留：静态原型没有发过请求，不能声称真的提交或删掉了记录。 */
  var toast = '', tone = '', demo = false;
  if(state==='deleting'){ toast = '演示态：这是「正在删除」提交中的版式；本页没有发出任何请求，服务端记录不会被删除。'; tone = 'demo'; demo = true; }
  if(state==='delete-success'){ toast = '演示态：这是删除成功后的版式；本页没有发出任何请求，服务端记录没有被改动。'; tone = 'demo'; demo = true; }
  if(state==='delete-failure'){ toast = '演示态：这是删除失败后的版式（记录可能已到期或被清理）；本页没有发出任何请求。'; tone = 'demo'; demo = true; }
  if(toast) root.className += ' has-toast';
  root.innerHTML = (toast ? '<div class="toast" role="status" data-tone="'+tone+'"'+(demo?' data-demo-state="true"':'')+' data-testid="'+SCREEN+'-toast">'+svg('info')+'<span>'+toast+'</span></div>' : '') + out.html;
  document.getElementById('eyebrow').textContent = v.eyebrow;
  document.getElementById('ask').innerHTML = v.ask;
  document.getElementById('doing').innerHTML = v.doing;
  document.getElementById('pill-text').textContent = v.pill;
  document.getElementById('pill-dot').className = 'dot' + (state==='loading' || state==='deleting' ? ' breathe' : '');
  document.getElementById('truth-copy').textContent = v.truth;
  document.getElementById('back').href = view==='activity-detail' ? href('activity','browse-ready') : keep('30-my-profile.html');
  document.getElementById('back').setAttribute('data-route', view==='activity-detail' ? '/me/activity' : '/profile');
  document.getElementById('back').setAttribute('aria-label', view==='activity-detail' ? '返回浏览与跳转记录' : '返回我的');
  renderTabs(view, state);
}

if(q.get('flat')==='1') document.documentElement.classList.add('flat');
if(DEBUG) document.documentElement.classList.add('debug');
var view = q.get('view'); if(VIEW_ORDER.indexOf(view)<0) view = 'resumes';
var state = q.get('state'); if(VIEWS[view].states.indexOf(state)<0) state = VIEWS[view].def;
var tab = q.get('tab');
if(view==='favorites'){ var keys = FAV_TABS.map(function(t){return t[0];}); if(keys.indexOf(tab)<0) tab='all'; } else { tab = null; }
render(view, state, tab);

function fit(){ var k=Math.min(innerWidth/1080, innerHeight/1920); var s=document.getElementById('stage'); if('zoom' in s.style) s.style.zoom=k; else s.style.transform='scale('+k+')'; }
addEventListener('resize', fit); fit();
function tick(){ var d=new Date(); document.getElementById('clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 10000);
/* 演示面板只在 ?debug=1 时填充并解除 hidden；普通 URL 下既不可见也不可聚焦。 */
if(DEBUG){
  var demoTab = document.getElementById('demo-tab'), panel = document.getElementById('demo-panel');
  panel.innerHTML = '<div class="dp-t">原型演示控制</div>' + VIEW_ORDER.map(function(v){
    return VIEWS[v].states.map(function(s){ return '<a href="?debug=1&view='+v+'&state='+s+'">'+v+' / '+s+'</a>'; }).join('');
  }).join('');
  demoTab.hidden = false; panel.hidden = false;
  demoTab.onclick = function(){ panel.classList.toggle('show'); };
}
