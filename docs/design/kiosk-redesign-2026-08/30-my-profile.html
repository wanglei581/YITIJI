<title>我的 · 职易达</title>
<!--
  宿主：我的（018 /profile 与 029 /me/settings 共享同一青序流光宿主）
  route: /profile        —— screen=profile
         /me/settings    —— screen=settings
  state: profile:  ready(默认) | printing | member | signed-out | loading | empty | error
         settings: member | anonymous | loading | error
                   switch-confirm | switching | switch-failed
                   phone-old-code | phone-old-sending | phone-old-send-failed | phone-rate-limited
                   phone-old-verify | phone-old-verify-failed | phone-code-expired
                   phone-new-code | phone-new-send-failed | phone-new-verify | phone-new-verify-failed
                   phone-rebind-failed | phone-clearing | phone-done | phone-relogin-failed
         非法 screen / state 一律 fail-closed 落 invalid，不静默切回默认页
  api:  各项数量由对应列表端点的分页 total 得到，**没有 /me/summary 这个聚合端点**
        （2026-09-02 核实：后端无此路由，运行时 useMemberProfileOverview 是 Promise.allSettled
          并发调列表读 total；此前本文件写「GET /me/summary 一律由此返回」是错的）
        顶部概览只并发这三条，各带 pageSize=1、只取响应里的 total，不拉明细
        （useMemberProfileOverview.ts:52-56）：
          GET /api/v1/me/ai-records?pageSize=1
          GET /api/v1/me/favorites?pageSize=1
          GET /api/v1/me/documents?pageSize=1
        allSettled 意味着**三条互不阻塞**：只挂其中一条时，另两个数量照常显示，挂掉那条显示「—」。
        其余卡片进入各自页面后才按需调用：
        GET /api/v1/me/resumes | /documents | /print-orders | /favorites | /benefits | /ai-records
        GET /api/v1/me/pending-tasks  —— 真实待办；无待办即空态，不造「继续办理」
                                        契约见 apps/kiosk/src/services/api/pendingTasks.ts：
                                        status(pending|claimed|printing) / payStatus / fileName /
                                        updatedAt / resume(payment|print-progress)
        对齐 apps/kiosk/src/pages/profile/*、ContinuePanel 与 /session-resume
  fallback: 概览数量读取失败 → error：卡片保留入口但数量显示「—」，不拿上次数字冒充当前账号
            （是「那三条列表端点读 total 失败」，不是「summary 端点失败」——没有那个端点）
  真话边界：
    ① 区分两件事，别混：
       · **运行时**没有「默认状态」——页面渲染的就是接口返回值，返回空就显示空，
         数量取不到就显示「—」，绝不拿上次数字或占位数字冒充当前账号。这条不可协商。
       · **本原型**的默认视图是 ?state=ready（产品负责人 2026-09-02 选定），因为原型的用途是
         给人看版式，空态展示不出设计。ready / printing 里的 3 / 7 / 2 / 12 / 1 / 9、文件名、
         订单号、金额、取件码**全部是占位**，接线后由服务端返回，不得当作产品结论或测试基线。
       · 诚实的空态没有被删：?state=member（无待办、数量「—」、会话记录为空）随时可查，
         它才是运行时「这个账号没东西」时的真实样子。
    ② 不写「数据仅存在本机 / 离开自动清空」。正确表述：结束会话只清除本机登录态与临时会话信息；
       已提交到服务端的订单与文件按服务端留存期限管理，删除以服务端返回为准。
    ③ 手机号等个人信息在公共终端默认遮挡，静态原型只画字段位置，不写任何示例号码。
    ④ 设置页只列当前已实现的项；未实现的能力不放开关，也不画「即将上线」。
    ⑤ 六张卡片与账户项全部指向真实存在的本地宿主，不留死链。
    ⑥ 换账号不直跳登录页：二次确认 → 退出并清除本机会话 → 才放行；清场未完成时停在 switch-failed。
    ⑦ 四步换绑是受控表单：位数 / 号码格式本地校验不过就停在本步并聚焦，不跳步；
       倒计时只决定能不能重发验证码，绝不自己推进业务状态。
    ⑧ 换绑与清场进行中离开会作废本次挑战，因此有离开保护对话框；清场进行中不放行任何跳转。
  ai-mode: AI-EXPLAIN（覆盖矩阵 018 / 029）
  ai-input: 仅本页已返回的确定性事实（数量、待办、设置项含义）
  ai-consent: 页内不放 AI 控件；用户主动去底栏「AI顾问」时才进入 AI
  ai-output: 只解释这些事实与操作后果，不改变账号、留存期限或删除结果
  ai-failure: 不适用（本页不发起 AI 调用）
  ai-fallback: 全部账户操作均为确定性入口，与 AI 无关
  ai-persistence: 本页不生成 AI 记录
  原型演示控制：状态只通过 ?screen= 与 ?state= 切换（?debug=1 显示演示面板）
  验收范围：静态原型表现；不证明 React 接线、API 可用、真实账号数据或退出清场执行
-->
<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink-2:#3d5a52;--ink-3:#6b857c;
  --deep:#0b241e;--deep-2:#123a30;--emerald:#2ee6a8;
  --teal:#1f9e86;--teal-d:#157a67;--teal-soft:#e0f2ec;
  --slate:#3f68b0;--slate-d:#35608f;--slate-soft:#e6ecf7;
  --wheat:#a9781f;--wheat-d:#8a6219;--wheat-soft:#f3ecda;
  --plum:#7a5a86;--plum-d:#6b4a77;--plum-soft:#efe8f2;
  --cinnabar:#b23a2e;--cinnabar-d:#963227;--cinnabar-soft:#f6e4e1;
  --line:#e3ddcb;--line-2:#d4cdb6;--r:8px;--r-s:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e8e3d3;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
ul{list-style:none}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{flex:none;height:100px;display:flex;align-items:center;gap:16px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);display:flex;align-items:center;justify-content:center}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:46px;height:46px;border-radius:var(--r);background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.logo-name{font-size:25px;font-weight:700;letter-spacing:2px}
.sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:18px;font-weight:600;max-width:600px;white-space:nowrap;overflow:hidden}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}.pill.bad .dot{background:var(--cinnabar)}
.clock{flex:none;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}

.taskhead{flex:none;margin:18px 40px 0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.th-t{font-size:38px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:14px}
.th-t::before{content:"";flex:none;width:8px;height:34px;border-radius:2px;background:linear-gradient(180deg,var(--emerald),var(--teal))}
.th-s{flex:1;min-width:260px;font-size:20px;line-height:1.4;color:var(--ink-2)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 40px}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-top:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.center{justify-content:center}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:2px}
.sec-h .t{font-size:25px;font-weight:700}
.sec-h .hint{margin-left:auto;font-size:18px;color:var(--ink-3);font-weight:600}

.idcard{flex:none;display:flex;align-items:center;gap:22px;padding:24px 26px;border-radius:var(--r);background:linear-gradient(135deg,var(--deep-2),var(--deep));color:#eef3ec}
.avatar{flex:none;width:88px;height:88px;border-radius:50%;background:linear-gradient(145deg,#4af0b8,#1fa27d);color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700}
.idtx{flex:1;min-width:0}
.idname{display:block;font-size:30px;font-weight:700;letter-spacing:1px}
.idsub{display:block;margin-top:8px;font-size:19px;color:rgba(238,243,236,.66);line-height:1.45}
.idbtn{flex:none;min-height:60px;padding:0 22px;border-radius:var(--r);border:1px solid rgba(238,243,236,.34);color:#eef3ec;font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:9px}
.dslot{display:inline-block;min-width:150px;border-bottom:2px dotted rgba(238,243,236,.4);color:rgba(238,243,236,.7)}

.card{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.todo{display:flex;align-items:center;gap:18px;min-height:112px}
.todo-ic{flex:none;width:56px;height:56px;border-radius:var(--r);background:var(--wheat-soft);color:var(--wheat-d);display:flex;align-items:center;justify-content:center}
.todo.none .todo-ic{background:var(--teal-soft);color:var(--teal-d)}
/* 有待办时这张卡是这一屏唯一要人立刻动手的地方，给它一条左侧强调边，其余保持安静 */
.card.live{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.todo-ic.pay{background:var(--wheat-soft);color:var(--wheat-d)}
.todo-ic.run{background:var(--teal-soft);color:var(--teal-d)}
.todo-meta{display:block;margin-top:4px;font-size:19px;color:var(--ink-2);line-height:1.45}
.todo-meta b{font-weight:750;color:var(--ink)}
.todo-meta i{margin:0 8px;font-style:normal;color:var(--line-2)}
.todo-meta b.code{font:800 24px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:3px;color:var(--teal-d)}
.todo-tx{flex:1;min-width:0}
.todo-t{display:block;font-size:23px;font-weight:700}
.todo-d{display:block;margin-top:5px;font-size:19px;line-height:1.4;color:var(--ink-2)}
.todo-btn{flex:none;min-height:60px;padding:0 22px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.todo-btn.teal{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d)}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steprail{flex:none;margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.steprail div{padding:14px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink-3)}
.steprail small{display:block;font-size:16px;font-weight:700}.steprail b{display:block;margin-top:6px;font-size:19px;line-height:1.3}
.steprail div[data-on=done]{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}
.steprail div[data-on=cur]{background:var(--deep);border-color:transparent;color:#eef3ec}
.steprail div[data-on=cur] small{color:var(--emerald)}
.form{display:grid;gap:12px;margin-top:14px}
.field2{display:flex;flex-direction:column;gap:8px}.field2>span{font-size:18px;font-weight:700;color:var(--ink-2)}
.field2 input{width:100%;min-height:76px;padding:12px 18px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font:inherit;font-size:24px;color:var(--ink)}
.field2 input[data-code]{text-align:center;font-size:32px;letter-spacing:10px}
.field2 input:focus{outline:3px solid rgba(31,158,134,.32);outline-offset:2px}
.field2 input[aria-invalid=true]{border-color:var(--cinnabar);background:var(--cinnabar-soft)}
.field2 small{font-size:16px;line-height:1.45;color:var(--ink-3)}
.err{margin-top:12px;padding:14px 18px;border:1px solid #e8c9c3;border-radius:var(--r);background:var(--cinnabar-soft);color:var(--cinnabar-d);font-size:18px;font-weight:700;line-height:1.5}
.err[hidden]{display:none}
.resend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.resend button,.resend .resend-link{min-height:56px;padding:0 20px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);display:inline-flex;align-items:center;font-size:18px;font-weight:700;color:var(--ink)}
.resend button[disabled]{opacity:.45}.resend .resend-link{color:var(--teal-d)}
.resend span{font-size:17px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pad button{min-height:96px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.pad button[data-k=back],.pad button[data-k=clear]{font-size:21px;color:var(--ink-2);background:var(--surface)}
.padhint{margin-top:10px;font-size:16px;color:var(--ink-3);line-height:1.45}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.meta2 div{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.meta2 small{display:block;font-size:16px;font-weight:700;color:var(--ink-3)}
.meta2 b{display:block;margin-top:6px;font-size:19px;line-height:1.35}
.busy{margin-top:16px}.busybar{height:14px;border-radius:var(--r-s);background:#e6e0cd;overflow:hidden}
.busybar i{display:block;width:44%;height:100%;border-radius:var(--r-s);background:var(--teal)}
.busy p{margin-top:10px;font-size:18px;color:var(--ink-2);line-height:1.5}
button.row{width:100%}
.btn[disabled],.btn[aria-disabled=true]{opacity:.42}
.mask{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:60px;background:rgba(11,36,30,.58)}
.dlg{width:100%;max-width:780px;padding:34px 36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dlg h2{font-size:31px;font-weight:700}
.dlg p{margin-top:14px;font-size:21px;line-height:1.6;color:var(--ink-2)}.dlg p b{color:var(--ink)}
.dlg .acts{display:flex;gap:14px;margin-top:26px}.dlg .acts .btn{flex:1}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px 22px;min-height:194px;display:flex;flex-direction:column;gap:6px}
.asset-d{font-size:17px;color:var(--ink-3);line-height:1.5}
.asset-n{margin-top:auto;display:flex;align-items:baseline;gap:6px}
.asset-n .num{font:800 56px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.asset-n .unit{font-size:17px;color:var(--ink-3)}
/* 次层：低频记录是「回头查」的东西，不该和「现在办」的资产同等体量 */
.morelinks{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mlink{flex:1;min-width:0;min-height:76px;display:flex;align-items:center;gap:10px;
  padding:0 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  font-size:19px;font-weight:650;color:var(--ink)}
.mlink .num{margin-left:auto;font:700 22px/1 ui-monospace,"SF Mono",Menlo,monospace;
  color:var(--ink-3);font-variant-numeric:tabular-nums}
.mlink svg{color:var(--ink-3);flex:none}

.asset-t{font-size:25px;font-weight:700}

.slot{display:inline-block;min-width:64px;border-bottom:2px dotted var(--line-2);color:var(--ink-3);font-weight:400}
.slot.wide{min-width:220px}

.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:118px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-ic{flex:none;width:52px;height:52px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.row-tx{flex:1;min-width:0}
.row-t{display:block;font-size:22px;font-weight:700}
.row-d{display:block;margin-top:4px;font-size:18px;color:var(--ink-3);line-height:1.4}
.row-go{flex:none;color:var(--teal-d);display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}

.state{flex:none;display:flex;flex-direction:column;gap:16px;padding:40px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}

.note{flex:none;padding:18px 22px;border:1px solid var(--line);border-left:4px solid var(--slate);border-radius:var(--r);background:var(--surface)}
.note-t{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.note-d{margin-top:8px;font-size:18px;line-height:1.55;color:var(--ink-2)}

.ctabar{flex:none;margin-top:14px;display:flex;gap:14px;align-items:center}
.btn{min-height:76px;padding:0 26px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:11px;font-size:24px;font-weight:700;text-align:center}

.truth p{flex:1;font-size:17px;line-height:1.45;color:var(--ink-3)}

(function(){

function svg(n,s,w){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}
function slot(t,cls){return '<span class="slot'+(cls?' '+cls:'')+'">'+t+'</span>';}

/* 原来六项塞进同一个 3x2 等权方阵：「我的简历」和「AI 服务记录」一样大、
   一样的彩色图标底、一样的「共 — 条 ›」。六个不同的东西套同一个模具，
   这是最典型的模版特征，也让用户看不出该先点哪个。
   改为按「站在机器前会不会立刻用到」分两层。 */
var ASSETS_MAIN=[
  ['resumes','我的简历','这次要用哪一份','39-member-records.html?view=resumes','/me/resumes'],
  ['documents','我的文档','传上来和生成的文件','38-member-assets.html?state=documents-ready','/me/documents'],
  ['orders','打印订单','含取件码与出纸状态','38-member-assets.html?state=orders-ready','/me/print-orders']
];
var ASSETS_MORE=[
  ['favorites','我的收藏','39-member-records.html?view=favorites','/me/favorites'],
  ['benefits','我的权益','31-benefits.html','/me/benefits'],
  ['ai','AI 服务记录','39-member-records.html?view=ai-records','/me/ai-records']
];
function assetGrid(sc,n){
  /* 主层：三张与当下办事直接相关的资产。去掉彩色图标底——那六种颜色不承载语义，
     纯装饰；数量用等宽数字做视觉锚点，配一句说明这一项对用户意味着什么。 */
  var h='<section><div class="sec-h"><span class="t">简历、文档与订单</span>'
    +'<span class="hint">'+(n?'数量由服务端返回':'数量由服务端返回，未返回显示「—」')+'</span></div>'
    +'<div class="grid3" style="margin-top:12px">';
  for(var i=0;i<ASSETS_MAIN.length;i++){
    var a=ASSETS_MAIN[i];
    h+='<a class="asset press" href="'+a[3]+'" data-route="'+a[4]+'" data-testid="'+sc+'-asset-'+a[0]+'">'
      +'<span class="asset-t">'+a[1]+'</span>'
      +'<span class="asset-d">'+a[2]+'</span>'
      +'<span class="asset-n"><b class="num">'+(n&&n[a[0]]!=null?n[a[0]]:slot('—'))+'</b><span class="unit">条</span></span></a>';
  }
  h+='</div>';
  /* 次层：低频记录不再占卡片。它们是「回头查」的东西，不是「现在办」的东西。 */
  h+='<div class="morelinks">';
  for(var j=0;j<ASSETS_MORE.length;j++){
    var m=ASSETS_MORE[j];
    h+='<a class="mlink press" href="'+m[2]+'" data-route="'+m[3]+'" data-testid="'+sc+'-asset-'+m[0]+'">'
      +m[1]+'<b class="num">'+(n&&n[m[0]]!=null?n[m[0]]:slot('—'))+'</b>'+svg('right',18)+'</a>';
  }
  return h+'</div></section>';
}
function row(ic,href,route,t,d,tid,sc){
  return '<a class="row press" href="'+href+'" data-route="'+route+'" data-testid="'+sc+'-'+tid+'">'
    +'<span class="row-ic">'+svg(ic,24)+'</span><span class="row-tx"><span class="row-t">'+t+'</span><span class="row-d">'+d+'</span></span>'
    +'<span class="row-go">'+svg('right',22)+'</span></a>';
}
function accountRows(sc){
  return '<section><div class="sec-h"><span class="t">通知与支持</span><span class="hint">只列已经能用的</span></div><div class="rows" style="margin-top:12px">'
    /* 账号设置入口已在上方账号卡右上（同一个 /me/settings）。
       这里再放一条只是换个说法指向同一处，是拼凑感的来源，去掉。 */
    +row('bell','35-notifications.html','/me/notifications','消息通知','服务端下发的会员通知，读与标记均落库。','notifications',sc)
    +row('shield','41-member-privacy.html','/me/privacy-requests','隐私请求','当前可提交岗位 AI 授权撤回；数据导出与账号注销尚未开放。','privacy',sc)
    +row('help','06-help.html','/help','帮助中心','服务台位置、常见问题与找人处理。','help',sc)
    +row('msg','40-member-feedback.html','/me/feedback','意见反馈','提交后能看到处理状态。','feedback',sc)
    +'</div></section>';
}

      +'<a class="idbtn press" href="03-login-gate.html" data-route="/login" data-testid="profile-login">去登录'+svg('right',20)+'</a></section>';
  }
  return '<section class="idcard"><span class="avatar" aria-hidden="true">'+svg('user',40)+'</span>'
    +'<span class="idtx"><span class="idname">'+'<span class="dslot">本人账号</span>'+'</span>'
    +'<span class="idsub">手机号 <span class="dslot">已遮挡</span> · 公共终端默认不显示完整个人信息</span></span>'
    +'<a class="idbtn press" href="30-my-profile.html?screen=settings" data-route="/me/settings" data-testid="profile-account">账号设置'+svg('right',20)+'</a></section>';
}
function todoCard(kind){
  if(kind==='none'){
    return '<div class="card"><div class="todo none"><span class="todo-ic">'+svg('check',26)+'</span>'
      +'<span class="todo-tx"><span class="todo-t">这台机器上没有待继续的办理</span>'
      +'<span class="todo-d">没有就是没有。本机不会把上一位使用者的进度显示给你。</span></span>'
      +'<a class="todo-btn press" href="01-home.html" data-route="/" data-testid="profile-start">去首页开始</a></div></div>';
  }
  /* 以下两个变体一一对应 PendingTask.status 与 resume.kind，不是设计臆造的状态。
     站在机器前的人只有两种「未办完」：钱没付，或者纸没拿。 */
  if(kind==='payment'){
    return '<div class="card live"><div class="todo"><span class="todo-ic pay">'+svg('clock',26)+'</span>'
      +'<span class="todo-tx"><span class="todo-t">有一份文件还没付款</span>'
      +'<span class="todo-meta"><b>求职简历-终稿.pdf</b><i>·</i>订单 <b>P2609020317</b><i>·</i>应付 <b>¥2.40</b></span>'
      +'<span class="todo-d">金额与明细由 <b>/me/pending-tasks</b> 的 <b>resume.priceLines</b> 返回；付款前不会开始出纸。</span></span>'
      +'<a class="todo-btn teal press" href="07-session-resume.html" data-route="/session-resume" data-testid="profile-resume">继续付款</a></div></div>';
  }
  if(kind==='printing'){
    return '<div class="card live"><div class="todo"><span class="todo-ic run">'+svg('print',26)+'</span>'
      +'<span class="todo-tx"><span class="todo-t">你的文件正在打印</span>'
      +'<span class="todo-meta"><b>求职简历-终稿.pdf</b><i>·</i>第 <b>2</b>/<b>3</b> 页<i>·</i>取件码 <b class="code">4829</b></span>'
      +'<span class="todo-d">出纸进度与取件码由 <b>/me/pending-tasks</b> 的 <b>status</b>（claimed / printing）返回；纸出完前不要离开取件口。</span></span>'
      +'<a class="todo-btn teal press" href="33-pickup-code.html" data-route="/print/pickup-claim" data-testid="profile-resume">看出纸进度</a></div></div>';
  }
  return '<div class="card"><div class="todo"><span class="todo-ic">'+svg('clock',26)+'</span>'
    +'<span class="todo-tx"><span class="todo-t">你有未办完的事</span>'
    +'<span class="todo-d">任务名称、停在第几步与保留时限，全部由 <b>/me/pending-tasks</b> 返回；本页不预写内容。</span></span>'
    +'<a class="todo-btn teal press" href="07-session-resume.html" data-route="/session-resume" data-testid="profile-resume">接着办</a></div></div>';
}
function stateBlock(kind,icon,title,desc,acts,tid){
  return '<div class="state" data-kind="'+kind+'" data-testid="'+(tid||'profile-fallback')+'"><div class="state-h">'+svg(icon,32)+title+'</div>'
    +'<p class="state-p">'+desc+'</p>'+(acts?'<div class="state-acts">'+acts+'</div>':'')+'</div>';
}
function retention(){
  return '<div class="note"><div class="note-t">'+svg('info',24)+'结束使用之后会发生什么</div>'
    +'<p class="note-d">点「结束使用」或会话超时，本机<b>清除的是登录态和这一趟的临时会话信息</b>：屏幕上的内容、未提交的填写、临时预览都会消失。'
    +'已经提交到服务端的<b>订单、文件和记录不会因此消失</b>，它们按服务端的留存期限管理；要删除请到「隐私请求」提交，处理结果以服务端返回为准。</p></div>';
}
function skel(w,m){return '<div class="skel-line" style="width:'+w+'%'+(m?';margin-top:14px':'')+'"></div>';}

/* ── 换绑手机号：四步受控表单 ──────────────────────────────────────────────
   每一步的主操作都是真按钮：先本地校验（位数 / 号码格式 / 与旧号不同），
   不合格就停在本步并聚焦出错的输入框，不会把用户带到下一步。
   验证码倒计时只控制「能不能重发」，绝不自己推进业务状态。 */
var REBIND_STEPS=[['第 1 步','发送旧号验证码'],['第 2 步','验证旧手机号'],['第 3 步','填写新手机号'],['第 4 步','验证并换绑']];
function rail4(items,cur,label){
  var h='<div class="steprail" aria-label="'+label+'">';
  for(var i=0;i<items.length;i++){
    var on=i+1<cur?'done':(i+1===cur?'cur':'todo');
    h+='<div data-on="'+on+'"><small>'+items[i][0]+'</small><b>'+items[i][1]+'</b></div>';
  }
  return h+'</div>';
}
function stepRail(cur){return rail4(REBIND_STEPS,cur,'换绑进度');}
var CLEAR_STEPS=[['第 1 步','阻断页面操作'],['第 2 步','清除登录态与临时会话'],['第 3 步','建立隐私边界并截断前进'],['第 4 步','打开登录页']];
function metaGrid(rows){
  var h='<div class="meta2">';
  for(var i=0;i<rows.length;i++)h+='<div><small>'+rows[i][0]+'</small><b>'+rows[i][1]+'</b></div>';
  return h+'</div>';
}
/* 一段带小标题的键值清单：只陈述这一屏已经确定的事，复用 .meta2 版式。 */
function factSection(title,hint,rows){
  return '<section><div class="sec-h"><span class="t">'+title+'</span>'
    +(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+metaGrid(rows)+'</section>';
}
/* 已完成 / 未完成清单：按当前步骤如实标注，不预告后面几步的结果。 */
function stepChecklist(items,cur,curNote,title,hint,tail){
  var rows=items.map(function(it,i){
    var n=i+1;
    return [it[0]+' · '+it[1],n<cur?'已完成':(n===cur?(curNote||'进行中'):'未开始')];
  });
  return factSection(title,hint,rows.concat(tail||[]));
}
/* cfg: {step,title,hint,metas,field,error,resend,busy,note,primary,extra} */
function rebindView(cfg){
  var h=stepRail(cfg.step)+'<div class="scroll">'+idCard(false)
    +'<section><div class="sec-h"><span class="t">'+cfg.title+'</span><span class="hint">'+(cfg.hint||'敏感操作 · 全程由服务端校验')+'</span></div>'
    +'<div class="card" style="margin-top:12px">';
  if(cfg.error)h+='<p class="err" role="alert">'+cfg.error+'</p>';
  if(cfg.metas)h+=metaGrid(cfg.metas);
  if(cfg.field){
    var f=cfg.field;
    h+='<div class="form"><label class="field2"><span>'+f.label+'</span>'
      +'<input id="rb-input" type="tel" inputmode="numeric" autocomplete="off" maxlength="'+f.max+'" placeholder="'+f.ph+'"'
      +(f.code?' data-code="true"':'')+' aria-label="'+f.label+'" aria-describedby="rb-msg"><small>'+f.help+'</small></label></div>'
      +'<p class="err" id="rb-msg" role="alert" hidden></p>'
      +'<div class="pad" role="group" aria-label="触屏数字键盘">'
      +'<button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>'
      +'<button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>'
      +'<button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>'
      +'<button type="button" data-k="clear">清空</button><button type="button" data-k="0">0</button>'
      +'<button type="button" data-k="back">退格</button></div>'
      +'<p class="padhint">一体机全屏模式下不弹系统键盘，这块键盘就是本页的输入方式；输入满 '+f.max+' 位后主按钮才可用。</p>';
  }
  if(cfg.resend)h+='<div class="resend"><button type="button" id="rb-resend" disabled>重新发送验证码</button>'
      +'<span id="rb-count">'+cfg.resend+' 秒后可重新发送</span>'
      +'<a class="resend-link" href="30-my-profile.html?screen=settings&state=phone-code-expired">验证码已过期？</a></div>';
  if(cfg.busy)h+='<div class="busy"><div class="busybar"><i></i></div><p>'+cfg.busy+'</p></div>';
  h+='</div></section>';
  /* 带触屏键盘的步骤本身已经填满一屏，再加清单会把键盘挤出首屏，所以只在没有输入区时补。 */
  if(!cfg.field)h+=stepChecklist(REBIND_STEPS,cfg.step,cfg.stepNote,'已完成 / 未完成','按当前这一步如实标注',
    [['整体规则','四步全部通过才生效，没有一半成功的中间状态'],
     ['中途离开','会作废本次挑战，需要从第 1 步重来']]);
  if(cfg.extra)h+=cfg.extra;

    +'<span class="hint">'+(kind==='has'?'离开时这一段会清掉':'只记这一次，不跨人累计')+'</span></div>';

      +'</div></div></section>';

  var items=[
    ['doc','上传了 求职简历-终稿.pdf','17:04','12-file-source.html','/print/upload'],
    ['spark','做了一次简历诊断','17:09','39-member-records.html?view=ai-records','/me/ai-records'],
    ['print','提交打印，等待付款','17:12','07-session-resume.html','/session-resume']
  ];

  for(var i=0;i<items.length;i++){
    var it=items[i];
    h+='<a class="row press" href="'+it[3]+'" data-route="'+it[4]+'" data-testid="profile-srec-'+i+'">'
      +'<span class="row-ic">'+svg(it[0],24)+'</span>'

      +'<span class="row-go">'+svg('right',22)+'</span></a>';
  }
  return h+'</div></section>';
}

    +'<div class="note"><div class="note-t">'+svg('shield',24)+'为什么不直接跳回去</div>'
    +'<p class="note-d">静默回落会让一个错误链接看起来「正常打开了」。在账号页上这尤其危险：你分不清眼前这一屏是<b>你要去的那一页</b>，还是系统替你换掉的另一页。</p></div></div>'
    +'<div class="ctabar"><a class="btn ghost narrow press" href="01-home.html" data-route="/">回首页</a>'
    +'<a class="btn primary press" href="30-my-profile.html" data-route="/profile" data-testid="profile-primary">打开「我的」</a></div>';
}

var PILL={
  'profile:ready':['','有一笔待付款，数量已返回'],
  'profile:printing':['','正在出纸，取件码已生成'],
  'profile:signed-out':['warn','未登录，不展示任何人的记录'],
  'profile:loading':['','正在取资产数量与待办'],
  'profile:empty':['','这个账号下还没有记录'],
  'profile:error':['bad','账号数据这次没取到'],
  'settings:member':['','只列当前已实现的设置项'],
  'settings:anonymous':['warn','未登录，部分设置不可用'],
  'settings:loading':['','正在读取账号设置状态'],
  'settings:error':['bad','账号设置状态没取到'],
  'settings:switch-confirm':['warn','换账号 · 等你二次确认'],
  'settings:switching':['warn','换账号 · 正在退出并清场'],
  'settings:switch-failed':['bad','换账号失败 · 仍是当前账号'],
  'settings:phone-old-code':['warn','换绑 1/4 · 发送旧号验证码'],
  'settings:phone-old-sending':['warn','换绑 1/4 · 正在发送'],
  'settings:phone-old-send-failed':['bad','换绑 1/4 · 发送失败'],
  'settings:phone-rate-limited':['bad','换绑 1/4 · 触发频控'],
  'settings:phone-old-verify':['warn','换绑 2/4 · 验证旧手机号'],
  'settings:phone-old-verify-failed':['bad','换绑 2/4 · 验证码不正确'],
  'settings:phone-code-expired':['bad','换绑 2/4 · 验证码已过期'],
  'settings:phone-new-code':['warn','换绑 3/4 · 填写新手机号'],
  'settings:phone-new-send-failed':['bad','换绑 3/4 · 号码不可用'],
  'settings:phone-new-verify':['warn','换绑 4/4 · 验证新手机号'],
  'settings:phone-new-verify-failed':['bad','换绑 4/4 · 验证码不正确'],
  'settings:phone-rebind-failed':['bad','换绑失败 · 绑定关系未改动'],
  'settings:phone-clearing':['warn','换绑成功 · 正在清场'],
  'settings:phone-done':['','换绑完成 · 需重新登录'],
  'settings:phone-relogin-failed':['bad','清场未完成 · 不放行登录页'],
  'invalid':['bad','页面参数无效，未读取账号数据']
};
var HEAD={
  'settings:member':['账号设置','手机号、隐私授权、协议与结束使用都在这一页。'],
  'settings:anonymous':['账号设置','未登录时只显示真实可用的项，不放假开关。'],
  'settings:loading':['账号设置','授权状态返回前不放开关，也不显示上一次的结果。'],
  'settings:error':['账号设置','状态没取到时，不猜你授权了什么。'],
  'settings:switch-confirm':['换一个账号','换账号要先退出并清干净这台机器。'],
  'settings:switching':['换一个账号','清场做完之前不会打开登录页。'],
  'settings:switch-failed':['换一个账号','没切成功，当前账号仍在登录状态。'],
  'settings:phone-clearing':['换绑手机号','换绑成功，正在清除本机会话。'],
  'settings:phone-done':['换绑手机号','换绑完成，必须用新手机号重新登录。'],
  'settings:phone-relogin-failed':['换绑手机号','换绑已成功，但本机没有清干净。'],
  'profile:ready':['我的','有未付款的打印，先把这件事办完再走。'],
  'profile:printing':['我的','正在出纸，凭取件码到出纸口取。'],
  'profile:signed-out':['我的','公共终端不登录就不显示任何人的简历、订单和文件。'],
  'profile:loading':['我的','数量返回前显示「—」，不显示上一次的数字。'],
  'profile:empty':['我的','空就是空，不造记录让页面好看。'],
  'profile:error':['我的','数量取不到时入口仍可用，但不显示旧数字。'],
  'invalid':['页面参数无效','这个地址不属于「我的」；本机没有静默换页。']
};
var REBIND_HEAD=['','先验证当前绑定的手机号。','输入旧手机号收到的验证码。','填写新手机号并发送验证码。','输入新手机号收到的验证码并确认。'];

var params=new URLSearchParams(location.search);
var rawScreen=params.get('screen')||(params.get('view')==='settings'?'settings':'profile');
var rawState=params.get('state')||'ready';
var key=rawScreen+':'+rawState;
var ok=Object.prototype.hasOwnProperty.call(VIEWS,key);
var screen=ok?rawScreen:'invalid',state=ok?rawState:'invalid';
var root=document.getElementById('body-root'),stage=document.getElementById('stage');

root.setAttribute('data-screen',screen);
root.setAttribute('data-state',state);
root.setAttribute('data-testid',ok?screen+'-state-'+state:'profile-state-invalid');
root.innerHTML=ok?VIEWS[key]():invalidView();

var pillKey=ok?key:'invalid';
if(PILL[pillKey]){
  var p=document.getElementById('pill');
  p.className='pill'+(PILL[pillKey][0]&&PILL[pillKey][0]!=='ok'?' '+PILL[pillKey][0]:'');
  document.getElementById('pill-txt').textContent=PILL[pillKey][1];
}
if(HEAD[pillKey]){
  document.getElementById('task-title').textContent=HEAD[pillKey][0];
  document.getElementById('task-sub').textContent=HEAD[pillKey][1];
}else if(ok&&state.indexOf('phone-')===0){
  var rail=root.querySelector('.steprail div[data-on="cur"]');
  var idx=rail?[].indexOf.call(rail.parentNode.children,rail)+1:1;
  document.getElementById('task-title').textContent='换绑手机号';
  document.getElementById('task-sub').textContent=REBIND_HEAD[idx]||'按服务端返回逐步完成。';
}
/* 内容装不满时整体居中：把余量平均留在上下，而不是在底部堆一块大空白 */
var scrollBox=root.querySelector('.scroll');
/* 居中只对「单块焦点态」成立。多块堆叠是自上而下扫读的，一旦内容不再溢出，
   居中会把整页悬在屏幕正中、上下各留约 195px 死白。故加块数闸门。 */
if(scrollBox&&scrollBox.children.length<=2&&scrollBox.scrollHeight<=scrollBox.clientHeight+2)scrollBox.classList.add('center');

if(screen==='settings'){
  var b=document.getElementById('backlink');
  b.setAttribute('href','30-my-profile.html');
  b.setAttribute('data-route','/profile');
  b.setAttribute('aria-label','返回我的');
}

/* ── 受控表单：本地校验不过就不进下一步 ─────────────────────────────────── */
var input=document.getElementById('rb-input'),primary=document.getElementById('rb-primary'),msg=document.getElementById('rb-msg');
function checkValue(){
  if(!input||!primary)return true;
  var n=primary.getAttribute('data-need'),v=input.value;
  if(n==='code')return /^\d{6}$/.test(v);
  if(n==='phone')return /^1[3-9]\d{9}$/.test(v);
  return true;
}
function syncPrimary(){
  if(!primary)return;
  var okv=checkValue();
  primary.disabled=!okv;
  primary.setAttribute('aria-disabled',okv?'false':'true');
}
if(input){
  var pad=root.querySelector('.pad');
  if(pad)pad.addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]');
    if(!b)return;
    var k=b.getAttribute('data-k');
    if(k==='clear')input.value='';
    else if(k==='back')input.value=input.value.slice(0,-1);
    else if(input.value.length<Number(input.getAttribute('maxlength')))input.value+=k;
    input.setAttribute('aria-invalid','false');
    if(msg)msg.hidden=true;
    syncPrimary();
  });
  input.addEventListener('input',function(){
    input.value=input.value.replace(/\D/g,'');
    input.setAttribute('aria-invalid','false');
    if(msg)msg.hidden=true;
    syncPrimary();
  });
  syncPrimary();
  setTimeout(function(){input.focus();},60);
}
if(primary){
  primary.addEventListener('click',function(){
    if(input&&!checkValue()){
      var n=primary.getAttribute('data-need');
      msg.textContent=n==='phone'?'请输入 11 位大陆手机号（1 开头，第二位 3-9）。':'请输入 6 位数字验证码。';
      msg.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return;
    }
    location.href='30-my-profile.html?screen=settings&state='+primary.getAttribute('data-next');
  });
}

/* 倒计时只决定「能不能重发」，不推进任何业务状态 */
var resendBtn=document.getElementById('rb-resend'),countEl=document.getElementById('rb-count');
if(resendBtn&&countEl){
  var left=parseInt(countEl.textContent,10)||60;
  var timer=setInterval(function(){
    left-=1;
    if(left<=0){
      clearInterval(timer);
      countEl.textContent='可以重新发送了';
      resendBtn.disabled=false;
    }else countEl.textContent=left+' 秒后可重新发送';
  },1000);
  resendBtn.addEventListener('click',function(){
    location.href='30-my-profile.html?screen=settings&state='+(state.indexOf('new')>=0?'phone-new-code':'phone-old-sending');
  });
}

/* ── 离开保护 + 二次确认 ─────────────────────────────────────────────────── */
var GUARD=(state.indexOf('phone-')===0&&state!=='phone-done'&&state!=='phone-relogin-failed')||state==='switching'||state==='switch-confirm';
function closeDialog(){var m=document.getElementById('dlg-mask');if(m)m.remove();}
function openDialog(o){
  closeDialog();
  var m=document.createElement('div');
  m.className='mask';m.id='dlg-mask';
  m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" data-testid="'+o.tid+'">'
    +'<h2 id="dlg-t">'+o.title+'</h2><p>'+o.desc+'</p><div class="acts">'
    +'<button type="button" class="btn ghost press" id="dlg-cancel">'+o.cancel+'</button>'
    +(o.href?'<a class="btn '+(o.tone||'danger')+' press" href="'+o.href+'" id="dlg-ok">'+o.ok+'</a>':'')+'</div></div>';
  stage.appendChild(m);
  document.getElementById('dlg-cancel').addEventListener('click',function(){
    closeDialog();
    if(o.restore)try{history.replaceState(null,'',o.restore);}catch(e){}
  });
  m.addEventListener('click',function(e){if(e.target===m)document.getElementById('dlg-cancel').click();});
}
function leaveDialog(href){
  if(state==='switching'||state==='phone-clearing'){
    openDialog({tid:'leave-blocked',title:'清场还没做完',
      desc:'这台机器正在清除上一段会话。<b>清完之前不要离开这一页</b>，否则本机可能留着一段没清干净的登录信息。',
      cancel:'留在本页',ok:null});
    return;
  }
  openDialog({tid:'leave-confirm',title:'离开会作废这次换绑',
    desc:'现在离开，<b>本次换绑挑战和已发出的验证码都会作废</b>，需要从第 1 步重新开始。你的绑定手机号不会有任何改动。',
    cancel:'继续换绑',ok:'确认离开',href:href,tone:'danger'});
}
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('a[href],button[data-guard]'):null;
  if(!el)return;
  if(el.id==='dlg-ok'||el.closest('#dlg-mask'))return;
  if(el.getAttribute('data-guard')==='switch'){
    e.preventDefault();
    try{history.replaceState(null,'','30-my-profile.html?screen=settings&state=switch-confirm');}catch(err){}
    root.setAttribute('data-state','switch-confirm');
    root.setAttribute('data-testid','settings-state-switch-confirm');
    openDialog({tid:'switch-confirm',title:'确认换一个账号登录？',
      desc:'确认后会<b>先退出当前账号并清除本机这一趟的会话信息</b>，然后才打开登录页。已经提交到服务端的订单、文件和记录不会被删除。',
      cancel:'不换了',ok:'退出并清场',href:'30-my-profile.html?screen=settings&state=switching',tone:'danger',
      restore:'30-my-profile.html?screen=settings'});
    return;
  }
  if(el.getAttribute('data-guard')==='cancel'){
    e.preventDefault();leaveDialog('30-my-profile.html?screen=settings');return;
  }
  if(GUARD&&el.tagName==='A'){
    var href=el.getAttribute('href')||'';
    if(el.getAttribute('data-outcome')==='1')return;
    if(/^30-my-profile\.html\?screen=settings&state=(phone-|switch)/.test(href))return;
    e.preventDefault();leaveDialog(href);
  }
},true);
if(state==='switch-confirm'){
  openDialog({tid:'switch-confirm',title:'确认换一个账号登录？',
    desc:'确认后会<b>先退出当前账号并清除本机这一趟的会话信息</b>，然后才打开登录页。已经提交到服务端的订单、文件和记录不会被删除。',
    cancel:'不换了',ok:'退出并清场',href:'30-my-profile.html?screen=settings&state=switching',tone:'danger',
    restore:'30-my-profile.html?screen=settings'});
}

function tick(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);

if(params.get('debug')==='1'){
  var tab=document.getElementById('demo-tab'),panel=document.getElementById('demo-panel'),html='';
  for(var k in VIEWS){
    var parts=k.split(':');
    html+='<a href="30-my-profile.html?debug=1&screen='+parts[0]+'&state='+parts[1]+'">'+k+'</a>';
  }
  html+='<a href="30-my-profile.html?debug=1&screen=nope&state=nope">invalid（fail-closed）</a>';
  panel.innerHTML=html;tab.classList.add('on');
  tab.addEventListener('click',function(){panel.classList.toggle('on');});
}
})();
</script>
</body>
</html>
