<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>帮助与求助 · 职易达</title>
<!--
  route: /help（apps/kiosk/src/pages/help/HelpCenterPage.tsx）
  state: default | topic | no-result | unavailable
  数据来源：帮助条目当前是前端内置常量（HelpCenterPage 的 ALL_FAQ / FILTER_KEYS），随应用一起发布，
    **没有帮助内容接口**，也没有工单、回访或故障上报通道。条目内的入口走真实 React 路由
    （/login、/print/upload、/scan/start、/jobs、/renshi?tab=policy、/legal/privacy、/me/documents 等）。
  fallback: 分类参数不在受控清单 → no-result；页面内容没渲染出来 → unavailable，
    只给「重新打开帮助 / 返回首页 / 找现场工作人员」三条真实出路。
  诚实边界（本页唯一正确说法）：
    本页不能替用户联系工作人员，也不会自动上报故障；点了任何按钮都不代表已经有人受理。
    服务台位置与值守时间以现场公示为准，静态页不写死窗口号和时段。
    服务电话号码贴在机身，屏上不显示（防止被替换成假号码）。
  ai-mode: AI-CONTEXT（COVERAGE-MATRIX 031）
  ai-input: 用户自己描述的问题；本页不预读简历、订单、支付或设备状态
  ai-consent: 仅在用户主动点「问 AI 顾问」后进入 /assistant，本页不预传上下文
  ai-output: 操作建议与页面指引，可忽略、可追问；不判定设备、订单、支付、登录或办理结果
  ai-failure: AI 顾问不可用时，六个分类、故障自助三步、现场人工与服务电话全部照常可用
  ai-fallback: 分类卡 + 自助三步 + 现场人工 + 机身电话，全程不依赖 AI
  ai-persistence: 本页不产生 AI 记录；记录归 /assistant 自身契约
  原型演示控制: ?state= 切展示状态；?topic= 选分类；?capture=1 冻结时钟；?flat=1 关非必要动效；?debug=1 显演示面板。
-->
<style>
:root{
  --paper:#f5f2e9; --surface:#fffdf8; --ink:#10302b; --ink-2:#3d5a52; --ink-3:#6b857c;
  --deep:#0b241e; --deep-2:#123a30; --emerald:#2ee6a8;
  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --clay:#b8683c; --clay-d:#9e5330; --clay-soft:#f5e9de;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;
  --plum:#7a5a86; --plum-d:#6b4a77; --plum-soft:#efe8f2;
  --line:#e3ddcb; --line-2:#d4cdb6;
  --cinnabar:#b23a2e; --cinnabar-d:#963227; --cinnabar-soft:#f6e4e1;
  --r-lg:32px; --r-md:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","SimSun",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
a:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

.topbar{flex:none;height:104px;display:flex;align-items:center;gap:18px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:20px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.logo-name{font-size:26px;font-weight:700;letter-spacing:2px}
.topbar .sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 22px;border-radius:28px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:19px;font-weight:600;white-space:nowrap}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok{background:var(--teal-soft);color:var(--teal-d);border-color:transparent}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}
.clock{flex:none;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
.scrollarea{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:thin;
  scrollbar-color:var(--line-2,#d4cdb6) transparent}
/* 触屏上必须看得见「还有内容」——公共终端用户不会去试探能不能滑。
   原来是 overflow:hidden：条款一长就被静默裁掉，而这一页要求用户「阅读并同意」。 */
.scrollarea::-webkit-scrollbar{width:10px}
.scrollarea::-webkit-scrollbar-thumb{background:var(--line-2,#d4cdb6);border-radius:6px}
.scrollarea::-webkit-scrollbar-track{background:transparent}
.sec{flex:none;padding:0 44px;margin-top:22px}
.sec-label{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.sec-label .no{font-size:20px;color:var(--teal-d);font-weight:700;letter-spacing:2px}
.sec-label .t{font-size:29px;font-weight:700}
.sec-label .hint{font-size:19px;color:var(--ink-3);margin-left:auto}

.hero{border-radius:40px;background:linear-gradient(158deg,var(--deep-2),var(--deep) 72%);color:#f2efe4;padding:38px 48px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-140px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(46,230,168,.16),transparent 66%)}
.hero-eyebrow{font-size:18px;letter-spacing:5px;color:rgba(242,239,228,.5);margin-bottom:12px;position:relative;z-index:1}
.hero-title{font-size:48px;line-height:1.22;font-weight:700;letter-spacing:1px;position:relative;z-index:1}
.hero-title em{font-style:normal;color:var(--emerald)}
.hero-copy{margin-top:14px;font-size:21px;line-height:1.6;color:rgba(242,239,228,.78);position:relative;z-index:1;max-width:820px}
.hero-copy b{color:#fff;font-weight:600}
.hero-note{margin-top:20px;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 22px;border-radius:18px;background:rgba(255,253,248,.09);border:1px solid rgba(255,253,248,.17);font-size:19px;line-height:1.5;color:rgba(242,239,228,.82);position:relative;z-index:1}
.hero-note b{color:var(--emerald);font-weight:700}

.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tcard{min-height:146px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.tcard-top{display:flex;align-items:center;gap:14px}
.tcard .ci{flex:none;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tcard-name{font-size:26px;font-weight:700;flex:1;min-width:0}
.tcard-count{flex:none;font-size:17px;font-weight:700;color:var(--teal-d);background:var(--teal-soft);border-radius:12px;padding:6px 12px;white-space:nowrap}
.tcard-brief{font-size:19px;line-height:1.55;color:var(--ink-2)}
.tcard[aria-current=page]{border-color:var(--teal);background:var(--teal-soft)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 28px}
.card h3{font-size:25px;font-weight:700;display:flex;align-items:center;gap:12px}
.card .ci{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.card .step-no{flex:none;width:52px;height:52px;border-radius:16px;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.card p{margin-top:12px;font-size:20px;line-height:1.6;color:var(--ink-2)}
.card p b{color:var(--ink);font-weight:600}
.card p.warnline{color:var(--cinnabar-d);font-weight:600}
.grid3 .card{min-height:206px}
.grid2 .card{min-height:216px}

.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 30px}
.qa-item{padding:24px 0;border-bottom:1px solid var(--line)}
.qa-item:last-child{border-bottom:none}
.qa-q{display:flex;gap:14px;font-size:24px;font-weight:700;line-height:1.4}
.qa-q .mk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.qa-a{margin-top:10px;padding-left:54px;font-size:20px;line-height:1.68;color:var(--ink-2)}
.qa-a b{color:var(--ink);font-weight:600}

.linkrow{display:flex;flex-wrap:wrap;gap:14px}
.linkbtn{min-height:72px;padding:0 26px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:600;color:var(--ink)}
.linkbtn .ci{flex:none;width:40px;height:40px;border-radius:12px;background:var(--slate-soft);color:var(--slate-d);display:flex;align-items:center;justify-content:center}

.state{border-radius:var(--r-lg);padding:32px 36px;border:1px solid var(--line);background:var(--surface)}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state-h{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
.state-p{margin-top:12px;font-size:21px;line-height:1.62;color:var(--ink-2)}
.state-p b{color:var(--ink);font-weight:600}

.ctabar{flex:none;padding:22px 44px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:16px}
.btn{min-height:104px;padding:0 26px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:25px;font-weight:700;text-align:center;flex:1}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.truth{flex:none;padding:14px 44px 16px;border-top:1px solid var(--line);display:flex;gap:26px;background:var(--paper)}
.truth div{flex:1;font-size:18px;line-height:1.5;color:var(--ink-3)}
.truth b{color:var(--ink-2);font-weight:600}

.demo-tab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;width:56px;min-height:150px;background:rgba(11,36,30,.9);color:var(--emerald);border-radius:0 16px 16px 0;writing-mode:vertical-lr;letter-spacing:4px;font-size:17px;font-weight:700}
.demo-panel{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;display:none;background:rgba(11,36,30,.96);border-radius:0 18px 18px 0;padding:14px;flex-direction:column;gap:6px;max-height:1200px;overflow:auto}
.demo-panel.show{display:flex}
.demo-panel .dp-t{color:var(--emerald);font-size:15px;font-weight:700;letter-spacing:2px}
.demo-panel a{display:flex;align-items:center;min-height:48px;color:#f2efe4;font-size:16px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.07);white-space:nowrap}
.demo-panel a.on{background:rgba(46,230,168,.22);color:var(--emerald);font-weight:700}
html:not(.debug) .demo-tab,html:not(.debug) .demo-panel{display:none!important}
.flat *{backdrop-filter:none!important;box-shadow:none!important;filter:none!important;animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

var q=new URLSearchParams(location.search);

/* 六个分类＝真实 HelpCenterPage 的 FILTER_KEYS；问答文字取自该页已上线的诚实口径，不新增承诺。 */
var TOPICS=[
 {key:'account',name:'登录与账号',icon:'user',tone:['var(--teal-soft)','var(--teal-d)'],
  brief:'要不要登录、为什么会退出、怎么换账号',
  items:[
   ['一定要登录才能用吗？','不用。大部分服务可以直接办。用手机验证码登录之后，这一趟的简历记录、文档、打印订单和收藏才会归到你的账号，<b>只有本人能看到</b>。'],

  links:[['去登录','03-login-gate.html','lock'],['我的','30-my-profile.html','user']]},
 {key:'resume',name:'AI简历服务',icon:'spark',tone:['var(--plum-soft)','var(--plum-d)'],
  brief:'能做什么、结果准不准、会不会给承诺',
  items:[

 {key:'print',name:'打印与扫描',icon:'printer',tone:['var(--slate-soft)','var(--slate-d)'],

function topicByKey(k){for(var i=0;i<TOPICS.length;i++){if(TOPICS[i].key===k)return TOPICS[i]}return null}

function topicGrid(activeKey){
 var h='';
 for(var i=0;i<TOPICS.length;i++){var t=TOPICS[i];
  h+='<a class="tcard" href="?state=topic&topic='+t.key+'" data-testid="help-topic-'+t.key+'"'+(t.key===activeKey?' aria-current="page"':'')+'>'+
     '<div class="tcard-top"><span class="ci" style="background:'+t.tone[0]+';color:'+t.tone[1]+'">'+svg(t.icon,28)+'</span>'+
     '<span class="tcard-name">'+t.name+'</span><span class="tcard-count">'+t.items.length+' 问</span></div>'+
     '<div class="tcard-brief">'+t.brief+'</div></a>';
 }
 return '<div class="tgrid" data-testid="help-list">'+h+'</div>';
}
/* 自助三步：都是本机上真的能做的动作，不含「重启机器 / 拍一拍 / 稍后自动恢复」这类无效指令。 */

 return '<section class="sec"><div class="sec-label"><span class="no serif">'+no+'</span><span class="t">卡住了，先自己试这三步</span><span class="hint">多数情况到第二步就通了</span></div>'+
  '<div class="grid3">'+
  '<div class="card"><h3><span class="step-no serif">1</span>照屏幕上的提示走</h3><p>出错时屏幕会写清楚<b>卡在哪一步</b>，跟着上面的按钮点就行，不用退出重来。</p></div>'+
  '<div class="card"><h3><span class="step-no serif">2</span>退回上一步重做</h3><p>每页左上角都有返回。<b>返回不会自动提交订单</b>，也不会开始出纸 —— 打印只在你按下确认之后才开始。</p></div>'+
  '<div class="card"><h3><span class="step-no serif">3</span>换一条通道</h3><p>本机上传不成就用<b>手机上传或 U 盘</b>；扫描不成就先用手机拍照再上传。同一件事通常不止一条路。</p></div>'+

}
function humanDesk(no){
 return '<section class="sec"><div class="sec-label"><span class="no serif">'+no+'</span><span class="t">自己解决不了，找人</span><span class="hint">这两条才真的有人处理</span></div>'+

  '<p>机器故障、退费、开票都由现场处理。<b>服务台位置和值守时间以现场公示为准</b>，屏幕上不写死。</p>'+
  '<p class="warnline">本页不会替你联系工作人员，也不会自动上报；点任何按钮都不等于已经有人受理。</p></div>'+
  '<div class="card"><h3><span class="ci" style="background:var(--wheat-soft);color:var(--wheat-d)">'+svg('phone',26)+'</span>拨机身上的服务电话</h3>'+

}

var root=document.getElementById('body-root');
function render(state,topic){
 var view=(state==='topic')?V['topic'](topic):V[state]();
 root.setAttribute('data-state',state);
 root.setAttribute('data-testid',SCREEN+'-state-'+state);
 document.getElementById('scrollarea').innerHTML=view.body;
 document.getElementById('ctabar').innerHTML=view.cta;
 var b=document.getElementById('back');
 b.setAttribute('href',view.back.href);
 b.setAttribute('aria-label',view.back.label);
 var p=document.getElementById('pill');
 p.className='pill'+(view.pill[0]?' '+view.pill[0]:'');
 document.getElementById('pill-txt').textContent=view.pill[1];
}

/* 状态与分类都 fail-closed：未知 state 回落到 default；state=topic 但分类不在清单 → no-result，不猜内容。 */
var state=q.get('state');
if(STATES.indexOf(state)<0)state='default';
var topic=null;
if(state==='topic'){
 topic=topicByKey(q.get('topic')||'');
 if(!topic)state='no-result';
}
render(state,topic);

var panel=document.getElementById('demo-panel');
function addDemo(label,href,on){
 var a=document.createElement('a');a.href=href;a.textContent=label;if(on)a.className='on';panel.appendChild(a);
}
addDemo('default','?debug=1&state=default',state==='default');
for(var di=0;di<TOPICS.length;di++){
 addDemo('topic:'+TOPICS[di].key,'?debug=1&state=topic&topic='+TOPICS[di].key,state==='topic'&&topic&&topic.key===TOPICS[di].key);
}
addDemo('no-result','?debug=1&state=topic&topic=__none__',state==='no-result');
addDemo('unavailable','?debug=1&state=unavailable',state==='unavailable');
if(q.get('debug')==='1')document.documentElement.classList.add('debug');
document.getElementById('demo-tab').addEventListener('click',function(){panel.classList.toggle('show')});

/* 时钟＝本机时间；?capture=1 冻结，便于逐字节复现的证据截图。 */
function tick(){
 if(q.get('capture')==='1'){document.getElementById('clock').textContent='--:--';return}
 var d=new Date();
 document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(q.get('flat')==='1')document.getElementById('stage').classList.add('flat');
</script>
