<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岗位详情 · 职易达</title>
<!--
  宿主：岗位详情（076 唯一青序流光宿主）
  route: /jobs/:id
  state: default | detail-example | loading | not-found | expired | source-unavailable | qr |
         ai-choice | ai-consent | ai-resume-select | ai-no-resume | ai-processing |
         ai-explain-result | ai-match-result | ai-failed | ai-error |
         unknown | invalid-ai-link
         —— 未知 ?state= 进入显式 unknown 提示（data-state="unknown"），不静默回落 default 掩盖坏链接
         —— ?state= 与 ?mode= / ?resume= 组合非法时进入显式 invalid-ai-link（data-state="invalid-ai-link"，
            data-guard-from 记下被拦下的目标态，data-guard-reason 记下拦截原因，
            data-guard-param 记下是哪个参数不成立），
            界面上不回显 state / mode / resume / 拦截码，也不回显被拦下的取值本身，
            只给一句自然语言原因和两个出口（继续看岗位原文 / 重新选择 AI 分析），不铺说明墙；
            诊断值只留在 data-guard-* 属性里，供取证与现场工作人员排查
         —— detail-example 是岗位列表示例行点进来的合成数据态：字段全是排版占位，页面常显「原型示例 · 合成数据」
  参数契约（代码里的 CONTRACT 表就是这张表，越界一律 fail-closed 进 invalid-ai-link）：
    | 状态                                     | ?mode=          | ?resume=          |
    | default/detail-example/loading/not-found |                 |                   |
    | expired/source-unavailable/qr            | 禁止携带        | 禁止携带          |
    | ai-choice                                | 可缺省，给则 explain\|match | 禁止携带 |
    | ai-consent                               | 必填 explain\|match | 禁止携带（选简历在下一步） |
    | ai-resume-select / ai-no-resume          | 必填且只能 match | 禁止携带（还没选） |
    | ai-explain-result                        | 必填且只能 explain | 禁止携带        |
    | ai-match-result                          | 必填且只能 match | 必填 r1\|r2       |
    | ai-processing / ai-failed / ai-error     | 必填 explain\|match | match 必填 r1\|r2；explain 禁止携带 |
    拦截原因取值：state-no-ai / mode-missing / mode-unknown / mode-not-allowed /
                  resume-missing / resume-not-allowed
    currentMode() 只回白名单内的原值，非法 mode 一律回空串，绝不静默当成 explain 继续渲染
  api:  GET /api/v1/jobs/:id → 岗位字段 + sourceName / sourceUrl / externalId / syncTime / validThrough
        —— validThrough 已过或未审核发布：读取时即过滤，求职者侧返回 expired / not-found
        对齐 apps/kiosk/src/pages/jobs/JobDetailPage.tsx 与 services/api/src/jobs/job-validity.ts
  fallback: 来源链接未确认 → source-unavailable：外跳与扫码 aria-disabled 并常显原因，其余字段照常只读
  真话边界：
    ① 不写「本机直查 / 已验证」一类核验徽章：本机没有核验来源真实性的能力。
    ② 不预置招聘人数、发布时间、来源编号、薪资、距离；字段一律画位置（.slot）等服务端返回。
    ③ 不承诺「投递通过率更高」「HR 会联系你」「保面试 / 保录用」；投递结果只由来源平台决定。
    ④ 本机不代收简历、不代替投递；CTA 只用「生成投递二维码」「查看来源详情」「查看岗位」，
       二维码链路只通向来源平台，不做平台内投递。按钮不写成「扫码投递」，避免暗示码已经存在。
    ⑤ 二维码由服务端按来源链接生成，本机不生成、不缓存、不记录跳转后的结果；
       静态原型里没有任何真实二维码，qr 态必须常显「二维码尚未生成 · 当前不可扫码」，
       方框只是标注了「占位 · 不可扫码 · 原型示例 · 合成数据」的 data-evidence-fixture="synthetic"
       位置占位，不写「用手机扫码」。
    ⑥ 凡是拿合成岗位 / 合成简历喂 AI 夹具的状态（default、detail-example 与 ai-* 全链路），
       都在主区顶部常显一条不随内容滚动的强标识横幅「演示数据 · 不可真实投递」，
       横幅带 data-evidence-fixture="synthetic"，正文另写明「原型示例 · 合成数据」；
       不靠角落小标签单独承担这件事。invalid-ai-link / unknown 是坏链接终态，不出夹具也不挂该标识。
    ⑦ r1 / r2 是本页唯一的合成简历夹具映射，见 RESUMES 表：
         r1 = 通用求职简历（面向多类岗位的通用版本）
         r2 = 岗位定向简历（针对单条岗位改写的版本）
       两份都必须写明是合成示例简历，不暗示读到了用户本人的真实简历。
    ⑧ 简历上下文只跟着 match 链路走：ai-processing / ai-match-result / ai-failed / ai-error 在 mode=match 时
       持续显示任务类型「简历匹配」与已选简历名，并在 #body-root 与对应结果块写 data-selected-resume；
       explain 链路（含 processing / result / failed / error）不出现任何简历名、简历选择或 data-selected-resume。
  ai-mode: AI-CONTEXT（覆盖矩阵 076）
  ai-input: 岗位解读只读取本页已返回的真实岗位字段；匹配参考另需用户主动选择本人已完成诊断简历
  ai-consent: 岗位 AI 需登录会员确认 job_ai 授权；匹配参考再明确选择一份 parse+completed 简历
  ai-output: 解读返回职责/硬性要求/加分项/准备建议；匹配返回参考等级、原文依据、差距与关键词覆盖，禁止百分比和录用结论
  ai-failure: 缺简历、status=failed、零内容分别诚实展示，不用「中等」兜底；
              服务不可用的原因只认 ?err= 白名单（quota / model / network）里的服务端错误类目，
              缺失或越界一律用中性无因文案，本机不替服务端猜是额度、模型还是网络
  ai-fallback: 岗位原文、来源四要素、收藏与去来源平台投递在 AI 不可用时完全不受影响
  ai-persistence: 服务端按本人 JobAiSession 与简历结果 TTL 管理；本页不声称永久保存，可退出结果继续看原文
  原型演示控制：状态只通过 ?state= 切换（?debug=1 显示演示面板）
  验收范围：静态原型表现；不证明 React 接线、API 可用、真实岗位数据或外部平台跳转
-->
<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink-2:#3d5a52;--ink-3:#6b857c;
  --deep:#0b241e;--emerald:#2ee6a8;
  --teal:#1f9e86;--teal-d:#157a67;--teal-soft:#e0f2ec;
  --slate:#3f68b0;--slate-d:#35608f;--slate-soft:#e6ecf7;
  --wheat:#a9781f;--wheat-d:#8a6219;--wheat-soft:#f3ecda;
  --cinnabar:#b23a2e;--cinnabar-d:#963227;--cinnabar-soft:#f6e4e1;
  --line:#e3ddcb;--line-2:#d4cdb6;--r:8px;--r-s:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e8e3d3;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
ul{list-style:none}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{flex:none;height:100px;display:flex;align-items:center;gap:16px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);display:flex;align-items:center;justify-content:center}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:46px;height:46px;border-radius:var(--r);background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.logo-name{font-size:25px;font-weight:700;letter-spacing:2px}
.sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:18px;font-weight:600;max-width:540px;white-space:nowrap;overflow:hidden}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}.pill.bad .dot{background:var(--cinnabar)}
.clock{flex:none;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}

.taskhead{flex:none;margin:18px 40px 0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.th-t{font-size:38px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:14px}
.th-t::before{content:"";flex:none;width:8px;height:34px;border-radius:2px;background:linear-gradient(180deg,var(--emerald),var(--teal))}
.th-s{flex:1;min-width:260px;font-size:20px;line-height:1.4;color:var(--ink-2)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 40px}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-top:16px;scrollbar-width:none}
.scroll.spread{justify-content:space-between}
.scroll::-webkit-scrollbar{display:none}
.center{justify-content:center}

.card{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px}
.hero{display:flex;flex-direction:column;gap:14px}
.hero-t{font-size:36px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-pay{font-size:30px;font-weight:700;color:var(--teal-d)}
.hero-pay small{display:block;margin-top:8px;font-size:18px;font-weight:600;color:var(--ink-3)}
.hero-meta{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:20px;color:var(--ink-2)}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{min-height:42px;padding:0 14px;border-radius:var(--r-s);font-size:18px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--slate-soft);color:var(--slate-d)}
.tag.teal{background:var(--teal-soft);color:var(--teal-d)}
.tag.warn{background:var(--wheat-soft);color:var(--wheat-d)}
.tag.bad{background:var(--cinnabar-soft);color:var(--cinnabar-d)}
.fixture-note{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 18px;border-radius:var(--r);background:var(--wheat-soft);color:var(--wheat-d);font-size:19px;font-weight:600;line-height:1.4}
.fixture-note svg{flex:none}
/* 强标识横幅挂在 .body 直接子级（不在 .scroll 内），内容再长也不会被滚掉 */
.body>.fixture-note{margin:16px 0 0;border-left:5px solid var(--wheat)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.tile-l{display:block;font-size:18px;color:var(--ink-3);font-weight:600}
.tile-v{display:block;margin-top:8px;font-size:24px;font-weight:700}

.blk-h{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;margin-bottom:14px}
.blk-h .hint{margin-left:auto;font-size:18px;font-weight:600;color:var(--ink-3)}
.kv{display:flex;flex-direction:column;gap:12px}
.kv-row{display:flex;gap:16px;align-items:flex-start;font-size:20px;line-height:1.5}
.kv-k{flex:none;width:132px;color:var(--ink-3);font-weight:600}
.kv-v{flex:1;min-width:0;color:var(--ink-2)}
.src{background:var(--slate-soft);border-color:#cfdcee}
.src .kv-k{color:var(--slate-d)}
.src .kv-v{color:var(--slate-d)}
.slot{display:inline-block;min-width:96px;border-bottom:2px dotted var(--line-2);color:var(--ink-3);font-weight:400}
.slot.big{min-width:320px;font-weight:700;color:var(--ink-3)}
.slot.wide{min-width:400px}
.src .slot{border-bottom-color:#b9c9e0;color:var(--slate-d)}

.aibar{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--r);background:var(--surface)}
.ai-ic{flex:none;width:54px;height:54px;border-radius:var(--r);background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.ai-tx{flex:1;min-width:0}
.ai-t{display:block;font-size:21px;font-weight:700}
.ai-d{display:block;margin-top:5px;font-size:18px;line-height:1.45;color:var(--ink-2)}
.ai-d b{color:var(--ink)}
.ai-btn{flex:none;min-height:58px;padding:0 22px;border-radius:var(--r);border:1px solid var(--teal);background:var(--teal-soft);color:var(--teal-d);font-size:22px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.aibar.off{border-left-color:var(--wheat)}
.aibar.off .ai-ic{background:var(--wheat-soft);color:var(--wheat-d)}
.grade{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:var(--r-s);background:var(--teal-soft);color:var(--teal-d);font-size:19px;font-weight:700}
.ai-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ai-option{min-height:150px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;align-items:flex-start;gap:14px}
.ai-option .ai-ic{width:50px;height:50px}.ai-option b{display:block;font-size:22px}.ai-option p{margin-top:6px;font-size:17px;line-height:1.45;color:var(--ink-2)}
.ai-option .ai-btn{margin-left:auto;align-self:center}
.ai-result{border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:var(--r);background:var(--surface);padding:22px 24px}
.ai-result.warn{border-left-color:var(--wheat);background:var(--wheat-soft)}.ai-result.error{border-left-color:var(--cinnabar);background:var(--cinnabar-soft)}
.ai-result h2{font-size:28px;display:flex;align-items:center;gap:12px}.ai-result>p{margin-top:9px;font-size:19px;line-height:1.5;color:var(--ink-2)}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.ai-section{padding:14px 16px;border-radius:var(--r-s);background:var(--paper)}
.ai-section h3{font-size:18px;margin-bottom:7px}.ai-section p,.ai-section li{font-size:17px;line-height:1.45;color:var(--ink-2)}.ai-section ul{padding-left:20px}
.evidence{margin-top:5px;padding-left:12px;border-left:3px solid var(--slate);font-size:16px;line-height:1.4;color:var(--slate-d)}
.keywords{display:flex;gap:8px;flex-wrap:wrap}.kw{min-height:38px;padding:0 11px;border-radius:var(--r-s);display:inline-flex;align-items:center;background:var(--teal-soft);color:var(--teal-d);font-size:16px;font-weight:600}.kw.miss{background:var(--wheat-soft);color:var(--wheat-d)}
.consent-lines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.consent-line{padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);font-size:16px;line-height:1.4;color:var(--ink-2)}
.resume-picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.resume-pick{min-height:154px;padding:20px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;align-items:flex-start;gap:14px;text-align:left}.resume-pick[aria-checked=true]{border-color:var(--teal);background:var(--teal-soft)}.resume-pick .ai-ic{width:50px;height:50px}.resume-pick b{display:block;font-size:22px}.resume-pick p{margin-top:6px;font-size:17px;line-height:1.45;color:var(--ink-2)}
.resume-pick .pick-note{margin-top:5px;font-size:16px;font-weight:600;color:var(--wheat-d)}
/* 任务身份条：AI 每一步都先说清「这次做哪种分析、读哪一份东西」 */
.taskid{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.tid-k{display:inline-flex;align-items:center;gap:8px;font-size:19px;font-weight:600;color:var(--ink-2)}
.tid-k b{font-weight:700;color:var(--teal-d)}
.tid-n{flex:1;min-width:220px;font-size:17px;line-height:1.4;color:var(--ink-3)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.input-box{padding:14px 16px;border:1px dashed var(--line-2);border-radius:var(--r-s);background:var(--paper)}
.input-box h3{font-size:18px;margin-bottom:6px}
.input-box p{font-size:17px;line-height:1.45;color:var(--ink-2)}
.input-box.off{border-style:solid;border-color:transparent;background:var(--wheat-soft)}
.input-box.off h3,.input-box.off p{color:var(--wheat-d)}
/* AI 步骤共用的收口条：来源四要素 + 降级承诺压成一张卡，替掉每步复述一遍的说明墙 */
.sn-src{display:flex;gap:10px 24px;flex-wrap:wrap;font-size:19px;color:var(--slate-d)}
.sn-src span{display:inline-flex;align-items:center;gap:8px}
.sn-src i{font-style:normal;font-weight:600;color:var(--ink-3)}
.sn-foot{display:flex;align-items:center;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid #cfdcee}
.sn-foot p{flex:1;font-size:18px;line-height:1.45;color:var(--ink-2)}
.task-guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.guide-item{min-height:118px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:7px}.guide-k{font-size:18px;font-weight:700;color:var(--teal-d)}.guide-v{font-size:18px;line-height:1.45;color:var(--ink-2)}
.loading-group{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.loading-card{min-height:250px}.loading-title{font-size:20px;font-weight:700;color:var(--ink-2);margin-bottom:18px}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 900ms linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.state{flex:none;display:flex;flex-direction:column;gap:16px;padding:44px 36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=info]{background:var(--teal-soft);border-color:#c6e4da}
.state-h{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
.state-p{font-size:21px;line-height:1.6;color:var(--ink-2);max-width:840px}
.state-p b{color:var(--ink)}
.state-acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
/* 坏链接终态只留一张恢复卡，并把标题、事实和动作分布到主区。
   不靠新增说明填屏，也不把全部内容挤在屏幕中央形成上下两段空洞。 */
.scroll.solo>.state{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:28px;padding:60px 56px}
.scroll.solo .state-h{flex-direction:column;align-items:flex-start;gap:26px;font-size:46px;line-height:1.25}
.scroll.solo .state-h svg{flex:none;width:96px;height:96px;padding:26px;box-sizing:content-box;border-radius:50%;background:var(--surface);color:var(--wheat-d)}
.scroll.solo .state-p{display:grid;grid-template-rows:auto minmax(0,1fr);gap:20px;font-size:28px;line-height:1.7;max-width:none}
.state-reason{display:block;padding:18px 0 24px;border-bottom:1px solid #d9c99d}
.scroll.solo .state-acts{margin-top:0;gap:20px}
.scroll.solo .state-acts .btn{flex:1;min-height:120px;font-size:28px}
/* 两条不变事实压成窄行，替掉过去「不用 AI 也能继续」+ aiGuide 两整块 */
.state-facts{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.state-facts span{padding:20px 24px;border-left:5px solid var(--wheat);border-radius:0 var(--r-s) var(--r-s) 0;background:var(--surface);font-size:25px;line-height:1.5;color:var(--ink-2)}
.scroll.solo .state-facts{justify-content:space-evenly;gap:20px;margin-top:0}
.alt{flex:none;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.alt-h{padding:14px 20px;font-size:20px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line);background:var(--paper)}
.alt-row{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:152px;border-bottom:1px solid var(--line)}
.alt.compact .alt-row{min-height:118px}
.alt-row:last-child{border-bottom:0}
.alt-ic{flex:none;width:56px;height:56px;border-radius:var(--r);background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.alt-tx{flex:1;min-width:0}
.alt-t{display:block;font-size:23px;font-weight:700}
.alt-d{display:block;margin-top:5px;font-size:18px;line-height:1.4;color:var(--ink-2)}
.alt-go{flex:none;color:var(--teal-d);display:flex;align-items:center}
.skel-line{height:20px;border-radius:var(--r-s);background:#eee9db}

.qrwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px}
.qrbox{width:300px;height:300px;border:1px dashed var(--line-2);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-3)}
.qrmark{font-size:19px;font-weight:700;color:var(--wheat-d)}
.qrsub{font-size:17px;font-weight:600;color:var(--ink-3)}
.qr-h{font-size:30px;font-weight:700;display:flex;align-items:center;gap:12px;color:var(--wheat-d)}
.qrcap{font-size:19px;line-height:1.5;color:var(--ink-2);text-align:center;max-width:640px}

.ctabar{flex:none;margin-top:14px;display:flex;gap:14px;align-items:center}
.btn{min-height:76px;padding:0 26px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:11px;font-size:24px;font-weight:700;text-align:center}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn[aria-disabled=true]{opacity:.55}
.ctabar .btn{flex:1}
.ctabar .btn.narrow{flex:none;min-width:200px}

.truth{flex:none;min-height:58px;padding:11px 40px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;margin-top:14px}
.truth p{flex:1;font-size:17px;line-height:1.45;color:var(--ink-3)}
.truth b{color:var(--ink-2);font-weight:600}
.truth a{flex:none;min-height:48px;padding:0 14px;border-radius:var(--r-s);display:inline-flex;align-items:center;font-size:17px;font-weight:600;color:var(--teal-d)}
.navbar{flex:none;height:128px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.nav-item .ni{font-size:21px;color:var(--ink-3);font-weight:600}

.demo-tab,.demo-panel{display:none}
.demo-tab.on{display:inline-flex;position:absolute;left:0;top:300px;min-height:56px;padding:0 16px;align-items:center;background:var(--deep);color:var(--emerald);font-size:18px;border-radius:0 var(--r) var(--r) 0}
.demo-panel.on{display:block;position:absolute;left:0;top:0;width:290px;height:100%;background:rgba(11,36,30,.96);color:#e7efe9;padding:16px;overflow-y:auto;z-index:9}
.demo-panel a{min-height:48px;padding:8px 10px;font-size:17px;border-bottom:1px solid rgba(231,239,233,.14);display:flex;align-items:center}

<script>
(function(){
'use strict';
var SCREEN='job-detail';
var ICON={
  pin:'<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  building:'<rect x="4" y="3.5" width="12" height="17" rx="1.6"/><path d="M16 9h4v11.5M7.5 7.5h5M7.5 11.5h5M7.5 15.5h5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  qr:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M13.5 13.5h3v3h-3zM20.5 13.5v3M17 20.5h3.5M13.5 20.5h.01"/>',
  star:'<path d="M12 3.8l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 10l5.9-.8z"/>',
  alert:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.6M12 17.4h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/>',
  lock:'<rect x="4.5" y="10" width="15" height="10.5" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  empty:'<rect x="3.5" y="6" width="17" height="13" rx="2"/><path d="M3.5 11h17M9 15h6"/>',
  doc:'<path d="M6.5 3.5h7l4.5 4.5v12h-11.5z"/><path d="M13.5 3.5V8H18M9 12.5h6M9 16h4"/>',
  users:'<circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6.6M18 20a6 6 0 0 0-2.2-4.6"/>'
};
function svg(n,s,w){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}
function slot(t,cls){return '<span class="slot'+(cls?' '+cls:'')+'">'+t+'</span>';}
function kvRow(k,v){return '<div class="kv-row"><span class="kv-k">'+k+'</span><span class="kv-v">'+v+'</span></div>';}
function tile(l,v){return '<div class="tile"><span class="tile-l">'+l+'</span><span class="tile-v">'+v+'</span></div>';}

function hero(ex){
  var name=ex?'岗位名称示例':slot('岗位名称','big');
  var pay=ex?'基本劳动报酬示例':slot('—','wide');
  return '<section class="card hero"><h2 class="hero-t">'+name+(ex?'<span class="tag warn">原型示例</span>':'')+'</h2>'
    +'<div class="tags"><span class="tag">'+(ex?'用工形式示例':slot('用工形式'))+'</span><span class="tag">'+(ex?'工作时间示例':slot('工作时间'))+'</span><span class="tag teal">来源平台发布</span></div>'
    +'<div class="hero-pay">'+pay+'<small>基本劳动报酬按来源平台标注展示，本机不换算、不估算</small></div>'
    +'<div class="hero-meta"><span>'+svg('building',20)+(ex?'用人单位示例':slot('用人单位'))+'</span><span>'+svg('pin',20)+(ex?'工作地点示例':slot('工作地点'))+'</span></div></section>';
}
/* ---------- 合成夹具的强标识：常显横幅（挂 .body 直接子级，不随内容滚走） ----------
   角落小标签不足以承担「这不是真岗位、不能真投递」这句话，所以主区顶部固定一条横幅；
   文案同时保留「原型示例 · 合成数据」，让身份行与横幅是同一句话的两半，不是两套口径 */
function fixtureBand(tail){
  return '<p class="fixture-note" data-evidence-fixture="synthetic" data-testid="'+SCREEN+'-fixture-note">'+svg('alert',22)
    +'<span><b>演示数据 · 不可真实投递</b>：'+tail+'</span></p>';
}
/* AI 两条链路的横幅分开写：match 连带点名简历也是合成的，explain 直接写明这一步不读简历 */
function aiFixtureBand(mode){
  if(mode==='match')return fixtureBand('这次匹配用的岗位与简历都是原型示例 · 合成数据，结果不代表真实岗位、真实简历或真实 AI。');
  if(mode==='explain')return fixtureBand('这次解读用的岗位是原型示例 · 合成数据，本页不读取任何简历，结果不代表真实岗位或真实 AI。');
  return fixtureBand('本页岗位是原型示例 · 合成数据，下面两种 AI 能力跑出来的都不是真实岗位或真实 AI 结果。');
}
function tilesBlock(ex){
  return '<div class="tiles">'+tile('招聘人数',ex?'人数示例':slot('—'))+tile('学历要求',ex?'学历示例':slot('—'))+tile('工作经验',ex?'经验示例':slot('—'))+'</div>';
}
function contentBlock(ex){
  return '<section class="card"><div class="blk-h">'+svg('doc',24)+'岗位内容与要求<span class="hint">原文由来源平台提供</span></div><div class="kv">'
    +kvRow('工作内容',ex?'工作内容原文示例，接入后逐段展示来源平台原文。':slot('—','wide'))
    +kvRow('任职要求',ex?'任职要求原文示例，本机不改写、不补写。':slot('—','wide'))
    +kvRow('工作地点',ex?'详细地址示例':slot('—','wide'))
    +'</div></section>';
}
function sourceBlock(ex,blocked){
  var act=blocked
    ? '<span class="btn ghost" aria-disabled="true" style="min-height:56px;font-size:20px">'+svg('lock',20)+'来源链接未确认</span>'
    : '<a class="btn ghost press" href="45-online-platform-directory.html" data-route="/jobs/online-platforms" style="min-height:56px;font-size:20px" data-testid="'+SCREEN+'-source-detail">查看来源详情'+svg('right',20)+'</a>';
  return '<section class="card src"><div class="blk-h">'+svg('globe',24)+'信息来源<span class="hint">四要素缺一即不放行外跳</span></div><div class="kv">'
    +kvRow('来源平台',ex?'来源平台示例':slot('—'))
    +kvRow('同步时间',ex?'同步时间示例':slot('—'))
    +kvRow('外部编号',ex?'外部编号示例':slot('—'))
    +kvRow('有效期限',ex?'有效期示例':slot('—'))
    +'</div><div style="margin-top:16px">'+act+'</div></section>';
}
/* ---------- 合成简历夹具映射：本页 r1 / r2 的唯一定义处 ----------
   两份都只是静态原型里的合成示例，不是任何人的真实简历文件。凡是把简历名上屏的地方，
   都连带写「合成示例简历」，避免用户以为本机已经读到了他本人的材料 */
var RESUMES={
  'r1':{name:'通用求职简历',desc:'面向多类岗位的通用版本'},
  'r2':{name:'岗位定向简历',desc:'针对单条岗位改写的版本'}
};
function resumeName(id){return RESUMES[id]?RESUMES[id].name:'';}
/* AI 每一步的任务身份条：两条链路的文案不共用，看一眼就知道这次读的是什么 */
function taskIdentity(mode,resume){
  if(mode!=='match'){
    return '<div class="taskid" data-ai-task="explain">'
      +'<span class="tid-k">'+svg('doc',20)+'任务类型 · <b>岗位解读</b></span>'
      +'<span class="tid-n">只读本页岗位字段；不读取简历，也不需要选择简历。</span></div>';
  }
  var picked=resumeName(resume);
  return '<div class="taskid" data-ai-task="match"'+(picked?' data-selected-resume="'+resume+'"':'')+'>'
    +'<span class="tid-k">'+svg('users',20)+'任务类型 · <b>简历匹配</b></span>'
    +'<span class="tid-k">'+svg('doc',20)+'已选简历 · <b>'+(picked||'尚未选择')+'</b></span>'
    +'<span class="tid-n">'+(picked?'合成示例简历，不是你本人的真实文件。':'未选定简历前不会开始匹配。')+'</span></div>';
}
/* AI 步骤共用的收口条：来源四要素（来源真实性）＋ 原文照常 ＋ AI 不可用降级 ＋ 随时退出，
   压成一张常显小卡，替掉过去每一步都铺一遍的 aiGuide + sourceBlock 说明墙，主区留给这一步本身 */
function aiSideNote(ex){
  var cell=function(k,v){return '<span><i>'+k+'</i>'+(ex?v:slot('—'))+'</span>';};
  return '<section class="card src"><div class="blk-h">'+svg('globe',24)+'来源与兜底<span class="hint">四要素缺一即不放行外跳</span></div>'
    +'<div class="sn-src">'+cell('来源平台','来源平台示例')+cell('同步时间','同步时间示例')+cell('外部编号','外部编号示例')+cell('有效期限','有效期示例')+'</div>'
    +'<div class="sn-foot"><p>AI 失败或不可用时，岗位原文、来源四要素、收藏与去来源平台投递都照常；任何一步都能退出 AI 回到原文。</p>'
    +'<a class="btn ghost press" href="45-online-platform-directory.html" data-route="/jobs/online-platforms" style="min-height:56px;font-size:20px" data-testid="'+SCREEN+'-source-detail">查看来源详情'+svg('right',20)+'</a></div></section>';
}
function aiEntry(){
  return '<div class="aibar"><span class="ai-ic">'+svg('spark',26)+'</span><span class="ai-tx">'
    +'<span class="ai-t">AI 岗位助手</span><span class="ai-d">可直接拆解岗位要求；也可主动选择<b>本人已解析简历</b>查看匹配参考。结果只作求职准备，不预测录用。</span></span>'
    +'<a class="ai-btn press" href="27-browse-detail.html?state=ai-choice" data-route="/jobs/:id" data-testid="'+SCREEN+'-ai-entry">开始分析</a></div>';
}
function aiChoice(){
  return '<div class="ai-choice">'
    +'<article class="ai-option"><span class="ai-ic">'+svg('doc',25)+'</span><span class="ai-tx"><b>AI 岗位解读</b><p>只读本页真实岗位字段，拆出职责、必备条件和准备建议。</p></span><a class="ai-btn press" href="27-browse-detail.html?state=ai-consent&amp;mode=explain" data-route="/jobs/:id" data-testid="'+SCREEN+'-choose-explain">解读岗位</a></article>'
    +'<article class="ai-option"><span class="ai-ic">'+svg('users',25)+'</span><span class="ai-tx"><b>用简历看匹配参考</b><p>选择本人已完成解析的简历，查看依据、缺口和行动建议。</p></span><a class="ai-btn press" href="27-browse-detail.html?state=ai-consent&amp;mode=match" data-route="/jobs/:id" data-testid="'+SCREEN+'-choose-match">匹配参考</a></article></div>';
}
function aiConsent(){
  var mode=currentMode(),match=mode==='match';
  return '<section class="ai-result"><h2>'+svg('lock',28)+'确认 AI 处理用途</h2>'
    +taskIdentity(mode,'')
    +'<div class="inputs">'
    +'<div class="input-box"><h3>这次会读取</h3><p>本页已经返回的岗位字段：岗位名称、工作内容、任职要求、地点与来源四要素。</p></div>'
    +(match
      ?'<div class="input-box"><h3>下一步由你选简历</h3><p>确认后再由你挑一份合成示例简历用于比对；未选定前不发起任何分析。</p></div>'
      :'<div class="input-box off"><h3>这次不读取简历</h3><p>岗位解读不读你的简历、文件与证件，本条路径也不提供简历选择。</p></div>')
    +'</div>'
    +'<div class="consent-lines"><div class="consent-line"><b>你来决定</b><br>未确认前不发起 AI 请求</div>'
    +'<div class="consent-line"><b>用途可见</b><br>'+(match?'只用于这条岗位的匹配参考':'只用于这条岗位的解读')+'</div>'
    +'<div class="consent-line"><b>可以退出</b><br>随时退出，继续看岗位原文</div></div></section>';
}
/* processing 分两条链路各写一套：标题、身份条和输入盒都不同，
   看不到「已选简历」就说明这是解读路径，而不是匹配路径少显示了一行 */
function aiProcessing(mode,resume){
  var match=mode==='match',picked=resumeName(resume);
  return '<section class="ai-result" role="status" aria-live="polite" data-processing-live="true" data-evidence-fixture="synthetic"'

/* ---------- 参数读取：只认白名单。非法 mode 回空串，绝不静默改写成 explain 继续渲染 ---------- */
var MODES={'explain':1,'match':1};
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rawParam(k){var v=params?params.get(k):null;return (v===null||v===undefined)?'':String(v);}
function currentMode(){var m=rawParam('mode');return has(MODES,m)?m:'';}
function currentResume(){var r=rawParam('resume');return has(RESUMES,r)?r:'';}
/* 简历上下文只跟着 match 走：explain 链路任何一步都拿不到简历，也就不会显示简历名 */
function selectedResume(){return currentMode()==='match'?currentResume():'';}
function aiUrl(next,mode,resume){return '27-browse-detail.html?state='+next+'&mode='+mode+(resume?'&resume='+resume:'');}

/* ---------- 状态 × mode/resume 合法组合契约：与文件头那张表一一对应 ----------
   mode:  [] = 该状态不接受任何 AI 参数；数组列出全部合法取值；opt:1 = 可缺省
          （只有 ai-choice 这种「还没选分析类型」的入口允许缺省；一旦链接指向某条分析路径的具体一步，
           mode 必须由链接写明，本机不拿状态名反推，也不替用户认领某一种分析）
   resume:'no'    = 禁止携带
          'match' = 生效 mode 为 match 时必填 r1|r2，其余 mode 禁止携带
          'any'   = 不校验（只给 unknown / invalid-ai-link 这两个终态用）
   skip:1 = 终态报告页，永不再次进守卫，避免自我递归 */
var CONTRACT={
  'default':           {mode:[],                       resume:'no'},
  'detail-example':    {mode:[],                       resume:'no'},
  'loading':           {mode:[],                       resume:'no'},
  'not-found':         {mode:[],                       resume:'no'},
  'expired':           {mode:[],                       resume:'no'},
  'source-unavailable':{mode:[],                       resume:'no'},
  'qr':                {mode:[],                       resume:'no'},
  'ai-choice':         {mode:['explain','match'],opt:1,resume:'no'},
  'ai-consent':        {mode:['explain','match'],      resume:'no'},
  'ai-resume-select':  {mode:['match'],                resume:'no'},
  'ai-no-resume':      {mode:['match'],                resume:'no'},
  'ai-explain-result': {mode:['explain'],              resume:'no'},
  'ai-match-result':   {mode:['match'],                resume:'match'},
  'ai-processing':     {mode:['explain','match'],      resume:'match'},
  'ai-failed':         {mode:['explain','match'],      resume:'match'},
  'ai-error':          {mode:['explain','match'],      resume:'match'},
  'unknown':           {skip:1},
  'invalid-ai-link':   {skip:1}
};
/* 返回 null 表示组合合法；否则返回 {code,param}：code 进 data-guard-reason，param 进 data-guard-param，
   两者都只是「哪条规则、哪个参数」这类元信息。被拦下的取值本身不进属性、更不上屏——
   invalid-ai-link 只给自然语言指引，回显原值会让坏链接看起来像一次正常的分析请求 */
function guard(state){
  var c=CONTRACT[state];
  if(!c||c.skip)return null;
  var m=rawParam('mode'),r=rawParam('resume');
  if(!c.mode.length){
    if(m)return {code:'state-no-ai',param:'mode'};
    if(r)return {code:'state-no-ai',param:'resume'};
    return null;
  }
  if(!m){
    if(!c.opt)return {code:'mode-missing',param:'mode'};
  }else if(c.mode.indexOf(m)<0){
    return {code:has(MODES,m)?'mode-not-allowed':'mode-unknown',param:'mode'};
  }
  if(c.resume==='any')return null;
  if(c.resume==='no')return r?{code:'resume-not-allowed',param:'resume'}:null;
  /* 生效 mode：链接没写时，取状态本身钉死的那一个 */
  var eff=m||(c.mode.length===1?c.mode[0]:'');
  if(eff==='match')return has(RESUMES,r)?null:{code:'resume-missing',param:'resume'};
  return r?{code:'resume-not-allowed',param:'resume'}:null;
}

  'ai-consent':function(){var mode=currentMode(),next=mode==='match'?'ai-resume-select':'ai-processing';return aiFixtureBand(mode)+'<div class="scroll spread">'+hero(true)+aiConsent()+contentBlock(true)+aiSideNote(true)+'</div><div class="ctabar"><a class="btn ghost press" href="27-browse-detail.html?state=ai-choice" data-route="/jobs/:id" data-testid="'+SCREEN+'-cancel-consent">暂不使用 AI</a><a class="btn primary press" href="'+aiUrl(next,mode,'')+'" data-route="/jobs/:id" data-testid="'+SCREEN+'-confirm-consent">确认并继续</a></div>';},

  'ai-processing':function(){var mode=currentMode(),resume=selectedResume();return aiFixtureBand(mode)+'<div class="scroll spread">'+hero(true)+aiProcessing(mode,resume)+contentBlock(true)+aiSideNote(true)+'</div><div class="ctabar"><a class="btn ghost press" href="27-browse-detail.html" data-route="/jobs/:id" data-testid="'+SCREEN+'-primary">退出 AI，继续看原文</a></div>';},
  'ai-explain-result':function(){return aiFixtureBand('explain')+'<div class="scroll">'+hero(true)+explainResult()+aiGuide()+sourceBlock(true,false)+'</div>'+ctaBar('open');},

var PILL={

  'expired':['warn','已过来源标注的有效期'],
  'source-unavailable':['bad','来源链接未确认，投递入口已停用'],
  'default':['warn','原型示例，不代表真实岗位'],
  'detail-example':['warn','原型示例 · 合成数据，非真实岗位'],
  'ai-choice':['','选择这次需要的 AI 能力'],
  'ai-consent':['warn','未确认前不发起 AI 请求'],
  'ai-no-resume':['warn','匹配参考需要已解析的本人简历'],
  'ai-processing':['','AI 正在处理，原文可随时返回'],
  'ai-explain-result':['','AI 岗位解读已返回'],
  'ai-match-result':['','AI 匹配参考已返回'],

  'ai-error':['bad','AI 暂时不可用，原文不受影响'],
  'qr':['warn','二维码尚未生成 · 当前不可扫码'],
  'unknown':['bad','链接里的状态不存在'],
  'invalid-ai-link':['bad','AI 参数组合不成立，已拦下这一步']
};
var TITLE={'detail-example':'岗位详情 · 原型示例','qr':'二维码尚未生成','ai-choice':'AI 岗位助手','ai-consent':'确认 AI 用途','ai-resume-select':'选择用于匹配的简历','ai-no-resume':'没有可用的简历','ai-processing':'正在分析','ai-explain-result':'AI 岗位解读','ai-match-result':'简历匹配参考','ai-failed':'本次分析失败','ai-error':'AI 暂时不可用','unknown':'状态不存在','invalid-ai-link':'AI 链接不成立'};
var SUB={
  'default':'页面接入后会展示真实岗位内容，当前为原型排版示例。',
  'detail-example':'列表示例行进来的合成数据态：字段全是排版占位，不是真实岗位。',
  'loading':'字段返回前不展示任何岗位内容。',
  'not-found':'找不到就是找不到，不用相似岗位顶替。',
  'expired':'过期岗位只保留说明与返回路径，不再提供投递入口。',
  'source-unavailable':'来源四要素不完整时按 fail-closed 停用外跳与扫码。',
  'ai-choice':'岗位解读只读岗位字段；匹配参考需选择本人简历。',
  'ai-consent':'明确用途、输入和退出路径后再继续。',
  'ai-no-resume':'不用空简历生成假的匹配结果。',
  'ai-processing':'只在服务端返回后进入成功或失败状态。',
  'ai-explain-result':'结果必须来自当前岗位原文，未提及的内容不补写。',
  'ai-match-result':'展示参考档位、原文依据、差距与行动建议，不显示百分比。',
  'ai-failed':'失败不等于中等匹配，也不影响岗位原文。',
  'ai-error':'失败原因只认服务端返回的错误类目，本机不猜，确定性操作全部保留。',
  'qr':'二维码尚未生成，当前不可扫码；静态原型里只有位置占位。',

/* processing / 失败 / 不可用三步在两条链路上标题栏就分开：
   顶部一眼能看出这次是岗位解读还是简历匹配，不用先读正文再猜 */
var MODE_HEAD={
  'ai-processing':{
    explain:['正在生成岗位解读','只读本页岗位字段，不读取简历；服务端返回后才进入结果态。','岗位解读处理中，原文可随时返回'],
    match:['正在生成匹配参考','岗位字段与你选定的合成示例简历一起送去分析；服务端返回后才进入结果态。','简历匹配处理中，原文可随时返回']
  },
  'ai-failed':{
    explain:['岗位解读未生成','失败不影响岗位原文，也不会用兜底文案假装解读过。','本次岗位解读未生成'],
    match:['匹配参考未生成','失败不等于中等匹配，已选简历与岗位原文都还在。','本次匹配参考未生成']
  },
  'ai-error':{
    explain:['岗位解读暂时不可用','失败原因只认服务端返回的错误类目，本机不猜，确定性操作全部保留。','AI 暂时不可用，原文不受影响'],
    match:['匹配参考暂时不可用','失败原因只认服务端返回的错误类目；已选简历与岗位原文都不受影响。','AI 暂时不可用，已选简历仍然保留']
  }
};

var params=new URLSearchParams(location.search);
if(params.get('flat')==='1')document.documentElement.classList.add('flat');
/* ---------- 状态解析 + 参数守卫 ----------
   ① ?state= 不在 VIEWS 清单里 → unknown（坏链接就是坏链接，不回落 default 掩盖）
   ② 状态合法但 mode/resume 组合越界 → invalid-ai-link，
      data-guard-from 记下被拦下的目标态，data-guard-reason 记下拦截原因 */
var rawState=params.get('state')||'default';
var state=has(VIEWS,rawState)?rawState:'unknown';
var GUARD=guard(state);
var GUARD_FROM='';
if(GUARD){GUARD_FROM=state;state='invalid-ai-link';}
var root=document.getElementById('body-root');
root.setAttribute('data-state',state);
root.setAttribute('data-testid',SCREEN+'-state-'+state);
if(GUARD_FROM)root.setAttribute('data-guard-from',GUARD_FROM);
if(GUARD){root.setAttribute('data-guard-reason',GUARD.code);root.setAttribute('data-guard-param',GUARD.param);}
/* 简历上下文只在守卫放行的 match 链路上存在，写到主容器供取证；explain 链路一律没有这个属性 */
var SELECTED=GUARD?'':selectedResume();
if(SELECTED)root.setAttribute('data-selected-resume',SELECTED);
root.innerHTML=VIEWS[state]();
if(state==='ai-resume-select'){
  var resumeConfirm=root.querySelector('[data-testid="'+SCREEN+'-resume-confirm"]');
  root.querySelectorAll('[data-resume-pick]').forEach(function(option){
    option.addEventListener('click',function(){
      root.querySelectorAll('[data-resume-pick]').forEach(function(item){item.setAttribute('aria-checked','false');});
      option.setAttribute('aria-checked','true');
      var resume=option.getAttribute('data-resume-pick');
      resumeConfirm.setAttribute('href',aiUrl('ai-processing','match',resume));
      resumeConfirm.setAttribute('aria-disabled','false');
      resumeConfirm.classList.add('press');
      resumeConfirm.textContent='使用这份简历继续';
    });
  });
}
var HEAD=(MODE_HEAD[state]||{})[currentMode()]||null;
if(PILL[state]){
  var p=document.getElementById('pill');
  p.className='pill'+(PILL[state][0]?' '+PILL[state][0]:'');
  document.getElementById('pill-txt').textContent=(HEAD&&HEAD[2])||PILL[state][1];
}
if(HEAD||TITLE[state])document.getElementById('task-title').textContent=(HEAD&&HEAD[0])||TITLE[state];
if(HEAD||SUB[state])document.getElementById('task-sub').textContent=(HEAD&&HEAD[1])||SUB[state];

function tick(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);

/* 演示面板直接按 CONTRACT 生成合法链接：面板本身就是那张契约表的活样例，
   下半截的 probe 行专门用来看守卫拦截，不是可用状态 */
function demoQS(k){
  var c=CONTRACT[k];
  if(!c||c.skip||!c.mode.length)return '';
  var m=c.mode.length===1?c.mode[0]:(c.opt?'':c.mode[0]);
  var qs=m?'&mode='+m:'';
  var eff=m||(c.mode.length===1?c.mode[0]:'');
  if(c.resume==='match'&&eff==='match')qs+='&resume=r2';
  return qs;
}
if(params.get('debug')==='1'){
  var tab=document.getElementById('demo-tab'),panel=document.getElementById('demo-panel'),html='';
  for(var k in VIEWS){html+='<a href="27-browse-detail.html?debug=1&state='+k+demoQS(k)+'">'+k+'</a>';}
  [['unknown ← 坏状态','state=not-a-real-detail-state'],
   ['invalid ← 非 AI 态带参','state=qr&mode=explain'],
   ['invalid ← mode 不存在','state=ai-consent&mode=bogus'],
   ['invalid ← AI 链接缺 mode','state=ai-processing'],
   ['invalid ← match 缺简历','state=ai-match-result&mode=match'],
   ['invalid ← explain 带简历','state=ai-processing&mode=explain&resume=r1'],
   ['invalid ← 匹配态用 explain','state=ai-resume-select&mode=explain'],
   ['ai-error ← err=quota','state=ai-error&mode=explain&err=quota'],
   ['ai-error ← err 越界','state=ai-error&mode=explain&err=bogus']
  ].forEach(function(row){html+='<a href="27-browse-detail.html?debug=1&'+row[1]+'">'+row[0]+'</a>';});
  panel.innerHTML=html;tab.classList.add('on');
  tab.addEventListener('click',function(){panel.classList.toggle('on');});
}
})();
</script>
