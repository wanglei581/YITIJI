<title>招聘会 · 职易达</title>
<!--
  宿主：招聘会共享工作台（084 / 085 / 086 / 087 / 090 / 091 / 092 / 093 共用一个青序流光宿主）
  route: /job-fairs                       —— screen=list        084
         /job-fairs/checkin               —— screen=checkin     085
         /job-fairs/:id                   —— screen=detail      086
         /job-fairs/:id/companies         —— screen=companies   087
         /job-fairs/:id/map               —— screen=map         090
         /job-fairs/:id/materials         —— screen=materials   091
         /job-fairs/:id/visit-plan        —— screen=visit-plan  092
         /job-fairs/:id/stats             —— screen=stats       093
  state: list:       ready | loading | empty | favorites-empty | error
         checkin:    guide | qr | empty | error
         detail:     detail | loading | ended | unpublished | error
         companies:  list | loading | empty | error
         map:        index | empty | error
         materials:  list | empty | expired | print-failed
         visit-plan: missing-context | generating | ready | ai-unavailable | failed
         stats:      ready | empty | error
  api:  GET /api/v1/job-fairs?keyword&status&page       —— 已审核发布且来源完整的场次
                                                           status ∈ upcoming | ongoing | ended（与服务端 FairStatus 同名）
        GET /api/v1/job-fairs/:id                       —— 详情 + sourceName/sourceUrl/externalId/syncTime
        GET /api/v1/job-fairs/:id/companies             —— 主办方提供的参展名单
        GET /api/v1/job-fairs/:id/booth-map             —— 有真实图或展位索引才返回
        GET /api/v1/job-fairs/:id/materials             —— 临时签名 URL，过期需重新获取
        POST /api/v1/job-fairs/:id/visit-plan           —— { resumeId } → { taskId }；结果由任务状态返回
        GET /api/v1/job-fairs/:id/stats                 —— 真实统计；无数据即空
        对齐 apps/kiosk/src/pages/job-fairs/*
  fallback: 任一子任务失败只影响该 screen；招聘会浏览与来源预约入口保持可用
  真话边界：
    ① 本机不做签到，也拿不到签到回执：checkin 只给到场指引，永不显示「已签到 / 签到成功」。
    ② 不写「200+ 企业」「N 家企业参展」一类数量，也不预置日期、地点、主办方与外部编号。
       ready 只画服务端返回字段的位置，不预置任何场次名称、时间、地点或数量。
    ③ 不生成「推荐路线」：本机没有实时人流与展位通行数据，逛展顺序由你自己定。
    ④ 不写「打印只收纸张费」：物料打印价格以现场公示与服务端报价为准。
    ⑤ 预约在来源平台完成；本机不代收简历、不代预约，也不记录预约结果。
  ai-mode: 084 / 086 / 087 / 090 / 091 / 093 为 AI-CONTEXT；085 为 AI-EXPLAIN；092 为 AI-DIRECT
  ai-input: 092 使用用户当次确认的本人简历 + 本场招聘会真实的参展企业与岗位上下文
  ai-consent: 必须显式确认「用这份简历和这场招聘会生成准备清单」，不静默读取历史文件
  ai-output: 可编辑的准备清单（要问什么、带什么、先看哪些单位）；不承诺到场结果、不排路线
  ai-failure: 缺简历、缺参展上下文、模型不可用、任务失败 → 分别有诚实状态与人工替代
  ai-fallback: 场次浏览、参展名单、展位索引、物料打印、来源预约全程不依赖模型
  ai-persistence: 清单是否写入 AI 记录由服务端返回决定，本页不声称已保存
  原型演示控制：状态只通过 ?screen= 与 ?state= 切换（?debug=1 显示演示面板）
  验收范围：静态原型表现；不证明 React 接线、API 可用、真实招聘会数据、AI、打印或签到链路
-->
<style>
:root{

  --deep:#0b241e;--deep-2:#123a30;--emerald:#2ee6a8;

.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
ul{list-style:none}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{flex:none;height:100px;display:flex;align-items:center;gap:16px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);display:flex;align-items:center;justify-content:center}
.logo{flex:none;display:flex;align-items:center;gap:12px}

.logo-name{font-size:25px;font-weight:700;letter-spacing:2px}
.sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:18px;font-weight:600;max-width:620px;white-space:nowrap;overflow:hidden}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}.pill.bad .dot{background:var(--cinnabar)}

.taskhead{flex:none;margin:18px 40px 0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}

.rule i{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:var(--teal-soft);color:var(--teal-d);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}

.qbar{display:flex;align-items:center;gap:14px;height:82px;padding:0 20px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r)}

<div id="stage">

var DEFAULT_STATE={list:'ready',checkin:'guide',detail:'detail',companies:'list',map:'index',materials:'list','visit-plan':'missing-context',stats:'ready'};

var params=new URLSearchParams(location.search);
var requestedScreen=params.get('screen'),screen=requestedScreen||'list';
var invalidScreen=Boolean(requestedScreen&&!DEFAULT_STATE[screen]);
if(invalidScreen)screen='list';
var requestedState=params.get('state'),state=requestedState||DEFAULT_STATE[screen];
var key=screen+':'+state;
var invalidState=Boolean(requestedState&&!VIEWS[key]);
if(invalidScreen||invalidState){
  state='illegal';key='illegal';
  VIEWS.illegal=function(){return '<div class="scroll center">'+stateBlock('illegal','warn','alert','页面参数无效',
    '地址里的 screen 或 state 不属于招聘会工作台。本机不会静默跳到正常页，避免把坏链接误看成真实结果。',
    '<a class="btn ghost press" href="16-service-hubs.html?hub=fairs" data-route="/fairs-service">返回招聘会服务</a><a class="btn primary press" href="28-jobfair-enhanced.html?screen=list&state=ready" data-route="/job-fairs">打开场次列表</a>')+'</div>';};
}
var root=document.getElementById('body-root');
root.setAttribute('data-screen',screen);
root.setAttribute('data-state',state);
root.setAttribute('data-testid',screen+'-state-'+state);
root.innerHTML=VIEWS[key]();
if(key==='illegal'){
  document.getElementById('task-title').textContent='链接不可用';
  document.getElementById('task-sub').textContent='参数不属于当前工作台，请返回有效入口。';
  document.getElementById('pill').className='pill warn';
  document.getElementById('pill-txt').textContent='页面参数无效';
}
if(PILL[key]){
  var p=document.getElementById('pill');
  p.className='pill'+(PILL[key][0]?' '+PILL[key][0]:'');
  document.getElementById('pill-txt').textContent=PILL[key][1];
}
if(key!=='illegal'&&HEAD[screen]){
  document.getElementById('task-title').textContent=HEAD[screen][0];
  document.getElementById('task-sub').textContent=HEAD[screen][1];
}
if(BACK[screen]){
  var b=document.getElementById('backlink');
  b.setAttribute('href',BACK[screen][0]);
  b.setAttribute('data-route',BACK[screen][1]);
  b.setAttribute('aria-label',BACK[screen][2]);
}

root.addEventListener('click',function(e){
  var fav=e.target.closest('.fav-btn');
  if(!fav)return;
  var on=fav.getAttribute('aria-pressed')==='true';
  fav.setAttribute('aria-pressed',String(!on));
  fav.textContent=on?'收藏场次':'已收藏';
});

function tick(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);

if(params.get('debug')==='1'){
  var tab=document.getElementById('demo-tab'),panel=document.getElementById('demo-panel'),html='';
  for(var k in VIEWS){
    var i=k.indexOf(':');
    html+='<a href="28-jobfair-enhanced.html?debug=1&screen='+k.slice(0,i)+'&state='+k.slice(i+1)+'">'+k+'</a>';
  }
  panel.innerHTML=html;tab.classList.add('on');
  tab.addEventListener('click',function(){panel.classList.toggle('on');});
}
})();
