<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 顾问 · 职易达</title>
<!--
  route: /assistant（工作台类型：AI 驾驶舱。单页多状态，不新增路由）
  页面名：AI 顾问。旧稿的「问小青」称呼已在本页可见文案中全部下线（含底栏导航项）。

  state（12 态，均可用 ?state= 直达；?debug=1 打开原型演示控制）：
    default | composer | submitting | reply-real | reply-not-ai | reply-error | ai-unavailable
    voice-gate | voice-connecting | voice-live | mic-denied | voice-error
  每态在 #body-root 上写 data-screen / data-state / data-testid=ai-cockpit-state-<state>；
  五个语音态的面板另带 data-screen="ai-cockpit-voice"，便于与文字态分开断言。

  真实性合同（对齐 pages/assistant/advisorProvider.ts）：
    · 只有 providerLabel 以 `llm:` 开头 **且** aiGenerated===true，才允许把正文当 AI 回答渲染；
      任一缺失一律 fail-closed 走 reply-not-ai，后端预置话术**不进 UI、不进 state**。
    · reply-real 是**布局示例 / 合成数据**，正文为排版占位，页面上持续标记，不得读作模型输出。
    · submitting 只表达「请求在飞」：无百分比、无阶段点、无预计时间（MOTION-SPEC M2）。
    · 语音默认关闭；本页不加载 TRTC SDK、不进房、不申请麦克风、不显示转写与时长。
      voice-live 是合成布局示例，展示未来真实控制区（字幕 / 静音 / 切换文字 / 结束通话），不代表已接通。

  四个非 AI 入口（AI 失败或不可用时不得被阻断，对齐 advisorScenes.ts ADVISOR_MANUAL_ENTRIES）：
    打印扫描  → 10-print-hub.html                  生产路由 /print-scan
    招聘会    → 16-service-hubs.html?hub=fairs      生产路由 /job-fairs
    政策服务  → 16-service-hubs.html?hub=policy     生产路由 /policy-service
    简历服务  → 16-service-hubs.html?hub=resume     生产路由 /resume-service
    （静态 href 指向本设计集的宿主页，data-route 写运行时真实路由；运行时该项标签为「AI简历服务」，
      本页在「不经过 AI」的语境下写作「简历服务」，指向同一路由。）

  safe action 白名单（对齐 AssistantPage.tsx ALLOWED_ROUTE_PREFIXES）：
    /resume /resume-service /print/ /print-scan /scan/ /jobs /job-fairs /fairs-service /jobs-service
    /interview /interview-service /renshi /policy-service /companies
    白名单外的 action 直接丢弃，不渲染。
    每条动作的 testid 为 cockpit-action-<route slug>（route 去掉非字母数字后连字符化，页面内唯一、跨主题稳定）；
    需要整组断言时用 [data-allowed-route=true]，不要再依赖同名 testid。

  intent（来自 16-service-hubs.html 的入口方向）：resume | jobs | fair | interview | policy
    只换主题选中项与提示，**不预填、不发起调用、不生成回答**；不认识的值 fail-closed 回通用，不报错不空屏。
    ⚠ 运行时 AssistantPage.tsx 的 ?intent= 读的是百宝箱 skill 键（normalizeToolboxSkill），与本页 Hub 方向是两套取值，
      React 迁移时必须分开处理，不能把 Hub 方向塞进 skill 键。

  隐私：草稿只写 sessionStorage（键 kiosk-assistant-draft），离开本页 / 点「清空」即清；
        URL 里不放任何用户输入；本页零网络请求、零外部依赖。
        「离场即清」只覆盖本机草稿与临时会话；服务端的对话、文件与订单按各自留存期限管理，
        本页不得写成「不留存」，也不得替服务端承诺删除。
  合规：岗位与招聘会仅第三方 / 官方来源入口，本页不做站内投递、不代收简历；
        AI 不决定身份、支付、设备、打印扫描成败、岗位来源真伪、政策资格或录用结果。
-->
<style>
:root{
  --paper:#f5f2e9; --surface:#fffdf8; --ink:#10302b; --ink-2:#3d5a52; --ink-3:#6b857c;
  --deep:#0b241e; --deep-2:#123a30; --emerald:#2ee6a8;
  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --clay:#b8683c; --clay-d:#9e5330; --clay-soft:#f7ebe1;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;
  --cinnabar:#b23a2e; --cinnabar-d:#963227; --cinnabar-soft:#f6e4e1;
  --line:#e3ddcb; --line-2:#d4cdb6;
  --r-lg:32px; --r-md:24px; --r-sm:18px;
  --dur-quick:240ms; --ease-out:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","SimSun",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
textarea{font:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 顶栏 ───────────────────────────────────────── */
.topbar{flex:none;height:104px;display:flex;align-items:center;gap:18px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:20px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.logo-name{font-size:26px;font-weight:700;letter-spacing:2px}
.topbar .sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 22px;border-radius:28px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:19px;font-weight:600;max-width:520px;white-space:nowrap}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);color:var(--cinnabar-d);border-color:transparent}.pill.bad .dot{background:var(--cinnabar)}
.pill.lock{background:var(--slate-soft);color:var(--slate-d);border-color:transparent}.pill.lock .dot{background:var(--slate)}
.clock{flex:none;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}

/* ── AI 驾驶舱条 ────────────────────────────────── */
.cockpit{flex:none;margin:18px 44px 0;border-radius:var(--r-lg);padding:24px 32px 22px;background:linear-gradient(158deg,var(--deep-2) 0%,var(--deep) 68%);color:#f2efe4;display:flex;flex-wrap:wrap;align-items:stretch;gap:26px;position:relative;overflow:hidden}
.ck-mark,.ck-main,.ck-tel{min-height:148px}
.rail{flex:0 0 100%;width:100%;}
.cockpit::before{content:"";position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(46,230,168,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,168,.07) 1px,transparent 1px);background-size:48px 48px}
.ck-mark{position:relative;z-index:1;flex:none;width:92px;height:92px;align-self:center;border-radius:26px;border:1.5px solid rgba(46,230,168,.42);background:rgba(46,230,168,.09);color:var(--emerald);display:flex;align-items:center;justify-content:center}
.ck-main{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ck-eyebrow{font-size:17px;letter-spacing:4px;color:rgba(242,239,228,.5);font-weight:700}
.ck-title{margin-top:7px;font-size:36px;line-height:1.28;font-weight:700;letter-spacing:1px}
.ck-title em{font-style:normal;color:var(--emerald)}
.ck-copy{margin-top:9px;font-size:20px;line-height:1.5;color:rgba(242,239,228,.74)}
.ck-tel{position:relative;z-index:1;flex:none;width:320px;align-self:center;padding-left:26px;border-left:1px solid rgba(242,239,228,.16);display:flex;flex-direction:column;gap:12px}
.ck-tel div{display:flex;align-items:baseline;gap:10px}
.ck-tel span{flex:none;width:92px;font-size:16px;color:rgba(242,239,228,.5);letter-spacing:1px}
.ck-tel b{font-size:18px;font-weight:600;color:#f2efe4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-tel b.hi{color:var(--emerald)}
.ck-tel b.amber{color:#f0c463}

/* ── 主体与分区 ─────────────────────────────────── */
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sec{flex:none;padding:0 44px;margin-top:22px;display:flex;flex-direction:column;min-height:0}
.sec.grow{flex:1;min-height:0}
.sec.last{margin-bottom:22px}
.sec-label{flex:none;display:flex;align-items:baseline;gap:16px;margin-bottom:13px}
.sec-label .no{font-size:20px;color:var(--teal-d);font-weight:700;letter-spacing:2px}
.sec-label .t{font-size:28px;font-weight:700}
.sec-label .hint{font-size:18px;color:var(--ink-3);margin-left:auto;text-align:right}
.press:active{transform:scale(.985)}

/* 任务卡 */
.tasks{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.task{min-height:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:20px 24px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);position:relative;overflow:hidden}
.task-ic{flex:none;width:56px;height:56px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal-d)}
.task-ic[data-tone=slate]{background:var(--slate-soft);color:var(--slate-d)}
.task-ic[data-tone=clay]{background:var(--clay-soft);color:var(--clay-d)}
.task-ic[data-tone=wheat]{background:var(--wheat-soft);color:var(--wheat-d)}
.task-n{margin-top:12px;font-size:26px;font-weight:700;line-height:1.25}
.task-d{margin-top:7px;font-size:19px;line-height:1.45;color:var(--ink-3)}
.task-f{margin-top:auto;padding-top:10px;font-size:17px;font-weight:600;color:var(--teal-d)}
.task.on{border-color:var(--teal);background:var(--teal-soft)}
.task.on .task-f{color:var(--teal-d)}
.task.on::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:6px;border-radius:0 6px 6px 0;background:var(--teal);transform-origin:top;animation:k-bar var(--dur-quick) var(--ease-out)}
@keyframes k-bar{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

/* 快速问题 */
.qlist{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.qrow{flex:1;min-height:76px;display:flex;align-items:center;gap:18px;padding:0 24px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left}
.qrow-ic{flex:none;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--teal-d)}
.qrow-t{flex:1;min-width:0;font-size:22px;font-weight:600;line-height:1.35}
.qrow-go{flex:none;display:flex;align-items:center;gap:7px;font-size:18px;font-weight:600;color:var(--teal-d)}
.qrow:active{border-color:var(--teal)}

/* 四个非 AI 入口 */
.mrail{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ment{min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left}
.ment-top{display:flex;align-items:center;gap:12px}
.ment-ic{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal-d)}
.ment-ic[data-tone=slate]{background:var(--slate-soft);color:var(--slate-d)}
.ment-top b{flex:1;min-width:0;font-size:21px;font-weight:700}
.ment-d{font-size:16px;line-height:1.4;color:var(--ink-3)}
.ment .go{flex:none;color:var(--teal-d)}
/* AI 不可用时：同样四项，改成 2×2 主视野卡片，撑满主区不留大片空白 */
.mrail.big{flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.mrail.big .ment{min-height:0;justify-content:space-between;gap:12px;padding:22px 26px}
.mrail.big .ment-top b{font-size:24px}
.mrail.big .ment-d{font-size:18px}
.ment-sub{display:flex;flex-direction:column;gap:10px}
.ment-sub span{display:flex;gap:11px;font-size:18px;line-height:1.4;color:var(--ink-2)}
.ment-sub i{flex:none;width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--teal)}
.ment-sub[data-tone=slate] i{background:var(--slate)}
.ment-go{display:flex;align-items:center;gap:10px;padding-top:13px;border-top:1px dashed var(--line-2);font-size:18px;font-weight:700;color:var(--teal-d)}
.ment-go small{font-size:15px;font-weight:600;color:var(--ink-3)}
/* 失败 / 等待态复用同一份 2×2，但卡内更紧，留给上方原因说明更多空间 */
.mrail.big.dense{gap:14px}
.mrail.big.dense .ment{gap:10px;padding:18px 22px}
.mrail.big.dense .ment-top b{font-size:23px}
.mrail.big.dense .ment-ic{width:44px;height:44px}
.mrail.big.dense .ment-d{font-size:17px}
.mrail.big.dense .ment-sub{gap:8px}
.mrail.big.dense .ment-sub span{font-size:17px;line-height:1.35}
.mrail.big.dense .ment-go{padding-top:11px}

/* 状态块 / 对话 */
.state{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:26px 30px}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=lock]{background:var(--slate-soft);border-color:#cfdcee}
.state-h{display:flex;align-items:center;gap:14px;font-size:27px;font-weight:700}
.state-p{margin-top:11px;font-size:20px;line-height:1.6;color:var(--ink-2)}
.state-p b{color:var(--ink);font-weight:600}
/* 失败态：说明块随内容收紧，不撑成大片空有色面板 */
.state.fit{flex:none;padding:22px 26px}
.state.fit .state-h{font-size:26px}
.state.fit .acts{margin-top:16px}
.kvrow{margin-top:14px;display:grid;grid-template-columns:auto auto;justify-content:start;gap:4px 52px}
.kvrow .kv2{padding:2px 0;gap:12px}
.kvrow .kv2 span{width:auto}
.bub{flex:none;border-radius:var(--r-md);padding:18px 24px;background:var(--paper);border:1px solid var(--line-2)}
.bub-who{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--ink-3)}
.bub p{margin-top:8px;font-size:22px;line-height:1.5;word-break:break-word}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:9px;font-size:15px;font-weight:700}
.tag.syn{background:var(--wheat-soft);color:var(--wheat-d);border:1px dashed var(--wheat)}
.tag.ok{background:var(--teal-soft);color:var(--teal-d)}
.tag.slate{background:var(--slate-soft);color:var(--slate-d)}

/* 合成示例（持续标记） */
/* 2026-09-05 体检修复：回答正文超高时此前会画到下方「可以直接去的地方」「不经过 AI 也能办」两个区块上
   （reply-* / voice-* 共 7 态）。回答区改为自身滚动，下方两个区块保持固定高度不被覆盖。 */
.ans{flex:1;min-height:0;margin-top:14px;display:flex;flex-direction:column;border-radius:var(--r-lg);padding:22px 26px 20px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}
/* 2026-09-05 体检修复（续）：回答态下 body 只有 648px，而驾驶舱的能力清单占 416px，回答区被压到 44px 只剩一条横纹。
   有回答时把能力清单的五行分组收起（表头「本机 AI 能力 · 在线/受控/未开放」计数保留可见），回答区拿回约 350px；
   回到提问态清单自动展开。只用 :has()（Chromium/Edge Kiosk 支持），不改结构与状态名。 */
#stage:has(#body-root[data-state^="reply-"]) .rail .rgrp,
#stage:has(#body-root[data-state^="voice-"]) .rail .rgrp,
#stage:has(#body-root[data-state="ai-unavailable"]) .rail .rgrp,
#stage:has(#body-root[data-state="mic-denied"]) .rail .rgrp{display:none}
#stage:has(#body-root[data-state^="reply-"]) .rail .sweep,
#stage:has(#body-root[data-state^="voice-"]) .rail .sweep,
#stage:has(#body-root[data-state="ai-unavailable"]) .rail .sweep,
#stage:has(#body-root[data-state="mic-denied"]) .rail .sweep{display:none}
#stage:has(#body-root[data-state^="reply-"]) .ans,
#stage:has(#body-root[data-state^="voice-"]) .ans,
#stage:has(#body-root[data-state="ai-unavailable"]) .ans,
#stage:has(#body-root[data-state="mic-denied"]) .ans{min-height:200px}
/* 「不经过 AI 也能办」四张卡在这些态带副标题，2×2 等高网格会把卡压到内容画出边框；改为按内容定高，回答区吸收剩余。 */
#stage:has(#body-root[data-state^="reply-"]) .mrail.big,
#stage:has(#body-root[data-state^="voice-"]) .mrail.big,
#stage:has(#body-root[data-state="ai-unavailable"]) .mrail.big,
#stage:has(#body-root[data-state="mic-denied"]) .mrail.big{flex:none;grid-template-rows:auto auto}
#stage:has(#body-root[data-state^="reply-"]) .mrail.big .ment,
#stage:has(#body-root[data-state^="voice-"]) .mrail.big .ment,
#stage:has(#body-root[data-state="ai-unavailable"]) .mrail.big .ment,
#stage:has(#body-root[data-state="mic-denied"]) .mrail.big .ment{min-height:0;padding:16px 22px;gap:8px}
.ans.synthetic{border:1.5px dashed var(--wheat);background-color:var(--surface);background-image:repeating-linear-gradient(135deg,rgba(169,120,31,.055) 0 10px,rgba(169,120,31,0) 10px 22px)}
.ans.waiting{border:1.5px dashed var(--line-2);background:var(--surface)}
.syn-bar{flex:none;display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line-2);font-size:18px;line-height:1.45;color:var(--wheat-d);font-weight:600}
.wait-bar{flex:none;display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px dashed var(--line-2);font-size:19px;line-height:1.4;font-weight:700;color:var(--ink-2)}
.slot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 30px;font-size:19px;line-height:1.55;color:var(--ink-3)}
.ans-list{margin-top:16px;display:flex;flex-direction:column;gap:11px;list-style:none}
.ans-list li{display:flex;gap:13px;font-size:21px;line-height:1.55;color:var(--ink-2)}
.ans-list li i{flex:none;width:26px;height:26px;margin-top:3px;border-radius:9px;background:var(--wheat-soft);color:var(--wheat-d);font-style:normal;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ans-foot{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line-2)}
.kv2{display:flex;gap:14px;font-size:18px;line-height:1.5;padding:3px 0}
.kv2 span{flex:none;width:150px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kv2 b{font-weight:600;color:var(--ink)}
.gate{margin-top:10px;font-size:17px;line-height:1.5;color:var(--ink-2)}
.gate code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--line-2);border-radius:7px;padding:1px 7px}
.nodo{margin-top:12px;display:flex;gap:12px;align-items:baseline;font-size:17px;line-height:1.5;color:var(--ink-2)}
.nodo b{flex:none;color:var(--cinnabar-d);font-weight:700}

/* 动作芯片（白名单） */
.acts{flex:none;display:flex;flex-wrap:wrap;gap:12px}
.act{min-height:64px;display:inline-flex;align-items:center;gap:10px;padding:0 22px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:20px;font-weight:650;color:var(--ink)}
.act small{font-size:15px;color:var(--ink-3);font-weight:600}
.drop{margin-top:11px;font-size:17px;line-height:1.5;color:var(--ink-3)}

/* 等待 / 语音面板 */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:26px 30px}
.panel.deep{border:0;background:linear-gradient(158deg,var(--deep-2),var(--deep));color:#f2efe4}
.panel.deep .state-p{color:rgba(242,239,228,.76)}
.pcenter{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.orb{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(46,230,168,.4);background:rgba(46,230,168,.08);color:var(--emerald)}
.orb.syn{border-style:dashed;border-color:#f0c463;color:#f0c463;background-image:repeating-linear-gradient(135deg,rgba(240,196,99,.1) 0 8px,rgba(240,196,99,0) 8px 18px)}
.pcenter b{font-size:27px;line-height:1.3;font-weight:700}
.pcenter p{max-width:660px;font-size:20px;line-height:1.55;color:var(--ink-2)}
.panel.deep .pcenter p{color:rgba(242,239,228,.76)}
/* voice-connecting：把居中大留白换成顶部横向状态条，面板随内容收紧 */
.panel.flow{flex:none}
.pband{flex:none;display:flex;align-items:flex-start;gap:22px}
.pband .dots{flex:none;margin-top:14px}
.pband div{flex:1;min-width:0}
.pband b{display:block;font-size:26px;line-height:1.3;font-weight:700}
.pband p{margin-top:9px;font-size:20px;line-height:1.5;color:rgba(242,239,228,.76)}
.dots{display:flex;gap:9px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--teal)}
.panel.deep .dots i{background:var(--emerald)}
.dots i:nth-child(1){animation:k-dot 1200ms ease-in-out infinite}
.dots i:nth-child(2){animation:k-dot 1200ms ease-in-out 160ms infinite}
.dots i:nth-child(3){animation:k-dot 1200ms ease-in-out 320ms infinite}
@keyframes k-dot{0%,100%{opacity:.28}50%{opacity:1}}
.cc{flex:none;margin-top:16px;border:1.5px dashed #f0c463;border-radius:var(--r-md);padding:18px 22px;background:rgba(240,196,99,.08)}
.cc-h{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:#f0c463}
.cc p{margin-top:9px;font-size:21px;line-height:1.5;color:rgba(242,239,228,.9)}
.cc[hidden]{display:none}
.twocol{flex:none;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-list{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);padding:16px 20px}
.panel.deep .mini-list{border-color:rgba(242,239,228,.18);background:rgba(242,239,228,.06)}
.mini-list b{display:block;font-size:19px;font-weight:700;margin-bottom:9px}
.mini-list li{list-style:none;display:flex;gap:10px;font-size:18px;line-height:1.45;color:var(--ink-2);padding:3px 0}
.panel.deep .mini-list li{color:rgba(242,239,228,.74)}
.mini-list li i{flex:none;width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--teal)}
.panel.deep .mini-list li i{background:var(--emerald)}
.spec{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.spec div{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:14px 16px}
.spec b{display:block;font-size:19px;font-weight:700}
.spec span{display:block;margin-top:5px;font-size:16px;line-height:1.4;color:var(--ink-3)}

/* ── 底部输入坞 / 语音控制区 ────────────────────── */
.dock{flex:none;padding:16px 44px 18px;background:var(--surface);border-top:1px solid var(--line)}
.dock textarea{width:100%;height:98px;resize:none;padding:16px 20px;border:1px solid #9eb4aa;border-radius:var(--r-md);background:#fffefa;color:var(--ink);font-size:22px;line-height:1.5}
.dock textarea::placeholder{color:#9baaa4}
.dock textarea[readonly]{background:#f0efe8;border-color:var(--line-2);color:var(--ink-2)}
.dock-row{margin-top:12px;display:flex;align-items:center;gap:14px}
.dock-meta{flex:1;min-width:0;font-size:17px;line-height:1.4;color:var(--ink-3)}
.dock-meta b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mini{flex:none;min-height:48px;padding:0 18px;border:1px solid var(--line-2);border-radius:14px;background:var(--paper);font-size:17px;font-weight:600;color:var(--ink-2)}
.btn{min-height:64px;padding:0 26px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:11px;font-size:23px;font-weight:650;text-align:center}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--cinnabar);color:#fff}
.btn[aria-disabled=true]{opacity:.5}
.btn[aria-pressed=true]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-d)}
.dock-note{margin-top:11px;display:flex;gap:11px;align-items:baseline;font-size:17px;line-height:1.5;color:var(--ink-2)}
.dock-note b{flex:none;color:var(--wheat-d);font-weight:700}
.vdock{display:flex;gap:14px}
.vdock .btn{flex:1;padding:0 12px}

/* ── truth / 导航 ───────────────────────────────── */
.truth{flex:none;padding:15px 44px 16px;border-top:1px solid var(--line);display:flex;gap:24px}
.truth div{flex:1;font-size:17px;line-height:1.5;color:var(--ink-3)}
.truth b{color:var(--ink-2);font-weight:700}
.navbar{flex:none;height:128px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.nav-item .ni{font-size:21px;color:var(--ink-3);font-weight:600}
.nav-item.on .ni{color:var(--teal-d)}
.nav-item.on::before{content:"";position:absolute;top:0;width:56px;height:6px;border-radius:0 0 6px 6px;background:var(--teal)}

/* 状态进入过渡：承载「内容换了」这一条真实信息 */
.body.enter .sec{animation:k-enter var(--dur-quick) var(--ease-out) both}
@keyframes k-enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.breathe{animation:k-breathe 2600ms ease-in-out infinite}
@keyframes k-breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* 原型演示控制（非产品功能） */
.demo-tab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;width:56px;min-height:140px;background:rgba(11,36,30,.9);color:var(--emerald);border-radius:0 16px 16px 0;writing-mode:vertical-lr;letter-spacing:4px;font-size:17px;font-weight:700}
.demo-panel{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;display:none;background:rgba(11,36,30,.96);border-radius:0 18px 18px 0;padding:14px;flex-direction:column;gap:6px}
.demo-panel.show{display:flex}
.demo-panel .dp-t{color:var(--emerald);font-size:15px;font-weight:700;letter-spacing:2px}
.demo-panel a{display:flex;align-items:center;min-height:48px;color:#f2efe4;font-size:16px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.07);white-space:nowrap}
.demo-panel a.on{background:rgba(46,230,168,.22);color:var(--emerald);font-weight:700}
html:not(.debug) .demo-tab,html:not(.debug) .demo-panel{display:none!important}
.flat *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ══ 能力仪表带 ═══════════════════════════════════════════════
   驾驶舱的核心不是特效，是「看得见真实状态」。15 个能力各一盏灯：
   emerald 呼吸 = 在线可用 · clay = 受控（需授权或前置条件）· 灰 = 本机未开放。
   灯的颜色只由服务端返回决定，不可用就是灰的——不伪造能力。
   通电序列只在首屏跑一次：prefers-reduced-motion 与 ?flat=1 下全部直接就位。 */
.rail{margin-top:2px;border-top:1px solid rgba(46,230,168,.16);padding-top:20px;}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.rail-t{font-size:18px;font-weight:700;color:#dff3ea;letter-spacing:.02em;}
.rail-n{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;
  color:rgba(223,243,234,.62);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.rail-n b{color:#2ee6a8;font-weight:600;}
.rgrp{display:flex;align-items:flex-start;gap:16px;padding:9px 0;}
.rgrp+.rgrp{border-top:1px solid rgba(46,230,168,.08);}
.rgl{flex:none;width:118px;padding-top:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:14px;color:rgba(223,243,234,.5);letter-spacing:.06em;}
.rcs{display:flex;flex-wrap:wrap;gap:9px;flex:1;}
.rc{display:flex;align-items:center;gap:9px;min-height:52px;padding:0 17px;border-radius:14px;
  background:rgba(255,255,255,.045);border:1px solid rgba(46,230,168,.13);
  font-size:18px;color:#dff3ea;cursor:pointer;transition:background .16s,border-color .16s,transform .16s;
  opacity:0;transform:translateY(7px);}
.rc.lit{opacity:1;transform:none;}
.rc:active{transform:scale(.975);}
.rc .lamp{width:9px;height:9px;border-radius:50%;flex:none;background:#5b7a70;}
.rc.on{border-color:rgba(46,230,168,.3);}
.rc.on .lamp{background:#2ee6a8;box-shadow:0 0 0 0 rgba(46,230,168,.5);}
.rc.on .lamp.pulse{animation:lampbreathe 3.4s ease-in-out infinite;}
.rc.ctl{border-color:rgba(184,104,60,.36);}
.rc.ctl .lamp{background:#d98a52;}
.rc.off{color:rgba(223,243,234,.42);border-color:rgba(255,255,255,.07);}
.rc.off .lamp{background:#4a635b;}
.rc .rt{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;
  color:rgba(223,243,234,.45);margin-left:2px;}
@keyframes lampbreathe{0%,100%{box-shadow:0 0 0 0 rgba(46,230,168,.5);}
  50%{box-shadow:0 0 0 5px rgba(46,230,168,0);}}
@media (prefers-reduced-motion:reduce){
  .rc{opacity:1;transform:none;} .rc.on .lamp.pulse{animation:none;}
}
#stage.flat .rc{opacity:1;transform:none;}
#stage.flat .rc.on .lamp.pulse{animation:none;}

/* ══ 本次 AI 活动流 ══════════════════════════════════════════ */
.act{display:flex;flex-direction:column;gap:12px;}
.act-lg{display:flex;gap:20px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;
  background:var(--paper);border:1px solid var(--line);font-size:17px;color:var(--ink-3);}
.act-lg span{display:flex;align-items:center;gap:8px;}
.ev{width:14px;height:14px;border-radius:50%;flex:none;}
.ev.e1{background:var(--teal);}
.ev.e2{background:transparent;border:3px solid var(--teal);border-bottom-color:transparent;}
.ev.e3{background:transparent;border:2px dashed var(--clay);}

/* ══ 意图路由 ═══════════════════════════════════════════════
   用户提问 → 一道光沿仪表带扫过 → 停在将要处理这件事的能力上。
   这是「驾驶」的语义：把控制权交给某个系统，而且让人看见交给了谁。
   扫光只在真的识别出目标能力时才跑；识别不出就什么都不做，不乱指。 */
.rail{position:relative;}
.sweep{position:absolute;left:0;top:52px;bottom:8px;width:120px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(46,230,168,.16),transparent);
  opacity:0;transform:translateX(-140px);}
.sweep.run{animation:railsweep 620ms cubic-bezier(.3,.7,.3,1) forwards;}
@keyframes railsweep{
  0%{opacity:0;transform:translateX(-140px);}
  14%{opacity:1;}
  86%{opacity:1;}
  100%{opacity:0;transform:translateX(var(--sweep-to,900px));}}
.rc.routed{background:rgba(46,230,168,.13);border-color:rgba(46,230,168,.62);
  box-shadow:0 0 0 1px rgba(46,230,168,.3);}
.rc.routed .lamp{background:#2ee6a8;}
.rc .rby{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;
  color:#2ee6a8;margin-left:6px;letter-spacing:.04em;}
.rail-route{margin-top:14px;padding:11px 16px;border-radius:13px;
  background:rgba(46,230,168,.08);border:1px solid rgba(46,230,168,.22);
  font-size:17px;color:#dff3ea;display:none;align-items:center;gap:10px;}
.rail-route.on{display:flex;}
.rail-route b{color:#2ee6a8;font-weight:700;}
.rail-route .rr-x{margin-left:auto;font-size:15px;color:rgba(223,243,234,.5);}
@media (prefers-reduced-motion:reduce){.sweep.run{animation:none;opacity:0;}}
#stage.flat .sweep.run{animation:none;opacity:0;}

/* 2026-09-05 体检修复：27 寸竖屏 1px≈0.31mm，13–15px 辅助文字站立读不清；统一提到 16px（正文字阶仍按规范 17–23）。 */
.ment-go small,.tag,.ans-list li i,.act small,.rail-n,.rail-route .rr-x{font-size:16px}.rc .rt{font-size:15px}
</style>
</head>

  </div>

  <nav class="navbar" aria-label="全局导航">

 calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.4"/><path d="M3.5 10h17M8.5 2.8v4M15.5 2.8v4"/>',

   识别不出就不高亮：宁可不指，不能乱指。 */
var ROUTE_KW=[
 ['resume_diagnosis',['诊断','看看我的简历','简历有什么问题']],
 ['resume_optimize',['优化','改简历','压到一页','工作经历怎么写','项目经历']],
 ['resume_generate',['生成简历','从零','没有简历','写一份简历']],
 ['print_param_prefill',['打印','用什么纸','什么格式','双面','彩色']],

 ['job_explain',['jd','岗位要求','这个岗位是做什么']],
 ['job_recommend',['推荐岗位','有什么岗位','找工作方向']],
 ['career_plan',['职业规划','以后做什么','转行']],
 ['mock_interview',['面试','自我介绍','谈薪','常见问题']],
 ['self_assessment',['我适合','性格','职业倾向','自我评估']],

var CAP_NAME={};
function routeFor(text){

   var kws=ROUTE_KW[i][1];

}
function routeTo(text){

 var chip=el.querySelector('[data-cap="'+key+'"]'); if(!chip) return;
 /* 受控 / 未开放的能力不做「已交给它」的承诺，只提示为什么用不了 */
 var usable=chip.classList.contains('on');
 el.querySelectorAll('.rc.routed').forEach(function(x){
   x.classList.remove('routed'); var b=x.querySelector('.rby'); if(b) b.remove();

 var instant=new URLSearchParams(location.search).get('flat')==='1'
   || (window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

   chip.classList.add('routed');

   }
 }

    （早前把落位放进 setTimeout，截图与真实交互都可能读到"还没路由"的中间态。） */
 land();
}

 var tel=TEL[state];
 document.getElementById('ck-tel').innerHTML=
  '<div><span>回答来源</span><b class="'+(state==='reply-real'||state==='reply-not-ai'?'amber':'')+'">'+tel[0]+'</b></div>'
  +'<div><span>语音通道</span><b class="'+(state==='voice-live'?'amber':'')+'">'+tel[1]+'</b></div>'
  +'<div><span>本机草稿</span><b class="hi">离场即清</b></div>';
 bindDraft();
 root.classList.remove('enter');void root.offsetWidth;root.classList.add('enter');
 var links=document.querySelectorAll('#demo-panel a');
 for(var i=0;i<links.length;i++)links[i].className=(links[i].getAttribute('data-s')===state?'on':'');
 if(!keepUrl)syncUrl();
}
function bindDraft(){
 var ta=document.getElementById('draft');
 if(!ta)return;
 ta.addEventListener('input',function(){
  setDraft(ta.value);
  var c=document.getElementById('count');if(c)c.textContent=ta.value.trim().length;
  var s=document.getElementById('send');
  if(s)s.setAttribute('aria-disabled',ta.value.trim().length&&state!=='ai-unavailable'&&state!=='submitting'?'false':'true');
 });
}

/* 事件委托：所有可点控件都真的会动，不留假占位 */
document.getElementById('stage').addEventListener('click',function(ev){
 var el=ev.target.closest('[data-act]');
 if(!el)return;
 var act=el.getAttribute('data-act');
 if(act==='pick'){
  var id=el.getAttribute('data-task');
  topic=(topic===id)?null:id;
  render(getDraft().trim()?'composer':'default');
 }else if(act==='fill'){
  var q=el.getAttribute('data-q');
  setDraft(q);
  render('composer');
  routeTo(q);   /* 选完问题就沿仪表带扫到将要接手的能力上 */
  var ta=document.getElementById('draft');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
 }else if(act==='clear'){
  setDraft('');render(state==='composer'?'default':state);
 }else if(act==='send'){
  if(el.getAttribute('aria-disabled')==='true')return;
  routeTo(getDraft());
  render('submitting');
 }else if(act==='retry'){
  routeTo(getDraft());
  render('submitting');
 }else if(act==='recheck'){
  render('default');
 }else if(act==='go'){
  render(el.getAttribute('data-state'));
 }else if(act==='mute'){
  muted=!muted;dock.innerHTML=voiceDock();
 }else if(act==='cc'){
  ccOn=!ccOn;
  var box=document.getElementById('cc-box');if(box)box.hidden=!ccOn;
  dock.innerHTML=voiceDock();
 }
});
/* 离场即清：公共终端不把草稿留给下一位使用者 */
addEventListener('pagehide',function(){setDraft('')});

/* 原型演示控制（非产品逻辑）：只切 data-state，不驱动任何业务结果 */
var panel=document.getElementById('demo-panel');
panel.insertAdjacentHTML('beforeend',STATES.map(function(s){return '<a href="?state='+s+'&debug=1'+(intent?'&intent='+intent:'')+'" data-s="'+s+'">'+s+'</a>'}).join(''));
document.getElementById('demo-tab').addEventListener('click',function(){panel.classList.toggle('show')});
if(q.get('debug')==='1')document.documentElement.classList.add('debug');
if(q.get('flat')==='1')document.getElementById('stage').classList.add('flat');

function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
render(state,true);
paintRail();   /* 仪表带只画一次；切状态不重跑通电序列 */
})();
</script>
