<!--
  route: /resume/source（含 /resume/parse 的等待与失败段），同一工作台，1080x1920

  真实合同来源（只建模已存在的字段与状态，不新增后端不认识的输入项）：
    apps/kiosk/src/pages/resume/ResumeSourcePage.tsx
      - intent = diagnose | optimize（?intent=optimize 才是 optimize，其余一律 diagnose）
      - UploadChannel = 'usb' | 'cloud' | 'phone'。本页把 cloud 的**用户可见名**改为
        「本机文件 / 云盘下载目录」，因为它打开的是本机文件选择，不是云盘账号登录；
        本页 query 用 source=local 指同一条 cloud 通道。
      - ACCEPT = PDF / DOCX / JPG / PNG / WEBP；MAX_BYTES = 10MB（客户端口径）
      - 出口 navigate('/resume/parse', {state:{intent,source:'upload',file,fileId,
        selectedDimensions,targetContext}})，**没有 file 就不放行**
      - 没有电子简历 → /resume/generate（本原型 24-resume-generate.html）
    apps/kiosk/src/pages/resume/components/DiagnosisDirectionForm.tsx
      - genericDiagnosis（切换为通用诊断）→ selectedDimensions=[] + targetContext={skipped:true}
      - 重点关注维度 = RESUME_SCORING_DIMENSIONS 固定 6 项，默认 keyword/quantification/experience
      - 行业门类 = EMPLOYMENT_INDUSTRY_SECTORS（GB/T 4754-2017 的 20 个门类），送的是中文 label
    packages/shared/src/types/ai.ts + careerTaxonomies.ts
      - RESUME_TARGET_EXPERIENCE_OPTIONS = 无工作经验/应届/1年以内/1-3年/3-5年/5年以上
      - RESUME_TARGET_SCENE_OPTIONS     = 校招/社招/转岗/招聘会现场
      - EDUCATION_LEVEL_OPTIONS         = 12 项，另有 value="" 的「不填写」
      - targetJob / major 是自由文本（服务端 MaxLength 80 / 40）；本页给常见值点选，避免键盘
      - ResumeTargetContext 只有 industry/targetJob/experience/scene/major/degree/skipped 七个字段：
        **没有城市、工作性质、薪资、证书、语言**，本页也不做这些入口
    apps/kiosk/src/pages/resume/components/ResumeUsbImportPanel.tsx + services/files/usbImportApi.ts
      - isUsbImportConfigured() 为假 → 「当前终端未配置U盘导入」（配置缺失，用户无法自解）
      - LOCAL_AGENT_UNREACHABLE → 「无法连接本机 Terminal Agent，请确认 Agent 正在运行」（服务未起，可重试）
      - getUsbStatus() → {present,driveLabel}；2000ms 轮询；listUsbFiles() 客户端只留 ≤10MB
      - apps/terminal-agent/src/usb/usb-files.ts：ALLOWED_USB_EXTENSIONS 只有 .pdf/.jpg/.jpeg/.png，
        MAX_USB_FILE_BYTES=15MB，MAX_USB_FILES_LISTED=200，**只枚举根目录、不进子文件夹**，
        跳过 0 字节与 . / $ 开头的文件；safeId 一次性、10 分钟有效、每次重新列盘即作废
      - 全仓库没有「安全弹出」能力，只有 ResumeSourcePage.tsx:51 的
        「只读取你主动选择的文件，上传完成后即可拔出 U 盘。」——本页照此说，不发明弹出按钮
    apps/kiosk/src/pages/upload/components/UploadSessionQrPanel.tsx
      - UploadSessionStatus = pending|uploading|uploaded|confirmed|expired|cancelled
      - SESSION_TTL = 10 分钟；倒计时 M:SS 由服务端 expiresAt 推；状态每 2000ms 轮询
      - 连续 3 次轮询失败 → 本机置为「状态读不到」，本页把它单列为 phone-status-unknown，
        不冒充「服务端说过期了」
      - 刷新二维码前必须先在服务端撤销旧码；已上传时刷新被拒
      - 手机端是独立 route /upload/phone（本原型 51-phone-relay.html?screen=phone-upload）

  ★ 哪些「取消」是真的，哪些不是 —— 本页据此排动作，不按视觉对称排：
    1) DELETE /upload-sessions/:sessionId 是**真取消**（upload-sessions.service.ts:324）：
       校验 controlToken → 清理未确认的临时文件（cleanupAbandonedFile）→ status=cancelled。
       **已 confirmed 的会话不能取消**（UPLOAD_SESSION_CONFIRMED / 400）。
       所以手机通道的取消/换码必须走「撤销中 → 撤销成功 / 撤销失败」三态，
       撤销失败**必须保留旧二维码与已收到文件的上下文，且不签发新码**。
    2) POST /local/usb/upload（ResumeUsbImportPanel）**没有** AbortController、也没有取消端点；
       Terminal Agent 在发请求前先 consumeUsbFile(safeId)，safeId 一次性用掉，
       上传本身 NO_RETRY_CONFIG（apps/terminal-agent/src/local-api/qr-login-server.ts）。
       ⇒ usb-importing **不放任何会被理解为中止的按钮**；
       ⇒ usb-import-failed **不能用同一个 safeId 直接重试**，只能重新读盘再选。
    3) kioskUploadFile 是普通一次性 fetch，同样没有 abort 契约 ⇒ uploading 没有取消入口。
    4) /resume/parse 的等待同理：返回只是停止本机等待，**不撤回**已提交的解析请求。
    本页把这四条统一表达成：忙碌态只挂「进行中 · 没有中止入口」标签 + 一句
    「离开这一页不会撤回已经发出的请求」，不提供假的取消/换来源。

  ★ 留存（services/api/src/files/retention-policy.ts + files/file.types.ts + files.controller.ts）：
      - resume_upload = highly_sensitive；system_short 对高敏 = **1 小时**
      - months_3 = **90 天**；months_6 = **180 天**（requiresConsent → consentVersion）
      - 原始文件（assetCategory=original）**不允许 long_term**，即不支持永久保存
      - POST /files/kiosk-upload：带会员 token 时 **上传当场** 绑定 endUserId
        ⇒ U 盘 / 本机这两条直传通道，登录会员在**上传那一刻**就是 90 天
      - upload-sessions：mode=member 要在一体机 **confirm 之后** bindMemberFile 才绑定（90 天）；
        mode=temporary **不绑定、不自动归档**，仍是 1 小时
      ⇒ 本页不写「所有通道都要登录并确认归档」这种笼统话，也不发明「上传前保存开关」。
      ⇒ 账号态在原型里由受控 fixture ?acct=guest|member 决定，**不冒充真实登录态**。

  ★ 目标设置工作台（target-context）—— 本轮把两屏并成一块工作台，顺带把岗位改成两级点选：
    1) 六个合同字段（行业 / 目标岗位 / 经验 / 求职场景 / 专业 / 学历）全部在 target-context 这一块
       工作台里点完。专业与学历改成同一页里的展开抽屉（?more=1），行业 20 门类也能就地展开（?ind=1）。
       用户路径不再为两项选填翻一整屏。工作台内容比一屏高，所以它**自己滚**（.wb），
       摘要条与主行动固定在底部，滚动不会把主 CTA 推到底栏后面。
    2) state=target-profile **保留**，只是不再是独立业务页：它落回同一块工作台，强制展开专业与学历，
       并在顶部给一条兼容说明。没有第二个 HTML，也没有第二份设计。
       state=target-industry 也保留（整屏 20 门类表），工作台里那一行「整屏门类表 →」仍然指向它。
    3) 目标岗位＝两级点选：19 个岗位类别（技术研发 / 产品 / 运营 / 销售 / 市场公关 / 行政人事 /
       财务会计 / 客户服务 / 设计创意 / 生产制造 / 物流仓储 / 零售餐饮 / 医护照护 / 建筑工程 /
       教育培训 / 传媒内容 / 法律政务 / 农业食品 / 服务技工）＋「其他岗位」手填兜底。
       **类别只负责导航**，最终写进 targetJob 的只有中文具体职位名（或用户主动选的「整类：xx」）。
       旧版那 12 个宽泛大类（?job=市场销售 / 餐饮零售 / 医护照料 / 汽修与技工 等）仍然能打开、
       仍然回显，并被归到对应新类别（LEGACY_JOB_CAT / SPEC_CAT / CAT_LABEL_KEY）。
    4) 「其他岗位」的键盘**只在用户主动点开那一格时才出现**，不主动弹给每一个用户。
       targetJob 上限 80、major 上限 40，**按服务端 DTO 分开**（ResumeTargetContextDto）。
       自由文本一律 trim + 拒收控制字符 / 零宽 / 双向控制符 / HTML 元字符（< > " ' \ `）+ 超长整条丢弃，
       回显走 escapeHTML，**任何一步都不回显原始 query**。拒收而不是截断：截断会把攻击串的前缀
       照样显示在一块公共屏幕上，即便它已经是惰性文本。
    5) 「去岗位信息」是**诚实受控入口**，不是岗位选择器：本页是静态原型，拿不到真实岗位就不假装拿到，
       卡面直说「不会自动把岗位带回来」。后续 React 迁移合同：即便接上 /jobs，回传也只允许
       **把已审核已发布岗位的中文标题填进 targetJob 这一个自由文本字段**；
       **不得**新增 jobId、JD 正文、城市、薪资、工作性质、证书、语言等 targetContext 之外的字段，
       **不得**因此产生站内投递、企业匹配或投递记录。跳转记录只能是 §4.4 的 external_open 口径。
    6) cat / ind / more 是视图状态（哪一类展开、行业表开没开、专业学历开没开），
       **不进 targetContext、不进任何请求体**，离开这三个 state 就从地址里去掉。

  state（50，与 var STATES 一一对应；此前这里写 42，漏了扫描交接与「结果未知」两组）：
    source | target | target-context | target-profile | target-industry | summary
    usb-wait | usb-detecting | usb-list | usb-empty | usb-read-failed | usb-unavailable
      | usb-agent-offline | usb-selected | usb-importing | usb-import-failed | usb-ready
    local-guide | local-picking | local-cancelled | local-selected | local-rejected
      | local-oversize | local-unreadable | local-ready
    phone-generating | phone-gen-failed | phone-ready | phone-waiting | phone-status-unknown
      | phone-expired | phone-uploaded | phone-confirm-failed
      | phone-cancelling | phone-cancelled | phone-cancel-failed
    uploading | upload-failed | parsing | parse-failed | missing-file | unknown
    scan-ready | scan-expired | scan-unavailable | scan-failed
    upload-unknown | upload-rechecking | parse-unknown | parse-rechecking

  受控 fixture 参数：?acct=guest|member（账号态）、?from=（撤销从哪一步来）、?why=leave|refresh。
  文件身份：?f=0|1|2 指 U 盘那三份，?lf=0|1 指本机目录里能收的那两份（DOCX / PDF）。
    两个是各自独立的白名单，互不复用；一旦在列表里点定，就一路带到确认、已收到、办理确认和预览层，
    中途没有任何一步会把它顶回默认那一份。非法取值一律归一，且不回显原始参数。

  预览层能做什么（本机文件、U 盘两条通道；PDF 与图片一致）：
    适应整页 / 适应宽度 / 200% / 300%、向左转 / 向右转 / 正向、PDF 逐页翻。
    放大之后 .pv-view 是**真实滚动容器**：触摸走浏览器原生滚动，鼠标 / 触控笔按住直接拖；
    只有量出来真的溢出才挂拖拽、才出提示。DOCX 不转换、不放假缩略图，只给诚实的替代路径。

  ★ 手机扫码通道（source=phone）是**冻结面**：本轮新增的方向组、工具条分隔符和指针拖拽
    一律不进这条分支，pr 在这条分支上归一为 0，页面按施工前的老办法整块铺满画布内框。
    手机通道的查看器因此和 phone-* 状态一样，保持施工前的视觉与行为——.pv-view 仍是真实
    滚动容器，触摸仍走浏览器原生滚动，只是没有指针拖拽这一层。
    这是本轮划定的改动边界，不是「手机的文件低人一等」；要给手机通道加方向或拖拽，
    得作为一次单独的改动重新提，连同它的截图基线一起重做。

  两类状态迁移，写清楚，免得把原型当成能模拟硬件：
    A 用户真的能点的：选来源、换来源、重新检测、选文件、确认、撤销上传码、重新出码、继续。
      一律是真链接，普通 URL 下可点。
    B 现实世界事件（U 盘被插上、手机把文件传上来、服务端返回成功或失败、撤销成功或失败）：
      本原型**不模拟**，页面上没有假按钮；只能用 ?debug=1 的演示面板跳到对应状态看设计。
  原型演示控制：普通地址完全不渲染；仅 ?debug=1 注入（data-proto-control="true"），并保留 debug=1。
-->

/* ---------- 主体 ---------- */
#body-root{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px 44px 14px;overflow:hidden;}
/* flex:0 1 auto —— 平时不抢高度，内容万一超出时各块一起让，
   而不是把底部主行动挤出主体（chromeOverlap）。 */
.blk{flex:0 1 auto;display:flex;flex-direction:column;gap:11px;min-height:0;}
/* .grow 只标记「哪一块吸收剩余高度」。剩余高度一律进真实内容容器（列表行 / 卡片 /
   事实行 / 步骤格），不留空档；内容超出时这一块自己收缩，不把底部主行动挤出主体。 */
.blk.grow{flex:1 1 auto;min-height:0;overflow:hidden;}
.blk.grow>*:not(.blk-h){flex:1 1 auto;min-height:0;}
.blk.grow .list .lrow{flex:1 1 auto;}
.blk.grow .tri{grid-auto-rows:1fr;}
.blk.grow .tri-c{justify-content:space-between;}
.blk.grow .picks{grid-auto-rows:1fr;}

.blk.grow .duo{grid-auto-rows:1fr;}
.blk.grow .duo-c{justify-content:space-between;}
.blk.grow .chans{grid-auto-rows:1fr;}
.blk.grow .sbs-grid{grid-auto-rows:1fr;}
/* 格式说明是一行注脚，不参与吸收剩余高度：让它跟着格式 chip 走，

.blk.grow .card .meta{flex:1 1 auto;grid-auto-rows:1fr;align-content:stretch;}
.blk.grow .fail{display:flex;flex-direction:column;justify-content:space-between;}
.blk.grow .grp{align-items:center;}
.blk.grow .grp .lb{padding-top:0;}
.blk.grow .qrside .card{justify-content:space-between;}
.blk-h{display:flex;align-items:center;gap:12px;}
.blk-h .t{font-size:25px;font-weight:700;letter-spacing:.5px;}
.blk-h .h{font-size:18px;color:var(--ink-3);margin-left:auto;text-align:right;display:flex;align-items:center;gap:10px;}

/* 段控 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg-i{min-height:88px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);
  padding:11px 22px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.seg-i .n{font-size:24px;font-weight:700;}
.seg-i .d{font-size:17px;color:var(--ink-3);line-height:1.34;}
.seg-i[aria-current="true"]{border-color:var(--teal);background:var(--teal-soft);}
.seg-i[aria-current="true"] .n{color:var(--teal-d);}
.seg-i[aria-current="true"] .d{color:var(--teal-d);opacity:.84;}

/* 来源三卡 */
.srcs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.src{border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--surface);
  padding:18px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:0 3px 12px rgba(16,48,43,.05);}
.src .ico{width:58px;height:58px;border-radius:var(--r-sm);background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.src .n{font-size:23px;font-weight:700;}
.src .d{font-size:17px;line-height:1.42;color:var(--ink-3);}
.src .go{margin-top:auto;font-size:17px;font-weight:700;color:var(--teal-d);}
.src[aria-current="true"]{border-color:var(--teal);background:var(--teal-soft);}
.src[aria-current="true"] .ico{background:var(--surface);}
.src.off{border-style:dashed;border-color:var(--line-2);background:var(--paper);}
.src.off .ico{background:var(--wheat-soft);}
.src.off .go{color:var(--wheat-d);}
.fmt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:17px;color:var(--ink-3);}
.fmt i{display:inline-flex;align-items:center;height:34px;padding:0 11px;border-radius:10px;font-style:normal;
  background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink-2);}

/* 通道步骤条：这条通道真实的几步，当前停在哪一步 */
.sbs-grid{display:grid;gap:11px;}
.sb-i{min-height:84px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  padding:11px 14px;display:flex;flex-direction:column;gap:4px;}
.sb-i .sbn{font-size:16px;font-weight:800;letter-spacing:1px;color:var(--ink-3);}
.sb-i .sbt{font-size:19px;font-weight:700;line-height:1.24;}
.sb-i .sbs{margin-top:auto;font-size:16px;color:var(--ink-3);}
.sb-i.done{background:var(--teal-soft);border-color:transparent;}
.sb-i.done .sbn,.sb-i.done .sbs{color:var(--teal-d);}
.sb-i.on{border-color:var(--teal);background:var(--teal-soft);}
.sb-i.on .sbn,.sb-i.on .sbs{color:var(--teal-d);}
.sb-i.on .sbt{color:var(--teal-d);}
.sb-i.warn{border-color:var(--wheat);background:var(--wheat-soft);}
.sb-i.warn .sbn,.sb-i.warn .sbs,.sb-i.warn .sbt{color:var(--wheat-d);}
.sb-i.bad{border-color:var(--cinnabar);background:var(--cinnabar-soft);}
.sb-i.bad .sbn,.sb-i.bad .sbs,.sb-i.bad .sbt{color:var(--cinnabar-d);}

/* 通道盘：三条取件通道各自的可用状态，任何一步都能直接换 */
.chans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
.chan{min-height:112px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--surface);
  padding:13px 18px;display:flex;flex-direction:column;gap:6px;}
.chan .cn{font-size:21px;font-weight:700;line-height:1.24;display:flex;align-items:center;gap:9px;}
.chan .cd{font-size:17px;line-height:1.38;color:var(--ink-3);}
.chan .cs{margin-top:auto;font-size:17px;font-weight:700;color:var(--teal-d);}
.chan.now{border-color:var(--teal);background:var(--teal-soft);}
.chan.now .cn{color:var(--teal-d);}
.chan.lock{border-style:dashed;border-color:var(--line-2);background:var(--paper);}
.chan.lock .cs{color:var(--wheat-d);}

/* 通道条 */
.track{flex:none;display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);}
.track .ti{flex:none;width:54px;height:54px;border-radius:var(--r-sm);background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.track.warnt .ti{background:var(--wheat-soft);}
.track.badt .ti{background:var(--cinnabar-soft);}
.track .tm{flex:1;min-width:0;}
.track .tn{display:block;font-size:22px;font-weight:700;}
.track .td{display:block;margin-top:3px;font-size:17px;color:var(--ink-3);line-height:1.35;}
.tbtn{flex:none;min-height:56px;display:flex;align-items:center;padding:0 20px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--paper);font-size:18px;font-weight:700;color:var(--ink-2);}
/* 忙碌态的通道条上挂的是**标签不是按钮**：这一步在真实实现里没有中止入口，
   放一个点得动的「取消」等于承诺一件做不到的事。 */
.tbtag{flex:none;display:inline-flex;align-items:center;gap:9px;min-height:56px;padding:0 20px;
  border-radius:var(--r-sm);background:var(--wheat-soft);border:1px solid var(--wheat);
  color:var(--wheat-d);font-size:18px;font-weight:700;}

/* 账号 / 留存条：一行说清「现在是什么模式、这份简历会被留多久、去哪儿改」 */
.acct{flex:none;display:flex;align-items:center;gap:16px;border-radius:var(--r-md);padding:13px 22px;
  border:1.5px solid var(--wheat);background:var(--wheat-soft);}
.acct.on{border-color:var(--teal);background:var(--teal-soft);}
.acct .ai{flex:none;width:54px;height:54px;border-radius:var(--r-sm);background:var(--surface);
  display:flex;align-items:center;justify-content:center;}
.acct .am{flex:1;min-width:0;}
.acct .an{display:block;font-size:21px;font-weight:700;color:var(--wheat-d);}
.acct.on .an{color:var(--teal-d);}
.acct .ad{display:block;margin-top:4px;font-size:17px;line-height:1.42;color:var(--ink-2);}
.acct .ad b{color:var(--ink);font-weight:700;}
.acct .ag{flex:none;font-size:18px;font-weight:700;color:var(--wheat-d);}
.acct.on .ag{color:var(--teal-d);}

/* 文件列表 */
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;overflow:hidden;
  border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);padding:14px 16px;}
.lrow{flex:none;min-height:80px;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--paper);}
.lrow .li{flex:none;width:48px;height:48px;border-radius:15px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.lrow.no .li{background:var(--cinnabar-soft);}
.lrow .lm{flex:1;min-width:0;}
.lrow .ln{display:block;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lrow .ls{display:block;margin-top:3px;font-size:17px;color:var(--ink-3);}
.lrow .lg{flex:none;font-size:17px;font-weight:700;color:var(--teal-d);}
.lrow.no .lg{color:var(--cinnabar-d);}
.lhint{flex:none;display:flex;align-items:flex-start;gap:9px;font-size:16px;line-height:1.45;color:var(--ink-3);}
.lhint b{color:var(--ink-2);font-weight:700;}

/* 等待 / 处理态 */
.stat{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  border-radius:var(--r-lg);border:1.5px dashed var(--line-2);background:var(--surface);padding:24px 30px;}
.stat .si{width:100px;height:100px;border-radius:30px;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;}
.stat .st{font-size:28px;font-weight:700;text-align:center;}
.stat .sd{font-size:19px;line-height:1.58;color:var(--ink-2);text-align:center;max-width:780px;}
.stat.doing{border-style:solid;border-color:var(--teal);background:var(--teal-soft);}
.stat.doing .si{background:var(--surface);border-color:var(--teal-soft);}
.stat.doing .st{color:var(--teal-d);}
/* band：图标在左、文字在右的横向状态面板。竖排时那颗 100px 图标会在正文里
   撑出一条没有字的带子，横排后正文自上而下连续。 */
.stat.band{flex-direction:row;align-items:center;justify-content:flex-start;gap:26px;padding:22px 28px;}
.stat.band .si{width:96px;height:96px;}
.stat.band .sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.stat.band .st,.stat.band .sd{text-align:left;max-width:none;}

/* 文件卡 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 26px;}
.file{display:flex;align-items:center;gap:16px;}
.file .fi{flex:none;width:72px;height:72px;border-radius:22px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.file .fm{flex:1;min-width:0;}
.file .fn{display:block;font-size:25px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file .fs{display:block;margin-top:4px;font-size:18px;color:var(--ink-3);}
.file .fb{flex:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 18px;border-radius:15px;
  font-size:19px;font-weight:700;}
.fb.doing{color:var(--teal-d);background:var(--teal-soft);}
.fb.ok{color:#fff;background:var(--teal);}
.fb.err{color:#fff;background:var(--cinnabar);}
.fb.wait{color:var(--ink-2);background:var(--paper);border:1px solid var(--line-2);}
.meta{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px 22px;}
.meta .mk{display:block;font-size:16px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;}
.meta .mv{display:block;margin-top:3px;font-size:19px;font-weight:600;line-height:1.32;}
.meta .mv em{font-style:normal;font-size:16px;font-weight:400;color:var(--ink-3);}

/* chip 组 */
.grp{display:flex;align-items:flex-start;gap:12px;}
.grp .lb{flex:none;width:100px;font-size:19px;font-weight:700;color:var(--ink-2);padding-top:13px;}
.grp .ops{flex:1;min-width:0;display:flex;gap:9px;flex-wrap:wrap;}
.chip{min-height:52px;min-width:60px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  font-size:18px;color:var(--ink-2);}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:700;}
.chip.mute{color:var(--ink-3);border-style:dashed;border-color:var(--line-2);}
.chip.mute[aria-pressed="true"]{color:#fff;border-style:solid;border-color:var(--teal);}
.chip.now{border-style:solid;border-color:var(--wheat);background:var(--wheat-soft);color:var(--wheat-d);font-weight:700;}
.manual-entry{width:100%;display:flex;align-items:center;gap:10px;margin-top:2px;}
.manual-entry input{flex:1;min-width:0;height:56px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);font:600 18px/1 var(--sans);outline:none;}
.manual-entry input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,158,134,.12);}
.manual-entry button{flex:none;min-width:112px;height:56px;padding:0 16px;border-radius:var(--r-sm);background:var(--deep);
  color:#fff;font-size:18px;font-weight:700;}
.manual-entry .manual-clear{min-width:92px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);}
.dims{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.dim{min-height:68px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  padding:0 15px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;color:var(--ink-2);}
.dim .mk{flex:none;width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;color:transparent;}
.dim[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700;}
.dim[aria-pressed="true"] .mk{background:var(--teal);border-color:var(--teal);color:#fff;}
.dim.off{border-style:dashed;border-color:var(--line-2);color:var(--ink-3);background:var(--paper);}

/* 行业门类面板 */
.lead{min-height:68px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  display:flex;align-items:center;gap:12px;padding:0 20px;font-size:20px;font-weight:700;color:var(--ink-2);}
.lead .lv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lead .lx{flex:none;font-size:17px;font-weight:700;color:var(--teal-d);}
.lead[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);}
.sheet{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-content:start;overflow:hidden;}
.sheet a{min-height:72px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  padding:0 16px;display:flex;align-items:center;gap:12px;}
.sheet a .cd{flex:none;width:36px;height:36px;border-radius:12px;background:var(--paper);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink-3);}
.sheet a .nm{flex:1;min-width:0;font-size:19px;font-weight:600;line-height:1.26;}
.sheet a[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);}
.sheet a[aria-pressed="true"] .cd{background:var(--teal);border-color:var(--teal);color:#fff;}
.sheet a[aria-pressed="true"] .nm{color:var(--teal-d);font-weight:700;}

/* 二维码占位（明确不可扫描） */
.qrwrap{display:flex;gap:22px;align-items:stretch;}
.qrbox{flex:none;width:300px;border-radius:var(--r-lg);border:1.5px dashed var(--line-2);background:var(--surface);
  padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;position:relative;}
.qrgrid{width:200px;height:200px;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);
  gap:3px;opacity:.3;}
.qrgrid i{background:var(--ink-3);border-radius:2px;}
.qrgrid i.o{background:transparent;}
.qrcap{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;
  background:var(--wheat-soft);border:1px solid var(--wheat);color:var(--wheat-d);font-size:16px;font-weight:700;
  text-align:center;line-height:1.34;}
.qrframe{position:absolute;inset:14px;pointer-events:none;}
.qrframe span{position:absolute;width:30px;height:30px;border:3px solid var(--line-2);}
.qrframe .a{left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
.qrframe .b{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
.qrframe .c{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px;}
.qrframe .d{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0;}
.qrside{flex:1;min-width:0;display:flex;}
.qrside .card{flex:1;display:flex;flex-direction:column;gap:12px;}
.qrside .qh{font-size:23px;font-weight:700;}
.qrp{font-size:19px;line-height:1.56;color:var(--ink-2);}
.qrp b{color:var(--ink);font-weight:700;}
.steps{display:flex;flex-direction:column;gap:10px;}
.step{display:flex;gap:12px;align-items:flex-start;font-size:19px;line-height:1.44;color:var(--ink-2);}
.step .sn{flex:none;width:30px;height:30px;border-radius:10px;background:var(--teal-soft);color:var(--teal-d);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;margin-top:1px;}
.ticks{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;}
.tick{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 15px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line-2);font-size:17px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;}
.tick.warn{background:var(--wheat-soft);border-color:var(--wheat);color:var(--wheat-d);}
.tick.bad{background:var(--cinnabar-soft);border-color:var(--cinnabar);color:var(--cinnabar-d);}

/* 事实行 */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:2px 26px;}
.row-i{display:flex;gap:15px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);}
.row-i:first-child{border-top:none;}
.row-i .rk{flex:none;width:32px;height:32px;border-radius:11px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.row-i .rv{flex:1;min-width:0;font-size:19px;line-height:1.5;color:var(--ink-2);}
.row-i .rv b{color:var(--ink);font-weight:700;}
.rows.kv .row-i .rk{width:124px;height:auto;border-radius:0;background:none;justify-content:flex-start;
  font-size:19px;font-weight:700;color:var(--ink-3);padding-top:1px;}
.rows.kv .row-i .rv em{font-style:normal;color:var(--ink-3);font-size:17px;}

/* 失败 / 阻断 */
.fail{background:var(--cinnabar-soft);border:1.5px solid var(--cinnabar);border-radius:var(--r-lg);padding:20px 26px;}
.fail.warnf{background:var(--wheat-soft);border-color:var(--wheat);}
.fail.lockf{background:var(--slate-soft);border-color:#cfdcee;}
.fail .ft{font-size:25px;font-weight:800;color:var(--cinnabar-d);display:flex;align-items:center;gap:11px;}
.fail.warnf .ft{color:var(--wheat-d);}
.fail.lockf .ft{color:var(--slate-d);}
.fail .fbdy{margin-top:11px;font-size:19px;line-height:1.6;color:var(--ink-2);}
.fail .fbdy b{color:var(--ink);}
.stop{flex:none;display:flex;gap:22px;align-items:flex-start;border-radius:var(--r-lg);
  border:1.5px solid var(--line-2);background:var(--surface);padding:22px 28px;}
.stop .si{flex:none;width:96px;height:96px;border-radius:30px;background:var(--paper);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.stop .sm{flex:1;min-width:0;}
.stop .sh{display:block;font-size:30px;font-weight:800;line-height:1.3;}
.stop .sp{display:block;margin-top:10px;font-size:19px;line-height:1.6;color:var(--ink-2);}
.stop .sp b{color:var(--ink);font-weight:700;}

/* 三列要点卡 */
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;}
.tri-c{border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--surface);
  padding:17px 18px;display:flex;flex-direction:column;gap:9px;}
.tri-c .no{flex:none;width:50px;height:50px;border-radius:16px;background:var(--teal-soft);color:var(--teal-d);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;}
.tri-c .n{font-size:21px;font-weight:700;line-height:1.3;}
.tri-c .d{font-size:17px;line-height:1.48;color:var(--ink-3);}
.tri-c .go{margin-top:auto;font-size:17px;font-weight:700;color:var(--teal-d);}
.tri-c.warnc .no{background:var(--cinnabar-soft);color:var(--cinnabar-d);}
.tri-c.warnc .go{color:var(--cinnabar-d);}

/* 双列任务卡 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.duo-c{border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--surface);
  padding:17px 20px;display:flex;flex-direction:column;gap:11px;}
.duo-c.mute{background:var(--paper);border-style:dashed;border-color:var(--line-2);}
.duo-c .ct{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;}
.duo-c.mute .ct{color:var(--ink-3);}
.li{display:flex;gap:11px;align-items:flex-start;font-size:18px;line-height:1.48;color:var(--ink-2);}
.li .bul{flex:none;width:24px;height:24px;border-radius:8px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:var(--teal-soft);}
.duo-c.mute .li .bul{background:var(--surface);border:1px solid var(--line-2);}
.li b{color:var(--ink);font-weight:700;}

/* 恢复入口 */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.pick{border-radius:var(--r-lg);border:1.5px solid var(--teal);background:var(--teal-soft);
  padding:17px 22px;display:flex;align-items:center;gap:15px;}
.pick.alt{border-color:var(--line-2);background:var(--surface);}
.pick .pi{flex:none;width:58px;height:58px;border-radius:var(--r-sm);background:var(--surface);
  display:flex;align-items:center;justify-content:center;}
.pick.alt .pi{background:var(--paper);}
.pick .pm{flex:1;min-width:0;}
.pick .pn{display:block;font-size:22px;font-weight:700;}
.pick .pd{display:block;margin-top:5px;font-size:17px;line-height:1.42;color:var(--ink-2);}
.pick .go{flex:none;font-size:18px;font-weight:700;color:var(--teal-d);}

/* 逃生口 */
.outs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.out{min-height:88px;border-radius:var(--r-md);border:1px dashed var(--line-2);background:var(--paper);
  padding:12px 20px;display:flex;align-items:center;gap:13px;}
.out .tx{flex:1;min-width:0;font-size:17px;line-height:1.38;color:var(--ink-2);}
.out .tx b{color:var(--ink);font-weight:700;display:block;font-size:19px;}
.out .go{flex:none;font-size:17px;font-weight:700;color:var(--teal-d);}

/* 主行动 */
.acts{flex:none;display:flex;gap:14px;}
.btn{flex:1;min-height:96px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  gap:10px;font-size:23px;font-weight:700;padding:0 14px;text-align:center;line-height:1.25;}
.btn.primary{flex:1.5;background:var(--teal);color:#fff;font-size:25px;letter-spacing:1px;}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink-2);}
.btn.demo{background:var(--paper);border:1.5px dashed var(--wheat);color:var(--wheat-d);font-size:20px;}

.demo-flag{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;
  background:var(--wheat-soft);border:1px solid var(--wheat);color:var(--wheat-d);font-size:17px;font-weight:700;}

/* ================= 目标设置工作台（target-context / target-profile 共用） ================= */
/* 六个合同字段在同一块工作台里点完。内容比一屏高，所以这一块**自己滚**，
   而摘要条和主行动固定在底部——滚动永远不会把主 CTA 推到底栏后面去。 */
.wb{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:14px;padding-right:14px;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;overscroll-behavior:contain;}
.wb::-webkit-scrollbar{width:10px;}
.wb::-webkit-scrollbar-track{background:transparent;}
.wb::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;}
.wb>.blk{flex:none;}
.wbtip{flex:none;display:flex;align-items:center;gap:9px;font-size:16px;line-height:1.35;color:var(--ink-3);
  padding:2px 4px;margin-top:-4px;}
.wbtip b{color:var(--ink-2);font-weight:700;}
/* 可滚动这件事要看得见：滚动区下缘留一条虚线，配合上面那句提示，
   不靠「滚动条会不会画出来」这种平台差异来传达。 */
.wb{border-bottom:1.5px dashed var(--line-2);padding-bottom:10px;}

/* 岗位类别格：19 类 + 「其他岗位」＝ 20 格，5 列 4 行，一格一类。
   两种「亮」分开看：aria-current＝这一类的具体职位面板正开着；aria-pressed＝这一项本身就是当前 targetJob。 */
.jcats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;grid-auto-rows:minmax(72px,auto);}
.jcat{border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 8px;
  font-size:19px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.24;}
.jcat .jk{flex:none;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.24);
  display:none;align-items:center;justify-content:center;}
.jcat[aria-current="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700;}
.jcat[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:700;}
.jcat[aria-pressed="true"] .jk{display:flex;}
.jcat.more{border-style:dashed;border-color:var(--line-2);color:var(--ink-3);}
.jcat.more[aria-current="true"]{border-style:solid;color:var(--teal-d);}
.jcat.more[aria-pressed="true"]{border-style:solid;color:#fff;}
.jcat.offc{border-style:dashed;border-color:var(--line-2);color:var(--ink-3);background:var(--paper);font-weight:600;}

/* 具体职位面板：类别点开之后就在同一块工作台里出现，不再翻页 */
.jpanel{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);
  padding:14px 18px 16px;display:flex;flex-direction:column;gap:11px;}
.jph{display:flex;align-items:baseline;gap:12px;}
.jph .t{font-size:21px;font-weight:700;}
.jph .h{font-size:17px;color:var(--ink-3);margin-left:auto;text-align:right;}
.jops{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;}
.chip.cat{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700;}
.chip.cat[aria-pressed="true"]{background:var(--teal);color:#fff;}
/* 长门类名不用省略号：整行 chip 直接换行显示完整名字，避免「信息传输、软件和信…」这种歧义 */
.chip.wrap{white-space:normal;text-align:center;line-height:1.24;padding:8px 16px;max-width:100%;}
/* 导航型 chip（去整屏门类表）：和「行业取值」长得不一样，免得被当成又一个可选门类 */
.chip.nav{border-style:solid;border-color:var(--line-2);background:var(--paper);color:var(--teal-d);font-weight:700;}
.jnote{font-size:17px;line-height:1.5;color:var(--ink-3);}
.jnote b{color:var(--ink-2);font-weight:700;}
.jhave{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:15px;
  background:var(--teal-soft);color:var(--teal-d);font-size:19px;font-weight:700;}
/* 还没点类别时：不摆空面板，摆这一步能做的两条路 */
.jempty{display:flex;flex-direction:column;gap:8px;}
.jempty .eh{font-size:20px;font-weight:700;}
.jempty .ed{font-size:17px;line-height:1.5;color:var(--ink-3);}
.jempty .ed b{color:var(--ink-2);font-weight:700;}
/* 「去岗位信息」逃生口：静态原型带不回岗位，就把带不回来这件事写在卡面上 */
.jrow{min-height:88px;border-radius:var(--r-md);border:1px dashed var(--line-2);background:var(--paper);
  padding:12px 20px;display:flex;align-items:center;gap:14px;}
.jrow .tx{flex:1;min-width:0;font-size:17px;line-height:1.4;color:var(--ink-3);}
.jrow .tx b{display:block;color:var(--ink);font-size:19px;font-weight:700;}
.jrow .tx i{font-style:normal;color:var(--ink-2);font-weight:700;}
.jrow .go{flex:none;font-size:17px;font-weight:700;color:var(--teal-d);}

/* 展开抽屉的表头（行业全表 / 专业与学历）：标题 + 一句现值 + 右侧展开按钮 */
.mh{display:flex;align-items:center;gap:12px;}
.mh .t{font-size:25px;font-weight:700;letter-spacing:.5px;}
.mh .h{font-size:18px;color:var(--ink-3);min-width:0;}
.mtog{margin-left:auto;flex:none;min-height:56px;display:inline-flex;align-items:center;gap:9px;padding:0 20px;
  border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface);
  font-size:18px;font-weight:700;color:var(--ink-2);}
.mtog[aria-expanded="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);}
/* 工作台里的行业整表：和 target-industry 整屏那张是同一份 20 门类，只是就地展开 */
.indsheet{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
.indsheet a{min-height:64px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  padding:8px 14px;display:flex;align-items:center;gap:11px;}
.indsheet a .cd{flex:none;width:34px;height:34px;border-radius:11px;background:var(--paper);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--ink-3);}
.indsheet a .nm{flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.24;}
.indsheet a[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);}
.indsheet a[aria-pressed="true"] .cd{background:var(--teal);border-color:var(--teal);color:#fff;}
.indsheet a[aria-pressed="true"] .nm{color:var(--teal-d);font-weight:700;}

/* 目标设置摘要条：六个合同字段两排看完，替掉原来那两张说明卡 */
.tsum{flex:none;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);
  padding:12px 20px 13px;display:flex;flex-direction:column;gap:9px;}
.tsh{display:flex;align-items:baseline;gap:12px;}
.tsh .t{font-size:20px;font-weight:700;}
.tsh .h{margin-left:auto;text-align:right;font-size:17px;color:var(--ink-3);}
.tsg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.ts-i{min-width:0;border-radius:14px;background:var(--paper);border:1px solid var(--line);padding:7px 12px;}
.ts-i .tk{display:block;font-size:15px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;}
/* 值不用省略号：长门类名换行写完，宁可高一点也不写成「信息传输、软件和信…」 */
.ts-i .tv{display:block;margin-top:2px;font-size:18px;font-weight:700;line-height:1.26;
  white-space:normal;overflow-wrap:anywhere;}
.ts-i.off{border-style:dashed;border-color:var(--line-2);}
.ts-i.off .tv{color:var(--ink-3);font-weight:600;}
.tsf{font-size:16px;line-height:1.45;color:var(--ink-3);}
.tsf b{color:var(--ink-2);font-weight:700;}
/* 旧 target-profile 地址落回同一工作台时的兼容说明 */
.compat{flex:none;display:flex;align-items:center;gap:13px;min-height:64px;padding:10px 20px;
  border-radius:var(--r-md);background:var(--slate-soft);border:1px solid #cfdcee;
  font-size:18px;line-height:1.4;color:var(--slate-d);}
.compat b{font-weight:700;}
/* 行业当前值那一行：长门类名换行写完，不做省略号 */
.lead.wrap{padding-top:10px;padding-bottom:10px;}
.lead.wrap .lv{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.26;}

/* ---------- 常在事实条 ---------- */
/* 三列不等宽：留存那一列要按账号态分开讲，比另外两列长，等分会让整条多出一行、
   把高度从主体身上刮走。给它 1.35，前两列 0.9，三列行数就齐了。 */
.truth{flex:none;padding:14px 44px 16px;border-top:1px solid var(--line);display:flex;gap:26px;background:var(--paper);}
.truth div{flex:.9;font-size:17px;line-height:1.5;color:var(--ink-3);}
.truth div:last-child{flex:1.35;}
.truth b{color:var(--ink-2);font-weight:700;}

/* ---------- 底部导航 128 ---------- */
.navbar{flex:none;height:128px;display:flex;background:var(--surface);border-top:1px solid var(--line);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;}
.nav-item .ni{font-size:21px;color:var(--ink-3);font-weight:600;}
.nav-item.on .ni{color:var(--teal-d);}
.nav-item.on::before{content:"";position:absolute;top:0;width:56px;height:6px;border-radius:0 0 6px 6px;background:var(--teal);}

/* ---------- 原型演示控制：默认不渲染，仅 debug=1 注入 ---------- */
.demo-tab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;
  background:rgba(11,36,30,.88);color:#2ee6a8;border-radius:0 14px 14px 0;
  writing-mode:vertical-lr;letter-spacing:4px;font-size:15px;font-weight:700;padding:18px 8px;}
.demo-panel{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;display:none;
  background:rgba(11,36,30,.96);border-radius:0 18px 18px 0;padding:14px 12px;
  flex-direction:column;gap:5px;box-shadow:8px 0 32px rgba(0,0,0,.3);max-height:1840px;overflow:auto;}
.demo-panel.show{display:flex;}
.demo-panel .dp-t{color:#2ee6a8;font-size:13px;font-weight:700;letter-spacing:2px;margin:6px 0 2px;}
.demo-panel a{display:block;color:#f2efe4;font-size:14px;padding:6px 12px;border-radius:9px;
  background:rgba(255,255,255,.06);white-space:nowrap;}
.demo-panel a.on{background:rgba(46,230,168,.22);color:#2ee6a8;font-weight:700;}

/* ---------- 文件预览：同一 route 内的看文件主内容 ---------- */
/* 这一层是「先看清楚这一份到底是什么」的主内容，不是缩略图：占满舞台，
   工具条（.pv-head / .pv-bar / .pv-foot）与正文（.pv-view）是并排的 flex 段，
   永远不会盖在文件上；所有控件 ≥88px，主行动 ≥96px。
   画出来的页面是**固定演示图形**，只在 capture=1 / debug=1 下出现并标注；
   普通地址一律不画任何文件内容（fail closed）。 */
.pv-scrim{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:80;
  background:rgba(11,36,30,.82);padding:20px;display:flex;}
.pv-shell{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;
  border-radius:32px;background:var(--paper);border:1px solid var(--line-2);}

.pv-head{flex:none;display:flex;align-items:center;gap:16px;padding:16px 22px;
  background:var(--surface);border-bottom:1px solid var(--line);}
.pv-fi{flex:none;width:72px;height:72px;border-radius:22px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.pv-fm{flex:1;min-width:0;}
.pv-fn{display:block;font-size:26px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pv-fs{display:block;margin-top:4px;font-size:18px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pv-demo{flex:none;display:inline-flex;align-items:center;gap:9px;min-height:56px;max-width:330px;
  padding:0 18px;border-radius:16px;background:var(--wheat-soft);border:1px solid var(--wheat);
  color:var(--wheat-d);font-size:18px;font-weight:700;line-height:1.32;}
.pv-close{flex:none;width:88px;height:88px;border-radius:24px;border:1.5px solid var(--line-2);
  background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink-2);}

/* .pv-view 是**真实滚动容器**：放大后用手指直接拖，不做 transform 假平移。
   一体机是触控屏，滚动条既不是这里的操作方式，又会让 clientWidth 随内容跳动，
   所以隐藏滚动条、保留真实滚动。 */
/* 台面刻意压深：白页放在深色台面上才读得出「这是一页纸」，
   旋转 / 整图时上下的留白是**版面边界**，不是没排满的空版。 */
.pv-stage{flex:1;min-height:0;position:relative;background:#7d8a84;}
.pv-view{position:absolute;inset:0;overflow:auto;display:flex;padding:18px;
  touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none;}
.pv-view::-webkit-scrollbar{width:0;height:0;display:none;}
/* 能拖才给拖的手势：不能平移时不摆一个「可以拖」的光标。 */
.pv-view[data-pannable="1"]{cursor:grab;}
.pv-view.grabbing{cursor:grabbing;user-select:none;-webkit-user-select:none;}
.pv-canvas{flex:none;margin:auto;position:relative;background:#fff;border:1px solid #5f6b66;}
/* 基线：页面整块铺满画布内框——手机冻结面走的就是这一条，和施工前一个字不差。
   本机 / U 盘要转方向，由内联样式补 left/top + 宽高 + 负 margin + rotate 覆盖成中心定位。 */
.pv-pg{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}
.pv-ln{display:block;background:#b0aa9c;border-radius:3px;}
.pv-ln.hd{background:#6f6a5e;}
.pv-ln.sub{background:#8d887b;}
/* 页内标注固定字号，不随缩放缩小：任何倍率下「这是演示图形」都要读得清。 */
.pv-wm{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-16deg);
  text-align:center;font-size:30px;font-weight:800;letter-spacing:4px;color:rgba(158,83,48,.28);}
.pv-pgno{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:20px;
  font-weight:700;color:var(--ink-3);}
/* 页码浮层贴着画布底缘。rot=0 时它落在页面自己的下白边上，读得清；一旦整页旋转，底缘就可能换成
   页眉黑条（180° 时正是它）或纸张侧边 —— 深字压深底不但读不出，还会盖住页内自证文字。所以只在
   旋转态给它一层浅色底衬。冻结的手机通道 pvRot 恒为 0，这条规则对它永不命中，冻结面逐字节不变。 */
.pv-canvas[data-rot="90"] .pv-pgno,.pv-canvas[data-rot="180"] .pv-pgno,
.pv-canvas[data-rot="270"] .pv-pgno{left:50%;right:auto;transform:translateX(-50%);
  padding:5px 18px;border-radius:14px;background:rgba(247,245,238,.94);color:var(--ink-2);}
.pv-img{display:block;object-fit:contain;position:absolute;left:50%;top:50%;}
/* 渲染出来的 PDF 页：和扫描件整页走同一套定位与 contain，宁可上下留白也不拉伸变形 */
.pv-pgimg{display:block;object-fit:contain;position:absolute;left:50%;top:50%;background:#fff;}
.pv-hint{position:absolute;left:20px;bottom:20px;display:inline-flex;align-items:center;gap:9px;
  min-height:52px;padding:0 18px;border-radius:16px;background:rgba(11,36,30,.86);color:#f2efe4;
  font-size:18px;font-weight:700;pointer-events:none;}

.pv-panel{flex:1 1 auto;align-self:stretch;min-height:0;min-width:0;display:flex;flex-direction:column;gap:16px;
  justify-content:flex-start;border-radius:26px;border:1px solid #5f6b66;
  background:var(--surface);padding:26px 28px;}
.pv-pt{display:flex;align-items:center;gap:18px;}
.pv-pi{flex:none;width:88px;height:88px;border-radius:26px;background:var(--paper);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.pv-ph{font-size:30px;font-weight:800;line-height:1.28;}
.pv-pb{font-size:20px;line-height:1.6;color:var(--ink-2);}
.pv-pb b{color:var(--ink);font-weight:700;}
/* 看不了内容的时候，把「关于这一份确实知道的东西」摆全 —— 这不是填充版面，
   是这一刻最该给的信息：它是哪一份、多大、从哪来、这次拿它做什么、还在不在本次办理里。 */
.pv-kv{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px 24px;
  padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.pv-kv .mk{display:block;font-size:16px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;}
.pv-kv .mv{display:block;margin-top:4px;font-size:19px;font-weight:600;line-height:1.32;
  overflow:hidden;text-overflow:ellipsis;}
.pv-kv .mv em{font-style:normal;font-size:16px;font-weight:400;color:var(--ink-3);}
/* 剩余高度进卡片本身，并让卡内内容垂直居中：撑开的是卡，不是文字之间的空档。
   一列四张宽卡（和本页 .picks 一个路子），比两列高卡在竖屏上更耐看也更好点。 */
.pv-alt{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr;gap:12px;grid-auto-rows:1fr;}
.pv-alt-c{border-radius:22px;border:1.5px solid var(--line);background:var(--paper);
  padding:14px 22px;display:flex;align-items:center;gap:20px;}
.pv-alt-c .pi{flex:none;width:62px;height:62px;border-radius:20px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;}
.pv-alt-c.mute .pi{background:var(--paper);border:1px solid var(--line-2);}
.pv-alt-c .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.pv-alt-c .n{font-size:21px;font-weight:700;line-height:1.3;}
.pv-alt-c .d{font-size:18px;line-height:1.5;color:var(--ink-2);}
.pv-alt-c .d b{color:var(--ink);font-weight:700;}
.pv-alt-c .g{flex:none;max-width:230px;font-size:17px;font-weight:700;color:var(--teal-d);line-height:1.35;}
.pv-alt-c.mute{border-style:dashed;border-color:var(--line-2);background:var(--surface);}
.pv-alt-c.mute .n{color:var(--ink-2);}
.pv-alt-c.mute .g{color:var(--ink-3);}

.pv-bar{flex:none;display:flex;flex-direction:column;gap:14px;padding:16px 22px;
  background:var(--surface);border-top:1px solid var(--line);}
.pv-row{display:flex;align-items:center;gap:12px;}
.pv-btn{flex:none;min-height:88px;min-width:88px;padding:0 20px;border-radius:22px;
  border:1.5px solid var(--line-2);background:var(--paper);display:inline-flex;align-items:center;
  justify-content:center;gap:10px;font-size:21px;font-weight:700;color:var(--ink-2);}
.pv-btn[aria-current="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);}
.pv-btn.off{border-style:dashed;color:var(--ink-3);opacity:.62;}
.pv-ind{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;}
/* 「看哪一页」和「朝哪个方向」是两件事，同一行里用一道细线分开。 */
.pv-sep{flex:none;width:1px;height:56px;background:var(--line-2);border-radius:1px;}

.pv-foot{flex:none;display:flex;flex-direction:column;gap:12px;padding:16px 22px 20px;
  background:var(--paper);border-top:1px solid var(--line);}
.pv-note,.pv-facts,.pv-truth{font-size:19px;line-height:29px;}
.pv-note{color:var(--ink-2);}
.pv-facts{color:var(--ink-2);}
.pv-truth{color:var(--ink-3);}
.pv-note b,.pv-facts b,.pv-truth b{color:var(--ink);font-weight:700;}
.pv-acts{display:flex;gap:14px;}
.pv-act{flex:1;min-height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  gap:10px;font-size:22px;font-weight:700;padding:0 14px;text-align:center;line-height:1.25;
  background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink-2);}
.pv-act.pri{flex:1.4;background:var(--teal);color:#fff;border-color:transparent;font-size:24px;}
/* 文件卡上的「查看内容」：和状态徽章同一行，不给文件卡增高。 */
.fb.view{background:var(--teal-soft);color:var(--teal-d);min-height:56px;border:1px solid var(--teal);}

<script>
(function(){
'use strict';

/* ================= 舞台与时钟 ================= */
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);
  document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',fit);

/* ================= 参数白名单归一：任何非法取值都不上屏 ================= */
var Q=new URLSearchParams(location.search);
var DEBUG=Q.get('debug')==='1';
var FLAT=Q.get('flat')==='1';
var CAPTURE=Q.get('capture')==='1';
if(FLAT){document.documentElement.classList.add('flat');document.documentElement.setAttribute('data-flat','1');}

function tick(){
  var t='10:24';
  if(!CAPTURE){var d=new Date();t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  document.getElementById('clock').textContent=t;
}
tick();if(!CAPTURE)setInterval(tick,20000);

var STATES=[
  'source','target','target-context','target-profile','target-industry','summary',
  'usb-wait','usb-detecting','usb-list','usb-empty','usb-read-failed','usb-unavailable',
  'usb-agent-offline','usb-selected','usb-importing','usb-import-failed','usb-ready',
  'local-guide','local-picking','local-cancelled','local-selected','local-rejected',
  'local-oversize','local-unreadable','local-ready',
  'phone-generating','phone-gen-failed','phone-ready','phone-waiting','phone-status-unknown',
  'phone-expired','phone-uploaded','phone-confirm-failed',
  'phone-cancelling','phone-cancelled','phone-cancel-failed',
  'uploading','upload-failed','parsing','parse-failed','missing-file','unknown',
  /* 本轮新增：扫描交接（来自 /scan/result 的既有交接，不是第四张来源卡）与两条
     「结果未知」支线。未知结果不允许再发一次请求，只能按同一个请求标识再查一次。 */
  'scan-ready','scan-expired','scan-unavailable','scan-failed',
  'upload-unknown','upload-rechecking','parse-unknown','parse-rechecking'
];
var rawState=Q.get('state');
var state=STATES.indexOf(rawState)>=0?rawState:((rawState===null||rawState==='')?'source':'unknown');

/* 撤销上传会话这条支线：从哪一步来（决定回显什么上下文）、为什么撤（决定撤成功之后给什么出口）。
   两个都是受控白名单，非法值归一，不回显原始参数。 */
var CANCEL_STATES=['phone-cancelling','phone-cancelled','phone-cancel-failed'];
var PHONE_FROM=['phone-ready','phone-waiting','phone-status-unknown','phone-uploaded','phone-confirm-failed'];
var from=PHONE_FROM.indexOf(Q.get('from'))>=0?Q.get('from'):'phone-ready';
var why=Q.get('why')==='refresh'?'refresh':'leave';
/* 账号态是受控演示 fixture，不是真实登录态：原型不知道也不假装知道你登录没有。 */
var ACCT=Q.get('acct')==='member'?'member':'guest';
var MEMBER=ACCT==='member';

/* ---- 文件预览（同一 route 内的视图状态，不新增路由）----
   preview=1 打开看文件层；pp / pz / pr 是页码 / 缩放 / 方向；pv 是三种**预览侧**的失败。
   全是白名单，非法取值一律归一，且不回显原始参数。默认值不进地址栏。
   ★ pv 只描述「预览这一次没成功」，和上传失败是两件事：上传失败在 upload-failed，
     预览失败不改变文件是否已经在本次办理里。 */
var PV_ZOOMS=['page','width','200','300'];
var PV_ROTS=['0','90','180','270'];
var PV_FAILS=['unavailable','expired','render'];
var previewOpen=Q.get('preview')==='1';
var pvZoom=PV_ZOOMS.indexOf(Q.get('pz'))>=0?Q.get('pz'):'page';
var pvRot=PV_ROTS.indexOf(Q.get('pr'))>=0?Q.get('pr'):'0';
var pvFail=PV_FAILS.indexOf(Q.get('pv'))>=0?Q.get('pv'):'';
var pvPageRaw=parseInt(Q.get('pp'),10);
/* 演示文件下标：U 盘那三份里选中的是哪一份（PDF / 旧版 PDF / 扫描图）。 */
var fileIdx=/^[0-2]$/.test(String(Q.get('f')))?String(Q.get('f')):'0';
/* 本机目录里**能收**的那两份里选中的是哪一份（DOCX / PDF）。
   ★ 这是独立白名单，不复用 U 盘的 f：两条通道的下标各管各的，一条的选择不会串到另一条上。
   它从 local-picking 点下去那一刻确定，一路带到 local-selected / local-ready / summary
   和预览层；中途没有任何一步会把它顶回「默认那一份」——你选的是哪一份，是这次办理的事实，
   不是页面的默认值。 */
var localIdx=/^[01]$/.test(String(Q.get('lf')))?String(Q.get('lf')):'0';
/* 画不画演示页面只看这一个开关：普通地址一律不画文件内容。 */
var PV_FIXTURE=CAPTURE||DEBUG;

var intent=Q.get('intent')==='optimize'?'optimize':'diagnose';   /* 非法一律归一为 diagnose */
var mode=Q.get('mode')==='generic'?'generic':'focus';            /* generic = 切换为通用诊断 */

/* 来源：通道状态自带来源；其余状态从 ?source= 读，非法值丢弃 */
var SRC_KEYS=['usb','local','phone','scan'];
var rawSource=Q.get('source');
var source=SRC_KEYS.indexOf(rawSource)>=0?rawSource:'';
if(state.indexOf('usb-')===0)source='usb';
else if(state.indexOf('local-')===0)source='local';
else if(state.indexOf('phone-')===0)source='phone';
else if(state.indexOf('scan-')===0)source='scan';

/* 需要「已经拿到一份文件」的状态：没有来源就 fail-closed 到 missing-file，
   对齐 ResumeSourcePage「没有 file 不放行 /resume/parse」这条硬约束。 */
/* 本轮新增的「结果未知 / 按同一标识再查」四态**不进手机通道**：手机通道是本轮的冻结面，
   新增行为一律 gate 出 source=phone，不靠「看起来差不多」蒙混。手机通道自己已经有
   phone-status-unknown 表达「状态读不到」，那一条一项没减。
   手写地址硬凑这个组合时不假装能显示：来源清空 → 下面的 NEEDS_FILE 直接 fail-closed。 */
var UNKNOWN_STATES=['upload-unknown','upload-rechecking','parse-unknown','parse-rechecking'];
if(UNKNOWN_STATES.indexOf(state)>=0&&source==='phone')source='';

var NEEDS_FILE=['summary','uploading','upload-failed','parsing','parse-failed',
  'upload-unknown','upload-rechecking','parse-unknown','parse-rechecking'];
if(NEEDS_FILE.indexOf(state)>=0&&!source)state='missing-file';

/* ---- 手机扫码通道的查看器：冻结面 ----
   本轮给查看器新增的方向组（向左转 / 向右转 / 正向）、工具条分隔符和指针拖拽，
   一律不进 source==='phone' 这条分支：手机通道的入口、二维码、状态、文案和查看器
   在本轮之前长什么样、怎么动，现在就还是那样。
   既然这条分支没有方向控件，pr 就不该在这里生效——归一为 0，既不重排版式，也不回显原始参数。
   注意冻结的是**本轮新增的能力**，不是既有能力：.pv-view 仍是真实滚动容器，
   touch-action 一个字没动，手机通道放大后照样能用手指滑。 */
var PV_FROZEN=source==='phone';
if(PV_FROZEN)pvRot='0';

/* 固定 6 维（RESUME_SCORING_DIMENSIONS），默认 3 项 */
var DIMS=[
  {k:'basic',n:'基础信息完整度'},{k:'objective',n:'求职目标清晰度'},{k:'experience',n:'经历表达清晰度'},
  {k:'quantification',n:'成果量化程度'},{k:'keyword',n:'岗位关键词覆盖'},{k:'readability',n:'版式与可读性'}
];
var DIM_KEYS=DIMS.map(function(d){return d.k;});
var DEF_DIMS='keyword,quantification,experience';
var dims=(Q.get('dims')===null?DEF_DIMS:Q.get('dims')).split(',').filter(function(k){return DIM_KEYS.indexOf(k)>=0;});
dims=dims.filter(function(k,i){return dims.indexOf(k)===i;});
if(!dims.length)dims=DEF_DIMS.split(',');

/* GB/T 4754-2017 的 20 个行业门类；送后端的是中文 label，A–T 只作视觉锚点 */
var SECTORS=[
  ['A','农、林、牧、渔业'],['B','采矿业'],['C','制造业'],['D','电力、热力、燃气及水生产和供应业'],
  ['E','建筑业'],['F','批发和零售业'],['G','交通运输、仓储和邮政业'],['H','住宿和餐饮业'],
  ['I','信息传输、软件和信息技术服务业'],['J','金融业'],['K','房地产业'],['L','租赁和商务服务业'],
  ['M','科学研究和技术服务业'],['N','水利、环境和公共设施管理业'],['O','居民服务、修理和其他服务业'],
  ['P','教育'],['Q','卫生和社会工作'],['R','文化、体育和娱乐业'],['S','公共管理、社会保障和社会组织'],
  ['T','国际组织']
];
var SECTOR_LABELS=SECTORS.map(function(s){return s[1];});
var NO_INDUSTRY='暂不指定';
/* 常见行业只是编辑排序，不是推荐、不是热度，也不预选 */
var COMMON_SECTORS=['制造业','信息传输、软件和信息技术服务业','批发和零售业','教育','卫生和社会工作','建筑业'];

/* ---- 目标岗位：两级点选（岗位类别 → 该类常见职位）----
   为什么从 12 个宽泛大类改成两级：宽泛大类在一体机上等于「没得选」——现场问得最多的是
   「护理员」「叉车司机」「收银员」这种具体职位名，而不是「医护照料」「物流仓储」。
   两级仍然只是**编辑好的常见取值**：不是岗位库、不是推荐、不是热度，也不代表
   这台机器有对应岗位。无论点的是类别还是具体职位，写进去的都只是后端那一个
   自由文本字段 targetJob（服务端 MaxLength 80），**没有新增任何接口不认识的字段**：
   没有 jobId、没有 JD、没有城市 / 薪资 / 工作性质。
   类别名一律 4 字以内，好在 5 列格子里排得下；具体职位控制在 7-11 个。 */
var JOBCATS=[
 {k:'tech',n:'技术研发',j:['前端开发','后端开发','移动端开发','测试工程师','运维工程师','网络工程师','数据分析','算法工程师','嵌入式/硬件','技术支持','IT 实施']},
 {k:'product',n:'产品',j:['产品经理','产品助理','项目经理','需求分析','用户研究','数据产品','产品运营']},
 {k:'ops',n:'运营',j:['内容运营','新媒体运营','用户运营','活动运营','电商运营','社群运营','直播运营','店铺运营']},
 {k:'sales',n:'销售',j:['销售代表','销售助理','大客户销售','电话销售','渠道销售','门店销售','房产经纪','保险顾问','汽车销售','销售主管']},
 {k:'market',n:'市场公关',j:['市场专员','品牌策划','市场推广','商务拓展','公关专员','会展策划','广告投放','文案策划']},
 {k:'hr',n:'行政人事',j:['人事专员','招聘专员','薪酬绩效','员工关系','培训专员','行政专员','前台文员','后勤管理','人事助理']},
 {k:'fin',n:'财务会计',j:['会计','出纳','财务助理','成本会计','审计专员','税务专员','统计员','银行柜员','财务主管']},
 {k:'cs',n:'客户服务',j:['客服专员','在线客服','电话客服','售后服务','呼叫中心','投诉处理','客户维护','客服主管']},
 {k:'design',n:'设计创意',j:['平面设计','UI 设计','室内设计','装潢设计','服装设计','美工','插画/原画','工业设计','家具设计']},
 {k:'mfg',n:'生产制造',j:['普工/操作工','装配工','质检员','生产管理','设备维修','工艺工程师','电工','焊工','注塑/冲压','车间主管']},
 {k:'logi',n:'物流仓储',j:['快递员','配送员','仓库管理员','理货分拣','叉车司机','货车司机','物流专员','跟单员','单证员']},
 {k:'retail',n:'零售餐饮',j:['店员/导购','收银员','店长','储备店长','服务员','厨师','后厨帮工','面点烘焙','咖啡调饮','餐饮领班']},

var WORKBENCH_STATES=['target-context','target-profile','target-industry'];

var PV_KEYS=['preview','pp','pz','pr','pv'];
var PV_DEFAULTS={preview:'',pp:'1',pz:'page',pr:'0',pv:''};
function url(over){

    industry:industry,job:job,cat:cat,ind:ind,more:more,exp:exp,scene:scene,major:major,degree:degree,

  Object.keys(over).forEach(function(k){next[k]=over[k];});

     ?job=前端开发 这种短地址打开时照样能把对应类别的面板展开。 */

  /* 展开状态只对目标设置工作台有意义；离开这三个 state 就不带走，免得地址栏挂着无效上下文。 */
  if(WORKBENCH_STATES.indexOf(next.state)<0){next.cat='';next.ind='';next.more='';}
  /* target-profile 是**兼容落地面，不是可停留的状态**：在这一页上点任何一项，
     都归一到 canonical 的 target-context，并把「专业与学历」的展开状态带过去。
     否则兼容说明会一直挂在头上，用户以为自己还在那个已经不存在的独立页。 */
  if(next.state==='target-profile'&&over.state===undefined){next.state='target-context';next.more='1';}
  var st=next.state;
  var derived=st.indexOf('usb-')===0||st.indexOf('local-')===0||st.indexOf('phone-')===0||st.indexOf('scan-')===0;
  var p=new URLSearchParams();
  p.set('state',st);
  if(!derived&&next.source)p.set('source',next.source);
  Object.keys(DEFAULTS).forEach(function(k){if(next[k]&&next[k]!==DEFAULTS[k])p.set(k,next[k]);});

  if(CANCEL_STATES.indexOf(st)>=0){p.set('from',next.from);p.set('why',next.why);}
  PV_KEYS.forEach(function(k){
    var v=over[k];
    if(v===undefined||v===null||v===''||String(v)===PV_DEFAULTS[k])return;

}

/* 直传（U 盘 / 本机）＝ POST /files/kiosk-upload，带会员 token 时**上传当场**绑定 endUserId；
   手机扫码 ＝ upload-sessions，mode=member 要在一体机 confirm 之后才 bindMemberFile。
   未登录一律 system_short，高敏文件 TTL = 1 小时。 */
function retentionValue(src){
  if(!MEMBER)return '临时上传 · 1 小时后清理';
  /* 扫描件的归属在**建立扫描会话那一刻**就定了（18-scan-workbench：匿名会话产生的扫描件
     不挂账号，事后登录也不追溯）。本页没有那一刻的状态，所以不冒充知道。 */
  if(src==='scan')return '归属在建扫描会话时已定 · 本页读不到';
  return src==='phone'?'一体机确认后绑定账号 · 默认 90 天':'上传当场绑定账号 · 默认 90 天';
}
function retentionNote(src){
  /* 未登录也要分通道说：直传通道登录之后确实会把它存进账号，扫描件不会 ——
     扫描件的归属在**建立扫描会话那一刻**就定了，现在或事后登录都不追溯。 */
  if(!MEMBER)return src==='scan'
    ? '未登录：不进账号、不归档；归属在建扫描会话那一刻已定，现在登录也不追溯'
    : '未登录：不进账号、不归档；登录后这条通道才会把它存进你的账号';
  if(src==='scan')return '匿名会话的扫描件不因登录而追溯归档；本页读不到那一刻的结果';
  return src==='phone'
    ? '只传不确认不会自动归档；确认后可在「我的文档」改到 180 天（需同意保存条款）或删除'
    : '可在「我的文档」改到 180 天（需同意保存条款）或删除；原始文件不支持永久保存';
}
/* 文件卡格子和确认行里只放一句短的，长版留给账号条，避免把说明堆进文件信息里 */
function retentionTag(src){
  if(!MEMBER)return '不进账号';
  if(src==='scan')return '登录也不追溯';
  return src==='phone'?'未确认不归档 · 可改 180 天':'可改 180 天或删除';
}

/* 通道条：只放这一步**真的存在**的动作。
   busy —— 导入 / 上传 / 解析 / 撤销这几步在真实实现里没有 abort、没有取消端点，
   所以这里挂的是标签不是按钮；点得动的「取消」等于承诺一件做不到的事。
   revoke —— 手机通道唯一真实的取消：DELETE /upload-sessions/:sessionId。 */
function trackBar(step,tone,opts){
  opts=opts||{};

    right='<a class="tbtn m-press" href="'+opts.revoke.href+'"'+rt()+' data-testid="rs-revoke">'+opts.revoke.n+'</a>';
  }else{

/* compact：等待态（上传中 / 解析中）只留「这次到底在办什么」的四行。
   六行在等待页上是说明墙，而且会把主行动挤出主体。 */
function taskRows(compact){
  var rows=[
    {k:'这次要做',v:INTENT_COPY[intent].n+'<em>　'+INTENT_COPY[intent].d+'</em>'},
    {k:'诊断范围',v:(mode==='generic'?'通用诊断':'定向诊断')+'<em>　报告固定输出 6 个维度，这里只改建议关注顺序</em>'},
    {k:'重点维度',v:dimText()},
    {k:'目标背景',v:ctxText()+'<em>　只作为本人简历表达的重点参考</em>'},
    {k:'文件来源',v:SRC_LABEL[source]+'<em>　原件只读不改，仍在你自己的设备里</em>'},
    {k:'保存期限',v:retentionValue(source)+'<em>　'+(compact?retentionTag(source):retentionNote(source))+'</em>'}
  ];
  return compact?rows.filter(function(r){return r.k!=='诊断范围'&&r.k!=='目标背景';}):rows;
}

/* 通用 chip 组 */
function chipGroup(key,lb,list,cur,clearable,tid){
  var ops=list.map(function(o){
    var over={};over[key]=(cur===o&&clearable)?'':o;
    return '<a class="chip m-press" href="'+url(over)+'"'+rt()+' aria-pressed="'+(cur===o)+'">'+o+'</a>';
  }).join('');
  var clear='';
  if(clearable){
    var c={};c[key]='';
    clear='<a class="chip mute m-press" href="'+url(c)+'"'+rt()+' aria-pressed="'+(!cur)+'">不填</a>';
  }
  return '<div class="grp" data-testid="'+tid+'"><span class="lb">'+lb+'</span><span class="ops">'+clear+ops+'</span></div>';
}
function escapeHTML(value){
  return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
/* 手填兜底：只有 targetJob / major 两个自由文本字段用得上，各自的上限**按服务端 DTO 分开**
   （targetJob 80 / major 40），不共用一个数。回显一律走 escapeHTML，不回显原始 query。 */
var MANUAL_MAX={job:JOB_MAX,major:MAJOR_MAX};
function manualField(key,lb,cur,placeholder,tid){
  var max=ownHas(MANUAL_MAX,key)?MANUAL_MAX[key]:MAJOR_MAX;
  return '<div class="grp" data-testid="'+tid+'"><span class="lb">'+lb+'</span><span class="ops">'+
    '<span class="manual-entry"><input type="text" maxlength="'+max+'" value="'+escapeHTML(cur)+'" placeholder="'+escapeHTML(placeholder)+'" '+
      'aria-label="'+escapeHTML(lb)+'手动填写" data-manual-input="'+key+'">'+
    '<button type="button" class="m-press" data-manual-apply="'+key+'">应用</button>'+
    (cur?'<button type="button" class="manual-clear m-press" data-manual-clear="'+key+'">清空</button>':'')+
    '</span></span></div>';
}
/* 截断显示用：只用于**已经归一过**的值（当前选中项、当前摘要标题），不用于原始 query。 */
function cut(s,n){s=String(s===null||s===undefined?'':s);return s.length>n?s.slice(0,n)+'…':s;}
/* 通用诊断下的只读镜像：把同样这四组原样列出来并标明都不参与。
   不做成「能点但没效果」的假控件，所以这里是 span 不是链接。 */
function offGroup(lb,list,tid){
  return '<div class="grp" data-testid="'+tid+'"><span class="lb">'+lb+'</span><span class="ops">'+
    '<span class="chip now">暂不指定</span>'+
    list.map(function(o){return '<span class="chip mute">'+o+'</span>';}).join('')+'</span></div>';
}

/* ================= 目标设置工作台（target-context，target-profile 兼容落回） =================
   一块工作台点完六个合同字段：行业 / 目标岗位 / 经验 / 求职场景 / 专业 / 学历。
   之前是「目标背景（上）」再翻一页「目标背景（下）」，为两项选填多走一整屏；
   现在专业与学历改成**同一页里的展开状态**，行业 20 门类也能就地展开，
   旧的 state=target-profile 地址仍然打得开，落回的就是这一块工作台并把那两项展开
   —— 不是另一套页面，也没有第二份设计，更没有第二个 HTML。
   合同一个字没动：仍然只有 industry / targetJob / experience / scene / major / degree
   六项（外加通用诊断的 skipped），**没有城市、薪资、工作性质、证书、语言、JD、jobId**。
   内容比一屏高，所以工作台自己滚；摘要条和主行动固定在底部，滚动不会挡住主 CTA。 */

/* 岗位类别格：19 类 + 「其他岗位」= 20 格。
   aria-current = 这一类的具体职位面板正开着；aria-pressed = 这一项本身就是当前 targetJob。 */
function jobCatGrid(){
  return '<div class="jcats" data-testid="rs-job-cats">'+
    JOBCATS.map(function(c){
      return '<a class="jcat m-press" href="'+url({cat:c.k})+'"'+rt()+
        ' aria-current="'+(cat===c.k)+'" aria-pressed="'+(job===c.n)+'" data-testid="rs-jobcat-'+c.k+'">'+
        '<span class="jk">'+svg(I_CHECK,15,'currentColor',3)+'</span>'+c.n+'</a>';
    }).join('')+
    '<a class="jcat more m-press" href="'+url({cat:CAT_KEY_OTHER})+'"'+rt()+
      ' aria-current="'+(cat===CAT_KEY_OTHER)+'" aria-pressed="'+(jobKind==='custom')+'"'+
      ' data-testid="rs-jobcat-other"><span class="jk">'+svg(I_CHECK,15,'currentColor',3)+'</span>其他岗位</a>'+
    '</div>';
}
/* 通用诊断下的只读镜像：同样 20 格原样列出来并标明都不参与。
   不做成「能点但没效果」的假控件，所以这里是 span 不是链接。 */
function jobCatGridOff(){
  return '<div class="jcats" data-testid="rs-ctx-off-job">'+
    CAT_LABELS.concat(['其他岗位']).map(function(n){
      return '<span class="jcat offc">'+n+'</span>';
    }).join('')+'</div>';
}
/* 具体职位面板：点开类别之后就在同一块工作台里出现，不翻页。
   「其他岗位」这一格才出输入框 —— 键盘不是主路径，不主动弹给每一个用户。 */
function jobPanel(){
  if(cat===CAT_KEY_OTHER){
    var mine=(jobKind==='custom');
    return '<div class="jpanel" data-testid="rs-job-other">'+
      '<div class="jph"><span class="t">其他岗位 · 自己写一个</span>'+
        '<span class="h">上面 19 类里都没有合适的才用这里</span></div>'+
      manualField('job','其他岗位',mine?job:'','按你想投的职位名称写，例如：甜品师、行车调度员','rs-ctx-job-manual')+
      (mine?'<div class="jops"><span class="jhave" data-testid="rs-job-other-value">'+
        svg(I_CHECK,19,'currentColor',3)+'已填：'+escapeHTML(job)+'</span></div>':'')+
      '<p class="jnote">写完点<b>「应用」</b>才算数（已填过会多一个「清空」）。'+
      '最长 <b>'+JOB_MAX+'</b> 字，会去掉首尾空格、不可见字符和 <b>&lt; &gt; " \' \\</b> 这几个符号；'+
      '存进去的仍然只是<b>目标岗位这一个自由文本字段</b>，不会顺手多收别的信息。</p>'+
      '</div>';
  }
  var c=ownHas(CAT_BY_KEY,cat)?CAT_BY_KEY[cat]:null;
  if(!c){
    return '<div class="jpanel" data-testid="rs-job-empty">'+
      '<div class="jempty"><span class="eh">先点上面任意一个岗位类别</span>'+
      '<span class="ed">点开之后这里会列出<b>这一类常见的具体职位</b>，点一个就选中；'+
      '也可以只用类别本身，或者点<b>「其他岗位」</b>自己写一个。'+
      '这一项<b>不填也能'+INTENT_COPY[intent].verb+'</b>。</span></div></div>';
  }
  var legacy=(jobKind==='legacy'&&catOfJob(job)===cat)
    ? '<p class="jnote">当前用的是旧版大类取值<b>「'+escapeHTML(job)+'」</b>，继续用没问题；'+
      '想更具体，点上面任意一个职位就会换过去。</p>' : '';
  return '<div class="jpanel" data-testid="rs-job-panel">'+
    '<div class="jph"><span class="t">'+c.n+' · 常见职位</span>'+
      '<span class="h">'+c.j.length+' 个常见取值 · 点一个就选中</span></div>'+
    '<div class="jops">'+
      '<a class="chip cat m-press" href="'+url({job:c.n})+'"'+rt()+' aria-pressed="'+(job===c.n)+'">整类：'+c.n+'</a>'+
      c.j.map(function(x){
        return '<a class="chip m-press" href="'+url({job:x})+'"'+rt()+' aria-pressed="'+(job===x)+'">'+escapeHTML(x)+'</a>';
      }).join('')+
      '<a class="chip mute m-press" href="'+url({job:''})+'"'+rt()+' aria-pressed="'+(!job)+'">暂不指定</a>'+
    '</div>'+legacy+'</div>';
}

    '<span class="go">去岗位信息 →</span></a>';

function jobBlock(){

     这里阈值放到 30 字，常见职位名与手填岗位都写得全。 */
  var hint=job?('已选：'+escapeHTML(cut(job,30)))
              :(cat===CAT_KEY_OTHER?'在下面自己写一个，或留空不填'

    head('目标岗位',(intent==='optimize'?'优化按这个岗位的常用说法重写 · ':'先点类别，再点具体职位 · ')+hint)+
    jobCatGrid()+jobPanel()+jobsHintRow()+'</div>';

/* 摘要条：六个合同字段两排看完，替掉原来那两张说明卡 */
function ctxStrip(){
  var g=(mode==='generic');
  var cells=[
    ['目标岗位',g?'暂不指定':(job||'未选'),g||!job],

/* 展开类动作（行业全表 / 专业与学历）在链接末尾挂一个**一次性锚点** #ind / #more，

   —— 用户点一个岗位不会被莫名其妙拽到行业表那里去。
   位置用 getBoundingClientRect 相减算：.wb 不是定位元素，offsetTop 算出来不是内容偏移。 */
function wbAnchor(){
  var wb=root.querySelector('.wb');if(!wb)return;
  var map={'#ind':'rs-ind-sheet','#more':'rs-ctx-more'};
  var tid=map[location.hash]||(state==='target-profile'?'rs-ctx-more':'');
  if(!tid)return;
  var tgt=root.querySelector('[data-testid="'+tid+'"]');
  if(!tgt)return;
  wb.scrollTop=wb.scrollTop+(tgt.getBoundingClientRect().top-wb.getBoundingClientRect().top)-10;
}

/* ================= 撤销上传会话：DELETE /upload-sessions/:sessionId 的三态 =================
   真实合同：校验 controlToken → cleanupAbandonedFile（清未确认的临时文件）→ status=cancelled；
   已 confirmed 的会话返回 UPLOAD_SESSION_CONFIRMED，不能取消。
   所以「撤销中 / 已撤销 / 撤销未确认」必须都能上屏：撤销失败时页面**不能装作已经取消**，
   要把二维码或已收到的文件原样留在原来的状态，允许重试，并且**不签发新码**。 */
var FROM_LABEL={
  'phone-ready':'已出码，等你扫',
  'phone-waiting':'等手机把文件传上来',
  'phone-status-unknown':'这张码的状态读不到',
  'phone-uploaded':'手机已上传，等你在一体机确认',
  'phone-confirm-failed':'上一次确认没完成'
};
var FROM_HAS_FILE={'phone-uploaded':1,'phone-confirm-failed':1};
function fromHasFile(){return !!FROM_HAS_FILE[from];}
/* 撤销没拿到结果时，把用户原来那一步原样还回去：有文件就回显文件卡，只有码就回显码。 */
function phoneCtxEcho(headline,grow){
  var open='<div class="blk'+(grow?' grow':'')+' m-fade-in">'+head(headline,'仍停在「'+FROM_LABEL[from]+'」',true);
  if(fromHasFile())return open+fileCard('已收到 · 未确认','wait')+'</div>';
  return open+'<div class="qrwrap">'+qrBox(from==='phone-status-unknown'?'unk':'')+
    '<div class="qrside"><div class="card"><span class="qh">这张码还是刚才那一张</span>'+
    '<div class="qrp">本机<b>没有换掉它，也没有把它当成已作废</b>：这次撤销没有拿到服务端结果，'+
    '所以这张码<b>可能仍然有效</b>；手机上那一页要是还开着，<b>也可能还传得进来</b>。</div>'+
    '<div class="ticks"><span class="tick warn">'+svg(I_WARN,18,'currentColor',2)+'撤销结果未确认</span>'+
    '<span class="tick">会话上下文已保留</span></div>'+phoneRetentionLine()+'</div></div></div></div>';

/* ================= 扫描交接：/scan/result 交过来的那一份 =================
   这不是第四张来源卡 —— 来源选择里仍然只有 U 盘 / 本机文件 / 手机扫码三张卡，一张没多、
   位置一格没动。扫描是**别的流程办完之后交接到这里的一种落点**：
     apps/kiosk/src/pages/scan/ScanResultPage.tsx handleResumeAI()
       navigate('/resume/parse',{state:{source:'scan',fileId,file:{…}}})
     ResumeParsePage 只认 location.state.fileId，没有它就渲染「未找到简历文件」。
   身份靠 React router 的内存态携带，不进 URL、不进浏览器存储。静态原型没有那条内存通道，
   所以这里只把**身份**画出来（同一个 fileId、同一个文件名、同一个大小），并且每一屏都写清
   这一份不是本页取到的、本页也没有真的碰过扫描仪。
   本页对扫描仪不做任何断言：没说扫成功、没说纸走完、没说面板做了什么。 */
function outScan(){
  return '<a class="out m-press" href="18-scan-workbench.html" data-route="/scan/result" data-testid="rs-back-to-scan">'+
    svg(I_SCAN,26,'#3d5a52',2)+
    '<span class="tx"><b>回扫描工作台</b>重扫一份，或改扫描参数</span><span class="go">去扫描 →</span></a>';
}
/* 扫描交接条：形状和通道条一样，但右边的出口指回**清空来源**的来源选择页，
   不把 source=scan 挂在地址上带走。 */
function scanBar(step,tone,opts){
  opts=opts||{};
  var col=tone==='badt'?'#963227':(tone==='warnt'?'#8a6219':'#157a67');
  var right=opts.busy
    ? '<span class="tbtag" data-testid="rs-busy-tag">'+svg(I_CLOCK,18,'currentColor',2.2)+
      (opts.busyTag||'进行中 · 没有中止入口')+'</span>'
    : '<a class="tbtn m-press" href="'+url({state:'source',source:''})+'"'+rt()+
      ' data-testid="rs-switch-source">换一种来源</a>';
  return '<div class="track'+(tone?' '+tone:'')+'">'+
    '<span class="ti">'+svg(I_SCAN,26,col,2)+'</span>'+
    '<span class="tm"><span class="tn">扫描原件 · 由扫描工作台交接</span>'+
    '<span class="td">'+step+'</span></span>'+right+'</div>';
}

/* ================= 结果未知：不重发，只按同一个标识再查 =================
   已知失败和结果未知**不是一回事**，出口也不能一样：
     · 已知失败（upload-failed / parse-failed / scan-failed）——服务端明确没成，重来一次
       就是同一件事，所以可以放「重试」。
     · 结果未知——连接在等结果的时候断了，服务端**可能已经收下、也可能没有**。这时候再发
       一次请求，就有可能变成两份文件、两次计费、两条记录。所以这两态里**一个「再发一次」
       的入口都没有**，只能拿**同一个请求标识**去查这一次到底成没成。
   查询本身不改变服务端那一份的状态，也不签发结果：查完是什么就是什么，本页不预告。
   这两条支线 gate 出 source=phone —— 手机通道是本轮冻结面，它自己已经有
   phone-status-unknown 表达「状态读不到」。 */
var REQ_KEY={upload:'up_2f9c41d8',parse:'pr_7b1e05a4'};
function unknownRows(kind){
  var isUp=kind==='upload';
  return rowsCard([
    {k:'现在确定的',v:'本机<b>没有拿到这一次的结果</b><em>　等结果的时候连接断了</em>'},
    {k:'现在不确定的',v:'服务端到底<b>收没收下 / 办没办完</b><em>　本页不猜，也不按「大概率成功」显示</em>'},
    {k:'请求标识',v:'<b>'+REQ_KEY[kind]+'</b><em>　原型演示数据；再查只用这一个标识，不换新的</em>'},
    {k:'为什么不重发',v:'重发可能变成<b>两份'+(isUp?'文件':'解析')+'</b><em>　所以这一步没有「重新'+(isUp?'上传':'解析')+'」入口</em>'}
  ],'kv');
}

   不套「按未旋转尺寸画 + 整页 rotate」这一层，好让那两张截图逐像素回到施工前。 */
function pvPageSkeleton(pageNo,W,H,rot,flat){
  var rows=PV_LAYOUT[Math.min(pageNo,PV_LAYOUT.length)-1];
  var padY=Math.round(H*0.055),padX=Math.round(W*0.1);
  var units=rows.reduce(function(a,r){return a+r[2]+r[3];},0);
  var u=(H-padY*2)/units;
  var lines=rows.map(function(r){
    return '<i class="pv-ln'+(r[0]?' '+r[0]:'')+'" style="width:'+r[1]+'%;height:'+
      Math.max(3,Math.round(u*r[2]))+'px;margin-bottom:'+Math.round(u*r[3])+'px;"></i>';
  }).join('');
  if(flat)return '<span class="pv-pg" style="padding:'+padY+'px '+padX+'px;">'+lines+'</span>';
  return '<span class="pv-pg" style="left:50%;top:50%;width:'+W+'px;height:'+H+'px;'+
    'margin-left:'+(-W/2)+'px;margin-top:'+(-H/2)+'px;'+
    'transform:rotate('+(rot||0)+'deg);padding:'+padY+'px '+padX+'px;">'+lines+'</span>';
}

/* ---------- 平移：放大之后**真的**能拖到四角 ----------
   .pv-view 是真实滚动容器，这里不做 transform 假平移，也不写死一组偏移。
   分工写清楚：
     · 触摸——完全交给浏览器原生滚动（touch-action: pan-x pan-y 留着不动），
       指针类型是 touch 就直接放手，一体机上的手指滑动和惯性保持原样；
     · 鼠标 / 触控笔——接管 pointerdown/move/up，按住拖，位移按舞台缩放换算回舞台坐标。
   只有**量出来真的溢出**才挂监听、才给提示：拖不动却写"可以拖"，就是承诺一件做不到的事。
   这一层只挂在本机 / U 盘两条通道上：手机通道是本轮的冻结面，调用点在 renderPreview 里就已经
   被挡掉，那条分支的滚动仍然完全由浏览器自己做。 */
function pvEnablePan(view){
  var maxX=view.scrollWidth-view.clientWidth,maxY=view.scrollHeight-view.clientHeight;
  if(maxX<=1&&maxY<=1)return false;
  view.setAttribute('data-pannable','1');
  view.setAttribute('aria-label','文件预览区，当前可平移：按住拖动或用手指滑动，可以看到上下左右和四角');
  var hint=document.createElement('span');
  hint.className='pv-hint';
  hint.setAttribute('data-testid','rs-pv-hint');
  hint.innerHTML=svg(I_TARGET,18,'currentColor',2)+'已放大 · 按住直接拖，四角都能看到';
  view.parentNode.appendChild(hint);
  var drag=null;
  function scale(){
    var st=document.getElementById('stage');
    return (st?st.getBoundingClientRect().width/1080:1)||1;
  }
  function stop(e){
    if(!drag||e.pointerId!==drag.id)return;
    drag=null;view.classList.remove('grabbing');
    if(view.hasPointerCapture&&view.hasPointerCapture(e.pointerId))view.releasePointerCapture(e.pointerId);
  }
  view.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch')return;
    if(e.button!==0)return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,l:view.scrollLeft,t:view.scrollTop};
    if(view.setPointerCapture)view.setPointerCapture(e.pointerId);
    view.classList.add('grabbing');
    e.preventDefault();
  });
  view.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var s=scale();
    view.scrollLeft=drag.l-(e.clientX-drag.x)/s;
    view.scrollTop=drag.t-(e.clientY-drag.y)/s;
    e.preventDefault();
  });
  view.addEventListener('pointerup',stop);
  view.addEventListener('pointercancel',stop);
  view.addEventListener('lostpointercapture',stop);
  return true;
}

  /* 文件预览层：宿主状态 × 视图状态 × 三种预览侧失败。
     预览成不成、什么时候过期都是世界事件，产品控件不签发结果，只能从这里直达。 */
  var PV_DEMOS=[
    ['预览 · U盘PDF 整页',{state:'usb-selected',source:'usb',f:'0',preview:'1'}],

    ['预览 · 放大 300%',{state:'usb-ready',source:'usb',f:'0',preview:'1',pz:'300'}],
    ['预览 · 扫描图 整图',{state:'usb-selected',source:'usb',f:'2',preview:'1'}],
    ['预览 · 扫描图 转90°',{state:'usb-selected',source:'usb',f:'2',preview:'1',pr:'90'}],
    ['预览 · 扫描图 适宽',{state:'usb-ready',source:'usb',f:'2',preview:'1',pz:'width'}],
    ['预览 · 扫描图 放大200%',{state:'usb-selected',source:'usb',f:'2',preview:'1',pz:'200'}],
    ['预览 · U盘PDF 转90°',{state:'usb-selected',source:'usb',f:'0',preview:'1',pr:'90'}],
    ['预览 · DOCX 不能内嵌',{state:'local-selected',source:'local',lf:'0',preview:'1'}],
    ['预览 · DOCX 已收到',{state:'local-ready',source:'local',lf:'0',preview:'1'}],
    ['预览 · 本机PDF 整页',{state:'local-selected',source:'local',lf:'1',preview:'1'}],
    ['预览 · 本机PDF 末页',{state:'local-ready',source:'local',lf:'1',preview:'1',pp:'3'}],
    ['预览 · 本机PDF 适宽',{state:'local-selected',source:'local',lf:'1',preview:'1',pz:'width'}],
    ['预览 · 本机PDF 放大300%',{state:'local-ready',source:'local',lf:'1',preview:'1',pz:'300'}],
    ['预览 · 本机PDF 转90°',{state:'local-selected',source:'local',lf:'1',preview:'1',pr:'90'}],
    ['预览 · 手机上传 PDF',{state:'phone-uploaded',source:'phone',preview:'1'}],
    ['预览 · 确认页 PDF',{state:'summary',source:'usb',f:'0',preview:'1'}],
    ['预览失败 · 未开通',{state:'usb-ready',source:'usb',f:'0',preview:'1',pv:'unavailable'}],
    ['预览失败 · 链接过期',{state:'phone-uploaded',source:'phone',preview:'1',pv:'expired'}],
    ['预览失败 · 渲染失败',{state:'summary',source:'usb',f:'0',preview:'1',pv:'render'}],
    ['预览 · 扫描件 第1页',{state:'scan-ready',preview:'1'}],
    ['预览 · 扫描件 末页',{state:'scan-ready',preview:'1',pp:'2'}],
    ['预览 · 扫描件 适宽',{state:'scan-ready',preview:'1',pz:'width'}],
    ['预览 · 扫描件 放大300%',{state:'scan-ready',preview:'1',pz:'300'}],
    ['预览 · 扫描件 转90°',{state:'scan-ready',preview:'1',pr:'90'}],
    ['预览 · 确认页 扫描件',{state:'summary',source:'scan',preview:'1'}],
    ['预览 · U盘旧版PDF',{state:'usb-selected',source:'usb',f:'1',preview:'1'}]
  ];
  rows+='<div class="dp-t">文件预览</div>'+PV_DEMOS.map(function(d){
    return '<a href="'+url(d[1])+'">'+d[0]+'</a>';
  }).join('');
  panel.innerHTML=rows;

  tab.addEventListener('click',function(){
    var open=panel.classList.toggle('show');
    tab.setAttribute('aria-expanded',open?'true':'false');
  });
  var stage=document.getElementById('stage');
  stage.appendChild(tab);stage.appendChild(panel);
}
})();
</script>
