<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求职材料工坊 · 职易达</title>
<!--
  宿主：求职材料工坊（069 唯一青序流光宿主）
  route: /resume/materials
  state: select | signed-out | loading | error | empty | submitting
         | generated | generated-no-print | demo-result | failed | illegal
  api:  GET  /api/v1/job-materials/templates
        POST /api/v1/job-materials/generate
        对齐 JobMaterialLibraryPage.tsx 与 packages/shared/src/types/jobMaterials.ts

  ── 真话边界 ──────────────────────────────────────────────────────
    ① 模板目录可以查看；生成前必须登录。未登录时先保存当前模板与表单草稿，再去登录，
       **登录态确实有效才提交**；登录过期同样退回登录，草稿不丢。
    ② 姓名 / 目标岗位为空**不进 submitting**：就地标红、聚焦到第一个出错的字段，请求根本不发。
    ③ 不承诺「生成不收钱 / 免费生成 / 打印只收纸张费」；价格一律以现场公示与服务端报价为准。
    ④ 生成中不画百分比、不画阶段点、不倒计时；完成只认 POST 返回的真实文件对象。
    ⑤ 产物的文件名、页数、大小、留存期限、签名链接与打印凭证全部按服务端返回展示；
       没有 printFileUrl 就**只禁打印**，查看 / 预览 / 我的文档照常。
    ⑥ 生成成功后再动表单，屏幕上必须分得清「已生成的那一份」和「改过的新草稿」——
       新草稿必须重新生成才有新文件，旧文件不会跟着变。
    ⑦ 材料是给求职者本人带走的，本机不代投递、不把材料发送给任何单位。

  ── 契约字段（JobMaterialGenerateResponse，packages/shared/src/types/jobMaterials.ts）──
    templateId / templateTitle / documentType / fileId / filename / mimeType /
    sizeBytes / pageCount / signedUrl / signedUrlExpiresAt / fileExpiresAt /
    previewUrlPath / downloadUrlPath / printFileUrl?
    其中 printFileUrl 是**系统 HMAC content URL，仅供 /print/jobs 使用，mock 模式不返回**。
    本页展示的取值是合成夹具，不是任何一次真实生成的结果。

  ── 打印出口 ──────────────────────────────────────────────────────
    对齐 JobMaterialLibraryPage.printGenerated：交给打印确认的是
    { name, size, pages, fileId, fileUrl: printFileUrl, mimeType } +
    makePrintParams({ copies:1, duplex, color:'bw' })。
    真实页面用**路由 state** 传，不把签名链接放进地址栏；本原型先把这份交接内容摊开给人看，
    再用只带 **source + fileId** / 页数 / 打印参数的静态链接跳到打印确认页 —— 不拿一个裸 href
    假装已经接线。那一页按「来源 + 文件编号」**成对**认文件，所以 source 写错、
    或者只给 source 不给对应的 fileId，都会停在它的 invalid-context，不会退回默认那一份。
    单双面本原型固定 single：黑白单面是本机当前唯一已验证的组合，也是打印确认页登记了
    报价夹具的那一组；按「2 页所以双面」送过去只会撞在它的能力受限屏上。

  ── 受控夹具参数 ───────────────────────────────────────────────────
    ?tpl=<templateId>  指定「已生成」这几屏演示的是五个模板中的哪一份（默认第一份）。
                       未登记的取值按未指定处理并标 fallback，不猜。

  ── fail-closed ───────────────────────────────────────────────────
    · 未登记的 state → illegal 屏，root 标 data-fallback="1"，不回显地址栏原文
    · 未登记的 auth → 按**未登录**处理（取严不取宽）并标 fallback
    · 需要登录态的 state（submitting / generated / generated-no-print / demo-result）
      在 auth 非 in 时收敛为 signed-out
    · 预览层参数（p / fit / z）越界一律丢弃并标 fallback；没有真实文件时预览层不可达

  capability: 固定模板 + 用户手填字段生成 PDF；当前后端没有 LLM 调用，不得写成 AI 撰写。
  input: templateId + applicantName + targetRole + targetOrganization? + keyStrengths? + notes?
  persistence: http 模式成功后文件进入本人文档；demo 模式不保存真实文件且不可打印。
               草稿在真实页面走 sessionStorage（10 分钟有效），本原型只放在内存里。
  原型演示控制：初始状态由 ?state= 给定，之后的切换来自页内真实交互（?debug=1 显示演示面板）；
               页面没有任何计时器推进业务状态。
  验收范围：静态原型表现；不证明 React 接线、API 可用、真实模型、真实 PDF 或打印链路
-->
<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink-2:#3d5a52;--ink-3:#6b857c;
  --deep:#0b241e;--emerald:#2ee6a8;
  --teal:#1f9e86;--teal-d:#157a67;--teal-soft:#e0f2ec;
  --slate:#3f68b0;--slate-d:#35608f;--slate-soft:#e6ecf7;
  --wheat:#a9781f;--wheat-d:#8a6219;--wheat-soft:#f3ecda;
  --plum:#7a5a86;--plum-d:#6b4a77;--plum-soft:#efe8f2;
  --cinnabar:#b23a2e;--cinnabar-d:#963227;--cinnabar-soft:#f6e4e1;
  --line:#e3ddcb;--line-2:#d4cdb6;--r:8px;--r-s:6px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e8e3d3;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
a{color:inherit;text-decoration:none}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
ul{list-style:none}
.press{transition:transform 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{flex:none;height:100px;display:flex;align-items:center;gap:16px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);display:flex;align-items:center;justify-content:center}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:46px;height:46px;border-radius:var(--r);background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.logo-name{font-size:25px;font-weight:700;letter-spacing:2px}
.sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:18px;font-weight:600;max-width:560px;white-space:nowrap;overflow:hidden}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.warn{background:var(--wheat-soft);border-color:transparent;color:var(--wheat-d)}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);border-color:transparent;color:var(--cinnabar-d)}.pill.bad .dot{background:var(--cinnabar)}
.pill.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal-d)}.pill.ok .dot{background:var(--teal)}
.clock{flex:none;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}

.taskhead{flex:none;margin:18px 40px 0;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.th-t{font-size:38px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:14px}
.th-t::before{content:"";flex:none;width:8px;height:34px;border-radius:2px;background:linear-gradient(180deg,var(--emerald),var(--teal))}
.th-s{flex:1;min-width:260px;font-size:20px;line-height:1.4;color:var(--ink-2)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 40px}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-top:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.center{justify-content:center}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:2px}
.sec-h .no{font-size:19px;font-weight:700;color:var(--teal-d);letter-spacing:2px}
.sec-h .t{font-size:25px;font-weight:700}
.sec-h .hint{margin-left:auto;font-size:18px;color:var(--ink-3);font-weight:600}

.filters{display:flex;gap:9px;overflow-x:auto;padding:2px 0;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{flex:none;min-height:50px;padding:0 17px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:17px;font-weight:700;color:var(--ink-2)}
.filter[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:410px 1fr;gap:14px;margin-top:12px}
.catalog,.detail{min-height:0;overflow-y:auto;scrollbar-width:none}.catalog::-webkit-scrollbar,.detail::-webkit-scrollbar{display:none}
.catalog{display:flex;flex-direction:column;gap:10px}
.template{flex:1 1 auto;max-height:224px;padding:15px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.template[aria-pressed=true]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.template b{display:block;font-size:21px}.template p{margin-top:5px;font-size:16px;line-height:1.4;color:var(--ink-2)}
.template .use{display:block;margin-top:6px;font-size:15px;line-height:1.38;color:var(--ink-3)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tags i{font-style:normal;padding:5px 9px;border-radius:var(--r-s);background:var(--paper);border:1px solid var(--line);font-size:14px;color:var(--ink-3)}
/* 分类筛掉的那几份不凭空消失：给一排能直接跳回去的入口，比留一片空白有用。 */
.others{flex:none;padding:14px 16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--paper)}
.others>b{display:block;font-size:17px;font-weight:700;color:var(--ink-2)}
.others>p{margin-top:4px;font-size:15px;line-height:1.4;color:var(--ink-3)}
.others .list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.others .list button{min-height:52px;padding:0 14px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:17px;font-weight:700;color:var(--ink-2)}
.others .list button i{font-style:normal;flex:none;font-size:14px;color:var(--ink-3)}

.detail{display:flex;flex-direction:column;padding:19px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.detail h2{font-size:27px}.detail>.desc{margin-top:6px;font-size:17px;line-height:1.45;color:var(--ink-2)}
.tmeta{flex:none;display:flex;gap:1px;margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.tmeta div{flex:1;min-width:0;padding:9px 14px;background:var(--paper)}
.tmeta u{display:block;text-decoration:none;font-size:14px;font-weight:700;color:var(--ink-3)}
.tmeta b{display:block;margin-top:2px;font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tmeta div:first-child{flex:1.35}
.form{flex:none;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:12px;margin-top:14px}
.form.grow{flex:1;grid-template-rows:min-content min-content minmax(0,1fr) minmax(0,1.1fr)}
.field{display:flex;flex-direction:column;gap:7px;min-height:0}.field.wide{grid-column:1/-1}
.field span{font-size:16px;font-weight:700;color:var(--ink-2)}.field em{font-style:normal;color:var(--cinnabar)}
.field input,.field textarea{width:100%;min-height:58px;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font:inherit;font-size:18px;color:var(--ink);resize:none}
.field.wide textarea{flex:1;min-height:110px}
.field input:focus,.field textarea:focus{outline:3px solid rgba(31,158,134,.35);outline-offset:1px;border-color:var(--teal)}
/* 校验失败就地说清楚：红框 + 一句话 + 焦点落在第一个出错的字段，不靠一句总提示打发。 */
.field [aria-invalid=true]{border-color:var(--cinnabar);background:#fdf4f2}
.field .fe{display:none;font-size:15px;font-weight:700;color:var(--cinnabar-d)}
.field.bad .fe{display:block}

.after{flex:none;margin-top:13px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);display:flex;align-items:center;gap:10px}
.after>b{flex:none;font-size:16px;font-weight:700;color:var(--teal-d)}
.after .st{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-size:16px;line-height:1.35;color:var(--ink-2)}
.after .st>i{flex:none;width:26px;height:26px;border-radius:var(--r-s);background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:700}
.after .sep{flex:none;color:var(--ink-3)}
.banner{flex:none;display:flex;align-items:flex-start;gap:12px;margin-top:13px;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--paper)}
.banner i{flex:none;width:32px;height:32px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal-d)}
.banner .bx{flex:1;min-width:0;font-size:17px;line-height:1.45;color:var(--ink-2)}
.banner .bx b{color:var(--ink)}
.banner.warn{border-left-color:var(--wheat);background:var(--wheat-soft);border-color:#e6d8b4}
.banner.warn i{background:#e8dcbe;color:var(--wheat-d)}
.banner.warn .bx{color:var(--wheat-d)}.banner.warn .bx b{color:#6f4f13}
.banner.bad{border-left-color:var(--cinnabar);background:var(--cinnabar-soft);border-color:#e8c9c3}
.banner.bad i{background:#f0d5d0;color:var(--cinnabar-d)}
.banner.bad .bx{color:var(--cinnabar-d)}.banner.bad .bx b{color:#7d281f}

/* ── 真实文件卡：契约字段逐项摊开，不用一句「已生成」代替 ───────────── */
.filecard{flex:none;margin-top:13px;border:1px solid #b9ddd2;border-radius:var(--r);background:var(--teal-soft);overflow:hidden}
.filecard[data-tone=warn]{border-color:#e2d3ae;background:var(--wheat-soft)}
.filecard[data-tone=demo]{border-color:#ddd0e3;background:var(--plum-soft)}
.fc-h{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid rgba(16,48,43,.09)}
.fc-h .ic{flex:none;width:48px;height:48px;border-radius:var(--r);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--teal-d)}
.fc-h .tx{flex:1;min-width:0}
.fc-h .tx b{display:block;font-size:21px;font-weight:700}
.fc-h .tx span{display:block;margin-top:3px;font-size:16px;line-height:1.35;color:var(--ink-2)}
.fc-h .badge{flex:none;min-height:38px;padding:0 12px;display:flex;align-items:center;border-radius:var(--r-s);background:var(--surface);font-size:15px;font-weight:700;color:var(--teal-d)}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(16,48,43,.09)}
.fc-grid div{padding:8px 16px;background:var(--surface)}
.fc-grid div:last-child:nth-child(odd){grid-column:1/-1}
.fc-grid u{display:block;text-decoration:none;font-size:14px;font-weight:700;color:var(--ink-3);letter-spacing:.4px}
.fc-grid b{display:block;margin-top:3px;font-size:17px;font-weight:700;color:var(--ink);word-break:break-all}
.fc-grid b.off{color:var(--cinnabar-d)}
.fc-foot{padding:9px 16px;font-size:15px;line-height:1.4;color:var(--ink-2);background:var(--surface);border-top:1px solid rgba(16,48,43,.09)}
/* 有结果卡时表单收窄一点，让文件卡整张留在首屏，不用先滚动才看得到留存期与凭证 */
.detail.has-file .field.wide textarea{min-height:76px}
.detail.has-file .field input,.detail.has-file .field textarea{min-height:52px}
.fc-acts{display:flex;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid rgba(16,48,43,.09)}
.small{flex:1;min-height:56px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--paper);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.small.primary{background:var(--deep);border-color:transparent;color:var(--emerald)}
.small[aria-disabled=true]{background:#eceadf;border-color:var(--line);color:#96a49d;cursor:not-allowed}
.reason{padding:0 16px 12px;font-size:15px;line-height:1.4;color:var(--wheat-d);font-weight:700;background:var(--surface)}

.state{flex:none;display:flex;flex-direction:column;gap:16px;padding:40px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=info]{background:var(--teal-soft);border-color:#c6e4da}
.state[data-kind=lock]{background:var(--plum-soft);border-color:#ddd0e3}
.state-h{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
.state-p{font-size:21px;line-height:1.6;color:var(--ink-2);max-width:860px}
.state-p b{color:var(--ink)}
.state-acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}

.draft{margin-top:2px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.draft-h{padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--paper);font-size:19px;font-weight:700}
.draft-h span{margin-left:auto;min-height:38px;padding:0 12px;display:flex;align-items:center;border-radius:var(--r-s);background:var(--teal-soft);color:var(--teal-d);font-size:15px}
.draft-rows{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.draft-rows div{padding:10px 18px;background:var(--surface)}
.draft-rows div:last-child:nth-child(odd){grid-column:1/-1}
.draft-rows u{display:block;text-decoration:none;font-size:14px;font-weight:700;color:var(--ink-3)}
.draft-rows b{display:block;margin-top:2px;font-size:17px;font-weight:700}
.draft-rows b.empty{color:var(--ink-3);font-weight:600}

.alt{flex:none;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.alt-h{padding:14px 20px;font-size:20px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line);background:var(--paper)}
.alt-row{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:134px;border-bottom:1px solid var(--line);width:100%}
.alt-row:last-child{border-bottom:0}
.alt-ic{flex:none;width:56px;height:56px;border-radius:var(--r);background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.alt-tx{flex:1;min-width:0}
.alt-t{display:block;font-size:23px;font-weight:700}
.alt-d{display:block;margin-top:5px;font-size:18px;line-height:1.4;color:var(--ink-2)}
.alt-go{flex:none;color:var(--teal-d);display:flex;align-items:center}

.whyline{flex:none;margin-top:12px;font-size:17px;line-height:1.4;font-weight:600;color:var(--wheat-d)}
.whyline b{color:#6f4f13}
.ctabar{flex:none;margin-top:12px;display:flex;gap:14px;align-items:center}
.ctabar.four .btn{flex:1;min-width:0;padding:0 12px;font-size:21px}
.btn{min-height:76px;padding:0 26px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:11px;font-size:24px;font-weight:700;text-align:center}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn[aria-disabled=true]{background:#eceadf;border:1px solid var(--line);color:#96a49d;cursor:not-allowed}

<script>
(function(){
'use strict';
var SCREEN='material-workshop';
var SELF='25-material-workshop.html';
var ICON={
  mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.6 6.6L12 13l8.4-6.4"/>',
  cover:'<rect x="4.5" y="3" width="15" height="18" rx="1.8"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  doc:'<path d="M6.5 3.5h7l4.5 4.5v12h-11.5z"/><path d="M13.5 3.5V8H18M9 12.5h6M9 16h4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  lock:'<rect x="4.5" y="10" width="15" height="10.5" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
  alert:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.6M12 17.4h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/>',
  print:'<path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="1.8"/><path d="M7 14.5h10V21H7z"/>',
  pen:'<path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  folder:'<path d="M3.5 6.5h6l2 2.5h9v10a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19z"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  prev:'<path d="M15 5l-7 7 7 7"/>',
  next:'<path d="M9 5l7 7-7 7"/>',
  fitpage:'<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8 7.5h8M8 12h8M8 16.5h5"/>',
  fitwidth:'<path d="M3 8.5v7M21 8.5v7"/><path d="M3 12h18"/><path d="M7 8.5L3.5 12 7 15.5M17 8.5l3.5 3.5-3.5 3.5"/>',
  zoomin:'<circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5M8.5 11h5M11 8.5v5"/>',
  zoomout:'<circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5M8.5 11h5"/>'
};
function svg(n,s,w){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ════════ 1. 真实目录：5 个已发布文档模板 + 8 个分类 + 5 个字段 ════════
   模板、分类、字段全部照抄 packages/shared/src/types/jobMaterials.ts 与
   JobMaterialLibraryPage.tsx；简历版式模板（resume_template）由简历优化页消费，
   getJobMaterialTemplates 会把它过滤掉，所以这里就是 5 份，不多编一份撑场面。 */
var FILTERS=['全部','求职信','感谢信','作品集','材料清单','校招','社招','通用'];
var TEMPLATES=[
  {id:'campus-cover-letter',type:'求职信',title:'校招自荐信',out:'校招自荐信.pdf',desc:'适合应届生在校招现场快速生成一页自荐材料。',tags:['校招','通用'],for:'应届毕业生、校园招聘会、宣讲会后补充材料'},
  {id:'experienced-cover-letter',type:'求职信',title:'社招求职信',out:'社招求职信.pdf',desc:'围绕岗位要求、过往成果和匹配理由生成正式求职信。',tags:['社招','通用'],for:'社招求职、岗位咨询、线下招聘会沟通'},
  {id:'interview-thank-you',type:'感谢信',title:'面试感谢信',out:'面试感谢信.pdf',desc:'面试后整理感谢与补充说明，方便用户自行发送。',tags:['面试','通用'],for:'面试结束后的跟进、补充说明、二次沟通准备'},
  {id:'portfolio-cover',type:'作品集',title:'作品集封面',out:'作品集封面.pdf',desc:'为设计、内容、运营岗位生成简洁作品集封面页。',tags:['设计岗','运营岗'],for:'作品集打印、现场展示、材料装订首页'},
  {id:'job-fair-checklist',type:'材料清单',title:'招聘会材料清单',out:'招聘会材料清单.pdf',desc:'生成参加招聘会前的材料准备清单，减少遗漏。',tags:['招聘会','通用'],for:'招聘会现场打印、面试前检查、材料整理'}
];
var FORM=[
  ['applicantName','姓名',true,'例：王同学',40,false],
  ['targetRole','目标岗位',true,'例：前端开发工程师',60,false],
  ['targetOrganization','目标单位',false,'例：某科技公司 / 某高校招聘会',80,false],
  ['keyStrengths','核心亮点',false,'例：React 项目经验、校级竞赛、数据分析能力',280,true],
  ['notes','补充说明',false,'例：希望语气稳重，突出实习经历',220,true]
];

/* ════════ 2. 查询契约与 fail-closed ════════ */
var q=new URLSearchParams(location.search);
var DEBUG=q.get('debug')==='1';
var STATES=['select','signed-out','loading','error','empty','submitting','generated','generated-no-print','demo-result','failed'];
var AUTHS=['in','out','expired'];
var NEED_AUTH=['submitting','generated','generated-no-print','demo-result'];
var fallback=false;

var rawState=q.get('state');
var state=rawState===null?'select':(STATES.indexOf(rawState)>=0?rawState:(fallback=true,'illegal'));
/* 受控夹具参数：五个模板各出一份文件，「已生成」这几屏演示的是哪一份必须能指定，
   否则只有第一个模板可达，另外四份的文件名、页数和文件编号谁都验不到。
   取值只认 TEMPLATES 里登记的 id；不认的按未指定处理并标 fallback，不猜。 */
var rawTpl=q.get('tpl');
var TPL_IDX=0;
if(rawTpl!==null){
  var ti=-1,tj;
  for(tj=0;tj<TEMPLATES.length;tj++)if(TEMPLATES[tj].id===rawTpl)ti=tj;
  if(ti>=0)TPL_IDX=ti;else fallback=true;
}
/* 未登记的 auth 取严不取宽：按未登录处理，绝不因为看不懂就放行。 */
var rawAuth=q.get('auth');
var AUTH=rawAuth===null?'in':(AUTHS.indexOf(rawAuth)>=0?rawAuth:(fallback=true,'out'));
if(state==='signed-out'&&AUTH==='in')AUTH='out';
if(NEED_AUTH.indexOf(state)>=0&&AUTH!=='in'){state='signed-out';fallback=true;}

var filter='全部',selected=0,submitted=null,dirty=false,loginBanner='';
var formValues={applicantName:'',targetRole:'',targetOrganization:'',keyStrengths:'',notes:''};
var fieldErr={};
var DRAFT=null;
var HAS_FILE={'generated':1,'generated-no-print':1,'demo-result':1};
var PREFILL={'submitting':1,'generated':1,'generated-no-print':1,'demo-result':1};

/* 演示用的表单初值：只有「已提交 / 已生成」这几屏才预填，否则空表单。 */
if(PREFILL[state]){
  formValues.applicantName='王同学';formValues.targetRole='用户运营专员';
  formValues.targetOrganization='某科技公司 · 校园招聘';
  formValues.keyStrengths='3 个用户社群共 1200 人；月活跃从 600 增至 780';
  submitted={idx:TPL_IDX,values:JSON.parse(JSON.stringify(formValues))};
  selected=TPL_IDX;
}

/* ════════ 3. 契约字段夹具（JobMaterialGenerateResponse）════════
   取值是合成夹具，不是任何一次真实生成；页面上逐处标注。 */
function fileOf(){
  var t=TEMPLATES[submitted?submitted.idx:selected];
  var pages=t.id==='job-fair-checklist'?1:2;
  return {
    templateId:t.id,templateTitle:t.title,documentType:t.id,
    fileId:'jm_' + t.id.replace(/-/g,'_') + '_8f31c0',
    filename:t.out,mimeType:'application/pdf',
    sizeBytes:pages===1?96256:132096,pageCount:pages,
    signedUrl:'一次性签名链接（30 分钟内有效，不展示完整串）',
    signedUrlExpiresAt:'今天 10:02',
    fileExpiresAt:'2026-11-29 09:32',
    previewUrlPath:'/files/'+t.id+'/preview-url',
    downloadUrlPath:'/files/'+t.id+'/download-url',
    printFileUrl:state==='generated'?'系统 HMAC content URL（仅 /print/jobs 可用）':null
  };
}
function kb(n){return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1)+' MB';}

/* ════════ 4. 目录与表单 ════════ */
function filterBar(){
  return '<nav class="filters" aria-label="求职材料分类">'+FILTERS.map(function(f){
    return '<button type="button" class="filter press" data-filter="'+esc(f)+'" aria-pressed="'+(filter===f)+'">'+esc(f)+'</button>';
  }).join('')+'</nav>';
}
function visibleTemplates(){return TEMPLATES.filter(function(t){return filter==='全部'||t.type===filter||t.tags.indexOf(filter)>=0;});}
function templateCard(t){
  var idx=TEMPLATES.indexOf(t),on=idx===selected;
  return '<button type="button" class="template press" data-template="'+idx+'" aria-pressed="'+on+'" data-testid="'+SCREEN+'-template-'+t.id+'">'
    +'<b>'+esc(t.title)+'</b><p>'+esc(t.desc)+'</p>'
    +'<span class="use">适用：'+esc(t['for'])+'</span>'
    +'<span class="tags"><i>'+esc(t.type)+'</i>'+t.tags.map(function(x){return '<i>'+esc(x)+'</i>';}).join('')+'</span></button>';
}
function othersBlock(list){
  var rest=TEMPLATES.filter(function(t){return list.indexOf(t)<0;});
  if(!rest.length)return '';
  return '<div class="others" data-testid="'+SCREEN+'-others"><b>不在「'+esc(filter)+'」里的还有 '+rest.length+' 份</b>'
    +'<p>它们没有被删掉，只是被当前分类筛掉了。点一份可以直接切回全部并选中它。</p><div class="list">'
    +rest.map(function(t){return '<button type="button" class="press" data-jump="'+TEMPLATES.indexOf(t)+'">'+esc(t.title)+'<i>'+esc(t.type)+'</i></button>';}).join('')
    +'</div></div>';
}
function fields(){
  return FORM.map(function(f){
    var value=esc(formValues[f[0]]),bad=!!fieldErr[f[0]];
    var attrs=' data-field="'+f[0]+'" maxlength="'+f[4]+'" placeholder="'+esc(f[3])+'"'
      +(bad?' aria-invalid="true" aria-describedby="fe-'+f[0]+'"':'');
    return '<label class="field'+(f[5]?' wide':'')+(bad?' bad':'')+'">'
      +'<span>'+esc(f[1])+(f[2]?'<em> *</em>':'')+' · 最多 '+f[4]+' 字</span>'
      +(f[5]?'<textarea rows="3"'+attrs+'>'+value+'</textarea>':'<input value="'+value+'"'+attrs+'>')
      +'<span class="fe" id="fe-'+f[0]+'" role="alert">'+(bad?esc(fieldErr[f[0]]):'')+'</span></label>';
  }).join('');
}
/* 生成之后会发生什么：三步都是真实链路上的事，压成一条，不铺成三张说明卡。 */

/* ════════ 5. 真实文件卡 + 出口 ════════ */
function fileCard(mode){
  var f=fileOf(),demo=mode==='demo',noPrint=mode==='no-print';
  var tone=demo?'demo':(noPrint?'warn':'ok');
  var head=demo?['演示对象 · 未保存真实文件','演示模式返回的是占位对象，不进我的文档，也没有打印凭证。']
    :noPrint?['真实 PDF 已生成 · 打印凭证未就绪','文件已进入我的文档，可查看、可预览；没有 printFileUrl 时只禁打印。']
    :['真实 PDF 已生成 · 已进入我的文档','下面每一项都取自 POST /job-materials/generate 的返回字段。'];
  var rows=[
    ['文件名',esc(f.filename),0],['页数',f.pageCount+' 页',0],
    ['大小',kb(f.sizeBytes),0],['类型',esc(f.mimeType),0],
    ['文件编号 fileId',esc(f.fileId),0],
    ['查看链接 signedUrl',demo?'演示对象无签名链接':esc(f.signedUrl),demo?1:0],
    ['签名链接有效期 signedUrlExpiresAt',demo?'—':esc(f.signedUrlExpiresAt),demo?1:0],
    ['文件留存到 fileExpiresAt',demo?'不保存':esc(f.fileExpiresAt),demo?1:0],
    ['预览路径 previewUrlPath',demo?'—':esc(f.previewUrlPath),demo?1:0],
    ['打印凭证 printFileUrl',f.printFileUrl?esc(f.printFileUrl):'未返回（打印保持禁用）',f.printFileUrl?0:1]
  ];
  var grid=rows.map(function(r){return '<div><u>'+r[0]+'</u><b'+(r[2]?' class="off"':'')+'>'+r[1]+'</b></div>';}).join('');
  var canPrint=!!f.printFileUrl;
  var reason=canPrint&&!demo?''
    :'<p class="reason" id="'+(demo?'rz-preview':'rz-print')+'">'
      +(demo?'演示模式没有真实文件：预览、我的文档和打印都停用，页面不拿一个示例文件冒充结果。'
        :'服务端这次没有返回 printFileUrl。文件本身是真的，可以看、可以留在我的文档里；只有打印这一步必须等到凭证就绪。')
      +'</p>';
  var dirtyBar=dirty?'<div class="banner warn" data-testid="'+SCREEN+'-stale"><i aria-hidden="true">'+svg('alert',20)+'</i>'
    +'<span class="bx"><b>表单已经改过了，下面这份文件还是上一次生成的那一版。</b>'
    +'它对应你提交时的「'+esc(TEMPLATES[submitted.idx].title)+'」和当时填的内容，不会跟着新草稿变。'
    +'想要按现在这份草稿出文件，必须<b>重新生成</b>。</span></div>':'';
  return dirtyBar
    +'<div class="filecard" data-tone="'+tone+'" data-print-ready="'+(canPrint?1:0)+'" data-stale="'+(dirty?1:0)+'" data-testid="'+SCREEN+'-file">'
    +'<div class="fc-h"><span class="ic">'+svg('doc',24)+'</span>'
    +'<span class="tx"><b>'+head[0]+'</b><span>'+head[1]+'</span></span>'
    +'<span class="badge">'+(demo?'演示对象':(dirty?'上一版':'当前文件'))+'</span></div>'
    +'<div class="fc-grid">'+grid+'</div>'
    +'<p class="fc-foot">字段取自 JobMaterialGenerateResponse；本页取值是<b>合成夹具</b>，不是某次真实生成的结果。</p>'
    +reason+'</div>';
}

function paintLayer(){
  layer.classList.remove('on');layer.removeAttribute('data-kind');
  layer.innerHTML='';
  if(layerKind==='preview'){layer.innerHTML=previewLayer();layer.setAttribute('data-kind','preview');layer.classList.add('on');}
  else if(layerKind==='print'){layer.innerHTML=printLayer();layer.setAttribute('data-kind','print');layer.classList.add('on');}
  var under=[document.querySelector('.topbar'),document.querySelector('.taskhead'),root,document.querySelector('.truth'),document.querySelector('.navbar')];
  for(var i=0;i<under.length;i++){
    if(!under[i])continue;
    if(layerKind){under[i].setAttribute('inert','');under[i].setAttribute('aria-hidden','true');}
    else{under[i].removeAttribute('inert');under[i].removeAttribute('aria-hidden');}
  }

function render(){

    pillTone='warn';

    subTxt='模板目录随便看；点「生成可打印版」时才需要登录，草稿不会丢。';

function markDirty(){

function bindMain(){
  var i,els;
  els=root.querySelectorAll('[data-field]');
  for(i=0;i<els.length;i++)els[i].addEventListener('input',function(){
    var key=this.getAttribute('data-field');
    formValues[key]=this.value;
    if(fieldErr[key]&&this.value.trim()){          /* 改对了就把红框收掉，不留着吓人 */
      delete fieldErr[key];
      var box=this.closest('.field');
      if(box){box.classList.remove('bad');this.removeAttribute('aria-invalid');
        var fe=box.querySelector('.fe');if(fe)fe.textContent='';}
    }
    if(HAS_FILE[state]&&submitted&&!dirty){markDirty();render();}
  });
  els=root.querySelectorAll('[data-filter]');
  for(i=0;i<els.length;i++)els[i].addEventListener('click',function(){
    filter=this.getAttribute('data-filter');ensureSelectedVisible();render();
  });
  els=root.querySelectorAll('[data-template]');
  for(i=0;i<els.length;i++)els[i].addEventListener('click',function(){
    var next=Number(this.getAttribute('data-template'));
    if(next!==selected){selected=next;markDirty();}
    render();
  });
  els=root.querySelectorAll('[data-jump]');
  for(i=0;i<els.length;i++)els[i].addEventListener('click',function(){
    var next=Number(this.getAttribute('data-jump'));
    if(next!==selected){selected=next;markDirty();}
    filter='全部';render();
  });
  on('do-generate',submit);
  on('do-login',login);
  on('back-form',function(){state='select';loginBanner='';render();});
  on('go-loading',function(){state='loading';render();});
  on('open-preview',function(){layerKind='preview';pageNo=1;fitMode='page';zoomLv=1;paintLayer();});
  on('open-print',function(){layerKind='print';paintLayer();});
}
function bindLayer(){
  on('ly-close',closeLayer);on('ly-close-2',closeLayer);
  on('to-print',function(){layerKind='print';paintLayer();});
  var els=layer.querySelectorAll('[data-page],[data-fit],[data-zoom]'),i;
  for(i=0;i<els.length;i++)els[i].addEventListener('click',function(){
    if(this.getAttribute('aria-disabled')==='true')return;
    if(this.hasAttribute('data-page'))pageNo=Number(this.getAttribute('data-page'));
    if(this.hasAttribute('data-fit'))fitMode=this.getAttribute('data-fit');
    if(this.hasAttribute('data-zoom'))zoomLv=Number(this.getAttribute('data-zoom'));
    paintLayer();
  });
}
function closeLayer(){layerKind=null;paintLayer();}
function on(id,fn){var e=document.getElementById(id);if(e)e.addEventListener('click',fn);}

/* 校验 → 登录态 → 提交。三道门的顺序是固定的：
   字段不合格连登录都不用问，请求也根本不发。 */
function validate(){
  fieldErr={};
  var bad=[];
  FORM.forEach(function(f){
    if(f[2]&&!String(formValues[f[0]]||'').trim()){
      fieldErr[f[0]]='请填写'+f[1]+'，这一项是生成 PDF 的必填内容';
      bad.push(f[0]);
    }
  });
  return bad;
}
function submit(){
  var bad=validate();
  if(bad.length){
    render();
    var first=root.querySelector('[data-field="'+bad[0]+'"]');
    if(first){first.focus();if(first.scrollIntoView)first.scrollIntoView({block:'center'});}
    return;                                     /* 不进 submitting，不发请求 */
  }
  if(AUTH!=='in'){                              /* 登录态无效：先存草稿再去登录 */
    DRAFT={idx:selected,values:JSON.parse(JSON.stringify(formValues))};
    loginBanner=AUTH==='expired'?'expired':'';
    state='signed-out';render();return;
  }
  submitted={idx:selected,values:JSON.parse(JSON.stringify(formValues))};
  dirty=false;state='submitting';render();
}
function login(){
  /* 演示：登录返回后必须重新确认会话有效才继续。会话没通过就退回本屏，草稿不动。 */
  AUTH='in';
  if(DRAFT){selected=DRAFT.idx;formValues=JSON.parse(JSON.stringify(DRAFT.values));DRAFT=null;}
  loginBanner='ok';state='select';render();
}

function tick(){var d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
fit();addEventListener('resize',function(){fit();if(layerKind==='preview')layoutPreview();});

if(DEBUG){
  var tab=document.getElementById('demo-tab'),panel=document.getElementById('demo-panel'),html='';
  var all=STATES.concat(['illegal']);
  for(var k=0;k<all.length;k++)html+='<a href="'+SELF+'?debug=1&state='+all[k]+(all[k]==='signed-out'?'&auth=out':'')+'">'+all[k]+'</a>';
  for(var t=0;t<TEMPLATES.length;t++)
    html+='<a href="'+SELF+'?debug=1&state=generated&tpl='+TEMPLATES[t].id+'">已生成 · '+TEMPLATES[t].title+'</a>';
  html+='<a href="'+SELF+'?debug=1&state=generated&tpl=nope">非法 tpl（fail-closed）</a>';
  html+='<a href="'+SELF+'?debug=1&auth=out">select · 未登录</a>';
  html+='<a href="'+SELF+'?debug=1&auth=expired">select · 登录已过期</a>';
  html+='<a href="'+SELF+'?debug=1&state=nope">非法 state（fail-closed）</a>';
  panel.innerHTML=html;tab.classList.add('on');
  tab.addEventListener('click',function(){panel.classList.toggle('on');});
}
})();
</script>
</body>
</html>
