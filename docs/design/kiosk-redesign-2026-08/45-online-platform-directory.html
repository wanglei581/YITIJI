<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>线上招聘平台 · 职易达</title>
<!--
  宿主：线上招聘平台目录（第三方官网入口）
  route: /jobs/online-platforms  —— 102（入口来自 Jobs Hub）
  state: ready | navigator | qr | invalid-platform
  数据来源（重要）：平台名称、分类与官网域名逐字取自运行时**硬编码常量**
        apps/kiosk/src/pages/jobs/OnlinePlatformsPage.tsx 的 PLATFORMS。
        它不是 Admin 审核结果，不接 API，不随后台配置变化，也不代表任何合作关系。
        本页因此不写「已核验」「合作平台」「实时同步」一类说法。
  真话边界：
    ① 二维码在运行时由 qrcode.react 按内置官网地址生成；静态原型只画二维码位，
       不生成可扫描图形，也不虚构短链或跳转地址。
    ② platform 参数不在固定四项清单中时显示 invalid-platform，不生成二维码。
    ③ navigator 对齐 React 的 AI 找岗方向；快捷领域不是完整字典，领域、地点、阶段和说明均可自由填写。
    ④ 按钮文案用「扫码打开来源平台」：浏览、登录、投递全部在该平台完成，
       本机不接收简历、不代投递，也不记录平台内操作。
  ai-mode: AI-CONTEXT（102 页内辅助，不自动调用）
  ai-input: 用户主动选择的本人简历，或手动填写的求职方向；平台清单仍只读运行时内置官网字段
  ai-consent: 用户必须主动选择输入，不得静默读取简历、浏览记录或平台账号信息
  ai-output: 可核对的岗位名称、技能与地区搜索词；不得比较平台优劣、代投递或生成平台事实
  ai-failure: 缺输入、本人简历不可用、AI 服务不可用均常显原因，不生成演示搜索词
  ai-fallback: 四个平台入口及普通岗位/机构浏览保持可用，并给出“岗位名称 + 地区”的手动搜索方法
  ai-persistence: 搜索词和输入只在当前会话临时使用，默认不写入 AI 记录，清场时删除
  原型演示控制：状态只通过 ?state= 切换（?debug=1 显示演示面板），页面无计时器推进业务状态
  验收范围：静态原型表现；不证明 React 接线、API 可用、Admin 审核或生产数据
-->
<link rel="stylesheet" href="directory-workspaces.css">
</head>
<body>
<div id="stage" class="platform-shell">
  <header class="topbar">
    <a class="back press" href="16-service-hubs.html?hub=jobs" data-route="/jobs-service" aria-label="返回岗位服务"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#10302b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="logo"><div class="logo-mark serif">职</div><div class="logo-name">职易达</div></div>
    <div class="sp"></div>
    <div class="pill" id="pill"><span class="dot" id="pill-dot" aria-hidden="true"></span><span id="pill-txt">4 个来源平台入口</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <section class="taskhead" aria-labelledby="task-title">
    <h1 class="th-t" id="task-title">线上招聘平台</h1>
    <p class="th-s" id="task-sub">选一个来源平台，扫码后在手机上打开官网。</p>
  </section>

  <main class="body" id="body-root" data-screen="online-platform" data-state="ready" data-testid="online-platform-state-ready"></main>

  <div class="truth truth-compact" data-disclaimer="true" data-testid="online-platform-truth">
    <div><b>隐私提示</b>结束会话或闲置超时清除本机登录态和临时会话信息；文件与订单按服务端留存期限管理。</div>
  </div>
  <nav class="navbar" aria-label="全局导航">
    <a class="nav-item" href="01-home.html" data-route="/"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6b857c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span class="ni">首页</span></a>
    <a class="nav-item" href="05-ai-cockpit.html" data-route="/assistant"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6b857c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 1 1-3.5-6.6"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span class="ni">AI 顾问</span></a>
    <a class="nav-item" href="30-my-profile.html" data-route="/profile"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6b857c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span class="ni">我的</span></a>
  </nav>
  <button type="button" class="demo-tab" id="demo-tab" aria-label="打开原型演示控制面板" data-proto-control="true">演示</button>
  <div class="demo-panel" id="demo-panel" aria-label="原型演示控制" data-proto-control="true"></div>
</div>
<script>window.DW_SCREEN='online-platform'</script>
<script src="directory-workspaces.js"></script>
</body>
</html>
