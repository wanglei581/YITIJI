  state: documents-login | documents-loading | documents-empty | documents-ready | documents-error |
         documents-access-loading | documents-access-expired | documents-access-error | documents-access-ready |
         orders-login   | orders-loading   | orders-empty   | orders-ready   | orders-error
  api: GET /api/v1/me/documents      → { items, nextCursor, total }
       GET /api/v1/me/print-orders   → { items, nextCursor, total }
  fallback: 未登录只引导登录并带 ?from=；加载失败保留重试与「联系工作人员」；空列表不造数据；
            不可预览格式诚实降级，不声称已生成预览。
  真话边界（本批次修复要点）：
    ① ready 的每一行都是**接口回填结构位**：文件名、格式页数、时间、留存期限、订单状态一律不写死，
       不出现任何看起来像真实账号的文件名、订单号或状态结论。
    ② 数量与筛选计数在接口返回前一律显示「—」，不拿上一次的数字冒充当前账号。
    ③ 登录 / 加载 / 空 / 失败四态都保留完整的任务结构（两域切换 + 分类 + 行结构 + 下一步），
       不做「一张小卡片 + 大片空白」。
    ④ 结束会话只清除本机登录态与临时会话信息；已提交到服务端的订单与文件按各自留存期限管理。
  原型演示控制：仅用 ?state= 切换；?filter= 只影响分类高亮；?debug=1 才显示演示面板。

    只在 ?debug=1 下渲染。普通会话请求 documents-ready / orders-ready 一律按域降级到
    documents-login / orders-login，域不变、只降到该域的登录态，不静默换到另一个域。
  验收范围：静态版式；不证明 React 接线、接口可用或真实账号数据。

<style>
:root{
  --paper:#f5f2e9;--surface:#fffdf8;--ink:#10302b;--ink2:#3d5a52;--ink3:#6b857c;
  --deep:#0b241e;--deep2:#123a30;--green:#2ee6a8;
  --teal:#1f9e86;--teal2:#157a67;--tealsoft:#e0f2ec;
  --slate:#3f68b0;--slate2:#35608f;--slatesoft:#e6ecf7;
  --clay:#b8683c;--clay2:#9e5330;--claysoft:#f7ebe1;
  --plum:#7a5a86;--plum2:#6b4a77;--plumsoft:#efe8f2;
  --wheat:#a9781f;--wheat2:#8a6219;--wheatsoft:#f3ecda;
  --line:#e3ddcb;--line2:#d4cdb6;--bad:#b23a2e;--badsoft:#f6e4e1;
  --ease:cubic-bezier(.22,1,.36,1);
  /* 与 00–15 定稿页同名令牌（值一致，供后续统一改名） */
  --ink-2:var(--ink2);--ink-3:var(--ink3);--deep-2:var(--deep2);--emerald:var(--green);
  --teal-d:var(--teal2);--teal-soft:var(--tealsoft);--slate-d:var(--slate2);--slate-soft:var(--slatesoft);
  --clay-d:var(--clay2);--clay-soft:var(--claysoft);--wheat-d:var(--wheat2);--wheat-soft:var(--wheatsoft);
  --cinnabar:var(--bad);--cinnabar-soft:var(--badsoft);--line-2:var(--line2);--ease-out:var(--ease);
  --r-lg:32px;--r-md:24px;--r-sm:18px;--tap-min:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);overflow:hidden}
a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{width:1080px;height:1920px;position:relative;display:flex;flex-direction:column;overflow:hidden;transform-origin:center center;
  background:radial-gradient(900px 420px at 86% 6%,rgba(31,158,134,.07),transparent 60%),
             radial-gradient(820px 500px at -6% 58%,rgba(184,104,60,.045),transparent 56%),var(--paper)}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
.press{transition:transform 140ms var(--ease),border-color 140ms ease,background-color 140ms ease}
.press:active{transform:scale(.985)}

.topbar{height:104px;flex:none;padding:0 36px;display:flex;align-items:center;gap:18px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:20px;border:1px solid var(--line2);background:var(--paper)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--deep);color:var(--green);font-size:24px;font-weight:800}
.logo-name{font-size:26px;font-weight:800;letter-spacing:1px}
.sp{flex:1}
.pill{height:54px;padding:0 22px;border-radius:27px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);font-size:19px;font-weight:700;background:var(--paper);color:var(--ink2)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.dot.breathe{animation:breathe 2.2s var(--ease) infinite}
.clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}

.xq{margin:22px 42px 0;padding:26px 38px;border-radius:34px;flex:none;background:linear-gradient(158deg,var(--deep2),var(--deep));color:#f2efe4;position:relative;overflow:hidden}
.xq::after{content:"";position:absolute;right:-150px;top:-150px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(46,230,168,.15),transparent 66%)}
.xq-row{display:flex;align-items:center;gap:24px;position:relative;z-index:1}
.xq-face{width:88px;height:88px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(46,230,168,.4);background:rgba(46,230,168,.1);color:var(--green);font-size:40px}
.xq-main{flex:1;min-width:0}
.xq-eyebrow{font-size:17px;letter-spacing:5px;color:rgba(242,239,228,.5);margin-bottom:7px}
.xq-ask{font-size:36px;line-height:1.28;font-weight:800}
.xq-ask em{font-style:normal;color:var(--green)}
.xq-doing{font-size:20px;line-height:1.5;color:rgba(242,239,228,.74);margin-top:8px}
.xq-doing b{color:#fff;font-weight:700}

.tabs{margin:18px 42px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none}
.tab-domain{min-height:72px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:800}
.tab-domain svg{width:26px;height:26px}
.tab-domain.on{background:var(--deep);color:#fff;border-color:var(--deep)}

/* ── 主体网格：任何状态都是「结构 + 1fr 主内容 + 说明 + 操作」 ── */
.body{flex:1;min-height:0;padding:18px 42px 16px;display:grid;gap:14px;overflow:hidden}
.body.state-layout{grid-template-rows:auto minmax(0,1fr) auto auto}
.body.ready-layout{grid-template-rows:auto auto minmax(0,1fr) auto auto}

.fixture{flex:none;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:15px;background:var(--wheatsoft);color:var(--wheat2);font-size:17px;font-weight:700;line-height:1.35}
.fixture svg{width:21px;height:21px;flex:none}
.fixture>span{min-width:0}

.banner{flex:none;display:flex;align-items:center;gap:20px;padding:20px 24px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.banner-ico{width:72px;height:72px;flex:none;border-radius:22px;display:grid;place-items:center;background:var(--slatesoft);color:var(--slate2)}
.banner-ico svg{width:34px;height:34px}
.banner-ico[data-tone=lock]{background:var(--plumsoft);color:var(--plum2)}
.banner-ico[data-tone=warn]{background:var(--badsoft);color:var(--bad)}
.banner-ico[data-tone=calm]{background:var(--tealsoft);color:var(--teal2)}
.banner-main{flex:1;min-width:0}
.banner-t{display:block;font-size:28px;font-weight:800;line-height:1.28}
.banner-p{display:block;margin-top:7px;font-size:19px;line-height:1.5;color:var(--ink3)}
.banner-p b{color:var(--ink2)}
.banner-mini{flex:none;display:flex;flex-direction:column;gap:6px;text-align:right}
.banner-mini i{font-style:normal;font-size:17px;font-weight:700;color:var(--ink2)}

.chips{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{min-height:60px;padding:0 14px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:9px;font-size:20px;font-weight:700}
.chip i{font-style:normal;min-width:34px;height:32px;padding:0 9px;border-radius:11px;background:var(--paper);color:var(--ink3);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.chip.on{background:var(--tealsoft);border-color:#8dc4b5;color:var(--teal2)}
.chip.on i{background:#fff;color:var(--teal2)}

.list{min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow-y:auto;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
/* 任务行按产品尺寸排：可以吃掉一部分剩余高度，但有上限；封顶之后的余量落在列表底部，
   而不是把每一行撑成「260–330px 里只装 90px 内容」的空壳。
   flex-basis 保持 auto、不收缩，条目多时照常滚动，不会把行压扁。 */
/* 同 39：行高上限抬到 220px，列表卡底部的余量从 169px 降到 160px。 */
/* flex-shrink 必须是 1，且列表内的行要有一个比 .row 更低的下限：
   原来是 flex:1 0 auto + min-height:132px，行既不能压缩、又有硬下限，
   内容一多列表卡就直接把底注裁掉（空列表/失败态实测被切 13~61px）。
   下限只在卡片装不下时才生效，正常状态下行仍然按 flex-grow 撑到上限，版面不变。 */
.list>.row{flex:1 1 auto;min-height:104px}
.row{flex:1 1 auto;min-height:132px;max-height:220px;padding:18px 20px;border:1px solid var(--line);border-radius:22px;background:var(--paper);display:flex;align-items:center;gap:16px}
.row.off{background:#efeade;border-color:#ddd8c8}
.row-ico{width:58px;height:58px;flex:none;border-radius:17px;display:grid;place-items:center;background:var(--slatesoft);color:var(--slate2)}
.row-ico svg{width:28px;height:28px}
.row-ico[data-tone=clay]{background:var(--claysoft);color:var(--clay2)}
.row-ico[data-tone=teal]{background:var(--tealsoft);color:var(--teal2)}
.row-ico[data-tone=off]{background:#ded9cb;color:#6d7069}
.row-main{flex:1;min-width:0}
.row-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;line-height:1.3}
.row-sub{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:9px}
.row-actions{flex:none;display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;max-width:330px}
/* 行内角色标：说明这一行是「哪一类结果位」，本身不是任何一条真实记录。 */
.role{flex:none;height:32px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;
  background:var(--slatesoft);color:var(--slate2);font-size:16px;font-weight:800;letter-spacing:.5px}
.role[data-tone=teal]{background:var(--tealsoft);color:var(--teal2)}
.role[data-tone=clay]{background:var(--claysoft);color:var(--clay2)}
.role[data-tone=wheat]{background:var(--wheatsoft);color:var(--wheat2)}
.small{min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:700}
.small svg{width:19px;height:19px}
.small.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.small[aria-disabled=true]{background:#e6e2d7;border-color:#dcd7c9;color:#84867e}

/* 接口回填结构位与骨架条 */
.slot{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:10px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink3);font-size:16px;font-weight:700}
.slot.wide{min-width:280px}
.slot.lock{border-style:solid;background:#efeade;color:#6d7069}
.skel{height:22px;border-radius:8px;background:#ece7d9}
.skel.t{width:52%}
.skel.s{width:34%;margin-top:12px;height:18px}

.list-foot{flex:none;padding:14px 18px;border-radius:16px;background:rgba(11,36,30,.045);color:var(--ink2);font-size:17px;line-height:1.5}
.list-foot b{color:var(--ink)}

.guide{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.guide-item{padding:15px 18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);display:flex;flex-direction:column;justify-content:center}
.guide-k{font-size:16px;font-weight:800;color:var(--teal2);letter-spacing:1px}
.guide-t{margin-top:6px;font-size:20px;font-weight:800;line-height:1.3}
.guide-p{margin-top:5px;font-size:16px;line-height:1.5;color:var(--ink3)}

.ctabar{flex:none;display:flex;gap:14px}
.btn{flex:1;min-height:84px;padding:0 24px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line2);background:var(--surface);font-size:22px;font-weight:800;text-align:center}
.btn svg{width:24px;height:24px;flex:none}
.btn.primary{flex:1.5;background:var(--deep);border-color:var(--deep);color:#fff}
.btn[aria-disabled=true]{background:#dcd8cc;border-color:#dcd8cc;color:#77796f}

.truth{height:58px;flex:none;padding:0 42px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);color:var(--ink3);font-size:17px}
.truth b{color:var(--ink2)}
.navbar{height:112px;flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:19px;font-weight:700;color:var(--ink3)}
.nav-item.on{color:var(--teal2)}
.nav-item svg{width:30px;height:30px}

.demo-tab,.demo-panel{display:none}
html.debug .demo-tab{display:block;position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;width:54px;min-height:150px;border-radius:0 16px 16px 0;background:rgba(11,36,30,.9);color:var(--green);writing-mode:vertical-lr;letter-spacing:4px;font-size:17px;font-weight:700}
html.debug .demo-panel.show{display:flex;position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;padding:14px;flex-direction:column;gap:6px;max-height:1600px;overflow:auto;border-radius:0 18px 18px 0;background:rgba(11,36,30,.96)}
.demo-panel a{min-height:48px;padding:0 14px;display:flex;align-items:center;border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:16px;white-space:nowrap}
.demo-panel .dp-t{color:var(--green);font-size:15px;letter-spacing:2px;padding:4px 6px}

@keyframes breathe{50%{opacity:.38;transform:scale(.78)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html.flat *,html.flat *::before,html.flat *::after{animation:none!important;transition:none!important}
</style>

        + stepRow(3,'help','','订单对不上，找现场工作人员','报订单号即可，由工作人员协助核对','联系工作人员','06-help.html','/help',SCREEN+'-start-help');
    return {layout:'state', html:
      banner('','empty', docs?'还没有保存的文档':'还没有打印订单',
        docs?'这个账号下没有已保存的文件。<b>空就是空</b>，本页不会造几条记录让页面好看。'
            :'这个账号下没有建立过打印订单。<b>空就是空</b>，本页不会造几条记录让页面好看。', ['共 0'])
      + listWrap(steps, docs?'添加或扫描之后，可以回到这里继续预览、打印和签名盖章。':'确认打印并建单后，可以回到这里查看处理进度与结果。',
          docs?'从这里开始添加文件':'从这里开始打印')
      + guide('empty-'+kind)
      + ctaBar([link('返回我的','30-my-profile.html','/profile',SCREEN+'-back-profile',{icon:'back'}),
                docs ? link('添加文件','12-file-source.html','/print/upload',SCREEN+'-primary',{primary:true,icon:'up'})
                     : link('发起打印','10-print-hub.html','/print-scan',SCREEN+'-primary',{primary:true,icon:'print'})])};
  }
  if(suffix==='error'){
    return {layout:'state', html:
      banner('warn','warn', (docs?'文档':'订单')+'这次没有加载出来',
        '当前列表没有更新。<b>本页不会拿上一次的内容冒充当前账号</b>，所以字段一律显示「—」；已有的文件和订单不会因为这次失败而消失。', ['共 —','本次未取到'])
      + listWrap([0,1,2,3].map(function(i){return slotRow(kind,i,'error');}).join(''),
          '重试不会重复创建订单，也不会改动已有文件。多次重试仍失败时，可以让现场工作人员协助查询。','本次未取到的列表结构')
      + guide('error')
      + ctaBar([link('联系工作人员','06-help.html','/help',SCREEN+'-help',{icon:'help'}),
                link('重新加载', href(kind+'-loading'), d.route, SCREEN+'-primary',{primary:true,icon:'refresh'})])};
  }
  /* ready：主内容优先，四行是四类**结果位**（角色不同、字段组合不同），值一律接口回填 */
  return {layout:'ready', html:
    fixtureNote(docs
      ? '结构演示：下面四行是「最近保存 / 生成的材料 / 扫描件 / 已签章文件」四类结果位，文件名、时间与留存期限都由接口回填，本页不显示任何真实账号数据。'
      : '结构演示：下面四行是「进行中 / 计费待确认 / 已完成 / 已结束」四类结果位，订单号、参数与状态都由接口回填，本页不显示任何真实账号数据。')
    + chips(kind, filter)
    + listWrap([0,1,2,3].map(function(i){return readyRow(kind,i);}).join(''),
        docs ? '文件到期或被删除后将无法打开；<b>需要长期保留请自己另存或打印</b>。'
             : '再次打印会重新选择文件、确认参数与价格，并<b>建立一笔新订单</b>。',
        docs?'我的文档（接口回填结构）':'我的打印订单（接口回填结构）')
    + guide('ready-'+kind)
    + ctaBar([
        /* 左键固定为「返回我的」：原来在 documents:ready 态被换成「扫描纸质材料」，
           那一态就没有回个人中心的出口了，和其它所有态不一致。 */
        link('返回我的','30-my-profile.html','/profile',SCREEN+'-back-profile',{icon:'back'}),
        docs ? link('添加新文件','12-file-source.html','/print/upload',SCREEN+'-primary',{primary:true,icon:'up'})
             : link('发起新打印','10-print-hub.html','/print-scan',SCREEN+'-primary',{primary:true,icon:'print'})])};
}

function render(state, filter){
  var kind = state.indexOf('orders-')===0 ? 'orders' : 'documents';
  var suffix = state.replace(/^(documents|orders)-/, '');
  var d = DOMAIN[kind];
  var out = viewFor(kind, suffix, filter);
  var root = document.getElementById('body-root');
  root.className = 'body ' + (out.layout==='ready' ? 'ready-layout' : 'state-layout');
  root.dataset.state = state;
  root.dataset.testid = SCREEN + '-state-' + state;
  root.innerHTML = out.html;
  renderTabs(kind, suffix);
  document.getElementById('pill-text').textContent = d.pill;
  document.getElementById('pill-dot').className = 'dot' + (suffix==='loading' ? ' breathe' : '');
  document.getElementById('ask').innerHTML = d.ask;
  document.getElementById('doing').innerHTML =
      suffix.indexOf('access-')===0 ? '每次预览或打印前都要重新取得短期访问链接；<b>旧链接不会被继续使用</b>。'
    : suffix==='login'    ? '登录后才会显示你的个人记录；<b>未登录不展示任何文件名或订单号</b>。'
    : suffix==='loading'  ? '正在读取最新记录，<b>返回前一律显示「—」</b>。'
    : suffix==='empty'    ? (kind==='documents' ? '还没有保存的文件。<b>先添加或扫描一份</b>，之后可以从这里继续办。' : '还没有打印订单。<b>确认打印并建单后</b>，可以从这里查看进度。')
    : suffix==='error'    ? '列表这次没有更新，<b>重试不会重复创建记录</b>。'
    : (kind==='documents' ? '预览、打印和签名盖章，<b>从同一份文件继续</b>。' : '进行中的订单优先显示，<b>完成后仍可查看结果</b>。');
}

if(q.get('flat')==='1') document.documentElement.classList.add('flat');
if(DEBUG) document.documentElement.classList.add('debug');
var st = q.get('state'); if(STATES.indexOf(st)<0) st = 'documents-login';
/* ready 是演示夹具态：只有 ?debug=1 才渲染。普通会话按域降级到该域的登录态，
   documents-ready→documents-login、orders-ready→orders-login，不跨域改写。 */
if(!DEBUG && (/-ready$/.test(st)||/documents-access-/.test(st))) st = st.indexOf('orders-')===0?'orders-login':'documents-login';
var filter = q.get('filter'); var kindNow = st.indexOf('orders-')===0?'orders':'documents';
var keys = DOMAIN[kindNow].filters.map(function(f){return f[0];});
if(keys.indexOf(filter)<0) filter = 'all';
render(st, filter);

function fit(){ var k=Math.min(innerWidth/1080, innerHeight/1920); var s=document.getElementById('stage'); if('zoom' in s.style) s.style.zoom=k; else s.style.transform='scale('+k+')'; }
addEventListener('resize', fit); fit();
function tick(){ var d=new Date(); document.getElementById('clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 10000);

/* 演示面板只在 ?debug=1 时填充并解除 hidden；普通 URL 下既不可见也不可聚焦。 */
if(DEBUG){
  var tab = document.getElementById('demo-tab'), panel = document.getElementById('demo-panel');
  panel.innerHTML = '<div class="dp-t">原型演示控制</div>' + STATES.map(function(x){ return '<a href="?debug=1&state='+x+'">'+x+'</a>'; }).join('');
  tab.hidden = false; panel.hidden = false;
  tab.onclick = function(){ panel.classList.toggle('show'); };
}
</script>
</body></html>
