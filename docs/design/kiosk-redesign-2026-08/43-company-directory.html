<head>

<title>找企业 · 职易达</title>
<!--
  宿主：找企业工作台（目录与详情共用一个宿主）
  route: /companies      —— 082 企业目录（list-*）
         /companies/:id  —— 083 企业详情（company-*）
  state: list-ready | list-loading | list-filtered | list-empty | list-error
         company-ready | company-sparse | company-not-found | company-error
  api:  GET /api/v1/companies?keyword&province&city&district&companyType&industry&recruitType&sourceKind&pageSize
        GET /api/v1/companies/stats（同一组筛选参数，四项统计随列表一起返回）
        GET /api/v1/companies/:id
        对齐 apps/kiosk/src/pages/companies/{CompaniesPage,CompanyDetailPage}.tsx
  筛选字典：企业类型 12 类 / 行业 18 类 / 招聘类型 5 类 / 来源 4 类逐项取自
            packages/shared/src/types/company.ts 与 React 的 RECRUIT_TYPE_LABEL，本页不另造分类。
            省市区在 React 中使用完整全国行政区划联动；静态稿允许输入全称，不用少量城市冒充完整字典。
  真话边界：
    ① 不预置企业名称、在招岗位数、今日新增数、参展数；统计与计数缺失时留空，不写 0，不写「实时」。
    ② 媒体（封面 / 宣传片）只在 API 返回已审核地址时渲染；缺失时整区不留假图位（company-sparse）。
    ③ 在招岗位为 0 是「确实为 0」：入口置灰并常显「该企业当前没有在招岗位」。
    ④ 来源主页无可核验地址时 fail-closed 置灰；本页不出现平台内投递或收简历动作，
       「去来源平台投递」只在岗位详情按该岗位来源链接单独放行。
  ai-mode: AI-CONTEXT（082 / 083 共用页内辅助，不自动调用）
  ai-input: 用户主动选择的本人简历，或手动填写的求职方向；只读取当前真实返回的企业与岗位字段
  ai-consent: 用户必须主动选择输入，不得静默读取简历、收藏、浏览记录或画像
  ai-output: 企业与岗位的可核对比较依据和浏览先后建议；不生成匹配百分比，不改写企业事实
  ai-failure: 缺输入、本人简历不可用、AI 服务不可用均常显原因，不生成排序或推荐结果
  ai-fallback: 地区、行业、来源筛选和企业/岗位浏览始终可用，AI 失败不阻断主任务
  ai-persistence: 本页排序建议仅当前会话临时使用，默认不写入 AI 记录，清场时删除输入
  原型演示控制：状态只通过 ?state= 切换（?debug=1 显示演示面板），页面无计时器推进业务状态
  验收范围：静态原型表现；不证明 React 接线、API 可用、生产数据或硬件链路
-->
<link rel="stylesheet" href="directory-workspaces.css">
</head>
<body>
