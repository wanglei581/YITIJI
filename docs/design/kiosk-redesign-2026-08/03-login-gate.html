<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 职易达</title>
<!--
  route: /login（apps/kiosk/src/pages/auth/LoginPage.tsx）
  回跳来源（**参数名是 from，不是 returnTo**，LoginPage.tsx:97-109）：
    ① location.state.from —— 本站自己写进 history state 的字符串，优先；
    ② ?from= —— query 通道，可被外部构造，所以同样要过安全校验；
    ③ 两者都不合法 → '/'。
    安全判定的唯一实现是 src/auth/returnPath.ts 的 isSafeInternalPath()：
      必须以 '/' 开头、不得以 '//' 开头、不得含反斜线、不得是 /login 自身（isLoginPath）。
    静态页只有 query 一条通道，所以本页读 ?from=；并在两处比运行时更严（静态页没有
    React Router 兜底）：'//' 出现在任何位置都判非法；含控制字符（U+0000-U+001F、U+007F）判非法。
    非法值一律按 '/' 处理，且**不回显原值**（回显等于给了一个能在登录页写字的注入点），
    只在页头如实说明「来源参数不合法，已按回首页处理」。
  mode:  phone（运行时默认 tab）| qr（扫码登录 tab，ScanQrLoginPanel）
  state: phone-idle | phone-sending | phone-code-sent | phone-send-limited | phone-send-failed |
         phone-verifying | phone-code-invalid | phone-code-expired |
         qr-loading | qr-ready | qr-expired | qr-confirmed | qr-error
         mode 与 state 冲突时（例如 ?mode=phone&state=qr-ready）**以状态前缀为准**：
         状态是页面真正在画的东西，tab 只是它的投影。?mode=qr 不带 state 时落到 qr-loading。
  api:   POST /member/sms-code → 成功 { sent:true, cooldownSeconds=60, expiresInSeconds=300 }
                                 SMS_SEND_FAILED(502) → 服务端把刚写入的验证码与冷却一起删掉，可立刻重试
                                 SMS_TOO_FREQUENT / IP / DEVICE / PROVIDER_RATE_LIMIT(429) → 稍后再试
                                 SMS_DAILY_LIMIT / PROVIDER_PHONE_DAILY_LIMIT(429)         → 明天再试
         POST /member/login  → SMS_CODE_INVALID / SMS_CODE_EXPIRED / SMS_CODE_LOCKED 三条不同下一步
         POST /local/qr-login/create → { ticketId, qrContent, expiresInSeconds }，QR_TICKET_TTL=180 秒
         GET  /local/qr-login/status → pending | confirmed | expired（expiresInSeconds 是剩余值，不是 180）
         POST /local/qr-login/claim  → 一体机凭票据换登录态；claim 会失败，失败后要求重扫
  fallback: 每个失败态都保留「改用另一种登录方式」「不登录继续」「返回首页」三条实体出口（≥56px）
  真实性:  静态页不生成可扫描二维码、不声称短信已发送、不声称已登录。
           手机确认只等于 confirmed，一体机还要 claim 成功才登录，因此本页没有「登录成功」屏。
           协议勾选发生在创建票据/发码**之前**（ScanQrLoginPanel.refresh() 里 !agreed 直接 return；
           LoginPage.handleQrLoginSuccess 在 !agreed 时也会拦下 claim 成功回调）。所以本页的
           发码、创建/刷新二维码、claim 与确认登录四个 CTA 在未勾协议时**一律不可用，且原因常显**；
           未勾协议时扫码区也不会说「正在申请票据」——那一步根本没发生。
  AI 边界: 本 route 为 AI-NONE。AI 不判定身份、手机号归属、验证码有效性和登录结果。
  原型演示控制: ?mode= / ?state= 只切换展示状态，不驱动任何业务；?debug=1 显演示面板，?flat=1 关非必要动效。
                页内所有 tab / mode / state 跳转都会带上 from、debug、flat，不会走一步丢一个参数。
-->
<style>
/* 弹出式数字键盘 —— 公共终端无物理键盘；inputmode 只对移动端有效，
   Windows Edge/Chrome 全屏 Kiosk 下不弹任何系统键盘，必须页内自带。
   点输入框弹出、点遮罩收起；不调系统键盘，避免其设置入口造成 Kiosk 逃逸。 */
#kbmask{position:absolute;inset:0;z-index:40;background:rgba(11,36,30,.18);display:none;}
#kbmask.on{display:block;}
#kbpad{position:absolute;left:0;right:0;bottom:0;z-index:41;transform:translateY(102%);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);background:#fffdf8;
  border-top:1px solid #d4cdb6;border-radius:28px 28px 0 0;padding:22px 26px 26px;
  box-shadow:0 -14px 40px rgba(11,36,30,.14);}
#kbpad.on{transform:translateY(0);}
#kbpad .kbhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
#kbpad .kbfor{font-size:19px;color:#6b857c;}
#kbpad .kbfor b{color:#10302b;}
#kbpad .kbdone{height:56px;padding:0 26px;border-radius:16px;border:1px solid #d4cdb6;
  background:#f5f2e9;font-size:20px;font-weight:700;color:#10302b;cursor:pointer;}
#kbpad .kbrow{display:flex;gap:12px;margin-top:12px;}
#kbpad .kbk{flex:1;height:88px;border-radius:18px;border:1px solid #d4cdb6;background:#f5f2e9;
  font-size:34px;font-weight:800;color:#10302b;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .14s;}
#kbpad .kbk:active{transform:scale(.97);background:#e0f2ec;border-color:#1f9e86;}
#kbpad .kbk.fn{font-size:22px;font-weight:700;}
#kbpad .kbk.del{background:#0b241e;color:#fff;border-color:#0b241e;}
:root{
  --paper:#f5f2e9; --surface:#fffdf8; --ink:#10302b; --ink-2:#3d5a52; --ink-3:#6b857c;
  --deep:#0b241e; --deep-2:#123a30; --emerald:#2ee6a8;
  --teal:#1f9e86; --teal-d:#157a67; --teal-soft:#e0f2ec;
  --slate:#3f68b0; --slate-d:#35608f; --slate-soft:#e6ecf7;
  --clay:#b8683c; --clay-d:#9e5330; --clay-soft:#f7ebe1;
  --wheat:#a9781f; --wheat-d:#8a6219; --wheat-soft:#f3ecda;
  --line:#e3ddcb; --line-2:#d4cdb6;
  --cinnabar:#b23a2e; --cinnabar-d:#963227; --cinnabar-soft:#f6e4e1;
  --r-lg:32px; --r-md:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e8e3d3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{width:1080px;height:1920px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.serif{font-family:"Songti SC","STSong","SimSun",serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

.topbar{flex:none;height:104px;display:flex;align-items:center;gap:18px;padding:0 36px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{flex:none;width:64px;height:64px;border-radius:20px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.logo{flex:none;display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.logo-name{font-size:26px;font-weight:700;letter-spacing:2px}
.topbar .sp{flex:1}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 22px;border-radius:28px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);font-size:19px;font-weight:600;max-width:520px;overflow:hidden;white-space:nowrap}
.pill .dot{width:12px;height:12px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.ok{background:var(--teal-soft);color:var(--teal-d);border-color:transparent}.pill.ok .dot{background:var(--teal)}
.pill.warn{background:var(--wheat-soft);color:var(--wheat-d);border-color:transparent}.pill.warn .dot{background:var(--wheat)}
.pill.bad{background:var(--cinnabar-soft);color:var(--cinnabar-d);border-color:transparent}.pill.bad .dot{background:var(--cinnabar)}
.clock{flex:none;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}

.head{flex:none;padding:24px 44px 0}
.head .no{font-size:19px;letter-spacing:5px;color:var(--teal-d);font-weight:700;margin-bottom:8px}
.head h1{font-size:44px;font-weight:700;letter-spacing:1px}
.head .sub{margin-top:8px;font-size:21px;color:var(--ink-2);line-height:1.5}
.head .sub b{color:var(--ink);font-weight:600}
.from-note{margin-top:10px;padding:12px 20px;border-radius:16px;background:var(--wheat-soft);border:1px solid #e6d8b4;color:var(--wheat-d);font-size:18px;line-height:1.5;font-weight:600}
.from-note[hidden]{display:none}

.tabs{flex:none;display:flex;gap:14px;margin:18px 44px 0}
.tab{flex:1;min-height:88px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;gap:16px;padding:0 24px}
.tab .ti{flex:none;width:56px;height:56px;border-radius:18px;background:var(--paper);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.tab .tb{flex:1;min-width:0}
.tab .tn{display:block;font-size:25px;font-weight:700}
.tab .td{display:block;margin-top:4px;font-size:17px;color:var(--ink-3);line-height:1.35}
.tab.on{background:var(--deep);border-color:var(--deep);color:#f2efe4}
.tab.on .ti{background:rgba(46,230,168,.16);color:var(--emerald)}
.tab.on .td{color:rgba(242,239,228,.66)}

.body{flex:1;min-height:0;display:flex;flex-direction:column}
.scrollarea{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
/* 触屏可供性：公共终端用户不会主动试探能不能滑，滚动条必须常驻可见。 */
.scrollarea{scrollbar-width:thin;scrollbar-color:var(--line-2,#d4cdb6) transparent}
.scrollarea::-webkit-scrollbar{width:10px}
.scrollarea::-webkit-scrollbar-thumb{background:var(--line-2,#d4cdb6);border-radius:6px}
.scrollarea::-webkit-scrollbar-track{background:transparent}
.sec{flex:none;padding:0 44px;margin-top:22px}
.sec.last{margin-bottom:18px}
.sec-label{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.sec-label .no{font-size:20px;color:var(--teal-d);font-weight:700;letter-spacing:2px}
.sec-label .t{font-size:29px;font-weight:700}
.sec-label .hint{font-size:19px;color:var(--ink-3);margin-left:auto}

.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px}
.field+.field{margin-top:14px}
.field label{display:block;font-size:21px;font-weight:700;margin-bottom:10px}
.field .row{display:flex;align-items:center;gap:14px}
.field input{flex:1;min-width:0;height:82px;padding:0 22px;border:1px solid #9eb4aa;border-radius:20px;background:#fffefa;font-size:30px;letter-spacing:3px;font-variant-numeric:tabular-nums}
.field input::placeholder{color:#a3b1ab;letter-spacing:1px;font-size:24px}
.field input:disabled{background:#eef0ec;border-color:var(--line-2);color:var(--ink-3)}
.field .side{flex:none;min-height:82px;min-width:212px;padding:0 24px;border-radius:20px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.field .side[aria-disabled=true]{opacity:.55;cursor:default}
.field .echo{margin-top:12px;font-size:20px;color:var(--ink-2)}
.field .echo b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.reason{margin-top:10px;font-size:18px;line-height:1.5;color:var(--wheat-d);font-weight:600}

.state{border-radius:var(--r-lg);padding:26px 32px;border:1px solid var(--line);background:var(--surface)}
.state[data-kind=error]{background:var(--cinnabar-soft);border-color:#e8c9c3}
.state[data-kind=warn]{background:var(--wheat-soft);border-color:#e6d8b4}
.state[data-kind=lock]{background:var(--slate-soft);border-color:#cfdcee}
.state[data-kind=info]{background:var(--teal-soft);border-color:#c6e4da}
.state-h{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700}
.state-p{margin-top:11px;font-size:21px;line-height:1.6;color:var(--ink-2)}
.state-p b{color:var(--ink);font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px}
.card h3{font-size:24px;font-weight:700;display:flex;align-items:center;gap:12px}
.card .ci{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.card p{margin-top:10px;font-size:19px;line-height:1.55;color:var(--ink-2)}
.card p b{color:var(--ink);font-weight:600}
.entries{display:flex;flex-direction:column;gap:14px}
.entry{display:flex;align-items:center;gap:20px;min-height:126px;padding:20px 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.entry .ei{flex:none;width:70px;height:70px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.entry .eb{flex:1;min-width:0}
.entry .en{display:block;font-size:26px;font-weight:700}
.entry .ed{display:block;margin-top:6px;font-size:19px;line-height:1.45;color:var(--ink-2)}
.entry .ego{flex:none;width:60px;height:60px;border-radius:50%;background:var(--deep);color:var(--emerald);display:flex;align-items:center;justify-content:center}

.qrwrap{display:flex;gap:22px;align-items:stretch}
.qrslot{flex:none;width:440px;height:440px;border-radius:var(--r-lg);border:2px dashed var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center}
.qrslot .qi{width:96px;height:96px;border-radius:26px;background:var(--paper);color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.qrslot b{font-size:23px;font-weight:700}
.qrslot span{font-size:18px;line-height:1.5;color:var(--ink-3);max-width:330px}
.qrside{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;font-size:20px;line-height:1.5;color:var(--ink-2)}
.steps .sn{flex:none;width:38px;height:38px;border-radius:12px;background:var(--teal-soft);color:var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.steps b{color:var(--ink);font-weight:600}

.agree{flex:none;margin:0 44px 12px;display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.agree input[type=checkbox]{flex:none;width:48px;height:48px;accent-color:var(--teal-d)}
.agree label{flex:1;min-width:0;font-size:20px;line-height:1.5;color:var(--ink-2);display:flex;align-items:center;min-height:48px}
.agree a{min-height:48px;display:inline-flex;align-items:center;padding:0 10px;color:var(--teal-d);font-weight:700;text-decoration:underline}
/* 门禁原因常显：不是只写进 aria-label，屏幕上看得见为什么按不动 */
.gate-note{flex:none;margin:0 44px 14px;padding:14px 22px;border-radius:18px;font-size:19px;line-height:1.5;font-weight:600;background:var(--wheat-soft);border:1px solid #e6d8b4;color:var(--wheat-d)}
.gate-note.ok{background:var(--teal-soft);border-color:#c6e4da;color:var(--teal-d)}

.ctabar{flex:none;padding:18px 44px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:16px}
.btn{min-height:76px;padding:0 30px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700;text-align:center;flex:1}
.btn.primary{background:var(--deep);color:var(--emerald)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn[aria-disabled=true]{cursor:default}
.btn.primary[aria-disabled=true]{background:#dfe4e0;color:#5f716a}
.btn.ghost[aria-disabled=true]{opacity:.55}
.truth{flex:none;padding:14px 44px 16px;border-top:1px solid var(--line);display:flex;gap:26px;background:var(--paper)}
.truth div{flex:1;font-size:18px;line-height:1.5;color:var(--ink-3)}
.truth b{color:var(--ink-2);font-weight:600}

.dot16{width:16px;height:16px;border-radius:50%;background:var(--teal);display:inline-block;flex:none}
@keyframes k-breathe{0%,100%{opacity:.5}50%{opacity:1}}
.breathe{animation:k-breathe 1600ms ease-in-out infinite}
.demo-tab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:90;width:56px;min-height:150px;background:rgba(11,36,30,.9);color:var(--emerald);border-radius:0 16px 16px 0;writing-mode:vertical-lr;letter-spacing:4px;font-size:17px;font-weight:700}
.demo-panel{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:91;display:none;background:rgba(11,36,30,.96);border-radius:0 18px 18px 0;padding:14px;flex-direction:column;gap:6px;max-height:1400px;overflow:auto}
.demo-panel.show{display:flex}
.demo-panel .dp-t{color:var(--emerald);font-size:15px;font-weight:700;letter-spacing:2px}
.demo-panel a{display:flex;align-items:center;min-height:48px;color:#f2efe4;font-size:16px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.07);white-space:nowrap}
.demo-panel a.on{background:rgba(46,230,168,.22);color:var(--emerald);font-weight:700}
html:not(.debug) .demo-tab,html:not(.debug) .demo-panel{display:none!important}
.flat *{backdrop-filter:none!important;box-shadow:none!important;filter:none!important;animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="kbmask" aria-hidden="true"></div>
  <div id="kbpad" role="group" aria-label="数字键盘" data-testid="login-gate-keypad" aria-hidden="true">
    <div class="kbhead"><span class="kbfor">正在输入：<b id="kbfor">手机号</b></span>
      <button type="button" class="kbdone" data-kb="done">收起键盘</button></div>
    <div class="kbrow"><button type="button" class="kbk" data-kb="1">1</button><button type="button" class="kbk" data-kb="2">2</button><button type="button" class="kbk" data-kb="3">3</button></div>
    <div class="kbrow"><button type="button" class="kbk" data-kb="4">4</button><button type="button" class="kbk" data-kb="5">5</button><button type="button" class="kbk" data-kb="6">6</button></div>
    <div class="kbrow"><button type="button" class="kbk" data-kb="7">7</button><button type="button" class="kbk" data-kb="8">8</button><button type="button" class="kbk" data-kb="9">9</button></div>
    <div class="kbrow"><button type="button" class="kbk fn" data-kb="clear">清空</button><button type="button" class="kbk" data-kb="0">0</button><button type="button" class="kbk fn del" data-kb="del">删除</button></div>
  </div>
  <header class="topbar">
    <a class="back" id="back" href="01-home.html" data-route="/" aria-label="返回首页"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#10302b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="logo"><div class="logo-mark serif">职</div><div class="logo-name">职易达</div></div>
    <div class="sp"></div>
    <div class="pill" id="pill"><span class="dot" id="pill-dot" aria-hidden="true"></span><span id="pill-txt">登录结果以服务端返回为准</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="head">
    <div class="no">SIGN IN</div>
    <h1 class="serif" id="head-title">登录后继续办理</h1>
    <div class="sub" id="head-sub">登录成功后回到 <b id="return-to">首页</b>。不登录也能用公开与无需账户的服务。</div>
    <div class="from-note" id="from-note" data-testid="login-gate-from-note" hidden></div>
  </div>

  <nav class="tabs" aria-label="登录方式">

var q=new URLSearchParams(location.search);
/* ── 回跳来源 ?from= ───────────────────────────────────────────────
   与 src/auth/returnPath.ts 的 isSafeInternalPath() 对齐，另加两条更严的静态页规则：
   '//' 出现在任何位置即非法；含控制字符（码位 < 32 或 == 127）即非法。
   非法值按 '/' 处理且不回显原值。 */
var RAW_FROM=q.get('from');
function hasControlChar(p){
 for(var i=0;i<p.length;i++){var c=p.charCodeAt(i);if(c<32||c===127)return true}
 return false;
}
function isSafeInternalPath(p){
 if(typeof p!=='string'||p==='')return false;
 if(p.charAt(0)!=='/')return false;
 if(p.indexOf('//')>=0)return false;
 if(p.indexOf('\\')>=0)return false;
 if(hasControlChar(p))return false;
 if(p==='/login'||p.indexOf('/login?')===0||p.indexOf('/login#')===0||p.indexOf('/login/')===0)return false;
 return true;
}
var FROM=isSafeInternalPath(RAW_FROM)?RAW_FROM:'';
var FROM_REJECTED=(RAW_FROM!==null&&RAW_FROM!=='')&&FROM==='';

function P(mode,state){
 var s='?mode='+mode;
 if(state)s+='&state='+state;
 if(FROM)s+='&from='+encodeURIComponent(FROM);
 if(q.get('debug')==='1')s+='&debug=1';
 if(q.get('flat')==='1')s+='&flat=1';
 return s;
}

var root=document.getElementById('body-root');
var KEY_PHONE='kiosk-login-phone';
function readPhone(){try{return sessionStorage.getItem(KEY_PHONE)||''}catch(e){return''}}
function savePhone(v){try{sessionStorage.setItem(KEY_PHONE,v)}catch(e){}}
function mask(v){return v.length===11?v.slice(0,3)+'****'+v.slice(7):''}
function render(mode,state){
 var view=V[state]();
 root.setAttribute('data-mode',mode);
 root.setAttribute('data-state',state);
 root.setAttribute('data-testid',SCREEN+'-state-'+state);
 document.getElementById('scrollarea').innerHTML=view.body;
 document.getElementById('ctabar').innerHTML=view.cta;
 document.getElementById('tab-phone').className='tab'+(mode==='phone'?' on':'');
 document.getElementById('tab-qr').className='tab'+(mode==='qr'?' on':'');
 document.getElementById('tab-phone').setAttribute('aria-current',mode==='phone'?'page':'false');
 document.getElementById('tab-qr').setAttribute('aria-current',mode==='qr'?'page':'false');
 /* tab 也是页内跳转：不能一点 tab 就把 from 丢了 */
 document.getElementById('tab-phone').setAttribute('href',P('phone','phone-idle'));
 document.getElementById('tab-qr').setAttribute('href',P('qr','qr-loading'));
 var p=document.getElementById('pill');
 p.className='pill'+(PILL[state][0]?' '+PILL[state][0]:'');
 document.getElementById('pill-txt').textContent=PILL[state][1];
 document.getElementById('pill-dot').className='dot'+(state==='phone-sending'||state==='phone-verifying'?' breathe':'');
 document.getElementById('head-title').textContent=TITLE[state][0];
 document.getElementById('head-sub').innerHTML=TITLE[state][1];
 var rt=document.getElementById('return-to');
 if(rt)rt.textContent=FROM||'首页';
 var fn=document.getElementById('from-note');
 if(FROM_REJECTED){
  fn.textContent='来源参数不合法，已按回首页处理：只接受本站内部路径（/ 开头，不含 //、反斜线、控制字符，且不是 /login 自身）。这里不回显你传进来的原值。';
  fn.hidden=false;
 }else{
  fn.textContent='';
  fn.hidden=true;
 }
 wire(state);
}
/* 本地表单交互：只做真实的必填校验与按钮启停，不发请求、不伪造结果 */
function wire(state){
 var phone=document.getElementById('phone'),code=document.getElementById('code'),
     agree=document.getElementById('agree'),send=document.getElementById('send-btn'),
     pSend=document.getElementById('primary-send'),pConfirm=document.getElementById('primary-confirm'),
     echo=document.getElementById('phone-echo'),note=document.getElementById('gate-note');
 var gates=[].slice.call(document.querySelectorAll('[data-gate=agree]'));
 var stored=readPhone();
 if(phone){phone.value=stored;phone.addEventListener('input',function(){phone.value=phone.value.replace(/\D/g,'');savePhone(phone.value);refresh()})}
 if(echo)echo.textContent=mask(stored)||'未获取到本次输入的手机号';
 if(code)code.addEventListener('input',function(){code.value=code.value.replace(/\D/g,'');refresh()});
 if(agree)agree.addEventListener('change',refresh);
 function ok(el,on,label){
  if(!el)return;
  el.setAttribute('aria-disabled',on?'false':'true');
  if(label)el.setAttribute('aria-label',label);
 }
 /* qr-loading 是「有没有发起过申请」的分界：没勾协议就没发起过，屏幕上必须这么写 */
 function paintQrLoading(agreed){
  if(state!=='qr-loading')return;
  var t=document.getElementById('qr-slot-title'),d=document.getElementById('qr-slot-desc'),h=document.getElementById('qr-hint');
  if(!t||!d)return;
  if(agreed){
   t.textContent='正在申请登录二维码';
   d.innerHTML='请求已发出，<b>票据由服务端返回</b>。没有拿到票据之前，这里不会出现任何可扫的图形。';
   if(h)h.textContent='已勾协议，正在向服务端申请票据';
  }else{
   t.textContent='等待你勾选协议';
   d.innerHTML='没有勾选协议之前，这台机器<b>不会</b>向服务端申请票据，这里也不会出现任何可扫的图形。';
   if(h)h.textContent='勾选协议后才会向服务端申请票据';
  }
  var pill=document.getElementById('pill');
  pill.className='pill'+(agreed?'':' warn');
  document.getElementById('pill-txt').textContent=agreed?'正在申请登录二维码':'未勾协议 · 尚未申请票据';
  document.getElementById('pill-dot').className='dot'+(agreed?' breathe':'');
 }
 function paintNote(agreed,phoneOk,codeOk){
  var t,cls='';
  if(PENDING[state]&&!(state==='qr-loading'&&!agreed)){
   t='请求已经发出，结果由服务端返回；这一步不会因为多点几下而提前结束。';
  }else if(!agreed){
   t='未勾选协议：不会发码、不会创建二维码，也不会写入登录态。请先勾选上面的协议。';
  }else if(send&&!phoneOk){
   t='已勾选协议。还差一个 11 位本人手机号，填完才能获取验证码。';
  }else if(pConfirm&&!codeOk){
   t='已勾选协议。填完 6 位验证码后才能提交核验。';
  }else{
   t='已勾选协议。发码、生成二维码与提交核验都由服务端执行，本页不预判结果。';cls=' ok';
  }
  note.className='gate-note'+cls;
  note.textContent=t;
 }
 function refresh(){
  var agreed=!!(agree&&agree.checked);
  var phoneVal=phone?phone.value:stored;
  var phoneOk=phoneVal.length===11;
  var codeOk=!!(code&&!code.disabled&&code.value.length===6);
  ok(send,phoneOk&&agreed,phoneOk&&agreed?'':'请先填写 11 位手机号并勾选协议');
  /* phone-idle 已移除底部重复的取码按钮，pSend 在该态不存在；ok() 内有 !el 守卫。
     其它仍带 primary-send 的状态继续沿用这条启停逻辑。 */
  ok(pSend,phoneOk&&agreed,phoneOk&&agreed?'获取验证码':'获取验证码（请先填写 11 位手机号并勾选协议）');
  ok(pConfirm,codeOk&&agreed,codeOk&&agreed?'确认登录':'确认登录（请先填写 6 位验证码并勾选协议）');
  for(var i=0;i<gates.length;i++){
   var lb=gates[i].getAttribute('data-label')||'继续';
   ok(gates[i],agreed,agreed?lb:lb+'（请先勾选协议）');
  }
  paintQrLoading(agreed);
  paintNote(agreed,phoneOk,codeOk);
 }
 function go(url){location.href=url}
 function bind(el,url){
  if(!el)return;
  el.addEventListener('click',function(){if(el.getAttribute('aria-disabled')==='false')go(url)});
  el.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&el.getAttribute('aria-disabled')==='false'){e.preventDefault();go(url)}});
 }
 bind(send,P('phone','phone-sending'));
 bind(pSend,P('phone','phone-sending'));
 bind(pConfirm,P('phone','phone-verifying'));
 for(var g=0;g<gates.length;g++) bind(gates[g],gates[g].getAttribute('data-go'));
 refresh();
}
/* mode 与 state 的关系：state 是真值，mode 只是它的投影。
   ?mode=qr 不带 state → qr-loading；两者冲突 → 状态前缀说了算。 */
var mode=q.get('mode')==='qr'?'qr':'phone';
var state=q.get('state');
if(STATES.indexOf(state)<0) state=mode==='qr'?'qr-loading':'phone-idle';
mode=state.indexOf('qr-')===0?'qr':'phone';
render(mode,state);

/* 原型演示控制（非产品功能）：只切 data-state，并保留 from */
var panel=document.getElementById('demo-panel');
for(var i=0;i<STATES.length;i++){
 var a=document.createElement('a');
 var m=STATES[i].indexOf('qr-')===0?'qr':'phone';
 var href=P(m,STATES[i]);
 if(href.indexOf('debug=1')<0)href+='&debug=1';
 a.href=href;
 a.textContent=STATES[i];
 if(STATES[i]===state)a.className='on';
 panel.appendChild(a);
}
if(q.get('debug')==='1')document.documentElement.classList.add('debug');
document.getElementById('demo-tab').addEventListener('click',function(){panel.classList.toggle('show')});
/* 时钟：只刷新顶栏文本，不推进任何业务状态 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(q.get('flat')==='1')document.getElementById('stage').classList.add('flat');

/* ---------- 弹出式数字键盘（点输入框弹出 / 点遮罩收起） ----------
   只做输入，不触发发码或登录；发码与登录仍由既有按钮与服务端决定。 */
(function(){
  var pad=document.getElementById('kbpad'), mask=document.getElementById('kbmask'), forEl=document.getElementById('kbfor');
  if(!pad||!mask) return;
  var target=null;
  var LABEL={phone:'手机号', code:'短信验证码'};
  function open(el){
    target=el;
    forEl.textContent=LABEL[el.id]||'数字';
    pad.classList.add('on'); mask.classList.add('on');
    pad.setAttribute('aria-hidden','false'); mask.setAttribute('aria-hidden','false');
  }
  function close(){
    target=null;
    pad.classList.remove('on'); mask.classList.remove('on');
    pad.setAttribute('aria-hidden','true'); mask.setAttribute('aria-hidden','true');
  }
  // 点输入框弹出（只对数字输入框；禁用/只读的不弹）
  document.addEventListener('focusin',function(e){
    var el=e.target;
    if(el&&el.tagName==='INPUT'&&(el.id==='phone'||el.id==='code')&&!el.disabled&&!el.readOnly) open(el);
  });
  document.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('#phone,#code');
    if(el&&!el.disabled&&!el.readOnly){ open(el); return; }
  });
  // 点遮罩（键盘以外任何地方）收起
  mask.addEventListener('click',close);
  // 按键：不夺输入框焦点
  pad.addEventListener('pointerdown',function(e){ if(e.target.closest('[data-kb]')) e.preventDefault(); });
  pad.addEventListener('click',function(e){
    var k=e.target.closest('[data-kb]'); if(!k) return;
    var v=k.getAttribute('data-kb');
    if(v==='done'){ close(); return; }
    if(!target) return;
    if(v==='clear') target.value='';
    else if(v==='del') target.value=target.value.slice(0,-1);
    else {
      var max=parseInt(target.getAttribute('maxlength')||'0',10);
      if(!max||target.value.length<max) target.value+=v;
    }
    target.dispatchEvent(new Event('input',{bubbles:true}));
  });
})();
</script>
