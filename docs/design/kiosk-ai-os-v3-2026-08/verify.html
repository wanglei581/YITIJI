<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>自检台 — 全页 × 全阶段 × 四态</title>
<style>
  body { margin:0; padding:22px 26px 60px; background:#0a0f10; color:#e8f1f1;
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; font-size:14px; }
  h1 { font-family:"Songti SC","SimSun",serif; font-size:22px; margin:0 0 6px; }
  p.s { margin:0 0 16px; color:#8ba4a9; line-height:1.7; }
  button { height:40px; padding:0 18px; border-radius:99px; border:1px solid rgba(52,224,168,.4);
           background:transparent; color:#34e0a8; cursor:pointer; font-size:14px; }
  table { border-collapse:collapse; margin-top:18px; width:100%; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid rgba(232,241,241,.1); font-size:13px; }
  th { color:#6f8c90; font-weight:500; letter-spacing:.08em; }
  td.ok { color:#34e0a8; } td.bad { color:#ff6f5e; font-weight:600; }
  #sum { margin-top:14px; font-size:15px; }
  iframe { position:fixed; left:0; top:0; width:1080px; height:1920px; border:0;
            opacity:.01; pointer-events:none; z-index:-1; }
  code { color:#a8f3d8; }
</style>
</head>
<body>
  <h1>自检台 · 全页 × 全阶段 × 四态</h1>
  <p class="s">
    逐页在 1080×1920 iframe 里加载，遍历每个阶段与四态，调用页面内置的 <code>window.v3Audit()</code>，
    检查四项：主体纵向溢出 / 横向溢出 / 触控目标 &lt;48px / 违禁文案。<br>
    只报不通过的组合。全绿说明这一轮改动没有引入回归。
  </p>
  <button id="run">开始全量自检</button>
  <div id="sum"></div>
  <table id="out"><thead><tr><th>页面</th><th>阶段</th><th>态</th><th>纵向溢出</th><th>横向</th><th>触控&lt;48</th><th>违禁文案</th></tr></thead><tbody></tbody></table>

<script>
const PAGES = [
  ['P01 首页',        '01-home-v5.html',        [null]],
  ['P06 打印工作台',  '06-print-workbench.html',['s1','s2','s3','s4','s5','s6']],
  ['P07 扫描工作台',  '07-scan-workbench.html', ['s1','s2','s3','s4']],
  ['P08 文件加工台',  '08-file-tools.html',     ['t1','t2','t3']],
  ['P09 简历工作台',  '09-resume-workbench.html',['s1','s2','s3','s4','s5']],
  ['P10 访谈式生成',  '10-resume-interview.html',['s1','s2','s3']],
  ['P11 岗位匹配',    '11-jobfit-compare.html', ['s1','s2']],
  ['P12 材料工厂',    '12-material-factory.html',['t1','t2','t3','t4']]
]
const STATES = ['default','first','ai-down','device-off']

function load (file) {
  return new Promise(res => {
    const f = document.createElement('iframe')
    f.src = file + '?capture=1&theme=warm'
    f.onload = () => setTimeout(() => res(f), 500)   // 等入场动效与 JS 初始化跑完
    document.body.appendChild(f)
  })
}

document.getElementById('run').onclick = async () => {
  const tb = document.querySelector('#out tbody'); tb.innerHTML = ''
  const sum = document.getElementById('sum')
  let total = 0, failed = 0
  sum.textContent = '正在跑…'
  for (const [name, file, stages] of PAGES) {
    const f = await load(file)
    const w = f.contentWindow, d = f.contentDocument
    const scr = d.querySelector('.screen')
    for (const stage of stages) for (const state of STATES) {
      if (stage) scr.setAttribute('data-stage', stage)
      scr.setAttribute('data-state', state)
      if (w.v3ApplyVisibility) w.v3ApplyVisibility()
      // 不能用 iframe 的 rAF：离屏 iframe 被 Chrome 重度节流，96 个组合会跑到天亮
      await new Promise(r => setTimeout(r, 16))
      w.v3Audit()
      const a = w.__V3_AUDIT__
      const box = d.querySelector('.work') || d.querySelector('.main') || d.querySelector('.vbody')
      const ov = box ? Math.max(0, box.scrollHeight - box.clientHeight) : 0
      total++
      const bad = ov || a.横向溢出 || a.触控不足48 || a.违禁文案.length
      if (bad) {
        failed++
        const tr = document.createElement('tr')
        tr.innerHTML = `<td>${name}</td><td>${stage || '—'}</td><td>${state}</td>` +
          `<td class="${ov?'bad':'ok'}">${ov}</td><td class="${a.横向溢出?'bad':'ok'}">${a.横向溢出}</td>` +
          `<td class="${a.触控不足48?'bad':'ok'}">${a.触控不足48}</td>` +
          `<td class="${a.违禁文案.length?'bad':'ok'}">${a.违禁文案.join(',') || 0}</td>`
        tb.appendChild(tr)
      }
    }
    f.remove()
  }
  sum.innerHTML = failed
    ? `<b style="color:#ff6f5e">${failed} / ${total} 个组合不通过</b>（下表只列不通过的）`
    : `<b style="color:#34e0a8">全部 ${total} 个组合通过</b>`
  window.__VERIFY__ = { total, failed }
}
</script>
</body>
</html>
