<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V3 全站回归台</title>
<!--
  ============================================================
  V3 · 全站回归台（可复现版）
  ------------------------------------------------------------
  为什么要有这个文件：

  上一轮回归用的是「跑完就删」的临时驱动台。结果是 Codex 终审时给出
  「候选稿在终审过程中仍在变化，当前不存在可复现的最终版」——
  没有留下驱动台，就没有人能重跑出同一份结论，报告也就不能当作定版依据。
  所以驱动台必须进仓库、必须版本化、必须能被别人原样跑出同样的数。

  ── 测量环境（不照做会量出不同结果，这是实打实踩过的坑）──────
  1) 必须走 HTTP，不能走 file://
     file:// 下 iframe 跨文档访问被 Chrome 挡住，驱动台读不到子页 DOM。
     在设计稿目录起：  python3 -m http.server 8899
     然后开：          http://localhost:8899/tools/regress.html

  2) 窗口必须 1120×2010
     舞台是 1080×1920。窗口更小时 stage.js 的 fit() 会整体缩放，
     一切像素测量（溢出、留白、可见比例）都跟着失真。

  3) 每页每轮都要清 localStorage
     themes.html 会把主题写进 localStorage。不清的话，同一份代码
     在不同轮次会量出 0 / 44 / 68 三种不同的溢出值——这个坑吃过一次。
     驱动台在每次装载前清一遍，并在 URL 上钉死 ?theme=warm。

  4) 关 HTTP 缓存（DevTools → Network → Disable cache）
     否则改完代码重跑，量的还是旧文件。

  ── 审计驱动顺序（少一步就漏检）──────────────────────────
     screen.setAttribute('data-state', st)
     screen.setAttribute('data-stage', sg)
     window.v3ApplyVisibility()
     void document.body.offsetHeight      // 强制回流，否则量到的是旧版面
     window.v3AuditPlus()

  ── 轴发现（这一段是本文件最要紧的地方）────────────────────
  V3 的页面状态由挂在 .screen 上的 data-* 轴决定。麻烦在于
  data-src / data-file / data-redact 这类轴是**运行时才加到 .screen 上**的，
  静态扫 HTML 根本看不见。上一轮就是这么漏检的：审计报全绿，
  而那几条轴上的组合从头到尾没有被跑过。

  所以这里的做法是：
    · 轴的**取值**从后代元素的门控列表里取并集（那是写死在 HTML 里的，看得见）
    · 轴的**名字**用白名单，因为轴是一个小的封闭集合
    · 遇到白名单之外、但长得像轴的 data-* 属性，**报警**而不是跳过
      —— 检测器自己也必须被检测。
  ============================================================
-->
<style>
  html, body { margin: 0; background: #0e1116; color: #dfe6f2;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif }
  #bar { position: sticky; top: 0; z-index: 9; display: flex; gap: 10px; align-items: center;
    padding: 12px 16px; background: #151a22; border-bottom: 1px solid #263041; flex-wrap: wrap }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #33415a;
    background: #1d2530; color: #dfe6f2; cursor: pointer }
  button:hover { background: #263041 }
  #env { font-size: 12px; color: #8fa1bd }
  #env b.bad { color: #ff8f8f }
  #env b.ok { color: #8fe0a8 }
  #log { padding: 12px 16px; white-space: pre-wrap; font: 12px/1.55 ui-monospace, Menlo, monospace }
  .warn { color: #ffc46b }
  .bad { color: #ff8f8f }
  .ok { color: #8fe0a8 }
  /* 舞台 iframe 必须是真实 1080×1920，不能缩放，否则测量失真 */
  /* 舞台 iframe 必须是真实 1080×1920 且**留在视口里**。
     一开始我把它丢到 left:-4000px，结果 Chrome 把屏外 iframe 的 rAF 节流到不触发，
     装载握手永远不 resolve，整台子无声挂死 —— 台子自己会骗人，这也是一种假绿。
     现在留在视口内、用 opacity 压掉、pointer-events 关掉。 */
  #frame { width: 1080px; height: 1920px; border: 0;
    position: fixed; right: 0; top: 0; opacity: .02; pointer-events: none; z-index: -1 }
</style>
</head>
<body>

<div id="bar">
  <button id="run">开始全量回归</button>
  <button id="runone">只跑一页…</button>
  <button id="copy">复制 JSON 结果</button>
  <span id="env"></span>
</div>
<div id="log">按「开始全量回归」。先看上面的环境自检，红的先修再跑。</div>
<iframe id="frame" src="about:blank"></iframe>

<script>
/* ── 轴白名单 ────────────────────────────────────────────────
   已知的轴。data-when 是四态、data-at 是阶段，两者单独处理。 */
var AXIS_ALLOW = ['data-pay', 'data-job', 'data-src', 'data-file',
                  'data-off', 'data-done', 'data-probe', 'data-redact', 'data-tab']

/* 明确不是轴的 data-*（用于「长得像轴但没在白名单里」的报警去噪）。
   这些要么是行为钩子，要么是数据槽，不参与可见性判定。 */
var AXIS_DENY = ['data-go', 'data-ev', 'data-out', 'data-f', 'data-f22', 'data-when',
  'data-at', 'data-stage', 'data-state', 'data-theme', 'data-notebar', 'data-site',
  'data-site-price', 'data-site-mode', 'data-site-unit', 'data-site-time', 'data-site-missing',
  'data-rail-count', 'data-parent-label', 'data-empty-cond', 'data-relax-from',
  'data-jobpick', 'data-kw', 'data-region', 'data-region-value', 'data-region-text',
  'data-opts', 'data-vals', 'data-key', 'data-count', 'data-pay-btn', 'data-help',
  'data-keypad', 'data-nb-ceiling', 'data-capture',
  /* 以下经 07-scan-workbench 实测确认不是轴：全部挂在按钮 / 数据行上，
     既没写到 .screen，页面里也没有任何 setAttribute('data-…')。
     它们是选择器的取值槽，不参与可见性判定。 */
  'data-kind', 'data-kindrow', 'data-fmt', 'data-param', 'data-v', 'data-pg', 'data-fb']

/* ── 本台子的已知盲区（写在这里，不写在报告的漂亮话里）──────────
   1) **交互驱动的文本态没有覆盖。** 像 07 的扫描格式（PDF/JPG/可检索 PDF）、
      分辨率、彩色/黑白，是页面局部脚本改**文字**而不是改可见性的。
      本台子靠枚举 data-* 轴来驱动，够不到这一类。这些组合会改变文字长度，
      因而可能造成溢出 —— 没跑过就是没跑过，不要把它算进"全覆盖"。
      高风险页需要另写点击脚本，或人工过一遍。
   2) **跨页链接的落地内容没有验。** 只验了本页；链接指向哪一页对不对，
      要靠 closed-loop-map.md 的映射表另行核。
   3) **动效与时序没有验。** 审计取的是某一帧的静态版面。
   4) 抽样页（组合数超上限）按等距抽，不是全量；报告里逐页标了 sampled。 */

var STATES = ['default', 'first', 'ai-down', 'device-off']

/* 每页组合数上限。超过就等距抽样，并在报告里**明写抽了多少**——
   静默截断会让报告读起来像"全覆盖"，那是最坏的一种假绿。

   改成逐轴遍历之后，最大的一页（06 打印工作台，7 条附加轴）全量只有 868 组，
   跑得完。上限抬到 1200 就是为了让全站**一页都不抽样** ——
   报告里出现「等距抽样」四个字，就意味着那一页有没跑到的组合。 */
var COMBO_CAP = 1200

var PAGES = []          // 运行时从目录清单拉
var RESULT = { env: {}, pages: [], startedAt: '', finishedAt: '' }

var logEl = document.getElementById('log')
var frame = document.getElementById('frame')
function log (s, cls) {
  var span = document.createElement('span')
  if (cls) span.className = cls
  span.textContent = s + '\n'
  logEl.appendChild(span)
  logEl.scrollTop = logEl.scrollHeight
}

/* ── 环境自检 ──────────────────────────────────────────────
   注意这里检的是**真正决定测量是否可信的东西**，不是它的代理指标。

   一开始我检的是外层 Chrome 窗口尺寸，那是错的：舞台 iframe 有显式的
   1080×1920 CSS 尺寸，它的内部视口就等于这个盒子，跟外层窗口多大无关。
   真正要保证的是两条 ——
     ① iframe 内部视口正好 1080×1920
     ② ?capture=1 生效，stage.js 的 fit() 把 transform 设成 none（完全不缩放）
   这两条都在**子页里**验，见 verifyStage()。外层只剩一条：必须走 http。 */
function checkEnv () {
  var e = document.getElementById('env')
  var proto = location.protocol === 'http:' || location.protocol === 'https:'
  RESULT.env = { protocol: location.protocol, protocolOk: proto, ua: navigator.userAgent }
  e.innerHTML =
    '协议 <b class="' + (proto ? 'ok' : 'bad') + '">' + location.protocol + '</b>（须 http，file:// 下读不到子页 DOM）　' +
    '<span style="color:#8fa1bd">舞台 1:1 与缩放在每页装载后逐页验　·　缓存请在 DevTools 里手动关</span>'
  return proto
}

/* 逐页验舞台：视口须 1080×1920，且 capture 模式下不得有任何缩放。
   任何一条不成立，这一页量出来的像素数都不可信，必须当作装载失败。 */
function verifyStage (win) {
  var vw = win.innerWidth, vh = win.innerHeight
  var stage = win.document.querySelector('.stage')
  var tf = stage ? win.getComputedStyle(stage).transform : 'none'
  var scaled = tf && tf !== 'none' && tf !== 'matrix(1, 0, 0, 1, 0, 0)'
  var ok = vw === 1080 && vh === 1920 && !scaled
  return { ok: ok, viewport: vw + '×' + vh, transform: tf || 'none' }
}
checkEnv()
window.addEventListener('resize', checkEnv)

/* ── 页面清单 ──────────────────────────────────────────────
   从 manifest.json 读；没有就退回目录列表解析。
   不硬编码页名——硬编码就会在新增页时静默漏测。 */
async function loadPages () {
  var r = await fetch('../pages.json?t=' + Date.now(), { cache: 'no-store' })
  if (!r.ok) throw new Error('读不到 pages.json —— 先在设计稿目录跑 sh tools/make-pages.sh')
  var j = await r.json()
  RESULT.manifest = { generatedAt: j.generatedAt, retired: j.retired || [], count: j.pages.length }

  /* 清单陈旧是最隐蔽的漏检：报告看起来"全站都跑了"，实际少跑了新增页。
     这里用清单生成时间与最新一页的 Last-Modified 对比，陈旧就明着报出来。 */
  try {
    var newest = 0
    for (var i = 0; i < j.pages.length; i++) {
      var h = await fetch('../' + j.pages[i], { method: 'HEAD', cache: 'no-store' })
      var lm = Date.parse(h.headers.get('last-modified') || '')
      if (lm > newest) newest = lm
    }
    var gen = Date.parse(j.generatedAt)
    RESULT.manifest.stale = newest > gen
    RESULT.manifest.newestPageAt = new Date(newest).toISOString()
    if (newest > gen) log('⚠ pages.json 比最新改动的页面还旧（清单 ' + j.generatedAt
      + '，最新页 ' + new Date(newest).toISOString() + '）。先跑 sh tools/make-pages.sh 再回归。', 'warn')
  } catch (e) {}

  if (j.retired && j.retired.length)
    log('退役页（保留文件，不进交付集、不回归）：' + j.retired.join('、'), 'warn')
  return j.pages
}

/* ── 装载一页 ──────────────────────────────────────────────
   清 localStorage → 钉主题 → 等 load → 再等一帧让 stage.js 跑完初始化。 */
function loadPage (name) {
  return new Promise(function (resolve, reject) {
    /* 超时**贯穿整个握手**，不在 onload 时清掉。
       之前的写法是 onload 里 clearTimeout 再等 rAF —— rAF 一旦被节流，
       超时已经没了，于是无声挂死。凡是等待，都必须有一个自己管不掉的兜底。 */
    var settled = false
    var to = setTimeout(function () {
      if (settled) return
      settled = true
      reject(new Error('装载握手超时 12s'))
    }, 12000)

    frame.onload = function () {
      var win = frame.contentWindow
      try { win.localStorage.clear() } catch (e) {}
      /* 用 setTimeout 而不是 rAF：rAF 在被节流的 iframe 里可能永远不触发。
         两拍：一拍给 DOMContentLoaded 之后的脚本，一拍给它们触发的布局。 */
      setTimeout(function () {
        setTimeout(function () {
          if (settled) return
          settled = true
          clearTimeout(to)
          resolve(win)
        }, 80)
      }, 80)
    }
    try { frame.contentWindow.localStorage.clear() } catch (e) {}
    frame.src = '../' + name + '?theme=warm&capture=1&t=' + Date.now()
  })
}

/* 任何一步都不许无限等：整页处理套一个硬超时，超了就记成失败继续跑下一页。
   一台会挂死的回归台，比没有回归台更糟 —— 它会让人以为「还在跑」。 */
function withTimeout (p, ms, what) {
  return Promise.race([p, new Promise(function (_, rej) {
    setTimeout(function () { rej(new Error(what + ' 超时 ' + ms + 'ms')) }, ms)
  })])
}

/* ── 轴发现 ────────────────────────────────────────────────
   取值从后代门控列表取并集；名字走白名单；白名单外的可疑项报警。 */
function discoverAxes (win) {
  var doc = win.document
  var screen = doc.querySelector('.screen')
  if (!screen) return { error: '没有 .screen' }

  var stages = []
  doc.querySelectorAll('[data-at]').forEach(function (el) {
    String(el.getAttribute('data-at') || '').split(/\s+/).forEach(function (v) {
      if (v && stages.indexOf(v) < 0) stages.push(v)
    })
  })

  var axes = {}, suspicious = []
  var seen = {}
  doc.querySelectorAll('*').forEach(function (el) {
    for (var i = 0; i < el.attributes.length; i++) {
      var n = el.attributes[i].name
      if (n.indexOf('data-') !== 0) continue
      seen[n] = (seen[n] || 0) + 1
    }
  })
  Object.keys(seen).forEach(function (n) {
    if (AXIS_ALLOW.indexOf(n) > -1) {
      var vals = []
      doc.querySelectorAll('[' + n + ']').forEach(function (el) {
        if (el === screen) return
        String(el.getAttribute(n) || '').split(/\s+/).forEach(function (v) {
          if (v && vals.indexOf(v) < 0) vals.push(v)
        })
      })
      if (vals.length > 1) axes[n] = vals
      return
    }
    if (AXIS_DENY.indexOf(n) > -1) return
    /* `data-xxx-go` / `data-xxx-btn` 是**设置轴的按钮**，不是轴本身。
       06 一页就有 data-src-go / data-file-go / data-redact-go / data-job-btn /
       data-pay-go / data-off-go / data-done-go 七个，全报一遍纯属噪声。 */
    if (/-(go|btn)$/.test(n)) return
    /* 白名单外、出现在多个元素上、且取值像是枚举 —— 可能是新轴。
       报出来，别静默跳过。上一轮的教训就是漏轴等于漏检。 */
    if (seen[n] >= 3) {
      var vs = {}
      doc.querySelectorAll('[' + n + ']').forEach(function (el) {
        String(el.getAttribute(n) || '').split(/\s+/).forEach(function (v) { if (v) vs[v] = 1 })
      })
      var k = Object.keys(vs)
      if (k.length > 1 && k.length <= 12 && k.every(function (x) { return x.length <= 16 })) {
        suspicious.push({ attr: n, count: seen[n], values: k })
      }
    }
  })

  /* 默认阶段必须是第 1 步。
     实测栽过：07 扫描台的 .screen 上写死 data-stage="s3"，s3 是「正在扫描」——
     用户从打印扫描首屏点「材料扫描」进来，屏幕上直接是扫描中途。
     全站 34 个多阶段页里有 5 页是这样，全都停在设计时最后调试的那一步。
     阶段轨的第一个 [data-go] 就是第 1 步（与 stage.js 的 stageList() 同口径）。 */
  var rail = doc.querySelector('.rail, .spine-rail, [data-rail]')
  var railOrder = []
  ;(rail || doc).querySelectorAll('[data-go]').forEach(function (el) {
    var v = el.getAttribute('data-go')
    if (v && stages.indexOf(v) > -1 && railOrder.indexOf(v) < 0) railOrder.push(v)
  })
  var declared = screen.getAttribute('data-stage') || ''
  var defaultNotFirst = (rail && railOrder.length && declared && declared !== railOrder[0])
    ? { declared: declared, shouldBe: railOrder[0] } : null

  return { stages: stages, axes: axes, suspicious: suspicious,
           hasStage: screen.hasAttribute('data-stage'),
           defaultNotFirst: defaultNotFirst }
}

/* ── 组合枚举 ──────────────────────────────────────────────
   一开始我做的是各轴笛卡尔积。跑起来才看清那是错的：
   06 打印工作台有 7 条附加轴，全量组合 **193 万**，抽 260 个只覆盖 0.013%,
   而且其中绝大多数现实里根本不可能同时成立（免费单 × 卡纸 × 正在选遮盖区）。
   一个覆盖率 0.013% 的报告写成"跑过了"，比不跑更误导。

   改成**逐轴遍历**：其余轴保持页面自己的默认值，一次只动一条轴。
   规模从 prod(k_i) 降到 sum(k_i)，而且可以诚实地说清覆盖了什么：

     ✓ 每条轴的每个取值，都在四态 × 全阶段下跑过
     ✗ 轴与轴的交叉只跑了默认组合

   后一条是本台子的**已知边界**，不是"全覆盖"。真要验特定交叉（例如
   ai-down × 卡纸 × 已遮盖），得由页面所有者点名，另列用例。 */
function buildCombos (disc, win) {
  var stages = disc.hasStage && disc.stages.length ? disc.stages : ['']
  var axisNames = Object.keys(disc.axes)
  var screen = win.document.querySelector('.screen')

  /* 各轴的默认值：优先取页面自己在 .screen 上写的，没有就取第一个取值 */
  var base = {}
  axisNames.forEach(function (n) {
    var v = screen.getAttribute(n)
    base[n] = (v && disc.axes[n].indexOf(v) > -1) ? v : disc.axes[n][0]
  })

  /* 每条轴只在**它真正起作用的阶段**上变化。
     06 一开始是 868 组，其中大量组合毫无意义 —— 在「选来源」那一步去改
     「收银状态」，那一步根本没有收银元素，跑一遍什么也验不到，
     还把一台子拖到跑不完。
     判据：带这条轴的元素自己（或其祖先）用 data-at 声明了哪些阶段。
     没有任何 data-at 约束的，视为所有阶段都相关。 */
  var axisStages = {}
  axisNames.forEach(function (n) {
    var set = null
    win.document.querySelectorAll('[' + n + ']').forEach(function (el) {
      if (el === screen) return
      var at = null
      for (var a = el; a && a !== screen; a = a.parentElement) {
        if (a.hasAttribute && a.hasAttribute('data-at')) { at = a.getAttribute('data-at'); break }
      }
      if (!at) { set = 'all'; return }
      if (set === 'all') return
      if (!set) set = {}
      at.split(/\s+/).forEach(function (s) { if (s) set[s] = 1 })
    })
    axisStages[n] = (set === 'all' || !set) ? null : Object.keys(set)
  })

  /* 每条轴要单独跑的取值 = 全部取值去掉默认值（默认值已在基线组合里跑过） */
  var variants = [[]]                                    // [] = 全部用默认值
  axisNames.forEach(function (n) {
    disc.axes[n].forEach(function (v) {
      if (v !== base[n]) variants.push([[n, v]])
    })
  })

  var out = []
  for (var s = 0; s < STATES.length; s++)
    for (var g = 0; g < stages.length; g++)
      for (var e = 0; e < variants.length; e++) {
        var vary = variants[e][0]
        if (vary && axisStages[vary[0]] && stages[g] &&
            axisStages[vary[0]].indexOf(stages[g]) < 0) continue   // 这一步用不到这条轴
        /* 每个组合都带上全套默认值，避免上一轮改过的轴留在 .screen 上污染下一轮 */
        var extra = axisNames.map(function (n) { return [n, base[n]] })
        variants[e].forEach(function (kv) {
          for (var i = 0; i < extra.length; i++) if (extra[i][0] === kv[0]) extra[i][1] = kv[1]
        })
        out.push({ state: STATES[s], stage: stages[g], extra: extra, varied: variants[e][0] || null })
      }

  var full = out.length, sampled = false
  if (full > COMBO_CAP) {
    /* 抽样规则要可复现：等距抽，不用随机。随机会让两次跑不出同一份报告。 */
    var step = full / COMBO_CAP, picked = []
    for (var k = 0; k < COMBO_CAP; k++) picked.push(out[Math.floor(k * step)])
    out = picked; sampled = true
  }
  return { list: out, full: full, ran: out.length, sampled: sampled,
           axisCount: axisNames.length,
           crossFull: axisNames.reduce(function (n, a) { return n * disc.axes[a].length }, 1) *
                      STATES.length * stages.length }
}

/* ── 跑一个组合 ──────────────────────────────────────────── */
function runCombo (win, c) {
  var doc = win.document
  var screen = doc.querySelector('.screen')
  screen.setAttribute('data-state', c.state)
  if (c.stage) screen.setAttribute('data-stage', c.stage)
  for (var i = 0; i < c.extra.length; i++) screen.setAttribute(c.extra[i][0], c.extra[i][1])
  if (typeof win.v3ApplyVisibility === 'function') win.v3ApplyVisibility()
  void doc.body.offsetHeight                      // 强制回流：不做就量到旧版面
  var r = (typeof win.v3AuditPlus === 'function') ? win.v3AuditPlus()
        : (typeof win.v3Audit === 'function') ? win.v3Audit() : null
  return r
}

/* ── 遮挡检测 ────────────────────────────────────────────────
   为什么单独加这一项：首页的「查看招聘会」在 default / device-off 两态
   被页脚折叠条盖住、按不动，而全套审计报的是 0 缺陷 —— 因为它既没有溢出，
   也在 1920 视口之内，只是**被另一个元素压在上面**。
   一个按不动的按钮，比一个丑的按钮严重得多，却正好是既有检查的盲区。

   做法：取按钮中心点做 elementFromPoint，命中的若不是它自己或它的后代，
   就是被挡住了。有弹层打开时整页跳过（那时候盖住是对的）。 */
function auditOcclusion (win) {
  var doc = win.document
  var screen = doc.querySelector('.screen')
  if (!screen) return []
  /* 弹层/遮罩打开时不查：那时候盖住下面的东西是设计意图 */
  if (doc.querySelector('.lg-mask:not([hidden]), .ovl:not([hidden]), .modal:not([hidden])')) return []

  var out = []
  var els = screen.querySelectorAll('button, a.btn, .btn, .pick, [role="button"], a.card, .fc-card')
  for (var i = 0; i < els.length; i++) {
    var el = els[i]
    if (el.hidden || el.closest('[hidden]')) continue
    var st = win.getComputedStyle(el)
    if (st.display === 'none' || st.visibility === 'hidden' || parseFloat(st.opacity) < .1) continue
    if (st.pointerEvents === 'none') continue
    var r = el.getBoundingClientRect()
    if (r.width < 8 || r.height < 8) continue
    if (r.bottom <= 0 || r.top >= win.innerHeight || r.right <= 0 || r.left >= win.innerWidth) continue

    var cx = Math.round(r.left + r.width / 2)
    var cy = Math.round(r.top + r.height / 2)
    if (cx < 0 || cy < 0 || cx >= win.innerWidth || cy >= win.innerHeight) continue

    /* 第一版漏了这一步，于是报了一堆假的「被 .kw 压住」「被 .pane 压住」：
       按钮在可滚动面板里被滚出可视区时，它的矩形仍在视口内，
       中心点却落在别的内容上 —— 那不是遮挡，是「需要滚一下才看得到」。

       但**不能一律跳过**。第二版我一律跳过，结果把首页那个真缺陷也放过了：
       「查看招聘会」当初正是被 overflow:hidden 的祖先裁掉的。所以要分两种：
         · 祖先是 auto / scroll  → 滚一下就能看到，不算缺陷（沿用 audit-plus 的既有口径）
         · 祖先是 hidden / clip  → **永远看不到、永远按不着**，比被盖住更严重 */
    var clippedBy = null, scrollable = false
    for (var a = el.parentElement; a && a !== doc.body; a = a.parentElement) {
      var as = win.getComputedStyle(a)
      var ox = as.overflowX, oy = as.overflowY
      if (ox === 'visible' && oy === 'visible') continue
      var ar = a.getBoundingClientRect()
      if (cx < ar.left || cx > ar.right || cy < ar.top || cy > ar.bottom) {
        clippedBy = a
        scrollable = (ox === 'auto' || ox === 'scroll' || oy === 'auto' || oy === 'scroll')
        break
      }
    }
    if (clippedBy) {
      if (scrollable) continue                       // 滚得到，放过
      out.push({ label: (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 24) || el.className,
                 blockedBy: (String(clippedBy.className).split(' ')[0] || clippedBy.tagName),
                 kind: '被裁掉' })
      continue
    }

    var hit = doc.elementFromPoint(cx, cy)
    if (!hit) continue
    if (hit === el || el.contains(hit) || hit.contains(el)) continue

    var label = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 24)
    var by = (hit.className && String(hit.className).split(' ')[0]) || hit.tagName
    out.push({ label: label || el.className, blockedBy: by })
  }
  return out
}

/* ── 从审计返回值里收集缺陷 ────────────────────────────────────────
   一开始我只数了**顶层的数字键**。而 v3AuditPlus() 的返回里
   「版面留白 / 内部裁切 / 联动接线 / 假入口 / 主区空壳 / 卡内溢出」是嵌套对象，
   「违禁文案 / 量化红线 / 来源三字段缺」是数组 —— 全被跳过了。
   于是全站报「0 缺陷」，而 04 那一屏其实写着「右栏底部空 676px」。

   这是今天第二次栽在同一件事上（上一次是 stage.js 的 audit() 忘了 return）：
   **检测器自己必须被检测。** 现在改成递归走完整棵树，
   数字 > 0、非空数组，一律算缺陷。 */
function collectDefects (node, path, out, combo, evidence) {
  if (node === null || node === undefined) return
  if (typeof node === 'number') {
    if (node > 0) out.push({ combo: combo, check: path, value: node,
      /* 把同级的「明细」当证据带上 —— 只报「主栏留白过大 = 1」没法定位，
         带上「右栏 底部空 676px」才知道去哪一栏看。 */
      detail: evidence ? JSON.stringify(evidence).slice(0, 240) : undefined })
    return
  }
  if (Array.isArray(node)) {
    if (node.length) out.push({ combo: combo, check: path, value: node.length,
      detail: JSON.stringify(node).slice(0, 200) })
    return
  }
  if (typeof node === 'object') {
    Object.keys(node).forEach(function (k) {
      /* 「明细」是上面那个计数的证据，不重复计一次 */
      if (k === '明细') return
      if (k === 'screen') return
      /* 信息量，不是缺陷。递归收集第一版把它当缺陷报了 192 条 ——
         「这一页声明了 N 条联动」是好事，报成缺陷就是喊狼来了。
         检测器宁可漏一类，也不能把正常值染成红的：一旦人开始怀疑报告，
         真缺陷也会被一起忽略。 */
      if (INFO_KEYS.indexOf(k) > -1) return
      collectDefects(node[k], path ? path + '·' + k : k, out, combo, node['明细'])
    })
  }
}

/* v3AuditPlus() 返回里属于「统计」而非「缺陷」的键 */
var INFO_KEYS = ['声明条数']

function comboLabel (c) {
  var s = c.state + (c.stage ? '/' + c.stage : '')
  for (var i = 0; i < c.extra.length; i++) s += ' ' + c.extra[i][0].slice(5) + '=' + c.extra[i][1]
  return s
}

/* ── 跨页链接校验 ────────────────────────────────────────────
   用户最不能接受的一类错就是「点进去跳转的不是这个连接的页面，
   或者这个页面根本不存在」。此前全靠人眼，没有任何自动检查。

   这里查三件事：
     ① 目标文件在不在（不在 = 死链）
     ② 目标页存不存在这个 ?stage=（stage 不认识 = 到了页面也是空的/白屏）
     ③ 链接文字承诺的和目标页是不是一回事 —— 这条**机器判不了**，
        只把「文字 → 目标」的对照表导出来，留给人核。不假装机器能判。

   注意：只能查静态 href。JS 运行时算出来的跳转（如 06 的交接契约）
   查不到 —— 这是本检查的已知边界，不要当成"链接都验过了"。 */
function collectLinks (win) {
  var doc = win.document
  var out = []
  doc.querySelectorAll('a[href]').forEach(function (a) {
    var h = a.getAttribute('href') || ''
    if (!h || h.charAt(0) === '#' || /^(https?:|mailto:|tel:|javascript:)/i.test(h)) return
    var file = h.split('?')[0].split('#')[0]
    if (!file || !/\.html$/i.test(file)) return
    var st = ''
    var m = h.match(/[?&]stage=([^&#]+)/)
    if (m) st = decodeURIComponent(m[1])
    out.push({
      href: h, file: file, stage: st,
      text: (a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40)
    })
  })
  return out
}

/* 两趟：先把每页的阶段清单都收齐，再回头验链接。
   一趟做不到 —— 验 A 页的链接需要 B 页的阶段清单，而 B 页可能还没装载。 */
function validateLinks (pages) {
  var stagesOf = {}, exists = {}
  pages.forEach(function (p) {
    exists[p.page] = true
    if (p.stages) stagesOf[p.page] = p.stages
  })
  var bad = []
  pages.forEach(function (p) {
    ;(p.links || []).forEach(function (l) {
      if (!exists[l.file]) {
        bad.push({ from: p.page, href: l.href, text: l.text, why: '目标页不存在' })
        return
      }
      if (l.stage && stagesOf[l.file] && stagesOf[l.file].length &&
          stagesOf[l.file].indexOf(l.stage) < 0) {
        bad.push({ from: p.page, href: l.href, text: l.text,
                   why: '目标页没有这个阶段（它有：' + stagesOf[l.file].join('/') + '）' })
      }
    })
  })
  return bad
}

/* ── 主流程 ──────────────────────────────────────────────── */
async function runAll (only) {
  if (!checkEnv()) {
    log('环境自检没过。协议必须是 http、窗口必须 ~1120×2010，否则量出来的数不可复现。', 'bad')
    return
  }
  logEl.textContent = ''
  RESULT = { env: RESULT.env, pages: [], startedAt: new Date().toISOString(), finishedAt: '' }

  PAGES = await loadPages()
  if (only) PAGES = PAGES.filter(function (p) { return p.indexOf(only) > -1 })
  log('共 ' + PAGES.length + ' 页。开始。\n')

  var totalCombos = 0, totalDefects = 0, totalErrors = 0, pagesWithDefects = 0

  for (var i = 0; i < PAGES.length; i++) {
    var name = PAGES[i]
    var rec = { page: name, combos: 0, fullCombos: 0, sampled: false,
                defects: [], consoleErrors: [], suspicious: [], error: '' }
    try {
      var win = await withTimeout(loadPage(name), 15000, name + ' 装载')

      /* 舞台不是 1:1 就没有测量意义 —— 直接判失败，不要拿失真的数去凑一份"跑过了"的报告 */
      var vs = verifyStage(win)
      rec.stage = vs
      if (!vs.ok) {
        rec.error = '舞台不是 1:1（视口 ' + vs.viewport + '，transform ' + vs.transform + '）'
        log(name + '  ✗ ' + rec.error, 'bad')
        RESULT.pages.push(rec); continue
      }

      /* 接管子页 console.error：脚本挂了但静态审计还报绿，是最危险的一种假绿。
         P21 就发生过整段脚本被 URL 编码坏掉、静态审计照样全绿的事。 */
      var errs = []
      var oe = win.console.error
      win.console.error = function () { errs.push([].slice.call(arguments).join(' ')); oe.apply(win.console, arguments) }
      win.addEventListener('error', function (ev) { errs.push('window.onerror: ' + ev.message) })

      var disc = discoverAxes(win)
      if (disc.error) { rec.error = disc.error; log(name + '  ✗ ' + disc.error, 'bad'); RESULT.pages.push(rec); continue }
      rec.suspicious = disc.suspicious
      if (disc.defaultNotFirst) {
        rec.defects.push({ combo: '（页面默认）', check: '打开就落在流程中途', value: 1,
          detail: '.screen 写死 data-stage="' + disc.defaultNotFirst.declared
                + '"，而第 1 步是 "' + disc.defaultNotFirst.shouldBe + '"' })
      }

      var cb = buildCombos(disc, win)
      rec.combos = cb.ran; rec.fullCombos = cb.full; rec.sampled = cb.sampled

      for (var j = 0; j < cb.list.length; j++) {
        /* 每 20 组让出一次事件循环：组合循环是同步的，一页几百组会把主线程
           占满，日志不刷新、页面像死了一样，分不清「在跑」还是「挂了」。 */
        if (j && j % 20 === 0) await new Promise(function (r) { setTimeout(r, 0) })
        var out = runCombo(win, cb.list[j])
        if (out && typeof out === 'object') {
          collectDefects(out, '', rec.defects, comboLabel(cb.list[j]))
        } else if (out === undefined || out === null) {
          rec.defects.push({ combo: comboLabel(cb.list[j]), check: '审计没有返回值', value: 1 })
        }
        /* 遮挡检测只在每个「态 × 阶段」的基线组合上跑一次。
           它对每个按钮的每一层祖先调 getComputedStyle，会强制样式重算，
           在 06 / 09 这种大页上按 868 组合逐一跑会把整台子拖死（实测 09 卡住数分钟）。
           附加轴（data-pay / data-job / data-redact…）改的是卡片内容，
           不改栏与页脚的几何，对遮挡没有影响 —— 所以按基线跑一次就够，
           而这一点是**判断**，写在这里以便日后有人推翻它。 */
        var occ = cb.list[j].varied ? [] : auditOcclusion(win)
        for (var oi = 0; oi < occ.length; oi++) {
          var cut = occ[oi].kind === '被裁掉'
          rec.defects.push({ combo: comboLabel(cb.list[j]),
            check: cut ? '按钮被裁掉看不见' : '按钮被遮挡按不动', value: 1,
            detail: '「' + occ[oi].label + '」' + (cut ? '被 .' + occ[oi].blockedBy + ' 裁掉（overflow:hidden，滚也看不到）'
                                                      : '被 .' + occ[oi].blockedBy + ' 压住') })
        }
      }
      rec.consoleErrors = errs.slice(0, 20)
      rec.stages = disc.stages
      rec.links = collectLinks(win)

      totalCombos += rec.combos
      totalDefects += rec.defects.length
      totalErrors += errs.length
      if (rec.defects.length || errs.length) pagesWithDefects++

      rec.axisCount = cb.axisCount
      rec.crossFull = cb.crossFull
      var line = name.padEnd(34) + String(rec.combos).padStart(4) + ' 组合'
        + (cb.sampled ? '（逐轴全量 ' + cb.full + '，等距抽样）' : '')
        + (cb.axisCount > 1 ? '　[' + cb.axisCount + ' 条附加轴，轴间交叉未跑，全交叉需 ' + cb.crossFull + ']' : '')
        + '  缺陷 ' + rec.defects.length + '  console 错 ' + errs.length
      log(line, (rec.defects.length || errs.length) ? 'warn' : 'ok')
      if (rec.suspicious.length)
        log('    ⚠ 疑似未登记的轴：' + rec.suspicious.map(function (s) {
          return s.attr + '(' + s.values.join('|') + ')' }).join('，') + ' —— 确认后加进 AXIS_ALLOW 或 AXIS_DENY', 'warn')
    } catch (e) {
      rec.error = String(e && e.message || e)
      log(name + '  ✗ ' + rec.error, 'bad')
    }
    RESULT.pages.push(rec)
  }

  RESULT.finishedAt = new Date().toISOString()

  /* 跨页链接校验只在**跑了全站**时才有意义。
     单页模式下 exists 表只有这一页，于是所有跨页链接都被报成「目标页不存在」——
     一屏假红条会把真问题淹掉，也会让人开始不信这份报告。
     （这一条是整改代理跑单页时发现的，用未改动的 02-standby 复现确认过。） */
  var partial = PAGES.length < (RESULT.manifest && RESULT.manifest.count || PAGES.length)
  if (partial) {
    log('\n跨页链接：本次只跑了 ' + PAGES.length + ' 页，**跳过链接校验**'
      + '（单页模式下无法判断其它页存不存在，报出来全是假的）。', 'warn')
    RESULT.badLinks = null
    RESULT.finishedAt = new Date().toISOString()
    log('\n────────────────────────────────')
    log('页数 ' + PAGES.length + '　组合 ' + totalCombos
      + '　有问题的页 ' + pagesWithDefects + '　缺陷 ' + totalDefects + '　console 错 ' + totalErrors,
      (totalDefects || totalErrors) ? 'bad' : 'ok')
    window.V3_REGRESS_RESULT = RESULT
    return
  }

  var badLinks = validateLinks(RESULT.pages)
  RESULT.badLinks = badLinks
  var linkCount = RESULT.pages.reduce(function (n, p) { return n + ((p.links || []).length) }, 0)
  log('\n跨页链接：查了 ' + linkCount + ' 条静态 href（JS 运行时算出来的跳转查不到，见台子头部的已知盲区）')
  if (badLinks.length) {
    log('✗ ' + badLinks.length + ' 条对不上：', 'bad')
    badLinks.slice(0, 40).forEach(function (b) {
      log('   ' + b.from + ' 的「' + b.text + '」→ ' + b.href + '　' + b.why, 'bad')
    })
    if (badLinks.length > 40) log('   …还有 ' + (badLinks.length - 40) + ' 条，见 JSON', 'bad')
  } else {
    log('✓ 目标页都存在，?stage= 都是目标页真有的阶段', 'ok')
  }
  log('（链接文字承诺的和目标页是不是一回事，机器判不了 —— JSON 里有「文字 → 目标」对照表，留给人核）')

  log('\n────────────────────────────────')
  log('页数 ' + PAGES.length + '　组合 ' + totalCombos
    + '　有问题的页 ' + pagesWithDefects
    + '　缺陷 ' + totalDefects + '　console 错 ' + totalErrors,
    (totalDefects || totalErrors) ? 'bad' : 'ok')
  log('点「复制 JSON 结果」把完整结果取走。')
  window.V3_REGRESS_RESULT = RESULT
}

document.getElementById('run').onclick = function () { runAll('') }
document.getElementById('runone').onclick = function () {
  var p = prompt('页名片段，例如 06 或 print-workbench')
  if (p) runAll(p)
}
document.getElementById('copy').onclick = function () {
  navigator.clipboard.writeText(JSON.stringify(RESULT, null, 2))
  log('已复制。', 'ok')
}
window.v3RunAll = runAll
</script>
