<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>首页三版构图对比 — AI 求职操作系统</title>
<style>
  :root { --scale: .305; --card: calc(1080px * var(--scale)); }
  body {
    margin: 0; padding: 24px 28px 40px;
    background: radial-gradient(1300px 800px at 20% -14%, #12191b, #070a0b 62%, #040606);
    color: #e8f1f1; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-family: "Songti SC", "SimSun", serif; font-size: 25px; font-weight: 600; margin: 0 0 6px; letter-spacing: .04em; }
  p.sub { margin: 0 0 20px; font-size: 13px; color: #8ba4a9; line-height: 1.7; max-width: 92ch; }
  .grid { display: grid; grid-template-columns: repeat(3, var(--card)); gap: 22px; }
  figure { margin: 0; }
  .frame {
    width: var(--card); height: calc(1920px * var(--scale));
    border-radius: 10px; overflow: hidden; position: relative;
    border: 1px solid rgba(232,241,241,.16);
    box-shadow: 0 22px 54px -22px rgba(0,0,0,.92);
    background: #f3ede2;
  }
  .frame iframe { width: 1080px; height: 1920px; border: 0; display: block; transform: scale(var(--scale)); transform-origin: top left; }
  figcaption { padding-top: 10px; font-size: 13px; line-height: 1.6; }
  figcaption b { display: block; font-size: 16px; color: #f2f7f7; letter-spacing: .04em; margin-bottom: 4px; }
  figcaption .k { color: #7f979c; font-size: 12px; display: block; margin-bottom: 6px; }
  figcaption a { color: #34e0a8; text-decoration: none; font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(52,224,168,.4); color: #34e0a8; margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>
  <h1>首页 · 三版构图对比</h1>
  <p class="sub">
    同一套内容、同一套合规口径、同一套暖色令牌，三种完全不同的构图逻辑。三版都通过四态自查（纵向溢出 0 / 横向溢出 0 / 触控目标全部 ≥48px / 违禁文案 0 命中）。
    点「单独打开」可看动效与四态切换。
  </p>
  <div class="grid" id="g"></div>
<script>
  var V = [
    ['01-home.html', '甲 · 玻璃卡片版', '构图：大标题 + 顾问卡 + 办理单面板 + 不等宽入口矩阵。最接近常见 App，最稳，但视觉冲击最弱。'],
    ['01-home-v4.html', '乙 · 印务台版', '构图：左侧任务脊（竖排步骤）+ 巨型宋体版头 + 行式服务目录 + 套准标记 / 半调网点 / 等宽读数。最专业、最像精密仪器，但偏素。'],
    ['01-home-v5.html', '丙 · 鲜彩玻璃版', '构图：大色域版头 + 出血肖像 + 跨边玻璃指令胶囊 + 横向办理路径 + 六张身份色服务卡 + 现场大图。色彩与纵深最强，最像消费级商业产品。']
  ]
  document.getElementById('g').innerHTML = V.map(function (v, i) {
    return '<figure><div class="frame"><iframe src="' + v[0] + '?capture=1&theme=warm" title="' + v[1] + '"></iframe></div>' +
      '<figcaption><b>' + v[1] + (i === 2 ? '<span class="tag">最新</span>' : '') + '</b>' +
      '<span class="k">' + v[2] + '</span>' +
      '<a href="' + v[0] + '?theme=warm" target="_blank">单独打开 →</a></figcaption></figure>'
  }).join('')
</script>
</body>
</html>
