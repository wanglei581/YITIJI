<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>一体机 AI 求职操作系统 · 01-75 原型</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/workbench.css" />
    <link rel="stylesheet" href="styles/screens.css" />
    <link rel="stylesheet" href="styles/states.css" />
    <link rel="stylesheet" href="styles/compositions-v2.css" />
    <link rel="stylesheet" href="styles/special-home-v2.css" />
    <link rel="stylesheet" href="styles/special-print-v2.css" />
    <link rel="stylesheet" href="styles/special-advisor-v2.css" />
  </head>
  <body>
    <div class="prototype-shell">
      <aside class="prototype-sidebar" aria-label="原型页面导航">
        <div class="prototype-brand">
          <span class="brand-mark">职</span>
          <div>
            <strong>职易达 · Kiosk OS</strong>
            <span>01-75 独立设计候选</span>
          </div>
        </div>
        <div class="prototype-summary">
          <span>75 屏</span><span>8 母版</span><span>1080x1920</span>
        </div>
        <label class="prototype-search">
          <span>搜索页面或流程</span>
          <input id="screen-search" type="search" placeholder="例如：打印、简历、招聘会" />
        </label>
        <div class="prototype-filters" id="section-filters" aria-label="业务筛选"></div>
        <nav class="prototype-nav" id="screen-nav"></nav>
        <footer class="prototype-note">原型不连接支付、AI、用户数据或打印硬件</footer>
      </aside>

      <main class="prototype-main">
        <header class="prototype-toolbar">
          <div>
            <div class="prototype-screen-title">
              <span id="toolbar-id">01</span>
              <h1 id="toolbar-title">首页</h1>
            </div>
            <p id="toolbar-meta">首页任务台 · 让用户从目标出发</p>
          </div>
          <div class="prototype-toolbar-actions">
            <div class="state-switcher" id="state-switcher" aria-label="状态预览">
              <button type="button" data-state="default" class="is-active">默认</button>
              <button type="button" data-state="loading">加载</button>
              <button type="button" data-state="empty">空态</button>
              <button type="button" data-state="error">异常</button>
            </div>
            <button
              class="toolbar-icon"
              id="previous-screen"
              type="button"
              title="上一屏"
              aria-label="上一屏"
            >
              ←
            </button>
            <button
              class="toolbar-icon"
              id="next-screen"
              type="button"
              title="下一屏"
              aria-label="下一屏"
            >
              →
            </button>
          </div>
        </header>

        <section class="prototype-canvas" aria-label="1080乘1920一体机画布">
          <div id="stage-scaler">
            <div id="kiosk-stage"></div>
          </div>
          <aside class="prototype-inspector">
            <div>
              <span class="inspector-label">页面目标</span>
              <strong id="inspector-goal"></strong>
            </div>
            <div>
              <span class="inspector-label">用户主操作</span>
              <strong id="inspector-action"></strong>
            </div>
            <div>
              <span class="inspector-label">旧屏去向</span>
              <p id="inspector-mapping"></p>
            </div>
            <div class="inspector-boundary">
              <span class="inspector-label">真实性边界</span>
              <p id="inspector-boundary"></p>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <span class="dialog-kicker">需要你确认</span>
        <h2 id="dialog-title">确认继续</h2>
        <p id="dialog-message"></p>
        <div class="dialog-actions">
          <button value="cancel" class="button button-secondary">返回检查</button>
          <button value="confirm" class="button button-primary" id="dialog-confirm">
            确认继续
          </button>
        </div>
      </form>
    </dialog>

    <script src="scripts/catalog.js"></script>
    <script src="scripts/screens-01-15.js"></script>
    <script src="scripts/screens-16-30.js"></script>
    <script src="scripts/screens-31-45.js"></script>
    <script src="scripts/screens-46-60.js"></script>
    <script src="scripts/screens-61-75.js"></script>
    <script src="scripts/special-screens.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
