<!--
  宿主：线上招聘平台目录（第三方官网入口）
  route: /jobs/online-platforms  —— 102（入口来自 Jobs Hub）
  state: ready | navigator | qr | invalid-platform
  数据来源（重要）：平台名称、分类与官网域名逐字取自运行时**硬编码常量**
        apps/kiosk/src/pages/jobs/OnlinePlatformsPage.tsx 的 PLATFORMS。
        它不是 Admin 审核结果，不接 API，不随后台配置变化，也不代表任何合作关系。
        本页因此不写「已核验」「合作平台」「实时同步」一类说法。
  真话边界：
    ① 二维码在运行时由 qrcode.react 按内置官网地址生成；静态原型只画二维码位，
       不生成可扫描图形，也不虚构短链或跳转地址。
    ② platform 参数不在固定四项清单中时显示 invalid-platform，不生成二维码。
    ③ navigator 对齐 React 的 AI 找岗方向；快捷领域不是完整字典，领域、地点、阶段和说明均可自由填写。
    ④ 按钮文案用「扫码打开来源平台」：浏览、登录、投递全部在该平台完成，
       本机不接收简历、不代投递，也不记录平台内操作。
  ai-mode: AI-CONTEXT（102 页内辅助，不自动调用）
  ai-input: 用户主动选择的本人简历，或手动填写的求职方向；平台清单仍只读运行时内置官网字段
  ai-consent: 用户必须主动选择输入，不得静默读取简历、浏览记录或平台账号信息
  ai-output: 可核对的岗位名称、技能与地区搜索词；不得比较平台优劣、代投递或生成平台事实
  ai-failure: 缺输入、本人简历不可用、AI 服务不可用均常显原因，不生成演示搜索词
  ai-fallback: 四个平台入口及普通岗位/机构浏览保持可用，并给出“岗位名称 + 地区”的手动搜索方法
  ai-persistence: 搜索词和输入只在当前会话临时使用，默认不写入 AI 记录，清场时删除
  原型演示控制：状态只通过 ?state= 切换（?debug=1 显示演示面板），页面无计时器推进业务状态
  验收范围：静态原型表现；不证明 React 接线、API 可用、Admin 审核或生产数据
-->

/* ── 本页覆盖：只写在这一份宿主 HTML 里，不改共享样式表 ─────────────
   ① 可见焦点：公共触控终端也会接外接键盘与无障碍设备，Tab 到哪必须一眼看得见。
      统一用「青 3px + 墨 3px」双色环：浅底输入框、浅底卡片和深色主按钮上都够对比。
      只用 outline / box-shadow，不改盒模型、不位移、不新增任何持续动画。
   ② 触控目标：本页所有真实可点元素沿用共享样式的 ≥48px，主行动按钮 ≥56px；
      这里只补焦点表现，不缩小任何热区。 */

#stage button:focus-visible,
#stage input:focus-visible,
#stage select:focus-visible,

#stage [tabindex]:focus-visible{

  position:relative;
  z-index:4;
}
/* 置灰控件也要能被 Tab 到并看清，但焦点色不得让它看起来像可用 */
#stage [aria-disabled="true"]:focus-visible{
  outline:3px solid var(--wheat-d);
  outline-offset:2px;
  box-shadow:0 0 0 6px var(--surface);
}
</style>
<!--
青序流光 2.0 · 45 本机构官方渠道（state=ready）
9/28 留白：示例码的图形按码位放大（看得见的码约 170→430px，码位 640→680、描边变细），码位里不再是小图标四周空一圈；两段写死的 100px 上边距改成 margin-top:auto，余高平均分到三步说明、码卡、问小青之间；问小青一行行高 96→120，右端补「›」。无新增内容。
规则 1：标题下用卡片里原有的三句说明做只读步骤，把顶部空档填上；二维码卡下移，占掉下方空档。

-->

   1. 码卡是这一屏的主角：示例码的图形按码位放大（看得见的码约 170→430px），码位里不再是一个小图标、四周空一大圈；

<script>
/* 本页脚本：只做一件不改真话的事 —— 把用户画面上的技术词换成人话。
   只替换纯文本节点：四个来源平台入口、二维码位与「投递在来源平台完成」的合规说明
   都原样保留，不动结构、链接和任何真实字段。
   共享运行时 directory-workspaces.js 在 load 前同步渲染完主体，这里只在其后做覆盖。 */
(function () {
  'use strict'
  var stage = document.getElementById('stage')
  /* 人话覆盖表：左边是共享运行时里写给工程的说法，右边是给现场用户看的说法。 */
  var PLAIN = [
    ['当前 React 固定展示 4 个官网入口',
     '固定 4 个官网入口，不随后台配置增减'],
    ['四个自由文本字段可补充快捷选项未覆盖的内容；补充说明按 React 合同最多 300 字。',
     '四个空格可以补充快捷选项里没有的内容；补充说明最多 300 字。'],
    ['静态稿不发起模型调用；确认后才进入 AI 求职方向探索。',
     '这一页不会调用 AI；确认之后才进入 AI 求职方向探索。'],
    ['二维码按官网地址在办理时生成；这里是示例码，扫不出来。',
     '二维码按这台机器内置的官网地址生成；这张示意图不可扫描。'],
    ['二维码按来源地址在运行时生成，这里只画二维码位置',
     '示例二维码，扫不出来']
  ]
  function plainify (root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null)
    var node
    while ((node = walker.nextNode())) {
      var text = node.nodeValue
      for (var i = 0; i < PLAIN.length; i++) {
        if (text.indexOf(PLAIN[i][0]) >= 0) text = text.split(PLAIN[i][0]).join(PLAIN[i][1])
      }
      if (text !== node.nodeValue) node.nodeValue = text
    }
  }
  plainify(stage)
  /* 页内 AI 辅助会整块重绘：重绘后再覆盖一次，不新增计时器。 */
  new MutationObserver(function () { plainify(stage) })
    .observe(stage, { childList: true, subtree: true })
})()
</script>
