<!--
  route: /print-scan（服务 Hub） + /print-scan/feature/:key（能力说明页，当前只有 key=id-photo）
  state: capability-loading | default | capability-error | locked | device-off | feature-id-photo | feature-not-found
  api:  GET /api/v1/terminals/:terminalId/capabilities   —— 能力探测轴（匿名只读，只回 configured=true 的键）
        GET /api/v1/terminals/:terminalId/printer-status —— 一体机(MFP)轴，fail-closed：null / 心跳过期 / 请求失败一律不算在线
  两轴分治（对齐 apps/kiosk/src/pages/print-scan/printHubContent.ts 与 PrintScanHomePage.tsx:345-385）：
    ① 探测轴优先。probe !== ok（loading / error）→ 七张能力卡**一律不开**，含证件照说明页；
       badge：loading = 「检查中」，error = 「暂不开放任务 · 服务状态无法确认」。
    ② 能力配置覆盖。CAPABILITY_STATUS_NOTES：testing=测试中，暂未对用户开放 / maintenance=维护中，暂时不可用 /
       unsupported=本终端不支持该能力 / not_verified=本机暂未开通。
    ③ MFP 轴 unavailable = 确定出不了纸（敢说哪几项停）；unknown = 读不到状态，不敢声称离线。
  到机码例外: 到机码核销**不在** CARD_CAPABILITY_KEY 里，也不随 MFP 轴停用 —— 它核销的是已存在订单，不是新建本机任务；
             探测失败时仍可点，但卡面如实写「这台机器现在出不了纸」。
  到机码位数: 8 位数字新码 + 10 位字母数字历史码（与 11-arrival-code.html 冻结页、COVERAGE-MATRIX §四.4 一致）。
             ⚠ 运行时 PrintScanHomePage.tsx:252 的卡面文案仍写「10 位到机码」，属跨批次待修债，本设计不跟随该旧文案。
  fallback: 任何锁定/异常态保留「联系工作人员」实体出口（≥56px）；不显示打印机就绪、纸量、扫描仪就绪等未证实结论
  未来 production route 对照：页内所有跳转带 data-route
  原型演示控制：本页状态仅通过 ?state= 切换，标注「原型演示控制」，不含生产业务逻辑；页面无计时器推进业务状态

#body-root[data-state="device-off"] .sec.grow .grid3,

#body-root[data-state="device-off"] .cap:not(.wide),

#body-root[data-state="capability-error"] .cap:not(.wide),
#body-root[data-state="locked"] .cap:not(.wide){
  display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-areas:"ic name" "ic desc" "ic foot";
  column-gap:12px;row-gap:2px;align-items:center;min-height:0;padding:12px 14px
}
#body-root[data-state="device-off"] .cap:not(.wide) .cap-icon,
#body-root[data-state="capability-loading"] .cap:not(.wide) .cap-icon,
#body-root[data-state="capability-error"] .cap:not(.wide) .cap-icon,
#body-root[data-state="locked"] .cap:not(.wide) .cap-icon{grid-area:ic;margin:0}
#body-root[data-state="device-off"] .cap:not(.wide) .cap-name,
#body-root[data-state="capability-loading"] .cap:not(.wide) .cap-name,
#body-root[data-state="capability-error"] .cap:not(.wide) .cap-name,

#body-root[data-state="device-off"] .cap:not(.wide) .cap-desc,

#body-root[data-state="device-off"] .cap:not(.wide) .cap-foot,

#body-root[data-state="locked"] .cap:not(.wide) .cap-foot{grid-area:foot;margin-top:0}
/* 9/28 留白（产品负责人：一屏不许留大片空白，也不许把内容挤出屏幕；不加区块、不改结构、文字一个字不改）
   1. 八张能力卡排成 3×3：证件照横卡挪到第三行，占签名盖章右边两格，第三行不再空着右边两格；
      三行等高分掉整块高度（默认态每张卡约 256px）。
   2. 带提示条的四个态（检查中 / 读取失败 / 被关掉 / 离线）：横排小卡定高 180，多出的高度分到提示条、01、02 三段之间。
   3. 证件照说明、能力说明不存在两态：不再把「开放后会做什么」「证件照说明」拉成空盒，按内容定高；
      两条替代路径和三个去处放大成主角，剩下的空白用 margin-top:auto 分到区块之间。 */
.sec.grow .grid3{grid-template-rows:repeat(3,1fr)!important;align-content:stretch!important}
.cap.wide{grid-column:2/-1}
#body-root:is([data-state="device-off"],[data-state="capability-loading"],[data-state="capability-error"],[data-state="locked"]) .sec.grow{flex:none;margin-top:auto!important;padding-top:20px}

<body>

<script>
var SCREEN='print-hub';
var STATES=['capability-loading','default','capability-error','locked','device-off','feature-id-photo','feature-not-found'];
var ICO={
 phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 5h4"/><path d="M9 14.5l3 3 3-3"/><path d="M12 17.5v-6"/>',
 usb:'<path d="M9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8"/><rect x="5" y="8" width="14" height="12" rx="3"/><path d="M12 12v4"/>',
 code:'<rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M7 9.5h2M11 9.5h2M15 9.5h2M7 13.5h6"/><path d="M9 21l3-3 3 3"/>',
 doc:'<path d="M14 2H6.5A2.5 2.5 0 0 0 4 4.5v15A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 2v6h6"/>',
 scan:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15.5l-4.5-4.5L8 19.5"/>',
 sign:'<path d="M4 20h16"/><path d="M6.5 16.5l8.8-8.8a2.1 2.1 0 0 1 3 3l-8.8 8.8-3.7.7.7-3.7z"/>',
 idcard:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.4"/><path d="M5.5 16.4c.7-1.6 2-2.4 3.5-2.4s2.8.8 3.5 2.4M15 10h4M15 14h3"/>',
 photo:'<rect x="2.5" y="6" width="19" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.4"/><path d="M8 6l1.4-2h5.2L16 6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
 arrow:'<path d="M9 5l7 7-7 7"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 lock:'<rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
 files:'<path d="M8 3.5h6l4 4V17a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z"/><path d="M14 3.5v4h4"/><path d="M4 7v11.5A2.5 2.5 0 0 0 6.5 21H16"/>'
};
function svg(n,s,w){return '<svg width="'+(w||30)+'" height="'+(w||30)+'" viewBox="0 0 24 24" fill="none" stroke="'+s+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[n]+'</svg>'}

/* 八张能力卡：key 与 CARD_CAPABILITY_KEY 对齐；探测轴不通过时全部关闭 */
var CAPS=[
 {key:'doc-print',capKey:'document_print',n:'文档打印',ic:'doc',bg:'var(--teal-soft)',st:'#157a67',
  d:'选文件，检查后设参数',foot:'带走：打印件',
  href:'12-file-source.html?source=document&tab=file',route:'/print/upload',mfp:true},
 {key:'phone-upload',capKey:'phone_upload',n:'手机扫码上传',ic:'phone',bg:'var(--slate-soft)',st:'#35608f',
  d:'扫码把手机文件传过来',foot:'带走：打印件',
  href:'12-file-source.html?source=document&tab=qr&mode=transfer',route:'/print/upload',mfp:false},
 {key:'usb-import',capKey:'usb_import',n:'U 盘导入打印',ic:'usb',bg:'var(--slate-soft)',st:'#35608f',
  d:'从 U 盘选文件打印',foot:'带走：打印件',
  href:'12-file-source.html?source=document&tab=usb&mode=transfer',route:'/print/upload',mfp:false},
 {key:'photo-print',capKey:'document_print',n:'照片打印',ic:'photo',bg:'var(--clay-soft)',st:'#9e5330',
  d:'选照片，检查后设参数',foot:'带走：照片打印件',
  href:'12-file-source.html?source=document&tab=file&category=photo',route:'/print/upload',mfp:true},
 {key:'scan',capKey:'scan',n:'材料扫描',ic:'scan',bg:'var(--slate-soft)',st:'#35608f',
  d:'到打印机面板扫描',foot:'带走：扫描 PDF',
  href:'18-scan-workbench.html',route:'/scan/start',mfp:true},
 {key:'convert',capKey:'format_convert',n:'格式转换',ic:'img',bg:'var(--teal-soft)',st:'#157a67',
  d:'多张图片合成 PDF',foot:'带走：合并 PDF',
  href:'19-img2pdf.html',route:'/print-scan/convert',mfp:false},
 {key:'sign',capKey:'signature_stamp',n:'签名',ic:'sign',bg:'var(--clay-soft)',st:'#9e5330',
  d:'放入本人手写签名',foot:'带走：签好的 PDF',
  href:'20-sign-stamp.html',route:'/print-scan/sign',mfp:false},
 {key:'id-photo',capKey:'id_photo',n:'证件照',ic:'idcard',bg:'var(--wheat-soft)',st:'#8a6219',
  d:'尚未开放，可查看说明',foot:'说明页 · 未开放',wide:true,
  href:'10-print-hub.html?state=feature-id-photo',route:'/print-scan/feature/id-photo',mfp:false}
];
/* CAPABILITY_STATUS_NOTES 逐字对齐运行时 */
var NOTES={testing:'测试中，暂未对用户开放',maintenance:'维护中，暂时不可用',unsupported:'本终端不支持该能力',not_verified:'本机暂未开通'};
/* opts: probe='ok'|'loading'|'error'；overrides={capKey:status}；mfp='ready'|'unavailable' */
function capCard(c,opts){
 var closed=false,badge='';
 if(opts.probe!=='ok'){closed=true;badge=opts.probe==='loading'?'检查中':'暂不开放任务 · 服务状态无法确认'}
 else{
  var ov=opts.overrides&&opts.overrides[c.capKey];
  if(ov){closed=true;badge=NOTES[ov]}
  else if(opts.mfp==='unavailable'&&c.mfp){closed=true;badge='这台机器现在出不了纸'}
 }
 var foot=closed?'<span class="cap-foot"><span class="badge-off">'+badge+'</span></span>':'<span class="cap-foot">'+c.foot+'</span>';
 var body=c.wide
  ?'<span class="cap-icon" style="background:'+c.bg+'">'+svg(c.ic,c.st,32)+'</span>'+
   '<span class="cap-body"><span class="cap-name">'+c.n+'</span><span class="cap-desc">'+c.d+'</span></span>'+foot
  :'<span class="cap-icon" style="background:'+c.bg+'">'+svg(c.ic,c.st,32)+'</span>'+
   '<span class="cap-name">'+c.n+'</span><span class="cap-desc">'+c.d+'</span>'+foot;
 var cls='cap'+(c.wide?' wide':'');
 if(closed) return '<div class="'+cls+'" role="group" aria-disabled="true" data-testid="print-hub-cap-'+c.key+'" aria-label="'+c.n+'（'+badge+'）">'+body+'</div>';
 return '<a class="'+cls+' press" href="'+c.href+'" data-route="'+c.route+'" data-testid="print-hub-cap-'+c.key+'">'+body+'</a>';
}
function capGrid(opts){
 var h='';for(var i=0;i<CAPS.length;i++)h+=capCard(CAPS[i],opts);
 return '<div class="grid3">'+h+'</div>';
}
/* 到机码：不在能力键内，永不随探测/MFP 轴整卡停用 */
function arrivalCard(mfpNote){
 return '<a class="src press" href="11-arrival-code.html" data-route="/print/pickup-claim" data-testid="print-hub-primary" data-arrival="true">'+
  '<span class="src-icon" style="background:var(--clay-soft)">'+svg('code','#9e5330',42)+'</span>'+
  '<span class="src-main"><span class="src-name">到机码核销<span class="tag">不是取件码</span></span>'+
  '<span class="src-desc">输入 <b>8 位数字到机码</b>（历史 10 位码也支持），核对订单后领取打印件。</span>'+
  (mfpNote?'<span class="reason">'+mfpNote+'</span>':'')+'</span>'+
  '<span class="src-go">'+svg('arrow','currentColor',28)+'</span></a>';
}
function quickLinks(){
 return '<div class="grid3">'+
  '<a class="notecard press" href="../kiosk-redesign-2026-08/38-member-assets.html?state=documents-ready" data-route="/me/documents" data-testid="print-hub-quick-documents">'+
  '<span class="note-ic">'+svg('files','currentColor',26)+'</span><span><b>我的文档</b><span class="d">选文件，带走打印件</span><span class="note-go">查看 →</span></span></a>'+
  '<a class="notecard press" href="../kiosk-redesign-2026-08/38-member-assets.html?state=orders-ready" data-route="/me/print-orders" data-testid="print-hub-quick-orders">'+
  '<span class="note-ic">'+svg('doc','currentColor',26)+'</span><span><b>打印订单</b><span class="d">查看订单与取件码</span><span class="note-go">查看 →</span></span></a>'+
  '<div class="notecard" role="group" data-testid="print-hub-copy-note" data-disclaimer="true">'+
  '<span class="note-ic" style="background:var(--wheat-soft);color:var(--wheat-d)">'+svg('copy','currentColor',26)+'</span>'+
  '<span><b>复印</b><span class="d">在打印机面板上操作，取走纸质复印件。</span></span></div>'+
  '</div>';
}
function axisChips(opts){
 return '<div class="qx2-readonly-meta">文件检查 → 设置参数 → 确认价格<br>按 A4 出纸 · 文件结束后可带走打印件</div>';
}
function hubBody(opts,leadHtml){
 return (leadHtml||'')+
  '<section class="sec grow"><div class="sec-label"><span class="no serif">01</span><span class="t">要办什么</span><span class="hint">'+opts.hint+'</span></div>'+
  (leadHtml?'':axisChips(opts))+capGrid(opts)+'</section>'+
  '<section class="sec last"><div class="sec-label"><span class="no serif">02</span><span class="t">已下过单 · 我的文件</span><span class="hint">用已有文件继续</span></div>'+
  arrivalCard(opts.mfpNote)+'<div style="height:16px"></div>'+quickLinks()+'</section>';
}
var V={};
V['capability-loading']=function(){
 return hubBody({probe:'loading',hint:'正在读取本机能力配置'},
  '<section class="sec"><div class="state" data-kind="info" data-testid="'+SCREEN+'-fallback">'+

var PILL={
 'capability-loading':['','正在读取本机能力'],
 'default':['','能力与设备状态以办理时确认'],
 'capability-error':['bad','服务状态无法确认 · 任务暂不开放'],
 'locked':['warn','部分能力已被管理员关闭'],
 'device-off':['warn','一体机离线 · 出纸类暂停'],
 'feature-id-photo':['warn','证件照尚未开放'],
 'feature-not-found':['warn','能力说明不存在']
};
var ASK={
 'capability-loading':['正在确认<em>这台机器</em>能做什么。','读到配置之前八项一律不开。到机码核销不受影响。'],
 'default':['你的文件，<em>现在在哪</em>？','选好材料，一步步做成<b>打印件或 PDF</b>。'],
 'capability-error':['本机能力<em>没读到</em>。','读不到就不放行 —— 七项全关。到机码核销的是已有订单，不受影响。'],
 'locked':['有几项<em>被关掉了</em>。','理由直接来自能力配置，不是我猜的。'],
 'device-off':['这台机器<em>出不了纸</em>。','要打印机的停了，不用打印机的照常。'],
 'feature-id-photo':['证件照<em>还没开放</em>。','我不会假装能给你排版出图；下面是真的能走的两条路。'],
 'feature-not-found':['这个能力名<em>我不认识</em>。','大概率是旧链接。回打印扫描首页重新选一次。']
};
function render(st){
 var root=document.getElementById('body-root');
 root.setAttribute('data-state',st);
 root.setAttribute('data-testid',SCREEN+'-state-'+st);
 root.innerHTML=V[st]();
 var p=document.getElementById('pill');
 p.className='pill'+(PILL[st][0]?' '+PILL[st][0]:'');
 document.getElementById('pill-txt').textContent=PILL[st][1];
 document.getElementById('pill-dot').className='dot'+(st==='capability-loading'?' breathe':'');
 document.getElementById('xq-ask').innerHTML=ASK[st][0];
 document.getElementById('xq-doing').innerHTML=ASK[st][1];
 var links=document.querySelectorAll('#demo-panel a');
 for(var i=0;i<links.length;i++) links[i].className=(links[i].getAttribute('data-s')===st?'on':'');
}
var q=new URLSearchParams(location.search);
if(q.get('debug')==='1'){document.documentElement.classList.add('debug');document.querySelectorAll('#demo-panel a').forEach(function(a){a.href='?debug=1&state='+a.getAttribute('data-s')})}
var st=q.get('state');
if(STATES.indexOf(st)<0) st=q.get('key')?'feature-not-found':'default';
render(st);
/* 原型演示控制（非产品功能）：只切 data-state，不驱动任何业务结果 */
document.getElementById('demo-tab').addEventListener('click',function(){
  document.getElementById('demo-panel').classList.toggle('show');
});
/* 时钟：仅刷新顶栏时间文本，不改 data-state、不推进任何业务状态 */
function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(new URLSearchParams(location.search).get('flat')==='1')document.getElementById('stage').classList.add('flat');
</script>
