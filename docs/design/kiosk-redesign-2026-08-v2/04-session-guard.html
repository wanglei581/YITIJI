<!DOCTYPE html>
<!--
青序流光 2.0 · 04 闲置提醒与清场
规则 1：顶栏没有可点入口；继续、清场和问小青都在底部够得着的位置。
规则 2：页标题 38，分区标题 30，正文 22–23，辅助 21，主按钮 27。倒计时数字仍用原稿的大号。
规则 3：写明清掉的是这台机器上的临时内容；打印件、到机码和已经交出去的单还在。
规则 4：三行边界并成一句。去掉「会话、服务端、exitTo、函数名、路径」。来源只写页面名，不写路径。
规则 7：底部保留「问小青：离开前纸和文件要不要先带走」，不让它决定要不要清场。
未改：颜色、圆角、深绿倒计时区、五态、清场只动这台机器。
9/28 留白：「不能继续 / 正在清 / 已清场」三态倒计时区用回原稿尺寸，「为什么没有继续办理」卡用回原稿内边距，区块用 space-around 均分剩余高度。不加区块、不改文字；warning 与 continue-failed 未动。
原稿：../kiosk-redesign-2026-08/04-session-guard.html（只读）。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>闲置提醒 · 职易达</title>
<!--
  route: /session-timeout（apps/kiosk/src/pages/placeholders/SessionTimeoutPage.tsx）
  state: warning | warning-no-continue | clearing | cleared | continue-failed
  数据来源（KioskSessionControlContext）：
    warning = { sourcePath, exitTo, canContinue, deadlineAt }
    continueSession() → 回到 **warning.sourcePath**；hardClear() → 清除本机会话；clearToScreensaver() → 回待机
  「我还在，继续使用」的落点（KioskPrivacyGuard.tsx:352-405，本页第一条硬约束）：
    · 来源页是 pendingWarning.sourcePath —— 弹这一屏之前用户所在的那一页，不是首页；
    · 运行时的回法是 navigate(-1)（回退到 sourceHistoryIndex 那一条 history entry），
      所以落点必然等于 sourcePath；
    · 守卫不过就 fail-closed：pendingWarning 为空、已过 deadlineAt、sourceHistoryIndex 为空、
      或当前 history 位置不等于 sourceHistoryIndex+1 → 直接 hardClear() 回首页并清场。
    静态页没有 history，所以用 ?from= 演示这条来源：?from= 走与 /login 同一套安全校验
    （/ 开头、不含 //、反斜线、控制字符，且不是 /session-timeout 自身），再经**唯一一张
    route → 静态 HTML 白名单**换成本仓库里真实存在的页面。白名单里没有的 route 一律
    fail-closed 回 01-home.html，并在屏幕上写清「为什么回的是首页」——
    绝不允许出现「显示来源是 /resume/optimize、点下去却回首页」这种自相矛盾。
    页面上展示的来源、guard-from 里的文案、按钮的 href 与 data-route 全部来自同一个 resolver。
  倒计时口径：由 deadlineAt 与**本机时钟**相减得到，纯前端。
    没有离人传感器，没有服务端倒计时，没有摄像头判人 —— 这三样这台机器都没有，页面不得画。
  清除口径（本页唯一正确说法）：
    结束会话清除的是**本机登录态与临时会话信息**；
    已创建的打印/扫描任务继续运行，账号内的文档、订单、AI 记录按**服务端留存期限**管理。
    静态页不声称真的清掉了服务端订单或文件，cleared 也只代表本机清场例程返回了成功。
  AI 边界: 本 route 为 AI-NONE。AI 不判定会话超时、清场是否完成、任务是否仍在运行。
  原型演示控制: ?state= 只切换展示状态；?from= 演示来源页（同时决定「继续使用」按钮的 href 与 data-route）；
                ?capture=1 冻结倒计时；?flat=1 关非必要动效；?debug=1 显演示面板。
                页内换状态会保留 from / debug / flat / capture。倒计时到 0 不自动跳转、不代替执行清场。
                示例：?state=warning&from=%2Fresume%2Foptimize → 继续使用落到 23-resume-optimize.html；
                      ?state=warning&from=%2Fnot%2Fmapped     → fail-closed 回 01-home.html 并写明原因。
-->

<body>
<div id="stage">
  <header class="topbar">
    <div class="logo"><div class="logo-mark serif">职</div><div class="logo-name">职易达</div></div>
    <div class="sp"></div>
    <div class="pill" id="pill"><span class="dot" id="pill-dot" aria-hidden="true"></span><span id="pill-txt">本机计时 · 不依赖网络</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="body" id="body-root" data-screen="session-guard" data-state="warning" data-testid="session-guard-state-warning">
    <div class="scrollarea" id="scrollarea"></div>
    <p class="qx-aiwrap"><a class="qx-ai" href="05-ai-cockpit.html">问小青：离开前纸和文件要不要先带走</a></p>

  </main>

  <div class="truth" data-disclaimer="true" data-testid="session-guard-truth">

  </div>

</div>
<script>
var SCREEN='session-guard';
var STATES=['warning','warning-no-continue','clearing','cleared','continue-failed'];
var ICO={
 broom:'<path d="M15.5 3.5l5 5"/><path d="M13 6L5.5 13.5 4 20l6.5-1.5L18 11"/><path d="M9 10l5 5"/>',
 lock:'<rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
 server:'<rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7 7.2h.01M7 16.8h.01"/>',
 warn:'<path d="M12 4.6L21 19.4H3z"/><path d="M12 10v4.6M12 17.2h.01"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.3"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 printer:'<path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.2"/>'
};
function svg(n,s,w){return '<svg width="'+(w||28)+'" height="'+(w||28)+'" viewBox="0 0 24 24" fill="none" stroke="'+(s||'currentColor')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[n]+'</svg>'}

var q=new URLSearchParams(location.search);
/* ── 来源页解析：唯一 resolver ────────────────────────────────────
   ① 安全校验（与 src/auth/returnPath.ts isSafeInternalPath 同口径，静态页更严一档）；
   ② route → 本仓库真实存在的静态 HTML（下表按 COVERAGE-MATRIX 的宿主分账写死）；
   ③ 查不到就 fail-closed 回 01-home.html，并如实说明原因。
   页面里所有「回到来源页」的展示与链接都必须用这个结果，不许各写各的。 */
function hasControlChar(p){
 for(var i=0;i<p.length;i++){var c=p.charCodeAt(i);if(c<32||c===127)return true}
 return false;
}
function isSafeInternalPath(p){
 if(typeof p!=='string'||p==='')return false;
 if(p.charAt(0)!=='/')return false;
 if(p.indexOf('//')>=0)return false;
 if(p.indexOf('\\')>=0)return false;
 if(hasControlChar(p))return false;
 if(p==='/session-timeout'||p.indexOf('/session-timeout')===0)return false;

 'warning':['warn','闲置提醒 · 本机计时'],
 'warning-no-continue':['warn','已到最长使用时间'],
 'clearing':['','正在清掉这次内容'],
 'cleared':['ok','这台机器已清干净'],
 'continue-failed':['bad','没能接着办']
};

var root=document.getElementById('body-root');
var COUNT_FROM=60,timer=null;
function render(state){
 var view=V[state]();
 root.setAttribute('data-state',state);
 root.setAttribute('data-testid',SCREEN+'-state-'+state);
 document.getElementById('scrollarea').innerHTML=view.body;
 document.getElementById('ctabar').innerHTML=view.cta;
 var p=document.getElementById('pill');
 p.className='pill'+(PILL[state][0]?' '+PILL[state][0]:'');
 document.getElementById('pill-txt').textContent=PILL[state][1];
 document.getElementById('pill-dot').className='dot'+(state==='clearing'?' breathe':'');
 document.querySelectorAll('[data-go]').forEach(function(b){
  b.addEventListener('click',function(){location.href=b.getAttribute('data-go')});
 });
 startCount();
}
/* 本机倒计时：真实的本地计时，不自动跳转、不代替执行清场；?capture=1 冻结以便复现截图 */
function startCount(){
 if(timer){clearInterval(timer);timer=null}
 var el=document.getElementById('count');
 if(!el||q.get('capture')==='1')return;
 var left=COUNT_FROM;
 timer=setInterval(function(){
  left-=1;
  if(left<=0){
   clearInterval(timer);timer=null;
   el.textContent='0';
   var u=document.getElementById('count-unit');
   if(u)u.textContent='计时已到，真实实现在此执行本机清场';
   return;
  }
  el.textContent=String(left);
 },1000);
}
var state=q.get('state');
if(STATES.indexOf(state)<0)state='warning';
render(state);

var panel=document.getElementById('demo-panel');
for(var i=0;i<STATES.length;i++){
 var a=document.createElement('a');
 var href=Q(STATES[i]);
 if(href.indexOf('debug=1')<0)href+='&debug=1';
 a.href=href;a.textContent=STATES[i];
 if(STATES[i]===state)a.className='on';
 panel.appendChild(a);
}
if(q.get('debug')==='1')document.documentElement.classList.add('debug');
document.getElementById('demo-tab').addEventListener('click',function(){panel.classList.toggle('show')});
function tick(){if(q.get('capture')==='1'){document.getElementById('clock').textContent='09:30';return}var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
if(q.get('flat')==='1')document.getElementById('stage').classList.add('flat');
</script>
</body>
</html>
