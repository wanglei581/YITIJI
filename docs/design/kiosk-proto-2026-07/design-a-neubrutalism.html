<!DOCTYPE html>
<html lang='zh-CN'>
<head><meta charset='UTF-8'><title>新野兽派 · 职易达AI求职操作系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#FFFEF0;--blk:#0d0d0d;--yel:#FFE500;--teal:#1f9e86;--wht:#fff;--r:0px;}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#222;}
#stage{width:1080px;height:1920px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;transform-origin:top left;}
.topbar{height:80px;background:var(--blk);display:flex;align-items:center;justify-content:space-between;padding:0 44px;flex:none;}
.t-brand{display:flex;align-items:center;gap:14px;}
.t-mark{width:48px;height:48px;background:var(--yel);display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;color:var(--blk);}
.t-name{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:900;color:var(--wht);letter-spacing:2px;}
.t-right{display:flex;align-items:center;gap:16px;}
.t-clock{font-size:17px;color:rgba(255,255,255,.6);}
.t-chip{display:flex;align-items:center;gap:8px;background:var(--yel);padding:8px 16px;font-size:15px;font-weight:700;color:var(--blk);}
.t-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--blk);}
/* HERO */
.hero{flex:none;padding:36px 48px 28px;background:var(--wht);border-bottom:3px solid var(--blk);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.h-text{}
.h-eye{font-size:15px;font-weight:700;color:var(--teal);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
.h-title{font-family:'Noto Serif SC',serif;font-size:54px;font-weight:900;color:var(--blk);line-height:1.1;letter-spacing:-1px;}
.h-title em{font-style:normal;color:var(--teal);}
.h-sub{font-size:19px;color:#555;margin-top:10px;letter-spacing:1px;}
.h-login{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:8px;}
.h-btn{min-height:82px;padding:0 30px;background:var(--yel);border:3px solid var(--blk);box-shadow:5px 5px 0 var(--blk);font-family:inherit;font-size:24px;font-weight:700;color:var(--blk);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
.h-btn svg{width:24px;height:24px;}
.h-hint{font-size:14px;color:#777;text-align:center;}
/* RECEPTION */
.recept{flex:none;padding:0 48px;margin-top:24px;display:grid;grid-template-columns:1fr 254px;gap:14px;}
.ar{background:var(--wht);border:3px solid var(--blk);box-shadow:6px 6px 0 var(--blk);padding:26px 26px 20px;}
.ar-lbl{display:inline-block;background:var(--blk);color:var(--yel);font-size:13px;font-weight:700;letter-spacing:2px;padding:5px 13px;margin-bottom:14px;}
.ar-h{font-family:'Noto Serif SC',serif;font-size:32px;font-weight:900;color:var(--blk);line-height:1.25;margin-bottom:15px;}
.ar-row{display:flex;gap:0;margin-bottom:12px;}
.ar-inp{flex:1;min-height:70px;padding:0 18px;font-size:19px;font-family:inherit;color:var(--blk);background:var(--bg);border:3px solid var(--blk);border-right:none;}
.ar-inp::placeholder{color:#aaa;}
.ar-mic{width:70px;background:var(--blk);border:3px solid var(--blk);display:grid;place-items:center;cursor:pointer;color:var(--yel);}
.ar-mic svg{width:26px;height:26px;}
.ar-cta{width:100%;min-height:78px;background:var(--yel);border:3px solid var(--blk);box-shadow:5px 5px 0 var(--blk);font-family:'Noto Serif SC',serif;font-size:28px;font-weight:900;color:var(--blk);cursor:pointer;letter-spacing:2px;margin-bottom:9px;}
.ar-hint{font-size:13px;color:#888;text-align:center;margin-bottom:12px;}
.ar-chips{display:flex;gap:8px;flex-wrap:wrap;}
.ar-chip{min-height:46px;padding:0 14px;background:var(--wht);border:2.5px solid var(--blk);box-shadow:2px 2px 0 var(--blk);font-family:inherit;font-size:16px;color:var(--blk);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.ar-chip svg{width:14px;height:14px;}
/* DEVICE */
.ds{background:var(--wht);border:3px solid var(--blk);box-shadow:4px 4px 0 var(--blk);padding:20px 20px;}
.ds-t{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;color:var(--blk);border-bottom:2.5px solid var(--blk);padding-bottom:9px;margin-bottom:13px;}
.ds-s{font-size:13px;color:#666;margin-bottom:13px;margin-top:-4px;}
.ds-list{display:flex;flex-direction:column;gap:8px;}
.ds-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:2px solid var(--blk);padding:10px 13px;}
.ds-il{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--blk);}
.ds-il svg{width:17px;height:17px;}
.ds-dot{width:13px;height:13px;background:var(--teal);border:2px solid var(--blk);}
/* DISPATCH */
.disp{flex:none;padding:14px 48px;display:flex;align-items:center;gap:10px;}
.d-line{flex:1;height:2.5px;background:var(--blk);}
.d-tag{background:var(--yel);border:2.5px solid var(--blk);padding:5px 14px;font-size:13px;font-weight:700;color:var(--blk);letter-spacing:1px;white-space:nowrap;}
/* SERVICES */
.svc-hd{flex:none;padding:4px 48px 12px;display:flex;align-items:baseline;gap:14px;border-top:2.5px solid var(--blk);}
.sh-t{font-family:'Noto Serif SC',serif;font-size:29px;font-weight:900;color:var(--blk);letter-spacing:1px;}
.sh-tag{background:var(--yel);border:2.5px solid var(--blk);padding:3px 11px;font-size:13px;font-weight:700;color:var(--blk);}
.sh-h{font-size:15px;color:#666;}
.svc-grid{flex:none;padding:0 48px;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sv{display:flex;align-items:center;gap:0;min-height:98px;background:var(--wht);border:2.5px solid var(--blk);box-shadow:4px 4px 0 var(--blk);cursor:pointer;}
.sv:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--blk);}
.sv-stripe{width:7px;align-self:stretch;flex:none;}
.sv-ico{width:46px;height:46px;flex:none;background:var(--blk);display:grid;place-items:center;color:var(--yel);margin:0 14px;}
.sv-ico svg{width:24px;height:24px;}
.sv-body{flex:1;min-width:0;padding-right:12px;}
.sv-body b{display:block;font-size:21px;font-weight:900;color:var(--blk);letter-spacing:.5px;}
.sv-body .sv-sub{display:block;font-size:13px;color:#555;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sv-ai{display:inline-block;font-size:11.5px;font-weight:700;color:var(--teal);background:var(--bg);border:1.5px solid var(--teal);padding:2px 6px;margin-top:4px;letter-spacing:.5px;}
/* NOTICE */
.notice{flex:none;margin:9px 48px 0;background:var(--bg);border:2px dashed var(--blk);padding:10px 15px;font-size:14px;color:#666;display:flex;gap:9px;line-height:1.5;}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px;}
/* NAVBAR */
.navbar{margin-top:auto;height:116px;background:var(--blk);display:grid;grid-template-columns:repeat(3,1fr);}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);font-size:19px;font-family:inherit;letter-spacing:1px;position:relative;}
.nav-item svg{width:32px;height:32px;}
.nav-item.active{color:var(--yel);}
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:4px;background:var(--yel);}
</style></head>
<body><div id='stage'>
<header class='topbar'>
  <div class='t-brand'><div class='t-mark'>职</div><span class='t-name'>职易达AI求职操作系统</span></div>
  <div class='t-right'><span class='t-clock'>2026年8月3日 10:30</span><span class='t-chip'><span class='dot'></span>打印机在线</span></div>
</header>
<section class='hero'>
  <div class='h-text'>
    <p class='h-eye'>AI JOB PLATFORM · 2026</p>
    <h1 class='h-title'>简历、岗位、打印<br><em>一趟办完</em></h1>
    <p class='h-sub'>AI帮你规划 · 本机帮你办完 · 全程陪伴</p>
  </div>
  <div class='h-login'>
    <button class='h-btn'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='8' r='4'/><path d='M4 21a8 8 0 0116 0'/></svg>登录 / 注册</button>

      <div class='ds-item'><div class='ds-il'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3M3 12h18'/></svg>材料扫描就绪</div><span class='ds-dot'></span></div>
      <div class='ds-item'><div class='ds-il'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2zM11 3h7a2 2 0 012 2v14a2 2 0 01-2 2h-7'/></svg>自动双面可用</div><span class='ds-dot'></span></div>
    </div>
  </div>
</div>
<div class='disp'><div class='d-line'></div><span class='d-tag'>✦ AI能力调度 ✦</span><div class='d-line'></div></div>
<div class='svc-hd'><span class='sh-t'>核心服务</span><span class='sh-tag'>AI增强</span><span class='sh-h'>知道要办什么，也可以直接进入</span></div>
<div class='svc-grid'>
  <button class='sv'><div class='sv-stripe' style='background:#3f68b0'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M6 9V3h12v6M6 18h-2a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2M6 15h12v6H6z'/></svg></div><div class='sv-body'><b>打印扫描</b><span class='sv-sub'>上传、扫描与本机出纸</span><span class='sv-ai'>✦ AI文件预检</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#1f9e86'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M7 3h8l4 4v14H7z'/><path d='M15 3v4h4M10 12l2 2 4-4'/></svg></div><div class='sv-body'><b>AI简历服务</b><span class='sv-sub'>诊断、优化、生成与打印</span><span class='sv-ai'>✦ AI诊断优化</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#b8683c'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='3' y='7' width='18' height='13' rx='2'/><path d='M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2'/></svg></div><div class='sv-body'><b>岗位信息</b><span class='sv-sub'>线上平台 + 线下机构双轨</span><span class='sv-ai'>✦ AI岗位研判</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#a9781f'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 21s-7-6.1-7-11a7 7 0 0114 0c0 4.9-7 11-7 11z'/><circle cx='12' cy='10' r='2.5'/></svg></div><div class='sv-body'><b>招聘会</b><span class='sv-sub'>场次信息与现场服务</span><span class='sv-ai'>✦ AI材料清单</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#7a5a86'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='9' y='3' width='6' height='11' rx='3'/><path d='M5 11a7 7 0 0014 0M12 18v3'/></svg></div><div class='sv-body'><b>AI面试训练</b><span class='sv-sub'>模拟练习与训练报告</span><span class='sv-ai'>✦ AI模拟反馈</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#a9781f'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M5 4h14v16l-3.5-2-3.5 2-3.5-2L5 20z'/><path d='M9 9h6M9 13h4'/></svg></div><div class='sv-body'><b>政策服务</b><span class='sv-sub'>政策查询与材料指引</span><span class='sv-ai'>✦ AI来源解读</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#7a5a86'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='3' y='8' width='18' height='12' rx='2'/><path d='M9 8V6a3 3 0 016 0v2M3 13h18'/></svg></div><div class='sv-body'><b>百宝箱</b><span class='sv-sub'>证件照、文档与实用工具</span><span class='sv-ai'>✦ AI受控工具</span></div></button>
  <button class='sv'><div class='sv-stripe' style='background:#1f9e86'></div><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 3L2 8l10 5 10-5z'/><path d='M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5'/></svg></div><div class='sv-body'><b>智慧校园</b><span class='sv-sub'>校园服务与信息展示</span><span class='sv-ai'>✦ AI场景引导</span></div></button>
</div>
<div class='notice'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M12 8v5M12 16.5v.5'/></svg>岗位与招聘会信息均来自第三方 / 官方来源，本终端仅提供信息展示与跳转，投递、预约请前往来源平台办理。</div>
<nav class='navbar'>
  <button class='nav-item active'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10'/></svg>首页</button>
  <button class='nav-item'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z'/></svg>AI顾问</button>
  <button class='nav-item'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='8' r='4'/><path d='M4 21a8 8 0 0116 0'/></svg>我的</button>
</nav>
</div></body></html>
