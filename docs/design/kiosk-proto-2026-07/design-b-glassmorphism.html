<!DOCTYPE html>
<html lang='zh-CN'>
<head><meta charset='UTF-8'><title>毛玻璃沉浸 · 职易达AI求职操作系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#000;}
#stage{
  width:1080px;height:1920px;
  background:linear-gradient(145deg,#0a1628 0%,#071813 35%,#0e0a20 70%,#0a1628 100%);
  display:flex;flex-direction:column;overflow:hidden;transform-origin:top left;
  position:relative;
}
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 600px at 20% 15%,rgba(31,158,134,.18),transparent 60%),
    radial-gradient(ellipse 700px 500px at 85% 45%,rgba(100,60,180,.15),transparent 55%),
    radial-gradient(ellipse 600px 400px at 50% 80%,rgba(31,100,158,.12),transparent 50%);
}
.topbar{height:80px;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;padding:0 44px;flex:none;position:relative;z-index:10;}
.t-brand{display:flex;align-items:center;gap:14px;}
.t-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#1f9e86,#0d6b5a);display:grid;place-items:center;color:#fff;font-family:'Noto Serif SC',serif;font-size:20px;font-weight:900;box-shadow:0 0 20px rgba(31,158,134,.4);}
.t-name{font-family:'Noto Serif SC',serif;font-size:25px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:2px;}
.t-clock{font-size:17px;color:rgba(255,255,255,.5);}
.t-chip{display:flex;align-items:center;gap:8px;background:rgba(31,158,134,.15);border:1px solid rgba(87,217,184,.3);padding:7px 15px;border-radius:999px;font-size:15px;color:#57d9b8;}
.t-chip .dot{width:8px;height:8px;border-radius:50%;background:#57d9b8;box-shadow:0 0 8px #57d9b8;}
/* HERO */
.hero{flex:none;padding:32px 48px 22px;position:relative;z-index:5;}
.h-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
.h-kicker{font-size:14px;font-weight:600;color:rgba(87,217,184,.7);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
.h-title{font-family:'Noto Serif SC',serif;font-size:50px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:1px;text-shadow:0 0 40px rgba(31,158,134,.3);}
.h-title em{font-style:normal;color:#57d9b8;}
.h-sub{font-size:18px;color:rgba(255,255,255,.5);margin-top:8px;letter-spacing:1px;}
.h-btn{flex:none;min-height:74px;padding:0 28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:18px;backdrop-filter:blur(10px);color:rgba(255,255,255,.85);font-family:inherit;font-size:21px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap;}
.h-btn svg{width:23px;height:23px;}
/* RECEPTION */
.recept{flex:none;padding:0 48px;margin-top:18px;display:grid;grid-template-columns:1fr 276px;gap:14px;position:relative;z-index:5;}
.ar{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px 26px 20px;position:relative;overflow:hidden;}
.ar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(87,217,184,.6),rgba(150,100,220,.4),transparent);}
.ar-badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:rgba(87,217,184,.85);background:rgba(31,158,134,.1);border:1px solid rgba(87,217,184,.2);padding:4px 12px;border-radius:999px;margin-bottom:12px;}
.ar-badge .dot{width:6px;height:6px;border-radius:50%;background:#57d9b8;box-shadow:0 0 6px #57d9b8;}
.ar-av{font-size:13px;color:rgba(255,255,255,.4);float:right;margin-top:-26px;}
.ar-h{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:14px;letter-spacing:1px;}
.ar-row{display:flex;gap:10px;margin-bottom:12px;}
.ar-inp{flex:1;min-height:66px;padding:0 18px;font-size:19px;font-family:inherit;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;backdrop-filter:blur(8px);}
.ar-inp::placeholder{color:rgba(255,255,255,.25);}
.ar-mic{width:66px;flex:none;background:rgba(31,158,134,.12);border:1px solid rgba(87,217,184,.2);border-radius:14px;display:grid;place-items:center;cursor:pointer;color:#57d9b8;}
.ar-mic svg{width:25px;height:25px;}
.ar-cta{width:100%;min-height:72px;background:linear-gradient(135deg,#1f9e86,#157a67);border:none;border-radius:18px;font-family:'Noto Serif SC',serif;font-size:27px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:2px;box-shadow:0 0 30px rgba(31,158,134,.5),0 4px 16px rgba(0,0,0,.3);}
.ar-hint{font-size:13px;color:rgba(255,255,255,.35);text-align:center;margin:7px 0 11px;}
.ar-chips{display:flex;gap:8px;flex-wrap:wrap;}
.ar-chip{min-height:46px;padding:0 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;font-family:inherit;font-size:16px;color:rgba(255,255,255,.65);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.ar-chip svg{width:13px;height:13px;color:#57d9b8;}
.ar-wave{display:flex;align-items:flex-end;gap:3px;margin-top:10px;height:16px;}
.ar-wave span{width:3px;border-radius:2px;background:#57d9b8;opacity:.15;}
/* DEVICE */
.ds{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px 20px;display:flex;flex-direction:column;}
.ds-t{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:700;color:rgba(255,255,255,.85);}
.ds-s{font-size:13px;color:rgba(255,255,255,.35);margin:4px 0 13px;}
.ds-list{display:flex;flex-direction:column;gap:8px;flex:1;}
.ds-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px 14px;}
.ds-il{display:flex;align-items:center;gap:10px;font-size:17px;color:rgba(255,255,255,.65);}
.ds-il svg{width:17px;height:17px;color:#57d9b8;}
.ds-dot{width:9px;height:9px;border-radius:50%;background:#57d9b8;box-shadow:0 0 8px #57d9b8;}
.ds-foot{font-size:12px;color:rgba(255,255,255,.28);text-align:center;margin-top:11px;display:flex;align-items:center;gap:5px;justify-content:center;}
.ds-foot svg{width:12px;height:12px;}
/* DISPATCH */
.disp{flex:none;padding:10px 48px;display:flex;align-items:center;gap:12px;position:relative;z-index:5;}
.d-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(87,217,184,.2),transparent);}
.d-tag{font-size:12.5px;color:rgba(87,217,184,.7);background:rgba(31,158,134,.08);border:1px solid rgba(87,217,184,.18);padding:4px 12px;border-radius:999px;white-space:nowrap;}
/* SERVICES */
.svc-hd{flex:none;padding:8px 48px 10px;display:flex;align-items:center;gap:12px;position:relative;z-index:5;}
.sh-t{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:1px;}
.sh-tag{font-size:12.5px;color:rgba(87,217,184,.8);background:rgba(31,158,134,.08);border:1px solid rgba(87,217,184,.18);padding:3px 10px;border-radius:999px;}
.sh-h{font-size:15px;color:rgba(255,255,255,.3);}
.svc-grid{flex:none;padding:0 48px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:5;}
.sv{display:flex;align-items:center;gap:13px;min-height:96px;padding:13px 15px 11px;background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:18px;cursor:pointer;border-left:3px solid var(--ac,rgba(87,217,184,.5));}
.sv:active{background:rgba(255,255,255,.11);}
.sv-ico{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08);}
.sv-ico svg{width:24px;height:24px;color:rgba(255,255,255,.75);}
.sv-body{flex:1;min-width:0;}
.sv-body b{display:block;font-size:21px;font-weight:700;color:rgba(255,255,255,.88);letter-spacing:.3px;}
.sv-body .sv-sub{display:block;font-size:13px;color:rgba(255,255,255,.38);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sv-ai{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-style:normal;color:rgba(87,217,184,.7);background:rgba(31,158,134,.08);border:1px solid rgba(87,217,184,.15);padding:2px 6px;border-radius:999px;margin-top:4px;}
.sv-ai::before{content:"✦";font-size:8px;}
/* NOTICE */
.notice{flex:none;margin:8px 48px 0;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.1);border-radius:12px;padding:10px 15px;font-size:13.5px;color:rgba(255,255,255,.3);display:flex;gap:9px;position:relative;z-index:5;}
.notice svg{width:15px;height:15px;flex:none;margin-top:2px;color:rgba(87,217,184,.4);}
/* NAVBAR */
.navbar{margin-top:auto;height:116px;background:rgba(0,0,0,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(3,1fr);position:relative;z-index:10;}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);font-size:18px;font-family:inherit;letter-spacing:1px;}
.nav-item svg{width:30px;height:30px;}
.nav-item.active{color:#57d9b8;}
.nav-item.active::after{content:'';display:block;position:absolute;bottom:16px;width:32px;height:3px;border-radius:2px;background:#57d9b8;box-shadow:0 0 8px #57d9b8;}
</style></head>
<body><div id='stage'>
<header class='topbar'>
  <div class='t-brand'><div class='t-mark'>职</div><span class='t-name'>职易达AI求职操作系统</span></div>

</header>

      <button class='ar-chip'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M12 21s-7-6.1-7-11a7 7 0 0114 0'/></svg>准备招聘会材料</button>
      <button class='ar-chip'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M6 9V3h12v6'/></svg>打印手机里的文件</button>
    </div>
    <div class='ar-wave'><span style='height:5px'></span><span style='height:12px'></span><span style='height:18px'></span><span style='height:9px'></span><span style='height:15px'></span><span style='height:7px'></span><span style='height:13px'></span><span style='height:18px'></span><span style='height:10px'></span><span style='height:16px'></span><span style='height:6px'></span><span style='height:14px'></span><span style='height:18px'></span><span style='height:8px'></span><span style='height:12px'></span></div>
  </div>
  <div class='ds'>
    <div class='ds-t'>本机办结能力</div><p class='ds-s'>AI调用设备，现场完成</p>
    <div class='ds-list'>
      <div class='ds-item'><div class='ds-il'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M6 9V3h12v6M6 18h-2a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2M6 15h12v6H6z'/></svg>文档打印就绪</div><span class='ds-dot'></span></div>
      <div class='ds-item'><div class='ds-il'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3M3 12h18'/></svg>材料扫描就绪</div><span class='ds-dot'></span></div>
      <div class='ds-item'><div class='ds-il'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2z'/></svg>自动双面可用</div><span class='ds-dot'></span></div>
    </div>
    <div class='ds-foot'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg>设备状态实时检测</div>
  </div>
</div>
<div class='disp'><div class='d-line'></div><span class='d-tag'>✦ AI能力调度</span><div class='d-line'></div></div>
<div class='svc-hd'><span class='sh-t'>核心服务</span><span class='sh-tag'>AI增强服务</span><span class='sh-h'>知道要办什么，也可以直接进入</span></div>
<div class='svc-grid'>
  <button class='sv' style='--ac:rgba(63,104,176,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M6 9V3h12v6M6 18h-2a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2M6 15h12v6H6z'/></svg></div><div class='sv-body'><b>打印扫描</b><span class='sv-sub'>上传、扫描与本机出纸</span><em class='sv-ai'>AI文件预检</em></div></button>
  <button class='sv' style='--ac:rgba(31,158,134,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M7 3h8l4 4v14H7z'/><path d='M15 3v4h4M10 12l2 2 4-4'/></svg></div><div class='sv-body'><b>AI简历服务</b><span class='sv-sub'>诊断、优化、生成与打印</span><em class='sv-ai'>AI诊断优化</em></div></button>
  <button class='sv' style='--ac:rgba(184,104,60,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><rect x='3' y='7' width='18' height='13' rx='2'/><path d='M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2'/></svg></div><div class='sv-body'><b>岗位信息</b><span class='sv-sub'>线上平台 + 线下机构</span><em class='sv-ai'>AI岗位研判</em></div></button>
  <button class='sv' style='--ac:rgba(169,120,31,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M12 21s-7-6.1-7-11a7 7 0 0114 0c0 4.9-7 11-7 11z'/><circle cx='12' cy='10' r='2.5'/></svg></div><div class='sv-body'><b>招聘会</b><span class='sv-sub'>场次信息与现场服务</span><em class='sv-ai'>AI材料清单</em></div></button>
  <button class='sv' style='--ac:rgba(122,90,134,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><rect x='9' y='3' width='6' height='11' rx='3'/><path d='M5 11a7 7 0 0014 0M12 18v3'/></svg></div><div class='sv-body'><b>AI面试训练</b><span class='sv-sub'>模拟练习与训练报告</span><em class='sv-ai'>AI模拟反馈</em></div></button>
  <button class='sv' style='--ac:rgba(169,120,31,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M5 4h14v16l-3.5-2-3.5 2-3.5-2L5 20z'/><path d='M9 9h6M9 13h4'/></svg></div><div class='sv-body'><b>政策服务</b><span class='sv-sub'>政策查询与材料指引</span><em class='sv-ai'>AI来源解读</em></div></button>
  <button class='sv' style='--ac:rgba(122,90,134,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><rect x='3' y='8' width='18' height='12' rx='2'/><path d='M9 8V6a3 3 0 016 0v2M3 13h18'/></svg></div><div class='sv-body'><b>百宝箱</b><span class='sv-sub'>证件照、文档与实用工具</span><em class='sv-ai'>AI受控工具</em></div></button>
  <button class='sv' style='--ac:rgba(31,158,134,.6)'><div class='sv-ico'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M12 3L2 8l10 5 10-5z'/><path d='M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5'/></svg></div><div class='sv-body'><b>智慧校园</b><span class='sv-sub'>校园服务与信息展示</span><em class='sv-ai'>AI场景引导</em></div></button>
</div>
<div class='notice'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><circle cx='12' cy='12' r='9'/><path d='M12 8v5M12 16.5v.5'/></svg>岗位与招聘会信息均来自第三方/官方来源，本终端仅提供信息展示与跳转，投递、预约请前往来源平台办理。</div>
<nav class='navbar'>
  <button class='nav-item active'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10'/></svg>首页</button>
  <button class='nav-item'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><path d='M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z'/></svg>AI顾问</button>
  <button class='nav-item'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><circle cx='12' cy='8' r='4'/><path d='M4 21a8 8 0 0116 0'/></svg>我的</button>
</nav>
</div></body></html>
