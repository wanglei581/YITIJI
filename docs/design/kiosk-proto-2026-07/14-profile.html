<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的 · 个人服务中心</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* 我的页 v4 · 紧凑布局 · 全部内容在1920px内可见 */
  .user-band {
    flex: none; padding: 18px 48px 16px;
    display: flex; align-items: center; gap: 22px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .ub-av {
    width: 64px; height: 64px; flex: none; border-radius: 50%;
    background: var(--teal); color: #fffdf8;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 25px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(31,158,134,.22);
  }
  .ub-info { flex: 1; min-width: 0; }
  .ub-name { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--ink); }
  .ub-sub { font-size: 17px; color: var(--muted); margin-top: 3px; }
  .ub-stats { display: flex; gap: 0; flex: none; }
  .ubs { padding: 4px 18px; text-align: center; border-left: 1px solid var(--line); }
  .ubs b { display: block; font-size: 24px; font-weight: 800; color: var(--teal-deep); font-variant-numeric: tabular-nums; }
  .ubs span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  /* 小青建议条 */
  .qing-strip {
    display: flex; align-items: center; gap: 14px;
    background: var(--wheat-soft); border: 1px solid rgba(169,120,31,.22);
    border-radius: var(--r-sm); padding: 12px 20px;
  }
  .qs-spark { font-size: 26px; color: var(--wheat); flex: none; line-height: 1; }
  .qs-body { flex: 1; min-width: 0; }
  .qs-label { display: block; font-size: 12.5px; color: var(--wheat-deep); font-weight: 700; margin-bottom: 3px; }
  .qs-body b { font-size: 18px; font-weight: 700; color: var(--ink); }
  .qs-hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .qs-btns { display: flex; gap: 8px; flex: none; }
  /* 轻量分区标题（替代 card-head） */
  .sec-bar {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 10px;
  }
  .sec-bar h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: 1px; }
  .sec-bar .sec-sub { font-size: 16px; color: var(--muted); }
  .content { gap: 16px; }

  /* .tiles 网格容器 + 填满1920px画布的磁贴高度 */
  .tiles { display: grid; gap: 10px; }
  .tiles.c1 { grid-template-columns: 1fr; }
  .tiles.c2 { grid-template-columns: repeat(2, 1fr); }
  .tiles.c3 { grid-template-columns: repeat(3, 1fr); }
  .tiles.c4 { grid-template-columns: repeat(4, 1fr); }
  .tiles.c5 { grid-template-columns: repeat(5, 1fr); }
  /* 高度反算：1150px ÷ 5行 ≈ c3×240px，c4×200px */
  .tiles.c3 { grid-auto-rows: 240px; }
  .tiles.c4 { grid-auto-rows: 196px; }
  /* c4磁贴：图标上 + 文字下居中布局 */
  .tiles.c4 .tile {
    flex-direction: column; justify-content: center; align-items: center;
    gap: 12px; text-align: center; padding: 24px 10px;
  }
  .tiles.c4 .tile .t-icon {
    width: 52px; height: 52px; border-radius: 14px; flex: none;
  }
  .tiles.c4 .tile .t-text b { font-size: 20px; display: block; }
  .tiles.c4 .tile .t-text span {
    font-size: 13px; display: block; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;
  }
  /* c3磁贴：图标左 + 文字右，与 shared.css 默认一致 */
  .tiles.c3 .tile { gap: 18px; padding: 20px 20px; }
  .tiles.c3 .tile .t-icon { width: 56px; height: 56px; border-radius: 15px; flex: none; }
  .tiles.c3 .tile .t-text b { font-size: 24px; }
  .tiles.c3 .tile .t-text span { font-size: 16px; margin-top: 5px; }
  /* 分区标题优化 */
  .sec-bar { padding: 4px 0; border-bottom: 2px solid var(--line); margin-bottom: 14px; }
  .sec-bar h2 { font-size: 28px; letter-spacing: 1px; }
  /* qing-strip 优化 */
  .qing-strip { border-radius: var(--r-md); padding: 14px 22px; }
  .qs-spark { font-size: 32px; }
  .qs-body b { font-size: 20px; }
  /* 用户横幅统计 */
  .ubs b { font-size: 28px; }
  .ubs span { font-size: 14px; }
</style>
</head>
<body>
