<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>继续上次 · 职易达</title>
<link rel="stylesheet" href="shared.css">
<style>
  .resume-hero {
    flex:none; padding:24px 48px 20px;
    background:linear-gradient(135deg,#1f9e86,#157a67,#0d5c4e);
    position:relative; overflow:hidden;
  }
  .resume-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 700px 300px at 85% 120%,rgba(255,255,255,.06),transparent 60%);pointer-events:none;}
  .rh-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px;}
  .rh-av{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:24px;font-weight:700;flex:none;}
  .rh-text h1{font-family:var(--serif);font-size:38px;font-weight:900;color:#fff;letter-spacing:1px;}
  .rh-text p{font-size:18px;color:rgba(255,255,255,.7);margin-top:5px;}
  .content{gap:18px;}
  .session-card{background:var(--surface);border:1px solid rgba(31,158,134,.22);border-radius:var(--r-md);padding:22px 26px;box-shadow:0 4px 16px rgba(31,158,134,.07);position:relative;overflow:hidden;}
  .session-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),rgba(53,171,142,.4),transparent);}
  .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sc-badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--teal-deep);font-weight:600;background:var(--teal-soft);border:1px solid rgba(31,158,134,.25);padding:5px 12px;border-radius:999px;}
  .sc-badge svg{width:14px;height:14px;}
  .sc-time{font-size:14px;color:var(--muted);}
  .sc-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .sc-step{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;}
  .sc-step.done .ss-dot{background:var(--teal);}
  .sc-step.active .ss-dot{background:var(--clay);}
  .ss-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;}
  .ss-text{flex:1;}
  .ss-text b{display:block;font-size:20px;font-weight:600;color:var(--ink);}
  .ss-text span{display:block;font-size:14px;color:var(--muted);margin-top:2px;}
  .ss-status{font-size:14px;font-weight:600;white-space:nowrap;}
  .ss-status.done{color:var(--teal-deep);}
  .ss-status.active{color:var(--clay-deep);}
  .sc-actions{display:flex;gap:12px;}
  .suggest-bar{background:rgba(169,120,31,.06);border:1px solid rgba(169,120,31,.2);border-radius:var(--r-md);padding:16px 20px;display:flex;align-items:center;gap:14px;}
  .sb-ico{width:36px;height:36px;flex:none;border-radius:10px;background:rgba(169,120,31,.1);display:grid;place-items:center;color:var(--wheat-deep);}
  .sb-ico svg{width:18px;height:18px;}
  .sb-body{flex:1;}
  .sb-body b{display:block;font-size:18px;font-weight:700;color:var(--ink);}
  .sb-body span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;}
  .fresh-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .fr-item{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;}
  .fr-item:active{background:var(--teal-soft);border-color:rgba(31,158,134,.3);}
  .fr-ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;}
  .fr-ico svg{width:22px;height:22px;}
  .fr-text b{display:block;font-size:19px;font-weight:700;color:var(--ink);}
  .fr-text span{display:block;font-size:13px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="stage">
<header class="topbar">
  <div class="brand"><b>就业服务大厅 · 01号机</b><span>职易达AI求职操作系统</span></div>
  <div class="right"><span class="clock" id="clock">2026年8月3日 10:35</span><span class="status-chip"><span class="dot"></span>打印机在线</span></div>
</header>
<div class="resume-hero">
  <div class="rh-inner">
    <div class="rh-av">青</div>
    <div class="rh-text">
      <h1>继续上次的任务</h1>
      <p>AI为你恢复上次进度，继续从断点开始</p>
    </div>
  </div>
</div>
<div class="pagehead">
  <button class="back-btn" onclick="location='01-home.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>返回首页
  </button>
  <div class="titles"><h1>会话续接</h1><p>AI记住了你上次做到哪里</p></div>
</div>
<main class="content">
  <div class="session-card">
    <div class="sc-head">
      <span class="sc-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>本次会话记录</span>
      <span class="sc-time">今天 10:28</span>
    </div>
    <div class="sc-steps">
      <div class="sc-step done"><span class="ss-dot"></span><span class="ss-text"><b>上传简历</b><span>行政专员简历.pdf · 已诊断</span></span><span class="ss-status done">✓ 已完成</span></div>
      <div class="sc-step done"><span class="ss-dot"></span><span class="ss-text"><b>AI诊断报告</b><span>总分420 · 6维度分析完成</span></span><span class="ss-status done">✓ 已完成</span></div>
      <div class="sc-step active"><span class="ss-dot"></span><span class="ss-text"><b>简历优化建议</b><span>已生成优化版，待你确认并导出</span></span><span class="ss-status active">进行中</span></div>
    </div>
    <div class="sc-actions">
      <button class="btn primary" style="flex:1" onclick="location='07-resume-optimize.html'">继续修改</button>
      <button class="btn ghost" style="flex:1" onclick="location='03-print-settings.html'">去打印</button>
    </div>
  </div>
  <div class="suggest-bar">
    <div class="sb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l2.4 2.4L17 3l.6 2.8 2.8.6-1.4 2.6 1.4 2.6-2.8.6L17 15l-2.6-1.4L12 15l-2.4-1.4L7 15l-.6-2.8-2.8-.6 1.4-2.6L3.6 6.4l2.8-.6L7 3z"/></svg></div>
    <div class="sb-body">
      <b>小青建议</b>
      <span>你刚才优化了简历，建议打印前先确认目标岗位与联系方式。</span>
    </div>
    <button class="btn ghost sm" onclick="location='08-jobs-list.html'">查看岗位</button>
  </div>
  <section class="card">
    <div class="card-head">
      <span class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg></span>
      <div><h2>或者重新开始</h2><div class="sub">选择一个新任务</div></div>
    </div>
    <div class="fresh-grid">
      <button class="fr-item" onclick="location='05-resume-source.html'"><span class="fr-ico" style="background:var(--teal-soft);color:var(--teal-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12l2 2 4-4"/></svg></span><span class="fr-text"><b>新建简历诊断</b><span>上传新简历重新分析</span></span></button>
      <button class="fr-item" onclick="location='02-print-hub.html'"><span class="fr-ico" style="background:var(--slate-soft);color:var(--slate-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9V3h12v6M6 18h-2a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2M6 15h12v6H6z"/></svg></span><span class="fr-text"><b>直接打印文件</b><span>上传文件快速出纸</span></span></button>
      <button class="fr-item" onclick="location='08-jobs-list.html'"><span class="fr-ico" style="background:var(--clay-soft);color:var(--clay-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span><span class="fr-text"><b>浏览岗位信息</b><span>线上平台 + 线下机构</span></span></button>
      <button class="fr-item" onclick="location='13-assistant.html'"><span class="fr-ico" style="background:var(--teal-soft);color:var(--teal-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/></svg></span><span class="fr-text"><b>让小青安排</b><span>描述目标，AI规划方案</span></span></button>
    </div>
  </section>
  <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>本次会话记录仅当前终端可见，退出登录后自动清除。</div>
</main>
<nav class="navbar">
  <button class="nav-item" onclick="location='01-home.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg>首页</button>
  <button class="nav-item" onclick="location='13-assistant.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/></svg>AI顾问</button>
  <button class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>我的</button>
</nav>
</div>
<script src="shared.js"></script>
</body>
</html>
