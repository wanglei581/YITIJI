<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>个人资料 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .av-edit { display:flex; flex-direction:column; align-items:center; padding:22px 0 10px; }
    .av-big { width:80px; height:80px; border-radius:50%; background:linear-gradient(150deg,#8fd3c4,#4bb59e); display:flex; align-items:center; justify-content:center; font-size:38px; position:relative; }
    .av-cam { position:absolute; right:-2px; bottom:-2px; width:28px; height:28px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid var(--surface); }
    .av-hint { font-size:12px; color:var(--muted); margin-top:10px; }
    .ef-group { background:var(--surface); border-radius:var(--r-lg); margin:12px 16px 0; box-shadow:var(--sh-xs); overflow:hidden; }
    .ef-item { display:flex; align-items:center; padding:14px 16px; }
    .ef-item + .ef-item { border-top:1px solid var(--line-faint); }
    .ef-lbl { width:82px; font-size:14px; color:var(--ink-soft); flex-shrink:0; }
    .ef-val { flex:1; font-size:14px; color:var(--ink); }
    .ef-val.ph { color:var(--faint); }
    .ef-edit { color:var(--faint); font-size:14px; }
    .grp-label { font-size:12px; color:var(--faint); padding:16px 20px 4px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">个人资料</div>
    <div class="nav-right"><span style="font-size:15px;color:var(--teal-deep);font-weight:600">保存</span></div>
  </div>

  <div class="content has-bar">
    <div class="av-edit">
      <div class="av-big">🧑<div class="av-cam">📷</div></div>
      <div class="av-hint">点击更换头像</div>
    </div>

    <div class="grp-label">基本信息</div>
    <div class="ef-group" style="margin-top:0">
      <div class="ef-item"><div class="ef-lbl">昵称</div><div class="ef-val">陈明</div><span class="ef-edit">›</span></div>
      <div class="ef-item"><div class="ef-lbl">性别</div><div class="ef-val">男</div><span class="ef-edit">›</span></div>
      <div class="ef-item"><div class="ef-lbl">所在城市</div><div class="ef-val">杭州</div><span class="ef-edit">›</span></div>
    </div>

    <div class="grp-label">求职信息 <span class="faint">· 用于 AI 个性化推荐</span></div>
    <div class="ef-group" style="margin-top:0">
      <div class="ef-item"><div class="ef-lbl">求职意向</div><div class="ef-val">前端开发工程师</div><span class="ef-edit">›</span></div>
      <div class="ef-item"><div class="ef-lbl">工作年限</div><div class="ef-val">1-3 年</div><span class="ef-edit">›</span></div>
      <div class="ef-item"><div class="ef-lbl">学历</div><div class="ef-val">本科</div><span class="ef-edit">›</span></div>
      <div class="ef-item"><div class="ef-lbl">期望城市</div><div class="ef-val ph">未填写</div><span class="ef-edit">›</span></div>
    </div>

    <div class="notice info" style="margin:14px 16px 0">
      <span>ℹ</span>
      <div>求职信息仅用于优化本终端的 AI 建议与信息展示，不会提供给任何第三方或招聘方。</div>
    </div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn primary lg block">保存资料</button>
  </div>
</div>
</body>
</html>
