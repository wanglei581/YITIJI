<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>设置 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .set-group { background:var(--surface); border-radius:var(--r-lg); margin:14px 16px 0; box-shadow:var(--sh-xs); overflow:hidden; }
    .set-item { display:flex; align-items:center; gap:12px; padding:15px 16px; cursor:pointer; }
    .set-item + .set-item { border-top:1px solid var(--line-faint); }
    .set-ic { width:30px; text-align:center; font-size:17px; flex-shrink:0; }
    .set-t { flex:1; font-size:14.5px; color:var(--ink); }
    .set-v { font-size:13px; color:var(--faint); }
    .set-go { color:var(--faint); font-size:15px; }
    /* toggle */
    .tgl { width:44px; height:26px; border-radius:var(--r-full); background:var(--teal); position:relative; flex-shrink:0; }
    .tgl.off { background:var(--line); }
    .tgl::after { content:''; position:absolute; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--sh-xs); transition:.2s; right:3px; }
    .tgl.off::after { right:21px; }
    .logout { text-align:center; color:var(--clay); font-size:15px; font-weight:600; padding:16px; margin:20px 16px 0; background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--sh-xs); }
    .grp-label { font-size:12px; color:var(--faint); padding:16px 20px 4px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">设置</div>
    <div class="nav-right"></div>
  </div>

  <div class="content">
    <div class="grp-label">账号</div>
    <div class="set-group" style="margin-top:0">
      <div class="set-item">
        <div class="set-ic">👤</div>
        <div class="set-t">个人资料</div>
        <span class="set-go">›</span>
      </div>
      <div class="set-item">
        <div class="set-ic">📱</div>
        <div class="set-t">手机号</div>
        <span class="set-v">138****6621</span>
        <span class="set-go">›</span>
      </div>
      <div class="set-item">
        <div class="set-ic">🔒</div>
        <div class="set-t">账号与安全</div>
        <span class="set-go">›</span>
      </div>
    </div>

    <div class="grp-label">通知</div>
    <div class="set-group" style="margin-top:0">
      <div class="set-item">
        <div class="set-ic">🔔</div>
        <div class="set-t">打印进度提醒</div>
        <div class="tgl"></div>
      </div>
      <div class="set-item">
        <div class="set-ic">🎪</div>
        <div class="set-t">招聘会开始提醒</div>
        <div class="tgl"></div>
      </div>
      <div class="set-item">
        <div class="set-ic">📢</div>
        <div class="set-t">活动与优惠通知</div>
        <div class="tgl off"></div>
      </div>
    </div>

    <div class="grp-label">隐私与文件</div>
    <div class="set-group" style="margin-top:0">
      <div class="set-item">
        <div class="set-ic">🛡</div>
        <div class="set-t">隐私设置</div>
        <span class="set-go">›</span>
      </div>
      <div class="set-item">
        <div class="set-ic">🗑</div>
        <div class="set-t">敏感文件自动清理</div>
        <span class="set-v">7 天</span>
        <span class="set-go">›</span>
      </div>
      <div class="set-item">
        <div class="set-ic">📄</div>
        <div class="set-t">缓存清理</div>
        <span class="set-v">12.4 MB</span>
        <span class="set-go">›</span>
      </div>
    </div>

    <div class="grp-label">其他</div>
    <div class="set-group" style="margin-top:0">
      <div class="set-item">
        <div class="set-ic">❓</div>
        <div class="set-t">帮助与反馈</div>
        <span class="set-go">›</span>
      </div>
      <div class="set-item">
        <div class="set-ic">ℹ️</div>
        <div class="set-t">关于我们</div>
        <span class="set-v">v1.0.0</span>
        <span class="set-go">›</span>
      </div>
    </div>

    <div class="logout">退出登录</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
