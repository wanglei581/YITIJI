<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>AI 生成简历 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .gen-head { padding:16px 20px 18px; background:linear-gradient(155deg,#614870,#7a5a86); }
    .gh-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); padding:4px 10px; border-radius:var(--r-full); margin-bottom:10px; }
    .gh-t { font-family:var(--font-serif); font-size:20px; font-weight:700; color:#fff; }
    .gh-s { font-size:12.5px; color:rgba(255,255,255,.75); margin-top:6px; }
    .form-sec { padding:6px 16px; }
    .field-lbl { font-size:13px; font-weight:600; color:var(--ink); margin:16px 0 8px; display:flex; align-items:center; gap:6px; }
    .field-lbl .req { color:var(--clay); }
    .opt-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .opt-pill { padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--r-md); font-size:13px; color:var(--ink-soft); text-align:center; cursor:pointer; background:var(--surface); }
    .opt-pill.on { border-color:var(--plum); background:var(--plum-wash); color:var(--plum-deep); font-weight:600; }
    .tone-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
    .tone-scroll::-webkit-scrollbar { display:none; }
    .tone-chip { flex-shrink:0; padding:9px 15px; border:1.5px solid var(--line); border-radius:var(--r-full); font-size:13px; color:var(--ink-soft); cursor:pointer; background:var(--surface); }
    .tone-chip.on { border-color:var(--plum); background:var(--plum); color:#fff; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar light" style="background:#614870"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar light" style="background:#614870;border-bottom:none">
    <div class="nav-back" style="color:#fff">‹</div>
    <div class="nav-title" style="color:#fff">AI 生成简历</div>
    <div class="nav-right"></div>
  </div>

  <div class="content has-bar">
    <div class="gen-head">
      <div class="gh-badge">✦ AI 辅助创作</div>
      <div class="gh-t">告诉 AI 你的求职意向</div>
      <div class="gh-s">填写基础信息，AI 帮你起草一份结构完整的简历初稿</div>
    </div>

    <div class="form-sec">
      <div class="field-lbl">目标岗位 <span class="req">*</span></div>
      <div class="field"><input class="inp" value="前端开发工程师" /></div>

      <div class="field-lbl">工作年限 <span class="req">*</span></div>
      <div class="opt-grid">
        <div class="opt-pill">应届生</div>
        <div class="opt-pill on">1-3 年</div>
        <div class="opt-pill">3-5 年</div>
        <div class="opt-pill">5 年以上</div>
      </div>

      <div class="field-lbl">你的核心技能 <span class="muted fw-400" style="font-size:11px">· 用逗号分隔</span></div>
      <div class="field"><textarea class="inp ta" rows="3">React, TypeScript, 组件化开发, 性能优化, Node.js</textarea></div>

      <div class="field-lbl">简历语气风格</div>
      <div class="tone-scroll">
        <div class="tone-chip on">专业稳重</div>
        <div class="tone-chip">简洁干练</div>
        <div class="tone-chip">进取有冲劲</div>
        <div class="tone-chip">亲和沟通</div>
      </div>

      <div class="notice plum" style="margin-top:18px">
        <span>✦</span>
        <div>AI 仅根据你提供的信息起草，<b>不会编造经历</b>。生成后请务必核对并补充真实内容。</div>
      </div>
    </div>

    <div class="compliance-note">AI 生成内容仅供参考。请确保填写信息真实，切勿使用虚构的工作或教育经历。</div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn plum lg block">✦ 开始生成简历</button>
  </div>
</div>
</body>
</html>
