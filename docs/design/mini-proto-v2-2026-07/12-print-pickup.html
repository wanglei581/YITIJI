<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>取件码 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .pickup-hero { background:linear-gradient(160deg,#157a67 0%,#1f9e86 100%); padding:24px 20px 60px; text-align:center; position:relative; overflow:hidden; }
    .pickup-hero::after { content:''; position:absolute; left:50%; bottom:-40px; transform:translateX(-50%); width:200px; height:80px; border-radius:50%; background:rgba(255,255,255,.06); }
    .ph-check { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 12px; }
    .ph-title { font-family:var(--font-serif); font-size:20px; font-weight:700; color:#fff; }
    .ph-sub { font-size:13px; color:rgba(255,255,255,.72); margin-top:6px; }
    .pickup-float { margin:-42px 16px 0; position:relative; z-index:2; background:var(--surface); border-radius:var(--r-md); box-shadow:var(--sh-md); padding:22px 16px 18px; text-align:center; }
    .pf-label { font-size:12px; color:var(--muted); letter-spacing:.5px; }
    .pf-code { font-family:var(--font-serif); font-size:44px; font-weight:700; color:var(--ink); letter-spacing:10px; margin:6px 0 4px; padding-left:10px; }
    .pf-hint { font-size:12px; color:var(--faint); }
    .pf-qr { margin:16px auto 6px; }
    .status-strip { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--wheat-wash); border-radius:var(--r); margin:0 16px 12px; }
    .status-strip .ss-dot { width:10px; height:10px; border-radius:50%; background:var(--wheat); flex-shrink:0; box-shadow:0 0 0 3px var(--wheat-soft); }
    .status-strip .ss-body { flex:1; }
    .status-strip .ss-t { font-size:13.5px; font-weight:600; color:var(--wheat-deep); }
    .status-strip .ss-s { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .info-row { display:flex; justify-content:space-between; padding:11px 16px; font-size:13px; }
    .info-row + .info-row { border-top:1px solid var(--line-faint); }
    .info-row .l { color:var(--muted); }
    .info-row .v { color:var(--ink-soft); font-weight:500; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar light" style="background:#157a67"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>

  <div class="pickup-hero">
    <div class="ph-check">✓</div>
    <div class="ph-title">支付成功</div>
    <div class="ph-sub">请到门店一体机凭取件码打印</div>
  </div>

  <div class="content">
    <!-- 取件码浮卡 -->
    <div class="pickup-float">
      <div class="pf-label">取件码</div>
      <div class="pf-code">8 2 4 6</div>
      <div class="pf-hint">有效期至今天 23:59 · 逾期自动退款</div>
      <div class="qr-box pf-qr"><div class="qr-inner"></div></div>
      <div class="fs11 faint">一体机上「扫码取件」对准此码</div>
    </div>

    <!-- 诚实状态：尚未打印 -->
    <div style="height:14px"></div>
    <div class="status-strip">
      <div class="ss-dot"></div>
      <div class="ss-body">
        <div class="ss-t">待到店取件 · 尚未打印</div>
        <div class="ss-s">文件已就绪但尚未打印。到店核验取件码后由一体机出纸，打印进度以终端实时上报为准。</div>
      </div>
    </div>

    <!-- 订单信息 -->
    <div class="section-t">订单信息</div>
    <div class="card">
      <div class="info-row"><span class="l">门店</span><span class="v">就业服务大厅 01 号</span></div>
      <div class="info-row"><span class="l">文件</span><span class="v">简历.pdf 等 2 项</span></div>
      <div class="info-row"><span class="l">规格</span><span class="v">黑白/彩色 · A4 · 共 12 页</span></div>
      <div class="info-row"><span class="l">实付</span><span class="v clay">¥9.00</span></div>
      <div class="info-row"><span class="l">订单号</span><span class="v faint">PT20260724·8246</span></div>
    </div>

    <div class="notice info">
      <span class="n-ic">🔒</span>
      <span>为保护你的隐私，打印文件仅本人凭码可取，取件后文件按策略自动清理。</span>
    </div>
    <div class="spacer"></div>
    <div class="px16">
      <button class="btn ghost-ink block" style="margin-bottom:10px">导航到门店</button>
      <button class="btn primary block">查看打印进度</button>
    </div>
    <div class="compliance-note">如超时未取件，系统将自动取消并原路退款。</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
