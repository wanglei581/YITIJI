<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>文档预览 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .preview-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 20px 24px;
      background: var(--paper-deep);
    }
    .a4-paper {
      width: 310px;
      height: 438px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(16,48,43,.15), 0 1px 4px rgba(16,48,43,.08);
      padding: 28px 24px 24px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .a4-paper .p-name {
      font-family: var(--font-serif);
      font-size: 18px; font-weight: 700;
      color: #10302b;
      text-align: center; margin-bottom: 4px;
    }
    .a4-paper .p-tagline {
      font-size: 11px; color: #5d6b63;
      text-align: center; margin-bottom: 18px;
    }
    .a4-paper .p-divider {
      height: 1.5px; background: #10302b;
      margin-bottom: 14px;
    }
    .a4-paper .p-section { margin-bottom: 14px; }
    .a4-paper .p-section-title {
      font-size: 11px; font-weight: 700;
      color: #10302b; letter-spacing: .8px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .p-line {
      height: 7px; background: #e8e5dc;
      border-radius: 2px; margin-bottom: 5px;
    }
    .p-line.short { width: 60%; }
    .p-line.med   { width: 80%; }
    .p-line.full  { width: 100%; }
    .p-line.thin  { height: 5px; background: #ede9da; }

    .page-indicator {
      display: flex; align-items: center; gap: 8px;
      margin-top: 12px;
    }
    .page-indicator .pi-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--line);
    }
    .page-indicator .pi-dot.on { background: var(--teal); }
    .page-indicator .pi-text { font-size: 12px; color: var(--muted); }

    .preview-params {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line-faint);
    }
    .preview-params .pp-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--muted);
    }
    .preview-params .pp-sep { width: 1px; height: 12px; background: var(--line); }
  </style>
</head>
<body>
<div id="stage">

  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-icons">📶 5G 🔋</div>
  </div>

  <div class="navbar">
    <div class="nav-back">←</div>
    <span class="nav-title">预览</span>
    <div class="nav-right">
      <span style="font-size:20px; color:var(--ink);">⋯</span>
    </div>
  </div>

  <!-- 打印参数摘要条 -->
  <div class="preview-params">
    <div class="pp-item">📄 黑白</div>
    <div class="pp-sep"></div>
    <div class="pp-item">A4</div>
    <div class="pp-sep"></div>
    <div class="pp-item">双面</div>
    <div class="pp-sep"></div>
    <div class="pp-item">× 1 份</div>
    <div class="pp-sep"></div>
    <span class="chip ok" style="font-size:11px;">¥ 0.30</span>
  </div>

  <div class="content has-bar">

    <!-- A4 纸张预览 -->
    <div class="preview-wrap">
      <div class="a4-paper">
        <div class="p-name">王磊</div>
        <div class="p-tagline">应届毕业生 · 计算机科学与技术 · 2026届</div>
        <div class="p-divider"></div>

        <div class="p-section">
          <div class="p-section-title">基本信息</div>
          <div class="p-line med"></div>
          <div class="p-line short"></div>
        </div>

        <div class="p-section">
          <div class="p-section-title">教育背景</div>
          <div class="p-line full"></div>
          <div class="p-line thin full"></div>
          <div class="p-line thin med"></div>
        </div>

        <div class="p-section">
          <div class="p-section-title">实习经历</div>
          <div class="p-line full"></div>
          <div class="p-line thin full"></div>
          <div class="p-line thin full"></div>
          <div class="p-line thin med"></div>
        </div>

        <div class="p-section">
          <div class="p-section-title">项目经验</div>
          <div class="p-line full"></div>
          <div class="p-line thin full"></div>
          <div class="p-line thin full"></div>
        </div>

        <div class="p-section">
          <div class="p-section-title">技能证书</div>
          <div class="p-line med"></div>
          <div class="p-line thin short"></div>
        </div>
      </div>

      <!-- 翻页指示 -->
      <div class="page-indicator">
        <div class="pi-dot on"></div>
        <div class="pi-dot"></div>
        <span class="pi-text">第 1 / 2 页</span>
      </div>
    </div>

    <div style="padding: 12px 16px;">
      <div class="notice" style="margin:0;">
        <div class="n-ic">📐</div>
        <div>预览为近似效果，实际打印以文件原始格式为准。左侧显示有边距警告，建议先查阅 AI 版式诊断。</div>
      </div>
    </div>

    <div class="spacer-lg"></div>

  </div>

  <!-- 操作条 -->
  <div class="actionbar">
    <div style="font-size:13px; color:var(--muted);">第 1 / 2 页</div>
    <div style="flex:1;"></div>
    <button class="btn ghost" style="min-width:100px;">← 上一页</button>
    <button class="btn primary" style="min-width:120px;">确认打印 →</button>
  </div>

</div>
</body>
</html>
