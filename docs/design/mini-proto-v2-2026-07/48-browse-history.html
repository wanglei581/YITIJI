<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>浏览与跳转记录 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .hs-day { font-size:12px; color:var(--faint); font-weight:600; padding:15px 16px 8px; }
    .hs-item { display:flex; gap:12px; padding:13px 16px; cursor:pointer; }
    .hs-item + .hs-item { border-top:1px solid var(--line-faint); }
    .hs-ic { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .hs-t { font-size:14px; font-weight:500; color:var(--ink); line-height:1.4; }
    .hs-sub { font-size:11.5px; color:var(--muted); margin-top:4px; }
    .hs-time { font-size:11px; color:var(--faint); flex-shrink:0; align-self:flex-start; }
    .act-tag { display:inline-flex; align-items:center; gap:3px; font-size:10.5px; padding:1px 7px; border-radius:var(--r-full); margin-right:6px; }
    .at-view { background:var(--wash); color:var(--teal-deep); }
    .at-jump { background:var(--wheat-wash); color:var(--wheat-deep); }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">浏览与跳转记录</div>
    <div class="nav-right"><span style="font-size:15px;color:var(--muted)">清空</span></div>
  </div>

  <div class="content">
    <div class="filter-bar" style="padding-top:14px">
      <div class="f-chip on">全部</div>
      <div class="f-chip">岗位</div>
      <div class="f-chip">招聘会</div>
      <div class="f-chip">企业</div>
      <div class="f-chip">政策</div>
    </div>

    <div class="card" style="margin-top:8px">
      <div class="hs-day">今天</div>
      <div class="hs-item">
        <div class="hs-ic wash" style="color:var(--teal-deep)">💼</div>
        <div style="flex:1">
          <div class="hs-t">前端开发工程师 · 星野科技</div>
          <div class="hs-sub"><span class="act-tag at-jump">↗ 已打开来源平台</span>来源：智联招聘</div>
        </div>
        <div class="hs-time">09:28</div>
      </div>
      <div class="hs-item">
        <div class="hs-ic wheat-wash" style="color:var(--wheat-deep)">🎪</div>
        <div style="flex:1">
          <div class="hs-t">2026 春季大型双选会</div>
          <div class="hs-sub"><span class="act-tag at-view">👁 浏览</span>来源：市人才市场</div>
        </div>
        <div class="hs-time">09:05</div>
      </div>
    </div>

    <div class="card">
      <div class="hs-day">昨天</div>
      <div class="hs-item">
        <div class="hs-ic clay-wash" style="color:var(--clay-deep)">🏢</div>
        <div style="flex:1">
          <div class="hs-t">云图数据 · 企业主页</div>
          <div class="hs-sub"><span class="act-tag at-view">👁 浏览</span>来源企业信息</div>
        </div>
        <div class="hs-time">昨天 21:12</div>
      </div>
      <div class="hs-item">
        <div class="hs-ic wash" style="color:var(--slate)">📜</div>
        <div style="flex:1">
          <div class="hs-t">高校毕业生求职创业补贴指南</div>
          <div class="hs-sub"><span class="act-tag at-view">👁 浏览</span>来源：市人社局</div>
        </div>
        <div class="hs-time">昨天 18:40</div>
      </div>
    </div>

    <div class="compliance-note">仅记录你的浏览与打开来源平台 / 官方入口的行为，不记录任何投递或预约结果。相关操作均在来源平台完成。</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
