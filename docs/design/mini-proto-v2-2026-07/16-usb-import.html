<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>U盘打印 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .usb-hero { text-align:center; padding:28px 24px 8px; }
    .usb-ic { width:80px; height:80px; border-radius:20px; background:var(--slate-wash); display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 14px; }
    .usb-title { font-family:var(--font-serif); font-size:19px; font-weight:700; color:var(--ink); }
    .usb-sub { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.65; }
    .guide-step { display:flex; gap:14px; padding:14px 16px; }
    .guide-step + .guide-step { border-top:1px solid var(--line-faint); }
    .guide-step .gs-n { width:28px; height:28px; border-radius:50%; background:var(--slate); color:#fff; font-family:var(--font-serif); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .guide-step .gs-body { flex:1; }
    .guide-step .gs-t { font-size:14.5px; font-weight:600; color:var(--ink); }
    .guide-step .gs-d { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.55; }
    .fmt-chips { display:flex; flex-wrap:wrap; gap:6px; padding:4px 16px 14px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">U盘打印指引</div>
    <div style="width:32px"></div>
  </div>

  <div class="content">
    <div class="usb-hero">
      <div class="usb-ic">🔌</div>
      <div class="usb-title">U盘打印在一体机上操作</div>
      <div class="usb-sub">手机无法直接读取 U盘，请携带 U盘到附近终端，<br>按以下步骤在一体机上完成打印。</div>
    </div>

    <!-- 步骤 -->
    <div class="section-t">操作步骤</div>
    <div class="card">
      <div class="guide-step">
        <div class="gs-n">1</div>
        <div class="gs-body">
          <div class="gs-t">插入 U盘</div>
          <div class="gs-d">在一体机屏幕右下方 USB 接口插入你的 U盘，终端会自动识别。</div>
        </div>
      </div>
      <div class="guide-step">
        <div class="gs-n">2</div>
        <div class="gs-body">
          <div class="gs-t">选择「U盘导入」</div>
          <div class="gs-d">在一体机首页点「打印扫描 → U盘导入」，浏览并勾选要打印的文件。</div>
        </div>
      </div>
      <div class="guide-step">
        <div class="gs-n">3</div>
        <div class="gs-body">
          <div class="gs-t">设置参数并打印</div>
          <div class="gs-d">选择黑白/彩色、份数、单双面后确认，一体机直接出纸。</div>
        </div>
      </div>
    </div>

    <!-- 支持格式 -->
    <div class="section-t">支持的文件格式</div>
    <div class="card flat">
      <div class="fmt-chips">
        <span class="chip">PDF</span>
        <span class="chip">Word</span>
        <span class="chip">JPG / PNG</span>
        <span class="chip">TIFF</span>
        <span class="chip">OFD</span>
        <span class="chip">PDF/A</span>
      </div>
    </div>

    <div class="notice info">
      <span class="n-ic">📍</span>
      <span>不方便到店？可改用「上传文件打印」或「扫码续传」，同样能完成打印。</span>
    </div>
    <div class="spacer"></div>
    <div class="px16"><button class="btn primary block">查看附近终端</button></div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
