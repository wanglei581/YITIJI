<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>拍照扫描 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .cam-frame { margin:0 16px; height:300px; border-radius:var(--r-md); background:linear-gradient(160deg,#2b3a4a,#1a2a35); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .cam-doc { width:180px; height:230px; background:#fdfcf7; border-radius:4px; box-shadow:0 8px 30px rgba(0,0,0,.4); transform:perspective(600px) rotateX(4deg); position:relative; }
    .cam-doc::before { content:''; position:absolute; top:20px; left:20px; right:20px; height:8px; background:var(--line); border-radius:2px; box-shadow:0 20px 0 var(--line-soft),0 40px 0 var(--line-soft),0 60px 0 var(--line-soft),0 80px 0 var(--line-soft),0 100px 0 var(--line-soft); }
    .cam-corners { position:absolute; inset:36px; pointer-events:none; }
    .cam-corners i { position:absolute; width:26px; height:26px; border:3px solid var(--teal-mid); }
    .cam-corners i.tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
    .cam-corners i.tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
    .cam-corners i.bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
    .cam-corners i.br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
    .cam-scan-line { position:absolute; left:36px; right:36px; height:2px; background:linear-gradient(90deg,transparent,var(--teal-mid),transparent); top:50%; box-shadow:0 0 12px var(--teal-mid); }
    .cam-hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,255,255,.7); }
    .shot-row { display:flex; align-items:center; justify-content:center; gap:36px; padding:20px 0 10px; }
    .shot-side { width:48px; height:48px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--ink-soft); }
    .shot-btn { width:70px; height:70px; border-radius:50%; background:var(--teal); border:4px solid var(--teal-soft); display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-md); }
    .shot-btn .inner { width:52px; height:52px; border-radius:50%; background:#fff; }
    .page-thumbs { display:flex; gap:8px; padding:4px 16px 8px; overflow-x:auto; }
    .page-thumbs::-webkit-scrollbar { display:none; }
    .pt { width:52px; height:66px; border-radius:6px; background:var(--surface); border:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); position:relative; }
    .pt .num { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--teal); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }
    .pt.add { border-style:dashed; color:var(--teal); font-size:22px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">拍照扫描成 PDF</div>
    <div class="nav-right"><span class="fs13 teal">完成</span></div>
  </div>

  <div class="content has-bar">
    <!-- 取景框 -->
    <div class="spacer-sm"></div>
    <div class="cam-frame">
      <div class="cam-doc"></div>
      <div class="cam-corners"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
      <div class="cam-scan-line"></div>
      <div class="cam-hint">已自动识别文档边缘，对齐后拍摄</div>
    </div>

    <!-- 已拍页面 -->
    <div class="section-t">已拍摄（2 页）</div>
    <div class="page-thumbs">
      <div class="pt">第 1 页<span class="num">1</span></div>
      <div class="pt">第 2 页<span class="num">2</span></div>
      <div class="pt add">＋</div>
    </div>

    <!-- 快门 -->
    <div class="shot-row">
      <div class="shot-side">🖼️</div>
      <div class="shot-btn"><div class="inner"></div></div>
      <div class="shot-side">🔄</div>
    </div>
    <div class="center fs12 muted">相册导入　·　拍摄　·　切换裁边/滤镜</div>

    <div class="notice">
      <span class="n-ic">💡</span>
      <span>拍摄的多页会自动合并为一个 PDF，可用于 AI 简历诊断或直接下单打印。</span>
    </div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn ghost-ink" style="flex:1">存为 PDF</button>
    <button class="btn primary" style="flex:1.4">去打印</button>
  </div>
</div>
</body>
</html>
