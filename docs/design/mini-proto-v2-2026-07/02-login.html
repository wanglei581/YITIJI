<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>绑定手机号 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .otp-row {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .otp-box {
      flex: 1; height: 52px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: var(--ink);
      font-family: var(--font-serif);
      transition: border-color .15s;
    }
    .otp-box.filled { border-color: var(--teal); background: var(--teal-wash); }
    .otp-box.active { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
    .send-btn {
      height: 40px; padding: 0 14px;
      border-radius: var(--r-full);
      background: var(--teal); color: #fff;
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .send-btn.counting {
      background: var(--surface-2); color: var(--faint);
    }
    .phone-inp-wrap {
      height: 52px;
      background: var(--surface);
      border: 1.5px solid var(--teal);
      border-radius: var(--r);
      padding: 0 10px 0 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .phone-inp-wrap .prefix {
      font-size: 15px; color: var(--ink); font-weight: 500;
      border-right: 1px solid var(--line); padding-right: 10px;
      flex-shrink: 0;
    }
    .phone-inp-wrap input {
      flex: 1; border: none; background: transparent;
      font-size: 15px; color: var(--ink); font-family: var(--font-sans);
      outline: none;
    }
    .agree-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 0 20px; margin-top: 12px;
    }
    .agree-check {
      width: 18px; height: 18px; border-radius: 5px;
      border: 1.5px solid var(--teal);
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
      color: #fff; font-size: 11px;
    }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-icons">📶 5G 🔋</div>
  </div>

  <div class="navbar">
    <div class="nav-back">←</div>
    <div class="nav-title">绑定手机号</div>
    <div style="width:32px;"></div>
  </div>

  <div class="content" style="padding-bottom:100px;">
    <div class="pagehead" style="padding:20px 20px 8px;">
      <div class="ph-title">验证手机号</div>
      <div class="ph-sub">打印记录和 AI 服务将关联到你的手机号，<br>请使用本人手机号绑定。</div>
    </div>

    <div style="padding:8px 20px 0;">
      <div class="field" style="margin-bottom:16px;">
        <div class="fl">手机号码</div>
        <div class="phone-inp-wrap">
          <span class="prefix">+86</span>
          <input type="tel" placeholder="请输入手机号" maxlength="11" value="138 0013 8000" />
          <button class="send-btn counting" id="sendBtn" onclick="startCount(this)">58s</button>
        </div>
      </div>

      <div class="field">
        <div class="fl">短信验证码</div>
        <div class="otp-row">
          <div class="otp-box filled">3</div>
          <div class="otp-box filled">8</div>
          <div class="otp-box filled">7</div>
          <div class="otp-box active"></div>
          <div class="otp-box"></div>
          <div class="otp-box"></div>
        </div>
        <div style="font-size:11px;color:var(--faint);margin-top:6px;">验证码已发送至 138****8000，有效期 5 分钟</div>
      </div>
    </div>

    <div style="padding: 28px 20px 0;">
      <button class="btn primary block" style="height:56px;font-size:16px;border-radius:16px;">
        确认绑定
      </button>
    </div>

    <div class="agree-row">
      <div class="agree-check">✓</div>
      <p style="font-size:11.5px;color:var(--muted);line-height:1.65;">
        我已阅读并同意
        <span style="color:var(--teal);cursor:pointer;">《服务协议》</span>
        和
        <span style="color:var(--teal);cursor:pointer;">《隐私政策》</span>，
        授权平台使用手机号提供打印及 AI 求职服务
      </p>
    </div>
  </div>
</div>

<script>
function startCount(btn) {
  let t = 60;
  btn.className = 'send-btn counting';
  const iv = setInterval(() => {
    t--;
    btn.textContent = t + 's';
    if (t <= 0) {
      clearInterval(iv);
      btn.textContent = '重新发送';
      btn.className = 'send-btn';
    }
  }, 1000);
}
</script>
</body>
</html>
