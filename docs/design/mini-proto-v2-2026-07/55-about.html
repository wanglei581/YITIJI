<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>关于我们 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .ab-logo { display:flex; flex-direction:column; align-items:center; padding:34px 0 18px; }
    .ab-mark { width:78px; height:78px; border-radius:22px; background:linear-gradient(150deg,#1f9e86,#157a67); display:flex; align-items:center; justify-content:center; font-size:38px; box-shadow:0 8px 22px rgba(31,158,134,.32); }
    .ab-name { font-family:var(--font-serif); font-size:19px; font-weight:700; color:var(--ink); margin-top:16px; }
    .ab-ver { font-size:12px; color:var(--faint); margin-top:5px; }
    .ab-slogan { font-size:13px; color:var(--muted); margin-top:12px; text-align:center; max-width:250px; line-height:1.6; }
    .ab-group { background:var(--surface); border-radius:var(--r-lg); margin:14px 16px 0; box-shadow:var(--sh-xs); overflow:hidden; }
    .ab-item { display:flex; align-items:center; padding:15px 16px; cursor:pointer; }
    .ab-item + .ab-item { border-top:1px solid var(--line-faint); }
    .ab-t { flex:1; font-size:14.5px; color:var(--ink); }
    .ab-go { color:var(--faint); font-size:15px; }
    .ab-foot { text-align:center; font-size:11px; color:var(--faint); padding:26px 20px; line-height:1.7; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">关于我们</div>
    <div class="nav-right"></div>
  </div>

  <div class="content">
    <div class="ab-logo">
      <div class="ab-mark">🖨</div>
      <div class="ab-name">AI 求职打印服务</div>
      <div class="ab-ver">版本 1.0.0</div>
      <div class="ab-slogan">用 AI 让求职材料更专业，让打印更简单</div>
    </div>

    <div class="ab-group" style="margin-top:6px">
      <div class="ab-item"><div class="ab-t">功能介绍</div><span class="ab-go">›</span></div>
      <div class="ab-item"><div class="ab-t">用户服务协议</div><span class="ab-go">›</span></div>
      <div class="ab-item"><div class="ab-t">隐私政策</div><span class="ab-go">›</span></div>
      <div class="ab-item"><div class="ab-t">AIGC 内容使用说明</div><span class="ab-go">›</span></div>
    </div>

    <div class="ab-group" style="margin-top:12px">
      <div class="ab-item"><div class="ab-t">合作机构入驻</div><span class="ab-go">›</span></div>
      <div class="ab-item"><div class="ab-t">联系客服</div><span class="ab-go">›</span></div>
      <div class="ab-item"><div class="ab-t">检查更新</div><span style="font-size:12px;color:var(--teal-deep)">已是最新</span></div>
    </div>

    <div class="notice info" style="margin:16px 16px 0">
      <span>ℹ</span>
      <div>本平台为求职材料服务与第三方信息入口，不提供平台内投递或招聘服务。岗位、招聘会信息均来自第三方或官方公开来源。</div>
    </div>

    <div class="ab-foot">
      AI 求职打印服务终端<br>
      本产品为求职材料与打印服务工具<br>
      © 2026 保留所有权利
    </div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
