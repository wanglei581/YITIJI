<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>AI解析中 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .parse-center {
      display: flex; flex-direction: column;
      align-items: center; padding: 48px 24px 32px;
    }
    .progress-ring-wrap {
      width: 120px; height: 120px; position: relative;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .progress-ring-wrap svg {
      position: absolute; inset: 0;
      transform: rotate(-90deg);
    }
    .progress-ring-wrap svg circle.bg {
      fill: none; stroke: var(--line-soft); stroke-width: 8;
    }
    .progress-ring-wrap svg circle.fg {
      fill: none; stroke: var(--plum); stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 339.29;
      stroke-dashoffset: 135.72; /* ~60% */
      transition: stroke-dashoffset 1s;
    }
    .progress-ring-wrap .pr-inner {
      display: flex; flex-direction: column; align-items: center;
    }
    .progress-ring-wrap .pr-pct {
      font-family: var(--font-serif); font-size: 28px; font-weight: 700; color: var(--plum);
    }
    .progress-ring-wrap .pr-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
    .parse-text { font-size: 14px; color: var(--ink-soft); text-align: center; }

    .parse-stages { display: flex; flex-direction: column; gap: 0; }
    .ps-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .ps-row + .ps-row { border-top: 1px solid var(--line-faint); }
    .ps-row .ps-ic {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .ps-row.done .ps-ic { background: var(--ok-soft); }
    .ps-row.active .ps-ic { background: var(--plum-soft); }
    .ps-row.wait .ps-ic { background: var(--surface-2); }
    .ps-row .ps-label { font-size: 14px; font-weight: 500; }
    .ps-row.done .ps-label { color: var(--ok); }
    .ps-row.active .ps-label { color: var(--plum); }
    .ps-row.wait .ps-label { color: var(--faint); }
    .ps-row .ps-state { margin-left: auto; font-size: 11.5px; }
    .ps-row.done .ps-state { color: var(--ok); }
    .ps-row.active .ps-state { color: var(--plum); }
    .ps-row.wait .ps-state { color: var(--ghost); }

    .field-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 12px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">AI 解析中</div>
    <div style="width:32px"></div>
  </div>

  <!-- 步骤指示 -->
  <div class="steps">
    <div class="st done"><div class="n">✓</div><div class="nl">上传</div></div>
    <div class="line done"></div>
    <div class="st on"><div class="n">2</div><div class="nl">解析</div></div>
    <div class="line"></div>
    <div class="st"><div class="n">3</div><div class="nl">诊断</div></div>
  </div>

  <div class="content has-bar">
    <!-- 进度环 -->
    <div class="parse-center">
      <div class="progress-ring-wrap">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle class="bg" cx="60" cy="60" r="54"/>
          <circle class="fg" cx="60" cy="60" r="54"/>
        </svg>
        <div class="pr-inner">
          <div class="pr-pct">60%</div>
          <div class="pr-label">解析进度</div>
        </div>
      </div>
      <div class="ai-status">
        <div class="dots"><span></span><span></span><span></span></div>
        正在分析简历内容…
      </div>
      <div class="parse-text" style="margin-top:10px">内容理解进行中，即将完成</div>
    </div>

    <!-- 解析阶段 -->
    <div class="section-t">解析阶段</div>
    <div class="card">
      <div class="parse-stages">
        <div class="ps-row done">
          <div class="ps-ic">✓</div>
          <div class="ps-label">文字识别</div>
          <div class="ps-state">已完成</div>
        </div>
        <div class="ps-row done">
          <div class="ps-ic">✓</div>
          <div class="ps-label">结构解析</div>
          <div class="ps-state">已完成</div>
        </div>
        <div class="ps-row active">
          <div class="ps-ic">⟳</div>
          <div class="ps-label">内容理解</div>
          <div class="ps-state">进行中</div>
        </div>
        <div class="ps-row wait">
          <div class="ps-ic">○</div>
          <div class="ps-label">维度评估</div>
          <div class="ps-state">待完成</div>
        </div>
      </div>
    </div>

    <!-- 已解析内容预览 -->
    <div class="section-t">已识别字段</div>
    <div class="card">
      <div class="card-inner sm">
        <div class="field-list">
          <span class="chip ok">姓名</span>
          <span class="chip ok">联系方式</span>
          <span class="chip ok">教育背景 ×2</span>
          <span class="chip warn">实习经历 ×1</span>
          <span class="chip ok">项目经历 ×2</span>
          <span class="chip warn">技能特长</span>
          <span class="chip">自我评价</span>
        </div>
      </div>
    </div>

    <div class="notice plum">
      <span class="n-ic">⏱</span>
      <span>解析通常需要 10–20 秒，请稍候。</span>
    </div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn ghost block" disabled>等待解析完成…</button>
  </div>
</div>
</body>
</html>
