<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>AI 服务记录 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .rec-day { font-size:12px; color:var(--faint); font-weight:600; padding:16px 16px 8px; }
    .rec-item { display:flex; gap:12px; padding:13px 16px; cursor:pointer; }
    .rec-item + .rec-item { border-top:1px solid var(--line-faint); }
    .rec-ic { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
    .rec-t { font-size:14px; font-weight:600; color:var(--ink); }
    .rec-sub { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5; }
    .rec-time { font-size:11px; color:var(--faint); margin-top:5px; }
    .rec-r { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
    .rec-score { font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--plum-deep); }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">AI 服务记录</div>
    <div class="nav-right"></div>
  </div>

  <div class="content">
    <div class="filter-bar" style="padding-top:14px">
      <div class="f-chip on">全部</div>
      <div class="f-chip">简历诊断</div>
      <div class="f-chip">简历优化</div>
      <div class="f-chip">模拟面试</div>
      <div class="f-chip">职业规划</div>
    </div>

    <div class="card" style="margin-top:8px">
      <div class="rec-day">今天</div>
      <div class="rec-item">
        <div class="rec-ic plum-wash" style="color:var(--plum-deep)">📊</div>
        <div style="flex:1">
          <div class="rec-t">简历诊断</div>
          <div class="rec-sub">前端开发-陈明.pdf · 4 个维度评估</div>
          <div class="rec-time">09:32</div>
        </div>
        <div class="rec-r"><div class="rec-score">75</div><span class="chip plum">查看</span></div>
      </div>
      <div class="rec-item">
        <div class="rec-ic wash" style="color:var(--teal-deep)">🎤</div>
        <div style="flex:1">
          <div class="rec-t">模拟面试 · 综合面试</div>
          <div class="rec-sub">前端开发工程师 · 5 题 · 用时 8 分钟</div>
          <div class="rec-time">09:10</div>
        </div>
        <div class="rec-r"><div class="rec-score">78</div><span class="chip plum">查看</span></div>
      </div>
    </div>

    <div class="card">
      <div class="rec-day">昨天</div>
      <div class="rec-item">
        <div class="rec-ic wheat-wash" style="color:var(--wheat-deep)">🧭</div>
        <div style="flex:1">
          <div class="rec-t">职业规划建议</div>
          <div class="rec-sub">前端 → 全栈 · 12-18 个月路线</div>
          <div class="rec-time">昨天 20:15</div>
        </div>
        <div class="rec-r"><span class="chip">查看</span></div>
      </div>
      <div class="rec-item">
        <div class="rec-ic plum-wash" style="color:var(--plum-deep)">✨</div>
        <div style="flex:1">
          <div class="rec-t">简历优化</div>
          <div class="rec-sub">采纳 2 / 6 项建议 · 已生成新版</div>
          <div class="rec-time">昨天 19:48</div>
        </div>
        <div class="rec-r"><span class="chip">查看</span></div>
      </div>
    </div>

    <div class="compliance-note">AI 服务记录仅保存在你的账户中，所有 AI 结果均为参考，不代表任何招聘方评价。</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
