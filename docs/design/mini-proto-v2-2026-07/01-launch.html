<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>启动页 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    #stage {
      background: linear-gradient(160deg, #0d2b24 0%, #1a4438 100%);
      justify-content: space-between;
    }
    .launch-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px 24px;
    }
    .launch-icon-wrap {
      width: 100px; height: 100px;
      border-radius: 28px;
      background: rgba(31,158,134,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 54px;
      box-shadow:
        0 0 0 10px rgba(31,158,134,.09),
        0 0 0 22px rgba(31,158,134,.045),
        0 0 60px rgba(31,158,134,.22),
        inset 0 1px 0 rgba(255,255,255,.08);
      margin-bottom: 28px;
    }
    .launch-brand {
      font-family: var(--font-serif);
      font-size: 23px; font-weight: 700;
      color: rgba(255,255,255,.95);
      text-align: center;
      letter-spacing: 1.5px;
      line-height: 1.45;
    }
    .launch-sub {
      font-size: 11.5px;
      color: rgba(255,255,255,.38);
      letter-spacing: 2.5px;
      text-align: center;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .launch-divider {
      width: 40px; height: 1px;
      background: rgba(255,255,255,.12);
      margin: 32px auto 0;
    }
</style>
</head>
<body>
<div id="stage">
  <div class="statusbar light">
    <span>9:41</span>
    <div class="sb-icons">📶 5G 🔋</div>
  </div>

  <div class="launch-mid">
    <div class="launch-icon-wrap">📋</div>
    <div class="launch-brand">AI求职打印服务终端</div>
    <div class="launch-sub">Smart Job Hunt · Print Terminal</div>
    <div class="launch-divider"></div>
  </div>

  <div style="padding: 0 24px 48px; display:flex; flex-direction:column; gap:12px;">
    <button class="btn wx block" style="height:56px;font-size:16px;border-radius:16px;letter-spacing:.5px;">
      <span style="font-size:18px;">💬</span> 微信一键登录
    </button>
    <button class="btn block" style="height:52px;background:transparent;color:rgba(255,255,255,.75);border:1.5px solid rgba(255,255,255,.28);border-radius:16px;font-size:15px;">
      游客浏览
    </button>
    <p style="font-size:10px;color:rgba(255,255,255,.28);text-align:center;line-height:1.75;margin-top:4px;">
      登录即代表你已阅读并同意
      <span style="color:rgba(255,255,255,.5);text-decoration:underline;cursor:pointer;">《服务协议》</span>
      和
      <span style="color:rgba(255,255,255,.5);text-decoration:underline;cursor:pointer;">《隐私政策》</span>
      <br>你的个人信息将受到严格保护
    </p>
  </div>
</div>
</body>
</html>
