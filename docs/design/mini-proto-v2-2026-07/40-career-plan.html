<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>职业规划 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .cp-head { padding:20px 20px 22px; background:linear-gradient(155deg,#4a6a5c,#1f9e86); position:relative; overflow:hidden; }
    .cp-head::after { content:'🧭'; position:absolute; right:16px; bottom:-6px; font-size:80px; opacity:.16; }
    .cp-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:rgba(255,255,255,.9); background:rgba(255,255,255,.16); padding:4px 10px; border-radius:var(--r-full); margin-bottom:12px; }
    .cp-t { font-family:var(--font-serif); font-size:22px; font-weight:700; color:#fff; }
    .cp-s { font-size:12.5px; color:rgba(255,255,255,.8); margin-top:6px; max-width:250px; line-height:1.6; }
    .field-lbl { font-size:13px; font-weight:600; color:var(--ink); margin:18px 16px 9px; }
    .stage-list { padding:0 16px; }
    .stage-opt { display:flex; align-items:center; gap:12px; padding:13px 15px; border:1.5px solid var(--line); border-radius:var(--r-lg); margin-bottom:9px; cursor:pointer; background:var(--surface); }
    .stage-opt.on { border-color:var(--teal); background:var(--wash); }
    .so-ic { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
    .so-name { font-size:14.5px; font-weight:600; color:var(--ink); }
    .so-desc { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .goal-grid { display:flex; flex-wrap:wrap; gap:9px; padding:0 16px; }
    .goal-chip { padding:9px 15px; border:1.5px solid var(--line); border-radius:var(--r-full); font-size:13px; color:var(--ink-soft); cursor:pointer; background:var(--surface); }
    .goal-chip.on { border-color:var(--teal); background:var(--teal); color:#fff; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar light" style="background:#4a6a5c"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar light" style="background:#4a6a5c;border-bottom:none">
    <div class="nav-back" style="color:#fff">‹</div>
    <div class="nav-title" style="color:#fff">AI 职业规划</div>
    <div class="nav-right"></div>
  </div>

  <div class="content has-bar">
    <div class="cp-head">
      <div class="cp-badge">✦ AI 规划建议 · 仅供参考</div>
      <div class="cp-t">规划你的职业路径</div>
      <div class="cp-s">告诉 AI 你的现状与目标，生成一份成长路线参考</div>
    </div>

    <div class="field-lbl">你目前处于</div>
    <div class="stage-list">
      <div class="stage-opt on">
        <div class="so-ic wash" style="color:var(--teal-deep)">🌱</div>
        <div style="flex:1"><div class="so-name">应届 / 求职中</div><div class="so-desc">刚毕业或正在找工作</div></div>
        <div class="mode-radio" style="width:20px;height:20px;border-radius:50%;border:2px solid var(--teal);position:relative"><i style="position:absolute;inset:3px;border-radius:50%;background:var(--teal);display:block"></i></div>
      </div>
      <div class="stage-opt">
        <div class="so-ic wheat-wash" style="color:var(--wheat-deep)">🚶</div>
        <div style="flex:1"><div class="so-name">在职发展期</div><div class="so-desc">工作 1-3 年，寻求成长</div></div>
        <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--line)"></div>
      </div>
      <div class="stage-opt">
        <div class="so-ic clay-wash" style="color:var(--clay-deep)">🔄</div>
        <div style="flex:1"><div class="so-name">转型 / 换赛道</div><div class="so-desc">考虑转岗或转行</div></div>
        <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--line)"></div>
      </div>
    </div>

    <div class="field-lbl">目标岗位或方向</div>
    <div style="padding:0 16px"><div class="field" style="margin:0"><input class="inp" value="前端 → 全栈工程师" /></div></div>

    <div class="field-lbl">你最关注</div>
    <div class="goal-grid">
      <div class="goal-chip on">技能提升</div>
      <div class="goal-chip on">薪资增长</div>
      <div class="goal-chip">管理路线</div>
      <div class="goal-chip">工作稳定</div>
      <div class="goal-chip">行业前景</div>
    </div>

    <div class="compliance-note">规划建议由 AI 生成，仅供参考，不构成职业、教育或投资等专业意见。</div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn primary lg block" style="background:var(--teal)">✦ 生成职业规划建议</button>
  </div>
</div>
</body>
</html>
