<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>游客浏览 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .guest-hero {
      margin: 0 16px 16px;
      background: linear-gradient(135deg, #157a67 0%, #1f9e86 100%);
      border-radius: var(--r-lg);
      padding: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .guest-hero::before {
      content: '';
      position: absolute;
      right: -24px; top: -24px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
    }
    .guest-hero::after {
      content: '';
      position: absolute;
      right: 24px; bottom: -32px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
    }
    .gh-title {
      font-family: var(--font-serif);
      font-size: 17px; font-weight: 700;
      margin-bottom: 8px;
    }
    .gh-desc {
      font-size: 13px; line-height: 1.65;
      color: rgba(255,255,255,.82);
    }
    .feat-tile {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      padding: 16px 10px;
      border-radius: var(--r);
      background: var(--surface);
      box-shadow: var(--sh-xs);
      cursor: pointer;
      position: relative;
    }
    .feat-tile .ft-ic {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .feat-tile .ft-label {
      font-size: 12px; font-weight: 600;
      color: var(--ink); text-align: center;
    }
    .feat-tile .ft-avail {
      position: absolute; top: 8px; right: 8px;
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .feat-tile .ft-avail.ok { background: var(--ok-soft); color: var(--ok); }
    .feat-tile .ft-avail.lock { background: var(--surface-2); color: var(--faint); }
    .feat-tile.locked { opacity: .55; }
    .feat-tile.locked .ft-label { color: var(--faint); }
    .section-label {
      padding: 16px 16px 8px;
      font-size: 12px; font-weight: 600;
      color: var(--muted); letter-spacing: .8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-icons">📶 5G 🔋</div>
  </div>

  <div class="navbar">
    <div class="nav-back">←</div>
    <div class="nav-title">游客浏览</div>
    <div style="width:32px;"></div>
  </div>

  <div class="content has-bar">

    <div class="guest-hero">
      <div class="gh-title">👋 欢迎体验</div>
      <div class="gh-desc">
        游客模式下，你可以浏览岗位信息、招聘会和政策资讯。<br>
        打印服务和 AI 简历功能需要登录后使用。
      </div>
    </div>

    <div class="section-label">可直接使用</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 4px;">
      <div class="feat-tile">
        <div class="ft-avail ok">✓</div>
        <div class="ft-ic" style="background:var(--wheat-soft);">💼</div>
        <div class="ft-label">岗位浏览</div>
      </div>
      <div class="feat-tile">
        <div class="ft-avail ok">✓</div>
        <div class="ft-ic" style="background:var(--wheat-soft);">🎪</div>
        <div class="ft-label">招聘会</div>
      </div>
      <div class="feat-tile">
        <div class="ft-avail ok">✓</div>
        <div class="ft-ic" style="background:var(--teal-soft);">📜</div>
        <div class="ft-label">政策服务</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:8px;">登录后解锁</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 4px;">
      <div class="feat-tile locked">
        <div class="ft-avail lock">🔒</div>
        <div class="ft-ic" style="background:var(--surface-2);">🖨️</div>
        <div class="ft-label">打印扫描</div>
      </div>
      <div class="feat-tile locked">
        <div class="ft-avail lock">🔒</div>
        <div class="ft-ic" style="background:var(--surface-2);">📄</div>
        <div class="ft-label">AI 简历</div>
      </div>
      <div class="feat-tile locked">
        <div class="ft-avail lock">🔒</div>
        <div class="ft-ic" style="background:var(--surface-2);">📂</div>
        <div class="ft-label">我的记录</div>
      </div>
    </div>

    <div style="margin:20px 16px 0;">
      <div class="notice" style="align-items:center;">
        <span class="n-ic">💡</span>
        <span>注册即可免费享受 AI 简历诊断和打印服务，支持微信快速登录</span>
      </div>
    </div>
  </div>

  <div class="actionbar" style="flex-direction:column;gap:8px;padding:12px 20px 32px;">
    <button class="btn primary block" style="height:56px;font-size:16px;border-radius:16px;">
      立即登录，解锁全部功能
    </button>
    <div style="text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:4px;">
      继续游客浏览 →
    </div>
  </div>
</div>
</body>
</html>
