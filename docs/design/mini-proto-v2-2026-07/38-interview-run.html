<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>面试进行中 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background:#f0ece1; }
    .iv-topbar { background:linear-gradient(160deg,#4a3a56,#614870); padding:12px 16px 14px; }
    .ivt-row { display:flex; align-items:center; justify-content:space-between; }
    .ivt-l { display:flex; align-items:center; gap:9px; }
    .ivt-av { width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:19px; }
    .ivt-name { font-size:14px; font-weight:600; color:#fff; }
    .ivt-sub { font-size:11px; color:rgba(255,255,255,.66); margin-top:1px; }
    .ivt-time { font-family:var(--font-serif); font-size:16px; font-weight:700; color:#fff; }
    .ivt-prog { margin-top:12px; }
    .ivt-prog .progress { background:rgba(255,255,255,.2); }
    .ivt-prog .progress i { background:#fff; }
    .ivt-qn { font-size:11px; color:rgba(255,255,255,.7); margin-top:7px; }
    .chat { padding:16px 16px 6px; }
    .q-bubble { background:var(--surface); border-radius:4px 16px 16px 16px; padding:14px 16px; box-shadow:var(--sh-xs); max-width:88%; }
    .q-label { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--plum-deep); font-weight:600; margin-bottom:7px; }
    .q-text { font-size:14.5px; color:var(--ink); line-height:1.65; }
    .a-bubble { background:var(--plum); border-radius:16px 4px 16px 16px; padding:13px 16px; margin-left:auto; max-width:86%; margin-top:14px; }
    .a-text { font-size:14px; color:#fff; line-height:1.6; }
    /* recording bar */
    .rec-wrap { position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line-faint); padding:16px 18px 22px; }
    .rec-hint { text-align:center; font-size:12px; color:var(--muted); margin-bottom:12px; }
    .rec-mic { width:72px; height:72px; border-radius:50%; background:var(--plum); margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; box-shadow:0 6px 20px rgba(122,90,134,.4); position:relative; }
    .rec-mic::before { content:''; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--plum); opacity:.4; animation:ring 1.8s infinite; }
    @keyframes ring { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.35);opacity:0} }
    .wave { display:flex; align-items:center; justify-content:center; gap:3px; height:24px; margin-top:14px; }
    .wave i { width:3px; background:var(--plum); border-radius:2px; animation:wv 1s infinite ease-in-out; }
    .wave i:nth-child(1){height:8px;animation-delay:0s} .wave i:nth-child(2){height:18px;animation-delay:.1s}
    .wave i:nth-child(3){height:24px;animation-delay:.2s} .wave i:nth-child(4){height:14px;animation-delay:.3s}
    .wave i:nth-child(5){height:20px;animation-delay:.4s} .wave i:nth-child(6){height:10px;animation-delay:.5s}
    .wave i:nth-child(7){height:16px;animation-delay:.6s}
    @keyframes wv { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
    .rec-foot { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
    .rec-btn { font-size:12.5px; color:var(--muted); }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar light" style="background:#4a3a56"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>

  <div class="iv-topbar">
    <div class="ivt-row">
      <div class="ivt-l">
        <div class="ivt-av">✦</div>
        <div>
          <div class="ivt-name">AI 面试官</div>
          <div class="ivt-sub">前端开发 · 综合面试</div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="ivt-time">08:24</div>
        <div class="ivt-sub">剩余时间</div>
      </div>
    </div>
    <div class="ivt-prog">
      <div class="progress"><i style="width:40%"></i></div>
      <div class="ivt-qn">第 2 / 5 题</div>
    </div>
  </div>

  <div class="content" style="padding-bottom:210px;background:#f0ece1">
    <div class="chat">
      <div class="q-bubble">
        <div class="q-label">✦ AI 面试官</div>
        <div class="q-text">很好。那我们聊聊你简历里提到的性能优化——能具体说说你是如何把首屏加载从 3.2s 降到 1.4s 的吗？遇到过哪些难点？</div>
      </div>

      <div class="a-bubble">
        <div class="a-text">主要做了三件事：路由懒加载拆分首屏包体积，对图片资源做了 CDN 和 WebP 转换，另外把一部分接口用了缓存……</div>
      </div>

      <div class="q-bubble" style="margin-top:14px;opacity:.55">
        <div class="q-label">✦ AI 面试官正在听</div>
        <div class="q-text muted">（正在识别你的语音作答…）</div>
      </div>
    </div>
  </div>

  <!-- 录音条 -->
  <div class="rec-wrap">
    <div class="rec-hint">正在录音，说完点击停止</div>
    <div class="rec-mic">🎙</div>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="rec-foot">
      <span class="rec-btn">⌨️ 改用文字</span>
      <span class="rec-btn" style="color:var(--plum-deep);font-weight:600">停止并提交 ⏹</span>
    </div>
  </div>
</div>
</body>
</html>
