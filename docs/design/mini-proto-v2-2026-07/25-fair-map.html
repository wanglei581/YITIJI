<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>展位导览 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .map-wrap { margin:10px 16px 0; background:var(--surface); border-radius:var(--r-md); box-shadow:var(--sh-sm); padding:14px; }
    .map-canvas { position:relative; height:280px; background:var(--surface-2); border-radius:var(--r); border:1px solid var(--line-soft); overflow:hidden; }
    .map-grid { position:absolute; inset:0; background-image:linear-gradient(var(--line-faint) 1px,transparent 1px),linear-gradient(90deg,var(--line-faint) 1px,transparent 1px); background-size:28px 28px; }
    .booth { position:absolute; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; cursor:pointer; box-shadow:var(--sh-xs); }
    .booth.a { background:var(--teal); }
    .booth.b { background:var(--wheat); }
    .booth.c { background:var(--slate); }
    .booth.svc { background:var(--clay); }
    .booth.entry { background:var(--ink); }
    .map-legend { display:flex; flex-wrap:wrap; gap:12px; padding:12px 4px 2px; }
    .lg { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
    .lg .sw { width:14px; height:14px; border-radius:4px; }
    .zone-row { display:flex; align-items:center; gap:12px; padding:12px 16px; }
    .zone-row + .zone-row { border-top:1px solid var(--line-faint); }
    .zone-row .zr-tag { width:44px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-weight:700; font-size:13px; color:#fff; flex-shrink:0; }
    .zone-row .zr-b { flex:1; }
    .zone-row .zr-n { font-size:14px; font-weight:500; color:var(--ink); }
    .zone-row .zr-c { font-size:11.5px; color:var(--muted); margin-top:2px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">展位导览图</div>
    <div class="nav-right"><span class="fs13 teal">打印</span></div>
  </div>

  <div class="content has-bar">
    <!-- 平面图 -->
    <div class="map-wrap">
      <div class="map-canvas">
        <div class="map-grid"></div>
        <div class="booth entry" style="left:40%;bottom:8px;width:20%;height:24px">入口</div>
        <div class="booth a" style="left:14px;top:20px;width:80px;height:56px">A 区</div>
        <div class="booth a" style="left:104px;top:20px;width:70px;height:56px">A-12</div>
        <div class="booth b" style="right:14px;top:20px;width:90px;height:56px">B 区</div>
        <div class="booth c" style="left:14px;top:96px;width:100px;height:50px">C 科技区</div>
        <div class="booth svc" style="right:14px;top:96px;width:90px;height:50px">服务区</div>
        <div class="booth b" style="left:130px;top:96px;width:60px;height:50px">B-05</div>
      </div>
      <div class="map-legend">
        <div class="lg"><span class="sw" style="background:var(--teal)"></span>制造业</div>
        <div class="lg"><span class="sw" style="background:var(--wheat)"></span>综合企业</div>
        <div class="lg"><span class="sw" style="background:var(--slate)"></span>科技互联网</div>
        <div class="lg"><span class="sw" style="background:var(--clay)"></span>服务专区</div>
      </div>
    </div>

    <!-- 分区列表 -->
    <div class="section-t">分区索引</div>
    <div class="card">
      <div class="zone-row"><div class="zr-tag" style="background:var(--teal)">A</div><div class="zr-b"><div class="zr-n">先进制造业专区</div><div class="zr-c">42 家单位 · 机械/电子/新能源</div></div><div class="r-arrow">›</div></div>
      <div class="zone-row"><div class="zr-tag" style="background:var(--slate)">C</div><div class="zr-b"><div class="zr-n">互联网 & 科技专区</div><div class="zr-c">38 家单位 · 研发/产品/运营</div></div><div class="r-arrow">›</div></div>
      <div class="zone-row"><div class="zr-tag" style="background:var(--wheat)">B</div><div class="zr-b"><div class="zr-n">综合企业专区</div><div class="zr-c">64 家单位 · 多行业</div></div><div class="r-arrow">›</div></div>
      <div class="zone-row"><div class="zr-tag" style="background:var(--clay)">S</div><div class="zr-b"><div class="zr-n">政策咨询 & 简历打印</div><div class="zr-c">职业指导 · 现场打印服务</div></div><div class="r-arrow">›</div></div>
    </div>

    <div class="notice">
      <span class="n-ic">🖨️</span>
      <span>可将展位导览图打印带到现场，方便按分区寻访目标企业。</span>
    </div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn ghost-ink" style="flex:1">保存图片</button>
    <button class="btn primary" style="flex:1.4">打印导览图</button>
  </div>
</div>
</body>
</html>
