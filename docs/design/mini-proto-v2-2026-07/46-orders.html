<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>打印订单 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .ord-card { padding:15px 16px; }
    .ord-card + .ord-card { border-top:8px solid var(--paper); }
    .oc-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
    .oc-store { font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
    .oc-body { display:flex; gap:12px; }
    .oc-thumb { width:46px; height:60px; border-radius:7px; background:#fff; border:1px solid var(--line-faint); flex-shrink:0; }
    .oc-title { font-size:14.5px; font-weight:600; color:var(--ink); }
    .oc-spec { font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
    .oc-foot { display:flex; align-items:center; justify-content:space-between; margin-top:13px; padding-top:12px; border-top:1px solid var(--line-faint); }
    .oc-price { font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--clay); }
    .oc-price small { font-size:11px; color:var(--muted); font-weight:400; }
    .oc-btns { display:flex; gap:8px; }
    .oc-btn { font-size:12.5px; padding:6px 14px; border-radius:var(--r-full); border:1px solid var(--line); color:var(--ink-soft); }
    .oc-btn.pri { background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600; }
    /* pickup code strip */
    .pk-strip { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#e9f6f1,#d7efe6); border-radius:var(--r-md); padding:10px 13px; margin-top:11px; }
    .pk-code { font-family:var(--font-serif); font-size:19px; font-weight:700; letter-spacing:3px; color:var(--teal-deep); }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">打印订单</div>
    <div class="nav-right"></div>
  </div>

  <div class="content" style="padding:0;background:var(--paper)">
    <div class="seg" style="margin:14px 16px">
      <div class="s on">全部</div>
      <div class="s">待取件</div>
      <div class="s">打印中</div>
      <div class="s">已完成</div>
    </div>

    <!-- 待取件订单 -->
    <div class="card" style="border-radius:0;margin:0">
      <div class="ord-card">
        <div class="oc-top">
          <div class="oc-store">📍 城东服务点 · A2 号机</div>
          <span class="chip teal">待取件</span>
        </div>
        <div class="oc-body">
          <div class="oc-thumb"></div>
          <div style="flex:1">
            <div class="oc-title">前端开发-陈明.pdf</div>
            <div class="oc-spec">A4 · 彩色 · 单面 · 2 份 · 共 6 页</div>
          </div>
        </div>
        <div class="pk-strip">
          <span style="font-size:12px;color:var(--teal-deep)">取件码</span>
          <span class="pk-code">8 2 4 6</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted)">到店输入或扫码</span>
        </div>
        <div class="oc-foot">
          <div class="oc-price">¥ 3.60 <small>已支付</small></div>
          <div class="oc-btns">
            <span class="oc-btn">订单详情</span>
            <span class="oc-btn pri">导航到店</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 已完成订单 -->
    <div class="card" style="border-radius:0;margin:0;border-top:8px solid var(--paper)">
      <div class="ord-card" style="border:none">
        <div class="oc-top">
          <div class="oc-store">📍 高新服务点 · B1 号机</div>
          <span class="chip">已完成</span>
        </div>
        <div class="oc-body">
          <div class="oc-thumb"></div>
          <div style="flex:1">
            <div class="oc-title">求职材料合集.pdf</div>
            <div class="oc-spec">A4 · 黑白 · 双面 · 1 份 · 共 12 页</div>
          </div>
        </div>
        <div class="oc-foot">
          <div class="oc-price">¥ 1.20 <small>2 天前</small></div>
          <div class="oc-btns">
            <span class="oc-btn">订单详情</span>
            <span class="oc-btn">再打一份</span>
          </div>
        </div>
      </div>
    </div>

    <div class="compliance-note" style="background:var(--paper)">订单状态实时同步终端设备。取件前请确认设备在线、纸张与耗材充足。</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
