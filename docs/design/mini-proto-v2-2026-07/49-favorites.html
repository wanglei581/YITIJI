<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>我的收藏 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .fav-item { display:flex; gap:12px; padding:14px 16px; cursor:pointer; }
    .fav-item + .fav-item { border-top:1px solid var(--line-faint); }
    .fav-ic { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; color:#fff; font-family:var(--font-serif); font-weight:700; }
    .fav-t { font-size:14.5px; font-weight:600; color:var(--ink); }
    .fav-sub { font-size:12px; color:var(--muted); margin-top:5px; }
    .fav-tags { display:flex; gap:6px; margin-top:7px; }
    .fav-star { color:var(--wheat); font-size:18px; align-self:flex-start; }
    .fav-salary { font-family:var(--font-serif); font-size:14px; font-weight:700; color:var(--clay); }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">我的收藏</div>
    <div class="nav-right"><span style="font-size:15px;color:var(--teal-deep)">管理</span></div>
  </div>

  <div class="content">
    <div class="seg" style="margin:14px 16px">
      <div class="s on">岗位</div>
      <div class="s">招聘会</div>
      <div class="s">企业</div>
    </div>

    <div class="card">
      <div class="fav-item">
        <div class="fav-ic" style="background:#1f9e86">星</div>
        <div style="flex:1">
          <div class="fav-t">前端开发工程师</div>
          <div class="fav-sub">星野科技 · 3-5 年 · 本科</div>
          <div class="fav-tags">
            <span class="fav-salary">15-25K</span>
            <span class="chip teal">✦ 匹配较高</span>
          </div>
        </div>
        <div class="fav-star">★</div>
      </div>
      <div class="fav-item">
        <div class="fav-ic" style="background:#b8683c">云</div>
        <div style="flex:1">
          <div class="fav-t">全栈工程师</div>
          <div class="fav-sub">云图数据 · 3-5 年 · 本科</div>
          <div class="fav-tags">
            <span class="fav-salary">18-30K</span>
            <span class="chip wheat">✦ 匹配中等</span>
          </div>
        </div>
        <div class="fav-star">★</div>
      </div>
      <div class="fav-item">
        <div class="fav-ic" style="background:#3f68b0">春</div>
        <div style="flex:1">
          <div class="fav-t">Node.js 后端开发</div>
          <div class="fav-sub">春潮科技 · 1-3 年 · 本科</div>
          <div class="fav-tags">
            <span class="fav-salary">12-20K</span>
          </div>
        </div>
        <div class="fav-star">★</div>
      </div>
    </div>

    <div class="compliance-note">收藏的岗位来自第三方平台。投递请前往来源平台，本终端仅提供信息浏览与跳转。</div>
    <div class="spacer-lg"></div>
  </div>
</div>
</body>
</html>
