<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>修改参数 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .origin-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: var(--wheat-wash);
      border-radius: var(--r-sm);
      margin: 0 16px 14px;
      font-size: 12px; color: var(--wheat-deep);
      border: 1px solid var(--wheat-soft);
    }
    .param-section { padding: 0 16px; margin-bottom: 14px; }
    .param-label {
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      color: var(--muted); margin-bottom: 10px;
      text-transform: uppercase;
    }
    .range-opts { display: flex; gap: 8px; }
    .range-opt {
      flex: 1; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r);
      border: 1.5px solid var(--line);
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .range-opt.on {
      border-color: var(--teal); background: var(--teal-wash);
      color: var(--teal-deep); font-weight: 600;
    }
    .range-input {
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px; padding: 10px 12px;
      background: var(--surface-2); border-radius: var(--r);
      border: 1.5px solid var(--teal);
    }
    .range-input .ri-label { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .range-input .ri-val {
      font-size: 14px; font-weight: 600; color: var(--ink); flex: 1;
    }
    .range-input .ri-hint { font-size: 11px; color: var(--faint); }

    .paper-readonly {
      display: flex; align-items: center; gap: 8px;
      height: 48px; padding: 0 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: 14px; color: var(--ink-soft);
    }
    .paper-readonly .pr-note { font-size: 11px; color: var(--faint); margin-left: 4px; }

    .duplex-row { display: flex; gap: 8px; }
    .duplex-opt {
      flex: 1; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r);
      border: 1.5px solid var(--line);
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .duplex-opt.on {
      border-color: var(--teal); background: var(--teal-wash);
      color: var(--teal-deep); font-weight: 600;
    }
    .copies-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
    }
    .copies-row .cr-label { font-size: 15px; font-weight: 500; color: var(--ink); }
    .copies-row .cr-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
<div id="stage">

  <div class="statusbar">
    <span>9:41</span>
    <div class="sb-icons">📶 5G 🔋</div>
  </div>

  <div class="navbar">
    <div class="nav-back">←</div>
    <span class="nav-title">修改参数</span>
    <div class="nav-right"></div>
  </div>

  <div class="content has-bar">

    <div class="spacer-sm"></div>

    <!-- 来源说明 -->
    <div class="origin-badge">
      <span>🔄</span>
      重新打印 · 取件码 <strong>T79</strong> 对应的文件
    </div>

    <!-- 颜色 -->
    <div class="param-section">
      <div class="param-label">打印颜色</div>
      <div class="opt on">
        <div class="o-radio"></div>
        <div class="oc">
          <div class="ot">黑白打印</div>
          <div class="od">节省费用，适合文字类文档</div>
        </div>
        <div class="o-price">¥0.15<span style="font-size:11px;font-weight:400;color:var(--muted);">/页</span></div>
      </div>
      <div class="opt">
        <div class="o-radio"></div>
        <div class="oc">
          <div class="ot">彩色打印</div>
          <div class="od">适合含色块图表的文档</div>
        </div>
        <div class="o-price">¥1.20<span style="font-size:11px;font-weight:400;color:var(--muted);">/页</span></div>
      </div>
    </div>

    <!-- 页面范围 -->
    <div class="param-section">
      <div class="param-label">页面范围</div>
      <div class="range-opts">
        <div class="range-opt on">✓ 全部页面</div>
        <div class="range-opt">自定义</div>
      </div>
      <div class="range-input" style="display:none;">
        <span class="ri-label">页码范围</span>
        <span class="ri-val">1-2</span>
        <span class="ri-hint">共 2 页</span>
      </div>
    </div>

    <!-- 纸张（只读） -->
    <div class="param-section">
      <div class="param-label">纸张规格</div>
      <div class="paper-readonly">
        📄 A4 <span class="pr-note">（仅支持 A4，自动锁定）</span>
      </div>
    </div>

    <!-- 双面 -->
    <div class="param-section">
      <div class="param-label">打印方式</div>
      <div class="duplex-row">
        <div class="duplex-opt">单面打印</div>
        <div class="duplex-opt on">✓ 双面自动</div>
      </div>
    </div>

    <!-- 份数 -->
    <div class="param-section">
      <div class="copies-row">
        <div>
          <div class="cr-label">打印份数</div>
          <div class="cr-sub">每份包含全部页面</div>
        </div>
        <div class="stepper">
          <div class="s-btn">−</div>
          <div class="s-val">2</div>
          <div class="s-btn">+</div>
        </div>
      </div>
    </div>

    <div class="spacer-lg"></div>

  </div>

  <!-- 操作条 -->
  <div class="actionbar">
    <div class="ab-price">
      <div class="label">总价预估</div>
      <div class="val"><sup>¥</sup>0.60</div>
    </div>
    <button class="btn primary" style="flex:1;">确认修改 →</button>
  </div>

</div>
</body>
</html>
