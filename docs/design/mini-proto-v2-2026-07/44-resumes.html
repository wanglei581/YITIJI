<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>我的简历 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .rz-card { display:flex; gap:13px; padding:15px 16px; cursor:pointer; }
    .rz-card + .rz-card { border-top:1px solid var(--line-faint); }
    .rz-thumb { width:52px; height:68px; border-radius:8px; background:#fff; border:1px solid var(--line-faint); flex-shrink:0; padding:7px 6px; box-shadow:var(--sh-xs); }
    .rz-bar { height:4px; border-radius:2px; background:#e3ded2; margin:3px 0; }
    .rz-bar.h { background:var(--teal); width:55%; }
    .rz-name { font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:7px; }
    .rz-meta { font-size:12px; color:var(--muted); margin-top:5px; }
    .rz-tags { display:flex; gap:6px; margin-top:8px; }
    .rz-acts { display:flex; gap:8px; margin-top:10px; }
    .rz-mini { font-size:12px; color:var(--teal-deep); font-weight:600; padding:5px 12px; border:1px solid var(--line); border-radius:var(--r-full); }
    .score-pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; background:var(--plum-wash); color:var(--plum-deep); padding:2px 9px; border-radius:var(--r-full); font-weight:600; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar">
    <div class="nav-back">‹</div>
    <div class="nav-title">我的简历</div>
    <div class="nav-right"><span style="font-size:20px;color:var(--teal-deep)">＋</span></div>
  </div>

  <div class="content has-bar">
    <div class="section-t">共 3 份简历</div>
    <div class="card">
      <div class="rz-card">
        <div class="rz-thumb">
          <div class="rz-bar h"></div><div class="rz-bar" style="width:35%"></div>
          <div class="rz-bar" style="margin-top:7px"></div><div class="rz-bar" style="width:80%"></div>
          <div class="rz-bar" style="width:70%"></div>
        </div>
        <div style="flex:1">
          <div class="rz-name">前端开发-陈明 <span class="badge teal">默认</span></div>
          <div class="rz-meta">PDF · 更新于 2 天前</div>
          <div class="rz-tags">
            <span class="score-pill">✦ 诊断 75 分</span>
            <span class="chip">已优化</span>
          </div>
          <div class="rz-acts">
            <span class="rz-mini">预览</span>
            <span class="rz-mini">诊断</span>
            <span class="rz-mini">打印</span>
          </div>
        </div>
      </div>

      <div class="rz-card">
        <div class="rz-thumb">
          <div class="rz-bar h"></div><div class="rz-bar" style="width:35%"></div>
          <div class="rz-bar" style="margin-top:7px"></div><div class="rz-bar" style="width:75%"></div>
        </div>
        <div style="flex:1">
          <div class="rz-name">全栈方向-陈明</div>
          <div class="rz-meta">DOCX · 更新于 1 周前</div>
          <div class="rz-tags"><span class="chip plum">AI 生成</span></div>
          <div class="rz-acts">
            <span class="rz-mini">预览</span>
            <span class="rz-mini">诊断</span>
            <span class="rz-mini">打印</span>
          </div>
        </div>
      </div>

      <div class="rz-card">
        <div class="rz-thumb">
          <div class="rz-bar h"></div><div class="rz-bar" style="width:40%"></div>
          <div class="rz-bar" style="margin-top:7px"></div><div class="rz-bar" style="width:82%"></div>
        </div>
        <div style="flex:1">
          <div class="rz-name">校招版-陈明</div>
          <div class="rz-meta">PDF · 更新于 3 周前</div>
          <div class="rz-tags"><span class="chip">纸质扫描</span></div>
          <div class="rz-acts">
            <span class="rz-mini">预览</span>
            <span class="rz-mini">诊断</span>
            <span class="rz-mini">打印</span>
          </div>
        </div>
      </div>
    </div>

    <div class="notice info" style="margin:0 16px">
      <span>ℹ</span>
      <div>简历文件仅保存在你的账户中，可随时删除。敏感文件建议打印后及时清理。</div>
    </div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn ghost-ink">📄 上传简历</button>
    <button class="btn plum" style="flex:1.4">✦ AI 生成新简历</button>
  </div>
</div>
</body>
</html>
