<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>模拟面试 · AI求职打印服务终端</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .iv-head { padding:20px 20px 22px; background:linear-gradient(155deg,#614870,#7a5a86); position:relative; overflow:hidden; }
    .iv-head::after { content:'🎤'; position:absolute; right:16px; bottom:-8px; font-size:84px; opacity:.14; }
    .iv-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); padding:4px 10px; border-radius:var(--r-full); margin-bottom:12px; }
    .iv-t { font-family:var(--font-serif); font-size:22px; font-weight:700; color:#fff; }
    .iv-s { font-size:12.5px; color:rgba(255,255,255,.78); margin-top:6px; max-width:250px; line-height:1.6; }
    .field-lbl { font-size:13px; font-weight:600; color:var(--ink); margin:18px 0 9px; padding:0 16px; }
    .mode-list { padding:0 16px; }
    .mode { display:flex; align-items:center; gap:13px; padding:14px 15px; border:1.5px solid var(--line); border-radius:var(--r-lg); margin-bottom:10px; cursor:pointer; background:var(--surface); }
    .mode.on { border-color:var(--plum); background:var(--plum-wash); }
    .mode-ic { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
    .mode-name { font-size:15px; font-weight:600; color:var(--ink); }
    .mode-desc { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5; }
    .mode-radio { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; position:relative; }
    .mode.on .mode-radio { border-color:var(--plum); }
    .mode.on .mode-radio::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--plum); }
    .diff-seg { padding:0 16px; }
  </style>
</head>
<body>
<div id="stage">
  <div class="statusbar light" style="background:#614870"><span>9:41</span><div class="sb-icons">📶 5G 🔋</div></div>
  <div class="navbar light" style="background:#614870;border-bottom:none">
    <div class="nav-back" style="color:#fff">‹</div>
    <div class="nav-title" style="color:#fff">AI 模拟面试</div>
    <div class="nav-right"></div>
  </div>

  <div class="content has-bar">
    <div class="iv-head">
      <div class="iv-badge">✦ AI 面试官 · 仅供练习</div>
      <div class="iv-t">开始一场模拟面试</div>
      <div class="iv-s">AI 会根据你的目标岗位提问，练习结束后给出反馈报告</div>
    </div>

    <div class="field-lbl">目标岗位</div>
    <div style="padding:0 16px"><div class="field" style="margin:0"><input class="inp" value="前端开发工程师" /></div></div>

    <div class="field-lbl">面试类型</div>
    <div class="mode-list">
      <div class="mode on">
        <div class="mode-ic plum-wash" style="color:var(--plum-deep)">💬</div>
        <div style="flex:1">
          <div class="mode-name">综合面试</div>
          <div class="mode-desc">自我介绍 + 项目深挖 + 行为问题</div>
        </div>
        <div class="mode-radio"></div>
      </div>
      <div class="mode">
        <div class="mode-ic wash" style="color:var(--teal-deep)">⚙️</div>
        <div style="flex:1">
          <div class="mode-name">技术专项</div>
          <div class="mode-desc">聚焦岗位相关技术问题</div>
        </div>
        <div class="mode-radio"></div>
      </div>
      <div class="mode">
        <div class="mode-ic wheat-wash" style="color:var(--wheat-deep)">🗣</div>
        <div style="flex:1">
          <div class="mode-name">HR 行为面</div>
          <div class="mode-desc">职业规划、团队协作、抗压能力</div>
        </div>
        <div class="mode-radio"></div>
      </div>
    </div>

    <div class="field-lbl">难度</div>
    <div class="diff-seg">
      <div class="seg">
        <div class="s">轻松</div>
        <div class="s on">标准</div>
        <div class="s">挑战</div>
      </div>
    </div>

    <div class="field-lbl">作答方式</div>
    <div style="padding:0 16px"><div class="row gap-10">
      <div class="chip plum" style="padding:9px 16px">🎙 语音作答</div>
      <div class="chip" style="padding:9px 16px">⌨️ 文字作答</div>
    </div></div>

    <div class="compliance-note">模拟面试仅供练习，AI 提问与评价不代表任何真实招聘方的标准或结果。</div>
    <div class="spacer-lg"></div>
  </div>

  <div class="actionbar">
    <button class="btn plum lg block">开始模拟面试 · 约 10 分钟</button>
  </div>
</div>
</body>
</html>
