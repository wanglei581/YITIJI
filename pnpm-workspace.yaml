packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
# pnpm 11 is the single supported package-manager line. Keep all project settings here.
engineStrict: true
overrides:
  qs: 6.15.2
  '@hono/node-server': 2.0.10
  uuid: 14.0.0
  shell-quote: 1.9.0
  hono: 4.12.27
  multer: 2.2.0
  js-yaml: 4.3.0
  fast-uri: 3.1.4
  postcss: 8.5.18
  brace-expansion@1.1.14: 1.1.16
  brace-expansion@2.1.1: 2.1.2
  brace-expansion@5.0.6: 5.0.8
allowBuilds:
  '@alicloud/openapi-core': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
patchedDependencies:
  brace-expansion@1.1.16: patches/brace-expansion@1.1.16.patch
  brace-expansion@2.1.2: patches/brace-expansion@2.1.2.patch
