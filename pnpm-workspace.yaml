packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
# pnpm 11 is the single supported package-manager line. Keep all project settings here.
engineStrict: true
overrides:
  qs: 6.15.2
  '@hono/node-server': 2.0.10
  uuid: 14.0.0
  shell-quote: 1.9.0
  hono: 4.12.27
  multer: 2.2.0
  js-yaml: 4.3.1
  fast-uri: 3.1.5
  postcss: 8.5.18
  # nanoid: GHSA-28wg-ghj8-5hjv + GHSA-2v37-7h3g-55p8
  # postcss still requests the vulnerable 3.3.12 line; 3.3.18 fixes both loop conditions.
  nanoid@3.3.12: 3.3.18
  # brace-expansion: GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895
  # upstream 1.1.18 / 2.1.4 / 5.0.9 already include EXPANSION_MAX_LENGTH (CVE-2026-14257 backport);
  # local patches are no longer needed. Direct overrides (pnpm does not chain resolutions).
  brace-expansion@1.1.14: 1.1.18
  brace-expansion@2.1.1: 2.1.4
  brace-expansion@5.0.6: 5.0.9
  # browserslist: GHSA-c83g-rgw3-j3cx（缓存无上限导致 OOM）+ GHSA-73wf-gq98-2v4g
  # （恶意 browserslist-stats.json 触发 normalizeStats 崩溃 / 原型写入），均为 HIGH。
  # 影响 <=4.28.6，首个修复版 4.28.7。传递自 @vitejs/plugin-react > @babel/core >
  # @babel/helper-compilation-targets（三个前端的 devDependencies，仅构建期）。
  # 同一 4.x 线内的补丁号升级，babel 声明 ^4.24.0，不跨大版本。
  browserslist: 4.28.7
  # mysql2: GHSA-3f6p-5ww8-9rcr（HIGH）
  # 服务端可把认证插件降级到 mysql_clear_password，导致明文口令外泄；影响 <3.22.0，
  # 首个修复版 3.22.0。传递自 prisma@7.8.0 CLI，它精确锁 3.15.3，所以只能靠 override 抬版本。
  # 本项目只用 PostgreSQL + SQLite，不会加载 mysql2；升版是消除告警而非修复在用链路。
  # 升级 prisma 到自带 >=3.22.0 的版本后应删掉本条。
  mysql2@3.15.3: 3.22.0
  # deepmerge-ts: GHSA-ggr8-5vv4-36mx（HIGH，2026-08-17T13:32Z 发布）
  # 合并递归对象图时栈耗尽；影响 <8.0.0，首个修复版 8.0.0。
  # 传递自 @prisma/config@7.8.0，它精确锁 7.1.5，所以只能靠 override 抬版本。
  # 这是跨大版本覆盖：升级 prisma 到自带 8.x 的版本后应删掉本条。
  deepmerge-ts@7.1.5: 8.0.0
allowBuilds:
  '@alicloud/openapi-core': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
