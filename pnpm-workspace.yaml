packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
# pnpm 11 is the single supported package-manager line. Keep all project settings here.
engineStrict: true
overrides:
  qs: 6.15.2
  '@hono/node-server': 2.0.10
  uuid: 14.0.0
  shell-quote: 1.9.0
  hono: 4.12.27
  multer: 2.2.0
  js-yaml: 4.3.0
  fast-uri: 3.1.5
  postcss: 8.5.18
  brace-expansion@1.1.14: 1.1.18
  brace-expansion@2.1.1: 2.1.4
  brace-expansion@5.0.6: 5.0.9
allowBuilds:
  '@alicloud/openapi-core': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
patchedDependencies:
  # no patches required: brace-expansion upgraded to 1.1.18/2.1.4/5.0.9
  # (GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 fixed upstream; old patches removed)

