name: Deploy to zyidai.cn

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # 手动补发：指定一次**已通过的** main CI 运行号来发布它验证过的那个提交。
  # 为什么需要它（2026-09-07 实测代价）：ci.yml 的并发组是 ci-${{ github.ref }} 且
  # cancel-in-progress: true，任何新的 main 推送都会取消正在跑的发布前 CI。多条 lane
  # 并行开发（其中若干装了「CI 绿即自动合并」的看门狗）时，一次 30 分钟的 CI 几乎
  # 抢不到窗口 —— 当天连续五次「CI 跑到一半被取消 → 发布不触发」。
  # 本触发不放宽任何安全前提：仍然只发布 CI 已通过的精确 SHA，由下方 resolve 步骤
  # 逐项校验所给运行号（必须是本仓库的 CI 工作流、main 分支、conclusion=success）。
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: '要发布的那次 main CI 运行号（必须已 success）'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to server (API + Kiosk + Admin + Partner)
    runs-on: ubuntu-latest
    # 生产发布必须同时满足 CI 全绿与显式授权。变量为 false 时整个 job 跳过，
    # 不得建立 SSH、检出服务器代码、安装依赖、构建或覆盖任何前端/API 产物。
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.DEPLOY_API_ENABLED == 'true' }}

    steps:
      # 解析并校验发布目标 SHA。workflow_run 触发时直接取事件里的 head_sha；
      # workflow_dispatch 触发时必须逐项验证所给运行号，确保「只发 CI 验证过的提交」
      # 这条不变量不因新增触发方式而松动。
      - name: Resolve CI-verified target SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID_FROM_EVENT: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_JSON="$(gh api "repos/${{ github.repository }}/actions/runs/$INPUT_RUN_ID")"
            NAME="$(printf '%s' "$RUN_JSON" | jq -r '.name')"
            BRANCH="$(printf '%s' "$RUN_JSON" | jq -r '.head_branch')"
            CONCL="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')"
            SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')"
            if [ "$NAME" != "CI" ] || [ "$BRANCH" != "main" ] || [ "$CONCL" != "success" ]; then
              echo "::error::运行号 $INPUT_RUN_ID 不满足发布前提（name=$NAME branch=$BRANCH conclusion=$CONCL），必须是 main 上 conclusion=success 的 CI" >&2
              exit 1
            fi
            echo "手动补发：CI run $INPUT_RUN_ID（main，success）→ $SHA"
            RUN_ID="$INPUT_RUN_ID"
          else
            SHA="$RUN_SHA"
            RUN_ID="$RUN_ID_FROM_EVENT"
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::解析出的目标 SHA 非法：$SHA" >&2
            exit 1
          fi
          # CI_RUN 只写进 DEPLOY_SOURCE 供追溯，但发布脚本把它列为必需变量。
          # workflow_dispatch 时 github.event.workflow_run 为空，直接引用会传空串，
          # 发布脚本在第 16 行 `: "${CI_RUN:?}"` 处中止（2026-09-07 实测 run 34134363402）。
          # 因此两条触发路径都在这里归一，并和 SHA 一样做格式校验。
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::解析出的 CI 运行号非法：$RUN_ID" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          # fetch 单次预算 600s × 2 次 = 最坏 20m，其后仍需 pnpm install、
          # 三端前端构建、prisma migrate、pm2 重启，30m 不够，提到 45m。
          command_timeout: 45m
          envs: TARGET_SHA,CI_RUN,API_RELEASE_ENABLED,DEPLOY_API_DIR,DEPLOY_PM2_NAME,DEPLOY_ADMIN_WEB_ROOT,DEPLOY_PARTNER_WEB_ROOT,KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN,PRINT_REQUIRE_PII_SCAN
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            if [ "${PRINT_REQUIRE_PII_SCAN:-}" != "true" ]; then
              echo "::error::PRINT_REQUIRE_PII_SCAN 必须通过仓库变量显式设置为 true，禁止进入生产发布" >&2
              exit 1
            fi

            echo "=== 拉取并检出 CI 已验证提交 ==="
            EXPECTED_SHA='${{ steps.target.outputs.sha }}'
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" = "$EXPECTED_SHA" ]; then
              echo "服务器已在目标提交 $EXPECTED_SHA，跳过拉取"
            else
              FETCH_OK=0
              if [ ! -f /srv/ai-job-print-secrets/bos-release.env ]; then
                echo "BOS 未配置，走 GitHub 拉取"
              elif [ ! -f scripts/release-bundle/bos-object.mjs ]; then
                echo "当前检出尚无 BOS 客户端，首次发布走 GitHub 拉取"
              else
                echo "尝试从 BOS 拉取增量 bundle"
                if (
                  set -a
                  . /srv/ai-job-print-secrets/bos-release.env
                  set +a
                  rm -f /tmp/release.bundle /tmp/release.sha256
                  node scripts/release-bundle/bos-object.mjs get "release-$EXPECTED_SHA.bundle" /tmp/release.bundle &&
                    node scripts/release-bundle/bos-object.mjs get "release-$EXPECTED_SHA.sha256" /tmp/release.sha256 &&
                    (
                      cd /tmp
                      sha256sum -c release.sha256
                    ) &&
                    git bundle verify /tmp/release.bundle &&
                    git fetch --no-tags /tmp/release.bundle "$EXPECTED_SHA"
                ); then
                  FETCH_OK=1
                  echo "bundle 来自 BOS，跳过 GitHub 拉取"
                else
                  echo "BOS bundle 不可用或校验失败，走 GitHub 拉取"
                  rm -f /tmp/release.bundle /tmp/release.sha256
                fi
              fi
              # --depth=1 拉的是该提交的**完整快照**（约 23MB gzip），不是增量：
              # shallow 仓库没有可复用的历史对象，每次发布都要重传整棵树。
              # 2026-08-17 run 32035882349：4 次尝试各恰好卡满 180s 后被 timeout
              # 杀掉，报 "fatal: early EOF"。那不是网络断开，是本脚本自己的预算
              # 太紧 —— 180s 传完 23MB 要求持续 ≥134 KB/s，国内机直连 github.com
              # 达不到这个稳定速率（8/14 那次 22MB 侥幸压线通过）。
              # 600s 把要求降到 ~40 KB/s。若 600s 仍失败，不要继续加时间：
              # 那说明问题在通道而非预算，应转向根治方案（见下方 TODO）。
              # TODO(根治): 改由 CI 产出制品经国内端点（阿里云 OSS / Codeup 镜像）
              # 下发，生产机不再直连 github.com。跨境直连是这里的结构性瓶颈。
              if [ "$FETCH_OK" != "1" ]; then
                for ATTEMPT in 1 2; do
                  echo "fetch exact CI SHA attempt $ATTEMPT/2"
                  FETCH_STARTED_AT="$(date +%s)"
                  # HTTP/1.1 可规避部分代理的 HTTP/2 长连接中断。
                  # 目标 SHA 必须可从 origin/main 到达。
                  if timeout --foreground --kill-after=10s 600s \
                    git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 origin "$EXPECTED_SHA"; then
                    echo "fetch 成功，耗时 $(( $(date +%s) - FETCH_STARTED_AT ))s"
                    FETCH_OK=1
                    break
                  fi
                  # 记录实际耗时：贴住 600s 说明是超时，远小于 600s 说明是真的断连。
                  # 这两种情况的修法不同，下次失败时不必再靠猜。
                  echo "fetch 失败，耗时 $(( $(date +%s) - FETCH_STARTED_AT ))s（预算 600s）"
                  sleep "$((ATTEMPT * 5))"
                done
              fi
              test "$FETCH_OK" = "1"
              # 只部署 CI 已验证的精确 SHA；即使 main 在此期间继续前进（文档/其他合并），
              # 也不 ff 到新 tip，避免发布未经该次 CI 验证的提交。
              git cat-file -e "$EXPECTED_SHA^{commit}"
              git checkout --detach "$EXPECTED_SHA"
            fi
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            echo "=== 安装依赖 ==="
            pnpm install --frozen-lockfile

            echo "=== 构建 kiosk 前端 ==="
            if [ -z "${KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN:-}" ]; then
              echo "::error::KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN 未配置，禁止发布空白扫码登录页" >&2
              exit 1
            fi
            VITE_API_MODE=http \
            VITE_API_BASE_URL=/api/v1 \
            VITE_USE_TRTC_CALL=true \
            VITE_TERMINAL_AGENT_BRIDGE_TOKEN="$KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN" \
            pnpm build:kiosk:production

            echo "=== 构建 admin 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/admin build

            echo "=== 构建 partner 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/partner build

            if [ "${API_RELEASE_ENABLED:-}" = "true" ]; then
              echo "=== 受控发布 API（备份→迁移→构建→PM2→健康）==="
              DEPLOY_PATH=${{ secrets.DEPLOY_PATH }} \
              TARGET_SHA="$EXPECTED_SHA" \
              CI_RUN="$CI_RUN" \
              API_RELEASE_ENABLED="$API_RELEASE_ENABLED" \
              DEPLOY_API_DIR="${DEPLOY_API_DIR:-/srv/ai-job-print}" \
              DEPLOY_PM2_NAME="${DEPLOY_PM2_NAME:-ai-job-print-api}" \
              bash .github/scripts/deploy-api-release.sh
            else
              echo "=== API 发布未启用：校验运行版本与目标一致，防止继续错位 ==="
              RUNNING_SOURCE="$(sed -n 's/^source=origin\/main@\([0-9a-f]\{40\}\)/\1/p' "${DEPLOY_API_DIR:-/srv/ai-job-print}/DEPLOY_SOURCE.txt" | head -n1)"
              if [ -z "$RUNNING_SOURCE" ]; then
                echo "::error::无法读取运行 API 的 DEPLOY_SOURCE；禁止继续发布 Kiosk" >&2
                exit 1
              fi
              if [ "$RUNNING_SOURCE" != "$EXPECTED_SHA" ]; then
                echo "::error::运行 API 版本 $RUNNING_SOURCE 与目标 $EXPECTED_SHA 不一致；请设置仓库变量 DEPLOY_API_ENABLED=true 后重新触发受控发布" >&2
                exit 1
              fi
            fi

            echo "=== 部署到 nginx 目录 ==="
            rm -rf ${{ secrets.DEPLOY_WEB_ROOT }}/*
            cp -r apps/kiosk/dist/. ${{ secrets.DEPLOY_WEB_ROOT }}/

            echo "=== 部署 admin 到 nginx 目录（未配置 DEPLOY_ADMIN_WEB_ROOT 时跳过）==="
            if [ -n "${DEPLOY_ADMIN_WEB_ROOT:-}" ]; then
              rm -rf "$DEPLOY_ADMIN_WEB_ROOT"/*
              cp -r apps/admin/dist/. "$DEPLOY_ADMIN_WEB_ROOT"/
              echo "admin dist 已同步到 $DEPLOY_ADMIN_WEB_ROOT"
            else
              echo "DEPLOY_ADMIN_WEB_ROOT 未配置，跳过 admin 前端发布（线上保持现状）"
            fi

            echo "=== 部署 partner 到 nginx 目录（未配置 DEPLOY_PARTNER_WEB_ROOT 时跳过）==="
            if [ -n "${DEPLOY_PARTNER_WEB_ROOT:-}" ]; then
              rm -rf "$DEPLOY_PARTNER_WEB_ROOT"/*
              cp -r apps/partner/dist/. "$DEPLOY_PARTNER_WEB_ROOT"/
              echo "partner dist 已同步到 $DEPLOY_PARTNER_WEB_ROOT"
            else
              echo "DEPLOY_PARTNER_WEB_ROOT 未配置，跳过 partner 前端发布（线上保持现状）"
            fi

            echo "=== 重载 nginx ==="
            nginx -s reload || systemctl reload nginx

            if test -f scripts/release-bundle/bos-object.mjs; then
              (
                set -a
                . /srv/ai-job-print-secrets/bos-release.env 2>/dev/null || exit 1
                set +a
                printf '%s' "$EXPECTED_SHA" > /tmp/latest.txt
                node scripts/release-bundle/bos-object.mjs put latest-deployed.txt /tmp/latest.txt
              ) || echo "latest-deployed.txt 回写失败（不影响本次发布）"
            fi

            echo "✅ 部署完成"
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ steps.target.outputs.run_id }}
          API_RELEASE_ENABLED: ${{ vars.DEPLOY_API_ENABLED }}
          DEPLOY_API_DIR: ${{ secrets.DEPLOY_API_DIR }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_ADMIN_WEB_ROOT: ${{ secrets.DEPLOY_ADMIN_WEB_ROOT }}
          DEPLOY_PARTNER_WEB_ROOT: ${{ secrets.DEPLOY_PARTNER_WEB_ROOT }}
          KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN: ${{ secrets.KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN }}
          PRINT_REQUIRE_PII_SCAN: ${{ vars.PRINT_REQUIRE_PII_SCAN }}
