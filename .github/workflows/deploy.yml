name: Deploy to zyidai.cn

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to server (API + Kiosk + Admin + Partner)
    runs-on: ubuntu-latest
    # 生产发布必须同时满足 CI 全绿与显式授权。变量为 false 时整个 job 跳过，
    # 不得建立 SSH、检出服务器代码、安装依赖、构建或覆盖任何前端/API 产物。
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_API_ENABLED == 'true' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 30m
          envs: TARGET_SHA,CI_RUN,API_RELEASE_ENABLED,DEPLOY_API_DIR,DEPLOY_PM2_NAME,DEPLOY_ADMIN_WEB_ROOT,DEPLOY_PARTNER_WEB_ROOT
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== 拉取并检出 CI 已验证提交 ==="
            EXPECTED_SHA='${{ github.event.workflow_run.head_sha }}'
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" = "$EXPECTED_SHA" ]; then
              echo "服务器已在目标提交 $EXPECTED_SHA，跳过拉取"
            else
              FETCH_OK=0
              for ATTEMPT in 1 2; do
                echo "fetch attempt $ATTEMPT/2"
                if timeout --foreground --kill-after=10s 240s git fetch origin main; then
                  FETCH_OK=1
                  break
                fi
              done
              test "$FETCH_OK" = "1"
              # 只部署 CI 已验证的精确 SHA；即使 main 在此期间继续前进（文档/其他合并），
              # 也不 ff 到新 tip，避免发布未经该次 CI 验证的提交。
              git cat-file -e "$EXPECTED_SHA^{commit}"
              git checkout --detach "$EXPECTED_SHA"
            fi
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

            echo "=== 安装依赖 ==="
            pnpm install --frozen-lockfile

            echo "=== 构建 kiosk 前端 ==="
            pnpm --filter @ai-job-print/kiosk build

            echo "=== 构建 admin 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/admin build

            echo "=== 构建 partner 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/partner build

            if [ "${API_RELEASE_ENABLED:-}" = "true" ]; then
              echo "=== 受控发布 API（备份→迁移→构建→PM2→健康）==="
              DEPLOY_PATH=${{ secrets.DEPLOY_PATH }} \
              TARGET_SHA="$EXPECTED_SHA" \
              CI_RUN="$CI_RUN" \
              API_RELEASE_ENABLED="$API_RELEASE_ENABLED" \
              DEPLOY_API_DIR="${DEPLOY_API_DIR:-/srv/ai-job-print}" \
              DEPLOY_PM2_NAME="${DEPLOY_PM2_NAME:-ai-job-print-api}" \
              bash .github/scripts/deploy-api-release.sh
            else
              echo "=== API 发布未启用：校验运行版本与目标一致，防止继续错位 ==="
              RUNNING_SOURCE="$(sed -n 's/^source=origin\/main@\([0-9a-f]\{40\}\)/\1/p' "${DEPLOY_API_DIR:-/srv/ai-job-print}/DEPLOY_SOURCE.txt" | head -n1)"
              if [ -z "$RUNNING_SOURCE" ]; then
                echo "::error::无法读取运行 API 的 DEPLOY_SOURCE；禁止继续发布 Kiosk" >&2
                exit 1
              fi
              if [ "$RUNNING_SOURCE" != "$EXPECTED_SHA" ]; then
                echo "::error::运行 API 版本 $RUNNING_SOURCE 与目标 $EXPECTED_SHA 不一致；请设置仓库变量 DEPLOY_API_ENABLED=true 后重新触发受控发布" >&2
                exit 1
              fi
            fi

            echo "=== 部署到 nginx 目录 ==="
            rm -rf ${{ secrets.DEPLOY_WEB_ROOT }}/*
            cp -r apps/kiosk/dist/. ${{ secrets.DEPLOY_WEB_ROOT }}/

            echo "=== 部署 admin 到 nginx 目录（未配置 DEPLOY_ADMIN_WEB_ROOT 时跳过）==="
            if [ -n "${DEPLOY_ADMIN_WEB_ROOT:-}" ]; then
              rm -rf "$DEPLOY_ADMIN_WEB_ROOT"/*
              cp -r apps/admin/dist/. "$DEPLOY_ADMIN_WEB_ROOT"/
              echo "admin dist 已同步到 $DEPLOY_ADMIN_WEB_ROOT"
            else
              echo "DEPLOY_ADMIN_WEB_ROOT 未配置，跳过 admin 前端发布（线上保持现状）"
            fi

            echo "=== 部署 partner 到 nginx 目录（未配置 DEPLOY_PARTNER_WEB_ROOT 时跳过）==="
            if [ -n "${DEPLOY_PARTNER_WEB_ROOT:-}" ]; then
              rm -rf "$DEPLOY_PARTNER_WEB_ROOT"/*
              cp -r apps/partner/dist/. "$DEPLOY_PARTNER_WEB_ROOT"/
              echo "partner dist 已同步到 $DEPLOY_PARTNER_WEB_ROOT"
            else
              echo "DEPLOY_PARTNER_WEB_ROOT 未配置，跳过 partner 前端发布（线上保持现状）"
            fi

            echo "=== 重载 nginx ==="
            nginx -s reload || systemctl reload nginx

            echo "✅ 部署完成"
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          API_RELEASE_ENABLED: ${{ vars.DEPLOY_API_ENABLED }}
          DEPLOY_API_DIR: ${{ secrets.DEPLOY_API_DIR }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_ADMIN_WEB_ROOT: ${{ secrets.DEPLOY_ADMIN_WEB_ROOT }}
          DEPLOY_PARTNER_WEB_ROOT: ${{ secrets.DEPLOY_PARTNER_WEB_ROOT }}
