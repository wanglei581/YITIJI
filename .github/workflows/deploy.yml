name: Deploy to zyidai.cn

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy kiosk to server
    runs-on: ubuntu-latest
    # 只在 CI 全部通过后才部署
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== 拉取最新代码 ==="
            git pull origin main

            echo "=== 安装依赖 ==="
            pnpm install --frozen-lockfile

            echo "=== 构建 kiosk 前端 ==="
            pnpm --filter @ai-job-print/kiosk build

            echo "=== 部署到 nginx 目录 ==="
            rm -rf ${{ secrets.DEPLOY_WEB_ROOT }}/*
            cp -r apps/kiosk/dist/. ${{ secrets.DEPLOY_WEB_ROOT }}/

            echo "=== 重载 nginx ==="
            nginx -s reload || systemctl reload nginx

            echo "✅ 部署完成"
