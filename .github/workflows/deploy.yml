name: Deploy to zyidai.cn

permissions: {}

concurrency:
  group: production-maintenance
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to server (API + Kiosk + Admin + Partner)
    runs-on: ubuntu-latest
    # 生产发布必须同时满足 CI 全绿与显式授权。变量为 false 时整个 job 跳过，
    # 不得建立 SSH、检出服务器代码、安装依赖、构建或覆盖任何前端/API 产物。
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && vars.DEPLOY_API_ENABLED == 'true' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          # fetch 单次预算 600s × 2 次 = 最坏 20m，其后仍需 pnpm install、
          # 三端前端构建、prisma migrate、pm2 重启，30m 不够，提到 45m。
          command_timeout: 45m
          envs: TARGET_SHA,CI_RUN,RELEASE_ATTEMPT,API_RELEASE_ENABLED,DEPLOY_PATH,DEPLOY_API_DIR,DEPLOY_PM2_NAME,KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN,PRINT_REQUIRE_PII_SCAN
          script: |
            set -euo pipefail
            command -v flock >/dev/null 2>&1 || { echo "::error::flock is required"; exit 1; }
            exec 9>/var/lock/ai-job-print-production-maintenance.lock
            flock -n 9 || { echo "::error::another production maintenance operation is active"; exit 1; }
            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
            RUNTIME_ROOT=/srv/ai-job-print
            WHOLE_RELEASE_ATTEMPT_STARTED=false
            WHOLE_RELEASE_COMMITTED=false
            WHOLE_RELEASE_OLD_SHA=""
            ACTIVE_RELEASE_GROUP=""

            restore_incomplete_whole_release() {
              status=$?
              trap - EXIT HUP INT TERM
              if [ "$status" -ne 0 ] &&
                [ "$WHOLE_RELEASE_ATTEMPT_STARTED" = true ] &&
                [ "$WHOLE_RELEASE_COMMITTED" != true ]; then
                API_SOURCE="$RUNTIME_ROOT/API_DEPLOY_SOURCE.txt"
                FULL_SOURCE="$RUNTIME_ROOT/DEPLOY_SOURCE.txt"
                STATIC_STATUS_FILE="$RUNTIME_ROOT/.STATIC_RELEASE_STATUS-$EXPECTED_SHA-$RELEASE_ATTEMPT"
                WHOLE_RELEASE_STATE="$(
                  RUNTIME_ROOT="$RUNTIME_ROOT" \
                    EXPECTED_SHA="$EXPECTED_SHA" \
                    RELEASE_ATTEMPT="$RELEASE_ATTEMPT" \
                    STATIC_STATUS_FILE="$STATIC_STATUS_FILE" \
                    bash "$DEPLOY_PATH/.github/scripts/classify-whole-release-state.sh"
                )"
                if [ "$WHOLE_RELEASE_STATE" = committed ]; then
                  echo "::notice::whole release provenance is already full-ready for this CI run; automatic restore is not required" >&2
                elif [ "$WHOLE_RELEASE_STATE" = restore ]; then
                  echo "::warning::incomplete whole release detected; restoring the previous API/runtime" >&2
                  RUNTIME_BACKUP="$(sed -n 's/^runtime_backup=//p' "$API_SOURCE" | head -n1)"
                  BACKUP_OLD_SHA="$(sed -n 's/^source=origin\/main@\([0-9a-f]\{40\}\)$/\1/p' "$RUNTIME_BACKUP/DEPLOY_SOURCE.txt" | head -n1)"
                  if [ -z "$WHOLE_RELEASE_OLD_SHA" ] || [ "$BACKUP_OLD_SHA" != "$WHOLE_RELEASE_OLD_SHA" ]; then
                    echo "::error::frozen old SHA does not match the runtime backup provenance; automatic restore refused" >&2
                    exit 1
                  fi
                  if ! RUNTIME_BACKUP="$RUNTIME_BACKUP" \
                    OLD_SHA="$WHOLE_RELEASE_OLD_SHA" \
                    TARGET_SHA="$EXPECTED_SHA" \
                    CI_RUN="$CI_RUN" \
                    RELEASE_ATTEMPT="$RELEASE_ATTEMPT" \
                    DEPLOY_RESTORE_MARKER_FILE="$API_SOURCE" \
                    DEPLOY_PM2_NAME="${DEPLOY_PM2_NAME:-ai-job-print-api}" \
                    bash "$DEPLOY_PATH/.github/scripts/deploy-api-restore.sh"; then
                    echo "::error::automatic API/runtime restore failed; manual recovery is required" >&2
                    status=1
                  else
                    echo "::warning::previous API/runtime restored; additive migrations were not reversed" >&2
                  fi
                elif [ "$WHOLE_RELEASE_STATE" = api-helper ]; then
                  echo "::notice::current API attempt did not publish a ready marker; API helper owns any required internal rollback" >&2
                elif [ "$WHOLE_RELEASE_STATE" = restored ]; then
                  echo "::notice::current API attempt already restored the previous runtime; no second restore is required" >&2
                else
                  echo "::error::whole release state is incomplete or unknown; automatic API restore refused to avoid creating a mixed release" >&2
                  echo "::error::inspect $STATIC_STATUS_FILE and the .dist.rollback/.dist.failed anchors before manual recovery" >&2
                  status=1
                fi
              fi
              exit "$status"
            }

            forward_release_signal() {
              signal="$1"
              exit_code="$2"
              trap - HUP INT TERM
              if [ -n "$ACTIVE_RELEASE_GROUP" ]; then
                kill -s "$signal" -- "-$ACTIVE_RELEASE_GROUP" 2>/dev/null || true
                wait "$ACTIVE_RELEASE_GROUP" 2>/dev/null || true
                ACTIVE_RELEASE_GROUP=""
              fi
              exit "$exit_code"
            }

            run_release_helper() {
              setsid "$@" &
              ACTIVE_RELEASE_GROUP=$!
              if wait "$ACTIVE_RELEASE_GROUP"; then
                helper_status=0
              else
                helper_status=$?
              fi
              ACTIVE_RELEASE_GROUP=""
              return "$helper_status"
            }

            trap restore_incomplete_whole_release EXIT
            trap 'forward_release_signal HUP 129' HUP
            trap 'forward_release_signal INT 130' INT
            trap 'forward_release_signal TERM 143' TERM
            command -v setsid >/dev/null 2>&1 || { echo "::error::setsid is required"; exit 1; }
            if [ -n "${DEPLOY_API_DIR:-}" ] && [ "$DEPLOY_API_DIR" != "$RUNTIME_ROOT" ]; then
              echo "::error::DEPLOY_API_DIR must equal the approved production runtime root" >&2
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH/.git" ] || [ -L "$DEPLOY_PATH" ]; then
              echo "::error::DEPLOY_PATH must be a real standalone Git worktree" >&2
              exit 1
            fi
            DEPLOY_PATH_REAL="$(cd "$DEPLOY_PATH" && pwd -P)"
            RUNTIME_ROOT_REAL="$(cd "$RUNTIME_ROOT" && pwd -P)"
            case "$DEPLOY_PATH_REAL" in
              "$RUNTIME_ROOT_REAL" | "$RUNTIME_ROOT_REAL"/*)
                echo "::error::DEPLOY_PATH must be separate from the production runtime root" >&2
                exit 1
                ;;
            esac
            cd "$DEPLOY_PATH"

            if [ "${PRINT_REQUIRE_PII_SCAN:-}" != "true" ]; then
              echo "::error::PRINT_REQUIRE_PII_SCAN 必须通过仓库变量显式设置为 true，禁止进入生产发布" >&2
              exit 1
            fi

            echo "=== 拉取并检出 CI 已验证提交 ==="
            EXPECTED_SHA='${{ github.event.workflow_run.head_sha }}'
            if ! printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::workflow_run head SHA is invalid" >&2
              exit 1
            fi
            CURRENT_SHA="$(git rev-parse HEAD)"
            FETCH_OK=0
            # --depth=1 拉 main 的完整快照（约 23MB gzip），不是按事件 SHA 抓任意对象。
            # 服务器 shallow 仓库没有可复用历史，每次发布仍要重传完整树；600s × 2
            # 是当前跨境链路预算。若仍失败，应改为受信制品/国内镜像，不再继续加时。
            for ATTEMPT in 1 2; do
              echo "fetch trusted origin/main attempt $ATTEMPT/2"
              FETCH_STARTED_AT="$(date +%s)"
              # 只获取本仓库正式 main ref；不按事件 SHA 抓取 PR/fork 可控对象。
              if timeout --foreground --kill-after=10s 600s \
                git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 origin \
                  +refs/heads/main:refs/remotes/origin/main; then
                echo "fetch 成功，耗时 $(( $(date +%s) - FETCH_STARTED_AT ))s"
                FETCH_OK=1
                break
              fi
              # 记录实际耗时：贴住 600s 说明是超时，远小于 600s 说明是真的断连。
              # 这两种情况的修法不同，下次失败时不必再靠猜。
              echo "fetch 失败，耗时 $(( $(date +%s) - FETCH_STARTED_AT ))s（预算 600s）"
              sleep "$((ATTEMPT * 5))"
            done
            test "$FETCH_OK" = "1"
            TRUSTED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            if [ "$TRUSTED_MAIN_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::verified workflow SHA is not the current trusted origin/main tip" >&2
              exit 1
            fi
            git cat-file -e "$EXPECTED_SHA^{commit}"
            if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
              git checkout --detach "$EXPECTED_SHA"
            else
              echo "服务器已在可信 main 提交 $EXPECTED_SHA，跳过 checkout"
            fi
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            WHOLE_RELEASE_OLD_SHA="$(sed -n 's/^source=origin\/main@\([0-9a-f]\{40\}\)$/\1/p' "$RUNTIME_ROOT/DEPLOY_SOURCE.txt" | head -n1)"
            if ! printf '%s\n' "$WHOLE_RELEASE_OLD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::active production provenance does not contain a valid old SHA" >&2
              exit 1
            fi

            echo "=== 安装依赖 ==="
            pnpm install --frozen-lockfile

            echo "=== 构建 kiosk 前端 ==="
            if [ -z "${KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN:-}" ]; then
              echo "::error::KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN 未配置，禁止发布空白扫码登录页" >&2
              exit 1
            fi
            VITE_API_MODE=http \
            VITE_API_BASE_URL=/api/v1 \
            VITE_USE_TRTC_CALL=true \
            VITE_TERMINAL_AGENT_BRIDGE_TOKEN="$KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN" \
            pnpm build:kiosk:production

            echo "=== 构建 admin 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/admin build

            echo "=== 构建 partner 前端 ==="
            VITE_API_MODE=http VITE_API_BASE_URL=/api/v1 pnpm --filter @ai-job-print/partner build

            echo "=== 三端静态发布前置检查 ==="
            for app in kiosk admin partner; do
              test -f "$DEPLOY_PATH/apps/$app/dist/index.html"
              test -d "$RUNTIME_ROOT/apps/$app/dist"
              test ! -L "$RUNTIME_ROOT/apps/$app/dist"
            done

            echo "=== 受控发布 API（备份→迁移→构建→PM2→健康）==="
            STATIC_STATUS_FILE="$RUNTIME_ROOT/.STATIC_RELEASE_STATUS-$EXPECTED_SHA-$RELEASE_ATTEMPT"
            if [ -e "$STATIC_STATUS_FILE" ] || [ -L "$STATIC_STATUS_FILE" ]; then
              echo "::error::static release status already exists for this CI run; inspect the previous attempt before retrying" >&2
              exit 1
            fi
            printf '%s\n' 'not-switched' > "$STATIC_STATUS_FILE"
            WHOLE_RELEASE_ATTEMPT_STARTED=true
            run_release_helper env \
              DEPLOY_PATH="$DEPLOY_PATH" \
              TARGET_SHA="$EXPECTED_SHA" \
              CI_RUN="$CI_RUN" \
              RELEASE_ATTEMPT="$RELEASE_ATTEMPT" \
              API_RELEASE_ENABLED="$API_RELEASE_ENABLED" \
              DEPLOY_API_DIR="$RUNTIME_ROOT" \
              DEPLOY_PM2_NAME="${DEPLOY_PM2_NAME:-ai-job-print-api}" \
              bash .github/scripts/deploy-api-release.sh
            echo "=== 三端静态暂存、切换、失败回退与整套来源提交 ==="
            PENDING_SOURCE="$RUNTIME_ROOT/.DEPLOY_SOURCE.pending-$EXPECTED_SHA-$RELEASE_ATTEMPT"
            run_release_helper env \
              SOURCE_ROOT="$DEPLOY_PATH" \
              RUNTIME_ROOT="$RUNTIME_ROOT" \
              TARGET_SHA="$EXPECTED_SHA" \
              PENDING_SOURCE="$PENDING_SOURCE" \
              RELEASE_ATTEMPT="$RELEASE_ATTEMPT" \
              bash .github/scripts/deploy-static-release.sh
            WHOLE_RELEASE_COMMITTED=true
            trap - EXIT HUP INT TERM
            rm -f -- "$STATIC_STATUS_FILE"

            BACKUP_ROOT=/srv/ai-job-print-backups \
              BACKUP_ROOT_EXPECTED=/srv/ai-job-print-backups \
              DEPLOY_SOURCE_FILE="$RUNTIME_ROOT/DEPLOY_SOURCE.txt" \
              DEPLOY_BACKUP_KEEP=3 \
              DEPLOY_BACKUP_DRY_RUN=false \
              bash .github/scripts/deploy-backup-retention.sh \
              || echo "::warning::备份清理失败，已保留现场（不影响已验证发布）"

            echo "✅ 部署完成"
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
          API_RELEASE_ENABLED: ${{ vars.DEPLOY_API_ENABLED }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_API_DIR: ${{ secrets.DEPLOY_API_DIR }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN: ${{ secrets.KIOSK_TERMINAL_AGENT_BRIDGE_TOKEN }}
          PRINT_REQUIRE_PII_SCAN: ${{ vars.PRINT_REQUIRE_PII_SCAN }}
