# 工程基线 CI:每次推送/PR 在干净环境验证 frozen-lockfile 安装、lint、typecheck、
# build 与核心 verify 套件。verify 在全新 SQLite 库(prisma db push)上自建测试数据、
# 自清理;PDF 导出验证依赖系统 CJK 字体(fonts-noto-cjk)。
#
# 注意:不在 CI 中放任何真实凭证;FILE_SIGNING_SECRET 为 CI 专用测试值,
# FILE_STORAGE_DRIVER 强制 local,绝不触达生产 COS。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # C-2D 会员资产 E2E（verify:member-assets-c2d）需要 Redis：
      # 短信验证码 / 频控 / 会员会话全部落 Redis（dev SMS provider = log）。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: file:./prisma/dev.db
      FILE_SIGNING_SECRET: ci-only-test-signing-secret-0123456789abcdef
      FILE_STORAGE_DIR: /tmp/ci-file-storage
      FILE_STORAGE_DRIVER: local
      AI_PROVIDER: mock
      # 以下均为 CI 专用测试值，不是真实凭证
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379
      SMS_PROVIDER: log
      # terminals.service 在模块加载期 requireEnv 这两项（verify 启动完整 AppModule 需要）
      TERMINAL_ADMIN_SECRET: ci-only-terminal-admin-secret
      TERMINAL_ACTION_TOKEN_SECRET: ci-only-terminal-action-secret
      TERMINAL_LEGACY_REGISTER_ENABLED: 'true'
    steps:
      # Profile 等 diff 范围守卫需要 merge-base；PR 默认 shallow checkout 无法可靠计算。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — no tracked active AI tool state
        # CCG 要求归档任务作为正式审计记录提交；仅拒绝活动 .ccg/tasks 与其它 AI 工具临时状态。
        run: |
          tracked=$(git ls-files .ccg/tasks | grep -Ev '^\.ccg/tasks/archive/' || true)
          otherTracked=$(git ls-files .ccg/commander .product-pm .workbuddy .superpowers .worktrees opc-doc)
          tracked="$tracked${tracked:+$'\n'}$otherTracked"
          if [ -n "$tracked" ]; then
            echo "::error::AI 工具活动状态目录不得纳入版本管理（见 .gitignore / CLAUDE.md §7）。违规文件："
            echo "$tracked"
            exit 1
          fi
          echo "OK: 无被跟踪的 AI 工具活动状态文件"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Repository integrity gate
        # 全量 tracked 文件拒绝残留冲突标记；所有 GitHub Actions workflow 必须能通过 YAML 语法解析。
        run: |
          pnpm verify:repository-integrity
          pnpm verify:ci-gate-coverage

      - name: Deploy authorization gate
        # 纯静态检查：未显式授权时 Deploy job 必须在建立 SSH 前整体跳过。
        run: node scripts/verify-deploy-authorization-gate.mjs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cross-client deterministic static gates
        # 只读取仓库源码/配置；不连外网、硬件、密钥或真实数据库。
        run: |
          pnpm --filter @ai-job-print/miniapp verify:static
          pnpm --filter @ai-job-print/kiosk verify:service-entry-readiness
          # V6 纵切第一刀（打印域 P39）迁移保真：读 docs/design 原型 + 生产源码做交叉断言。
          # 纯静态，不连数据库/硬件，所以和其他 cross-client 静态门禁同步。
          pnpm --filter @ai-job-print/kiosk verify:p39-print-hub-fidelity
          pnpm --filter @ai-job-print/admin verify:refresh-safe
          pnpm --filter @ai-job-print/admin verify:admin-job-materials-ui
          pnpm --filter @ai-job-print/admin verify:toolbox-review-ui
          pnpm --filter @ai-job-print/admin verify:admin-terminal-bind-code-ui
          pnpm --filter @ai-job-print/admin verify:admin-account-settings-ui
          pnpm --filter @ai-job-print/partner verify:partner-refresh-safe
          # S1 前端 AI 原语合同（#618）。纯读 apps/kiosk 源码，不碰 Prisma，
          # 因此可以留在这一步；四个 api 侧的 AI 门禁见下方 Verify suites。
          pnpm --filter @ai-job-print/kiosk verify:kiosk-ai-primitives
          # ── 2026-08-16 门禁全量体检补回：以下门禁此前写在 package.json 里
          #    但没有任何 CI job 执行它们。全部只读取仓库源码/文档文本，
          #    不 import services/api/src、不碰 Prisma、不连 DB，故留在本步。
          pnpm --filter @ai-job-print/kiosk verify:advisor-provider-gate
          pnpm --filter @ai-job-print/kiosk verify:file-retention-ui
          pnpm --filter @ai-job-print/kiosk verify:home-narrow-visual-balance
          pnpm --filter @ai-job-print/kiosk verify:home-toolbox-ui
          pnpm --filter @ai-job-print/kiosk verify:jobfair-checkin
          pnpm --filter @ai-job-print/kiosk verify:jobfair-size
          pnpm --filter @ai-job-print/kiosk verify:kiosk-runtime-error-boundary
          pnpm --filter @ai-job-print/kiosk verify:kiosk-visual-unity
          pnpm --filter @ai-job-print/kiosk verify:print-cta-contrast
          pnpm --filter @ai-job-print/kiosk verify:print-done-truth
          pnpm --filter @ai-job-print/kiosk verify:print-entry-source-split
          pnpm --filter @ai-job-print/kiosk verify:runtime-terminal-identity
          pnpm --filter @ai-job-print/kiosk verify:scan-session-truth
          pnpm --filter @ai-job-print/kiosk verify:screensaver-empty-shell
          pnpm --filter @ai-job-print/kiosk verify:v6-type-floor
          pnpm --filter @ai-job-print/kiosk verify:visual-evidence-manifest
          pnpm --filter @ai-job-print/admin verify:source-publish-actions
          pnpm --filter @ai-job-print/refresh verify:runtime
          # ── GATE-WIRE 接线：#647 修好的漂移门禁，本批实跑绿后接进 CI ──
          #    以下 5 条都不 import services/api/src（已逐条核验 src 引用数为 0），
          #    且已在「把 src/generated/prisma 挪走」的条件下实跑通过，
          #    等价于本步在 CI 里的真实前置（Prisma 客户端由后面的 Typecheck 步生成）。
          #    因此可以留在本步拿快速失败；其余 5 条见下方 Verify suites。
          pnpm --filter @ai-job-print/api verify:assess-isolation
          pnpm --filter @ai-job-print/api verify:compliance
          pnpm --filter @ai-job-print/api verify:jobfair-checkin
          pnpm --filter @ai-job-print/api verify:file-assets-trial-acceptance
          pnpm --filter @ai-job-print/kiosk verify:visible-actions-truth

      - name: Dependency security gate
        # Fail closed on unaccepted critical/high; only GHSA-qwww-vcr4-c8h2 may remain as accepted-unreachable.
        run: pnpm verify:dependency-security

      - name: Compliance copy gate (forbidden UI terms)
        # 扫 apps/{admin,kiosk,partner}/src 全量 .ts/.tsx,禁词清单来自 packages/shared 的 SSOT。
        # 放在重装依赖之前:只依赖 node + 仓库,违规能最快失败。
        run: pnpm verify:compliance-copy

      - name: Import review reset gate (forced re-review on partner import)
        # 静态断言 Partner/Excel 导入及 job-sync 内容变化路径都回 pending+draft；
        # job-sync 内容未变化路径只刷新 syncTime。纯 node,不需要 DB。
        working-directory: services/api
        run: pnpm verify:import-review-reset

      - name: Backend P0 contract gates
        working-directory: services/api
        run: pnpm verify:backend-p0-contracts

      - name: Install CJK font + sqlite3 + redis-server (PDF / terminal verify)
        # sqlite3 CLI 当前 runner 镜像预装,显式安装使依赖成为工作流契约
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk sqlite3 redis-server

      - name: PG schema drift check
        working-directory: services/api
        run: pnpm db:pg:sync:check

      - name: Recruitment P1 schema + SQLite fresh/upgrade gates
        # Applies the full migration history and an old-schema fixture in isolated temp DBs.
        # It must not replace the shared db-push baseline used by the verify suites below.
        working-directory: services/api
        run: pnpm verify:recruitment-p1-schema

      - name: Recruitment Wave 2 read-only planner contract
        # Pure fixtures only: target guards, manifest conservation, collision handling and no-write CLI surface.
        working-directory: services/api
        run: pnpm verify:recruitment-wave2-readonly

      - name: Recruitment Wave 2 full inventory contract
        # Pure fixtures only: API target guards, pagination boundaries, drift and SQL read allowlist.
        working-directory: services/api
        run: |
          pnpm typecheck:recruitment-wave2-full-inventory
          pnpm verify:recruitment-wave2-full-inventory

      - name: Recruitment Wave 2 proposed governance zero-write contract
        # Pure fixtures: strict evidence packs, hypothetical-only decisions, conservation and redacted output.
        working-directory: services/api
        run: |
          pnpm typecheck:recruitment-wave2-proposed-governance
          pnpm verify:recruitment-wave2-proposed-governance

      - name: Lint
        run: |
          pnpm --filter @ai-job-print/api lint
          pnpm --filter @ai-job-print/kiosk lint
          pnpm --filter @ai-job-print/admin lint
          pnpm --filter @ai-job-print/partner lint

      - name: Typecheck
        run: |
          pnpm --filter @ai-job-print/shared typecheck
          pnpm --filter @ai-job-print/api typecheck
          pnpm --filter @ai-job-print/kiosk typecheck
          pnpm --filter @ai-job-print/admin typecheck
          pnpm --filter @ai-job-print/partner typecheck
          pnpm --filter terminal-agent typecheck

      - name: Build
        # 三端生产构建门禁要求 VITE_API_MODE=http；Kiosk 还要求数字人构建期开关，
        # 避免 /assistant 未启用数字人通话入口后静默回落文字助手。
        env:
          VITE_API_MODE: http
          VITE_API_BASE_URL: /api/v1
          VITE_USE_TRTC_CALL: 'true'
          VITE_TERMINAL_ID: KSK-001
          VITE_TERMINAL_AGENT_BRIDGE_TOKEN: ci-only-local-bridge-token-0123456789abcdef
        run: |
          pnpm --filter @ai-job-print/api build
          pnpm build:kiosk:production
          pnpm --filter @ai-job-print/admin build
          pnpm --filter @ai-job-print/partner build
          pnpm --filter terminal-agent build

      - name: Release provenance fixture
        # 仅验证临时 release/artifact 目录与 fake PM2/health；不得连接任何环境。
        run: pnpm --filter @ai-job-print/api verify:release-provenance

      - name: Release Genesis fixture
        # 仅使用临时目录、fake PM2、fake health、fake traffic controller；禁止连接网络、数据库、Redis、实例或真实 PM2。
        run: pnpm --filter @ai-job-print/api verify:release-genesis

      - name: D2 prime offline contract fixture
        # Pure renderer/state/evidence checks only; no PM2, Nginx, systemd, network, or production data plane.
        run: pnpm --filter @ai-job-print/api verify:d2-same-host-contract

      - name: D2 prime invocation governance fixture
        # Temporary Git/filesystem fixtures only; never launches the drill, systemd, PM2, Nginx, or production clients.
        run: pnpm --filter @ai-job-print/api verify:d2-same-host-governance

      - name: LightFlow UI static contracts
        run: |
          pnpm --filter @ai-job-print/ui verify:service-desk-foundation
          pnpm --filter @ai-job-print/kiosk verify:home-prototype-v1
          pnpm --filter @ai-job-print/kiosk verify:member-login-dialog
          pnpm --filter @ai-job-print/kiosk verify:lightflow-k2c-interview
          pnpm --filter @ai-job-print/kiosk verify:lightflow-k2a-career
          pnpm --filter @ai-job-print/kiosk verify:lightflow-k2a-ai-career
          pnpm --filter @ai-job-print/kiosk verify:lightflow-k2b-ai-resume
          pnpm --filter @ai-job-print/kiosk verify:resume-diagnosis-flow-ui
          pnpm --filter @ai-job-print/kiosk verify:job-material-library-ui
          pnpm --filter @ai-job-print/admin verify:service-desk-dashboard-ui
          pnpm --filter @ai-job-print/partner verify:service-desk-jobs-ui
          pnpm --filter @ai-job-print/kiosk verify:lightflow-k1-public-entry
          pnpm --filter @ai-job-print/kiosk verify:qr-login-ui
          pnpm --filter @ai-job-print/kiosk verify:resume-phone-upload-ui

      - name: Terminal Agent verify suites
        # 不依赖 DB（本地网桥两套用真实临时目录 + 真实本地 HTTP server + 后端 stub），
        # 放在 SQLite db 准备之前即可跑。
        working-directory: apps/terminal-agent
        run: |
          pnpm run verify:direct-http-agents
          pnpm run verify:form-data-security
          pnpm run verify:agent-profile-guard
          pnpm run verify:agent-config-resilience
          pnpm run verify:windows-service-recovery
          pnpm run verify:print-scan-agent
          pnpm run verify:agent-unauthorized
          pnpm run verify:production-provisioning
          pnpm run verify:scan-watcher
          pnpm run verify:scan-input-health
          # Temp directory + temp SQLite fault injection; no production scan folder or Windows dependency.
          pnpm exec ts-node scripts/verify-scan-deletion-audit.ts
          # Linux-safe fault injection only: temp SQLite + loopback HTTP fixture; no Windows printer or external network.
          pnpm exec ts-node scripts/verify-task-reliability.ts
          # Pure in-process scheduler control; proves wake coalescing without HTTP, DB, or hardware.
          pnpm run verify:task-runner-wake
          # Injected platform/clock/WMI/dispatch seams only; never invokes a real spooler or printer.
          pnpm exec ts-node scripts/verify-print-monitor-truth.ts
          pnpm run verify:network-diagnostics
          pnpm run verify:local-qr-proxy
          pnpm run verify:usb-import-agent
          # ── 2026-08-16 门禁全量体检补回。三条都只做静态读取 / 注入桩：
          #    installer-inputs 校验安装器输入清单文本，printer-config 校验
          #    printerName 可配置（不硬编码型号），local-print-wake 走进程内
          #    调度控制。均不触发真实 spooler、打印机或 Windows API。
          pnpm run verify:installer-inputs
          pnpm run verify:printer-config
          pnpm run verify:local-print-wake

      - name: Prepare fresh SQLite db (schema push)
        working-directory: services/api
        run: npx prisma db push --accept-data-loss

      - name: Recruitment P1 read-only preflight contract
        working-directory: services/api
        run: pnpm verify:recruitment-p1-preflight

      - name: Backend P0 real HTTP contracts
        working-directory: services/api
        run: pnpm verify:backend-p0-http

      - name: Recruitment content Admin read-only HTTP contracts
        working-directory: services/api
        env:
          RECRUITMENT_CONTENT_VERIFY_TARGET: isolated
        run: pnpm verify:recruitment-content-http

      - name: Install SQLite terminal database guards
        working-directory: services/api
        # db push intentionally remains the shared SQLite CI baseline; triggers are
        # migration-only objects, so install the exact production migration SQL files before
        # running provisioning verification.
        run: |
          sqlite3 prisma/dev.db ".read prisma/migrations/20260724200000_guard_planned_terminal_updates/migration.sql"
          sqlite3 prisma/dev.db ".read prisma/migrations/20260726003000_guard_retired_terminal/migration.sql"

      - name: Verify suites
        # ⚠ 必须串行(逐行顺序执行)。这些 verify 共享同一个 SQLite dev.db,
        # 并行(& / run-p / concurrently)会触发 SQLite 写锁超时,可能让脚本的
        # finally 清理失败,残留 approved+published 测试招聘会泄漏到公开前台
        # (/campus、/job-fairs)。各脚本已用稳定 tag 在下次运行前预清残留,
        # 但前提仍是串行,切勿改成并行。
        env:
          VITE_API_MODE: http
          VITE_API_BASE_URL: /api/v1
          VITE_USE_TRTC_CALL: 'true'
          VITE_TERMINAL_ID: KSK-001
          VITE_TERMINAL_AGENT_BRIDGE_TOKEN: ci-only-local-bridge-token-0123456789abcdef
        run: |
          # ── S0 后端 AI 底座门禁（#617）─────────────────────────────
          # 这四条 import services/api/src，会传递依赖到 Prisma 客户端，
          # 因此必须放在「Prepare fresh SQLite db」之后——先前误放进上面的
          # 「Cross-client deterministic static gates」步，那时客户端还没生成，
          # 报 Cannot find module '../generated/prisma/client'。
          pnpm --filter @ai-job-print/api verify:assistant-provider-label
          pnpm --filter @ai-job-print/api verify:llm-input-pii-mask
          pnpm --filter @ai-job-print/api verify:ai-feature-keys
          pnpm --filter @ai-job-print/api verify:aigc-pdf-metadata
          pnpm --filter @ai-job-print/kiosk verify:assistant-trtc-guard
          pnpm --filter @ai-job-print/kiosk verify:production-real-services
          pnpm --filter @ai-job-print/kiosk verify:print-confirm-honest
          pnpm --filter @ai-job-print/kiosk verify:scan-input-safety
          pnpm --filter @ai-job-print/kiosk verify:print-parameter-capability
          pnpm --filter @ai-job-print/kiosk verify:contract-review-session
          pnpm --filter @ai-job-print/kiosk verify:contract-review-report-print
          pnpm --filter @ai-job-print/kiosk verify:device-status-honest
          pnpm --filter @ai-job-print/kiosk verify:ai-artifact-print-url-contract
          pnpm --filter @ai-job-print/kiosk verify:job-fit-m1-5-ui
          pnpm --filter @ai-job-print/kiosk verify:legal-retention-copy
          pnpm --filter @ai-job-print/kiosk verify:price-single-source
          pnpm --filter @ai-job-print/kiosk verify:member-print-orders-ui
          pnpm --filter @ai-job-print/kiosk verify:profile-inkpaper-home
          pnpm --filter @ai-job-print/kiosk verify:user-center-wave0
          pnpm --filter @ai-job-print/kiosk verify:member-session-closure
          pnpm --filter @ai-job-print/kiosk verify:lightflow-profile-entry
          pnpm --filter @ai-job-print/kiosk verify:profile-feedback-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-resumes-notifications-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-ai-records-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-activity-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-documents-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-print-orders-inkpaper
          pnpm --filter @ai-job-print/kiosk verify:profile-print-orders-login-smoke
          pnpm --filter @ai-job-print/kiosk verify:profile-commercial-first-batch
          pnpm --filter @ai-job-print/api verify:profile-commercial-first-batch-acceptance
          pnpm --filter @ai-job-print/kiosk verify:kiosk-shell-active-nav
          pnpm --filter @ai-job-print/kiosk verify:prod-build-config
          pnpm --filter @ai-job-print/kiosk verify:job-info-ui
          pnpm --filter @ai-job-print/kiosk verify:renshi-policy-ui
          pnpm --filter @ai-job-print/kiosk verify:job-ai-ui
          pnpm --filter @ai-job-print/kiosk verify:job-ai-history-privacy-ui
          pnpm --filter @ai-job-print/kiosk verify:data-request-ui
          pnpm --filter @ai-job-print/admin verify:admin-billing-ui
          pnpm --filter @ai-job-print/admin verify:admin-print-scan-ui
          pnpm --filter @ai-job-print/admin verify:admin-orders-readonly-ui
          pnpm --filter @ai-job-print/admin verify:admin-file-lifecycle-ui
          pnpm --filter @ai-job-print/admin verify:admin-device-fleet-overview-ui
          pnpm --filter @ai-job-print/admin verify:admin-terminal-network-diagnostics-ui
          pnpm --filter @ai-job-print/admin verify:admin-phone-transfer-ui
          pnpm --filter @ai-job-print/admin verify:partner-account-action-ui
          pnpm --filter @ai-job-print/admin verify:partner-account-action-state
          pnpm --filter @ai-job-print/admin verify:job-ai-ops-dashboard-ui
          pnpm --filter @ai-job-print/admin verify:data-request-ui
          pnpm --filter @ai-job-print/admin verify:admin-users-ui
          pnpm --filter @ai-job-print/admin verify:honest-placeholders
          pnpm --filter @ai-job-print/api verify:admin-users
          pnpm --filter @ai-job-print/partner verify:job-quality-dashboard-ui
          pnpm --filter @ai-job-print/partner verify:excel-template-download-ui
          pnpm --filter @ai-job-print/partner verify:partner-relative-api-url
          pnpm --filter @ai-job-print/partner verify:partner-stats-contract
          pnpm --filter @ai-job-print/kiosk verify:jobfair-ui
          pnpm --filter @ai-job-print/kiosk verify:jobfair-commercial-closure
          pnpm --filter @ai-job-print/kiosk verify:smart-campus-ui
          pnpm --filter @ai-job-print/api verify:production-db-guard
          pnpm --filter @ai-job-print/api verify:db-load-indexes
          pnpm --filter @ai-job-print/api verify:production-runtime-gates
          # 启动韧性：Redis 不可达时必须显式降级并照常监听端口，不得静默挂起。
          # 会拉起真实 src/main.ts 子进程与临时 redis-server（用随机空闲端口）。
          pnpm --filter @ai-job-print/api verify:boot-resilience
          # Redis 故障时的鉴权语义 + 健康检查诚实性：撤销必须仍然生效、
          # 后台不得再全线 500、/health 的每一条影响面声明都要被实际请求核对。
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:redis-degradation-truth
          # 异常可运维性：5xx 必须留下带 requestId 的日志，且日志不得含 PII / 凭证。
          pnpm --filter @ai-job-print/api verify:error-observability
          # 订单筛选不得静默失效（未知筛选值必须 400，不能退化成返回全量）。
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:admin-order-filters
          pnpm --filter @ai-job-print/api verify:demo-seed-guard
          pnpm --filter @ai-job-print/api verify:first-admin-bootstrap
          pnpm --filter @ai-job-print/api verify:contract-review:gate0
          pnpm --filter @ai-job-print/api verify:contract-review:preprod-readiness
          pnpm --filter @ai-job-print/api verify:contract-review:contract
          pnpm --filter @ai-job-print/api verify:contract-review:file-policy
