  # ── PostgreSQL 生产底座验证(第四阶段)──────────────────────────────────────
  # 全新 PG 空库:schema 同步校验 → migrate deploy → seed → 核心 verify。
  # 未通过此 job 不得宣称生产数据库已支持 PostgreSQL。
  postgres-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_job_print_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_job_print_ci
      POSTGRES_URL: postgresql://ci:ci@localhost:5432/ai_job_print_ci
      REDIS_URL: redis://localhost:6379
      FILE_SIGNING_SECRET: ci-only-test-signing-secret-0123456789abcdef
      FILE_STORAGE_DIR: /tmp/ci-file-storage
      FILE_STORAGE_DRIVER: local
      AI_PROVIDER: mock
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      SMS_PROVIDER: log
      TERMINAL_ADMIN_SECRET: ci-only-terminal-admin-secret
      TERMINAL_ACTION_TOKEN_SECRET: ci-only-terminal-action-secret
      TERMINAL_LEGACY_REGISTER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install CJK font + sqlite3 + redis-server (PDF / member data verify)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk sqlite3 redis-server
      - name: PG schema drift check
        working-directory: services/api
        run: pnpm db:pg:sync:check
      - name: Recruitment P1 isolated PostgreSQL upgrade gate
        working-directory: services/api
        env:
          PGPASSWORD: ci
          POSTGRES_UPGRADE_URL: postgresql://ci:ci@localhost:5432/ai_job_print_upgrade_ci
        run: |
          createdb -h localhost -U ci ai_job_print_upgrade_ci
          pnpm verify:recruitment-p1-schema:postgres-upgrade
      - name: Generate clients (SQLite types + PG runtime)
        working-directory: services/api
        # create-client.ts 静态 import SQLite client(类型统一);两套产物都需生成
        run: |
          npx prisma generate
          pnpm db:pg:generate
      - name: Migrate deploy on fresh PG
        working-directory: services/api
        run: pnpm db:pg:deploy
      - name: Recruitment Wave 2 isolated PostgreSQL read-only planner
        working-directory: services/api
        env:
          PGPASSWORD: ci
        run: bash scripts/verify-recruitment-wave2-postgres-ci.sh
      - name: Recruitment P1 fresh PostgreSQL drift gate
        working-directory: services/api
        run: >-
          npx prisma migrate diff --config prisma.postgres.config.ts
          --from-config-datasource --to-schema prisma/postgres/schema.prisma --exit-code
      - name: Recruitment P1 read-only preflight on fresh PG
        working-directory: services/api
        run: pnpm verify:recruitment-p1-preflight
      - name: Verify first admin bootstrap concurrency on isolated PG
        working-directory: services/api
        env:
          NODE_ENV: test
          FIRST_ADMIN_BOOTSTRAP_VERIFY_TARGET: isolated
        run: pnpm verify:first-admin-bootstrap:postgres
      - name: Seed on PG
        working-directory: services/api
        env:
          NODE_ENV: test
          DEMO_SEED_CONFIRM: I_UNDERSTAND_DEMO_DATA_WILL_BE_WRITTEN
        run: |
          node -r @swc-node/register prisma/seed.ts
          node -r @swc-node/register prisma/seed-fairs.ts
      - name: Core verify suites on PG
        run: |
          # 与 SQLite job 同源的静态门禁：P39 迁移保真不依赖数据库形态，
          # 但它守的是「生产页不得从 V6 原型漂走」，两个 job 都必须挡住。
          pnpm --filter @ai-job-print/kiosk verify:p39-print-hub-fidelity
          pnpm --filter @ai-job-print/api verify:contract-review:schema
          pnpm --filter @ai-job-print/api verify:jobfair-venue-guide
          pnpm --filter @ai-job-print/api verify:admin-fairs
          pnpm --filter @ai-job-print/api verify:resume-layout-export
          pnpm --filter @ai-job-print/api verify:resume-layout-adjust
          pnpm --filter @ai-job-print/api verify:resume-template-fill
          pnpm --filter @ai-job-print/api verify:resume-optimize
          pnpm --filter @ai-job-print/api verify:job-fit
          pnpm --filter @ai-job-print/api verify:career-plan
          pnpm --filter @ai-job-print/api verify:advisor-work
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:career-plan-degraded
          pnpm --filter @ai-job-print/api verify:ai-cost-coverage
          # 简历链 PII 遮盖门禁此前只挂在 SQLite job；它现在含派生清单与还原往返断言，
          # 两个 job 都要跑（PG job 的 Prisma 客户端形态不同，回归面不完全重合）。
          pnpm --filter @ai-job-print/api verify:llm-input-pii-mask
          pnpm --filter @ai-job-print/api verify:activity-logs
          pnpm --filter @ai-job-print/api verify:ai-user-text-retention
          pnpm --filter @ai-job-print/api verify:policies
          pnpm --filter @ai-job-print/api verify:policy-eligibility
          pnpm --filter @ai-job-print/api verify:companies
          pnpm --filter @ai-job-print/api verify:offline-agencies-page
          pnpm --filter @ai-job-print/api verify:backend-p0-contracts
          pnpm --filter @ai-job-print/api verify:offline-agencies-contract
          pnpm --filter @ai-job-print/api verify:partner-source-capabilities
          pnpm --filter @ai-job-print/api verify:backend-p0-http
          RECRUITMENT_CONTENT_VERIFY_TARGET=isolated pnpm --filter @ai-job-print/api verify:recruitment-content-http
          pnpm --filter @ai-job-print/api verify:job-sync
          pnpm --filter @ai-job-print/api verify:job-requirement-stats
          pnpm --filter @ai-job-print/api verify:mock-interview
          pnpm --filter @ai-job-print/api verify:member-account-status
          pnpm --filter @ai-job-print/api verify:member-auth
          pnpm --filter @ai-job-print/api verify:legal-doc-version
          pnpm --filter @ai-job-print/api verify:member-qr-login
          pnpm --filter @ai-job-print/api verify:member-step-up
          pnpm --filter @ai-job-print/api verify:member-assets-c2d
          pnpm --filter @ai-job-print/api verify:member-data-request-contract
          pnpm --filter @ai-job-print/api verify:member-data-request-state-machine
          pnpm --filter @ai-job-print/api verify:member-data-request-truth
          pnpm --filter @ai-job-print/api verify:member-data-export-files
          pnpm --filter @ai-job-print/api verify:member-data-export
          pnpm --filter @ai-job-print/api verify:member-data-export-download
          # 启动韧性（PG 侧同样跑一遍：硬依赖=数据库、软依赖=Redis 的启动语义
          # 必须在 PostgreSQL 上也成立）。会拉起真实 src/main.ts 与临时 redis-server。
          pnpm --filter @ai-job-print/api verify:boot-resilience
          # 三道门禁在 PG 侧同样跑一遍：鉴权回源真源、异常日志、订单筛选
          # 都直接依赖数据库行为，SQLite 通过不等于 PostgreSQL 通过。
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:redis-degradation-truth
          pnpm --filter @ai-job-print/api verify:error-observability
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:admin-order-filters
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:print-jobs
          pnpm --filter @ai-job-print/api verify:terminal-bind-code
          pnpm --filter @ai-job-print/api verify:terminal-credentials
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:scan-deletion-audit-reporting
          pnpm --filter @ai-job-print/api verify:terminal-provisioning
          pnpm --filter @ai-job-print/api verify:terminal-test-print-seed-guard
          pnpm --filter @ai-job-print/api verify:scan-tasks
          pnpm --filter @ai-job-print/api verify:print-conversion
          pnpm --filter @ai-job-print/api verify:print-sign
          pnpm --filter @ai-job-print/api verify:admin-print-scan
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:order
          pnpm --filter @ai-job-print/api verify:pricing
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:member-print-orders
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:kiosk-anonymous-feedback
          pnpm --filter @ai-job-print/api verify:materials-processing
          pnpm --filter @ai-job-print/api verify:job-materials
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:payment-flow
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:payment-real-channels
          pnpm --filter @ai-job-print/api verify:payment-codepay
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:kiosk-cashier-ui
          pnpm --filter @ai-job-print/api verify:refund-idempotent
          VERIFICATION_DATABASE_TARGET=isolated pnpm --filter @ai-job-print/api verify:refund-real-channels
          pnpm --filter @ai-job-print/api verify:wechat-refund-notify
          pnpm --filter @ai-job-print/api verify:wechat-refund-regression
          pnpm --filter @ai-job-print/api verify:redemption-audit
          pnpm --filter @ai-job-print/api verify:admin-billing
          pnpm --filter @ai-job-print/api verify:reconciliation
          pnpm --filter @ai-job-print/api verify:refund-convergence
          pnpm --filter @ai-job-print/api verify:admin-orders-refund
          pnpm --filter @ai-job-print/api verify:http-exception-filter
          pnpm --filter @ai-job-print/api verify:kiosk-upload-print-contract
          pnpm --filter @ai-job-print/api verify:print-rollout-config
          pnpm --filter @ai-job-print/api verify:job-review
          pnpm --filter @ai-job-print/api verify:audit-logs
          pnpm --filter @ai-job-print/api verify:partner-account-action:postgres
          pnpm --filter @ai-job-print/api verify:upload-sessions
          pnpm --filter @ai-job-print/api verify:cos:files

  kiosk-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @ai-job-print/kiosk exec playwright install --with-deps chromium

      - name: Typecheck Kiosk workspace-source dependencies
        run: |
          pnpm --filter @ai-job-print/shared typecheck
          pnpm --filter @ai-job-print/ui typecheck

      - name: Verify Kiosk fusion static contracts
        run: |
          pnpm --filter @ai-job-print/ui verify:fusion-youth-foundation
          pnpm --filter @ai-job-print/kiosk verify:scan-input-safety
          pnpm --filter @ai-job-print/kiosk verify:fusion-shell
          pnpm --filter @ai-job-print/kiosk verify:fusion-home
          pnpm --filter @ai-job-print/kiosk verify:fusion-w2
          pnpm --filter @ai-job-print/kiosk verify:fusion-w3
          pnpm --filter @ai-job-print/kiosk verify:fusion-w4
          pnpm --filter @ai-job-print/kiosk verify:fusion-w5
          pnpm --filter @ai-job-print/kiosk verify:fusion-w6

      - name: Run Kiosk fusion contract tests with coverage gates
        run: |
          node --experimental-test-coverage --test \
            --test-coverage-lines=80 \
            --test-coverage-functions=80 \
            --test-coverage-branches=80 \
            apps/kiosk/scripts/tests/fusion-baseline-contract.test.mjs

      - name: Verify Kiosk fusion baseline
        run: pnpm --filter @ai-job-print/kiosk verify:fusion-baseline

      - name: Run Kiosk browser smoke
        run: |
          pnpm --filter @ai-job-print/kiosk test:browser:smoke
          pnpm --filter @ai-job-print/kiosk test:browser:w1
          pnpm --filter @ai-job-print/kiosk test:browser:w2
          pnpm --filter @ai-job-print/kiosk test:browser:w3
          pnpm --filter @ai-job-print/kiosk test:browser:w4
          pnpm --filter @ai-job-print/kiosk test:browser:w5
          pnpm --filter @ai-job-print/kiosk test:browser:w6
          pnpm --filter @ai-job-print/kiosk test:browser:privacy
          pnpm --filter @ai-job-print/kiosk test:browser:warning
          pnpm --filter @ai-job-print/kiosk test:browser:contract-review
          pnpm --filter @ai-job-print/kiosk test:browser:scan-safety

      - name: Upload Kiosk browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-smoke-failure
          path: |
            test-results/kiosk-fusion/**
            test-results/kiosk-fusion-report/**
            test-results/kiosk-fusion-w1/**
            test-results/kiosk-fusion-w1-report/**
            test-results/kiosk-fusion-w2/**
            test-results/kiosk-fusion-w2-report/**
            test-results/kiosk-fusion-w3/**
            test-results/kiosk-fusion-w3-report/**
            test-results/kiosk-fusion-w4/**
            test-results/kiosk-fusion-w4-report/**
            test-results/kiosk-fusion-w5/**
            test-results/kiosk-fusion-w5-report/**
            test-results/kiosk-fusion-w6/**
            test-results/kiosk-fusion-w6-report/**
            test-results/kiosk-privacy-timeout/**
            test-results/kiosk-session-warning/**
            test-results/kiosk-scan-safety/**
          if-no-files-found: ignore
          retention-days: 7
