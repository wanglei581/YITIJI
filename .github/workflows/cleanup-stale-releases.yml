name: Cleanup Stale Releases (guarded)

permissions: {}

concurrency:
  group: production-maintenance
  cancel-in-progress: false

# 清理 /srv 下 7 月手动部署时代遗留的历史发布目录（约 6.3GB，保守白名单）。
# 双模式：dry-run（只列清单，纯只读）/ execute（需 confirm，且只 mv 到隔离区不真删）。
# 白名单与护栏由 DeepSeek + antigravity 两份独立审查合成。
# 脚本正文以 base64 内联（ssh-action 远端无 repo 文件），源文件见
# .github/scripts/cleanup-stale-releases.sh —— 二者必须一致，改脚本后需重新生成本 base64。

on:
  workflow_dispatch:
    inputs:
      execute:
        description: '取消勾选=dry-run（只列清单）；勾选=execute（隔离到 trash，需下方 confirm）'
        type: boolean
        default: false
      purge_trash_path:
        description: '真删隔离区（不可逆，会释放空间）。填 /srv/.cleanup-trash/<时间戳>，留空则不删'
        type: string
        default: ''
      confirm:
        description: 'execute 或 purge 时必须输入：CLEANUP-CONFIRM'
        type: string
        default: ''

jobs:
  cleanup:
    name: Guarded cleanup of stale /srv release dirs
    runs-on: ubuntu-latest
    steps:
      - name: Run guarded cleanup via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          CLEANUP_REQUEST_EXECUTE: ${{ inputs.execute }}
          CLEANUP_REQUEST_CONFIRM: ${{ inputs.confirm }}
          CLEANUP_REQUEST_PURGE_PATH: ${{ inputs.purge_trash_path }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 20m
          envs: CLEANUP_REQUEST_EXECUTE,CLEANUP_REQUEST_CONFIRM,CLEANUP_REQUEST_PURGE_PATH
          script: |
            set -euo pipefail
            command -v flock >/dev/null 2>&1 || { echo "::error::flock is required"; exit 1; }
            exec 9>/var/lock/ai-job-print-production-maintenance.lock
            flock -n 9 || { echo "::error::another production maintenance operation is active"; exit 1; }
            case "$CLEANUP_REQUEST_EXECUTE" in
              true | false) ;;
              *) echo "::error::execute must be true or false"; exit 1 ;;
            esac
            CLEANUP_PURGE_PATH="$CLEANUP_REQUEST_PURGE_PATH"
            if [ -n "$CLEANUP_PURGE_PATH" ]; then
              CLEANUP_MODE=purge-trash
            else
              CLEANUP_MODE="$([ "$CLEANUP_REQUEST_EXECUTE" = "true" ] && echo execute || echo dry-run)"
            fi
            CLEANUP_CONFIRM="$CLEANUP_REQUEST_CONFIRM"
            CLEANUP_EXPECT_CONFIRM="CLEANUP-CONFIRM"
            export CLEANUP_MODE CLEANUP_CONFIRM CLEANUP_EXPECT_CONFIRM CLEANUP_PURGE_PATH
            TMP="$(mktemp)"
            base64 -d > "$TMP" <<'B64'
