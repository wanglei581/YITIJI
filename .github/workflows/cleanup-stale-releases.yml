name: Cleanup Stale Releases (guarded)

# 清理 /srv 下白名单内的历史发布目录，以及只读盘点核对过的 5 个残留目录。
# dry-run 只列清单，并按可用空间预告将隔离或将直接删除。
# execute 需要确认词，且服务健康检查通过。可用低于 STALE_CRITICAL_FREE_MB（默认 5120MB）时，
# 直接删除通过全部护栏的目录；否则先 mv 到隔离区。被 pm2 或 nginx 引用的目录只跳过该目录。
# 白名单与护栏由 DeepSeek + antigravity 两份独立审查合成，2026-09-29 补充告急分支。
# 脚本正文是 .github/scripts/cleanup-stale-releases.sh，由 Runner 读取后送到远端，不再把脚本嵌进工作流。
# 工作流输入只进入本步骤的 env，脚本只读环境变量。
# 与 deploy.yml 共用 production-deploy 并发组，避免清理和发布同时改 /srv。

on:
  workflow_dispatch:
    inputs:
      execute:
        description: '取消勾选=dry-run（只列清单，并预告将隔离或将直接删除）。勾选=execute：确认词正确且健康检查通过后，可用低于 STALE_CRITICAL_FREE_MB（默认 5120MB）则直接删除通过全部护栏的目录，否则移到隔离区。'
        type: boolean
        default: false
      purge_trash_path:
        description: '真删隔离区（不可逆，会释放空间）。填 /srv/.cleanup-trash/<时间戳>，留空则不删'
        type: string
        default: ''
      confirm:
        description: 'execute 或 purge 时必须输入：CLEANUP-CONFIRM'
        type: string
        default: ''

# 与 deploy.yml 同一组。进行中的发布或清理不取消。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    name: Guarded cleanup of stale /srv release dirs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v4

      - name: Run guarded cleanup via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          CLEANUP_EXECUTE: ${{ inputs.execute }}
          CLEANUP_PURGE_PATH: ${{ inputs.purge_trash_path }}
          CLEANUP_CONFIRM: ${{ inputs.confirm }}
          CLEANUP_EXPECT_CONFIRM: CLEANUP-CONFIRM
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 20m
          envs: CLEANUP_EXECUTE,CLEANUP_PURGE_PATH,CLEANUP_CONFIRM,CLEANUP_EXPECT_CONFIRM
          script_path: .github/scripts/cleanup-stale-releases.sh
