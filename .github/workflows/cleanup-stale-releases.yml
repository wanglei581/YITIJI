name: Cleanup Stale Releases (guarded)

# 清理 /srv 下 7 月手动部署时代遗留的历史发布目录（约 6.3GB，保守白名单）。
# 双模式：dry-run（只列清单，纯只读）/ execute（需 confirm，且只 mv 到隔离区不真删）。
# 白名单与护栏由 DeepSeek + antigravity 两份独立审查合成。
# 脚本正文以 base64 内联（ssh-action 远端无 repo 文件），源文件见
# .github/scripts/cleanup-stale-releases.sh —— 二者必须一致，改脚本后需重新生成本 base64。

on:
  workflow_dispatch:
    inputs:
      execute:
        description: '取消勾选=dry-run（只列清单）；勾选=execute（隔离到 trash，需下方 confirm）'
        type: boolean
        default: false
      confirm:
        description: 'execute 时必须输入：CLEANUP-CONFIRM'
        type: string
        default: ''

jobs:
  cleanup:
    name: Guarded cleanup of stale /srv release dirs
    runs-on: ubuntu-latest
    steps:
      - name: Run guarded cleanup via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 20m
          envs: CLEANUP_MODE,CLEANUP_CONFIRM,CLEANUP_EXPECT_CONFIRM,CLEANUP_B64
          script: |
            set -uo pipefail
            CLEANUP_MODE="$([ "${{ inputs.execute }}" = "true" ] && echo execute || echo dry-run)"
            CLEANUP_CONFIRM="${{ inputs.confirm }}"
            CLEANUP_EXPECT_CONFIRM="CLEANUP-CONFIRM"
            export CLEANUP_MODE CLEANUP_CONFIRM CLEANUP_EXPECT_CONFIRM
            TMP="$(mktemp)"
