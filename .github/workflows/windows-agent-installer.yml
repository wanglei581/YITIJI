name: windows-agent-installer

on:
  pull_request:
    paths:
      - "apps/terminal-agent/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-agent-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-msi-candidate:
    needs: [unsigned-exe-upgrade, internal-signing-validation]
    if: ${{ always() }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Require isolated upgrade lifecycle
        shell: pwsh
        run: |
          if ("${{ needs.unsigned-exe-upgrade.result }}" -ne "success") {
            throw "Isolated EXE upgrade lifecycle did not pass"
          }
          if ("${{ needs.internal-signing-validation.result }}" -ne "success") {
            throw "Internal signing validation did not pass"
          }

      - uses: actions/checkout@v4
        with:
          # Installer provenance must identify the exact reviewed PR head, not GitHub's ephemeral merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Verify installer source contract
        shell: pwsh
        run: |
          node apps/terminal-agent/installer/verify-installer-inputs.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/terminal-agent/installer/verify-signing-workflow-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download exact upgrade-tested candidate
        uses: actions/download-artifact@v4
        with:
          name: terminal-agent-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/terminal-agent/installer/artifacts/candidate

      - name: Verify downloaded candidate identity before install
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15"

      - name: Exercise EXE install, repair, and uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-lifecycle.ps1 `
            -ExePath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe

      - name: Collect fresh EXE lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Exercise MSI install, repair, and uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-msi-lifecycle.ps1 `
            -MsiPath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi

      - name: Collect fresh MSI lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Verify candidate identity after fresh lifecycles
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15"

      - name: Upload exact tested unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-installer-candidates
          path: |
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/candidate/staging-manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs/
            apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload fresh lifecycle evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-installer-failure-evidence
          path: |
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs/
            apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs/
          if-no-files-found: warn
          retention-days: 7

  unsigned-exe-upgrade:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact field 0.4.10 predecessor source
        uses: actions/checkout@v4
        with:
          ref: 75e0711561f74eed0e76ed956e4b1b5fcd2c54d4
          path: predecessor-0.4.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Verify installer source contract
        shell: pwsh
        run: |
          node apps/terminal-agent/installer/verify-installer-inputs.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/terminal-agent/installer/verify-signing-workflow-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Must run before the installer build: build-staging deploys the Agent with --prod,
      # after which the workspace no longer resolves ts-node (2026-09-29 CI run 36444923206).
      - name: Verify process lifetime singleton
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter ./apps/terminal-agent verify:singleton-process
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same pre-staging window: ts-node is gone after build-staging --prod.
      - name: Verify idle print queue hold and leftover jobs
        shell: pwsh
        run: |
          pnpm --filter ./apps/terminal-agent verify:print-queue-residue-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same pre-staging window. Stops Spooler on this runner and restores Automatic + Running.
      - name: Verify boot spool guard and daily reboot dry-run
        shell: pwsh
        run: |
          pnpm --filter ./apps/terminal-agent verify:boot-spool-guard-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same pre-staging window. Junction case uses New-Item -ItemType Junction.
      - name: Verify known legacy residue cleanup
        shell: pwsh
        run: |
          pnpm --filter ./apps/terminal-agent verify:legacy-residue-cleanup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build candidate upgrade fixture
        shell: powershell
        run: |
          & apps/terminal-agent/installer/build-staging.ps1
          & apps/terminal-agent/installer/build-msi.ps1
          & apps/terminal-agent/installer/build-exe.ps1

      - name: Verify Windows PrintService completion correlation
        shell: powershell
        working-directory: apps/terminal-agent
        run: node installer/verify-printservice-completion.mjs

      - name: Parse staged provisioning scripts with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/verify-staged-powershell.ps1 -StagingRoot apps/terminal-agent/installer/artifacts/staging

      - name: Verify staged secure scan reader boundary
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/verify-secure-scan-reader.ps1 -InstallRoot apps/terminal-agent/installer/artifacts/staging

      # Field scripts run straight from the repo, outside the installer payload: the staged-script parse
      # above never sees them. Check UTF-8 BOM and Windows PowerShell 5.1 syntax for both, and run the
      # field-day evidence script once read-only against a throwaway ProgramData (the real one must stay
      # empty for the upgrade lifecycle below) with a valid instance-id, so the pipe listing actually runs.
      - name: Parse and smoke-run field scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @("apps/terminal-agent/scripts/diagnose-production-agent.ps1", "apps/terminal-agent/scripts/collect-field-day-evidence.ps1")) {
            $full = (Resolve-Path -LiteralPath $path).Path
            $bytes = [System.IO.File]::ReadAllBytes($full)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { Write-Host "${path}: not UTF-8 with BOM"; $failed = $true }
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
            foreach ($parseError in $errors) { Write-Host "${path}: line $($parseError.Extent.StartLineNumber): $($parseError.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          $fakeProgramData = Join-Path $env:RUNNER_TEMP "field-day-programdata"
          New-Item -ItemType Directory -Path (Join-Path $fakeProgramData "AIJobPrintAgent") -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $fakeProgramData "AIJobPrintAgent\instance-id"), "0123456789abcdef0123456789abcdef`n")
          $receipt = Join-Path $env:RUNNER_TEMP "field-day-evidence.md"
          $env:ProgramData = $fakeProgramData
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/scripts/collect-field-day-evidence.ps1 -OutFile $receipt
          if ($LASTEXITCODE -ne 0) { Write-Host "field-day evidence exited $LASTEXITCODE"; exit 1 }
          $text = [System.IO.File]::ReadAllText($receipt)
          Write-Host $text
          foreach ($id in @("D1-1", "D1-2", "D1-3", "D1-4", "D1-5", "D1-6", "D1-7", "D2-0", "D2-1", "D2-2", "D2-3", "D2-4", "D2-5", "D2-6")) {
            if ($text -notmatch ("\| " + [regex]::Escape($id) + " ")) { Write-Host "missing row $id"; $failed = $true }
          }
          if ($text -match "ERROR:") { Write-Host "a check threw on the runner"; $failed = $true }
          if ($text -notmatch "instanceId=valid singletonPipePresent=False") { Write-Host "pipe listing did not run against the valid instance-id"; $failed = $true }
          if ($failed) { exit 1 }

      - name: Freeze candidate identity
        shell: powershell
        run: |
          $candidateRoot = "apps/terminal-agent/installer/artifacts/candidate"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          $msi = @(Get-ChildItem apps/terminal-agent/installer/artifacts/msi -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "Expected exactly one candidate MSI, found $($msi.Count)" }
          Copy-Item -LiteralPath $msi[0].FullName -Destination "$candidateRoot/AIJobPrintAgent.msi"
          Copy-Item -LiteralPath apps/terminal-agent/installer/artifacts/exe/AIJobPrintTerminalSetup.exe -Destination "$candidateRoot/AIJobPrintTerminalSetup.exe"
          Copy-Item -LiteralPath apps/terminal-agent/installer/artifacts/staging/manifest.json -Destination "$candidateRoot/staging-manifest.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Create `
            -CandidateRoot $candidateRoot `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15"

      - name: Build exact field predecessor 0.4.10 upgrade fixture
        shell: powershell
        run: |
          & predecessor-0.4.10/apps/terminal-agent/installer/build-staging.ps1
          & predecessor-0.4.10/apps/terminal-agent/installer/build-msi.ps1
          & predecessor-0.4.10/apps/terminal-agent/installer/build-exe.ps1

      - name: Exercise EXE predecessor-to-candidate upgrade
        shell: powershell
        run: |
          $predecessor = Get-ChildItem predecessor-0.4.10/apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-upgrade-lifecycle.ps1 `
            -PredecessorExePath $predecessor.FullName `
            -CandidateExePath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe

      - name: Collect upgrade lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/upgrade-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Verify candidate identity after upgrade lifecycle
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15"

      - name: Transfer exact upgrade-tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/candidate/staging-manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-upgrade-evidence
          path: |
            apps/terminal-agent/installer/artifacts/evidence/upgrade-lifecycle-logs/
            predecessor-0.4.10/apps/terminal-agent/installer/artifacts/staging/manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
          if-no-files-found: warn
          retention-days: 7

  internal-signing-validation:
    name: Internal signing validation (NOT FOR DEPLOYMENT)
    needs: unsigned-exe-upgrade
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify signing workflow contract
        shell: pwsh
        run: node apps/terminal-agent/installer/verify-signing-workflow-contract.mjs

      - name: Install exact WiX CLI used for Burn signing operations
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6

      - name: Download exact upgrade-tested unsigned candidate
        uses: actions/download-artifact@v4
        with:
          name: terminal-agent-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/terminal-agent/installer/artifacts/candidate

      - name: Re-verify unsigned candidate identity
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15"

      - name: Exercise internal signing pipeline and signed installer lifecycles
        shell: powershell
        run: |
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-internal-signing-pipeline.ps1 `
            -UnsignedCandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.15" `
            -EvidenceRoot "$env:RUNNER_TEMP\ai-job-print-internal-signing-evidence" `
            -WixToolPath $wix `
            -ExerciseLifecycle `
            -UseEphemeralGitHubHostedLocalMachineTrust

      - name: Ensure internal test trust and private certificates are removed
        if: always()
        shell: powershell
        run: |
          $metadataPath = "$env:RUNNER_TEMP\ai-job-print-internal-signing-evidence\certificates\internal-signing-certificate.json"
          $ownershipPath = "$env:RUNNER_TEMP\ai-job-print-internal-signing-evidence\run-ownership.marker"
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            Write-Host "INTERNAL_SIGNING_WORKFLOW_CLEANUP_SKIPPED reason=no-metadata"
            exit 0
          }
          $metadata = Get-Content -Raw -Encoding UTF8 -LiteralPath $metadataPath | ConvertFrom-Json
          $rootThumbprint = [string]$metadata.root.thumbprint
          $signerThumbprint = [string]$metadata.signer.thumbprint
          if ($rootThumbprint -notmatch '^[0-9A-Fa-f]{40}$' -or $signerThumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "INTERNAL_SIGNING_WORKFLOW_CLEANUP_FAILED: metadata thumbprints are invalid."
          }
          $trustCleanup = "skipped-no-ownership"
          if (Test-Path -LiteralPath $ownershipPath -PathType Leaf) {
            $trustCleanup = "removed"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/remove-internal-code-signing-trust.ps1 `
            -RootThumbprint $rootThumbprint `
            -SignerThumbprint $signerThumbprint `
            -StoreScope LocalMachine `
            -PrivateKeyStoreScope CurrentUser `
            -RemovePrivateCertificates `
            -AcknowledgeEphemeralNonProductionHost `
            -RunOwnershipMarkerPath "$ownershipPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "INTERNAL_SIGNING_WORKFLOW_CLEANUP_PASS trustCleanup=$trustCleanup privateKeyScope=CurrentUser"

      - name: Upload complete internal signing evidence only (NOT FOR DEPLOYMENT)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-internal-signing-test-evidence-NOT-FOR-DEPLOYMENT
          path: |
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/staging-manifest.json
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/unsigned-candidate-identity.json
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/signed-release-identity.json
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/signed-release-identity.p7s
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-exe-lifecycle-logs/
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-msi-lifecycle-logs/
          if-no-files-found: error
          retention-days: 3

      - name: Upload partial internal signing failure evidence (NOT FOR DEPLOYMENT)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-internal-signing-failure-evidence-NOT-FOR-DEPLOYMENT
          path: |
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/signed-release-identity.json
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-release-NOT-FOR-DEPLOYMENT/signed-release-identity.p7s
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-exe-lifecycle-logs/
            ${{ runner.temp }}/ai-job-print-internal-signing-evidence/signed-msi-lifecycle-logs/
          if-no-files-found: warn
          retention-days: 3
