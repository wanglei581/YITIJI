name: windows-agent-installer

on:
  pull_request:
    paths:
      - "apps/terminal-agent/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-agent-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-msi-candidate:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Verify installer source contract
        shell: pwsh
        run: node apps/terminal-agent/installer/verify-installer-inputs.mjs

      - name: Build reproducible staging
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-staging.ps1

      - name: Validate staged Provisioner PowerShell
        shell: powershell
        run: |
          $provisionerRoot = "apps/terminal-agent/installer/artifacts/staging/provisioner"
          $expected = @(
            "provision-agent-gui.ps1",
            "install-production-agent.ps1",
            "service-identity.ps1",
            "diagnose-production-agent.ps1"
          )
          foreach ($name in $expected) {
            $path = Join-Path $provisionerRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Staged Provisioner file is missing: $path"
            }
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$parseTokens,
              [ref]$parseErrors
            )
            if (@($parseErrors).Count -gt 0) {
              throw "PowerShell parse failed for ${path}: $($parseErrors -join '; ')"
            }
          }

      - name: Exercise PowerShell origin collection regression
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-provisioning-origin-collection.ps1

      - name: Build unsigned WiX MSI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-msi.ps1

      - name: Build unsigned WiX Burn EXE
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-exe.ps1

      - name: Check out the fixed 0.3.7 upgrade baseline
        uses: actions/checkout@v4
        with:
          ref: 82186e2320caaeed6b9515c3856b2df585d52bff
          path: previous-0.3.7

      - name: Build the fixed 0.3.7 upgrade baseline
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File previous-0.3.7/apps/terminal-agent/installer/build-staging.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File previous-0.3.7/apps/terminal-agent/installer/build-msi.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File previous-0.3.7/apps/terminal-agent/installer/build-exe.ps1

      - name: Exercise 0.3.7 to 0.3.8 EXE upgrade
        shell: powershell
        run: |
          $previousExe = Get-ChildItem previous-0.3.7/apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          $currentExe = Get-ChildItem apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-upgrade.ps1 -PreviousExePath $previousExe.FullName -CurrentExePath $currentExe.FullName

      - name: Exercise EXE install, repair, and uninstall
        shell: powershell
        run: |
          $exe = Get-ChildItem apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-lifecycle.ps1 -ExePath $exe.FullName

      - name: Exercise MSI install, repair, and uninstall
        shell: powershell
        run: |
          $msi = Get-ChildItem apps/terminal-agent/installer/artifacts/msi -Filter *.msi | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-msi-lifecycle.ps1 -MsiPath $msi.FullName

      - name: Upload unsigned test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-installer-candidates
          path: |
            apps/terminal-agent/installer/artifacts/msi/*.msi
            apps/terminal-agent/installer/artifacts/msi/lifecycle-logs/
            apps/terminal-agent/installer/artifacts/exe/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/exe/lifecycle-logs/
            apps/terminal-agent/installer/artifacts/exe/upgrade-logs/
            apps/terminal-agent/installer/artifacts/staging/manifest.json
          if-no-files-found: warn
          retention-days: 7
