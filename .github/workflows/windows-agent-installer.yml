name: windows-agent-installer

on:
  pull_request:
    paths:
      - "apps/terminal-agent/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-agent-installer.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  unsigned-msi-candidate:
    needs: unsigned-exe-upgrade
    if: ${{ always() }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Require isolated upgrade lifecycle
        shell: pwsh
        run: |
          if ("${{ needs.unsigned-exe-upgrade.result }}" -ne "success") {
            throw "Isolated EXE upgrade lifecycle did not pass"
          }

      - uses: actions/checkout@v4
        with:
          # Installer provenance must identify the exact reviewed PR head, not GitHub's ephemeral merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Verify installer source contract
        shell: pwsh
        run: node apps/terminal-agent/installer/verify-installer-inputs.mjs

      - name: Download exact upgrade-tested candidate
        uses: actions/download-artifact@v4
        with:
          name: terminal-agent-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/terminal-agent/installer/artifacts/candidate

      - name: Verify downloaded candidate identity before install
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.11"

      - name: Exercise EXE install, repair, and uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-lifecycle.ps1 `
            -ExePath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe

      - name: Collect fresh EXE lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Exercise MSI install, repair, and uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-msi-lifecycle.ps1 `
            -MsiPath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi

      - name: Collect fresh MSI lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Verify candidate identity after fresh lifecycles
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.11"

      - name: Upload exact tested unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-installer-candidates
          path: |
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/candidate/staging-manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs/
            apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload fresh lifecycle evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-installer-failure-evidence
          path: |
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/evidence/fresh-exe-lifecycle-logs/
            apps/terminal-agent/installer/artifacts/evidence/fresh-msi-lifecycle-logs/
          if-no-files-found: warn
          retention-days: 7

  unsigned-exe-upgrade:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact field 0.4.10 predecessor source
        uses: actions/checkout@v4
        with:
          ref: 75e0711561f74eed0e76ed956e4b1b5fcd2c54d4
          path: predecessor-0.4.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Verify installer source contract
        shell: pwsh
        run: node apps/terminal-agent/installer/verify-installer-inputs.mjs

      - name: Build candidate upgrade fixture
        shell: powershell
        run: |
          & apps/terminal-agent/installer/build-staging.ps1
          & apps/terminal-agent/installer/build-msi.ps1
          & apps/terminal-agent/installer/build-exe.ps1

      - name: Verify Windows PrintService completion correlation
        shell: powershell
        working-directory: apps/terminal-agent
        run: node installer/verify-printservice-completion.mjs

      - name: Parse staged provisioning scripts with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/verify-staged-powershell.ps1 -StagingRoot apps/terminal-agent/installer/artifacts/staging

      - name: Verify staged secure scan reader boundary
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/verify-secure-scan-reader.ps1 -InstallRoot apps/terminal-agent/installer/artifacts/staging

      - name: Freeze candidate identity
        shell: powershell
        run: |
          $candidateRoot = "apps/terminal-agent/installer/artifacts/candidate"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          $msi = @(Get-ChildItem apps/terminal-agent/installer/artifacts/msi -Filter *.msi -File)
          if ($msi.Count -ne 1) { throw "Expected exactly one candidate MSI, found $($msi.Count)" }
          Copy-Item -LiteralPath $msi[0].FullName -Destination "$candidateRoot/AIJobPrintAgent.msi"
          Copy-Item -LiteralPath apps/terminal-agent/installer/artifacts/exe/AIJobPrintTerminalSetup.exe -Destination "$candidateRoot/AIJobPrintTerminalSetup.exe"
          Copy-Item -LiteralPath apps/terminal-agent/installer/artifacts/staging/manifest.json -Destination "$candidateRoot/staging-manifest.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Create `
            -CandidateRoot $candidateRoot `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.11"

      - name: Build exact field predecessor 0.4.10 upgrade fixture
        shell: powershell
        run: |
          & predecessor-0.4.10/apps/terminal-agent/installer/build-staging.ps1
          & predecessor-0.4.10/apps/terminal-agent/installer/build-msi.ps1
          & predecessor-0.4.10/apps/terminal-agent/installer/build-exe.ps1

      - name: Exercise EXE predecessor-to-candidate upgrade
        shell: powershell
        run: |
          $predecessor = Get-ChildItem predecessor-0.4.10/apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-upgrade-lifecycle.ps1 `
            -PredecessorExePath $predecessor.FullName `
            -CandidateExePath apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe

      - name: Collect upgrade lifecycle evidence
        if: always()
        shell: powershell
        run: |
          $source = "apps/terminal-agent/installer/artifacts/candidate/lifecycle-logs"
          $destination = "apps/terminal-agent/installer/artifacts/evidence/upgrade-lifecycle-logs"
          if (Test-Path -LiteralPath $source -PathType Container) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Move-Item -LiteralPath $source -Destination $destination
          }

      - name: Verify candidate identity after upgrade lifecycle
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/candidate `
            -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}" `
            -ProductVersion "0.4.11"

      - name: Transfer exact upgrade-tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintAgent.msi
            apps/terminal-agent/installer/artifacts/candidate/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/candidate/staging-manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-unsigned-upgrade-evidence
          path: |
            apps/terminal-agent/installer/artifacts/evidence/upgrade-lifecycle-logs/
            predecessor-0.4.10/apps/terminal-agent/installer/artifacts/staging/manifest.json
            apps/terminal-agent/installer/artifacts/candidate/candidate-identity.json
          if-no-files-found: warn
          retention-days: 7

  exact-field-same-version-transition:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout transition verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download frozen field predecessor candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33376026528
          name: terminal-agent-unsigned-installer-candidates
          path: apps/terminal-agent/installer/artifacts/exact-predecessor

      - name: Download frozen exact-SHA candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33876577638
          name: terminal-agent-unsigned-installer-candidates
          path: apps/terminal-agent/installer/artifacts/exact-candidate

      - name: Verify frozen candidate identity
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/exact-candidate/candidate `
            -SourceCommit "1d7468cda2cd2c8d6495d3e6df7fa23431812139" `
            -ProductVersion "0.4.11"

      - name: Verify frozen field predecessor identity
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/exact-predecessor/candidate `
            -SourceCommit "7ffc10ed84f67f2bd3b008d54aee9d7cda056f5e" `
            -ProductVersion "0.4.11"

      - name: Prove pre-launch candidate failure restores predecessor
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-same-version-transition.ps1 `
            -PredecessorExePath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/AIJobPrintTerminalSetup.exe `
            -PredecessorMsiPath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/AIJobPrintAgent.msi `
            -PredecessorManifestPath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/staging-manifest.json `
            -CandidateExePath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/AIJobPrintTerminalSetup.exe `
            -CandidateMsiPath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/AIJobPrintAgent.msi `
            -CandidateManifestPath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/staging-manifest.json `
            -ExpectedPredecessorCommit "7ffc10ed84f67f2bd3b008d54aee9d7cda056f5e" `
            -ExpectedCandidateCommit "1d7468cda2cd2c8d6495d3e6df7fa23431812139" `
            -ProductVersion "0.4.11" `
            -InjectCandidateInstallFailure

      - name: Exercise explicit same-version uninstall install recovery drill
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-same-version-transition.ps1 `
            -PredecessorExePath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/AIJobPrintTerminalSetup.exe `
            -PredecessorMsiPath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/AIJobPrintAgent.msi `
            -PredecessorManifestPath apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/staging-manifest.json `
            -CandidateExePath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/AIJobPrintTerminalSetup.exe `
            -CandidateMsiPath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/AIJobPrintAgent.msi `
            -CandidateManifestPath apps/terminal-agent/installer/artifacts/exact-candidate/candidate/staging-manifest.json `
            -ExpectedPredecessorCommit "7ffc10ed84f67f2bd3b008d54aee9d7cda056f5e" `
            -ExpectedCandidateCommit "1d7468cda2cd2c8d6495d3e6df7fa23431812139" `
            -ProductVersion "0.4.11"

      - name: Verify frozen candidate identity after lifecycle
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/candidate-identity.ps1 `
            -Mode Verify `
            -CandidateRoot apps/terminal-agent/installer/artifacts/exact-candidate/candidate `
            -SourceCommit "1d7468cda2cd2c8d6495d3e6df7fa23431812139" `
            -ProductVersion "0.4.11"

      - name: Upload same-version transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-agent-same-version-transition-evidence
          path: |
            apps/terminal-agent/installer/artifacts/exact-candidate/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/exact-candidate/candidate/staging-manifest.json
            apps/terminal-agent/installer/artifacts/exact-candidate/candidate/same-version-lifecycle-logs/
            apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/candidate-identity.json
            apps/terminal-agent/installer/artifacts/exact-predecessor/candidate/staging-manifest.json
          if-no-files-found: warn
          retention-days: 7
