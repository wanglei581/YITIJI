name: windows-agent-installer

on:
  pull_request:
    paths:
      - "apps/terminal-agent/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-agent-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-msi-candidate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Enable locked pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Verify installer source contract
        shell: pwsh
        run: node apps/terminal-agent/installer/verify-installer-inputs.mjs

      - name: Build reproducible staging
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-staging.ps1

      - name: Verify staged secure scan reader boundary
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/verify-secure-scan-reader.ps1 -InstallRoot apps/terminal-agent/installer/artifacts/staging

      - name: Build unsigned WiX MSI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-msi.ps1

      - name: Build unsigned WiX Burn EXE
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/build-exe.ps1

      - name: Exercise EXE install, repair, and uninstall
        shell: powershell
        run: |
          $exe = Get-ChildItem apps/terminal-agent/installer/artifacts/exe -Filter AIJobPrintTerminalSetup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-exe-lifecycle.ps1 -ExePath $exe.FullName

      - name: Exercise MSI install, repair, and uninstall
        shell: powershell
        run: |
          $msi = Get-ChildItem apps/terminal-agent/installer/artifacts/msi -Filter *.msi | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/terminal-agent/installer/test-msi-lifecycle.ps1 -MsiPath $msi.FullName

      - name: Upload unsigned test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-agent-unsigned-installer-candidates
          path: |
            apps/terminal-agent/installer/artifacts/msi/*.msi
            apps/terminal-agent/installer/artifacts/msi/lifecycle-logs/
            apps/terminal-agent/installer/artifacts/exe/AIJobPrintTerminalSetup.exe
            apps/terminal-agent/installer/artifacts/exe/lifecycle-logs/
            apps/terminal-agent/installer/artifacts/staging/manifest.json
          if-no-files-found: warn
          retention-days: 7
