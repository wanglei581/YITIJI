name: Deploy Precheck (read-only)

# 发布前置核对：只回答「部署脚本的默认值与服务器实际是否一致」，不做任何写操作。
#
# 背景：deploy-api-release.sh 的顺序是
#   PG 全库备份 → 备份运行目录（回滚锚点）→ migrate → 构建 → PM2 重启 → 健康检查
# 若 DEPLOY_API_DIR / DEPLOY_PM2_NAME 与实际不符，回滚锚点会指向错误目录，
# 而 migrate 仍会执行 —— 数据库已改、锚点是假的。这是不可逆的组合，必须先核对。
#
# 当前 secret 中未配置 DEPLOY_API_DIR / DEPLOY_PM2_NAME，脚本会回退到默认值
#   /srv/ai-job-print  与  ai-job-print-api
# 本工作流即验证这两个默认值是否成立。
#
# 安全：仓库为 public，Actions 日志公开可读，
# 因此**只输出 yes/no 与数量级信息，不打印任何路径、进程名、版本串或环境变量**。

on:
  workflow_dispatch:

jobs:
  precheck:
    name: Verify deploy defaults match server
    if: github.ref_name != 'codex/recruitment-wave2-prod-admission-20260810'
    runs-on: ubuntu-latest
    steps:
      - name: Read-only probe via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 3m
          envs: EXPECT_DIR,EXPECT_PM2,EXPECT_BACKUP
          script: |
            set -uo pipefail

            echo "=== 1. 部署脚本默认的 API 目录是否存在 ==="
            if [ -d "$EXPECT_DIR" ]; then
              echo "API_DIR_DEFAULT_OK=yes"
            else
              echo "API_DIR_DEFAULT_OK=no  （需配置 secret DEPLOY_API_DIR）"
            fi

            echo "=== 2. 该目录下是否有 DEPLOY_SOURCE.txt（发布脚本依赖它做版本一致性校验）==="
            if [ -f "$EXPECT_DIR/DEPLOY_SOURCE.txt" ]; then
              echo "DEPLOY_SOURCE_PRESENT=yes"
            else
              echo "DEPLOY_SOURCE_PRESENT=no  （首次受控发布会创建）"
            fi

            echo "=== 3. 默认 PM2 进程名是否存在 ==="
            if command -v pm2 >/dev/null 2>&1; then
              echo "PM2_INSTALLED=yes"
              if pm2 jlist 2>/dev/null | grep -q "\"name\":\"$EXPECT_PM2\""; then
                echo "PM2_NAME_DEFAULT_OK=yes"
              else
                echo "PM2_NAME_DEFAULT_OK=no  （需配置 secret DEPLOY_PM2_NAME）"
                echo "PM2_PROCESS_COUNT=$(pm2 jlist 2>/dev/null | grep -o '"name":' | wc -l | tr -d ' ')"
              fi
            else
              echo "PM2_INSTALLED=no  （API 可能不是用 PM2 托管，需确认托管方式）"
            fi

            echo "=== 4. 备份盘可用空间（仅输出 GiB 数量级）==="
            BK_PARENT="$(dirname "$EXPECT_BACKUP")"
            AVAIL_GB="$(df -BG --output=avail "$BK_PARENT" 2>/dev/null | tail -n1 | tr -dc '0-9')"
            if [ -n "$AVAIL_GB" ]; then
              echo "BACKUP_DISK_AVAIL_GB=$AVAIL_GB"
            else
              echo "BACKUP_DISK_AVAIL_GB=unknown"
            fi

            echo "=== 5. API 健康检查端点当前是否可达（本机回环）==="
            if curl -fsS -m 5 http://127.0.0.1:3010/api/v1/health >/dev/null 2>&1; then
              echo "API_HEALTH_LOCAL=ok"
            else
              echo "API_HEALTH_LOCAL=unreachable  （端口或路径可能与默认不同）"
            fi

            echo "=== 6. 磁盘占用盘点（只输出数量级，用于判断清理目标）==="
            # 首轮探测发现备份盘仅剩 1 GiB。发布脚本第一步就是 PG 全库备份、
            # 第二步备份整个运行目录，空间不足会在备份阶段写满盘，
            # 波及正在运行的 API 与 PostgreSQL。故先盘点占用分布再决定清理。
            echo "ROOT_TOTAL_GB=$(df -BG --output=size / 2>/dev/null | tail -n1 | tr -dc '0-9')"
            echo "ROOT_USED_PCT=$(df --output=pcent / 2>/dev/null | tail -n1 | tr -dc '0-9')"

            if [ -d "$EXPECT_BACKUP" ]; then
              echo "BACKUP_ROOT_SIZE_MB=$(du -sm "$EXPECT_BACKUP" 2>/dev/null | cut -f1)"
              echo "BACKUP_FILE_COUNT=$(find "$EXPECT_BACKUP" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
              echo "BACKUP_DIR_COUNT=$(find "$EXPECT_BACKUP" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')"
              echo "BACKUP_OLDEST_DAYS=$(find "$EXPECT_BACKUP" -maxdepth 1 -mindepth 1 -printf '%T@\n' 2>/dev/null | sort -n | head -1 | awk '{print int((systime()-$1)/86400)}')"
            else
              echo "BACKUP_ROOT_EXISTS=no"
            fi

            echo "API_DIR_SIZE_MB=$(du -sm "$EXPECT_DIR" 2>/dev/null | cut -f1)"
            echo "API_NODE_MODULES_MB=$(du -sm "$EXPECT_DIR/node_modules" 2>/dev/null | cut -f1)"
            echo "PNPM_STORE_MB=$(du -sm ~/.local/share/pnpm/store 2>/dev/null | cut -f1)"
            echo "PM2_LOGS_MB=$(du -sm ~/.pm2/logs 2>/dev/null | cut -f1)"
            echo "NGINX_LOGS_MB=$(du -sm /var/log/nginx 2>/dev/null | cut -f1)"
            echo "JOURNAL_MB=$(journalctl --disk-usage 2>/dev/null | grep -o '[0-9.]*[MG]' | head -1)"

            echo "=== 7. 本次发布需要的空间量级 ==="
            echo "PG_DB_SIZE_MB=$(sudo -n -u postgres psql -tAc \"SELECT pg_database_size(current_database())/1024/1024;\" 2>/dev/null || echo 'unknown（无免密 sudo，可忽略）')"

            echo "=== 8. 发布后验证：#555 资金门禁启动告警是否出现在应用日志 ==="
            if pm2 logs "$EXPECT_PM2" --lines 200 --nostream 2>/dev/null | grep -q "PRINT_REQUIRE_PAID_BEFORE_CLAIM"; then
              echo "PAID_GATE_WARNING_PRESENT=yes"
            else
              echo "PAID_GATE_WARNING_PRESENT=no  （可能日志已轮转，或该版本未上线）"
            fi

            echo "=== 9. 发布后验证：#553 隐私门控审计动作是否已注册 ==="
            # 只查审计表里是否出现过该 action，不打印任何 payload
            CNT="$(sudo -n -u postgres psql -tAc \
              "SELECT count(*) FROM \"AuditLog\" WHERE action='print_job.pii_scan_bypassed';" 2>/dev/null || echo unknown)"
            echo "PII_BYPASS_AUDIT_ROWS=$CNT  （0 属正常：本次发布后尚无人建单）"

            echo "=== 10. 运行版本与 main 是否一致 ==="
            if [ -f "$EXPECT_DIR/DEPLOY_SOURCE.txt" ]; then
              echo "DEPLOY_SOURCE_SHA8=$(sed -n 's/^source=origin\/main@\([0-9a-f]\{8\}\).*/\1/p' "$EXPECT_DIR/DEPLOY_SOURCE.txt" | head -1)"
            fi
            echo "=== 完成：以上均为只读探测，未做任何修改 ==="
        env:
          EXPECT_DIR: /srv/ai-job-print
          EXPECT_PM2: ai-job-print-api
          EXPECT_BACKUP: /srv/ai-job-print-backups

  recruitment-wave2-provision:
    name: Provision dedicated recruitment Wave2 read-only role
    if: false # One-time production mutation completed in run 31384197497.
    runs-on: ubuntu-latest
    steps:
      - name: Create least-scope role and protected connection config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 3m
          envs: EXPECT_DIR,AUTHORIZED_UNTIL
          script: |
            set -euo pipefail

            # One-time, user-authorized production mutation. Credentials and dotenv
            # contents stay in server memory/files and are never printed.
            python3 - "$EXPECT_DIR" "$AUTHORIZED_UNTIL" <<'PY'
            import datetime
            import os
            import secrets
            import stat
            import subprocess
            import sys
            import tempfile
            from urllib.parse import parse_qs, quote, unquote, urlparse

            api_dir, authorized_until_raw = sys.argv[1:3]
            role = 'recruitment_wave2_readonly'
            config_key = 'RECRUITMENT_WAVE2_PRODUCTION_READONLY_URL'
            allowed_tables = [
                '_prisma_migrations', 'Organization', 'JobSource', 'Job', 'JobFair',
                'PolicyPost', 'OfflineAgency', 'OfflineJob', 'OnlinePlatformDirectory',
                'OfflineAgencyProfile', 'OfflineAgencyBranch', 'QualificationRecord',
                'ReviewDecision', 'AuditLog', 'FileObject',
            ]

            def fail(code: str):
                print('PROVISION_STATUS=failed')
                print('PROVISION_ERROR=' + code)
                raise SystemExit(1)

            def load_dotenv(path: str) -> tuple[dict[str, str], list[str]]:
                values: dict[str, str] = {}
                lines = open(path, encoding='utf-8').read().splitlines()
                for raw_line in lines:
                    line = raw_line.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    key, value = line.split('=', 1)
                    value = value.strip()
                    if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                        value = value[1:-1]
                    values[key.strip()] = value
                return values, lines

            def parse_postgres_url(value: str):
                parsed = urlparse(value)
                database = unquote(parsed.path.lstrip('/'))
                if parsed.scheme not in ('postgres', 'postgresql') or not parsed.hostname or not database or '/' in database:
                    fail('app_database_invalid')
                return parsed, database

            def identifier(value: str) -> str:
                return '"' + value.replace('"', '""') + '"'

            def literal(value: str) -> str:
                return "'" + value.replace("'", "''") + "'"

            def admin_psql(database: str, sql: str) -> str:
                result = subprocess.run(
                    ['sudo', '-n', '-u', 'postgres', 'psql', '-X', '-A', '-t',
                     '-v', 'ON_ERROR_STOP=1', '-d', database],
                    input=sql, text=True, capture_output=True, timeout=45, check=False,
                )
                if result.returncode != 0:
                    raise RuntimeError('admin_psql_failed')
                return result.stdout.strip()

            def readonly_psql(parsed, database: str, sql: str) -> str:
                pg_env = os.environ.copy()
                pg_env.update({
                    'PGHOST': parsed.hostname or '',
                    'PGPORT': str(parsed.port or 5432),
                    'PGUSER': unquote(parsed.username or ''),
                    'PGDATABASE': database,
                    'PGPASSWORD': unquote(parsed.password or ''),
                })
                sslmode = parse_qs(parsed.query).get('sslmode', [None])[0]
                if sslmode:
                    pg_env['PGSSLMODE'] = sslmode
                result = subprocess.run(
                    ['psql', '-X', '-A', '-t', '-F', '\t', '-v', 'ON_ERROR_STOP=1', '-c', sql],
                    env=pg_env, text=True, capture_output=True, timeout=45, check=False,
                )
                if result.returncode != 0:
                    raise RuntimeError('readonly_psql_failed')
                return result.stdout.strip()

            try:
                deadline = datetime.datetime.fromisoformat(authorized_until_raw.replace('Z', '+00:00'))
                now = datetime.datetime.now(datetime.timezone.utc)
                if deadline.tzinfo is None or now >= deadline or deadline - now > datetime.timedelta(hours=4):
                    fail('authorization_window_invalid')
            except ValueError:
                fail('authorization_window_invalid')

            candidates = [
                os.path.join(api_dir, '.env'),
                os.path.join(api_dir, 'services', 'api', '.env'),
            ]
            env_path = next((path for path in candidates if os.path.isfile(path)), None)
            if not env_path:
                fail('env_file_missing')
            env_stat = os.stat(env_path)
            if env_stat.st_uid != os.geteuid():
                fail('env_file_owner_mismatch')
            values, original_lines = load_dotenv(env_path)
            if values.get(config_key):
                fail('readonly_url_already_configured')
            app_parsed, database = parse_postgres_url(values.get('DATABASE_URL', ''))

            try:
                if admin_psql(database, f"SELECT EXISTS(SELECT 1 FROM pg_roles WHERE rolname={literal(role)});") == 't':
                    fail('readonly_role_already_exists')
            except RuntimeError:
                fail('postgres_admin_access_unavailable')

            password = secrets.token_urlsafe(48)
            host = app_parsed.hostname or ''
            host_text = f'[{host}]' if ':' in host else host
            port_text = f':{app_parsed.port}' if app_parsed.port else ''
            query_text = f'?{app_parsed.query}' if app_parsed.query else ''
            readonly_url = (
                f'postgresql://{quote(role, safe="")}:{quote(password, safe="")}@'
                f'{host_text}{port_text}/{quote(database, safe="")}{query_text}'
            )
            replacement = f'{config_key}="{readonly_url}"'
            updated_lines = [line for line in original_lines if not line.lstrip().startswith(config_key + '=')]
            updated_lines.append(replacement)
            temp_path = None
            role_created = False
            try:
                fd, temp_path = tempfile.mkstemp(prefix='.env.rw2-', dir=os.path.dirname(env_path), text=True)
                with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                    handle.write('\n'.join(updated_lines) + '\n')
                    handle.flush()
                    os.fsync(handle.fileno())
                os.chmod(temp_path, stat.S_IMODE(env_stat.st_mode) & 0o600 or 0o600)

                table_literals = ','.join(literal(table) for table in allowed_tables)
                table_identifiers = ','.join('public.' + identifier(table) for table in allowed_tables)
                sql = f"""
                BEGIN;
                CREATE ROLE {identifier(role)} LOGIN PASSWORD {literal(password)}
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
                ALTER ROLE {identifier(role)} SET default_transaction_read_only = on;
                ALTER ROLE {identifier(role)} SET statement_timeout = '15s';
                ALTER ROLE {identifier(role)} SET lock_timeout = '2s';
                ALTER ROLE {identifier(role)} SET idle_in_transaction_session_timeout = '5s';
                GRANT CONNECT ON DATABASE {identifier(database)} TO {identifier(role)};
                GRANT USAGE ON SCHEMA public TO {identifier(role)};
                GRANT SELECT ON TABLE {table_identifiers} TO {identifier(role)};
                DO $guard$
                BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname={literal(role)} AND
                    (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls))
                    OR has_database_privilege({literal(role)},current_database(),'CREATE')
                    OR has_schema_privilege({literal(role)},'public','CREATE')
                    OR EXISTS (SELECT 1 FROM pg_tables t WHERE t.schemaname='public' AND
                      (has_table_privilege({literal(role)},format('%I.%I',t.schemaname,t.tablename),'INSERT')
                       OR has_table_privilege({literal(role)},format('%I.%I',t.schemaname,t.tablename),'UPDATE')
                       OR has_table_privilege({literal(role)},format('%I.%I',t.schemaname,t.tablename),'DELETE')
                       OR has_table_privilege({literal(role)},format('%I.%I',t.schemaname,t.tablename),'TRUNCATE')))
                    OR EXISTS (SELECT 1 FROM pg_tables t WHERE t.schemaname='public'
                      AND t.tablename NOT IN ({table_literals})
                      AND has_any_column_privilege({literal(role)},format('%I.%I',t.schemaname,t.tablename),'SELECT'))
                    OR EXISTS (SELECT 1 FROM unnest(ARRAY[{table_literals}]) required(name)
                      WHERE NOT has_table_privilege({literal(role)},format('%I.%I','public',required.name),'SELECT'))
                  THEN RAISE EXCEPTION 'readonly_role_guard_failed'; END IF;
                END $guard$;
                COMMIT;
                """
                admin_psql(database, sql)
                role_created = True

                readonly_parsed, readonly_database = parse_postgres_url(readonly_url)
                verification = readonly_psql(readonly_parsed, readonly_database, """
                  SELECT current_database(),current_setting('default_transaction_read_only'),
                    NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                      AND NOT r.rolreplication AND NOT r.rolbypassrls,
                    NOT has_database_privilege(current_user,current_database(),'CREATE'),
                    NOT has_schema_privilege(current_user,'public','CREATE'),
                    NOT EXISTS (SELECT 1 FROM pg_tables t WHERE t.schemaname='public' AND
                      (has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'INSERT')
                       OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'UPDATE')
                       OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'DELETE')
                       OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'TRUNCATE')))
                  FROM pg_roles r WHERE r.rolname=current_user;
                """).split('\t')
                if len(verification) != 6 or verification[0] != database or verification[1] != 'on' \
                    or any(value != 't' for value in verification[2:]):
                    raise RuntimeError('readonly_verification_failed')

                os.replace(temp_path, env_path)
                temp_path = None
                try:
                    directory_fd = os.open(os.path.dirname(env_path), os.O_DIRECTORY)
                    try:
                        os.fsync(directory_fd)
                    finally:
                        os.close(directory_fd)
                except OSError:
                    # Rename already succeeded and the role is valid. Do not create a
                    # dangling config by compensating after this durability-only hint.
                    pass
            except Exception:
                if role_created:
                    try:
                        admin_psql(database, f'DROP OWNED BY {identifier(role)}; DROP ROLE {identifier(role)};')
                    except Exception:
                        fail('provision_failed_cleanup_required')
                fail('provision_transaction_failed')
            finally:
                if temp_path:
                    try:
                        os.unlink(temp_path)
                    except FileNotFoundError:
                        pass

            print('PROVISION_STATUS=created')
            print('PROVISION_ROLE_SCOPE=explicit_15_table_select_only')
            print('PROVISION_CONFIG_MODE=protected_atomic')
            PY
        env:
          EXPECT_DIR: /srv/ai-job-print
          AUTHORIZED_UNTIL: '2026-08-10T15:25:10Z'

  recruitment-wave2-admission:
    name: Recruitment Wave2 production read-only admission
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production read-only prerequisites
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 3m
          envs: EXPECT_DIR,EXPECT_PM2
          script: |
            set -euo pipefail

            # Public repository: never print URLs, credentials, database/role names,
            # PM2 environment JSON, or dotenv contents. This probe performs no writes.
            python3 - "$EXPECT_DIR" "$EXPECT_PM2" <<'PY'
            import hashlib
            import json
            import os
            import subprocess
            import sys
            from urllib.parse import parse_qs, unquote, urlparse

            api_dir, pm2_name = sys.argv[1:3]
            env_candidates = [
                ('root', os.path.join(api_dir, '.env')),
                ('api', os.path.join(api_dir, 'services', 'api', '.env')),
            ]
            present_envs = [(label, path) for label, path in env_candidates if os.path.isfile(path)]
            expected_readonly_role = 'recruitment_wave2_readonly'

            def load_dotenv(path: str) -> dict[str, str]:
                values: dict[str, str] = {}
                with open(path, encoding='utf-8') as handle:
                    for raw_line in handle:
                        line = raw_line.strip()
                        if not line or line.startswith('#') or '=' not in line:
                            continue
                        key, value = line.split('=', 1)
                        key = key.strip()
                        value = value.strip()
                        if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                            value = value[1:-1]
                        values[key] = value
                return values

            def parse_postgres_url(value: str):
                parsed = urlparse(value)
                if parsed.scheme not in ('postgres', 'postgresql') or not parsed.hostname:
                    raise ValueError('not-postgres')
                database = unquote(parsed.path.lstrip('/'))
                if not database or '/' in database:
                    raise ValueError('bad-database')
                return parsed, database

            def run_psql(parsed, database: str, sql: str) -> str:
                pg_env = os.environ.copy()
                pg_env.update({
                    'PGHOST': parsed.hostname or '',
                    'PGPORT': str(parsed.port or 5432),
                    'PGUSER': unquote(parsed.username or ''),
                    'PGDATABASE': database,
                    'PGPASSWORD': unquote(parsed.password or ''),
                })
                sslmode = parse_qs(parsed.query).get('sslmode', [None])[0]
                if sslmode:
                    pg_env['PGSSLMODE'] = sslmode
                result = subprocess.run(
                    ['psql', '-X', '-A', '-t', '-F', '\t', '-v', 'ON_ERROR_STOP=1', '-c', sql],
                    env=pg_env,
                    text=True,
                    capture_output=True,
                    timeout=30,
                    check=False,
                )
                if result.returncode != 0:
                    raise RuntimeError('psql-failed')
                return result.stdout.strip()

            if not present_envs:
                print('ADMISSION_ENV_FILE_PRESENT=no')
                raise SystemExit(1)

            # Root is the current release-script convention; the API-local file is
            # retained as the legacy runtime layout. Never print either path.
            env_layout, env_path = present_envs[0]
            print('ADMISSION_ENV_LAYOUT=' + ('root' if env_layout == 'root' else 'api'))

            values = load_dotenv(env_path)
            app_url = values.get('DATABASE_URL', '')
            try:
                app_parsed, app_database = parse_postgres_url(app_url)
            except ValueError:
                print('ADMISSION_APP_DATABASE=invalid')
                raise SystemExit(1)

            print('ADMISSION_APP_DATABASE=postgres')
            print('ADMISSION_DATABASE_ID_SHA256=' + hashlib.sha256(app_database.encode()).hexdigest())

            runtime_demo = None
            try:
                pm2 = subprocess.run(
                    ['pm2', 'jlist'], text=True, capture_output=True, timeout=15, check=False,
                )
                if pm2.returncode == 0:
                    for process in json.loads(pm2.stdout):
                        if process.get('name') == pm2_name:
                            runtime_demo = process.get('pm2_env', {}).get('EXCLUDE_DEMO_PUBLIC_DATA')
                            break
            except (FileNotFoundError, subprocess.SubprocessError, json.JSONDecodeError):
                runtime_demo = None
            raw_demo = runtime_demo if runtime_demo is not None else values.get('EXCLUDE_DEMO_PUBLIC_DATA')
            normalized_demo = 'false' if raw_demo is None else str(raw_demo).strip().lower()
            if normalized_demo not in ('true', 'false'):
                print('ADMISSION_DEMO_POLICY=invalid')
                raise SystemExit(1)
            print('ADMISSION_DEMO_POLICY=' + normalized_demo)

            readonly_url = values.get('RECRUITMENT_WAVE2_PRODUCTION_READONLY_URL', '')
            print('ADMISSION_READONLY_URL_CONFIGURED=' + ('yes' if readonly_url else 'no'))

            # A role may already exist even when its credential URL has not been provisioned.
            role_exists = 'unknown'
            try:
                role_exists_result = run_psql(
                    app_parsed,
                    app_database,
                    "SELECT EXISTS(SELECT 1 FROM pg_roles "
                    f"WHERE rolname='{expected_readonly_role}');",
                )
                role_exists = 'yes' if role_exists_result == 't' else 'no'
            except (RuntimeError, subprocess.SubprocessError):
                role_exists = 'unknown'
            print('ADMISSION_EXPECTED_ROLE_EXISTS=' + role_exists)

            if not readonly_url:
                print('ADMISSION_READY=no')
                print('ADMISSION_BLOCKER=readonly_url_missing')
                raise SystemExit(0)

            try:
                readonly_parsed, readonly_database = parse_postgres_url(readonly_url)
                if readonly_database != app_database:
                    raise ValueError('database-mismatch')
                required_tables = [
                    '_prisma_migrations', 'Organization', 'JobSource', 'Job', 'JobFair',
                    'PolicyPost', 'OfflineAgency', 'OfflineJob', 'OnlinePlatformDirectory',
                    'OfflineAgencyProfile', 'OfflineAgencyBranch', 'QualificationRecord',
                    'ReviewDecision', 'AuditLog', 'FileObject',
                ]
                quoted_tables = ','.join("'" + table.replace("'", "''") + "'" for table in required_tables)
                sql = f"""
                SELECT current_database(),
                  NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                    AND NOT r.rolreplication AND NOT r.rolbypassrls,
                  NOT has_schema_privilege(current_user,'public','CREATE'),
                  NOT has_database_privilege(current_user,current_database(),'CREATE'),
                  NOT EXISTS (
                    SELECT 1 FROM pg_tables t WHERE t.schemaname='public'
                    AND (has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'INSERT')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'UPDATE')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'DELETE')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'TRUNCATE'))),
                  NOT EXISTS (
                    SELECT 1 FROM unnest(ARRAY[{quoted_tables}]) AS required(name)
                    WHERE NOT has_table_privilege(current_user,format('%I.%I','public',required.name),'SELECT'))
                FROM pg_roles r WHERE r.rolname=current_user;
                """
                fields = run_psql(readonly_parsed, readonly_database, sql).split('\t')
                ready = len(fields) == 6 and fields[0] == app_database and all(value == 't' for value in fields[1:])
            except (ValueError, RuntimeError, subprocess.SubprocessError):
                ready = False

            print('ADMISSION_READY=' + ('yes' if ready else 'no'))
            if not ready:
                print('ADMISSION_BLOCKER=readonly_role_or_grants_invalid')
            PY
        env:
          EXPECT_DIR: /srv/ai-job-print
          EXPECT_PM2: ai-job-print-api

  recruitment-wave2-full-inventory:
    name: Capture full recruitment Wave2 production inventory
    needs: recruitment-wave2-admission
    runs-on: ubuntu-latest
    steps:
      - name: Run DB/API sandwich with protected evidence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 15m
          envs: EXPECT_DIR,EVIDENCE_ROOT,RUN_ID,SOURCE_COMMIT,SOURCE_DIGEST,AUTHORIZED_UNTIL
          script: |
            set -euo pipefail
            umask 077

            TMP_ROOT="$(mktemp -d "/tmp/rw2-full-${RUN_ID}-XXXXXX")"
            cleanup() {
              rm -rf -- "$TMP_ROOT"
            }
            trap cleanup EXIT HUP INT TERM

            python3 - "$AUTHORIZED_UNTIL" <<'PY'
            import datetime
            import sys
            deadline = datetime.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
            now = datetime.datetime.now(datetime.timezone.utc)
            if deadline.tzinfo is None or now >= deadline or deadline - now > datetime.timedelta(hours=4):
                raise SystemExit('AUTHORIZATION_WINDOW_INVALID')
            PY

            ARCHIVE="$TMP_ROOT/source.tar.gz"
            curl --proto '=https' --tlsv1.2 -fsSL --max-redirs 3 \
              --connect-timeout 10 --max-time 120 \
              "https://github.com/wanglei581/YITIJI/archive/${SOURCE_COMMIT}.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$TMP_ROOT"
            SRC_ROOT="$(find "$TMP_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'YITIJI-*' -print -quit)"
            test -n "$SRC_ROOT"

            CALCULATED_DIGEST="$(cd "$SRC_ROOT" && sha256sum \
              services/api/scripts/recruitment-wave2-full-inventory.ts \
              services/api/scripts/support/recruitment-wave2-full-inventory.ts \
              services/api/scripts/support/recruitment-wave2-public-snapshot.ts \
              services/api/scripts/support/recruitment-wave2-readonly-db.ts \
              services/api/src/recruitment-content/recruitment-wave2-target.ts \
              services/api/src/recruitment-content/recruitment-content-readiness.ts \
              | sha256sum | awk '{print $1}')"
            if [ "$CALCULATED_DIGEST" != "$SOURCE_DIGEST" ]; then
              echo "INVENTORY_ERROR=SOURCE_DIGEST_MISMATCH"
              exit 1
            fi
            test -d "$EXPECT_DIR/node_modules"
            ln -s "$EXPECT_DIR/node_modules" "$SRC_ROOT/node_modules"
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"

            ENV_PATH="$EXPECT_DIR/services/api/.env"
            test -f "$ENV_PATH"
            eval "$(python3 - "$ENV_PATH" <<'PY'
            import shlex
            import sys
            from urllib.parse import unquote, urlparse
            values = {}
            for raw in open(sys.argv[1], encoding='utf-8'):
                line = raw.strip()
                if not line or line.startswith('#') or '=' not in line:
                    continue
                key, value = line.split('=', 1)
                value = value.strip()
                if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                    value = value[1:-1]
                values[key.strip()] = value
            readonly_url = values.get('RECRUITMENT_WAVE2_PRODUCTION_READONLY_URL', '')
            parsed = urlparse(readonly_url)
            database = unquote(parsed.path.lstrip('/'))
            if parsed.scheme not in ('postgres', 'postgresql') or not parsed.hostname or not database or '/' in database:
                raise SystemExit('READONLY_URL_INVALID')
            print('RW2_URL=' + shlex.quote(readonly_url))
            print('RW2_DATABASE=' + shlex.quote(database))
            PY
            )"

            install -d -m 700 "$EVIDENCE_ROOT"
            REPORT_TMP="$TMP_ROOT/report.json"
            ERROR_TMP="$TMP_ROOT/error.json"
            unset DATABASE_URL DIRECT_URL POSTGRES_URL
            set +e
            (
              cd "$SRC_ROOT/services/api"
              RECRUITMENT_WAVE2_TARGET=authorized-readonly \
              RECRUITMENT_WAVE2_AUTHORIZATION_REF=AUTH/recruitment-wave2/prod-readonly-20260810-user-approved-002 \
              RECRUITMENT_WAVE2_AUTHORIZED_UNTIL="$AUTHORIZED_UNTIL" \
              RECRUITMENT_WAVE2_EXPECTED_DATABASE="$RW2_DATABASE" \
              RECRUITMENT_WAVE2_PRODUCTION_READONLY_URL="$RW2_URL" \
              RECRUITMENT_WAVE2_PUBLIC_API_BASE_URL=https://zyidai.cn/api/v1 \
              RECRUITMENT_WAVE2_EXPECTED_PUBLIC_API_ORIGIN=https://zyidai.cn \
              RECRUITMENT_WAVE2_EXPECTED_EXCLUDE_DEMO_PUBLIC_DATA=false \
              node -r @swc-node/register scripts/recruitment-wave2-full-inventory.ts \
              >"$REPORT_TMP" 2>"$ERROR_TMP"
            )
            CLI_STATUS=$?
            set -e

            if [ "$CLI_STATUS" -eq 1 ]; then
              python3 - "$ERROR_TMP" <<'PY'
            import json
            import sys
            code = 'RECRUITMENT_WAVE2_EXECUTION_FAILED'
            try:
                lines = [line for line in open(sys.argv[1], encoding='utf-8') if line.strip()]
                value = json.loads(lines[-1]) if lines else {}
                candidate = value.get('errorCode')
                if isinstance(candidate, str) and candidate.startswith('RECRUITMENT_WAVE2_'):
                    code = candidate
            except Exception:
                pass
            print('INVENTORY_RESULT=execution_failed')
            print('INVENTORY_ERROR_CODE=' + code)
            PY
              exit 1
            fi
            if [ "$CLI_STATUS" -ne 0 ] && [ "$CLI_STATUS" -ne 2 ]; then
              echo "INVENTORY_RESULT=unexpected_exit"
              exit 1
            fi

            EVIDENCE_TMP="$EVIDENCE_ROOT/.full-inventory-${RUN_ID}.tmp"
            EVIDENCE_FINAL="$EVIDENCE_ROOT/full-inventory-${RUN_ID}.json"
            test ! -e "$EVIDENCE_FINAL"
            install -m 600 "$REPORT_TMP" "$EVIDENCE_TMP"
            mv "$EVIDENCE_TMP" "$EVIDENCE_FINAL"
            REPORT_DIGEST="$(sha256sum "$EVIDENCE_FINAL" | awk '{print $1}')"

            python3 - "$EVIDENCE_FINAL" "$CLI_STATUS" "$REPORT_DIGEST" <<'PY'
            import json
            import re
            import sys
            report = json.load(open(sys.argv[1], encoding='utf-8'))
            status = int(sys.argv[2])
            print('INVENTORY_RESULT=' + ('pass' if status == 0 else 'business_blockers'))
            print('INVENTORY_CLI_EXIT=' + str(status))
            print('INVENTORY_REPORT_SHA256=' + sys.argv[3])
            print('INVENTORY_EVIDENCE_STORED=yes')
            print('INVENTORY_WAVE2_GO_DECISION=' + str(report.get('wave2GoDecision')).lower())
            for key, value in sorted(report.get('counts', {}).items()):
                safe = re.sub(r'[^A-Z0-9]+', '_', key.upper()).strip('_')
                print(f'COUNT_{safe}={int(value)}')
            issue_total = 0
            for key, value in sorted(report.get('issues', {}).items()):
                count = int(value.get('count', 0))
                issue_total += count
                if count:
                    safe = re.sub(r'[^A-Z0-9]+', '_', key.upper()).strip('_')
                    print(f'ISSUE_{safe}={count}')
            print('ISSUE_TOTAL_ITEMS=' + str(issue_total))
            diffs = report.get('sets', {}).get('currentReaderDiff', {})
            for entity, value in sorted(diffs.items()):
                safe = re.sub(r'[^A-Z0-9]+', '_', entity.upper()).strip('_')
                print(f'DIFF_{safe}_MISSING={int(value["missingFromApi"]["count"])}')
                print(f'DIFF_{safe}_UNEXPECTED={int(value["unexpectedInApi"]["count"])}')
            snapshots = report.get('snapshots', {})
            print('SNAPSHOT_DATABASE_STABLE=' + str(snapshots.get('databaseA') == snapshots.get('databaseB')).lower())
            print('SNAPSHOT_PUBLIC_API_STABLE=' + str(snapshots.get('publicApiA') == snapshots.get('publicApiB')).lower())
            PY
        env:
          EXPECT_DIR: /srv/ai-job-print
          EVIDENCE_ROOT: /srv/ai-job-print-backups/recruitment-wave2-evidence
          RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: b8369021177f95a9d76ca1d9130ad1afb249a720
          SOURCE_DIGEST: ed80f77c97aeb83f93023b77add08b5cd802d6dba5cef60a555ec0e2bf51ceb0
          AUTHORIZED_UNTIL: '2026-08-10T15:25:10Z'
