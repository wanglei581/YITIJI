name: Deploy Precheck (read-only)

# 发布前置核对：只回答「部署脚本的默认值与服务器实际是否一致」，不做任何写操作。
#
# 背景：deploy-api-release.sh 的顺序是
#   PG 全库备份 → 备份运行目录（回滚锚点）→ migrate → 构建 → PM2 重启 → 健康检查
# 若 DEPLOY_API_DIR / DEPLOY_PM2_NAME 与实际不符，回滚锚点会指向错误目录，
# 而 migrate 仍会执行 —— 数据库已改、锚点是假的。这是不可逆的组合，必须先核对。
#
# 当前 secret 中未配置 DEPLOY_API_DIR / DEPLOY_PM2_NAME，脚本会回退到默认值
#   /srv/ai-job-print  与  ai-job-print-api
# 本工作流即验证这两个默认值是否成立。
#
# 安全：仓库为 public，Actions 日志公开可读，
# 因此**只输出 yes/no 与数量级信息，不打印任何路径、进程名、版本串或环境变量**。

on:
  workflow_dispatch:

jobs:
  precheck:
    name: Verify deploy defaults match server
    runs-on: ubuntu-latest
    steps:
      - name: Read-only probe via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 3m
          envs: EXPECT_DIR,EXPECT_PM2,EXPECT_BACKUP
          script: |
            set -uo pipefail

            echo "=== 1. 部署脚本默认的 API 目录是否存在 ==="
            if [ -d "$EXPECT_DIR" ]; then
              echo "API_DIR_DEFAULT_OK=yes"
            else
              echo "API_DIR_DEFAULT_OK=no  （需配置 secret DEPLOY_API_DIR）"
            fi

            echo "=== 2. 该目录下是否有 DEPLOY_SOURCE.txt（发布脚本依赖它做版本一致性校验）==="
            if [ -f "$EXPECT_DIR/DEPLOY_SOURCE.txt" ]; then
              echo "DEPLOY_SOURCE_PRESENT=yes"
            else
              echo "DEPLOY_SOURCE_PRESENT=no  （首次受控发布会创建）"
            fi

            echo "=== 3. 默认 PM2 进程名是否存在 ==="
            if command -v pm2 >/dev/null 2>&1; then
              echo "PM2_INSTALLED=yes"
              if pm2 jlist 2>/dev/null | grep -q "\"name\":\"$EXPECT_PM2\""; then
                echo "PM2_NAME_DEFAULT_OK=yes"
              else
                echo "PM2_NAME_DEFAULT_OK=no  （需配置 secret DEPLOY_PM2_NAME）"
                echo "PM2_PROCESS_COUNT=$(pm2 jlist 2>/dev/null | grep -o '"name":' | wc -l | tr -d ' ')"
              fi
            else
              echo "PM2_INSTALLED=no  （API 可能不是用 PM2 托管，需确认托管方式）"
            fi

            echo "=== 4. 备份盘可用空间（仅输出 GiB 数量级）==="
            BK_PARENT="$(dirname "$EXPECT_BACKUP")"
            AVAIL_GB="$(df -BG --output=avail "$BK_PARENT" 2>/dev/null | tail -n1 | tr -dc '0-9')"
            if [ -n "$AVAIL_GB" ]; then
              echo "BACKUP_DISK_AVAIL_GB=$AVAIL_GB"
            else
              echo "BACKUP_DISK_AVAIL_GB=unknown"
            fi

            echo "=== 5. API 健康检查端点当前是否可达（本机回环）==="
            if curl -fsS -m 5 http://127.0.0.1:3010/api/v1/health >/dev/null 2>&1; then
              echo "API_HEALTH_LOCAL=ok"
            else
              echo "API_HEALTH_LOCAL=unreachable  （端口或路径可能与默认不同）"
            fi

            echo "=== 6. 磁盘占用盘点（只输出数量级，用于判断清理目标）==="
            # 首轮探测发现备份盘仅剩 1 GiB。发布脚本第一步就是 PG 全库备份、
            # 第二步备份整个运行目录，空间不足会在备份阶段写满盘，
            # 波及正在运行的 API 与 PostgreSQL。故先盘点占用分布再决定清理。
            echo "ROOT_TOTAL_GB=$(df -BG --output=size / 2>/dev/null | tail -n1 | tr -dc '0-9')"
            echo "ROOT_USED_PCT=$(df --output=pcent / 2>/dev/null | tail -n1 | tr -dc '0-9')"

            if [ -d "$EXPECT_BACKUP" ]; then
              echo "BACKUP_ROOT_SIZE_MB=$(du -sm "$EXPECT_BACKUP" 2>/dev/null | cut -f1)"
              echo "BACKUP_FILE_COUNT=$(find "$EXPECT_BACKUP" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
              echo "BACKUP_DIR_COUNT=$(find "$EXPECT_BACKUP" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')"
              echo "BACKUP_OLDEST_DAYS=$(find "$EXPECT_BACKUP" -maxdepth 1 -mindepth 1 -printf '%T@\n' 2>/dev/null | sort -n | head -1 | awk '{print int((systime()-$1)/86400)}')"
            else
              echo "BACKUP_ROOT_EXISTS=no"
            fi

            echo "API_DIR_SIZE_MB=$(du -sm "$EXPECT_DIR" 2>/dev/null | cut -f1)"
            echo "API_NODE_MODULES_MB=$(du -sm "$EXPECT_DIR/node_modules" 2>/dev/null | cut -f1)"
            echo "PNPM_STORE_MB=$(du -sm ~/.local/share/pnpm/store 2>/dev/null | cut -f1)"
            echo "PM2_LOGS_MB=$(du -sm ~/.pm2/logs 2>/dev/null | cut -f1)"
            echo "NGINX_LOGS_MB=$(du -sm /var/log/nginx 2>/dev/null | cut -f1)"
            echo "JOURNAL_MB=$(journalctl --disk-usage 2>/dev/null | grep -o '[0-9.]*[MG]' | head -1)"

            echo "=== 7. 本次发布需要的空间量级 ==="
            echo "PG_DB_SIZE_MB=$(sudo -n -u postgres psql -tAc \"SELECT pg_database_size(current_database())/1024/1024;\" 2>/dev/null || echo 'unknown（无免密 sudo，可忽略）')"

            echo "=== 8. 发布后验证：#555 资金门禁启动告警是否出现在应用日志 ==="
            if pm2 logs "$EXPECT_PM2" --lines 200 --nostream 2>/dev/null | grep -q "PRINT_REQUIRE_PAID_BEFORE_CLAIM"; then
              echo "PAID_GATE_WARNING_PRESENT=yes"
            else
              echo "PAID_GATE_WARNING_PRESENT=no  （可能日志已轮转，或该版本未上线）"
            fi

            echo "=== 9. 发布后验证：#553 隐私门控审计动作是否已注册 ==="
            # 只查审计表里是否出现过该 action，不打印任何 payload
            CNT="$(sudo -n -u postgres psql -tAc \
              "SELECT count(*) FROM \"AuditLog\" WHERE action='print_job.pii_scan_bypassed';" 2>/dev/null || echo unknown)"
            echo "PII_BYPASS_AUDIT_ROWS=$CNT  （0 属正常：本次发布后尚无人建单）"

            echo "=== 10. 运行版本与 main 是否一致 ==="
            if [ -f "$EXPECT_DIR/DEPLOY_SOURCE.txt" ]; then
              echo "DEPLOY_SOURCE_SHA8=$(sed -n 's/^source=origin\/main@\([0-9a-f]\{8\}\).*/\1/p' "$EXPECT_DIR/DEPLOY_SOURCE.txt" | head -1)"
            fi
            echo "=== 完成：以上均为只读探测，未做任何修改 ==="
        env:
          EXPECT_DIR: /srv/ai-job-print
          EXPECT_PM2: ai-job-print-api
          EXPECT_BACKUP: /srv/ai-job-print-backups

  recruitment-wave2-admission:
    name: Recruitment Wave2 production read-only admission
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production read-only prerequisites
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 3m
          envs: EXPECT_DIR,EXPECT_PM2
          script: |
            set -euo pipefail

            # Public repository: never print URLs, credentials, database/role names,
            # PM2 environment JSON, or dotenv contents. This probe performs no writes.
            python3 - "$EXPECT_DIR" "$EXPECT_PM2" <<'PY'
            import hashlib
            import json
            import os
            import subprocess
            import sys
            from urllib.parse import parse_qs, unquote, urlparse

            api_dir, pm2_name = sys.argv[1:3]
            env_path = os.path.join(api_dir, '.env')
            expected_readonly_role = 'recruitment_wave2_readonly'

            def load_dotenv(path: str) -> dict[str, str]:
                values: dict[str, str] = {}
                with open(path, encoding='utf-8') as handle:
                    for raw_line in handle:
                        line = raw_line.strip()
                        if not line or line.startswith('#') or '=' not in line:
                            continue
                        key, value = line.split('=', 1)
                        key = key.strip()
                        value = value.strip()
                        if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                            value = value[1:-1]
                        values[key] = value
                return values

            def parse_postgres_url(value: str):
                parsed = urlparse(value)
                if parsed.scheme not in ('postgres', 'postgresql') or not parsed.hostname:
                    raise ValueError('not-postgres')
                database = unquote(parsed.path.lstrip('/'))
                if not database or '/' in database:
                    raise ValueError('bad-database')
                return parsed, database

            def run_psql(parsed, database: str, sql: str) -> str:
                pg_env = os.environ.copy()
                pg_env.update({
                    'PGHOST': parsed.hostname or '',
                    'PGPORT': str(parsed.port or 5432),
                    'PGUSER': unquote(parsed.username or ''),
                    'PGDATABASE': database,
                    'PGPASSWORD': unquote(parsed.password or ''),
                })
                sslmode = parse_qs(parsed.query).get('sslmode', [None])[0]
                if sslmode:
                    pg_env['PGSSLMODE'] = sslmode
                result = subprocess.run(
                    ['psql', '-X', '-A', '-t', '-F', '\t', '-v', 'ON_ERROR_STOP=1', '-c', sql],
                    env=pg_env,
                    text=True,
                    capture_output=True,
                    timeout=30,
                    check=False,
                )
                if result.returncode != 0:
                    raise RuntimeError('psql-failed')
                return result.stdout.strip()

            if not os.path.isfile(env_path):
                print('ADMISSION_ENV_FILE_PRESENT=no')
                raise SystemExit(1)

            values = load_dotenv(env_path)
            app_url = values.get('DATABASE_URL', '')
            try:
                _, app_database = parse_postgres_url(app_url)
            except ValueError:
                print('ADMISSION_APP_DATABASE=invalid')
                raise SystemExit(1)

            print('ADMISSION_APP_DATABASE=postgres')
            print('ADMISSION_DATABASE_ID_SHA256=' + hashlib.sha256(app_database.encode()).hexdigest())

            runtime_demo = None
            try:
                pm2 = subprocess.run(
                    ['pm2', 'jlist'], text=True, capture_output=True, timeout=15, check=False,
                )
                if pm2.returncode == 0:
                    for process in json.loads(pm2.stdout):
                        if process.get('name') == pm2_name:
                            runtime_demo = process.get('pm2_env', {}).get('EXCLUDE_DEMO_PUBLIC_DATA')
                            break
            except (FileNotFoundError, subprocess.SubprocessError, json.JSONDecodeError):
                runtime_demo = None
            raw_demo = runtime_demo if runtime_demo is not None else values.get('EXCLUDE_DEMO_PUBLIC_DATA')
            normalized_demo = 'false' if raw_demo is None else str(raw_demo).strip().lower()
            if normalized_demo not in ('true', 'false'):
                print('ADMISSION_DEMO_POLICY=invalid')
                raise SystemExit(1)
            print('ADMISSION_DEMO_POLICY=' + normalized_demo)

            readonly_url = values.get('RECRUITMENT_WAVE2_PRODUCTION_READONLY_URL', '')
            print('ADMISSION_READONLY_URL_CONFIGURED=' + ('yes' if readonly_url else 'no'))

            # A role may already exist even when its credential URL has not been provisioned.
            role_exists = 'unknown'
            try:
                result = subprocess.run(
                    [
                        'sudo', '-n', '-u', 'postgres', 'psql', '-X', '-A', '-t',
                        '-d', app_database, '-v', 'ON_ERROR_STOP=1', '-v',
                        f'candidate={expected_readonly_role}', '-c',
                        "SELECT EXISTS(SELECT 1 FROM pg_roles WHERE rolname=:'candidate');",
                    ],
                    text=True,
                    capture_output=True,
                    timeout=30,
                    check=False,
                )
                if result.returncode == 0:
                    role_exists = 'yes' if result.stdout.strip() == 't' else 'no'
            except (FileNotFoundError, subprocess.SubprocessError):
                role_exists = 'unknown'
            print('ADMISSION_EXPECTED_ROLE_EXISTS=' + role_exists)

            if not readonly_url:
                print('ADMISSION_READY=no')
                print('ADMISSION_BLOCKER=readonly_url_missing')
                raise SystemExit(0)

            try:
                readonly_parsed, readonly_database = parse_postgres_url(readonly_url)
                if readonly_database != app_database:
                    raise ValueError('database-mismatch')
                required_tables = [
                    '_prisma_migrations', 'Organization', 'JobSource', 'Job', 'JobFair',
                    'PolicyPost', 'OfflineAgency', 'OfflineJob', 'OnlinePlatformDirectory',
                    'OfflineAgencyProfile', 'OfflineAgencyBranch', 'QualificationRecord',
                    'ReviewDecision', 'AuditLog', 'FileObject',
                ]
                quoted_tables = ','.join("'" + table.replace("'", "''") + "'" for table in required_tables)
                sql = f"""
                SELECT current_database(),
                  NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                    AND NOT r.rolreplication AND NOT r.rolbypassrls,
                  NOT has_schema_privilege(current_user,'public','CREATE'),
                  NOT has_database_privilege(current_user,current_database(),'CREATE'),
                  NOT EXISTS (
                    SELECT 1 FROM pg_tables t WHERE t.schemaname='public'
                    AND (has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'INSERT')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'UPDATE')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'DELETE')
                      OR has_table_privilege(current_user,format('%I.%I',t.schemaname,t.tablename),'TRUNCATE'))),
                  NOT EXISTS (
                    SELECT 1 FROM unnest(ARRAY[{quoted_tables}]) AS required(name)
                    WHERE NOT has_table_privilege(current_user,format('%I.%I','public',required.name),'SELECT'))
                FROM pg_roles r WHERE r.rolname=current_user;
                """
                fields = run_psql(readonly_parsed, readonly_database, sql).split('\t')
                ready = len(fields) == 6 and fields[0] == app_database and all(value == 't' for value in fields[1:])
            except (ValueError, RuntimeError, subprocess.SubprocessError):
                ready = False

            print('ADMISSION_READY=' + ('yes' if ready else 'no'))
            if not ready:
                print('ADMISSION_BLOCKER=readonly_role_or_grants_invalid')
            PY
        env:
          EXPECT_DIR: /srv/ai-job-print
          EXPECT_PM2: ai-job-print-api
