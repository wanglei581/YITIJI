name: Deploy Precheck (read-only)

# 发布前置核对：只回答「部署脚本的默认值与服务器实际是否一致」，不做任何写操作。
#
# 背景：deploy-api-release.sh 的顺序是
#   PG 全库备份 → 备份运行目录（回滚锚点）→ migrate → 构建 → PM2 重启 → 健康检查
# 若 DEPLOY_API_DIR / DEPLOY_PM2_NAME 与实际不符，回滚锚点会指向错误目录，
# 而 migrate 仍会执行 —— 数据库已改、锚点是假的。这是不可逆的组合，必须先核对。
#
# 当前 secret 中未配置 DEPLOY_API_DIR / DEPLOY_PM2_NAME，脚本会回退到默认值
#   /srv/ai-job-print  与  ai-job-print-api
# 本工作流即验证这两个默认值是否成立。
#
# 远端脚本在 .github/scripts/deploy-precheck.sh。Runner 读仓库文件后送到远端执行，
# 远端不再写临时脚本。dry-run（本工作流本身就是只读）因此零写入。
# 允许输出：yes/no、数量、日期、版本号、证书目录名、白名单内终端编号、
# 点名的残留目录名、内存数字、/srv 下两级目录名、/root 合计 MB。
# 禁止输出：文件名、来源地址、请求内容、密钥、环境变量、启动参数、进程命令行、
# nginx -T、pm2 jlist、访问日志原文、/root 下的文件名。

on:
  workflow_dispatch:

jobs:
  precheck:
    name: Verify deploy defaults match server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout precheck script
        uses: actions/checkout@v4

      - name: Read-only probe via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECT_DIR: /srv/ai-job-print
          EXPECT_PM2: ai-job-print-api
          EXPECT_BACKUP: /srv/ai-job-print-backups
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          # du -xsm /* 在根分区上要几分钟，3m 会把整个探测截断（2026-08-17 实测两次）
          command_timeout: 20m
          envs: EXPECT_DIR,EXPECT_PM2,EXPECT_BACKUP
          script_path: .github/scripts/deploy-precheck.sh
