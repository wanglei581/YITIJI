name: Server Cleanup (backups / pnpm store / journal)

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

# 服务器磁盘清理。默认 dry-run，只列清单不删任何东西。
#
# 背景：根分区 40GB 已用 100%，可用仅 1GiB。占用分布（只读探测所得）：
#   /srv/ai-job-print-backups  8656 MB（20 文件 + 16 目录，最旧 37 天）← 主因
#   pnpm store                 2704 MB
#   journal                     983 MB
#   API 目录                   1083 MB（其中 node_modules 992 MB，不动）
#
# 不能在满盘状态下发布：deploy-api-release.sh 第一步 PG 全库备份、
# 第二步备份整个运行目录（约 1GB），空间不足会在备份阶段写满盘，
# 波及正在运行的 API 与 PostgreSQL。
#
# 安全设计：
#   · dry_run 默认 true，必须显式传 false 才真删
#   · 备份按「保留最近 N 份发布」清理，N 默认 3，且**永不删最新的一份**
#   · 只操作 /srv/ai-job-print-backups，路径写死，不接受外部输入
#   · 仓库为 public、Actions 日志公开 —— 只输出序号/大小/天数，不打印完整路径与文件名

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只列清单不删除（强烈建议先跑一次 true）'
        type: boolean
        default: true
      keep:
        description: '备份保留最近几份发布'
        type: string
        default: '3'
      prune_pnpm:
        description: '同时执行 pnpm store prune（只删无引用包，安全）'
        type: boolean
        default: true
      vacuum_journal:
        description: '同时把 journal 压到 200M'
        type: boolean
        default: true

jobs:
  cleanup:
    name: Reclaim disk space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed cleanup script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Copy reviewed retention script
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: .github/scripts/deploy-backup-retention.sh
          target: /tmp/ai-job-print-cleanup-${{ github.sha }}
          strip_components: 2

      - name: Run cleanup via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP: ${{ inputs.keep }}
          PRUNE_PNPM: ${{ inputs.prune_pnpm }}
          VACUUM_JOURNAL: ${{ inputs.vacuum_journal }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          command_timeout: 15m
          envs: DRY_RUN,KEEP,PRUNE_PNPM,VACUUM_JOURNAL
          script: |
            set -euo pipefail
            command -v flock >/dev/null 2>&1 || { echo "::error::flock is required"; exit 1; }
            exec 9>/var/lock/ai-job-print-production-maintenance.lock
            flock -n 9 || { echo "::error::another production maintenance operation is active"; exit 1; }
            BK=/srv/ai-job-print-backups
            RUNTIME_ROOT=/srv/ai-job-print
            RETENTION_SCRIPT=/tmp/ai-job-print-cleanup-${{ github.sha }}/deploy-backup-retention.sh

            case "$DRY_RUN" in true | false) ;; *) echo "::error::dry_run must be true or false"; exit 1;; esac
            case "$KEEP" in '' | *[!0-9]*) echo "::error::keep must be a positive integer"; exit 1;; esac
            if [ "$KEEP" -lt 1 ]; then echo "::error::keep must be at least 1"; exit 1; fi
            case "$PRUNE_PNPM" in true | false) ;; *) echo "::error::prune_pnpm must be true or false"; exit 1;; esac
            case "$VACUUM_JOURNAL" in true | false) ;; *) echo "::error::vacuum_journal must be true or false"; exit 1;; esac
            if [ ! -f "$RETENTION_SCRIPT" ] || [ -L "$RETENTION_SCRIPT" ]; then
              echo "::error::reviewed retention script is missing"; exit 1
            fi

            echo "=== 清理前 ==="
            echo "ROOT_USED_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')"
            echo "ROOT_AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

            if [ ! -d "$BK" ]; then
              echo "::error::备份目录不存在，中止（不在未知路径上执行删除）"; exit 1
            fi

            echo "=== 精确备份保留计划 ==="
            BACKUP_ROOT="$BK" \
              BACKUP_ROOT_EXPECTED="$BK" \
              DEPLOY_SOURCE_FILE="$RUNTIME_ROOT/DEPLOY_SOURCE.txt" \
              DEPLOY_BACKUP_KEEP="$KEEP" \
              DEPLOY_BACKUP_DRY_RUN="$DRY_RUN" \
              bash "$RETENTION_SCRIPT"

            if [ "$PRUNE_PNPM" = "true" ] && [ "$DRY_RUN" != "true" ]; then
              echo "=== pnpm store prune（只删无引用包）==="
              pnpm store prune 2>&1 | tail -3 || echo "  pnpm 不可用，跳过"
            fi

            if [ "$VACUUM_JOURNAL" = "true" ] && [ "$DRY_RUN" != "true" ]; then
              echo "=== journal 压缩到 200M ==="
              journalctl --vacuum-size=200M 2>&1 | tail -2 || echo "  journalctl 不可用，跳过"
            fi

            echo "=== 清理后 ==="
            echo "ROOT_USED_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')"
            echo "ROOT_AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "BACKUP_ROOT_SIZE_MB=$(du -sm "$BK" 2>/dev/null | cut -f1)"

      - name: Remove transferred script
        if: always()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            rm -f -- /tmp/ai-job-print-cleanup-${{ github.sha }}/deploy-backup-retention.sh
            rmdir -- /tmp/ai-job-print-cleanup-${{ github.sha }} 2>/dev/null || true
